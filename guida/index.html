:root{
  --carta:#F6F2E8; --carta-2:#EFE9DB; --foglio:#FFFFFF; --riga:#E3DCCB; --riga-2:#D5CCB6;
  --inchiostro:#101631; --inchiostro-2:#3F455E; --inchiostro-3:#6D7186;
  --navy:#0A0F24; --navy-2:#141B3C; --navy-3:#20284E;
  --oro:#A67C2E; --oro-chiaro:#C9A24B; --oro-vivo:#E3C271; --oro-velo:#F4E9CF;
  --avorio:#F5F1E6; --avorio-2:#D8D2C2;
  --display:"Mazzard","Arial Black","Helvetica Neue",Arial,sans-serif;
  --testo:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px}
body{margin:0;background:var(--carta);color:var(--inchiostro);font:400 17px/1.6 var(--testo)}
a{color:var(--oro);text-underline-offset:3px}
b,strong{font-weight:700;color:var(--inchiostro)}
:focus-visible{outline:3px solid var(--oro-chiaro);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.dentro{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}

/* ── testata: la domanda ── */
.testata{background:var(--navy);color:var(--avorio);padding-block:18px 30px}
.barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.barra a{font:700 13px/1 var(--testo);text-decoration:none;border:1px solid rgba(245,241,230,.2);padding:9px 14px;border-radius:999px;color:var(--avorio-2)}
.barra a:hover{border-color:var(--oro-chiaro);color:var(--avorio)}
.barra a.on{background:var(--oro-chiaro);border-color:var(--oro-chiaro);color:var(--navy)}
.barra .lingua{margin-left:auto}
.firma{margin-top:34px;font:700 11px/1 var(--testo);letter-spacing:.28em;text-transform:uppercase;color:var(--oro-chiaro)}
.testata h1{margin-top:10px;font-size:clamp(34px,6vw,58px);line-height:1;text-transform:uppercase;color:var(--oro-vivo)}
.campo{position:relative;margin-top:22px;max-width:820px}
.campo svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--oro-chiaro);pointer-events:none}
.campo input{width:100%;height:62px;border-radius:14px;border:1.5px solid rgba(245,241,230,.22);background:rgba(245,241,230,.07);color:var(--avorio);font:500 19px/1 var(--testo);padding:0 52px 0 56px}
.campo input::placeholder{color:rgba(216,210,194,.62)}
.campo input:focus{outline:none;border-color:var(--oro-chiaro);background:rgba(245,241,230,.1)}
.campo button{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--avorio-2);font-size:22px;cursor:pointer;padding:6px 10px}
.esempi{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--avorio-2)}
.esempi button{border:1px solid rgba(245,241,230,.18);background:none;color:var(--avorio);font:500 14px/1 var(--testo);padding:8px 12px;border-radius:999px;cursor:pointer}
.esempi button:hover{border-color:var(--oro-chiaro)}
.ruoli{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.ruoli button{border:1px solid rgba(245,241,230,.2);background:none;color:var(--avorio-2);font:700 14px/1 var(--testo);padding:11px 16px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.ruoli button small{font-weight:500;opacity:.7}
.ruoli button:hover{color:var(--avorio);border-color:rgba(201,162,75,.6)}
.ruoli button[aria-pressed="true"]{background:var(--avorio);border-color:var(--avorio);color:var(--navy)}

/* ── elenco dei compiti ── */
main{padding-block:34px 90px}
.gruppo{margin-top:40px}
.gruppo:first-child{margin-top:0}
.g-testa{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--riga);padding-bottom:10px}
.g-testa h2{font-size:24px;text-transform:uppercase;letter-spacing:.005em}
.g-testa p{color:var(--inchiostro-3);font-size:15px}
.g-testa .fatti{margin-left:auto;font-size:13px;color:var(--inchiostro-3);white-space:nowrap}
.compiti{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
.carta{appearance:none;text-align:left;border:1px solid var(--riga);background:var(--foglio);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;color:inherit;font:inherit;transition:border-color .15s,transform .15s}
.carta:hover{border-color:var(--oro-chiaro);transform:translateY(-2px)}
.carta .img{position:relative;aspect-ratio:16/9;background:var(--navy) center/cover no-repeat;display:grid;place-items:center}

.compito{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start}

details{background:var(--foglio);border:1px solid var(--riga);border-radius:14px}

  const prima = BYID[vicini[i - 1]], dopo = BYID[vicini[i + 1]];
  const lento = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const video = l.video ? '<video id="vid" src="' + esc(l.video) + '" poster="' + esc(l.poster || "") + '" muted loop playsinline controls preload="metadata"' + (lento ? "" : " autoplay") + '></video>' +
      '<div class="sotto"><span>' + esc(U.videoEti.replace("{d}", dur(l.dur))) + "</span>" + [0.5, 0.75, 1].map(v => '<button type="button" data-vel="' + v + '" aria-pressed="' + (v === 1) + '">' + (v === 1 ? esc(U.normale) : v + "×") + "</button>").join("") + "</div>"
    : '<div class="senza">' + esc(U.senzaVideo) + "</div>";
  $("#uno").innerHTML = '<button type="button" class="indietro" data-fa="indietro">← ' + esc(U.tutti) + '</button><div class="compito"><div>' +
    '<div class="c-dove">' + esc(g ? g.nome : "") + "</div><h2>" + esc(l.titolo) + '</h2><p class="imp">' + esc(U.impari) + " <b>" + l.impari + "</b></p>" +
    '<ol class="passi">' + l.passi.map(p => "<li><span>" + p + "</span></li>").join("") + "</ol>" + (l.nota ? '<p class="nota"><b>' + esc(U.daSapere) + "</b> " + l.nota + "</p>" : "") +
    '<div class="azioni">' + (l.palestra ? '<a class="btn oro" href="' + esc(l.palestra) + '">' + esc(U.falloAdesso) + "</a>" : "") + '<a class="btn chiaro" href="' + esc(l.apriUrl) + '" target="_blank" rel="noopener">' + esc(U.apriPagina) + " ↗</a>" +
    '<label class="fatto"><input type="checkbox" id="fatto"' + (FATTI.has(id) ? " checked" : "") + "> " + esc(U.loSo) + "</label></div></div>" +
    '<div class="schermo">' + video + "</div>" +
    '<nav class="vicini" aria-label="' + esc(U.vicini) + '">' + (prima ? '<button type="button" data-id="' + prima.id + '"><small>← ' + esc(U.prima) + "</small><b>" + esc(prima.titolo) + "</b></button>" : "<span></span>") +
    (dopo ? '<button type="button" class="dopo" data-id="' + dopo.id + '"><small>' + esc(U.dopo) + " →</small><b>" + esc(dopo.titolo) + "</b></button>" : "") + "</nav></div>";
  $("#elenco").hidden = true; $("#fondo").hidden = true; $("#uno").hidden = false;
  const v = $("#vid");
  if (v) {
    document.querySelectorAll("[data-vel]").forEach(b => b.addEventListener("click", () => { v.playbackRate = +b.dataset.vel; document.querySelectorAll("[data-vel]").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
    v.addEventListener("ended", segna);
  }
  $("#fatto").addEventListener("change", e => { e.target.checked ? FATTI.add(id) : FATTI.delete(id); scrivi("guida-fatti" + DATI.suff, [...FATTI]); });
  function segna() { if (!FATTI.has(id)) { FATTI.add(id); scrivi("guida-fatti" + DATI.suff, [...FATTI]); $("#fatto").checked = true; } }
  if (location.hash !== "#" + id) history[daClic ? "pushState" : "replaceState"](null, "", "#" + id);
  window.scrollTo(0, $("#uno").getBoundingClientRect().top + scrollY - 20);
  document.title = l.titolo + " · " + DATI.titolo;
}
function chiudi(daClic) {
  $("#uno").hidden = true; $("#uno").innerHTML = ""; $("#elenco").hidden = false; $("#fondo").hidden = false; disegnaElenco();
  document.title = DATI.titolo;
  if (location.hash && daClic) history.pushState(null, "", location.pathname + location.search);
}

document.addEventListener("click", e => {
  let b;
  if ((b = e.target.closest("[data-id]"))) { e.preventDefault(); apri(b.dataset.id, true); return; }
  if ((b = e.target.closest("[data-fa='indietro']"))) { chiudi(true); return; }
  if ((b = e.target.closest("[data-r]"))) { RUOLO = b.dataset.r; document.querySelectorAll("[data-r]").forEach(x => x.setAttribute("aria-pressed", x === b)); if (!$("#uno").hidden) chiudi(true); else disegnaElenco(); return; }
  if ((b = e.target.closest("[data-es]"))) { $("#q").value = b.dataset.es; if (!$("#uno").hidden) chiudi(true); else disegnaElenco(); $("#q").focus(); return; }
});
$("#q").addEventListener("input", () => { if (!$("#uno").hidden) chiudi(true); else disegnaElenco(); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { const c = document.querySelector("#elenco .carta"); if (c && norm($("#q").value)) apri(c.dataset.id, true); } if (e.key === "Escape") { $("#q").value = ""; disegnaElenco(); } });
$("#qx").addEventListener("click", () => { $("#q").value = ""; disegnaElenco(); $("#q").focus(); });
window.addEventListener("popstate", () => { const id = location.hash.slice(1); if (BYID[id]) apri(id); else chiudi(); });

// in fondo: tasti, parole, problemi, a chi chiedere
const tasti = a => a.map(t => '<div class="tasto"><kbd>' + t[0] + "</kbd><span>" + t[1] + "</span></div>").join("");
$("#fondo").innerHTML =
  "<details><summary>" + esc(U.tastiTitolo) + '</summary><div class="dentro-d"><div class="tasti"><h4>MAM</h4>' + tasti(DATI.tastiMam) + "<h4>Editing</h4>" + tasti(DATI.tastiEdit) + '</div><p class="nota" style="margin-top:14px">' + U.tastiNota + "</p></div></details>" +
  "<details><summary>" + esc(U.paroleTitolo) + '</summary><div class="dentro-d"><div class="parole">' + DATI.parole.map(p => "<div><b>" + p[0] + "</b>" + p[1] + "</div>").join("") + "</div></div></details>" +
  "<details><summary>" + esc(U.problemiTitolo) + '</summary><div class="dentro-d"><div class="problemi">' + DATI.problemi.map(p => "<div><b>" + p[0] + "</b>" + p[1] + "</div>").join("") + "</div></div></details>";

const primo = location.hash.slice(1);
if (BYID[primo]) apri(primo); else disegnaElenco();
</script>

</body>
