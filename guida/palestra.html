<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra Como TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<style>
@font-face{font-family:"Mazzard";src:url("../assets/fonts/MazzardM-ExtraBold.ttf") format("truetype");font-weight:800;font-display:swap}
:root{--carta:#F6F2E8;--carta-2:#EFE9DB;--foglio:#FFFFFF;--riga:#E3DCCB;--riga-2:#D5CCB6;
  --inchiostro:#101631;--inchiostro-2:#3F455E;--inchiostro-3:#6D7186;
  --navy:#0A0F24;--oro:#A67C2E;--oro-chiaro:#C9A24B;--oro-velo:#F4E9CF;--verde:#2F7D55;--verde-velo:#E4F2EA;
  --display:"Mazzard","Arial Black","Helvetica Neue",Arial,sans-serif;--testo:"DM Sans",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--carta);color:var(--inchiostro);font:500 17px/1.5 var(--testo)}
a{color:inherit}
:focus-visible{outline:3px solid var(--oro-chiaro);outline-offset:3px;border-radius:10px}
.testata{background:var(--navy);color:#F5F1E6}
.testata .dentro{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:18px 26px;display:grid;gap:14px}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.barra a{font:700 14px/1 var(--testo);text-decoration:none;border:1px solid rgba(245,241,230,.2);padding:9px 14px;border-radius:999px;color:#D8D2C2}
.barra a:hover{border-color:var(--oro-chiaro)}
.barra a.on{background:#C9A24B;border-color:#C9A24B;color:#0A0F24}
.barra .punti{margin-left:auto;font:700 14px/1 var(--testo);background:rgba(245,241,230,.1);padding:9px 14px;border-radius:999px}
.barra .punti b{color:#E3C271}
h1{font:800 clamp(40px,7vw,64px)/.95 var(--display);text-transform:uppercase;margin:0;color:#E3C271;letter-spacing:-.01em}
.come{display:flex;flex-wrap:wrap;gap:10px 26px;font-size:17px;color:#D8D2C2}
.come span{display:flex;align-items:center;gap:10px}
.come i{font:800 15px/28px var(--display);font-style:normal;width:28px;height:28px;border-radius:50%;background:#C9A24B;color:var(--navy);text-align:center}
.come b{color:#F5F1E6}
main{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:28px 70px;display:grid;gap:18px}
.nota{display:flex;align-items:center;gap:12px;background:var(--verde-velo);color:var(--verde);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px}
.area{background:var(--foglio);border:1px solid var(--riga);border-radius:18px;padding:22px clamp(18px,3vw,26px);display:grid;gap:16px}
.area-testa{display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;align-items:start}
.icona{grid-row:span 2;width:56px;height:56px;border-radius:14px;background:var(--navy);display:grid;place-items:center}
.icona svg{width:32px;height:32px}
.area h2{font:800 24px/1.1 var(--display);text-transform:uppercase;margin:4px 0 0}
.area p{margin:0;color:var(--inchiostro-2);max-width:62ch;grid-column:2/4}
.conta{font:700 14px/1 var(--testo);color:var(--inchiostro-3);background:var(--carta-2);border-radius:999px;padding:8px 12px;white-space:nowrap}
.conta.tutti{background:var(--verde-velo);color:var(--verde)}
.eser{display:flex;flex-wrap:wrap;gap:10px}
.eser a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--carta);border:2px solid var(--riga-2);border-radius:12px;padding:12px 16px;font:700 16px/1.2 var(--testo);color:var(--inchiostro)}
.eser a:hover{border-color:var(--oro-chiaro);background:var(--oro-velo)}
.eser a svg{flex:none;width:14px;height:14px;color:var(--oro)}
.eser a.fatto{border-color:var(--verde);background:var(--verde-velo);color:var(--verde)}
.eser a.fatto svg{color:var(--verde)}
@media (max-width:640px){.area-testa{grid-template-columns:auto 1fr}.conta{grid-column:1/3;justify-self:start}.area p{grid-column:1/3}}
</style>
</head>
<body>
<header class="testata">
  <div class="dentro">
    <div class="barra"><a href="../index.html">← Home</a><a href="index.html">Guida</a><a class="on" href="palestra.html">Palestra</a><span class="punti" id="punti">Punti <b>0</b></span></div>
    <h1>Palestra</h1>
    <div class="come"><span><i>1</i>Scegli un esercizio</span><span><i>2</i>Si apre lo strumento: premi dove c'è il <b>cerchio d'oro</b></span><span><i>3</i>Fatto: torni qui</span></div>
  </div>
</header>
<main>
  <div class="nota">Qui puoi sbagliare: è un ambiente di prova, niente va in onda e i dati veri non si toccano.</div>
  <div id="aree" style="display:grid;gap:18px"></div>
</main>
<script>
(function () {
  var DEV = "/como-tv-dev/";
  var PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2v12l10-6z" fill="currentColor"/></svg>';
  var OK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var AREE = [
    { id: "MAM", nome: "MAM · Archivio", testo: "L’archivio di tutte le partite. Cerchi una partita, un giocatore o una frase della telecronaca e la guardi dal momento giusto; le azioni scelte le metti da parte o le mandi in regia.",
      ico: '<svg viewBox="0 0 64 64" fill="none"><rect x="8" y="10" width="21" height="18" rx="2" stroke="#F5F1E6" stroke-width="3"/><rect x="35" y="10" width="21" height="18" rx="2" stroke="#F5F1E6" stroke-width="3"/><rect x="8" y="34" width="21" height="18" rx="2" stroke="#F5F1E6" stroke-width="3"/><rect x="35" y="34" width="21" height="18" rx="2" fill="#C9A24B"/></svg>' },
    { id: "Editing", nome: "Editing", testo: "Il montaggio, come in Premiere. Prendi i pezzi dalle partite, li metti in fila nella timeline, aggiungi titoli e li esporti per la piattaforma e i social.",
      ico: '<svg viewBox="0 0 64 64" fill="none"><rect x="6" y="14" width="52" height="10" rx="2" fill="#C9A24B"/><rect x="6" y="30" width="30" height="10" rx="2" stroke="#F5F1E6" stroke-width="3"/><rect x="40" y="30" width="18" height="10" rx="2" stroke="#F5F1E6" stroke-width="3"/><line x1="24" y1="8" x2="24" y2="56" stroke="#F5F1E6" stroke-width="3"/></svg>' },
    { id: "Grafiche live", nome: "Grafiche live", testo: "Le grafiche che vanno in onda: formazioni, risultati, approfondimenti. La redazione le prepara e le controlla, poi le manda nella scaletta della regia.",
      ico: '<svg viewBox="0 0 64 64" fill="none"><rect x="24" y="16" width="16" height="32" rx="2" fill="#C9A24B"/><rect x="6" y="28" width="16" height="20" rx="2" stroke="#F5F1E6" stroke-width="3"/><rect x="42" y="34" width="16" height="14" rx="2" stroke="#F5F1E6" stroke-width="3"/></svg>' },
    { id: "Altri strumenti", nome: "Altri strumenti", testo: "Il Magazzino con foto, stemmi e maglie; la Telecronaca per chi commenta; le copertine e le grafiche statiche per la piattaforma e i social.",
      ico: '<svg viewBox="0 0 64 64" fill="none"><rect x="23" y="8" width="18" height="30" rx="9" fill="#C9A24B"/><path d="M15 30c0 11 8 17 17 17s17-6 17-17" stroke="#F5F1E6" stroke-width="3" stroke-linecap="round"/><line x1="32" y1="47" x2="32" y2="56" stroke="#F5F1E6" stroke-width="3"/></svg>' },
    { id: "Home", nome: "La home", testo: "La porta d’ingresso di Como TV: da qui si arriva a tutti gli strumenti, e la barra in alto è la stessa in ogni pagina.",
      ico: '<svg viewBox="0 0 64 64" fill="none"><path d="M10 30L32 12l22 18" stroke="#F5F1E6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="30" width="28" height="22" rx="2" fill="#C9A24B"/></svg>' }
  ];
  function leggi() { try { return JSON.parse(localStorage.getItem("coach-palestra")) || {}; } catch (e) { return {}; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function disegna() {
    var P = leggi(), fatti = P.fatti || {}, pezzi = (window.COACH_DATI && COACH_DATI.pezzi) || [];
    document.getElementById("punti").innerHTML = "Punti <b>" + (P.punti || 0) + "</b>";
    document.getElementById("aree").innerHTML = AREE.map(function (a) {
      var l = pezzi.filter(function (p) { return p.area === a.id; }); if (!l.length) return "";
      var f = l.filter(function (p) { return fatti[p.id]; }).length;
      return '<section class="area"><div class="area-testa"><span class="icona" aria-hidden="true">' + a.ico + '</span><h2>' + a.nome + '</h2>' +
        '<span class="conta' + (f === l.length ? " tutti" : "") + '">' + f + " di " + l.length + " fatti</span><p>" + a.testo + '</p></div><div class="eser">' +
        l.map(function (p) {
          var pag = p.pagina || "index.html", url = DEV + pag + (pag.indexOf("?") >= 0 ? "&" : "?") + "coach=" + encodeURIComponent(p.id);
          return '<a href="' + url + '"' + (fatti[p.id] ? ' class="fatto"' : "") + ">" + (fatti[p.id] ? OK : PLAY) + esc(p.titolo) + "</a>";
        }).join("") + "</div></section>";
    }).join("");
  }
  var s = document.createElement("script"); s.src = "../live/coach-dati.js"; s.onload = disegna; s.onerror = disegna; document.head.appendChild(s);
  window.addEventListener("pageshow", disegna);
})();
</script>
</body>
</html>
