<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra Como TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<style>
:root{--navy:#0A0F24;--navy-1:#0E1430;--navy-2:#141B3C;--navy-3:#20284E;--oro:#C9A24B;--oro-2:#E3C271;--avorio:#F5F1E6;--avorio-2:#D8D2C2;--fg-3:#8A8B96;--verde:#3DDC84;--linea:rgba(245,241,230,.1);
  --display:"Mazzard","Arial Black","Helvetica Neue",Arial,sans-serif;--testo:"DM Sans",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--avorio);font:500 17px/1.5 var(--testo)}
a{color:inherit}
:focus-visible{outline:3px solid var(--oro-2);outline-offset:3px;border-radius:10px}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,28px);border-bottom:1px solid var(--linea);background:var(--navy-1)}
.top a{font:700 14px/1 var(--testo);text-decoration:none;border:1px solid var(--linea);padding:9px 14px;border-radius:999px;color:var(--avorio-2)}
.top a:hover{border-color:var(--oro)}
.top .punti{margin-left:auto;font:700 14px/1 var(--testo);background:var(--navy-3);padding:9px 14px;border-radius:999px}
.top .punti b{color:var(--oro-2)}
main{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,3vw,28px);padding-block:30px 70px}
h1{font:800 clamp(40px,7vw,68px)/.95 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--oro-2)}
.come{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0 10px}
.come div{background:var(--navy-2);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:center;font-size:16px;font-weight:700}
.come i{font:800 30px/1 var(--display);font-style:normal;color:var(--oro-2);min-width:26px}
.tranquillo{color:var(--avorio-2);margin:0 0 30px;font-size:16px}
.tranquillo b{color:var(--verde)}
section{margin-top:26px}
section h2{display:flex;align-items:baseline;gap:12px;font:800 22px/1 var(--display);text-transform:uppercase;margin:0 0 12px}
section h2 span{font:700 14px/1 var(--testo);color:var(--fg-3);text-transform:none}
.eser{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.eser a{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--navy-2);border:2px solid transparent;border-radius:14px;padding:16px;min-height:74px}
.eser a:hover{border-color:var(--oro)}
.eser .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy-3);display:grid;place-items:center;font:800 15px/1 var(--display);color:var(--oro-2)}
.eser a.fatto .n{background:var(--verde);color:var(--navy)}
.eser .t{font:700 16px/1.25 var(--testo)}
.eser .v{margin-left:auto;flex:none;font:800 13px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--oro-2)}
.eser a.fatto .v{color:var(--verde)}
@media (max-width:720px){.come{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top">
  <a href="../index.html">← Home</a>
  <a href="index.html">Guida</a>
  <span class="punti" id="punti">Punti <b>0</b></span>
</header>
<main>
  <h1><em>Palestra</em></h1>
  <div class="come">
    <div><i>1</i>Scegli un esercizio</div>
    <div><i>2</i>Si apre lo strumento vero: premi dove c'è il cerchio d'oro</div>
    <div><i>3</i>Fatto: torni qui e ne scegli un altro</div>
  </div>
  <p class="tranquillo"><b>Qui puoi sbagliare.</b> È un ambiente di prova: niente va in onda, niente tocca i dati veri.</p>
  <div id="aree"></div>
</main>
<script>
(function () {
  var DEV = "/como-tv-dev/";
  var AREE = [["MAM", "MAM · Archivio"], ["Editing", "Editing"], ["Grafiche live", "Grafiche live"], ["Altri strumenti", "Altri strumenti"], ["Home", "La home"]];
  function leggi() { try { return JSON.parse(localStorage.getItem("coach-palestra")) || {}; } catch (e) { return {}; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function disegna() {
    var P = leggi(), fatti = P.fatti || {}, pezzi = (window.COACH_DATI && COACH_DATI.pezzi) || [];
    document.getElementById("punti").innerHTML = "Punti <b>" + (P.punti || 0) + "</b>";
    document.getElementById("aree").innerHTML = AREE.map(function (a) {
      var l = pezzi.filter(function (p) { return p.area === a[0]; }); if (!l.length) return "";
      var f = l.filter(function (p) { return fatti[p.id]; }).length;
      return "<section><h2>" + a[1] + "<span>" + f + " di " + l.length + " fatti</span></h2><div class=\"eser\">" + l.map(function (p, i) {
        var pag = p.pagina || "index.html", url = DEV + pag + (pag.indexOf("?") >= 0 ? "&" : "?") + "coach=" + encodeURIComponent(p.id);
        return "<a href=\"" + url + "\"" + (fatti[p.id] ? " class=\"fatto\"" : "") + "><span class=\"n\">" + (fatti[p.id] ? "✓" : i + 1) + "</span><span class=\"t\">" + esc(p.titolo) + "</span><span class=\"v\">" + (fatti[p.id] ? "Rifai" : "Vai") + "</span></a>";
      }).join("") + "</div></section>";
    }).join("");
  }
  var s = document.createElement("script"); s.src = "../live/coach-dati.js"; s.onload = disegna; s.onerror = disegna; document.head.appendChild(s);
  window.addEventListener("pageshow", disegna);
})();
</script>
</body>
</html>
