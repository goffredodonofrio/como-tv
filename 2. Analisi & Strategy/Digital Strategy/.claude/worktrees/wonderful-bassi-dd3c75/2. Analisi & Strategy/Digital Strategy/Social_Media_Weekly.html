/* ── HEADER ── */

  background: linear-gradient(135deg, #0b1628 0%, #162444 100%);
  border-bottom: 3px solid #B8962E;

  position: sticky;
  top: 0;
  z-index: 200;

.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.3px; }
.brand-sub { font-size: 10px; color: rgba(255,255,255,.4); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; display: block; margin-top: 1px; }
.header-divider { width: 1px; height: 28px; background: rgba(255,255,255,.12); }

.week-nav { display: flex; align-items: center; gap: 8px; flex: 1; }
.week-nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: rgba(255,255,255,.4); white-space: nowrap; }
.week-pills { display: flex; gap: 6px; }
.week-pill {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,.15);
  background: transparent;
  color: rgba(255,255,255,.5);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  letter-spacing: .2px;
}
.week-pill:hover { border-color: rgba(255,255,255,.4); color: rgba(255,255,255,.8); }
.week-pill.active { background: #B8962E; border-color: #B8962E; color: #0b1628; }

.header-meta { text-align: right; white-space: nowrap; }
.header-meta-date { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.8); }
.header-meta-label { font-size: 10px; color: rgba(255,255,255,.35); font-weight: 500; }

/* ── WEEK HERO ── */
.week-hero {
  background: linear-gradient(135deg, #0b1628 0%, #1a2d52 100%);
  padding: 32px 32px 28px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.week-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #B8962E; margin-bottom: 6px; }
.week-title { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -.6px; margin-bottom: 4px; }
.week-subtitle { font-size: 13px; color: rgba(255,255,255,.4); font-weight: 500; }

/* ── SUMMARY STRIP ── */
.summary-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  border-bottom: 1px solid #e5e7eb;
  background: #fff;
}
@media(max-width:900px) { .summary-strip { grid-template-columns: repeat(2, 1fr); } }
.summary-card {
  padding: 20px 22px;
  border-right: 1px solid #f0f1f3;
  border-top: 3px solid var(--pc);
  position: relative;
  cursor: pointer;
  transition: background .12s;
}
.summary-card:last-child { border-right: none; }
.summary-card:hover { background: #fafbfc; }
.summary-card.active { background: color-mix(in srgb, var(--pc) 5%, white); }
.sc-platform { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.sc-icon { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--pc); flex-shrink: 0; }
.sc-name { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #374151; }
.sc-val { font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: -.7px; line-height: 1; margin-bottom: 4px; }
.sc-label { font-size: 10px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.sc-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
.sc-delta.up { background: #f0fdf4; color: #16a34a; }
.sc-delta.down { background: #fff1f2; color: #e11d48; }
.sc-delta.neutral { background: #f9fafb; color: #6b7280; }
.sc-vs { font-size: 10px; color: #9ca3af; font-weight: 500; margin-top: 4px; }

/* ── PAGE LAYOUT ── */
.page-body { max-width: 1280px; margin: 0 auto; padding: 32px 32px 80px; }

/* ── SECTION ── */
.platform-section { margin-bottom: 48px; scroll-margin-top: 80px; }

/* ── PLATFORM HEADING ── */
.platform-heading {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}
.ph-icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--pc);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ph-info {}
.ph-name { font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -.3px; }
.ph-followers { font-size: 12px; color: #6b7280; font-weight: 500; }
.ph-status { margin-left: auto; }
.confirmed-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: #f0fdf4; border: 1.5px solid #bbf7d0; font-size: 11px; font-weight: 700; color: #15803d; }
.unconfirmed-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: #fafafa; border: 1.5px solid #e5e7eb; font-size: 11px; font-weight: 600; color: #6b7280; }

/* ── HERO CARD ── */
.hero-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-left: 5px solid var(--pc);
  border-radius: 16px;
  padding: 28px 28px 24px;
  margin-bottom: 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: start;
}
.hc-left {}
.hc-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--pc); margin-bottom: 6px; }
.hc-val { font-size: 48px; font-weight: 800; color: #0f172a; letter-spacing: -1.5px; line-height: 1; margin-bottom: 8px; }
.hc-label { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 16px; }
.hc-narrative { font-size: 14px; color: #374151; line-height: 1.75; max-width: 640px; }
.hc-narrative strong { color: #0f172a; font-weight: 700; }
.hc-right { text-align: right; min-width: 120px; }
.hc-delta-big { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
.hc-delta-big.up { color: #16a34a; }
.hc-delta-big.down { color: #e11d48; }
.hc-delta-label { font-size: 10px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }

/* ── METRIC GRID ── */
.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media(max-width:900px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }
.metric-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 18px 16px;
  border-top: 3px solid var(--pc);
}
.mc-val { font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -.5px; line-height: 1; }
.mc-label { font-size: 10px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px; margin-top: 6px; }
.mc-sub { font-size: 11px; color: #6b7280; font-weight: 500; margin-top: 4px; }
.mc-delta { font-size: 11px; font-weight: 700; margin-top: 5px; }
.mc-delta.up { color: #16a34a; }
.mc-delta.down { color: #e11d48; }

/* ── INSIGHT BOX ── */
.insight-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
@media(max-width:900px) { .insight-row { grid-template-columns: 1fr; } }
.insight-pill {
  background: color-mix(in srgb, var(--pc) 8%, white);
  border: 1px solid color-mix(in srgb, var(--pc) 20%, white);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.ip-icon { font-size: 18px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
.ip-text { font-size: 12.5px; color: #374151; line-height: 1.6; }
.ip-text strong { color: #0f172a; font-weight: 700; }

/* ── TOP CONTENT ── */

.tc-header { padding: 14px 18px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; justify-content: space-between; }
.tc-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; color: #9ca3af; }
.tc-count { font-size: 10px; font-weight: 600; color: #9ca3af; }

/* ── TREND SPARKBAR ── */

.sparkbar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: #9ca3af; margin-bottom: 14px; }

.sparkbar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }

.sparkbar-bar:hover { opacity: 1; }
.sparkbar-lbl { font-size: 9px; color: #9ca3af; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40px; text-align: center; }

/* ── NO WEEK ── */
.empty-state { padding: 60px 32px; text-align: center; color: #9ca3af; font-size: 14px; }

/* ── SCROLL ANCHOR NAV ── */

  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 32px;
  background: rgba(244,245,247,.94);
  border-bottom: 1px solid #e5e7eb;
  backdrop-filter: blur(8px);
  position: sticky;
  top: 64px;
  z-index: 100;

.anchor-link {

  background: #fff;

  font-weight: 700;

  text-decoration: none;
  letter-spacing: .2px;

.anchor-link:hover { border-color: var(--pc, #0d1a38); color: var(--pc, #0d1a38); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.06); }

  .anchor-nav { padding: 10px 16px; }
  .hero-card { grid-template-columns: 1fr; }
  .hc-right { text-align: left; }

/* ══ HELPERS ══ */
const fmt = n => n == null ? '—' : n >= 1000000 ? (n/1000000).toFixed(1).replace('.0','')+'M' : n >= 1000 ? (n/1000).toFixed(0)+'K' : String(n);
const fmtFull = n => n == null ? '—' : n.toLocaleString('it-IT');
const pct = n => n == null ? '—' : n.toFixed(2).replace('.',',')+'%';

function deltaLabel(curr, prev) {
  if (prev == null || curr == null) return null;
  const d = ((curr - prev) / prev * 100);
  return { val: (d >= 0 ? '+' : '') + d.toFixed(0) + '%', dir: d >= 0 ? 'up' : 'down' };
}

function prevWeek(wi, key) {
  if (wi === 0) return null;
  return WEEKS[wi - 1][key];
}

/* ══ RENDER ══ */
let currentWeekIndex = WEEKS.length - 1;

function render(wi) {
  currentWeekIndex = wi;
  const W = WEEKS[wi];

  // week pills active state
  document.querySelectorAll('.week-pill').forEach((el, i) => el.classList.toggle('active', i === wi));

  // header updated (use latest confirmed date)
  const dates = ['youtube','tiktok','instagram','facebook','linkedin'].map(p => W[p]?.updated).filter(Boolean).sort();
  document.getElementById('hd-updated').textContent = dates[dates.length - 1] || '—';

  // hero
  document.getElementById('week-hero').style.display = '';
  document.getElementById('hero-week-label').textContent = W.label;
  document.getElementById('hero-week-sub').textContent = `Settimana ${wi+1} di ${WEEKS.length} — Report di performance social`;

  renderSummary(W, wi);
  renderBody(W, wi);
  renderAnchorNav();
}

function renderSummary(W, wi) {
  const strip = document.getElementById('summary-strip');
  const platforms = [
    { key: 'instagram', metric: W.instagram?.feed_week?.reach, label: 'Reach feed',    prev: prevWeek(wi,'instagram')?.feed_week?.reach },
    { key: 'tiktok',    metric: W.tiktok?.views_7d,           label: 'Views 7gg',      prev: prevWeek(wi,'tiktok')?.views_7d },
    { key: 'youtube',   metric: W.youtube?.views_7d,          label: 'Views 7gg',      prev: prevWeek(wi,'youtube')?.views_7d },
    { key: 'facebook',  metric: W.facebook?.content_week?.reach, label: 'Reach 7gg',   prev: prevWeek(wi,'facebook')?.content_week?.reach },
    { key: 'linkedin',  metric: W.linkedin?.impressions_7d,   label: 'Impressioni',    prev: prevWeek(wi,'linkedin')?.impressions_7d },
  ];

  strip.innerHTML = platforms.map(({key, metric, label, prev}) => {
    const cfg = PLATFORMS[key];
    const d = deltaLabel(metric, prev);
    let deltaHtml = '';
    if (d) {
      deltaHtml = `<div class="sc-delta ${d.dir}">${d.val}</div><div class="sc-vs">vs settimana prec.</div>`;
    } else if (wi > 0) {
      deltaHtml = `<div class="sc-delta neutral">— n/d</div>`;
    }
    return `<div class="summary-card" style="--pc:${cfg.color}" onclick="scrollTo('${cfg.anchor}')">
      <div class="sc-platform">
        <div class="sc-icon">${cfg.icon(14)}</div>
        <span class="sc-name">${cfg.name}</span>
      </div>
      <div class="sc-val">${fmt(metric)}</div>
      <div class="sc-label">${label}</div>
      ${deltaHtml}
    </div>`;
  }).join('');
}

function renderAnchorNav() {
  const nav = document.getElementById('anchor-nav');
  nav.innerHTML = Object.entries(PLATFORMS).map(([key, cfg]) =>
    `<a class="anchor-link" style="--pc:${cfg.color}" href="#section-${cfg.anchor}">
      <span class="anchor-dot"></span>${cfg.name}
    </a>`
  ).join('');
}

function renderBody(W, wi) {
  const body = document.getElementById('page-body');
  body.innerHTML = [
    renderInstagram(W, wi),
    '<div class="section-divider"></div>',
    renderTikTok(W, wi),
    '<div class="section-divider"></div>',
    renderYouTube(W, wi),
    '<div class="section-divider"></div>',
    renderFacebook(W, wi),
    '<div class="section-divider"></div>',
    renderLinkedIn(W, wi),
  ].join('');
}

/* ── YouTube ── */
function renderYouTube(W, wi) {
  const d = W.youtube;
  if (!d) return '';
  const pc = PLATFORMS.youtube.color;
  const prevD = prevWeek(wi, 'youtube');

    narrative = `<strong>${fmtFull(d.views_7d)} views</strong> nella settimana — in crescita rispetto alla settimana precedente. Il picco si registra martedì 30 aprile con oltre <strong>13K views</strong> in un solo giorno.`;

    <div class="metric-grid" style="--pc:${pc}">

/* ── COMPONENT HELPERS ── */
function confirmedBadge() {
  return `<span class="confirmed-badge"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#16a34a"/><path d="M3 5l1.5 1.5L7 3" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg> Confermato</span>`;
}
function unconfirmedBadge() {
  return `<span class="unconfirmed-badge">Non confermato</span>`;
}

function renderSparkbar(data, valKey, color, title) {
  if (!data || !data.length) return '';
  const vals = data.map(d => d[valKey] || 0);
  const max = Math.max(...vals) || 1;
  const bars = data.map((d, i) => {
    const h = Math.max(4, Math.round((vals[i] / max) * 52));
    return `<div class="sparkbar-col" title="${d.l}: ${fmtFull(vals[i])}">
      <div class="sparkbar-bar" style="height:${h}px;background:${color}"></div>
      <div class="sparkbar-lbl">${d.l.replace(/^\d{2}-/,'').replace('aprile','apr').replace('maggio','mag')}</div>
    </div>`;
  }).join('');
  return `<div class="sparkbar-wrap">
    <div class="sparkbar-title">${title}</div>
    <div class="sparkbar-chart">${bars}</div>
  </div>`;
}

function renderTopTable(items, title, color, mainKey, secKey) {
  if (!items || !items.length) return '';
  const top = items.slice(0, 5);
  const rows = top.map((item, i) => {
    const type = (item.type || item.badge || 'Video').toLowerCase().replace(/\s+/g, '-');
    const badgeClass = `b-${type}`;
    const badgeLabel = item.type || item.badge || 'Video';
    const col = item.url
      ? `<a href="${item.url}" target="_blank" class="tc-text" style="display:block;text-decoration:none;color:inherit">${item.title.slice(0,80)}${item.title.length>80?'…':''}</a>`
      : `<div class="tc-text">${item.title.slice(0,80)}${item.title.length>80?'…':''}</div>`;
    return `<div class="tc-row" style="grid-template-columns:32px 1fr 90px">
      <div class="tc-num">#${i+1}</div>
      <div class="tc-body">
        <span class="tc-badge ${badgeClass}">${badgeLabel}</span>
        ${col}
        ${item.v3 ? `<div class="tc-secondary">${item.l3}: ${item.v3}</div>` : ''}
      </div>
      <div class="tc-metric">
        <div class="tc-metric-val">${typeof item.v1 === 'number' ? fmt(item.v1) : item.v1}</div>
        <div class="tc-metric-lbl">${item.l1}</div>
        ${item.v2 != null ? `<div class="tc-secondary">${item.l2}: ${typeof item.v2 === 'number' ? fmt(item.v2) : item.v2}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `<div class="top-content">
    <div class="tc-header">
      <span class="tc-title">${title}</span>
      <span class="tc-count">${top.length} contenuti</span>
    </div>
    ${rows}
  </div>`;
}

function scrollTo(anchor) {
  const el = document.getElementById(`section-${anchor}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
