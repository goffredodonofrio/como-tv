/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: #eef0f3; color: #0f172a; font-size: 13px; line-height: 1.4; }

/* ── APP SHELL ── */
.app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── HEADER ── */
.hdr {
  height: 52px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #0b1628 0%, #162444 100%);
  border-bottom: 3px solid #B8962E;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.hdr-brand { display: flex; flex-direction: column; }
.hdr-name { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -.2px; line-height: 1; }
.hdr-sub { font-size: 9px; color: rgba(255,255,255,.38); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; margin-top: 2px; }
.hdr-div { width: 1px; height: 22px; background: rgba(255,255,255,.12); }
.hdr-week-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: rgba(255,255,255,.35); white-space: nowrap; }
.hdr-pills { display: flex; gap: 5px; }
.hdr-pill {
  padding: 4px 12px;
  border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,.14);
  background: transparent;
  color: rgba(255,255,255,.45);
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.hdr-pill:hover { border-color: rgba(255,255,255,.4); color: rgba(255,255,255,.8); }
.hdr-pill.active { background: #B8962E; border-color: #B8962E; color: #0b1628; }
.hdr-spacer { flex: 1; }
.hdr-date { text-align: right; }
.hdr-date-val { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.7); }
.hdr-date-lbl { font-size: 9px; color: rgba(255,255,255,.28); font-weight: 500; }

/* ── PLATFORM TABS ── */
.ptabs {
  height: 56px;
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: stretch;
  padding: 0 20px;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.ptabs::-webkit-scrollbar { display: none; }
.ptab {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.ptab:hover { background: #fafbfc; }
.ptab.active { border-bottom-color: var(--pc); }
.ptab-icon { width: 26px; height: 26px; border-radius: 7px; background: var(--pc); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ptab-info { display: flex; flex-direction: column; }
.ptab-name { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #374151; }
.ptab-kpi { font-size: 13px; font-weight: 800; color: #0f172a; letter-spacing: -.3px; line-height: 1.1; }
.ptab-delta { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 10px; display: inline-block; margin-top: 1px; }
.ptab-delta.up { background: #f0fdf4; color: #16a34a; }
.ptab-delta.down { background: #fff1f2; color: #e11d48; }
.ptab-delta.neutral { background: #f9fafb; color: #9ca3af; }

/* ── PANELS CONTAINER ── */
.panels {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

/* ── SINGLE PANEL ── */
.panel {
  display: none;
  position: absolute;
  inset: 0;
  padding: 14px 20px;
  gap: 14px;
  grid-template-columns: 38% 1fr;
  overflow: hidden;
}
.panel.active { display: grid; }

/* ── LEFT COLUMN ── */
.panel-l {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  overflow: hidden;
}

/* Platform heading */
.plat-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.plat-head-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--pc); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.plat-head-name { font-size: 17px; font-weight: 800; color: #0f172a; letter-spacing: -.3px; }
.plat-head-followers { font-size: 11px; color: #6b7280; font-weight: 500; }
.plat-head-status { margin-left: auto; }
.badge-ok { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px; background: #f0fdf4; border: 1.5px solid #bbf7d0; font-size: 10px; font-weight: 700; color: #15803d; }
.badge-nd { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px; background: #f9fafb; border: 1.5px solid #e5e7eb; font-size: 10px; font-weight: 600; color: #6b7280; }

/* Hero card */
.hero-card {
  flex: 1;
  min-height: 0;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-left: 5px solid var(--pc);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.hc-eyebrow { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--pc); margin-bottom: 4px; }
.hc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.hc-val { font-size: 40px; font-weight: 800; color: #0f172a; letter-spacing: -1.5px; line-height: 1; }
.hc-label { font-size: 10px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }
.hc-delta-wrap { text-align: right; flex-shrink: 0; }
.hc-delta { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.hc-delta.up { color: #16a34a; }
.hc-delta.down { color: #e11d48; }
.hc-delta-lbl { font-size: 9px; font-weight: 600; color: #9ca3af; margin-top: 2px; }
.hc-narrative {
  font-size: 12px;
  color: #374151;
  line-height: 1.65;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
}
.hc-narrative strong { color: #0f172a; font-weight: 700; }

/* Metric grid */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  flex-shrink: 0;
}
.mc {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 10px 12px;
  border-top: 3px solid var(--pc);
}
.mc-val { font-size: 17px; font-weight: 800; color: #0f172a; letter-spacing: -.4px; line-height: 1; }
.mc-label { font-size: 9px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }
.mc-sub { font-size: 9.5px; color: #6b7280; margin-top: 2px; }

/* Sparkbar */
.sparkbar {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 10px 12px;
  flex-shrink: 0;
}
.sb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sb-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #9ca3af; }
.sb-unit { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #d1d5db; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; padding: 1px 5px; }
.sb-bars { display: flex; align-items: flex-end; gap: 4px; height: 62px; }
.sb-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 0; }
.sb-val { font-size: 7.5px; font-weight: 700; color: #d1d5db; margin-bottom: 2px; white-space: nowrap; line-height: 1; }
.sb-val.peak { color: var(--pc); font-weight: 800; }
.sb-bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--pc); opacity: .55; min-height: 3px; transition: opacity .15s; }
.sb-bar.peak { opacity: 1; }
.sb-bar:hover { opacity: 1; }
.sb-lbl { font-size: 8px; color: #9ca3af; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34px; text-align: center; margin-top: 3px; }
.sb-empty { font-size: 10px; color: #d1d5db; text-align: center; padding: 10px 0 4px; font-style: italic; font-weight: 500; }

/* ── RIGHT COLUMN ── */

  align-items: center;

  flex-shrink: 0;

.tbl-count { font-size: 9px; font-weight: 600; color: #d1d5db; }
.tbl-body { overflow-y: auto; flex: 1; scrollbar-width: thin; }
.tbl-row {

  padding: 9px 14px;
  border-bottom: 1px solid #f8f9fa;
  align-items: center;
  gap: 10px;
  grid-template-columns: 22px 1fr 80px;
  transition: background .1s;

.tbl-row:last-child { border-bottom: none; }
.tbl-row:hover { background: #fafafa; }
.tbl-n { font-size: 11px; font-weight: 800; color: #e5e7eb; text-align: center; }
.tbl-body-cell {}
.tbl-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 2px; }
.b-reel, .b-reel-di-instagram { background: #fdf4ff; color: #9333ea; }
.b-video { background: #fff1f1; color: #dc2626; }
.b-carosello, .b-carosello-di-instagram { background: #eff6ff; color: #2563eb; }
.b-storia { background: #f0fdf4; color: #16a34a; }
.tbl-text { font-size: 12px; font-weight: 600; color: #1e293b; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl-text a { color: inherit; text-decoration: none; }
.tbl-text a:hover { color: var(--pc); }
.tbl-sub { font-size: 10px; color: #9ca3af; margin-top: 1px; }
.tbl-metric { text-align: right; }
.tbl-mval { font-size: 13px; font-weight: 800; color: #0f172a; letter-spacing: -.3px; }
.tbl-mlbl { font-size: 9px; color: #9ca3af; font-weight: 600; margin-top: 1px; }
.tbl-msub { font-size: 10px; color: #6b7280; margin-top: 1px; }

  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  flex-shrink: 0;
  align-items: center;
}
.aud-item {}
.aud-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #9ca3af; }
.aud-val { font-size: 12px; font-weight: 700; color: #1e293b; margin-top: 1px; }

/* No data state */
.no-data {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  color: #9ca3af;
  font-size: 13px;
  font-weight: 600;
  gap: 6px;
}
.no-data span { font-size: 11px; font-weight: 400; }

/* ── SCROLLBAR STYLE ── */
.tbl-body::-webkit-scrollbar { width: 4px; }
.tbl-body::-webkit-scrollbar-track { background: transparent; }
.tbl-body::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }

/* ══ HELPERS ══ */
const fmt = n => n==null ? '—' : n>=1000000 ? (n/1000000).toFixed(1).replace('.0','')+'M' : n>=1000 ? (n/1000).toFixed(0)+'K' : String(n);
const fmtFull = n => n==null ? '—' : n.toLocaleString('it-IT');
const pct = n => n==null ? '—' : n.toFixed(2).replace('.',',')+'%';

function delta(curr, prev) {
  if (prev==null||curr==null||prev===0) return null;
  const d = ((curr-prev)/prev*100);
  return { val: (d>=0?'+':'')+d.toFixed(0)+'%', dir: d>=0?'up':'down' };
}

/* ══ STATE ══ */
let currentWeek = WEEKS.length - 1;
let currentPlatform = 0;

/* ══ BUILD TABS & PANELS (once) ══ */
function buildUI() {
  const tabsEl = document.getElementById('ptabs');
  const panelsEl = document.getElementById('panels');

  PLATFORMS.forEach((p, pi) => {
    // tab
    const tab = document.createElement('div');
    tab.className = 'ptab' + (pi===0?' active':'');
    tab.style.setProperty('--pc', p.color);
    tab.dataset.pi = pi;
    tab.innerHTML = `<div class="ptab-icon">${p.icon(14)}</div>
      <div class="ptab-info">
        <div class="ptab-name">${p.name}</div>
        <div class="ptab-kpi" id="tab-kpi-${pi}">—</div>
        <div class="ptab-delta neutral" id="tab-delta-${pi}">—</div>
      </div>`;
    tab.onclick = () => switchPlatform(pi);
    tabsEl.appendChild(tab);

    // panel
    const panel = document.createElement('div');
    panel.className = 'panel' + (pi===0?' active':'');
    panel.id = `panel-${p.key}`;
    panel.style.setProperty('--pc', p.color);
    panelsEl.appendChild(panel);
  });
}

/* ══ RENDER WEEK ══ */
function renderWeek(wi) {
  currentWeek = wi;
  const W = WEEKS[wi];

  // header
  document.querySelectorAll('.hdr-pill').forEach((el,i) => el.classList.toggle('active', i===wi));
  const dates = ['youtube','tiktok','instagram','facebook','linkedin'].map(k=>W[k]?.updated).filter(Boolean).sort();
  document.getElementById('hdr-date').textContent = dates[dates.length-1]||'—';

  // tabs KPI
  PLATFORMS.forEach((p,pi) => {
    const kpi = p.kpiKey(W);
    const prev = p.prevKey(W, wi);
    const d = delta(kpi, prev);
    document.getElementById(`tab-kpi-${pi}`).textContent = fmt(kpi)||'—';
    const dEl = document.getElementById(`tab-delta-${pi}`);
    if (d) { dEl.textContent = d.val + ' vs prec.'; dEl.className = `ptab-delta ${d.dir}`; }
    else { dEl.textContent = wi===0 ? 'baseline' : '— n/d'; dEl.className = 'ptab-delta neutral'; }
  });

  // render all panels
  PLATFORMS.forEach((p,pi) => {
    const el = document.getElementById(`panel-${p.key}`);
    el.innerHTML = buildPanel(p, W, wi);
  });
}

/* ══ BUILD PANEL ══ */
function buildPanel(p, W, wi) {
  const d = W[p.key];
  if (!d) return `<div class="panel-l"><div class="no-data">Nessun dato disponibile</div></div><div class="panel-r"></div>`;

  const prev = wi>0 ? WEEKS[wi-1][p.key] : null;

  switch(p.key) {
    case 'instagram': return panelInstagram(d, prev, wi);
    case 'tiktok':    return panelTikTok(d, prev, wi);
    case 'youtube':   return panelYouTube(d, prev, wi);
    case 'facebook':  return panelFacebook(d, prev, wi);
    case 'linkedin':  return panelLinkedIn(d, prev, wi);
  }
  return '';
}

        <div><div class="hc-val">${fmt(d.views_7d)}</div><div class="hc-label">Views nei 7 giorni</div></div>
        ${dl ? `<div class="hc-delta-wrap"><div class="hc-delta ${dl.dir}">${dl.val}</div><div class="hc-delta-lbl">vs settimana prec.</div></div>` : ''}
      </div>
      <div class="hc-narrative">${narratives[wi]}</div>
    </div>
    <div class="metric-grid" style="--pc:${pc}">
      ${mc(fmtFull(d.subscribers), 'Iscritti', 'Cumulato canale')}
      ${mc(fmt(d.total_views), 'Views totali', 'Cumulato canale')}
      ${mc(d.pubblico_mensile ? fmt(d.pubblico_mensile) : '—', 'Pubblico mens.', 'Spett. unici 28gg')}
      ${mc(fmt(Math.round(d.views_7d/7)), 'Media giorn.', 'Views/giorno')}
      ${mc(d.avg_views ? fmtFull(d.avg_views) : '—', 'Views medie', 'Per video (storico)')}
      ${mc('—', 'Iscritti netti', 'Non disponibile')}
    </div>`;

  const right = `
    ${sparkbar(d.trend_week||[], 'subs', 'views', pc, 'Views giornaliere YouTube')}
    ${d.top_total?.length
      ? topTable(d.top_total, 'Video più visti (all time)', 'v1', 'v2')
      : `<div class="no-data" style="flex:1"><span style="font-size:28px">📹</span>Top video non ancora disponibile<span>Verranno aggiunti nelle prossime settimane.</span></div>`}
    ${d.audience_core ? audienceStrip(d.audience_core, d.audience_country, d.audience_cities) : ''}`;

  return `<div class="panel-l" style="--pc:${pc}">${left}</div><div class="panel-r" style="--pc:${pc}">${right}</div>`;
}

      </div>
      <div class="hc-narrative">${narratives[wi]}</div>
    </div>

/* ══ COMPONENT BUILDERS ══ */
function platHead(name, sub, confirmed) {
  const badge = confirmed
    ? `<span class="badge-ok"><svg width="8" height="8" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#16a34a"/><path d="M3 5l1.5 1.5L7 3" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg> Confermato</span>`
    : `<span class="badge-nd">Non confermato</span>`;
  return `<div class="plat-head">
    <div class="plat-head-icon">${PLATFORMS.find(p=>p.name===name)?.icon(18)||''}</div>
    <div><div class="plat-head-name">${name}</div><div class="plat-head-followers">${sub}</div></div>
    <div class="plat-head-status">${badge}</div>
  </div>`;
}

function mc(val, label, sub='') {
  return `<div class="mc"><div class="mc-val">${val}</div><div class="mc-label">${label}</div>${sub?`<div class="mc-sub">${sub}</div>`:''}</div>`;
}

function sparkbar(data, valKey, unit, color, title) {
  const head = `<div class="sb-head"><span class="sb-title">${title}</span><span class="sb-unit">${unit}</span></div>`;
  if (!data||!data.length) return `<div class="sparkbar">${head}<div class="sb-empty">Dati giornalieri non disponibili</div></div>`;
  const vals = data.map(d=>d[valKey]||0);
  const max = Math.max(...vals)||1;
  const bars = data.map((d,i)=>{
    const h = Math.max(3, Math.round((vals[i]/max)*36));
    const isPeak = vals[i]===max;
    return `<div class="sb-col" title="${d.l}: ${fmtFull(vals[i])} ${unit}">
      <div class="sb-val${isPeak?' peak':''}">${fmt(vals[i])}</div>
      <div class="sb-bar${isPeak?' peak':''}" style="height:${h}px;background:${color}"></div>
      <div class="sb-lbl">${d.l}</div>
    </div>`;
  }).join('');
  return `<div class="sparkbar">${head}<div class="sb-bars">${bars}</div></div>`;
}

function topTable(items, title, mainKey, secKey, compact=false) {
  if (!items||!items.length) return '';
  const rows = items.slice(0,6).map((item,i)=>{
    const type = (item.badge||item.type||'Video').toLowerCase().replace(/\s+/g,'-');
    const badgeClass = `b-${type}`;
    const badgeLabel = item.badge||item.type||'Video';
    const link = item.url
      ? `<a href="${item.url}" target="_blank">${item.title.slice(0,62)}${item.title.length>62?'…':''}</a>`
      : item.title.slice(0,62)+(item.title.length>62?'…':'');
    return `<div class="tbl-row">
      <div class="tbl-n">#${i+1}</div>
      <div class="tbl-body-cell">
        <span class="tbl-badge ${badgeClass}">${badgeLabel}</span>
        <div class="tbl-text">${link}</div>
        ${item.v3?`<div class="tbl-sub">${item.l3||''}: ${item.v3}</div>`:''}
      </div>
      <div class="tbl-metric">
        <div class="tbl-mval">${typeof item[mainKey]==='number'?fmt(item[mainKey]):item[mainKey]}</div>
        <div class="tbl-mlbl">${item.l1||''}</div>
        ${item[secKey]!=null?`<div class="tbl-msub">${item[secKey+'']==='number'?fmt(item[secKey]):item[secKey]} ${item['l2']||''}</div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<div class="tbl-wrap">
    <div class="tbl-head"><span class="tbl-title">${title}</span><span class="tbl-count">${Math.min(items.length,6)} elementi</span></div>
    <div class="tbl-body">${rows}</div>
  </div>`;
}

function audienceStrip(core, country, cities) {
  return `<div class="audience-strip">
    <div class="aud-item"><div class="aud-lbl">Audience</div><div class="aud-val">${core}</div></div>
    <div class="aud-item"><div class="aud-lbl">Paese</div><div class="aud-val">${country}</div></div>
    <div class="aud-item"><div class="aud-lbl">Città</div><div class="aud-val">${cities}</div></div>
  </div>`;
}

function audienceCompact(core, country) {
  return `<div class="audience-strip">
    <div class="aud-item"><div class="aud-lbl">Audience</div><div class="aud-val">${core}</div></div>
    <div class="aud-item"><div class="aud-lbl">Paese</div><div class="aud-val">${country}</div></div>
  </div>`;
}

/* ══ NAVIGATION ══ */
function switchPlatform(pi) {
  currentPlatform = pi;
  document.querySelectorAll('.ptab').forEach((el,i) => el.classList.toggle('active', i===pi));
  document.querySelectorAll('.panel').forEach((el,i) => el.classList.toggle('active', i===pi));
}

buildUI();
renderWeek(WEEKS.length - 1);
</script>
