<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafica Live · Como TV</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  /* pagina TRASPARENTE: vMix mostra il programma quando non c'è grafica.
     La grafica vera vive dentro l'iframe del motore: stesso file
     dell'anteprima → onda identica. color-scheme:dark allineato ai
     motori, altrimenti Chrome rende opachi gli iframe trasparenti. */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
  #frame{
    position:absolute;inset:0;border:0;width:100%;height:100%;
    opacity:0;transition:opacity .55s ease;
  }
  #frame.on{opacity:1;}
  #frame.out{opacity:0;transition:opacity .85s ease;}
</style>
</head>
<body>

<iframe id="frame" src="about:blank" allowtransparency="true"></iframe>

<script>
(function () {
  "use strict";

  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var POLL_MS = 1500;

  var frame = document.getElementById("frame");
  var lastPlayNonce = null;

  function b64url(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  var ENGINES = {
    formazione: "formazione-vmix.html",
    classifica: "classifica-vmix.html",
    risultati:  "risultati-vmix.html",
    sottopancia: "sottopancia-vmix.html"
  };

  function play(j) {
    var eng = ENGINES[j.tipo] || ENGINES.formazione;
    var src = eng + "?d=" + b64url(j.dati || {}) + "&n=" + j.playNonce;
    frame.classList.remove("out");
    frame.src = src;
    frame.classList.add("on");
  }

  function fadeOut() {
    frame.classList.remove("on");
    frame.classList.add("out");
    setTimeout(function () {
      frame.src = "about:blank";
      frame.classList.remove("out");
    }, 950);
  }

  function clearNow() {
    frame.classList.remove("on", "out");
    frame.src = "about:blank";
  }

  function tick() {
    fetch(PONTE + "?regia=1", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.playNonce == null || j.playNonce === lastPlayNonce) return;
        var first = lastPlayNonce === null;
        lastPlayNonce = j.playNonce;
        // al primo avvio: se c'è una grafica in onda la rimostro (ripresa
        // dopo un riavvio dell'input vMix), altrimenti resto trasparente
        if (first && j.state !== "play") { clearNow(); return; }
        if (j.state === "play" && j.dati) play(j);
        else if (j.state === "out") fadeOut();
        else clearNow();
      })
      .catch(function () {});
  }

  setInterval(tick, POLL_MS);
  tick();
})();
</script>
</body>
</html>
