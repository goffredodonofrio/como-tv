<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafica Live · Como TV</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  /* pagina TRASPARENTE: vMix mostra il programma quando non c'è grafica.
     La grafica vera vive dentro gli iframe dei motori: stesso file
     dell'anteprima → onda identica. color-scheme:dark allineato ai
     motori, altrimenti Chrome rende opachi gli iframe trasparenti. */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
  /* Cinque livelli sovrapposti, come i canali overlay di vMix: ognuno vive per
     conto suo, quindi una grafica non ne scalza piu' un'altra. Il livello 1 sta
     sotto, il 5 sopra: scorebug in basso, schermate piene in alto. */
  .liv{
    position:absolute;inset:0;border:0;width:100%;height:100%;
    opacity:0;transition:opacity .55s ease;pointer-events:none;background:transparent;color-scheme:dark;
  }
  .liv.on{opacity:1;}
  .liv.out{opacity:0;transition:opacity .85s ease;}
  /* Sparire di colpo, senza dissolvenza: serve un istante prima di cambiare
     documento. Lasciando correre la dissolvenza in uscita mentre l'iframe
     carica, per mezzo secondo si vede la tela bianca del browser dissolversi:
     e' il lampo che si notava entrando col sottopancia sopra il punteggio. */
  .liv.muto{opacity:0!important;transition:none!important;}
</style>
</head>
<body>

<iframe class="liv" id="liv1" style="z-index:1" src="about:blank" allowtransparency="true"></iframe>
<iframe class="liv" id="liv2" style="z-index:2" src="about:blank" allowtransparency="true"></iframe>
<iframe class="liv" id="liv3" style="z-index:3" src="about:blank" allowtransparency="true"></iframe>
<iframe class="liv" id="liv4" style="z-index:4" src="about:blank" allowtransparency="true"></iframe>
<iframe class="liv" id="liv5" style="z-index:5" src="about:blank" allowtransparency="true"></iframe>

<script>
(function () {
  "use strict";

  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var POLL_MS = 1500;
  var NLIV = 5;

  // canale playout: ogni vMix carica il SUO url (?c=1..7) e ascolta
  // solo la scaletta di quel canale
  var CANALE = (function () {
    var c = parseInt(new URLSearchParams(location.search).get("c"), 10);
    return (c >= 1 && c <= 7) ? c : 1;
  })();

  var frame = [];
  for (var i = 1; i <= NLIV; i++) { frame[i] = document.getElementById("liv" + i); frame[i].dataset.gen = "0"; }
  var ultimo = {};        // playNonce gia' servito, livello per livello
  var primaVolta = true;

  function b64url(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  var ENGINES = {
    formazione: "formazione-vmix.html",
    classifica: "classifica-vmix.html",
    risultati:  "risultati-vmix.html",
    sottopancia: "sottopancia-vmix.html",
    sottopancia2: "sottopancia2-vmix.html",
    marcatori:  "marcatori-vmix.html",
    video:      "media-vmix.html",
    immagine:   "media-vmix.html",
    web:        "media-vmix.html"
  };

  // Il livello resta invisibile finche' il documento non e' caricato: si
  // accende solo al 'load'. Accenderlo subito, come si faceva prima, mostrava
  // per un fotogramma la tela bianca del browser — il lampo che si vedeva
  // entrando col sottopancia sopra il punteggio.
  function play(L, j) {
    var f = frame[L]; if (!f) return;
    var eng = ENGINES[j.tipo] || ENGINES.formazione;
    f.classList.add("muto");            // invisibile all'istante, niente dissolvenza
    f.classList.remove("on", "out");
    var mio = ++f.dataset.gen;          // scarta i 'load' di caricamenti superati
    f.onload = function () {
      if (String(mio) !== String(f.dataset.gen)) return;
      if (f.src.indexOf("about:blank") >= 0) return;
      // 'load' dice che le risorse ci sono, NON che il documento ha gia'
      // disegnato: in quel buco il compositore puo' mostrare la tela di base
      // dell'iframe, ed e' il lampo che restava. Si aspetta un fotogramma
      // della finestra figlia, che scatta quando sta per disegnare davvero.
      var scopri = function () {
        if (String(mio) !== String(f.dataset.gen)) return;
        f.classList.remove("muto");
        void f.offsetWidth;             // senza il ricalcolo la dissolvenza non parte
        f.classList.add("on");
      };
      var w = null;
      try { w = f.contentWindow; } catch (e) {}
      if (w && w.requestAnimationFrame) w.requestAnimationFrame(function () { w.requestAnimationFrame(scopri); });
      else requestAnimationFrame(function () { requestAnimationFrame(scopri); });
    };
    f.src = eng + "?d=" + b64url(j.dati || {}) + "&n=" + j.playNonce;
  }

  function fadeOut(L) {
    var f = frame[L]; if (!f) return;
    f.dataset.gen = String((+f.dataset.gen || 0) + 1);   // annulla un 'load' in arrivo
    f.classList.remove("muto");         // qui la dissolvenza SERVE: il contenuto resta
    f.classList.remove("on");
    f.classList.add("out");
    setTimeout(function () {
      f.src = "about:blank";
      f.classList.remove("out");
    }, 950);
  }

  function clearNow(L) {
    var f = frame[L]; if (!f) return;
    f.dataset.gen = String((+f.dataset.gen || 0) + 1);
    f.classList.add("muto");            // via subito, senza far vedere il bianco
    f.classList.remove("on", "out");
    f.src = "about:blank";
  }

  // Applica lo stato di UN livello. Non tocca gli altri: e' tutto il punto.
  function applica(L, st) {
    if (!st || st.playNonce == null || st.playNonce === ultimo[L]) return;
    var prima = ultimo[L] === undefined;
    ultimo[L] = st.playNonce;
    // al primo giro: se c'e' una grafica in onda la rimostro (ripresa dopo un
    // riavvio dell'input vMix), altrimenti resto trasparente
    if (prima && primaVolta && st.state !== "play") { clearNow(L); return; }
    if (st.state === "play" && st.dati) play(L, st);
    else if (st.state === "out") fadeOut(L);
    else clearNow(L);
  }

  function tick() {
    fetch(PONTE + "?regia=1&canale=" + CANALE, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j) return;
        if (j.liv) {
          // ponte aggiornato: ogni livello ha il suo stato
          for (var L = 1; L <= NLIV; L++) applica(L, j.liv[L] || j.liv[String(L)]);
        } else {
          // ponte non ancora aggiornato: si comporta come prima, tutto sul
          // livello 1. Cosi' la pagina nuova funziona anche col ponte vecchio.
          applica(1, j);
        }
        primaVolta = false;
      })
      .catch(function () {});
  }

  setInterval(tick, POLL_MS);
  tick();
})();
</script>
</body>
</html>
