<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafiche Live · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    color-scheme:dark;
    --navy-900:#0A0F24;--navy-850:#0E1430;--navy-800:#141B3C;--navy-700:#20284E;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;
    --ivory:#F5F1E6;--ivory-dim:#D8D2C2;--fg-3:#8A8B96;
    --surface-panel:rgba(16,22,48,.66);
    --line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
  }
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;
    color:var(--ivory);min-height:100vh;
    background-color:#0A0F24;
    background-image:
      radial-gradient(90% 70% at 20% 8%, rgba(36,64,138,.5), transparent 55%),
      radial-gradient(80% 80% at 92% 108%, rgba(201,162,75,.16), transparent 55%),
      linear-gradient(165deg,#141B3C 0%,#0E1430 48%,#0A0F24 100%);
    background-attachment:fixed;
    padding-bottom:90px;
  }

  .nav{min-height:58px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:18px;
    padding:0 clamp(20px,4vw,56px);background:rgba(10,15,36,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2);}
  .nav-brand{font-family:'Mazzard',system-ui,sans-serif;font-size:12px;font-weight:800;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ivory);text-decoration:none;white-space:nowrap;}
  .nav-sep{color:rgba(245,241,230,.25);}
  .nav-here{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:rgba(245,241,230,.45);}
  .nav-links{margin-left:auto;display:flex;gap:10px;}
  .nav-links a{font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ivory-dim);text-decoration:none;
    padding:7px 14px;border:1px solid var(--line-2);border-radius:4px;}
  .nav-links a:hover{color:var(--gold-bright);border-color:var(--line-gold);}

  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,3vw,32px);}

  header.page{padding:56px 0 10px;text-align:center;}
  .eyebrow{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
  h1{font-family:'Mazzard',system-ui,sans-serif;font-weight:800;font-size:clamp(36px,5.5vw,58px);
    line-height:.93;letter-spacing:-.02em;text-transform:uppercase;color:var(--ivory);}

  /* ─── plancia pulsanti ─── */
  .launcher{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(26px,4vw,48px);
    padding:54px 0 20px;}
  a.tool{display:flex;flex-direction:column;align-items:center;gap:16px;
    text-decoration:none;color:inherit;width:170px;}
  .tool-btn{width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-panel);
    border:2px solid var(--line-gold);
    box-shadow:0 6px 26px rgba(0,0,0,.45), inset 0 0 34px rgba(201,162,75,.07);
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;}
  a.tool:hover .tool-btn{border-color:var(--gold);transform:translateY(-4px);
    box-shadow:0 12px 34px rgba(0,0,0,.55), 0 0 26px rgba(201,162,75,.28), inset 0 0 34px rgba(201,162,75,.12);}
  a.tool:active .tool-btn{transform:translateY(-1px);}
  .tool-btn svg{width:74px;height:74px;display:block;}
  .tool-name{font-family:'Mazzard',system-ui,sans-serif;font-size:14px;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ivory);text-align:center;}
  a.tool:hover .tool-name{color:var(--gold-bright);}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="../index.html">COMO TV</a>
  <span class="nav-sep">·</span>
  <span class="nav-here">Grafiche Live</span>
  <div class="nav-links">
    <a href="../index.html">Home</a>
  </div>
</nav>

<div class="wrap">

  <header class="page">
    <div class="eyebrow">Como TV · Produzione</div>
    <h1>Grafiche Live</h1>
  </header>

  <div class="launcher">

    <a class="tool" href="classifiche-campionati.html">
      <span class="tool-btn">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- podio classifica -->
          <rect x="24" y="18" width="16" height="30" rx="1.5" fill="#C9A24B"/>
          <rect x="6"  y="28" width="16" height="20" rx="1.5" fill="rgba(245,241,230,.85)"/>
          <rect x="42" y="34" width="16" height="14" rx="1.5" fill="rgba(245,241,230,.55)"/>
          <text x="32" y="31" text-anchor="middle" font-family="Mazzard, sans-serif" font-size="11" font-weight="800" fill="#0A0F24">1</text>
          <text x="14" y="41" text-anchor="middle" font-family="Mazzard, sans-serif" font-size="11" font-weight="800" fill="#0A0F24">2</text>
          <text x="50" y="45" text-anchor="middle" font-family="Mazzard, sans-serif" font-size="11" font-weight="800" fill="#0A0F24">3</text>
          <line x1="4" y1="52" x2="60" y2="52" stroke="#C9A24B" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="tool-name">Classifiche</span>
    </a>

    <a class="tool" href="formazioni.html">
      <span class="tool-btn">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- campo con modulo -->
          <rect x="6" y="10" width="52" height="44" rx="3" stroke="rgba(245,241,230,.8)" stroke-width="2"/>
          <line x1="32" y1="10" x2="32" y2="54" stroke="rgba(245,241,230,.45)" stroke-width="1.6"/>
          <circle cx="32" cy="32" r="6.5" stroke="rgba(245,241,230,.45)" stroke-width="1.6"/>
          <circle cx="13" cy="32" r="3.4" fill="#C9A24B"/>
          <circle cx="21" cy="21" r="3.4" fill="#C9A24B"/>
          <circle cx="21" cy="43" r="3.4" fill="#C9A24B"/>
          <circle cx="27" cy="32" r="3.4" fill="#C9A24B"/>
          <circle cx="43" cy="17" r="3.4" fill="rgba(245,241,230,.85)"/>
          <circle cx="40" cy="32" r="3.4" fill="rgba(245,241,230,.85)"/>
          <circle cx="43" cy="47" r="3.4" fill="rgba(245,241,230,.85)"/>
          <circle cx="51" cy="24" r="3.4" fill="rgba(245,241,230,.85)"/>
          <circle cx="51" cy="40" r="3.4" fill="rgba(245,241,230,.85)"/>
        </svg>
      </span>
      <span class="tool-name">Formazioni</span>
    </a>

  </div>

</div>

</body>
</html>
