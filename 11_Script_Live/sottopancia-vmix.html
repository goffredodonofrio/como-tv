<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottopancia · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  /* sottopancia = overlay: la pagina è TRASPARENTE (in vMix si vede il programma).
     color-scheme:dark allineato all'embedder, altrimenti Chrome rende
     l'iframe opaco quando gli schemi non coincidono. */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;
  }

  /* geometrie e corpi misurati al pixel sul ProRes di reference:
     barra x129 w8, pannello x137 w>=595 h120, testi a 20px dal bordo,
     cap del kicker a y21, del nome a y51, del ruolo a y97 (dal top pannello).
     Il pannello è semitrasparente (alpha ~.82). */
  #panel{
    position:absolute;left:137px;bottom:52px;min-width:595px;max-width:1100px;height:120px;
    background:linear-gradient(180deg,
      rgba(87,90,107,.85) 0%, rgba(62,66,84,.84) 17%,
      rgba(36,41,60,.82) 33%, rgba(40,44,63,.82) 70%, rgba(44,48,67,.82) 100%);
    clip-path:inset(0 100% 0 0);
  }
  #bar{
    position:absolute;left:129px;bottom:52px;width:8px;height:120px;
    background:linear-gradient(180deg,#C9A24B 0%,#AC8C47 100%);
    transform:scaleY(0);transform-origin:bottom center;
  }
  #kicker{
    position:absolute;left:20px;top:19.4px;line-height:1;
    font-weight:700;font-size:15px;letter-spacing:5.7px;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;
    opacity:0;
  }
  #nome{
    position:absolute;left:19px;top:47.9px;line-height:1;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:45px;letter-spacing:7.8px;
    color:#F3EFE5;text-transform:uppercase;white-space:nowrap;
    opacity:0;
  }
  #job{
    position:absolute;left:20px;top:95.5px;line-height:1;
    font-weight:700;font-size:15px;letter-spacing:5.8px;
    color:#E3E0D8;white-space:nowrap;
    opacity:0;
  }

  @keyframes panelIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes barIn   { to { transform:scaleY(1); } }
  @keyframes riseIn  {
    0%   { opacity:0; transform:translateY(14px); }
    100% { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bar"></div>
  <div id="panel">
    <span id="kicker"></span>
    <span id="nome"></span>
    <span id="job"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  // dati: ?d=<b64 {k: occhiello, n: nome, j: ruolo}>
  var DEMO = { k: "Ospite in studio", n: "Angelo Taglieri", j: "Redazione Como TV" };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;   // aperta a mano senza dati: demo dimostrativa
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return d && d.n ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    // dati presenti ma non validi: MEGLIO NIENTE che una grafica sbagliata in onda
    document.title = "SOTTOPANCIA — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "SOTTOPANCIA " + (D.n || "").toUpperCase();

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var panel = document.getElementById("panel");
  var bar = document.getElementById("bar");
  var kk = document.getElementById("kicker");
  var nn = document.getElementById("nome");
  var jj = document.getElementById("job");

  kk.textContent = D.k || "";
  nn.textContent = D.n || "";
  jj.textContent = D.j || "";

  // il pannello si allarga col nome (mai più stretto della reference: 595px)
  requestAnimationFrame(function () {
    var w = Math.max(595, nn.scrollWidth + 60);
    panel.style.width = Math.min(1100, w) + "px";
  });

  if (STILL) {
    panel.style.clipPath = "inset(0 0 0 0)";
    bar.style.transform = "scaleY(1)";
    kk.style.opacity = nn.style.opacity = jj.style.opacity = 1;
  } else {
    bar.style.animation = "barIn .35s cubic-bezier(.2,.7,.3,1) .1s forwards";
    panel.style.animation = "panelIn .5s cubic-bezier(.2,.7,.3,1) .28s forwards";
    kk.style.animation = "riseIn .45s ease .62s forwards";
    nn.style.animation = "riseIn .5s ease .74s forwards";
    jj.style.animation = "riseIn .45s ease .88s forwards";
  }

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
</body>
</html>
