<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio (un vecchio segnalibro, un input vMix non aggiornato) comanderebbe
   un sistema che nessuno ascolta, e le grafiche non andrebbero in onda.
   Da GitHub si viene quindi portati sulla macchina giusta. Sulla VM questo
   non fa nulla. Se l'indirizzo della macchina cambia, va cambiato anche qui. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  // il percorso su GitHub (/como-tv/...) e' identico a quello sul dominio:
  // si cambia solo la casa
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Match · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  /* input vMix DEDICATO alla partita: trasparente, convive col layer
     grafiche. color-scheme:dark come gli altri motori. */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;
  }

  /* ── scorebug (in alto a sinistra, stile Como TV) ── */
  /* Lo scoreboard entra in dissolvenza e se ne va in dissolvenza, come le
     altre grafiche: prima compariva e spariva di scatto (display:none),
     ed era l'unico elemento a farlo. La visibilita' cambia solo a
     dissolvenza finita, cosi' l'uscita si vede tutta. */
  #bug{position:absolute;left:64px;top:46px;height:58px;display:flex;
    align-items:stretch;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));
    opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:opacity .40s ease, transform .40s ease, visibility 0s linear .40s;}
  #bug.on{opacity:1;visibility:visible;transform:none;
    transition:opacity .55s cubic-bezier(.2,.7,.3,1),
               transform .55s cubic-bezier(.2,.7,.3,1), visibility 0s;}
  #bugbar{width:6px;background:linear-gradient(180deg,#C9A24B 0%,#AC8C47 100%);
    border-radius:3px 0 0 3px;}
  #bugclock{display:flex;align-items:center;gap:10px;padding:0 18px;
    background:linear-gradient(180deg,rgba(30,35,54,.94) 0%,rgba(16,21,40,.94) 100%);}
  #clock{font-family:'Mazzard',sans-serif;font-weight:700;font-size:27px;color:#F5F1E6;
    font-variant-numeric:tabular-nums;letter-spacing:.03em;min-width:78px;text-align:center;}
  #rec{display:none;font-family:'Mazzard',sans-serif;font-weight:800;font-size:17px;
    color:#10152A;background:#C9A24B;border-radius:4px;padding:3px 8px;}
  #rec.on{display:block;}
  #bugteams{display:flex;align-items:center;gap:0;
    background:linear-gradient(180deg,rgba(60,64,82,.92) 0%,rgba(26,31,51,.94) 55%,rgba(22,27,47,.94) 100%);
    border-radius:0 6px 6px 0;padding:0 20px;}
  .tm{display:flex;align-items:center;gap:9px;}
  .tm .sw{width:5px;height:26px;border-radius:2.5px;}
  .tm .sg{font-family:'Mazzard',sans-serif;font-weight:800;font-size:26px;color:#FFFFFF;
    letter-spacing:.05em;}
  /* espulsioni: un cartellino rosso accanto alla sigla, col numero se
     sono piu' di uno. Sparisce da solo quando non ce ne sono. */
  .rc{display:none;align-items:center;margin:0 3px;}
  .rc.on{display:inline-flex;}
  /* il numero sta DENTRO il cartellino: fuori si confondeva col punteggio */
  .rc i{display:flex;align-items:center;justify-content:center;
    width:15px;height:21px;border-radius:2.5px;background:#E51B20;
    box-shadow:0 1px 3px rgba(0,0,0,.5);
    font-family:'Mazzard',sans-serif;font-style:normal;font-weight:800;
    font-size:12px;color:#FFFFFF;line-height:1;}
  #score{font-family:'Mazzard',sans-serif;font-weight:800;font-size:29px;color:#C9A24B;
    font-variant-numeric:tabular-nums;letter-spacing:.05em;padding:0 18px;}

  /* ── card partita (presentazione · intervallo · finale) ──
     Bucata: il campo si vede attraverso. Entra in dissolvenza, con un
     respiro verso l'alto. Struttura della reference, peso molto minore. */
  #full{position:absolute;left:50%;top:50%;width:1120px;
    transform:translate(-50%,-50%);
    opacity:0;visibility:hidden;
    border-radius:12px;overflow:hidden;
    background:linear-gradient(180deg, rgba(20,29,66,.80) 0%, rgba(10,15,38,.86) 100%);
    box-shadow:0 24px 64px rgba(0,0,0,.45), inset 0 0 0 1px rgba(245,241,230,.10);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  #full.on{visibility:visible;animation:cardIn .55s cubic-bezier(.2,.7,.3,1) forwards;}
  #full.out{animation:cardOut .40s ease forwards;}

  @keyframes cardIn {
    0%   { opacity:0; transform:translate(-50%,calc(-50% + 26px)); }
    100% { opacity:1; transform:translate(-50%,-50%); }
  }
  @keyframes cardOut {
    0%   { opacity:1; transform:translate(-50%,-50%); }
    100% { opacity:0; transform:translate(-50%,calc(-50% - 14px)); }
  }

  /* fascia in alto: competizione e giornata, in oro su velo scuro */
  #fgiornata{text-align:center;padding:16px 24px 12px;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:22px;letter-spacing:.28em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
  #fstadio{text-align:center;padding:0 24px 16px;
    font-family:'DM Sans',sans-serif;font-weight:500;font-size:19px;letter-spacing:.16em;
    color:rgba(245,241,230,.62);text-transform:uppercase;white-space:nowrap;overflow:hidden;}
  #fstadio.vuoto{display:none;}

  /* corpo: nessun fondo pieno, solo un filo d'oro sopra e sotto */
  /* Stemmi e nomi condividono la STESSA griglia a tre colonne: prima gli
     stemmi stavano in tre colonne centrate e i nomi in due meta', quindi i
     centri cadevano a 35px di distanza e le squadre risultavano storte
     rispetto al proprio stemma. */
  #fcorpo{position:relative;display:grid;grid-template-columns:1fr 340px 1fr;
    align-items:center;
    padding:34px 30px 30px;
    border-top:1px solid rgba(201,162,75,.30);}
  .fstemma{display:flex;align-items:center;justify-content:center;}
  .fstemma img{width:152px;height:152px;object-fit:contain;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));}
  /* squadre senza stemma (giovanili): scudetto con la sigla */
  .fsigla{width:126px;height:146px;display:flex;align-items:center;justify-content:center;
    border-radius:12px 12px 46% 46%;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:44px;color:#FFFFFF;
    letter-spacing:.04em;text-shadow:0 3px 10px rgba(0,0,0,.55);
    box-shadow:inset 0 0 0 3px rgba(245,241,230,.75), 0 8px 22px rgba(0,0,0,.5);}

  #fcentro{text-align:center;}
  #fpunteggio{font-family:'Mazzard',sans-serif;font-weight:800;font-size:96px;color:#C9A24B;
    font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1;
    text-shadow:0 4px 20px rgba(0,0,0,.55);}
  #fpunteggio.vs{font-size:56px;color:rgba(245,241,230,.85);letter-spacing:.22em;}
  #fcrono{margin-top:10px;font-family:'Mazzard',sans-serif;font-weight:700;font-size:28px;
    color:rgba(245,241,230,.78);font-variant-numeric:tabular-nums;letter-spacing:.12em;}
  #fetichetta{display:inline-block;margin-top:12px;padding:5px 18px;border-radius:4px;
    border:1px solid rgba(201,162,75,.55);color:#C9A24B;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:16px;letter-spacing:.24em;
    text-transform:uppercase;}
  #fetichetta.vuoto{display:none;}

  /* fascia coi nomi: velo chiarissimo, filo d'oro di separazione */
  #fnomi{display:grid;grid-template-columns:1fr 340px 1fr;align-items:stretch;
    padding:0 30px;
    border-top:1px solid rgba(201,162,75,.30);
    background:rgba(245,241,230,.06);}
  #fnomi div{text-align:center;padding:18px 10px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:32px;letter-spacing:.04em;
    color:#F5F1E6;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* il filo verticale sta al centro della colonna di mezzo */
  #fnomi .sep{justify-self:center;width:1px;padding:0;background:rgba(245,241,230,.16);}

  /* ── cartello RADIOCRONACA ──
     Va in onda quando la partita e' solo audio: copre tutto lo schermo
     con il suo fondo, come nella reference del Panda. */
  #radio{position:absolute;left:0;top:0;width:1920px;height:1080px;
    opacity:0;visibility:hidden;overflow:hidden;
    background:linear-gradient(160deg,#10173A 0%,#0A1026 45%,#070B1D 100%);}
  /* un alone morbido che deriva sul fondo: il blu non e' mai piatto */
  #radioglow{position:absolute;left:0;top:0;width:1920px;height:1080px;
    pointer-events:none;z-index:0;
    background:
      radial-gradient(46% 46% at 32% 26%, rgba(38,66,150,.55), transparent 62%),
      radial-gradient(52% 52% at 70% 78%, rgba(24,40,96,.6), transparent 64%);
    animation:radioGlow 26s ease-in-out infinite alternate;}
  @keyframes radioGlow {
    0%   { transform:translate(-4%,-3%) scale(1.05); }
    100% { transform:translate(5%,4%)  scale(1.12); }
  }
  #radio.on{visibility:visible;animation:radioIn .6s ease forwards;}
  #radio.out{animation:radioOut .4s ease forwards;}
  @keyframes radioIn { to { opacity:1; } }
  @keyframes radioOut { from { opacity:1; } to { opacity:0; } }

  #radiorow{position:absolute;left:50%;top:400px;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:110px;}
  /* la polvere di stelle sta dietro il contenuto del cartello */
  #radiodust{position:absolute;left:0;top:0;width:1920px;height:1080px;
    pointer-events:none;opacity:.9;}
  #radiorow,#radioclock,#radiosotto{position:absolute;z-index:2;}
  .rball{position:relative;width:400px;height:400px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 32% 24%, rgba(38,52,104,.85), rgba(11,17,40,.95) 66%);
    box-shadow:0 26px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(245,241,230,.07);}
  /* la sfera respira: un leggero zoom in / zoom out, lento */
  .rball{animation:radioPulsa 4.2s ease-in-out infinite;}
  @keyframes radioPulsa {
    0%,100% { transform:scale(1); }
    50%     { transform:scale(1.055); }
  }
  /* dietro alla sfera un alone d'oro che respira con lei */
  .rball::before{content:"";position:absolute;left:50%;top:50%;
    width:122%;height:122%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,75,.42) 0%, rgba(201,162,75,.14) 46%, transparent 68%);
    z-index:-1;animation:radioAlone 4.2s ease-in-out infinite;}
  @keyframes radioAlone {
    0%,100% { opacity:.3; }
    50%     { opacity:.95; }
  }
  .rball img{width:230px;height:230px;object-fit:contain;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));}
  .rball .fsigla{transform:scale(1.4);}
  #radiomid{display:flex;align-items:center;gap:44px;}
  .rnum{font-family:'Mazzard',sans-serif;font-weight:800;font-size:150px;line-height:1;
    color:#F5F1E6;font-variant-numeric:tabular-nums;
    text-shadow:0 6px 26px rgba(0,0,0,.5);}
  #radiovs{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:54px;
    color:#C9A24B;padding-bottom:10px;}
  #radioclock{position:absolute;left:50%;top:640px;transform:translateX(-50%);
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:30px;letter-spacing:.14em;
    color:rgba(245,241,230,.75);font-variant-numeric:tabular-nums;}
  #radioclock.vuoto{display:none;}

  #radiosotto{position:absolute;left:50%;top:730px;transform:translateX(-50%);
    text-align:center;width:1200px;}
  #radiocomp{font-family:'Mazzard',sans-serif;font-weight:700;font-size:27px;letter-spacing:.3em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;}
  #radiofilo{margin:18px auto 0;width:300px;height:2px;
    background:linear-gradient(90deg,transparent,#C9A24B,transparent);}
  #radiochi{margin-top:22px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:29px;
    letter-spacing:.2em;color:rgba(245,241,230,.82);text-transform:uppercase;white-space:nowrap;}
  #radiochi b{font-family:'Mazzard',sans-serif;font-weight:800;color:#F5F1E6;}
  #radiochi.vuoto{display:none;}

  /* ── dentro la radiocronaca: chi ha segnato e cosa sta succedendo ──
     Il cartello copre tutto lo schermo, quindi le grafiche degli eventi
     ci finiscono dietro: qui la partita se la racconta da sola. I
     marcatori stanno ai lati, sotto ai due punteggi, e l'evento del
     momento — gol, sostituzione, cartellino — passa in una striscia in
     basso, con le stesse parole che si leggono in onda sul video. */
  #radiomarc{position:absolute;left:50%;top:812px;transform:translateX(-50%);
    width:1520px;display:flex;justify-content:space-between;gap:70px;z-index:2;}
  #radiomarc .col{flex:1 1 0;display:flex;flex-direction:column;gap:10px;min-width:0;}
  #radiomarc .col.b{align-items:flex-end;text-align:right;}
  #radiomarc .m{font-family:'DM Sans',sans-serif;font-weight:500;font-size:27px;line-height:1.1;
    color:rgba(245,241,230,.82);white-space:nowrap;}
  #radiomarc .m i{font-style:normal;font-family:'Mazzard',sans-serif;font-weight:700;
    color:#C9A24B;margin-right:12px;font-variant-numeric:tabular-nums;}
  #radiomarc .col.b .m i{margin:0 0 0 12px;}
  #radiomarc .m b{font-family:'Mazzard',sans-serif;font-weight:800;color:#F5F1E6;}
  #radiomarc .m small{font-size:20px;color:#8A8B96;margin-left:9px;}
  /* il pallone di chi ha segnato, in riga col nome */
  #radiomarc .m .pallone{width:27px;height:27px;vertical-align:-5px;margin-right:10px;flex:none;}
  #radiomarc .col.b .m .pallone{margin:0 0 0 9px;order:1;}
  /* a destra il minuto va dopo il nome: si sposta l'elemento, non il verso
     del testo (con direction:rtl l'apostrofo finiva prima del numero) */
  #radiomarc .col.b .m{display:flex;align-items:baseline;justify-content:flex-end;}
  #radiomarc .col.b .m i{order:2;}

  /* ── il campetto della radiocronaca ─────────────────────────────────
     Il pallone si muove dove sta l'azione: le coordinate sono quelle delle
     giocate ESPN, non un tracciamento (quello non lo pubblica nessuno).
     Col campetto acceso il cartello si stringe: le due sfere salgono e
     rimpiccioliscono, i marcatori lasciano il posto al campo. */
  #radiocampo{position:absolute;left:50%;top:400px;transform:translateX(-50%);
    width:1200px;height:529px;z-index:2;display:none;}
  #radio.conCampo #radiocampo{display:block;}
  #radiocampo svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 26px 60px rgba(0,0,0,.45));}
  /* la fascia dei dati: una scheda alla volta, e cambia da sola */
  /* la fascia dei dati: una scheda alla volta, e cambia da sola.
     La barra cresce dal centro verso le due squadre, cosi' si vede da
     che parte pende il dato senza leggere i numeri. */
  #rcdati{position:absolute;left:0;right:0;top:100%;margin-top:14px;padding:15px 30px 17px;
    border-radius:14px;background:rgba(10,15,36,.82);border:1px solid rgba(201,162,75,.28);
    opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;}
  #rcdati.on{opacity:1;transform:none;}
  #rcdati .tit{font-family:'Mazzard',sans-serif;font-weight:700;font-size:14px;letter-spacing:.22em;
    text-transform:uppercase;color:#C9A24B;text-align:center;margin-bottom:11px;}
  #rcdati .riga{display:flex;align-items:center;gap:18px;}
  #rcdati .sq{display:flex;align-items:center;gap:9px;width:132px;}
  #rcdati .sq.b{justify-content:flex-end;}
  #rcdati .sq i{width:13px;height:13px;border-radius:50%;flex:none;
    box-shadow:0 0 0 2px rgba(245,241,230,.25);}
  #rcdati .sq b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:21px;letter-spacing:.05em;
    text-transform:uppercase;color:#F5F1E6;}
  #rcdati .val{font-family:'Mazzard',sans-serif;font-weight:800;font-size:31px;color:#F5F1E6;
    white-space:nowrap;font-variant-numeric:tabular-nums;min-width:74px;}
  #rcdati .val.b{text-align:right;}
  #rcdati .val em{font-style:normal;font-family:'DM Sans',sans-serif;font-weight:600;font-size:19px;
    color:rgba(245,241,230,.6);margin-left:7px;}
  /* la barra: due metà che partono dal centro */
  #rcdati .duo{flex:1;display:flex;align-items:center;height:16px;gap:3px;min-width:120px;}
  #rcdati .duo .lato{flex:1;height:100%;display:flex;border-radius:8px;overflow:hidden;
    background:rgba(245,241,230,.1);}
  #rcdati .duo .lato.a{justify-content:flex-end;}
  #rcdati .duo .lato u{display:block;height:100%;text-decoration:none;transition:width .7s cubic-bezier(.3,.8,.4,1);}
  /* i tre terzi del campo, per "dove si sta giocando" */
  #rcdati .terzi{flex:1;display:flex;height:16px;border-radius:8px;overflow:hidden;
    background:rgba(245,241,230,.1);}
  #rcdati .terzi u{display:block;height:100%;text-decoration:none;transition:width .7s ease;}
  #rcdati .solo{display:flex;align-items:center;justify-content:center;gap:13px;}
  #rcdati .solo i{width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 2px rgba(245,241,230,.25);}
  #rcdati .solo b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:31px;color:#F5F1E6;
    letter-spacing:.02em;}
  #rcdati .solo span{font-family:'DM Sans',sans-serif;font-weight:600;font-size:23px;
    color:rgba(245,241,230,.65);}
  #rcdati .sotto{margin-top:9px;display:flex;justify-content:space-between;
    font-family:'DM Sans',sans-serif;font-size:17px;color:rgba(245,241,230,.55);}
  #radio.conCampo #radiorow{top:176px;transform:translate(-50%,-50%) scale(.48);}
  #radio.conCampo #radioclock{top:276px;font-size:26px;}
  #radio.conCampo #radiosotto{top:314px;}
  #radio.conCampo #radiofilo{margin-top:10px;}
  /* i marcatori non spariscono col campetto: si mettono ai lati, uno
     per squadra, all'altezza del campo - chi ha segnato si legge sempre */
  #radio.conCampo #radiomarc{top:470px;width:1840px;gap:0;align-items:flex-start;}
  #radio.conCampo #radiomarc .col{max-width:300px;gap:9px;}
  #radio.conCampo #radiomarc .m{font-size:23px;overflow:hidden;text-overflow:ellipsis;}
  #radio.conCampo #radiomarc .m i{margin-right:9px;}
  #radio.conCampo #radiomarc .col.b .m i{margin:0 0 0 9px;}
  #radio.conCampo #radiomarc .m small{font-size:17px;}
  #radio.conCampo #radioev{top:1004px;}

  #radioev{position:absolute;left:50%;top:958px;transform:translateX(-50%) translateY(14px);
    z-index:3;display:flex;align-items:center;gap:26px;padding:18px 34px;border-radius:14px;
    background:rgba(10,15,36,.72);border:1px solid rgba(201,162,75,.35);
    opacity:0;transition:opacity .32s ease, transform .32s cubic-bezier(.2,.7,.3,1);}
  #radioev.on{opacity:1;transform:translateX(-50%) translateY(0);}
  #radioev .sw{width:8px;align-self:stretch;border-radius:4px;background:#8A8B96;}
  #radioev .min{font-family:'Mazzard',sans-serif;font-weight:800;font-size:38px;color:#C9A24B;
    font-variant-numeric:tabular-nums;}
  #radioev .lab{font-family:'Mazzard',sans-serif;font-weight:700;font-size:22px;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(245,241,230,.7);}
  #radioev .chi{font-family:'Mazzard',sans-serif;font-weight:800;font-size:38px;color:#F5F1E6;
    white-space:nowrap;}
  #radioev .chi em{font-style:normal;font-weight:500;font-family:'DM Sans',sans-serif;
    font-size:26px;color:rgba(245,241,230,.6);margin:0 10px;}

  /* ── RECAP RISULTATO: la barra bassa dopo un gol ──
     Due metà coi colori delle squadre, il punteggio in mezzo su navy e
     oro, un filo dorato che le divide. Entra da sotto. */
  #recap{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(40px);
    display:flex;align-items:stretch;height:150px;opacity:0;visibility:hidden;
    border-radius:14px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.5), inset 0 0 0 1px rgba(245,241,230,.10);}
  #recap.on{visibility:visible;animation:recapIn .55s cubic-bezier(.2,.7,.3,1) forwards;}
  #recap.out{animation:recapOut .4s ease forwards;}
  @keyframes recapIn { to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes recapOut { from { opacity:1; } to { opacity:0; transform:translateX(-50%) translateY(-18px); } }

  .rcpteam{display:flex;align-items:center;gap:22px;padding:0 34px;min-width:520px;
    background:linear-gradient(180deg, rgba(20,29,66,.92), rgba(10,15,38,.94));}
  .rcpteam.casa{flex-direction:row;}
  .rcpteam.osp{flex-direction:row-reverse;text-align:right;}
  .rcpteam .rcpstemma{width:96px;height:96px;flex:none;display:flex;align-items:center;justify-content:center;}
  .rcpteam .rcpstemma img{width:96px;height:96px;object-fit:contain;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
  .rcpteam .rcpsig{width:78px;height:92px;display:flex;align-items:center;justify-content:center;
    border-radius:10px 10px 42% 42%;font-family:'Mazzard',sans-serif;font-weight:800;font-size:30px;
    color:#FFF;letter-spacing:.03em;box-shadow:inset 0 0 0 3px rgba(245,241,230,.7);}
  .rcpteam .rcpnome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:38px;letter-spacing:.02em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;line-height:1.02;}
  /* la striscia colorata del club, sul bordo interno verso il centro */
  .rcpteam .rcpbarra{position:absolute;top:0;bottom:0;width:8px;}
  .rcpteam.casa{position:relative;} .rcpteam.osp{position:relative;}
  .rcpteam.casa .rcpbarra{right:0;} .rcpteam.osp .rcpbarra{left:0;}

  .rcpscore{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 30px;background:linear-gradient(180deg,#12193C,#0A1026);
    border-left:2px solid rgba(201,162,75,.55);border-right:2px solid rgba(201,162,75,.55);}
  .rcpscore .rcpnum{font-family:'Mazzard',sans-serif;font-weight:800;font-size:70px;line-height:1;
    color:#C9A24B;font-variant-numeric:tabular-nums;letter-spacing:.04em;
    text-shadow:0 3px 14px rgba(0,0,0,.55);white-space:nowrap;}
  .rcpscore .rcpsub{margin-top:6px;font-family:'Mazzard',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:.26em;color:rgba(245,241,230,.72);text-transform:uppercase;white-space:nowrap;}
  .rcpscore .rcpsub.vuoto{display:none;}

  /* ── MARCATORE: la coda dello scoreboard dopo un gol ──
     Una striscia che esce da sotto lo scoreboard, con la stessa barra
     d'oro e lo stesso fondo: chi ha segnato, e al minuto. Vive solo se lo
     scoreboard e' acceso — e' un pezzo suo, non una grafica a se'. */
  #gs{position:absolute;left:64px;top:110px;height:46px;display:flex;align-items:stretch;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));
    opacity:0;visibility:hidden;transform:translateY(-14px);
    transition:opacity .32s ease, transform .32s ease, visibility 0s linear .32s;}
  #gs.on{opacity:1;visibility:visible;transform:none;
    transition:opacity .5s cubic-bezier(.2,.7,.3,1) .05s,
               transform .5s cubic-bezier(.2,.7,.3,1) .05s, visibility 0s;}
  #gsbar{width:6px;background:linear-gradient(180deg,#C9A24B 0%,#AC8C47 100%);
    border-radius:0 0 0 3px;}
  #gsbody{display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;
    background:linear-gradient(180deg,rgba(26,31,51,.94) 0%,rgba(16,21,40,.95) 100%);
    border-radius:0 0 6px 0;border-top:1px solid rgba(201,162,75,.28);}
  #gsball{width:22px;height:22px;flex:none;}
  #gssw{width:5px;height:24px;border-radius:2.5px;flex:none;}
  #gslab{font-family:'Mazzard',sans-serif;font-weight:800;font-size:13px;letter-spacing:.22em;
    color:#C9A24B;text-transform:uppercase;}
  #gsnum{font-family:'Mazzard',sans-serif;font-weight:800;font-size:22px;color:#C9A24B;
    font-variant-numeric:tabular-nums;}
  #gsnum:empty{display:none;}
  #gscog{font-family:'Mazzard',sans-serif;font-weight:800;font-size:22px;color:#F5F1E6;
    letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
  #gsnome{font-family:'DM Sans',sans-serif;font-weight:500;font-size:15px;color:rgba(245,241,230,.62);
    white-space:nowrap;margin-left:-4px;}
  #gsnome:empty{display:none;}
  #gsmin{font-family:'Mazzard',sans-serif;font-weight:700;font-size:20px;color:#F5F1E6;
    font-variant-numeric:tabular-nums;padding-left:12px;margin-left:2px;
    border-left:1px solid rgba(245,241,230,.18);white-space:nowrap;}

  /* ── EVENTO: sostituzione e cartellino, in basso a sinistra ──
     Stesso linguaggio dello scoreboard: barra d'oro, blocco scuro col tipo
     di evento, corpo coi giocatori. Entra da sinistra e se ne va da sola. */
  #ev{position:absolute;left:64px;bottom:118px;display:flex;align-items:stretch;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));
    opacity:0;visibility:hidden;transform:translateX(-28px);
    transition:opacity .34s ease, transform .34s ease, visibility 0s linear .34s;}
  #ev.on{opacity:1;visibility:visible;transform:none;
    transition:opacity .5s cubic-bezier(.2,.7,.3,1),
               transform .5s cubic-bezier(.2,.7,.3,1), visibility 0s;}
  #evbar{width:8px;background:linear-gradient(180deg,#C9A24B 0%,#AC8C47 100%);
    border-radius:4px 0 0 4px;}
  #evtipo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    min-width:168px;padding:0 22px;
    background:linear-gradient(180deg,#141B3C 0%,#0E1430 100%);
    border-right:1px solid rgba(201,162,75,.38);}
  #evico{display:flex;align-items:center;justify-content:center;height:34px;}
  #evlab{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15px;letter-spacing:.2em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;}
  #evcorpo{display:flex;flex-direction:column;justify-content:center;gap:7px;
    min-width:430px;padding:16px 34px 16px 26px;
    background:linear-gradient(180deg,rgba(60,64,82,.92) 0%,rgba(26,31,51,.94) 55%,rgba(22,27,47,.94) 100%);
    border-radius:0 8px 8px 0;}
  #evtesta{display:flex;align-items:center;gap:10px;
    font-family:'DM Sans',sans-serif;font-weight:500;font-size:14px;letter-spacing:.2em;
    color:rgba(245,241,230,.66);text-transform:uppercase;white-space:nowrap;}
  #evtesta .sw{width:5px;height:18px;border-radius:2.5px;flex:none;}
  #evtesta b{font-family:'Mazzard',sans-serif;font-weight:800;color:#F5F1E6;letter-spacing:.14em;}
  #evtesta i{font-style:normal;color:#C9A24B;font-family:'Mazzard',sans-serif;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:.06em;}
  .evr{display:flex;align-items:center;gap:14px;white-space:nowrap;}
  .evr .dir{width:30px;height:30px;border-radius:7px;flex:none;display:flex;align-items:center;
    justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45);}
  .evr .dir.fuori{background:linear-gradient(180deg,#F04E52,#C8131A);}
  .evr .dir.dentro{background:linear-gradient(180deg,#5AD69A,#2E9B62);}
  .evr .dir svg{width:16px;height:16px;}
  .evr .num{font-family:'Mazzard',sans-serif;font-weight:800;font-size:27px;color:#C9A24B;
    font-variant-numeric:tabular-nums;min-width:38px;text-align:right;}
  .evr .num:empty{display:none;}
  .evr .cog{font-family:'Mazzard',sans-serif;font-weight:800;font-size:31px;color:#F5F1E6;
    letter-spacing:.03em;text-transform:uppercase;line-height:1;}
  .evr .nome{font-family:'DM Sans',sans-serif;font-weight:500;font-size:17px;
    color:rgba(245,241,230,.62);margin-top:5px;}
  .evr .nome:empty{display:none;}
  /* i cartellini: due rettangoli, il secondo sopra al primo quando e' il
     doppio giallo, cosi' si capisce PERCHE' e' rosso */
  .cart{position:relative;width:22px;height:30px;}
  .cart i{position:absolute;left:0;top:0;width:22px;height:30px;border-radius:3px;
    box-shadow:0 2px 5px rgba(0,0,0,.5);}
  .cart i.g{background:linear-gradient(180deg,#F7DD5C,#E0BB1E);}
  .cart i.r{background:linear-gradient(180deg,#F04E52,#C8131A);}
  .cart.doppio{width:34px;}
  .cart.doppio i.g{transform:rotate(-10deg);left:0;}
  .cart.doppio i.r{transform:rotate(8deg);left:11px;}

</style>

<body>

<div id="stage">

    <div id="bugteams">
      <span class="tm"><span class="sw" id="sw1"></span><span class="sg" id="sg1">&mdash;</span><span class="rc" id="rc1"></span></span>
      <span id="score">0 - 0</span>
      <span class="tm"><span class="rc" id="rc2"></span><span class="sg" id="sg2">&mdash;</span><span class="sw" id="sw2"></span></span>
    </div>
  </div>

  <div id="full">
    <div id="fgiornata"></div>
    <div id="fstadio"></div>
    <div id="fcorpo">
      <div class="fstemma" id="fst1"></div>
      <div id="fcentro">
        <div id="fpunteggio">0 - 0</div>
        <div id="fcrono"></div>
        <div id="fetichetta"></div>
      </div>
      <div class="fstemma" id="fst2"></div>
    </div>
    <div id="fnomi">
      <div id="fnm1"></div><div class="sep"></div><div id="fnm2"></div>
    </div>

  <div id="radio">
    <div id="radioglow"></div>
    <canvas id="radiodust" width="960" height="540"></canvas>
    <div id="radiorow">
      <div class="rball" id="rb1"></div>
      <div id="radiomid">
        <span class="rnum" id="rn1">0</span>
        <span id="radiovs">vs</span>
        <span class="rnum" id="rn2">0</span>
      </div>
      <div class="rball" id="rb2"></div>
    </div>
    <div id="radioclock" class="vuoto">00:00</div>
    <div id="radiomarc"><div class="col a"></div><div class="col b"></div></div>

    <!-- il campetto: c'e' solo quando la partita e' agganciata a ESPN -->
    <div id="radiocampo"><svg id="rcampo" viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg"></svg>

  <div id="gs">
    <div id="gsbar"></div>

        <circle cx="12" cy="12" r="10.5" fill="none" stroke="#C9A24B" stroke-width="1.6"/>
        <path d="M12 6.2 L17.4 10.1 L15.3 16.4 L8.7 16.4 L6.6 10.1 Z" fill="#C9A24B"/>
        <path d="M12 6.2 L12 1.9 M17.4 10.1 L21.6 8.8 M15.3 16.4 L18 21.6 M8.7 16.4 L6 21.6 M6.6 10.1 L2.4 8.8"
              stroke="#C9A24B" stroke-width="1.6" stroke-linecap="round"/>

<script>
(function () {
  "use strict";

  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var POLL_MS = 1000;

  var CANALE = (function () {
    var c = parseInt(new URLSearchParams(location.search).get("c"), 10);
    return (c >= 1 && c <= 8) ? c : 1;
  })();

  // Il playout unico monta questa pagina due volte, una per parte, per
  // poterle mettere su livelli diversi: "solo=bug" tiene solo lo
  // scoreboard, "solo=card" solo la schermata al centro. Senza il
  // parametro la pagina resta quella di sempre, con tutte e due.
  var SOLO = (new URLSearchParams(location.search).get("solo") || "").toLowerCase();

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var S = null;        // stato corrente dal ponte
  var offset = 0;      // Date.now() - orologio server (per il cronometro)
  var cardAttiva = null; // quale schermata piena è in onda, se c'è

  var elBug = document.getElementById("bug");
  var elFull = document.getElementById("full");
  var elRadio = document.getElementById("radio");
  var elRecap = document.getElementById("recap");
  var elClock = document.getElementById("clock");
  var elRec = document.getElementById("rec");
  var elGs = document.getElementById("gs");
  var elEv = document.getElementById("ev");

  // ── eventi in campo ────────────────────────────────────────────────
  // Un evento (gol, sostituzione, cartellino) e' un oggetto nello stato
  // della partita con l'ora del ponte in cui e' stato mandato e quanto
  // deve restare. Si spegne da solo a tempo scaduto, contando sull'ora
  // del server: cosi' tutti i telai lo tolgono nello stesso istante, e
  // una console chiusa non lo lascia in onda per sempre.
  // In anteprima (?prev=) resta finche' si guarda: non c'e' niente da
  // cronometrare.
  function evAttivo(j) {
    var e = j && j.ev;
    if (!e || !e.tipo) return null;
    if (PREV) return e;
    var passato = (Date.now() - offset) - (e.ts || 0);
    return passato < (e.dur || 8) * 1000 ? e : null;
  }
  // le tre famiglie: giallo, doppio giallo e rosso sono tutti "cart"
  var EV_FAM = { gol: 1, cambio: 1, cart: 1 };
  function famiglia(e) {
    return !e || !e.tipo ? null : (e.tipo === "gol" ? "gol" : (e.tipo === "cambio" ? "cambio" : "cart"));
  }
  var SU  = '<svg viewBox="0 0 16 16"><path d="M8 2.5 L13.5 9 H10 V13.5 H6 V9 H2.5 Z" fill="#0A1A12"/></svg>';
  var GIU = '<svg viewBox="0 0 16 16"><path d="M8 13.5 L2.5 7 H6 V2.5 H10 V7 H13.5 Z" fill="#2A0A0B"/></svg>';
  function rigaGiocatore(g, dir) {
    g = g || {};
    return '<div class="evr">' +
      (dir ? '<span class="dir ' + dir + '">' + (dir === "fuori" ? GIU : SU) + '</span>' : "") +
      '<span class="num">' + escRadio(g.num || "") + '</span>' +
      '<span class="cog">' + escRadio(g.cognome || "") + '</span>' +
      '<span class="nome">' + escRadio(g.nome || "") + '</span>' +
    '</div>';
  }
  var evFirma = null;
  function disegnaEventi(j, ev, bug, lf) {
    var gol = (ev && ev.tipo === "gol") ? ev : null;
    var altro = (ev && ev.tipo !== "gol") ? ev : null;
    var firma = ev ? (ev.tipo + "|" + ev.ts) : "";
    if (firma !== evFirma) {
      evFirma = firma;
      var sq = ev ? (ev.lato === "osp" ? (j.osp || {}) : (j.casa || {})) : {};
      if (gol) {
        var g = gol.chi || {};
        document.getElementById("gssw").style.background = sq.col || "#8A8B96";
        testo("gsnum", g.num || "");
        testo("gscog", g.cognome || "");
        testo("gsnome", g.cognome ? (g.nome || "") : "");
        testo("gsmin", gol.min || "");
        testo("gslab", gol.autogol ? "Autogol" : "Gol");
      }
      if (altro) {
        var tipo = altro.tipo, ico = "", lab = "", righe = "";
        if (tipo === "cambio") {
          ico = '<svg viewBox="0 0 34 34" width="34" height="34">' +
                '<path d="M6 12 H23 M18 7 L23 12 L18 17" fill="none" stroke="#5AD69A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' +
                '<path d="M28 22 H11 M16 17 L11 22 L16 27" fill="none" stroke="#F04E52" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          lab = "Sostituzione";
          righe = rigaGiocatore(altro.fuori, "fuori") + rigaGiocatore(altro.dentro, "dentro");
        } else {
          var doppio = tipo === "doppio";
          ico = '<span class="cart' + (doppio ? " doppio" : "") + '">' +
                (tipo === "giallo" ? '<i class="g"></i>' : (doppio ? '<i class="g"></i><i class="r"></i>' : '<i class="r"></i>')) +
                '</span>';
          lab = tipo === "giallo" ? "Ammonito" : "Espulso";
          righe = rigaGiocatore(altro.chi, "");
        }
        document.getElementById("evico").innerHTML = ico;
        testo("evlab", lab);
        document.getElementById("evsw").style.background = sq.col || "#8A8B96";
        testo("evsq", sq.s || sq.n || "");
        testo("evmin", altro.min || "");
        document.getElementById("evrighe").innerHTML = righe;
      }
    }
    // ogni famiglia sul suo livello, scelto sulla riga del Player
    elGs.style.zIndex = lf.gol || 2;
    if (altro) elEv.style.zIndex = lf[famiglia(altro)] || 3;
    elGs.classList.toggle("on", !!gol);
    elEv.classList.toggle("on", !!altro);
  }

  // ── la partita dentro il cartello radiocronaca ──────────────────────
  // Gli stessi dati che in onda sul video diventano striscia e sottopancia,
  // qui stanno dentro la schermata: chi ha segnato ai lati dei punteggi,
  // e quello che sta succedendo adesso in una striscia in basso. Le parole
  // sono le stesse — Gol, Autogol, Sostituzione, Ammonito, Espulso —
  // perche' chi guarda non deve imparare due lingue.
  var radioFirmaM = null, radioFirmaE = null;
  // il pallone accanto a chi ha segnato: lo stesso segno che sta sulle
  // pedine del campetto, cerchiato di rosso quando e' un autogol
  function pallaMarcatore(autogol) {
    var bordo = autogol ? "#E5342B" : "rgba(10,15,36,.85)";
    var dentro = autogol ? "#E5342B" : "#0A0F24";
    return '<svg class="pallone" viewBox="-16 -16 32 32" aria-hidden="true">' +
           '<circle cx="0" cy="0" r="12" fill="#F5F1E6" stroke="' + bordo + '" stroke-width="' +
           (autogol ? 3.2 : 2) + '"></circle>' +
           '<path d="M0 -5.6 L5.3 -1.8 L3.3 4.6 L-3.3 4.6 L-5.3 -1.8 Z" fill="' + dentro + '"></path>' +
           "</svg>";
  }
  function radioMarcatori(j) {
    var lista = j.marcatori || [];
    var firma = JSON.stringify(lista);
    if (firma === radioFirmaM) return;
    radioFirmaM = firma;
    ["a", "b"].forEach(function (c, i) {
      var lato = i === 0 ? "casa" : "osp";
      var suoi = lista.filter(function (m) { return (m.lato || "casa") === lato; });
      var troppi = suoi.length > 4 ? suoi.length - 4 : 0;
      var h = suoi.slice(0, 4).map(function (m) {
        var g = m.chi || {};
        return '<div class="m"><i>' + escRadio(m.min || "") + "</i>" + pallaMarcatore(m.autogol) +
               "<b>" + escRadio(g.cognome || g.nome || "") + "</b>" +
               (m.autogol ? '<small>aut.</small>' : "") + "</div>";
      }).join("");
      if (troppi) h += '<div class="m"><small>e altri ' + troppi + "</small></div>";
      document.querySelector("#radiomarc .col." + c).innerHTML = h;
    });
  }
  function radioEvento(j, ev) {
    var box = document.getElementById("radioev");
    var firma = ev ? (ev.tipo + "|" + ev.ts) : "";
    if (firma !== radioFirmaE) {
      radioFirmaE = firma;
      if (ev) {
        var sq = (ev.lato === "osp" ? (j.osp || {}) : (j.casa || {}));
        var lab, chi;
        if (ev.tipo === "cambio") {
          lab = "Sostituzione";
          chi = nomeDi(ev.dentro) + '<em>entra per</em>' + nomeDi(ev.fuori);
        } else if (ev.tipo === "gol") {
          lab = ev.autogol ? "Autogol" : "Gol";
          chi = nomeDi(ev.chi);
        } else {
          lab = ev.tipo === "giallo" ? "Ammonito" : "Espulso";
          chi = nomeDi(ev.chi);
        }
        box.querySelector(".sw").style.background = sq.col || "#8A8B96";
        box.querySelector(".min").textContent = ev.min || "";
        box.querySelector(".lab").textContent = lab;
        box.querySelector(".chi").innerHTML = chi;
      }
    }

  var RC = { lega: "", ev: "", casaId: "", ospId: "", acceso: false,

    var AREA_V = (68 - 40.32) / 2 / 68, PICC_V = (68 - 18.32) / 2 / 68, PORTA_V = (68 - 7.32) / 2 / 68;

    rcNs("path", { d: rcQuad(0, 0, 1, 1), fill: "url(#rc-prof)" }, fondo);
    // le fasce del taglio d'erba, che in prospettiva si stringono

    }

    rcNs("path", { d: rcQuad(0, 0, 1, 1) }, L);
    rcNs("path", { d: rcPoli([rcP(.5, 0), rcP(.5, 1)]) }, L);

    rcNs("circle", { cx: c.x, cy: c.y, r: 3.4 * c.s, fill: "#F5F1E6", "fill-opacity": .55, stroke: "none" }, L);
    [0, 1].forEach(function (lato) {
      var k = lato ? -1 : 1, u0 = lato ? 1 : 0;
      rcNs("path", { d: rcQuad(u0, AREA_V, u0 + k * AREA, 1 - AREA_V) }, L);
      rcNs("path", { d: rcQuad(u0, PICC_V, u0 + k * PICC, 1 - PICC_V) }, L);
      var d = rcP(u0 + k * RIG, .5);
      rcNs("circle", { cx: d.x, cy: d.y, r: 3 * d.s, fill: "#F5F1E6", "fill-opacity": .55, stroke: "none" }, L);
      // l'arco davanti all'area: solo il pezzo di cerchio che sta fuori.
      // Il raggio va col verso del lato (k), cosi' l'arco guarda il centro.
      var ang = Math.acos((AREA - RIG) / CERCHIO_U);
      rcNs("path", { d: rcArco(u0 + k * RIG, .5, k * CERCHIO_U, CERCHIO_V, -ang, ang, 24) }, L);
      // la porta: due pali e la traversa, alti davvero
      var p1 = rcP(u0, PORTA_V), p2 = rcP(u0, 1 - PORTA_V);
      var h1 = 24 * p1.s, h2 = 24 * p2.s;

                        "L" + p2.x.toFixed(1) + " " + (p2.y - h2).toFixed(1) + "V" + p2.y.toFixed(1),
                     stroke: "#C9A24B", "stroke-opacity": .95, "stroke-width": 2.8 }, L);
      // la rete, appena accennata
      rcNs("path", { d: "M" + p1.x.toFixed(1) + " " + (p1.y - h1).toFixed(1) +
                        "L" + p2.x.toFixed(1) + " " + (p2.y - h2).toFixed(1) +
                        "L" + p2.x.toFixed(1) + " " + p2.y.toFixed(1) +
                        "L" + p1.x.toFixed(1) + " " + p1.y.toFixed(1) + "Z",
                     fill: "#C9A24B", "fill-opacity": .05, stroke: "none" }, L);
    });
  }
  function rcPosto(x, y, casa) {
    var u = casa ? x / 100 : 1 - x / 100;
    var v = casa ? 1 - y / 100 : y / 100;
    // le pedine sono grosse: si tengono dentro il campo, non a cavallo

    return rcP(Math.max(.03, Math.min(.97, u)), Math.max(.07, Math.min(.93, v)));

  function rcSchieraUno(rosa, modulo, casa) {

    if (!righe.length) righe = [4, 3, 3];

    if (undici.length < 11) return [];
    undici.sort(function (a, b) { return rcRuolo(a.ab) - rcRuolo(b.ab); });

      var u = u0 + passo * (r + 1);
      linea.forEach(function (g, i) {

  // ── le schede: una alla volta, sotto il campo ───────────────────────
  // Solo quelle che hanno davvero i numeri: se ESPN non manda un dato,
  // quella scheda non esiste e si passa alla prossima.
  // il nero della Juve su fondo navy non si legge: le tinte troppo scure
  // si schiariscono nella scritta e nella barra, il campo resta com'e'
  function rcChiara(col) {
    var m = String(col || "").match(/^#?([0-9a-f]{6})$/i);
    if (!m) return "#F5F1E6";
    var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    var luce = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    if (luce >= .42) return "#" + m[1];
    if (luce < .2) return "#EDE8DA";          // nero e blu notte: si va di avorio
    function su(x) { return Math.min(255, Math.round(x * 1.9 + 72)); }
    return "rgb(" + su(r) + "," + su(g) + "," + su(b) + ")";
  }
  function rcQuanti(n, uno, tanti) { return n + " " + (Math.abs(+n) === 1 ? uno : tanti); }
  function rcNum(v) { return (v === undefined || v === null || v === "") ? null : v; }
  function rcPerc(v) {
    var n = parseFloat(v);
    if (isNaN(n)) return null;
    return Math.round(n <= 1 ? n * 100 : n);
  }
  function rcSchede() {
    var c = RC.stat.casa, o = RC.stat.osp, v = [];
    // a = valore casa, b = valore ospite, pesoA/pesoB = lunghezza delle
    // due barre (0-100 ciascuna, partono dal centro)
    function conta(titolo, a, b, coda) {
      if (rcNum(a) === null || rcNum(b) === null) return;
      var max = Math.max(+a, +b, 1);
      v.push({ titolo: titolo, a: a + (coda || ""), b: b + (coda || ""),
               pesoA: +a * 100 / max, pesoB: +b * 100 / max });
    }
    var pc = rcPerc(c.possessionPct), po = rcPerc(o.possessionPct);
    if (pc !== null && po !== null) {
      v.push({ titolo: "Possesso palla", a: pc + "%", b: po + "%", pesoA: pc, pesoB: po });
    }
    if (rcNum(c.totalShots) !== null) {
      var max = Math.max(+c.totalShots, +o.totalShots, 1);
      v.push({ titolo: "Tiri", a: c.totalShots, b: o.totalShots,
               detA: (c.shotsOnTarget || 0) + " in porta", detB: (o.shotsOnTarget || 0) + " in porta",
               pesoA: +c.totalShots * 100 / max, pesoB: +o.totalShots * 100 / max });
    }
    conta("Calci d'angolo", c.wonCorners, o.wonCorners);
    var qc = rcPerc(c.passPct), qo = rcPerc(o.passPct);
    if (qc !== null && qo !== null) {
      v.push({ titolo: "Passaggi riusciti", a: c.accuratePasses, b: o.accuratePasses,
               detA: qc + "%", detB: qo + "%", pesoA: qc, pesoB: qo });
    }
    if (rcNum(c.foulsCommitted) !== null) {
      var mf = Math.max(+c.foulsCommitted, +o.foulsCommitted, 1);
      v.push({ titolo: "Falli", a: c.foulsCommitted, b: o.foulsCommitted,
               detA: +c.yellowCards ? rcQuanti(c.yellowCards, "giallo", "gialli") : "",
               detB: +o.yellowCards ? rcQuanti(o.yellowCards, "giallo", "gialli") : "",
               pesoA: +c.foulsCommitted * 100 / mf, pesoB: +o.foulsCommitted * 100 / mf });
    }
    conta("Fuorigioco", c.offsides, o.offsides);
    conta("Contrasti vinti", c.effectiveTackles, o.effectiveTackles);
    conta("Palloni recuperati", c.interceptions, o.interceptions);
    conta("Parate", c.saves, o.saves);
    var tot = RC.zone[0] + RC.zone[1] + RC.zone[2];
    if (tot > 30) {
      var d = Math.round(RC.zone[0] * 100 / tot), m = Math.round(RC.zone[1] * 100 / tot);
      v.push({ titolo: "Dove si sta giocando", terzi: [d, m, 100 - d - m] });
    }
    var top = null;
    for (var pid in RC.tocchi) if (!top || RC.tocchi[pid] > RC.tocchi[top]) top = pid;
    if (top && RC.tocchi[top] > 12 && RC.nomi[top]) {
      v.push({ titolo: "Piu' palloni toccati", solo: RC.nomi[top],
               coda: RC.tocchi[top] + " palloni", luce: top,

    }

  }
  function rcGira() {
    var box = document.getElementById("rcdati");

    if (!v.length) { box.classList.remove("on"); return; }
    if (RC.scheda >= v.length) RC.scheda = 0;

  function rcLuce(ped, si) {

  // ── la lettura ──────────────────────────────────────────────────────
  function rcLeggi() {
    if (!RC.lega || !RC.ev) return;
    var lega = RC.lega, ev = RC.ev;
    fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/" + lega + "/summary?event=" + ev, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (RC.ev !== ev) return;
        var chi = (((j.header || {}).competitions || [])[0] || {}).competitors || [];
        var casa = chi.filter(function (x) { return x.homeAway === "home"; })[0] || {};
        var osp = chi.filter(function (x) { return x.homeAway === "away"; })[0] || {};
        RC.casaId = String((casa.team || {}).id || "");
        RC.ospId = String((osp.team || {}).id || "");
        // le statistiche della partita
        ((j.boxscore || {}).teams || []).forEach(function (t) {
          var dove = String((t.team || {}).id || "") === RC.casaId ? "casa" : "osp";
          var m = {};
          (t.statistics || []).forEach(function (s) { m[s.name] = s.displayValue; });
          RC.stat[dove] = m;
        });
        // la formazione in campo adesso
        var rose = {};
        (j.rosters || []).forEach(function (r) { rose[String((r.team || {}).id || "")] = r; });
        var rc = rose[RC.casaId], ro = rose[RC.ospId];
        if (!rc || !ro) return;
        var uc = rcUndici(rc), uo = rcUndici(ro);
        if (uc.length < 11 || uo.length < 11) return;
        var firma = (rc.formation || "") + "|" + uc.map(function (x) { return x.pid; }).sort().join(",") +
                    "#" + (ro.formation || "") + "|" + uo.map(function (x) { return x.pid; }).sort().join(",");
        if (firma === RC.firma) return;
        RC.firma = firma;
        rcDisegnaCampo();
        rcSchiera(uc, rc.formation, uo, ro.formation);
        rcDistintivi();
        rcCampoVisibile(true);
        rcGira();
      })
      .catch(function () {});
    // le giocate non muovono piu' niente: servono solo a contare chi
    // tocca piu' palloni e in che terzo di campo si sta giocando
    var base = "https://sports.core.api.espn.com/v2/sports/soccer/leagues/" + lega +
               "/events/" + ev + "/competitions/" + ev + "/plays?limit=1000";
    fetch(base, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        // a partita avanzata le giocate passano il migliaio ed ESPN le
        // spezza in piu' pagine: vanno lette tutte, se no i gol e i
        // cartellini del primo tempo non si vedono piu'
        var pagine = j.pageCount || 1;
        if (pagine < 2) return j.items || [];
        var altre = [];
        for (var n = 2; n <= pagine; n++) {
          altre.push(fetch(base + "&page=" + n, { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (k) { return k.items || []; })
            .catch(function () { return []; }));
        }
        return Promise.all(altre).then(function (v) {
          return (j.items || []).concat.apply(j.items || [], v);
        });
      })
      .then(function (tutte) {
        if (RC.ev !== ev) return;
        (tutte || []).forEach(function (g) {
          if (!g.id || RC.visti[g.id]) return;
          RC.visti[g.id] = 1;
          var m = (((g.participants || [])[0] || {}).athlete || {}).$ref || "";
          var pid = (m.match(/athletes\/(\d+)/) || [])[1];
          if (pid) {
            RC.tocchi[pid] = (RC.tocchi[pid] || 0) + 1;
            // quello che va segnato sulla pedina: gol, autogol, cartellini
            var tipo = String((g.type || {}).text || "");
            var seg = RC.segni[pid] = RC.segni[pid] || { gol: 0, autogol: 0, giallo: 0, rosso: 0 };
            if (/^own goal/i.test(tipo)) seg.autogol++;
            else if (/^goal( -|$)/i.test(tipo) || /^penalty - scored/i.test(tipo)) seg.gol++;
            if (/^yellow card/i.test(tipo)) seg.giallo++;
            if (/^(red card|second yellow)/i.test(tipo)) seg.rosso++;
            if (seg.giallo > 1) seg.rosso = 1;          // doppia ammonizione
            RC.daSegnare = true;
          }
          if (g.fieldPositionX == null) return;
          var t = ((g.team || {}).$ref || "").match(/teams\/(\d+)/);
          var x = t && t[1] === RC.casaId ? g.fieldPositionX : 100 - g.fieldPositionX;
          RC.zone[x < 33 ? 0 : x > 66 ? 2 : 1]++;
        });
        if (RC.daSegnare) rcDistintivi();
      })
      .catch(function () {});
  }

  // ── polvere di stelle dietro il cartello radiocronaca ──────────────
  // Stessa idea dello sfondo delle grafiche piene, ma isolata qui: un
  // granello e' un dischetto sfumato disegnato una volta, ricopiato a
  // mezza risoluzione. Gira SOLO mentre il cartello e' in onda, cosi'
  // non pesa sul resto (lo scoreboard in overlay resta leggero).
  var polvereRAF = null, polvereGranelli = null, polvereSprite = null;
  function polvereRadio(accendi) {
    var cv = document.getElementById("radiodust");
    if (!cv) return;
    if (!accendi) {
      if (polvereRAF) { cancelAnimationFrame(polvereRAF); polvereRAF = null; }
      return;
    }
    if (polvereRAF) return;           // gia' in moto
    var g = cv.getContext("2d"), W = cv.width, H = cv.height;
    if (!polvereSprite) {
      polvereSprite = document.createElement("canvas");
      polvereSprite.width = polvereSprite.height = 16;
      var sg = polvereSprite.getContext("2d");
      var rad = sg.createRadialGradient(8, 8, 0, 8, 8, 8);
      rad.addColorStop(0, "rgba(232,210,150,.9)");
      rad.addColorStop(1, "rgba(232,210,150,0)");
      sg.fillStyle = rad; sg.fillRect(0, 0, 16, 16);
    }
    if (!polvereGranelli) {
      polvereGranelli = [];
      for (var i = 0; i < 70; i++) {
        polvereGranelli.push({
          x: Math.random() * W, y: Math.random() * H,
          r: 0.8 + Math.random() * 1.8,
          // deriva diagonale: tutti verso l'alto a destra, a velocita' vicine
          vx: 0.28 + Math.random() * 0.22,
          vy: -(0.20 + Math.random() * 0.16),
          a: 0.16 + Math.random() * 0.30,
          f: 0.5 + Math.random() * 1.0, ph: Math.random() * 6.28
        });
      }
    }
    var t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var t = (ts - t0) / 1000;
      g.clearRect(0, 0, W, H);
      g.globalCompositeOperation = "lighter";
      polvereGranelli.forEach(function (p2) {
        p2.y += p2.vy; p2.x += p2.vx;
        // esce in alto o a destra → rientra dal lato opposto, restando diagonale
        if (p2.y < -8) { p2.y = H + 8; p2.x = Math.random() * W - 40; }
        if (p2.x > W + 8) { p2.x = -8; p2.y = Math.random() * H; }
        var luc = p2.a * (0.55 + 0.45 * Math.sin(t * p2.f + p2.ph));
        g.globalAlpha = Math.max(0, luc);
        var d = p2.r * 4;
        g.drawImage(polvereSprite, p2.x - d / 2, p2.y - d / 2, d, d);
      });
      g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
      polvereRAF = requestAnimationFrame(frame);
    }
    polvereRAF = requestAnimationFrame(frame);
  }

  function escRadio(v) {

  // I nomi lunghi si stringono invece di essere tagliati a meta' parola:

  function adattaNome(id) {

  // il cronometro come stringa mm:ss, dal valore corrente
  function orologio(j) {
    var ck = j.clock || {};
    var sec = ck.base || 0;
    if (ck.run && ck.ts) sec += Math.max(0, (Date.now() - offset - ck.ts) / 1000);
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), r = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }

  // cronometro: calcolato in locale sull'ancora del server (zero deriva
  // dal polling; il tempo scorre fluido anche tra un poll e l'altro)
  function tickClock() {
    if (!S || !S.clock) { elClock.textContent = "00:00"; return; }
    var ck = S.clock;
    var sec = ck.base || 0;
    if (ck.run && ck.ts) sec += Math.max(0, (Date.now() - offset - ck.ts) / 1000);
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    elClock.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  setInterval(function () {

    if (S && S.ev && !evAttivo(S)) {

  // ── ricarica automatica ──────────────────────────────────────────
  // Questa pagina resta accesa per ore dentro vMix: senza questo

  var verIniziale = null;
  function controllaVersione(j, inOnda) {

  }

  // modalità anteprima (?prev=<b64 stato>): rende lo stato passato
  // dall'esterno, senza interrogare il ponte — la usa il pannello per
  // il monitor ANTEPRIMA, così cliccare non tocca mai l'onda
  var PREV = new URLSearchParams(location.search).get("prev");
  if (PREV) {
    try {
      var jp = JSON.parse(decodeURIComponent(escape(atob(PREV.replace(/-/g, "+").replace(/_/g, "/")))));
      jp.srv = Date.now();
      applica(jp);
    } catch (err) {}
  } else {
    var pollFn = function () {
      fetch(PONTE + "?partita=1&canale=" + CANALE, { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          applica(j);
          controllaVersione(j, (j && j.fase && j.fase !== "off") || !!evAttivo(j));
        })
        .catch(function () {});
    };
    setInterval(pollFn, POLL_MS);
    pollFn();
  }
})();
</script>
</body>
</html>
