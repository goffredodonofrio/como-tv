<html lang="it">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turni Redazione · Como TV</title>
<!--
  TURNI REDAZIONE — il gestionale dei turni, al posto della tabella Airtable.

  In Airtable un turno era una casella in una colonna intestata "Sabato 15
  Agosto", con l'orario scritto come etichetta ("10-19") e le attivita' in
  un'altra colonna ancora. Qui un turno ha una data, un'ora di inizio e una
  di fine: le ore si sommano, i riposi si controllano, e un mese nuovo non
  va creato a mano.

  Il vestito resta quello di Airtable — righe numerate, prima colonna e
  intestazioni fisse, pastiglie colorate, cella scelta col bordo blu, barra
  degli strumenti in alto e conteggio in fondo — perche' chi compila i turni
  lavora li' da anni e non deve reimparare niente. Cambia cosa c'e' sotto.

  Dati e scritture passano dal ponte (/api?turni=1, POST tipo turni-*).
  Nessuna chiave: la pagina e' interna, ma ogni scrittura porta il nome di
  chi l'ha fatta (in alto a destra) e resta nella storia.

  Indirizzi: turni.html                 la settimana corrente
             turni.html?vista=mese      il mese
             turni.html?io=Rossi        evidenzia una persona
-->
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    color-scheme:light;
    --sfondo:#F7F7F8;--carta:#FFFFFF;--testo:#1D1F25;--testo2:#6B6F76;--testo3:#9AA0A6;
    --linea:#E5E6EA;--linea2:#EFEFF1;--evidenza:#2D7FF9;--evidenzaSoft:rgba(45,127,249,.12);
    --oro:#B08A2E;--oggi:#FFF8E6;--festa:#FAFAFB;--riga:#F5FAFF;
    --ombra:0 1px 2px rgba(15,20,30,.06),0 8px 24px rgba(15,20,30,.08);
    --chipT:#1D1F25;
    --verde:#D1F7C4;--blu:#CFDFFF;--ciano:#D0F0FD;--giallo:#FFEAB6;--arancio:#FEE2D5;
    --rosso:#FFDCE5;--viola:#EDE2FE;--rosa:#FFDAF6;--grigio:#ECECEE;--teal:#C2F5E9;
  }
  html.scura{
    color-scheme:dark;
    --sfondo:#0E1116;--carta:#171A21;--testo:#ECEDEF;--testo2:#A0A5AD;--testo3:#767C85;
    --linea:#272B33;--linea2:#20242B;--evidenza:#4D95FF;--evidenzaSoft:rgba(77,149,255,.18);
    --oro:#E3C271;--oggi:#2A2416;--festa:#13161C;--riga:#141B26;
    --ombra:0 2px 4px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.45);
    --chipT:#121418;
    --verde:#9BE28A;--blu:#9CBCF5;--ciano:#93D7ED;--giallo:#EBD08A;--arancio:#EFB897;
    --rosso:#F0AEBF;--viola:#C9B2F2;--rosa:#EFACDE;--grigio:#B9BDC4;--teal:#93DDCC;
  }
  body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-weight:500;
    background:var(--sfondo);color:var(--testo);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .app{height:100vh;display:flex;flex-direction:column;background:var(--carta);}

  /* ── barra del documento ─────────────────────────────────────────── */
  .testa{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--linea);background:var(--carta);}
  .segno{width:24px;height:24px;border-radius:6px;background:linear-gradient(140deg,#0A0F24,#243056);
    display:flex;align-items:center;justify-content:center;color:#C9A24B;font-family:'Mazzard',sans-serif;font-size:12px;font-weight:800;flex:none;}
  .testa h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15px;letter-spacing:.01em;text-transform:uppercase;}
  .testa .dove{color:var(--testo3);font-size:12.5px;}
  .testa .sp{flex:1;}
  .chi{width:150px;padding:6px 10px;border-radius:7px;border:1px solid var(--linea);background:var(--carta);color:var(--testo);font-size:13px;}
  .chi:focus{outline:none;border-color:var(--evidenza);box-shadow:0 0 0 3px var(--evidenzaSoft);}

  /* ── barra degli strumenti ───────────────────────────────────────── */
  .strumenti{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--linea);
    background:var(--carta);flex-wrap:wrap;position:relative;z-index:30;}
  .t{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;border:1px solid transparent;
    background:none;color:var(--testo);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;}
  .t:hover{background:var(--linea2);}
  .t.bordo{border-color:var(--linea);}
  .t.forte{background:var(--evidenza);color:#fff;border-color:var(--evidenza);font-weight:700;}
  .t.forte:hover{filter:brightness(1.06);}
  .t:disabled{opacity:.45;cursor:default;}
  .t svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .sep{width:1px;height:20px;background:var(--linea);margin:0 4px;}
  .seg{display:inline-flex;background:var(--linea2);border-radius:8px;padding:2px;gap:2px;}
  .seg button{border:0;background:none;font:inherit;font-size:12.5px;color:var(--testo2);padding:5px 10px;border-radius:6px;cursor:pointer;}
  .seg button.on{background:var(--carta);color:var(--testo);font-weight:700;box-shadow:0 1px 2px rgba(15,20,30,.1);}
  .periodo{font-weight:700;font-size:13.5px;min-width:200px;text-align:center;}
  .stato{font-size:12.5px;color:var(--testo2);min-width:90px;}
  .stato.male{color:#D93025;}
  html.scura .stato.male{color:#F4A2A2;}
  select.t{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--testo2) 50%),linear-gradient(135deg,var(--testo2) 50%,transparent 50%);
    background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat;border:1px solid var(--linea);}

  /* ── griglia ─────────────────────────────────────────────────────── */
  .telaio{flex:1;overflow:auto;background:var(--carta);}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed;}
  th,td{border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);background:var(--carta);}
  thead th{position:sticky;top:0;z-index:12;padding:0 10px;height:26px;text-align:center;font-weight:500;
    font-size:12px;color:var(--testo2);white-space:nowrap;}
  thead tr.sotto th{top:26px;height:17px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--testo3);
    font-weight:700;padding:0 8px;text-align:left;}
  thead th.giorno{border-bottom:0;}
  thead th .gg{font-weight:700;color:var(--testo);font-size:13px;margin-left:4px;}
  thead th.festa{background:var(--festa);}
  thead th.oggi{background:var(--oggi);}
  thead th.oggi .gg{color:var(--oro);}
  th.riga1,td.riga1{position:sticky;left:0;z-index:11;text-align:center;color:var(--testo3);font-size:11px;}
  th.nome,td.nome{position:sticky;left:30px;z-index:11;text-align:left;padding:3px 10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  thead th.riga1,thead th.nome{z-index:14;}
  td.nome b{font-weight:700;font-size:13.5px;display:block;line-height:1.25;}
  td.nome small{color:var(--testo3);font-size:11.5px;}
  tr.gruppo td{position:sticky;left:0;z-index:10;background:var(--linea2);padding:5px 12px;font-size:11.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--testo2);border-right:0;}
  tr:hover td.nome,tr:hover td.cella{background:var(--riga);}
  tr.io td.nome{box-shadow:inset 3px 0 0 var(--oro);}
  td.cella{padding:0;vertical-align:top;overflow:hidden;}
  /* fra orario e attivita' dello stesso giorno il filetto e' piu' leggero:
     si vede che sono due colonne di una cosa sola */
  td.cella.ora,th.sotto-ora{border-right-color:var(--linea2);}
  td.cella.festa{background:var(--festa);}
  td.cella.oggi{background:var(--oggi);}
  .cel{display:block;width:100%;height:100%;padding:6px 8px;border:0;background:none;text-align:left;cursor:pointer;
    font:inherit;color:inherit;min-height:var(--alt,56px);}
  .cel:focus{outline:none;}
  td.cella.scelta{box-shadow:inset 0 0 0 2px var(--evidenza);border-radius:2px;}
  .pill.ora{font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;}
  .pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;}
  /* una pastiglia lunga ("COORDINAMENTO REDAZIONE") va a capo dentro se
     stessa: si legge per intero e non sborda dalla colonna */
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;color:var(--chipT);
    white-space:normal;overflow-wrap:break-word;line-height:1.3;}
  .pill.grande{font-size:12px;padding:2px 9px;}
  table.media .pill.ora,table.alta .pill.ora{font-size:12px;padding:1px 8px;}
  .assente{background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--linea2) 5px,var(--linea2) 10px);}
  .vuota .ora{color:var(--testo3);font-weight:500;}
  .segnale{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E5342B;margin-left:5px;vertical-align:2px;}
  td.ore{min-width:74px;text-align:right;padding:6px 10px;font-variant-numeric:tabular-nums;}
  td.ore b{font-weight:700;font-size:13.5px;}
  td.ore small{display:block;color:var(--testo3);font-size:11px;}
  /* Corta: una riga sola, orario e pastiglie in fila — cosi' le persone
     ci stanno tutte senza scorrere. Media e alta danno aria alle attivita'. */
  table.corta .cel{--alt:23px;padding:1px 6px;display:flex;align-items:flex-start;gap:4px;min-width:0;}


  table.corta .pill.luogo{display:none;}
  table.media .cel,table.alta .cel{padding-top:5px;}
  table.corta .pill.ora{font-size:10.5px;}
  /* le attivita' si vedono tutte: le pastiglie vanno a capo e la riga
     cresce quanto serve, invece di tagliare le parole */
  table.corta .pills{margin:0;flex-wrap:wrap;min-width:0;gap:2px;}
  table.corta .pill{font-size:10px;padding:0 5px;letter-spacing:-.01em;line-height:1.2;}
  /* le attivita' si impilano una sotto l'altra quando sono piu' d'una:
     ognuna si legge per intero, senza mischiarsi con la vicina */
  table.corta td.cella.att .pills{flex-direction:column;align-items:flex-start;gap:1px;}
  table.corta td.nome{padding:1px 10px;}
  table.corta td.nome b{font-size:13px;}
  table.corta td.nome small{display:none;}
  table.corta tr.gruppo td{padding:0 12px;font-size:10px;line-height:1.5;}
  table.media .cel{--alt:52px;}
  table.alta .cel{--alt:78px;}

  /* ── fondo pagina ────────────────────────────────────────────────── */
  .fondo{display:flex;align-items:center;gap:14px;padding:5px 14px;border-top:1px solid var(--linea);
    background:var(--carta);font-size:12.5px;color:var(--testo2);flex-wrap:wrap;}
  .fondo b{color:var(--testo);}
  .legenda{display:none;align-items:center;gap:5px;color:var(--testo3);font-size:12px;}
  .legenda i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-left:8px;}
  body.corta .legenda{display:inline-flex;}
  .fondo .sp{flex:1;}
  .allarme{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid #F0C9A0;background:#FFF6EC;color:#8A4B12;font:inherit;font-size:12.5px;font-weight:700;}
  html.scura .allarme{background:#2A1F14;border-color:#5C3A18;color:#F0C08A;}
  .allarme.pulito{border-color:var(--linea);background:var(--linea2);color:var(--testo2);font-weight:500;cursor:default;}

  /* ── finestre ────────────────────────────────────────────────────── */
  .velo{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:40;display:none;}
  .velo.on{display:block;}
  .scheda{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);
    max-height:88vh;overflow:auto;background:var(--carta);border-radius:14px;box-shadow:var(--ombra);display:none;}
  .scheda.on{display:block;}
  .scheda .capo{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--carta);border-radius:14px 14px 0 0;}
  .scheda .capo h2{font-size:16px;font-weight:700;}
  .scheda .capo .q{color:var(--testo2);font-size:12.5px;}
  .scheda .capo .x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;color:var(--testo2);cursor:pointer;padding:2px 6px;border-radius:6px;}
  .scheda .capo .x:hover{background:var(--linea2);color:var(--testo);}
  .scheda .corpo{padding:14px 18px 18px;}
  .campo{margin-bottom:14px;}
  .campo > label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--testo3);margin-bottom:6px;}
  .veloce{width:100%;padding:10px 12px;font:inherit;font-size:15px;border-radius:9px;border:1px solid var(--linea);background:var(--carta);color:var(--testo);}
  .veloce:focus{outline:none;border-color:var(--evidenza);box-shadow:0 0 0 3px var(--evidenzaSoft);}
  .aiuto{font-size:12px;color:var(--testo3);margin-top:6px;line-height:1.5;}
  .aiuto b{color:var(--testo2);}
  .scelte{display:flex;flex-wrap:wrap;gap:6px;}
  .scelte button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--linea);
    background:var(--carta);color:var(--testo);cursor:pointer;}
  .scelte button:hover{border-color:var(--evidenza);}
  .scelte button.on{border-color:transparent;box-shadow:inset 0 0 0 2px var(--evidenza);font-weight:700;}
  .scelte button.colorata{border-color:transparent;color:var(--chipT);font-weight:700;}
  .ore2{display:flex;gap:8px;align-items:center;}
  .ore2 input{width:92px;text-align:center;font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--linea);background:var(--carta);color:var(--testo);}
  .ore2 input:focus{outline:none;border-color:var(--evidenza);box-shadow:0 0 0 3px var(--evidenzaSoft);}
  .piede{display:flex;gap:8px;align-items:center;padding-top:6px;}
  .piede .sp{flex:1;}
  .elencoAvvisi{padding:4px 18px 18px;}
  .elencoAvvisi .voce{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--linea2);font-size:13px;}
  .elencoAvvisi .voce:last-child{border-bottom:0;}
  .elencoAvvisi .tag{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;color:var(--chipT);}
  .vuoto{padding:60px 20px;text-align:center;color:var(--testo2);}
  @media (max-width:760px){ th.nome,td.nome{min-width:130px;} td.cella{min-width:104px;} .testa .dove{display:none;} }
</style>
</head>
<body>
<div class="app">
  <div class="testa">
    <span class="segno">C</span>
    <h1>Turni</h1>
    <span class="dove" id="dove">Redazione · Como TV</span>
    <span class="sp"></span>
    <input class="chi" id="chi" placeholder="chi sei" title="Il nome resta scritto nella storia delle modifiche">
    <button class="t" id="tema" title="Chiaro o scuro">◐</button>
  </div>

  <div class="strumenti">
    <button class="t bordo" id="indietro" title="Periodo precedente">←</button>
    <button class="t bordo" id="oggi">Oggi</button>
    <button class="t bordo" id="avanti" title="Periodo successivo">→</button>
    <span class="periodo" id="periodo">—</span>
    <span class="sep"></span>
    <span class="seg" id="vista">
      <button data-v="7" class="on">Settimana</button>
      <button data-v="14">Due settimane</button>
      <button data-v="mese">Mese</button>
    </span>
    <select class="t" id="reparto" title="Mostra un reparto solo">
      <option value="">Tutti i reparti</option>
      <option value="redazione">Redazione</option>
      <option value="social">Social media</option>
      <option value="grafica">Grafica</option>
      <option value="produzione">Produzione</option>
    </select>
    <span class="seg" id="altezza" title="Altezza delle righe">
      <button data-a="corta" class="on">≡</button>
      <button data-a="media">≣</button>
      <button data-a="alta">☰</button>
    </span>
    <span class="sp" style="flex:1"></span>
    <button class="t" id="copia" title="Copia i turni del periodo precedente sulle caselle ancora vuote">
      <svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="2"/><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></svg>Copia periodo</button>
    <button class="t" id="nuova" title="Aggiungi una persona in elenco">
      <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>Persona</button>
    <button class="t" id="csv" title="Scarica quello che vedi">
      <svg viewBox="0 0 20 20"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15h12"/></svg>CSV</button>
    <span class="stato" id="stato"></span>
  </div>

  <div class="telaio" id="telaio"><div class="vuoto">Carico i turni…</div></div>

  <div class="fondo">
    <span id="conta">—</span>
    <span class="legenda" id="legenda"><i style="background:#3FA76B"></i>sede<i style="background:#4D95FF"></i>smart<i style="background:#E08B3E"></i>esterna</span>
    <span class="sp"></span>
    <button class="allarme pulito" id="allarme">Nessun controllo da guardare</button>
  </div>
</div>

<div class="velo" id="velo"></div>
<aside class="scheda" id="scheda" aria-label="Turno"></aside>

<script>
(function () {
  "use strict";
  var PONTE = "/api";                 // in dev ci pensa comotv-dev-fix a spostarlo
  var GIORNI = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
  var GIORNINT = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
  var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
  var REPARTI = [["redazione", "Redazione"], ["social", "Social media"], ["grafica", "Grafica"], ["produzione", "Produzione"]];
  var LUOGHI = [["sede", "Sede", "verde"], ["smart", "Smart", "blu"], ["esterna", "Esterna", "arancio"]];
  var NONLAVORO = [["off", "OFF", "rosso"], ["ferie", "Ferie", "viola"], ["recupero", "Recupero", "giallo"],
                   ["festivo", "Festivo", "grigio"], ["permesso", "Permesso", "ciano"], ["malattia", "Malattia", "rosa"]];
  // gli stessi pastelli di Airtable: un'attivita' ha sempre il suo colore
  var TINTE = ["blu", "ciano", "teal", "verde", "giallo", "arancio", "rosso", "rosa", "viola", "grigio"];
  var ORARI_BASE = ["9-18", "10-19", "11-20", "14-23", "15-00", "9-16"];

  var S = { persone: [], turni: {}, assenze: [], da: null, giorni: 7, reparto: "", cella: null, io: "", avvisi: [] };
  function el(id) { return document.getElementById(id); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dataDa(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function piu(s, n) { var d = dataDa(s); d.setDate(d.getDate() + n); return iso(d); }
  function lunedi(d) { var x = new Date(d); var g = (x.getDay() + 6) % 7; x.setDate(x.getDate() - g); return iso(x); }
  function oggiISO() { return iso(new Date()); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function stato(t, male) { var e = el("stato"); e.textContent = t || ""; e.className = "stato" + (male ? " male" : ""); }
  function tinta(nome) {                       // stessa parola, stesso pastello
    var h = 0, s = String(nome).toUpperCase();
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
    return TINTE[h % TINTE.length];
  }
  function pill(testo, tintaNome, grande, classe) {
    return '<span class="pill' + (grande ? " grande" : "") + (classe ? " " + classe : "") +
      '" style="background:var(--' + tintaNome + ')">' + esc(testo) + "</span>";
  }

  /* ── il periodo mostrato ───────────────────────────────────────────── */
  function giorniMostrati() {
    var out = [], n = S.giorni === "mese" ? giorniDelMese() : +S.giorni;
    for (var i = 0; i < n; i++) out.push(piu(S.da, i));
    return out;
  }
  function giorniDelMese() { var d = dataDa(S.da); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
  function titoloPeriodo(gg) {
    var a = dataDa(gg[0]), b = dataDa(gg[gg.length - 1]);
    if (a.getMonth() === b.getMonth()) return a.getDate() + "–" + b.getDate() + " " + MESI[a.getMonth()] + " " + a.getFullYear();
    return a.getDate() + " " + MESI[a.getMonth()] + " – " + b.getDate() + " " + MESI[b.getMonth()] + " " + b.getFullYear();
  }
  function breve(g) { var d = dataDa(g); return d.getDate() + " " + MESI[d.getMonth()].slice(0, 3); }

  /* ── conti ────────────────────────────────────────────────────────── */
  function oreDi(t) {
    if (!t || t.tipo !== "lavoro" || !t.inizio || !t.fine) return 0;
    var a = +t.inizio.slice(0, 2) * 60 + +t.inizio.slice(3), b = +t.fine.slice(0, 2) * 60 + +t.fine.slice(3);
    if (b <= a) b += 24 * 60;                  // 15-00 finisce a mezzanotte
    return (b - a) / 60;
  }
  function turnoDi(data, pid) { return (S.turni[data] || {})[pid] || null; }
  function assenzaDi(data, pid) {
    for (var i = 0; i < S.assenze.length; i++) {
      var x = S.assenze[i];
      if (x.persona === pid && x.da <= data && data <= x.a) return x;
    }
    return null;
  }
  function etichetta(t) {
    if (!t) return "";
    if (t.tipo === "lavoro") return (t.inizio || "") + "–" + (t.fine || "");
    var v = NONLAVORO.filter(function (x) { return x[0] === t.tipo; })[0];
    return v ? v[1].toUpperCase() : t.tipo.toUpperCase();
  }
  // Chi scrive il suo nome in alto vede solo la propria riga: e' la vista
  // "il mio turno". Basta svuotare il campo (o "mostra tutte") per tornare.
  function combacia(nome, cerca) {
    var a = nome.toLowerCase(), b = cerca.toLowerCase().trim();
    if (!b) return true;
    return b.split(/\s+/).every(function (parola) { return a.indexOf(parola) >= 0; });
  }
  function soloIo() {
    var cerca = (S.io || "").trim();
    if (!cerca) return null;
    var suoi = S.persone.filter(function (p) { return combacia(p.nome, cerca); });
    return suoi.length ? suoi : null;
  }
  function personeMostrate() {
    var mie = soloIo();
    if (mie) return mie;
    return S.persone.filter(function (p) { return p.attivo !== false && (!S.reparto || p.reparto === S.reparto); });
  }

  /* ── i controlli: quello che in Airtable non c'era ─────────────────── */
  function avvisiDel(gg) {
    var out = [], persone = personeMostrate();
    persone.forEach(function (p) {
      var scorso = null, fila = 0;
      gg.forEach(function (g) {
        var t = turnoDi(g, p.id), ass = assenzaDi(g, p.id);
        if (t && t.tipo === "lavoro" && ass)
          out.push({ genere: "ferie", tinta: "viola", g: g, p: p.id, testo: p.nome + " ha un turno il " + breve(g) + " ma è in " + ass.tipo });
        if (t && t.tipo === "lavoro") {
          fila++;
          if (fila === 7) out.push({ genere: "riposo", tinta: "arancio", g: g, p: p.id, testo: p.nome + ": sette giorni di fila senza riposo, fino al " + breve(g) });
          if (scorso) {
            var fine = dataDa(scorso.g);
            fine.setHours(+scorso.t.fine.slice(0, 2), +scorso.t.fine.slice(3));
            if (+scorso.t.fine.slice(0, 2) * 60 + +scorso.t.fine.slice(3) <= +scorso.t.inizio.slice(0, 2) * 60 + +scorso.t.inizio.slice(3)) fine.setDate(fine.getDate() + 1);
            var via = dataDa(g); via.setHours(+t.inizio.slice(0, 2), +t.inizio.slice(3));
            var pausa = (via - fine) / 3600000;
            if (pausa >= 0 && pausa < 11)
              out.push({ genere: "riposo", tinta: "giallo", g: g, p: p.id, testo: p.nome + ": solo " + pausa.toFixed(0) + " ore fra il turno del " + breve(scorso.g) + " e quello del " + breve(g) });
          }
          scorso = { g: g, t: t };
        } else fila = 0;
      });
    });
    gg.forEach(function (g) {
      var lavoro = persone.filter(function (p) { var t = turnoDi(g, p.id); return t && t.tipo === "lavoro"; });
      var sede = lavoro.filter(function (p) { return (turnoDi(g, p.id).luogo || "") === "sede"; });
      if (lavoro.length && !sede.length) out.push({ genere: "sede", tinta: "ciano", g: g, testo: breve(g) + ": nessuno in sede" });
    });
    return out;
  }

  /* ── la griglia ───────────────────────────────────────────────────── */
  function disegna() {
    var gg = giorniMostrati(), oggi = oggiISO(), persone = personeMostrate();
    el("periodo").textContent = titoloPeriodo(gg);
    if (!persone.length) {
      el("telaio").innerHTML = '<div class="vuoto">Nessuna persona in elenco.<br>Aggiungine una con <b>+ Persona</b>.</div>';
      return;
    }
    // Ogni giorno e' due colonne, come in Airtable: l'orario e le attivita'.
    // Le larghezze si misurano sullo schermo, l'orario quanto basta a "15:00–00:00".
    var spazio = el("telaio").clientWidth || 1280;
    var largaNome = Math.min(160, Math.max(116, Math.round(spazio * 0.095)));
    var largaOra = 78;             // la pastiglia "15:00–00:00" e basta
    // 16px di margine: se no la barra di scorrimento verticale fa comparire
    // anche quella orizzontale, e sembra che la settimana non ci stia
    // 180 e' il minimo perche' la parola piu' lunga che scriviamo
    // ("COORDINAMENTO") stia su una riga sola: sotto, si scorre in orizzontale
    var largaGiorno = Math.max(180, Math.floor((spazio - 30 - largaNome - 16) / gg.length));
    var largaAtt = largaGiorno - largaOra;
    var h = ['<table class="' + (ALTEZZA || "corta") + '" style="width:' + (30 + largaNome + largaGiorno * gg.length) + 'px">' +
             '<colgroup><col style="width:30px"><col style="width:' + largaNome + 'px">' +
             gg.map(function () { return '<col style="width:' + largaOra + 'px"><col style="width:' + largaAtt + 'px">'; }).join("") + "</colgroup>" +
             '<thead><tr><th class="riga1" rowspan="2"></th><th class="nome" rowspan="2">Persona</th>'];
    gg.forEach(function (g) {
      var d = dataDa(g), fine = d.getDay() === 0 || d.getDay() === 6;
      h.push('<th colspan="2" class="giorno ' + (fine ? "festa " : "") + (g === oggi ? "oggi" : "") + '">' + GIORNI[d.getDay()] +
             '<span class="gg">' + d.getDate() + "</span>" +
             (d.getDate() === 1 || g === gg[0] ? " " + MESI[d.getMonth()].slice(0, 3) : "") + "</th>");
    });
    h.push("</tr><tr class=\"sotto\">");
    gg.forEach(function (g) {
      var d = dataDa(g), fine = d.getDay() === 0 || d.getDay() === 6;
      var c = (fine ? "festa " : "") + (g === oggi ? "oggi" : "");
      h.push('<th class="' + c + '">Orario</th><th class="' + c + '">Attività</th>');
    });
    h.push("</tr></thead><tbody>");

    var n = 0;
    REPARTI.forEach(function (r) {
      var suoi = persone.filter(function (p) { return p.reparto === r[0]; });
      if (!suoi.length) return;
      h.push('<tr class="gruppo"><td colspan="' + (gg.length * 2 + 2) + '">' + r[1] + " · " + suoi.length + "</td></tr>");
      suoi.forEach(function (p) {
        n++;
        var celle = gg.map(function (g) {
          var t = turnoDi(g, p.id), ass = assenzaDi(g, p.id), d = dataDa(g);
          var c = (d.getDay() === 0 || d.getDay() === 6 ? "festa " : "") + (g === oggi ? "oggi" : "");
          var dati = ' data-g="' + g + '" data-p="' + p.id + '"';
          var sinistra = "", destra = "";
          if (t && t.tipo === "lavoro") {
            var luogo = LUOGHI.filter(function (l) { return l[0] === t.luogo; })[0];
            // l'orario e' una pastiglia come le altre: il colore dice il luogo
            sinistra = '<span class="pills">' + pill(etichetta(t), luogo ? luogo[2] : "grigio", false, "ora") + "</span>";
            destra = '<span class="pills">' + (luogo ? pill(luogo[1], luogo[2], false, "luogo") : "") +
              (t.attivita || []).map(function (a) { return pill(a, tinta(a)); }).join("") +
              (t.nota ? pill(t.nota, "grigio") : "") + "</span>";
          } else if (t) {
            var nl = NONLAVORO.filter(function (x) { return x[0] === t.tipo; })[0] || ["", t.tipo, "grigio"];
            sinistra = '<span class="pills">' + pill(nl[1].toUpperCase(), nl[2]) + "</span>";
          } else if (ass) {
            sinistra = '<span class="pills">' + pill(ass.tipo.toUpperCase(), "viola") + "</span>";
          }
          var spenta = (!t && ass ? " assente" : "") + (!t && !ass ? " vuota" : "");
          return '<td class="cella ora ' + c + '"' + dati + '><button class="cel' +
                 (t && t.tipo === "lavoro" && t.luogo ? " " + t.luogo : "") + spenta + '"' + dati + ">" + sinistra + "</button></td>" +
                 '<td class="cella att ' + c + '"' + dati + '><button class="cel' + spenta + '"' + dati + ">" + destra + "</button></td>";
        }).join("");
        h.push("<tr" + (S.io && p.nome.toLowerCase().indexOf(S.io.toLowerCase()) >= 0 ? ' class="io"' : "") + '><td class="riga1">' + n + "</td>" +
               '<td class="nome"><b>' + esc(p.nome) + "</b></td>" + celle + "</tr>");
      });
    });

    h.push('</tbody><tfoot><tr><td class="riga1"></td><td class="nome" style="color:var(--testo3);font-size:12px">In sede / a lavoro</td>');
    gg.forEach(function (g) {
      var lavoro = persone.filter(function (p) { var t = turnoDi(g, p.id); return t && t.tipo === "lavoro"; });
      var sede = lavoro.filter(function (p) { return (turnoDi(g, p.id).luogo || "") === "sede"; });
      h.push('<td colspan="2" style="text-align:center;font-size:12px;color:var(--testo2)"><b style="color:var(--testo)">' + sede.length + "</b>/" + lavoro.length + "</td>");
    });
    h.push("</tr></tfoot></table>");
    el("telaio").innerHTML = h.join("");

    [].forEach.call(document.querySelectorAll(".cel"), function (b) {
      b.addEventListener("click", function () { scegli(b.dataset.g, b.dataset.p); });
      b.addEventListener("dblclick", function () { apri(b.dataset.g, b.dataset.p); });
    });

    S.avvisi = avvisiDel(gg);
    var a = el("allarme");
    if (!S.avvisi.length) { a.className = "allarme pulito"; a.textContent = "Nessun controllo da guardare"; }
    else {
      a.className = "allarme";
      a.textContent = "⚠ " + S.avvisi.length + (S.avvisi.length === 1 ? " cosa da guardare" : " cose da guardare");
    }
    var quanti = 0, viste = persone.map(function (p) { return p.id; });
    gg.forEach(function (g) {
      Object.keys(S.turni[g] || {}).forEach(function (pid) { if (viste.indexOf(pid) >= 0) quanti++; });
    });
    el("conta").innerHTML = soloIo()
      ? "<b>" + esc(persone.map(function (p) { return p.nome; }).join(", ")) + "</b> · <b>" + quanti +
        '</b> turni nel periodo · <button class="t" id="tutte" style="padding:2px 8px;font-size:12px;border:1px solid var(--linea)">mostra tutte</button>'
      : "<b>" + persone.length + "</b> persone · <b>" + gg.length + "</b> giorni · <b>" + quanti + "</b> turni scritti";
    if (S.cella) segnaScelta();
  }

  /* ── cella scelta, come in Airtable: un clic sceglie, due aprono ──── */
  function segnaScelta() {
    [].forEach.call(document.querySelectorAll("td.cella.scelta"), function (x) { x.classList.remove("scelta"); });
    if (!S.cella) return;
    var due = document.querySelectorAll('td.cella[data-g="' + S.cella.g + '"][data-p="' + S.cella.p + '"]');
    [].forEach.call(due, function (td) { td.classList.add("scelta"); });
    if (due[0]) due[0].scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function scegli(g, p) { S.cella = { g: g, p: p }; segnaScelta(); }

  /* ── la scheda del turno ──────────────────────────────────────────── */
  function attivitaViste() {
    var v = {};
    Object.keys(S.turni).forEach(function (g) {
      Object.keys(S.turni[g]).forEach(function (p) { (S.turni[g][p].attivita || []).forEach(function (a) { v[a] = (v[a] || 0) + 1; }); });
    });
    return Object.keys(v).sort(function (a, b) { return v[b] - v[a]; }).slice(0, 16);
  }
  function orariVisti() {
    var v = {};
    Object.keys(S.turni).forEach(function (g) {
      Object.keys(S.turni[g]).forEach(function (p) {
        var t = S.turni[g][p];
        if (t.tipo === "lavoro" && t.inizio) v[t.inizio + "-" + t.fine] = (v[t.inizio + "-" + t.fine] || 0) + 1;
      });
    });
    var visti = Object.keys(v).sort(function (a, b) { return v[b] - v[a]; }).slice(0, 8);
    return visti.length ? visti : ORARI_BASE.map(function (o) { var p = o.split("-"); return ora(p[0]) + "-" + ora(p[1]); });
  }
  function ora(s) {
    var m = String(s).trim().match(/^(\d{1,2})[.:,]?(\d{2})?$/);
    return m ? String(+m[1]).padStart(2, "0") + ":" + (m[2] || "00") : "";
  }
  function apri(g, pid, primoTasto) {
    var p = S.persone.filter(function (x) { return x.id === pid; })[0];
    if (!p) return;
    scegli(g, pid);
    var t = turnoDi(g, pid), ass = assenzaDi(g, pid), d = dataDa(g);
    S.cella = { g: g, p: pid, bozza: t ? JSON.parse(JSON.stringify(t)) : { tipo: "lavoro", inizio: "", fine: "" } };
    var b = S.cella.bozza;
    var h = ['<div class="capo"><div><h2>' + esc(p.nome) + '</h2><div class="q">' + GIORNINT[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear() +
             (ass ? ' · <span style="color:var(--oro);font-weight:700">in ' + esc(ass.tipo) + " fino al " + breve(ass.a) + "</span>" : "") +
             '</div></div><button class="x" id="chiudi" title="Chiudi">×</button></div><div class="corpo">'];
    h.push('<div class="campo"><label>Scrivi e vai</label><input class="veloce" id="veloce" placeholder="10-19 sede football show" autocomplete="off">' +
      '<div class="aiuto">Un orario (<b>10-19</b>, <b>9.30-18.30</b>), poi dove (<b>sede</b>, <b>smart</b>, <b>esterna</b>), poi le attività. Oppure <b>off</b>, <b>ferie</b>, <b>recupero</b>. Invio salva.</div></div>');
    h.push('<div class="campo"><label>Orari usati</label><div class="scelte" id="rapidi">' +
      orariVisti().map(function (o) { return '<button data-o="' + o + '">' + o + "</button>"; }).join("") +
      NONLAVORO.map(function (x) { return '<button class="colorata" data-t="' + x[0] + '" style="background:var(--' + x[2] + ')">' + x[1] + "</button>"; }).join("") + "</div></div>");
    h.push('<div class="campo"><label>Dalle / alle</label><div class="ore2"><input type="text" id="in" value="' + esc(b.inizio || "") + '" placeholder="10:00"><span style="color:var(--testo3)">→</span><input type="text" id="fi" value="' + esc(b.fine || "") + '" placeholder="19:00"></div></div>');
    h.push('<div class="campo"><label>Dove</label><div class="scelte" id="dove">' +
      LUOGHI.map(function (l) { return '<button class="colorata' + (b.luogo === l[0] ? " on" : "") + '" data-l="' + l[0] + '" style="background:var(--' + l[2] + ')">' + l[1] + "</button>"; }).join("") + "</div></div>");
    h.push('<div class="campo"><label>Attività</label><div class="scelte" id="att">' +
      attivitaViste().map(function (a) { return '<button class="colorata' + ((b.attivita || []).indexOf(a) >= 0 ? " on" : "") + '" data-a="' + esc(a) + '" style="background:var(--' + tinta(a) + ')">' + esc(a) + "</button>"; }).join("") +
      '</div><input type="text" class="veloce" id="attnuova" placeholder="altra attività + Invio" style="margin-top:8px;font-size:13.5px"></div>');
    h.push('<div class="campo"><label>Nota</label><input type="text" class="veloce" id="nota" value="' + esc(b.nota || "") + '" placeholder="facoltativa" style="font-size:13.5px"></div>');
    h.push('<div class="piede"><button class="t forte" id="salva">Salva</button><button class="t bordo" id="svuota">Svuota</button>' +
      '<span class="sp"></span><span class="aiuto" style="margin:0">Esc chiude · frecce per spostarsi</span></div></div>');
    el("scheda").innerHTML = h.join("");
    el("scheda").classList.add("on");
    el("velo").classList.add("on");
    var v = el("veloce");
    v.focus();
    if (primoTasto) { v.value = primoTasto; }

    v.addEventListener("keydown", function (e) { if (e.key === "Enter") { leggiVeloce(this.value); salva(); } });
    [].forEach.call(document.querySelectorAll("#rapidi button"), function (x) {
      x.addEventListener("click", function () {
        if (x.dataset.o) { var pz = x.dataset.o.split("-"); b.tipo = "lavoro"; b.inizio = ora(pz[0]); b.fine = ora(pz[1]); el("in").value = b.inizio; el("fi").value = b.fine; }
        else { b.tipo = x.dataset.t; delete b.inizio; delete b.fine; salva(); }
      });
    });
    [].forEach.call(document.querySelectorAll("#dove button"), function (x) {
      x.addEventListener("click", function () {
        b.luogo = b.luogo === x.dataset.l ? "" : x.dataset.l;
        [].forEach.call(document.querySelectorAll("#dove button"), function (y) { y.classList.toggle("on", y.dataset.l === b.luogo); });
      });
    });
    [].forEach.call(document.querySelectorAll("#att button"), function (x) {
      x.addEventListener("click", function () {
        b.attivita = b.attivita || [];
        var i = b.attivita.indexOf(x.dataset.a);
        if (i >= 0) b.attivita.splice(i, 1); else b.attivita.push(x.dataset.a);
        x.classList.toggle("on", i < 0);
      });
    });
    el("attnuova").addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || !this.value.trim()) return;
      e.preventDefault();
      b.attivita = (b.attivita || []).concat([this.value.trim().toUpperCase()]);
      var bozza = b; apri(g, pid); S.cella.bozza = bozza;
      el("scheda").querySelector("#att").innerHTML = attivitaViste().concat(bozza.attivita.filter(function (a) { return attivitaViste().indexOf(a) < 0; }))
        .map(function (a) { return '<button class="colorata' + (bozza.attivita.indexOf(a) >= 0 ? " on" : "") + '" data-a="' + esc(a) + '" style="background:var(--' + tinta(a) + ')">' + esc(a) + "</button>"; }).join("");
    });
    el("salva").addEventListener("click", function () { leggiCampi(); salva(); });
    el("svuota").addEventListener("click", function () { S.cella.bozza = null; salva(); });
    el("chiudi").addEventListener("click", chiudi);
  }
  function leggiCampi() {
    var b = S.cella && S.cella.bozza; if (!b) return;
    var i = el("in"), f = el("fi"), n = el("nota");
    if (i && i.value) { b.inizio = ora(i.value); b.tipo = "lavoro"; }
    if (f && f.value) b.fine = ora(f.value);
    if (n) b.nota = n.value.trim();
  }
  /* "10-19 sede football show" → turno. Quello che non e' orario o luogo
     diventa attivita': si scrive come si parla. */
  function leggiVeloce(testo) {
    var t = String(testo || "").trim();
    if (!t) { leggiCampi(); return; }
    var b = S.cella.bozza || (S.cella.bozza = { tipo: "lavoro" });
    var attivita = [];
    t.split(/\s+/).forEach(function (w) {
      var m = w.match(/^(\d{1,2}([.:,]\d{2})?)[-–](\d{1,2}([.:,]\d{2})?)$/), l = w.toLowerCase();
      if (m) { b.tipo = "lavoro"; b.inizio = ora(m[1]); b.fine = ora(m[3]); return; }
      if (LUOGHI.some(function (x) { return x[0] === l; })) { b.luogo = l; return; }
      if (l === "trasferta") { b.luogo = "esterna"; return; }
      var nl = NONLAVORO.filter(function (x) { return x[0] === l || x[1].toLowerCase() === l; })[0];
      if (nl) { b.tipo = nl[0]; delete b.inizio; delete b.fine; return; }
      attivita.push(w);
    });
    if (attivita.length) b.attivita = (b.attivita || []).concat([attivita.join(" ").toUpperCase()]);
    leggiCampi();
  }
  function chiudi() {
    el("scheda").classList.remove("on");
    el("velo").classList.remove("on");
    if (S.cella) delete S.cella.bozza;
  }

  /* ── scritture ────────────────────────────────────────────────────── */
  function posta(corpo) {
    corpo.chi = (el("chi").value || "").trim();
    return fetch(PONTE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) throw new Error(d.errore || "il ponte ha detto no"); return d; });
  }
  function salva() {
    var c = S.cella; if (!c || c.bozza === undefined) return;
    var turno = c.bozza;
    if (turno && turno.tipo === "lavoro" && (!turno.inizio || !turno.fine)) { stato("manca un orario", true); return; }
    stato("salvo…");
    posta({ tipo: "turni-celle", celle: [{ data: c.g, persona: c.p, turno: turno }] })
      .then(function (d) { S.turni = d.turni; stato("salvato " + new Date().toLocaleTimeString("it-IT").slice(0, 5)); chiudi(); disegna(); })
      .catch(function (e) { stato(e.message, true); });
  }
  /* Copia il periodo precedente sulle caselle ancora vuote: la settimana
     tipo si ripete, e quello che e' gia' scritto non si tocca. */
  function copiaPeriodo() {
    var gg = giorniMostrati(), n = gg.length, celle = [];
    gg.forEach(function (g) {
      var prima = piu(g, -n);
      personeMostrate().forEach(function (p) {
        if (turnoDi(g, p.id)) return;
        var t = turnoDi(prima, p.id);
        if (t) celle.push({ data: g, persona: p.id, turno: t });
      });
    });
    if (!celle.length) { stato("niente da copiare"); return; }
    if (!confirm("Copio " + celle.length + " turni dal periodo precedente sulle caselle vuote?")) return;
    stato("copio…");
    posta({ tipo: "turni-celle", celle: celle })
      .then(function (d) { S.turni = d.turni; stato(celle.length + " turni copiati"); disegna(); })
      .catch(function (e) { stato(e.message, true); });
  }
  function csv() {
    var gg = giorniMostrati();
    var righe = [["Persona", "Reparto"].concat(gg).join(";")];
    personeMostrate().forEach(function (p) {
      righe.push([p.nome, p.reparto].concat(gg.map(function (g) {
        var t = turnoDi(g, p.id);
        return !t ? "" : etichetta(t) + (t.luogo ? " " + t.luogo : "") + (t.attivita && t.attivita.length ? " " + t.attivita.join("/") : "");
      })).join(";"));
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + righe.join("\n")], { type: "text/csv;charset=utf-8" }));
    a.download = "turni-" + gg[0] + "_" + gg[gg.length - 1] + ".csv";
    a.click();
  }
  function mostraAvvisi() {
    if (!S.avvisi.length) return;
    var h = ['<div class="capo"><div><h2>Da guardare</h2><div class="q">' + S.avvisi.length + " nel periodo mostrato</div></div><button class=\"x\" id=\"chiudi\" title=\"Chiudi\">×</button></div>"];
    h.push('<div class="elencoAvvisi">' + S.avvisi.map(function (a) {
      return '<div class="voce"><span class="tag" style="background:var(--' + a.tinta + ')">' + a.genere + "</span><span>" + esc(a.testo) + "</span></div>";
    }).join("") + "</div>");
    el("scheda").innerHTML = h.join("");
    el("scheda").classList.add("on");
    el("velo").classList.add("on");
    el("chiudi").addEventListener("click", chiudi);
  }

  /* ── caricamento ──────────────────────────────────────────────────── */
  function carica() {
    var gg = giorniMostrati();
    // si chiede un po' piu' del periodo: i controlli guardano anche il giorno prima
    return fetch(PONTE + "?turni=1&da=" + piu(gg[0], -7) + "&a=" + piu(gg[gg.length - 1], 7), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.errore || "il ponte non risponde");
        S.persone = d.persone || []; S.turni = d.turni || {}; S.assenze = d.assenze || [];
        disegna();
      })
      .catch(function (e) { stato(e.message, true); el("telaio").innerHTML = '<div class="vuoto">' + esc(e.message) + "</div>"; });
  }

  /* ── strumenti e tastiera ─────────────────────────────────────────── */
  var ALTEZZA = "corta";
  function muovi(n) {
    if (S.giorni === "mese") { var d = dataDa(S.da); d.setMonth(d.getMonth() + n, 1); S.da = iso(d); }
    else S.da = piu(S.da, n * +S.giorni);
    carica();
  }
  el("indietro").addEventListener("click", function () { muovi(-1); });
  el("avanti").addEventListener("click", function () { muovi(1); });
  el("oggi").addEventListener("click", function () {
    S.da = S.giorni === "mese" ? oggiISO().slice(0, 8) + "01" : lunedi(new Date());
    carica();
  });
  el("vista").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    S.giorni = b.dataset.v === "mese" ? "mese" : +b.dataset.v;
    S.da = S.giorni === "mese" ? S.da.slice(0, 8) + "01" : lunedi(dataDa(S.da));
    carica();
  });
  el("altezza").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    ALTEZZA = b.dataset.a;
    document.body.classList.toggle("corta", ALTEZZA === "corta");
    try { localStorage.setItem("comotv.turni.altezza", ALTEZZA); } catch (err) {}
    disegna();
  });
  el("reparto").addEventListener("change", function () { S.reparto = this.value; disegna(); });
  el("copia").addEventListener("click", copiaPeriodo);
  el("csv").addEventListener("click", csv);
  el("allarme").addEventListener("click", mostraAvvisi);
  el("velo").addEventListener("click", chiudi);
  el("nuova").addEventListener("click", function () {
    var nome = prompt("Nome e cognome, come lo vuoi vedere in griglia");
    if (!nome) return;
    var reparto = prompt("Reparto: redazione, social, grafica o produzione", "redazione");
    if (!reparto) return;
    posta({ tipo: "turni-persona", nome: nome, reparto: reparto.toLowerCase().trim() })
      .then(function (d) { S.persone = d.persone; stato("aggiunta " + nome); disegna(); })
      .catch(function (e) { stato(e.message, true); });
  });
  var attesaChi = null;
  el("chi").addEventListener("input", function () {
    var v = this.value;
    try { localStorage.setItem("comotv.turni.chi", v); } catch (e) {}
    clearTimeout(attesaChi);
    attesaChi = setTimeout(function () { S.io = v; disegna(); }, 250);
  });
  el("conta").addEventListener("click", function (e) {
    if (!e.target.closest("#tutte")) return;
    S.io = "";
    el("chi").value = "";
    try { localStorage.setItem("comotv.turni.chi", ""); } catch (err) {}
    disegna();
  });
  el("tema").addEventListener("click", function () {
    var scuro = !document.documentElement.classList.contains("scura");
    document.documentElement.classList.toggle("scura", scuro);
    try { localStorage.setItem("comotv.turni.tema", scuro ? "scura" : "chiara"); } catch (e) {}
  });

  // tastiera: frecce per muoversi, Invio o una lettera per aprire, come nei fogli
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") return chiudi();
    if (el("scheda").classList.contains("on") || /input|textarea|select/i.test(e.target.tagName || "")) return;
    if (!S.cella) return;
    var gg = giorniMostrati(), persone = personeMostrate();
    var ig = gg.indexOf(S.cella.g), ip = persone.map(function (p) { return p.id; }).indexOf(S.cella.p);
    if (e.key === "ArrowRight" && ig < gg.length - 1) scegli(gg[ig + 1], S.cella.p);
    else if (e.key === "ArrowLeft" && ig > 0) scegli(gg[ig - 1], S.cella.p);
    else if (e.key === "ArrowDown" && ip < persone.length - 1) scegli(S.cella.g, persone[ip + 1].id);
    else if (e.key === "ArrowUp" && ip > 0) scegli(S.cella.g, persone[ip - 1].id);
    else if (e.key === "Enter") apri(S.cella.g, S.cella.p);
    else if (e.key === "Backspace" || e.key === "Delete") {
      S.cella.bozza = null; salva();
    } else if (e.key.length === 1 && /[0-9a-zA-Z]/.test(e.key)) apri(S.cella.g, S.cella.p, e.key);
    else return;
    e.preventDefault();
  });

  try {
    if (localStorage.getItem("comotv.turni.tema") === "scura") document.documentElement.classList.add("scura");
    el("chi").value = localStorage.getItem("comotv.turni.chi") || "";
    var alt = localStorage.getItem("comotv.turni.altezza");
    if (alt) { ALTEZZA = alt; [].forEach.call(el("altezza").children, function (x) { x.classList.toggle("on", x.dataset.a === alt); }); }
  } catch (e) {}
  var q = new URLSearchParams(location.search);
  S.io = q.get("io") || el("chi").value || "";
  if (q.get("io")) el("chi").value = q.get("io");
  if (q.get("vista")) {
    S.giorni = q.get("vista") === "mese" ? "mese" : +q.get("vista") || 7;
    [].forEach.call(el("vista").children, function (x) { x.classList.toggle("on", x.dataset.v === String(S.giorni)); });
  }
  document.body.classList.toggle("corta", ALTEZZA === "corta");
  S.da = S.giorni === "mese" ? oggiISO().slice(0, 8) + "01" : lunedi(new Date());
  carica();
  var attesaMisura = null;
  window.addEventListener("resize", function () {
    clearTimeout(attesaMisura);
    attesaMisura = setTimeout(function () { if (S.persone.length) disegna(); }, 180);
  });
  // chi guarda senza toccare niente vede comunque le modifiche degli altri
  setInterval(function () { if (!el("scheda").classList.contains("on")) carica(); }, 60000);
})();
</script>
</body>
</html>
