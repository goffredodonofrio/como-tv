<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Come arrivano · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  /* la testata e' quella di casa: occhiello, titolo che entra da sinistra,
     filo d'oro sotto. Identica al confronto, cosi' le due grafiche in
     sequenza non sembrano venire da due programmi diversi */
  #eyebrow{position:absolute;left:128px;top:82px;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:.24em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #title{position:absolute;left:125px;top:104px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:76px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #rule{position:absolute;left:128px;top:212px;width:300px;height:3px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.15) 100%);
    transform:scaleX(0);transform-origin:left center;}

  /* ── come arrivano: due colonne, una per squadra ── */
  .col{position:absolute;top:262px;width:760px;}
  .col.sx{left:128px;} .col.dx{left:1032px;}
  .col .cima{display:flex;align-items:center;gap:20px;opacity:0;}
  .col .cima img{width:84px;height:84px;object-fit:contain;flex:none;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));}
  .col .cima .tondo{width:80px;height:80px;flex:none;border-radius:50%;background:#243F8A;
    display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:30px;color:#FFF;
    box-shadow:inset 0 0 0 3px rgba(245,241,230,.7);}
  .col .cima .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:40px;
    color:#F5F1E6;text-transform:uppercase;line-height:1.05;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .col .cima .bilancetto{font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;
    letter-spacing:.18em;color:#C9A24B;text-transform:uppercase;margin-top:7px;white-space:nowrap;}

  /* una partita dell'ultima striscia */
  .gara{position:absolute;left:0;width:760px;height:104px;opacity:0;
    border-top:1px solid rgba(245,241,230,.07);}
  .gara .esito{position:absolute;left:0;top:22px;width:50px;height:50px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:26px;color:#0A0F26;}
  .gara .esito.v{background:#C9A24B;}
  .gara .esito.n{background:rgba(245,241,230,.55);}
  .gara .esito.p{background:rgba(229,27,32,.85);color:#F5F1E6;}
  .gara .chi{position:absolute;left:74px;top:20px;right:170px;}
  .gara .avv{font-family:'Mazzard',sans-serif;font-weight:700;font-size:29px;letter-spacing:.02em;
    color:#F5F1E6;text-transform:uppercase;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gara .dove{font-family:'DM Sans',sans-serif;font-weight:500;font-size:15px;letter-spacing:.16em;
    color:rgba(245,241,230,.38);text-transform:uppercase;margin-top:5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .gara .gol{position:absolute;right:0;top:26px;width:160px;text-align:right;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:36px;letter-spacing:.04em;
    color:rgba(245,241,230,.85);font-variant-numeric:tabular-nums;white-space:nowrap;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes rigaIn {
    0%   { opacity:0; transform:translateY(18px); }
    100% { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="eyebrow"></div>
  <div id="title">COME ARRIVANO</div>
  <div id="rule"></div>
  <div id="corpo"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url>
  //   { e:"SERIE A · 3ª GIORNATA", t:"COME ARRIVANO",
  //     a:{n:"Lecce", l:"…stemma…"}, b:{n:"Monza", l:"…"},
  //     fa:[ {r:"V"|"N"|"P", s:"1-0", o:"Monopoli", dv:"in casa · Amichevole · 9 ago"} ],
  //     fb:[ … ] }
  //   La sorella e' precedenti-vmix.html (I PRECEDENTI): stessa testata,
  //   stessi stemmi, stessa animazione. Se si tocca l'una, si guarda l'altra.

  var DEMO = {
    e: "SERIE A · 3ª GIORNATA", t: "COME ARRIVANO",
    a: { n: "Como" }, b: { n: "Inter" },
    fa: [
      { r: "V", s: "2-0", o: "Lazio",    dv: "in casa · Serie A · 24 ago" },
      { r: "N", s: "1-1", o: "Bologna",  dv: "in trasferta · Serie A · 31 ago" },
      { r: "V", s: "3-1", o: "Genoa",    dv: "in casa · Serie A · 14 set" },
      { r: "P", s: "0-2", o: "Juventus", dv: "in trasferta · Serie A · 21 set" },
      { r: "V", s: "1-0", o: "Cagliari", dv: "in casa · Coppa Italia · 25 set" }
    ],
    fb: [
      { r: "V", s: "5-0", o: "Torino",   dv: "in casa · Serie A · 25 ago" },
      { r: "V", s: "2-1", o: "Udinese",  dv: "in trasferta · Serie A · 30 ago" },
      { r: "P", s: "1-2", o: "Milan",    dv: "in casa · Serie A · 13 set" },
      { r: "N", s: "0-0", o: "Atalanta", dv: "in trasferta · Serie A · 20 set" },
      { r: "V", s: "4-0", o: "Empoli",   dv: "in casa · Coppa Italia · 24 set" }
    ]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      if (!d || !d.a || !d.b) return null;
      var righe = (d.fa || []).length + (d.fb || []).length;
      return righe ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "COME ARRIVANO — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "COME ARRIVANO " + ((D.a.n || "") + " " + (D.b.n || "")).trim();

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var eb = document.getElementById("eyebrow"); eb.textContent = D.e || "";
  var tt = document.getElementById("title");
  tt.textContent = D.t || "COME ARRIVANO";
  var rl = document.getElementById("rule");
  if (STILL) { eb.style.opacity = 1; tt.style.clipPath = "inset(0 0 0 0)"; rl.style.transform = "scaleX(1)"; }
  else {
    eb.style.animation = "fadeIn .5s ease .15s forwards";
    tt.style.animation = "wipeIn .7s cubic-bezier(.2,.7,.3,1) .3s forwards";
    rl.style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) .85s forwards";
  }

  // lo stemma se c'e', altrimenti il tondo con le due iniziali: una grafica
  // senza stemma deve restare guardabile, non mostrare un buco
  function faccia(q, grande) {
    if (q.l) return '<img src="' + esc(q.l) + '" onerror="this.style.display=\'none\'">';
    return '<div class="tondo">' + esc(String(q.n || "").slice(0, 2).toUpperCase()) + '</div>';
  }
  function anim(quando) {
    return STILL ? "opacity:1" : "animation:fadeIn .55s ease " + quando + "s forwards";
  }
  function animRiga(i, da) {
    return STILL ? "opacity:1"
      : "animation:rigaIn .5s cubic-bezier(.2,.7,.3,1) " + (da + i * 0.13).toFixed(2) + "s forwards";
  }

  var h = "";

  // ── COME ARRIVANO ───────────────────────────────────────────────
  function colonna(q, righe, lato, ritardo) {
    var R = (righe || []).slice(0, 5);
    var v = 0, n = 0, p = 0;
    R.forEach(function (g) {
      if (g.r === "V") v++; else if (g.r === "P") p++; else n++;
    });
    var out = '<div class="col ' + lato + '">' +
      '<div class="cima" style="' + anim(ritardo) + '">' + faccia(q) +
      '<div style="min-width:0"><div class="nome">' + esc(q.n || "") + '</div>' +
      '<div class="bilancetto">' + v + "V &middot; " + n + "N &middot; " + p + "P</div></div></div>";
    var Y0 = 190, PASSO = 112;
    R.forEach(function (g, i) {
      var cl = g.r === "V" ? "v" : (g.r === "P" ? "p" : "n");
      out += '<div class="gara" style="top:' + (Y0 + i * PASSO) + 'px;' +
               animRiga(i, ritardo + 0.25) + '">' +
        '<div class="esito ' + cl + '">' + esc(g.r || "") + '</div>' +
        '<div class="chi"><div class="avv">' + esc(g.o || "") + '</div>' +
          '<div class="dove">' + esc([g.dv, g.c].filter(Boolean).join(" · ")) + '</div></div>' +
        '<div class="gol">' + esc(g.s || "") + '</div>' +
        '</div>';
    });
    return out + "</div>";
  }
  h += colonna(D.a, D.fa, "sx", 1.0);
  h += colonna(D.b, D.fb, "dx", 1.1);

  document.getElementById("corpo").innerHTML = h;

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
