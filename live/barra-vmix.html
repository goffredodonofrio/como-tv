<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawl verticale · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  /* la pagina resta TRASPARENTE: il riquadro 16:9 in alto a sinistra e' il
     buco in cui si vede il programma. Qui si dipinge solo la cornice. */
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
  :root{color-scheme:dark;}

  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;}

  /* ── la colonna a destra ─────────────────────────────────────────────
     Larga 420: quello che resta a sinistra (1500) per 844 e' esattamente
     16:9, cioe' il riquadro libero dove va il video. */
  #barra{position:absolute;right:0;top:0;width:420px;height:1080px;overflow:hidden;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(36,64,138,.55), transparent 60%),
      linear-gradient(180deg,#141B3C 0%,#0E1430 55%,#0A0F24 100%);
    transform:translateX(100%);}
  #barra.on{transform:translateX(0);transition:transform .75s cubic-bezier(.2,.75,.3,1);}
  /* filo dorato sul bordo interno */
  #barra::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,rgba(201,162,75,0),#C9A24B 22%,#C9A24B 78%,rgba(201,162,75,0));}

  /* ── i contenuti della colonna (fino a 4, a rotazione) ───────────────
     Ogni contenuto e' una "scheda" larga quanto la colonna: entra da
     DESTRA e spinge fuori a sinistra quella prima, nello stesso momento.
     Niente dissolvenze: si muove solo il transform, e non c'e' mai un
     istante con due testi sovrapposti. */
  .scheda{position:absolute;inset:0;transform:translateX(100%) translateZ(0);
    backface-visibility:hidden;will-change:transform;
    transition:transform .85s cubic-bezier(.24,.74,.22,1);}
  .scheda.in{transform:translateX(0) translateZ(0);}
  .scheda.out{transform:translateX(-100%) translateZ(0);}

  /* la foto in cima, sfumata nel fondo della colonna */
  .foto{position:absolute;left:0;top:0;width:420px;height:560px;overflow:hidden;}
  .foto img{width:100%;height:100%;object-fit:cover;object-position:center top;
    filter:brightness(.92) saturate(1.05);}
  .foto .velo{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,15,38,.25) 0%,transparent 30%,rgba(20,27,60,.85) 84%,#141B3C 100%);}

  /* testo della colonna — staccato dalla foto, non appoggiato al suo bordo */
  .testo{position:absolute;left:34px;right:30px;top:614px;}
  .occhiello{font-family:'Mazzard',sans-serif;font-weight:700;font-size:19px;letter-spacing:.24em;
    text-transform:uppercase;color:#C9A24B;opacity:0;}
  .titolo{margin-top:14px;font-family:'Mazzard',sans-serif;font-weight:800;font-size:46px;
    line-height:1.06;letter-spacing:.01em;text-transform:uppercase;color:#F5F1E6;opacity:0;}
  .filo{margin-top:18px;width:120px;height:3px;
    background:linear-gradient(90deg,#C9A24B,rgba(201,162,75,.1));
    transform:scaleX(0);transform-origin:left center;}
  .corpo{margin-top:20px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:23px;
    line-height:1.5;color:#D8D2C2;opacity:0;}

  /* ── la scheda "prossimi appuntamenti" ───────────────────────────────
     Non e' la grafica a schermo intero rimpicciolita: quella ha un blocco
     data da 176px, qui la colonna intera ne ha 356. Stesso linguaggio —
     numero grande, mese piccolo, filo dorato, ora a destra — ma
     riproporzionato, e la foto si accorcia per far posto a quattro righe.
     Con la foto alta 560 ne restavano 290 in quattro: 72px l'una, troppo
     poco perche' un nome di squadra si legga da tre metri. */
  .scheda.appunt .foto{height:420px;}
  .scheda.appunt .testo{top:470px;}
  /* foto media: due appuntamenti, ma la faccia si vede */
  .scheda.appunt.media .foto{height:640px;}
  .scheda.appunt.media .testo{top:690px;}

  /* ── la locandina ────────────────────────────────────────────────────
     Adesso la locandina e' DISEGNATA nel formato della colonna — 840x2160,
     cioe' 420x1080 al doppio — quindi riempie e basta: niente da centrare,
     niente vuoto da riempire, niente firma da aggiungere sotto.

     Le versioni prima ci giravano intorno: una locandina 2:3 messa qui o si
     rimpiccioliva lasciando meta' colonna vuota, o si tagliava perdendo i
     nomi delle squadre. Il vuoto non si arreda: si toglie facendo la
     grafica della misura giusta. */
  .scheda.loc .foto{top:0;height:1080px;}
  .scheda.loc .foto img{width:100%;height:100%;object-fit:cover;filter:none;}
  .scheda.loc .foto .velo{display:none;}
  .scheda.loc .testo{display:none;}

  /* stemma in fondo alla colonna */
  .stemma{position:absolute;left:34px;bottom:34px;width:74px;height:74px;object-fit:contain;opacity:0;}

  /* nei cambi successivi la scheda arriva gia' accesa: si muove solo lei,
     tutta intera, senza animazioni interne che la farebbero sembrare molle */
  .scheda.dopo .occhiello,.scheda.dopo .titolo,.scheda.dopo .corpo,.scheda.dopo .stemma{opacity:1;}
  .scheda.dopo .filo{transform:scaleX(1);}

  /* i pallini che dicono a che contenuto siamo */
  #pallini{position:absolute;left:34px;bottom:14px;display:none;gap:7px;align-items:center;}
  #pallini i{display:block;width:7px;height:7px;border-radius:50%;
    background:rgba(245,241,230,.28);transition:background .4s ease,width .4s ease;}
  #pallini i.qui{width:20px;border-radius:4px;background:#C9A24B;}

  /* ── la fascia in basso (versione 2) ──────────────────────────────────
     Due elementi impilati sotto il riquadro del video: i TITOLI che
     ruotano e, sotto, il CRAWL che scorre. Con la colonna a destra
     fanno tre blocchi che convivono senza toccarsi. */
  #fascia{position:absolute;left:0;bottom:0;width:1500px;height:236px;
    display:none;flex-direction:column;justify-content:flex-end;
    transform:translateY(100%);}
  #fascia.on{transform:translateY(0);transition:transform .7s cubic-bezier(.2,.75,.3,1) .2s;}

  /* titoli rotanti */
  #fasciatit{flex:1;display:flex;align-items:stretch;overflow:hidden;
    background:linear-gradient(180deg,rgba(20,27,60,.97),rgba(10,15,36,.97));
    border-top:3px solid #C9A24B;}
  #etichetta{flex:0 0 auto;display:flex;align-items:center;padding:0 30px;
    background:linear-gradient(180deg,#1c2a5e,#101838);
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:24px;letter-spacing:.2em;
    text-transform:uppercase;color:#E3C271;border-right:2px solid rgba(201,162,75,.45);}
  #titowrap{position:relative;flex:1;min-width:0;overflow:hidden;}
  /* anche qui il cambio e' uno SCORRIMENTO da destra a sinistra, come le
     schede della colonna: stesso verso, stesso passo, niente dissolvenze */
  .tito{position:absolute;left:30px;right:30px;top:0;height:100%;
    display:flex;align-items:center;
    transform:translateX(105%) translateZ(0);backface-visibility:hidden;
    will-change:transform;transition:transform .8s cubic-bezier(.24,.74,.22,1);}
  .tito b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:40px;line-height:1.04;
    text-transform:uppercase;color:#F5F1E6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tito.in{transform:translateX(0) translateZ(0);}
  .tito.out{transform:translateX(-105%) translateZ(0);}

  #crawl{display:flex;align-items:center;height:70px;background:rgba(6,10,26,.98);overflow:hidden;
    border-top:1px solid rgba(201,162,75,.35);}
  /* dove il crawl "muore": il logo Como TV, fermo, a sinistra */
  #crawltag{flex:0 0 auto;align-self:stretch;display:flex;align-items:center;padding:0 26px;
    background:linear-gradient(90deg,#1a2550,#0e1430);}
  #crawltag img{height:42px;width:auto;object-fit:contain;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));}
  #crawlvp{flex:1;min-width:0;overflow:hidden;position:relative;height:100%;}
  #crawltrack{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;
    will-change:transform;backface-visibility:hidden;}
  #crawltrack .seg{font-family:'DM Sans',sans-serif;font-weight:500;font-size:28px;letter-spacing:.02em;color:#EDE8DB;}
  #crawltrack .seghdr{font-family:'Mazzard',sans-serif;font-weight:800;font-size:26px;letter-spacing:.06em;
    text-transform:uppercase;color:#E3C271;}
  #crawltrack .sep{color:#C9A24B;font-weight:700;font-size:26px;padding:0 18px;}
  #crawltrack .pt{font-size:.6em;font-weight:700;opacity:.7;margin-left:1px;}

  @keyframes fadeIn{to{opacity:1;}}
  @keyframes ruleIn{to{transform:scaleX(1);}}
  @keyframes salita{to{opacity:1;transform:translateY(0);}}
  .su{transform:translateY(20px);}
</style>
</head>
<body>

<div id="stage">
  <div id="barra">
    <!-- le schede (fino a 4) le costruisce lo script, una alla volta -->
    <div id="pallini"></div>
  </div>

  <div id="fascia">
    <div id="fasciatit">
      <div id="etichetta"></div>
      <div id="titowrap"></div>
    </div>
    <div id="crawl">
      <div id="crawltag"><img src="/loghi/como-tv-logo.png" alt="Como TV" onerror="this.parentNode.style.display='none'"></div>
      <div id="crawlvp"><div id="crawltrack"></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // dati: ?d=<base64url {
  //   v: 1|2,        1 = sola colonna · 2 = colonna + titoli + crawl
  //   co: [ {e:"occhiello", t:"titolo", x:"testo", f:"…foto…", l:"…stemma…"} ]
  //                  ← fino a 4 contenuti: la colonna li fa ruotare
  //   e/t/x/f/l      ← forma vecchia, un contenuto solo (vale ancora)
  //   et: "etichetta", ti: ["titolo 1","titolo 2"],  ← i titoli che ruotano
  //   cr: "BLOCCO · voce · voce |||| BLOCCO · voce"  ← il crawl
  // }>
  var DEMO = {
    v: 2,
    co: [
      { e: "SERIE A · 2ª GIORNATA", t: "Nico Paz trascina il Como",
        x: "Due assist e il gol del sorpasso: il talento argentino è già l'uomo copertina della stagione biancoblù.",
        f: "/loghi/foto-demo-paz.jpg", l: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png" },
      { e: "IL COMMENTO", t: "Fàbregas ha una squadra sua",
        x: "Pressing alto e palleggio: il Como gioca a memoria e non sembra più una neopromossa.",
        l: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png" }
    ],
    et: "ULTIM'ORA",
    ti: ["Il Como espugna il Maradona: 2-1 in rimonta",
         "Fàbregas: «Questa squadra ha carattere»",
         "Mercato: il Como chiude per il centrocampista"],
    cr: "RISULTATI SERIE A · NAPOLI-COMO 1-2 · CAGLIARI-INTER 0-1 · LAZIO-GENOA 1-0 |||| CLASSIFICA SERIE A · 1° INTER 6PT · 2° MILAN 6PT · 3° COMO 4PT"
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      var pieno = d && (d.t || (Array.isArray(d.co) && d.co.length));
      return pieno ? d : null;
    } catch (err) { return null; }
  }
  var Q = new URLSearchParams(location.search);
  var STILL = Q.get("still") === "1";
  var SLOW = parseFloat(Q.get("slow")) || 1;
  var D = decodeData();
  if (!D) {
    document.title = "BARRA — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  // ── i contenuti: fino a 4, e la forma vecchia (un contenuto solo) vale ancora ──
  var MAX_CONTENUTI = 4;
  var CONTENUTI = (Array.isArray(D.co) && D.co.length ? D.co : [{ e: D.e, t: D.t, x: D.x, f: D.f, l: D.l }])
    .filter(function (c) { return c && (String(c.t || "").trim() || c.f || (c.ap && c.ap.length)); })
    .slice(0, MAX_CONTENUTI);
  if (!CONTENUTI.length) CONTENUTI = [{ t: D.t || "" }];
  document.title = "BARRA " + (CONTENUTI[0].t || "");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    el("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var V2 = String(D.v) === "2";

  // ── le righe degli appuntamenti ──────────────────────────────────────
  // Arrivano dalla pagina Appuntamenti nella stessa forma con cui le disegna
  // la grafica a schermo intero: {g,d,m,o,c,ti,a,b,no}. Non si ricompongono
  // e non si riscrivono a mano — si scrivono una volta sola, li'.
  function righeAppuntamenti(ap) {
    return ap.slice(0, 4).map(function (v) {
      var chi = v.ti ? esc(v.ti)
              : esc(((v.a && v.a.n) || "") + (v.b && v.b.n ? "-" + v.b.n : ""));
      return '<div class="apr">' +
          '<div class="apd">' +
            '<div class="apn">' + esc(giornoPulito(v.d)) + '</div>' +
            (v.m ? '<div class="apm">' + esc(v.m) + '</div>' : '') +
          '</div>' +
          '<div class="apf"></div>' +
          '<div class="apc">' +
            (v.c ? '<div class="apcomp">' + esc(v.c) + '</div>' : '') +
            '<div class="apt">' + chi + '</div>' +
          '</div>' +
          (v.o ? '<div class="apo"><div class="apolab">ore</div>' +
                 '<div class="apoh">' + esc(v.o) + '</div></div>' : '') +
        '</div>';
    }).join("");
  }

  // Lo zero davanti al giorno non lo vogliamo: gli appuntamenti salvati
  // prima della correzione del 4 settembre ce l'hanno gia' scritto dentro.
  function giornoPulito(d) {
    return String(d == null ? "" : d).trim().replace(/^0+(?=\d)/, "");
  }

  // ── una scheda: foto, occhiello, titolo, filo, testo, stemma ──────────
  //    si costruisce gia' misurata, mentre e' ancora invisibile: quando
  //    entra in dissolvenza non deve piu' muovere niente.
  function costruisci(c) {
    var s = document.createElement("div");
    // Gli appuntamenti sono una scheda come le altre — stessa rotazione,
    // stessa foto, stessa entrata da destra — solo con il corpo fatto di
    // righe invece che di testo libero.
    var appunt = !!(c.ap && c.ap.length);
    // "g" vuole la foto a tutta colonna e una partita sola: con quattro
    // righe sopra una foto alta 1080 non ci sta niente, e imporre una
    // scelta e' meglio che stringere finche' non si legge piu'.
    var loc = !!c.loc && !!c.f;      // la locandina: solo l'immagine
    s.className = "scheda" + (loc ? " loc" : appunt ? " appunt" : "") +
                  (!loc && appunt && c.apf === "m" ? " media" : "");
    var conFoto = !!c.f;
    s.innerHTML =
      (conFoto ? '<div class="foto"><img class="avanti" alt=""><div class="velo"></div></div>' : '') +
      '<div class="testo"' + (conFoto ? '' : ' style="top:120px"') + '>' +
        '<div class="occhiello"></div><div class="titolo"></div>' +
        '<div class="filo"></div><div class="corpo"></div>' +
      '</div>' +
      (c.l ? '<img class="stemma" alt="">' : '');

    var img = s.querySelector(".foto img.avanti");
    if (img) {
      img.src = c.f;
      // se la foto non arriva, la scheda resta valida: il testo sale in cima
      img.onerror = function () {
        var f = s.querySelector(".foto"); if (f) f.style.display = "none";
        s.querySelector(".testo").style.top = "120px";
      };
    }
    var st = s.querySelector(".stemma");
    if (st) { st.src = c.l; st.onerror = function () { this.style.display = "none"; }; }

    s.querySelector(".occhiello").textContent = c.e || "";
    s.querySelector(".titolo").textContent = c.t || "";
    var corpo = s.querySelector(".corpo");
    if (loc) corpo.textContent = "";
    else if (appunt) corpo.innerHTML = righeAppuntamenti(c.ap);
    else corpo.textContent = c.x || "";
    el("barra").insertBefore(s, el("pallini"));

    if (loc) return s;         // c'e' solo l'immagine: niente da adattare
    var testoY = appunt ? (c.apf === "m" ? 690 : 470) : (conFoto ? 614 : 120);
    var t = s.querySelector(".titolo"), fs = appunt ? 34 : 46;
    while (t.scrollHeight > 190 && fs > 26) { fs -= 2; t.style.fontSize = fs + "px"; }
    // quello che resta fra il titolo e lo stemma in fondo alla colonna
    var spazio = 1080 - 34 - 74 - 24 - (testoY + t.offsetHeight + 90);
    if (appunt) {
      // Le righe non si rimpiccioliscono di corpo: si stringono di
      // interlinea. Un appuntamento con la data a 24px in mezzo ad altri a
      // 36 sembrerebbe meno importante, e non lo e'.
      var righe = corpo.querySelectorAll(".apr"), p = 13;
      while (corpo.scrollHeight > spazio && p > 4) {
        p -= 1;
        for (var i = 0; i < righe.length; i++) righe[i].style.padding = p + "px 0";
      }
    } else {
      var fc = 23;
      while (corpo.scrollHeight > spazio && fc > 15) { fc -= 1; corpo.style.fontSize = fc + "px"; }
    }
    return s;
  }

  // le foto dei contenuti successivi si scaricano subito: al cambio devono
  // gia' essere in memoria, altrimenti si vedrebbe un buco
  CONTENUTI.forEach(function (c) { if (c.f) { var i = new Image(); i.src = c.f; } });

  var pallini = el("pallini");
  if (CONTENUTI.length > 1) {
    pallini.style.display = "flex";
    pallini.innerHTML = CONTENUTI.map(function (c, i) {
      return '<i' + (i === 0 ? ' class="qui"' : '') + '></i>';
    }).join("");
  }

  var schedaCur = costruisci(CONTENUTI[0]);
  var iScheda = 0;
  function ruotaScheda() {
    iScheda = (iScheda + 1) % CONTENUTI.length;
    var vecchia = schedaCur;
    var nuova = costruisci(CONTENUTI[iScheda]);
    nuova.classList.add("dopo");
    schedaCur = nuova;
    [].forEach.call(pallini.children, function (p, i) { p.classList.toggle("qui", i === iScheda); });
    void nuova.offsetWidth;             // il reflow fa partire la transizione
    // scorrono insieme: la nuova entra da destra, la vecchia esce a sinistra
    nuova.classList.add("in");
    vecchia.classList.remove("in"); vecchia.classList.add("out");
    setTimeout(function () { if (vecchia.parentNode) vecchia.parentNode.removeChild(vecchia); }, 1100);
  }
  if (CONTENUTI.length > 1 && !STILL) setInterval(ruotaScheda, 8000 * SLOW);

  // ── titoli rotanti e crawl: solo nella versione 2 ──
  var crawl = String(D.cr || "").trim();
  var titoli = (D.ti || []).filter(function (t) { return String(t || "").trim(); });
  if (V2 && (crawl || titoli.length)) {
    el("fascia").style.display = "flex";
    // l'etichetta arriva come chiave (la stessa del crawl orizzontale)
    // oppure gia' scritta per esteso
    var NOMI_ET = { ultimora: "ULTIM'ORA", mercato: "CALCIOMERCATO", topnews: "TOP NEWS",
                    risultati: "RISULTATI", diretta: "IN DIRETTA" };
    el("etichetta").textContent = NOMI_ET[D.et] || D.et || "COMO TV";
    if (!crawl) el("crawl").style.display = "none";

    // i titoli si danno il cambio in dissolvenza: solo opacita', niente
    // spostamenti — e il titolo nuovo si prepara mentre e' ancora invisibile
    var wrap = el("titowrap"), cur = null, idx = 0;
    function mostraTito(t) {
      var vecchio = cur;
      var e = document.createElement("div");
      e.className = "tito";
      e.innerHTML = "<b>" + esc(t) + "</b>";
      wrap.appendChild(e);
      cur = e;
      void e.offsetWidth;
      function via() {
        e.classList.add("in");
        if (vecchio) {
          vecchio.classList.remove("in"); vecchio.classList.add("out");
          setTimeout(function () { if (vecchio.parentNode) vecchio.parentNode.removeChild(vecchio); }, 1000);
        }
      }
      if (STILL) e.style.transition = "none";   // in anteprima e' gia' a posto
      via();
    }
    if (titoli.length) {
      mostraTito(titoli[idx++ % titoli.length]);
      if (titoli.length > 1 && !STILL) {
        setInterval(function () { mostraTito(titoli[idx++ % titoli.length]); }, 6000 * SLOW);
      }
    } else el("fasciatit").style.display = "none";
  }
  if (V2 && crawl) {
    // "||||" separa i blocchi, "·" le voci: la 1ª di ogni blocco e'
    // l'etichetta (oro), le altre sono dati (avorio) — come nel ticker
    function pezzo(txt) {
      return txt.split("·").map(function (v, i) {
        var t = esc(v.trim());
        if (i === 0) return '<span class="seghdr">' + t + '</span>';
        return '<span class="sep">|</span><span class="seg">' + t.replace(/(\d)PT\b/g, '$1<span class="pt">PT</span>') + '</span>';
      }).join("");
    }
    var blocchi = crawl.split("||||").map(function (b) { return pezzo(b.trim()); })
      .join('<span class="sep">|</span>');
    el("crawltrack").innerHTML =
      '<div class="uno" style="display:flex;align-items:center">' + blocchi + '<span class="sep">|</span></div>' +
      '<div class="uno" style="display:flex;align-items:center">' + blocchi + '<span class="sep">|</span></div>';
  }

  // ── entrata: la prima scheda e' gia' al suo posto (a scorrere e' la
  //    colonna intera) e si accende pezzo per pezzo ──
  schedaCur.style.transition = "none";
  schedaCur.classList.add("in");
  void schedaCur.offsetWidth;             // la mette a posto senza scorrere
  schedaCur.style.transition = "";
  function accendi(cls, ritardo, anim) {
    var e = schedaCur.querySelector("." + cls);
    if (!e) return;
    if (STILL) { e.style.opacity = 1; e.style.transform = "none"; return; }
    if (anim === "filo") e.style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) " + ritardo + "s forwards";
    else { e.classList.add("su"); e.style.animation = "salita .6s cubic-bezier(.2,.7,.3,1) " + ritardo + "s forwards"; }
  }
  if (STILL) {
    el("barra").style.transform = "none";
    if (V2 && crawl) el("fascia").style.transform = "none";
  } else {
    void el("barra").offsetWidth;      // niente attesa di fotogrammi: se la
    el("barra").classList.add("on");   // sorgente e' ferma la colonna deve
    if (V2 && crawl) el("fascia").classList.add("on");   // entrare lo stesso
  }
  accendi("occhiello", 0.75);
  accendi("titolo", 0.9);
  accendi("filo", 1.15, "filo");
  accendi("corpo", 1.25);
  accendi("stemma", 1.4);

  // scorrimento del crawl: velocita' costante, durata dal contenuto
  if (V2 && crawl && !STILL) {
    (function () {
      var uno = el("crawltrack").querySelector(".uno");
      if (!uno) return;
      // pixel di layout, interi: la misura scalata lasciava una frazione e
      // a ogni giro il crawl faceva un saltino
      var w = uno.offsetWidth;
      var dur = Math.max(12, w / 190);
      el("crawltrack").animate(
        [{ transform: "translate3d(0,0,0)" }, { transform: "translate3d(" + (-w) + "px,0,0)" }],
        { duration: dur * 1000 * SLOW, iterations: Infinity, easing: "linear" });
    })();
  }

  document.addEventListener("dblclick", function () { location.reload(); });
})();
</script>
</body>
</html>
