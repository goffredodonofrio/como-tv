<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Como 1907 · Condiviso</title>
<!--
  IL LINK CONDIVISO DEL MAM COMO 1907 (30/09/2026, come i link di Frame.io)
  La pagina pubblica (senza login Google) di un link creato dal team del club: mostra SOLO le clip
  scelte, si guardano nel browser e, se il link lo permette, si scaricano. Password facoltativa.
  La serve il servizio-1907 su /condivisi/<token> (vedi pubblico() in servizio-1907.py).
  Italiano o inglese secondo la lingua del browser.
-->
<style>
  @font-face{font-family:'Mazzard';src:url('/como-tv/assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('/como-tv/assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('/como-tv/assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{box-sizing:border-box;margin:0;padding:0;}
  [hidden]{display:none!important;}
  :root{color-scheme:dark;--navy:#0A0F24;--navy2:#141B3C;--pan:#1B2246;--riga:rgba(245,241,230,.1);--oro:#C9A24B;--oro2:#E3C271;--ivory:#F5F1E6;--ivory2:#D8D2C2;--fumo:#9AA3BD;}
  body{font:15px/1.5 'DM Sans',system-ui,sans-serif;background:radial-gradient(120% 70% at 50% 0%,#20284E,var(--navy) 60%) fixed,var(--navy);color:var(--ivory);min-height:100vh;}
  .testa{display:flex;align-items:center;gap:14px;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--riga);}
  .testa img{height:40px;width:auto;}
  .testa .marchio{font:800 13px/1 'Mazzard',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--oro);}
  .testa .lingua{margin-left:auto;display:flex;gap:4px;}
  .testa .lingua button{font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.12em;padding:6px 9px;border-radius:6px;border:1px solid var(--riga);background:none;color:var(--ivory2);cursor:pointer;}
  .testa .lingua button.on{background:var(--oro);color:#10131c;border-color:var(--oro);}
  main{padding:26px clamp(16px,4vw,48px) 60px;max-width:1500px;margin:0 auto;}
  h1{font:800 clamp(24px,3.4vw,38px)/1.08 'Mazzard',sans-serif;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;}
  .sotto{color:var(--fumo);margin-top:6px;font-size:13.5px;}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 22px;}
  .b{font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;border-radius:8px;border:1px solid rgba(201,162,75,.45);background:rgba(201,162,75,.08);color:var(--oro2);cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center;}
  .b:hover{background:var(--oro);color:#10131c;}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
  .clip{background:var(--pan);border:1px solid var(--riga);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;}
  .clip:hover,.clip:focus-visible{border-color:var(--oro);outline:none;}
  .clip .mini{position:relative;aspect-ratio:16/9;background:#070b1c center/cover no-repeat;}
  .clip .mini .play{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:34px;text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .clip .t{padding:10px 12px 12px;} .clip .t b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .clip .t small{color:var(--fumo);font-size:12px;}
  .velo{position:fixed;inset:0;background:rgba(3,5,14,.92);display:grid;place-items:center;padding:16px;z-index:10;}
  .lettore{width:min(1300px,100%);background:var(--pan);border:1px solid rgba(201,162,75,.35);border-radius:14px;overflow:hidden;}
  .lettore video,.lettore img{display:block;width:100%;max-height:78vh;background:#000;object-fit:contain;}
  .lettore .info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;}
  .lettore .info b{flex:1;min-width:0;word-break:break-word;}
  .accesso{max-width:420px;margin:12vh auto 0;background:var(--pan);border:1px solid var(--riga);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:12px;}
  .accesso input{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--riga);background:var(--navy);color:var(--ivory);}
  .errore{color:#F08A8D;font-size:13px;}
  .piede{color:var(--fumo);font-size:12px;margin-top:36px;}
  :focus-visible{outline:2px solid var(--oro);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header class="testa">
  <img src="/loghi/stemma-espn-2572.png" alt="Como 1907">
  <span class="marchio">Como 1907</span>
  <span class="lingua" role="group" aria-label="lingua / language"><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></span>
</header>
<main id="corpo"><p class="sotto" id="attesa">…</p></main>
<div class="velo" id="velo" hidden></div>
<script>
(function () {
  "use strict";
  var TOK = location.pathname.split("/").filter(Boolean)[1] || "", BASE = "/condivisi/" + TOK + "/";
  var L = /^it/i.test(navigator.language || "") ? "it" : "en";
  try { L = localStorage.getItem("c1907-lingua") || L; } catch (e) {}
  var T = {
    it: { attesa: "Carico…", cond: "Condiviso dal Como 1907", elementi: "elementi", scade: "Il link scade il", mai: "Il link non scade", scarica: "Scarica", scaricaTutto: "Scarica tutto", chiudi: "Chiudi", pw: "Questo link è protetto da una password.", entra: "Entra", sbagliata: "Password sbagliata.", niente: "Il link non contiene clip.", privato: "Materiale del Como 1907, condiviso in via riservata: non ripubblicarlo senza autorizzazione.", video: "video", foto: "foto" },
    en: { attesa: "Loading…", cond: "Shared by Como 1907", elementi: "items", scade: "This link expires on", mai: "This link does not expire", scarica: "Download", scaricaTutto: "Download all", chiudi: "Close", pw: "This link is password protected.", entra: "Enter", sbagliata: "Wrong password.", niente: "This link has no clips.", privato: "Como 1907 material, shared privately: do not republish without permission.", video: "video", foto: "photo" }
  };
  function t(k) { return T[L][k]; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function gb(b) { return b >= 1e9 ? (b / 1e9).toLocaleString(L, { maximumFractionDigits: 1 }) + " GB" : Math.max(1, Math.round(b / 1e6)) + " MB"; }
  var D = null;
  function lingua() { document.documentElement.lang = L; document.querySelectorAll("[data-l]").forEach(function (b) { b.classList.toggle("on", b.dataset.l === L); }); }
  document.querySelector(".lingua").addEventListener("click", function (e) { var b = e.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("c1907-lingua", L); } catch (x) {} lingua(); if (D) disegna(); else carica(); });
  function carica() {
    lingua(); $("attesa") && ($("attesa").textContent = t("attesa"));
    fetch(BASE + "info", { cache: "no-store", credentials: "same-origin" }).then(function (r) { return r.json().then(function (j) { j._s = r.status; return j; }); }).then(function (j) {
      if (j._s === 401 && j.password) return accesso(j.titolo);
      if (!j.ok) throw 0;
      D = j; document.title = j.titolo + " · Como 1907"; disegna();
    }).catch(function () { $("corpo").innerHTML = '<p class="sotto">' + esc(t("niente")) + "</p>"; });
  }
  function accesso(titolo) {
    $("corpo").innerHTML = '<form class="accesso" id="acc"><h1 style="font-size:22px">' + esc(titolo || "Como 1907") + '</h1><p class="sotto">' + esc(t("pw")) + '</p><input type="password" id="pw" autocomplete="current-password" required><p class="errore" id="err" hidden></p><button class="b" type="submit">' + esc(t("entra")) + "</button></form>";
    $("pw").focus();
    $("acc").onsubmit = function (e) {
      e.preventDefault();
      fetch(BASE + "accedi", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) })
        .then(function (r) { if (r.ok) carica(); else { $("err").textContent = t("sbagliata"); $("err").hidden = false; } });
    };
  }
  function disegna() {
    var el = D.elementi || [], scade = D.scade ? new Date(D.scade * 1000).toLocaleDateString(L, { day: "numeric", month: "long", year: "numeric" }) : "";
    var peso = el.reduce(function (s, x) { return s + (x.peso || 0); }, 0);
    $("corpo").innerHTML = "<h1>" + esc(D.titolo) + '</h1><p class="sotto">' + esc(t("cond")) + " · " + el.length + " " + esc(t("elementi")) + " · " + gb(peso) + " · " + esc(scade ? t("scade") + " " + scade : t("mai")) + "</p>" +
      (D.scarico && el.length > 1 ? '<div class="barra"><button class="b" type="button" id="tutto">' + esc(t("scaricaTutto")) + " (" + el.length + ")</button></div>" : '<div class="barra"></div>') +
      (el.length ? '<div class="griglia">' + el.map(function (x) {
        return '<div class="clip" tabindex="0" data-i="' + x.i + '"><div class="mini" style="background-image:url(&quot;' + BASE + "mini/" + x.i + '&quot;)">' + (x.tipo === "video" ? '<span class="play" aria-hidden="true">&#9654;</span>' : "") + '</div><div class="t"><b title="' + esc(x.nome) + '">' + esc(x.nome) + "</b><small>" + esc(t(x.tipo)) + " · " + gb(x.peso) + (x.cartella ? " · " + esc(x.cartella) : "") + "</small></div></div>";
      }).join("") + "</div>" : '<p class="sotto">' + esc(t("niente")) + "</p>") + '<p class="piede">' + esc(t("privato")) + "</p>";
    var tu = $("tutto"); if (tu) tu.onclick = function () { el.forEach(function (x, k) { setTimeout(function () { scarica(x.i); }, k * 1200); }); };
  }
  function scarica(i) { var a = document.createElement("a"); a.href = BASE + "file/" + i + "?scarica=1"; a.download = ""; document.body.appendChild(a); a.click(); a.remove(); }
  function apri(i) {
    var x = D.elementi.filter(function (y) { return y.i === i; })[0]; if (!x) return;
    var u = BASE + "file/" + i;
    $("velo").innerHTML = '<div class="lettore" role="dialog" aria-label="' + esc(x.nome) + '">' + (x.tipo === "video" ? '<video src="' + u + '" controls autoplay playsinline poster="' + BASE + "mini/" + i + '"></video>' : '<img src="' + u + '" alt="">') +
      '<div class="info"><b>' + esc(x.nome) + "</b>" + (D.scarico ? '<button class="b" type="button" id="sc">' + esc(t("scarica")) + " · " + gb(x.peso) + "</button>" : "") + '<button class="b" type="button" id="ch">' + esc(t("chiudi")) + "</button></div></div>";
    $("velo").hidden = false; $("ch").onclick = chiudi; var sc = $("sc"); if (sc) sc.onclick = function () { scarica(i); };
  }
  function chiudi() { var v = $("velo").querySelector("video"); if (v) v.pause(); $("velo").hidden = true; $("velo").innerHTML = ""; }
  $("velo").addEventListener("click", function (e) { if (e.target === $("velo")) chiudi(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("velo").hidden) chiudi(); if (e.key === "Enter" && e.target.classList && e.target.classList.contains("clip")) apri(+e.target.dataset.i); });
  document.addEventListener("click", function (e) { var c = e.target.closest && e.target.closest(".clip[data-i]"); if (c) apri(+c.dataset.i); });
  carica();
})();
</script>
</body>
</html>
