<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio (un vecchio segnalibro, un input vMix non aggiornato) comanderebbe
   un sistema che nessuno ascolta, e le grafiche non andrebbero in onda.
   Da GitHub si viene quindi portati sulla macchina giusta. Sulla VM questo
   non fa nulla. Se l'indirizzo della macchina cambia, va cambiato anche qui. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  // il percorso su GitHub (/como-tv/...) e' identico a quello sul dominio:
  // si cambia solo la casa
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formazioni · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    color-scheme:dark;
    --navy-900:#0A0F24;--navy-850:#0E1430;--navy-800:#141B3C;--navy-700:#20284E;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;
    --ivory:#F5F1E6;--ivory-dim:#D8D2C2;--fg-3:#8A8B96;
    --surface-panel:rgba(16,22,48,.66);
    --line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
    --ok:#4FCB8B;
    --gold-soft:rgba(201,162,75,.14);
  }
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;
    color:var(--ivory);min-height:100vh;
    background-color:#0A0F24;
    background-image:
      radial-gradient(90% 70% at 20% 8%, rgba(36,64,138,.5), transparent 55%),
      radial-gradient(80% 80% at 92% 108%, rgba(201,162,75,.16), transparent 55%),
      linear-gradient(165deg,#141B3C 0%,#0E1430 48%,#0A0F24 100%);
    background-attachment:fixed;
    padding-bottom:90px;
  }

  .nav{min-height:58px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:18px;
    padding:0 clamp(20px,4vw,56px);background:rgba(10,15,36,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2);}
  .nav-brand{font-family:'Mazzard',system-ui,sans-serif;font-size:12px;font-weight:800;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ivory);text-decoration:none;white-space:nowrap;}
  .nav-sep{color:rgba(245,241,230,.25);}
  .nav-here{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:rgba(245,241,230,.45);}
  .nav-links{margin-left:auto;display:flex;gap:10px;}
  .nav-links a{font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ivory-dim);text-decoration:none;
    padding:7px 14px;border:1px solid var(--line-2);border-radius:4px;}
  .nav-links a:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  .nav-links{flex-wrap:wrap;padding:8px 0;justify-content:flex-end;}
  .nav-links a.qui{color:var(--gold-bright);border-color:var(--line-gold);background:rgba(201,162,75,.08);}

  .wrap{max-width:1400px;margin:0 auto;padding:0 clamp(18px,3vw,32px);}

  header.page{padding:36px 0 18px;border-bottom:1px solid var(--line-gold);margin-bottom:20px;}
  .eyebrow{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Mazzard',system-ui,sans-serif;font-weight:800;font-size:clamp(28px,4vw,42px);
    line-height:.94;letter-spacing:-.02em;text-transform:uppercase;color:var(--ivory);}
  .srcline{margin-top:8px;font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:9px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(79,203,139,.6);flex:none;}

  label{font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
  select,input[type=text]{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:13px;
    padding:7px 9px;color:var(--ivory);width:100%;min-width:0;
    background:var(--surface-panel);
    border:1px solid var(--line-2);border-radius:5px;
  }
  select:hover,input[type=text]:hover{border-color:var(--line-gold);}
  button{
    font-family:'Mazzard',system-ui,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;
    padding:10px 13px;border-radius:5px;cursor:pointer;
    background:transparent;color:var(--ivory-dim);border:1px solid var(--line-2);
  }
  button:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  button:disabled{opacity:.35;cursor:default;}
  button.primary{background:var(--gold);border-color:var(--gold);color:#0A0F24;}
  /* il campetto da stampare: verdino, si riconosce al volo nella barra */
  #btnCampetto{background:rgba(79,203,139,.14);border-color:rgba(79,203,139,.55);color:#7BDCAA;}
  #btnCampetto:hover{background:rgba(79,203,139,.24);border-color:#4FCB8B;color:#8FE8BB;}
  button.primary:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#0A0F24;}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ─── testata squadre ─── */
  .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:start;margin-bottom:16px;}
  .teampanel{background:var(--surface-panel);border:1px solid var(--line-2);border-radius:10px;padding:14px;}
  .teampanel .side{font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-top:11px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .modebtn{font-family:'Mazzard',system-ui,sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;border-radius:4px;
    height:26px;padding:0 9px;display:inline-flex;align-items:center;white-space:nowrap;
    background:var(--gold);color:#0A0F24;border:1px solid var(--gold);
    box-shadow:0 2px 10px rgba(201,162,75,.35);}
  .modebtn:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#0A0F24;}
  .modebtn.off{background:transparent;color:var(--ivory-dim);border-color:var(--line-2);box-shadow:none;}
  .modebtn.off:hover{color:var(--gold-bright);border-color:var(--line-gold);background:transparent;}
  .modebtn.verde{background:rgba(79,203,139,.14);border-color:rgba(79,203,139,.55);color:#7BDCAA;box-shadow:none;}
  .modebtn.verde:hover{background:rgba(79,203,139,.24);border-color:#4FCB8B;color:#8FE8BB;}
  .modebtn.viola{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.55);color:#C4ACFB;box-shadow:none;}
  .modebtn.viola:hover{background:rgba(139,92,246,.28);border-color:#8B5CF6;color:#D5C4FD;}
  .kit{width:34px;height:26px;padding:2px;border:1px solid var(--line-2);border-radius:4px;
    background:var(--surface-panel);cursor:pointer;}
  .kit:hover{border-color:var(--line-gold);}
  .teampanel .row{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:10px;}
  .teampanel .row.manualrow{grid-template-columns:2.2fr .8fr;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .vs{font-family:'Mazzard',system-ui,sans-serif;font-size:22px;font-weight:800;color:var(--gold);
    align-self:center;padding:0 2px;letter-spacing:.05em;}

  /* ─── zona centrale: titolari | campo | titolari ─── */
  .main{display:grid;grid-template-columns:minmax(260px,300px) 1fr minmax(260px,300px);gap:16px;
    align-items:start;margin-bottom:18px;}
  .colpanel{background:var(--surface-panel);border:1px solid var(--line-2);border-radius:10px;padding:14px;}
  .colpanel h2{font-family:'Mazzard',system-ui,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--gold);margin-bottom:11px;display:flex;justify-content:space-between;
    align-items:baseline;gap:8px;flex-wrap:wrap;}
  .colpanel h2 small{font-family:'DM Sans',system-ui,sans-serif;font-size:11px;letter-spacing:0;
    text-transform:none;color:var(--fg-3);font-weight:500;}
  .slotrow{display:grid;grid-template-columns:26px 1fr 26px;gap:6px;align-items:center;margin-bottom:5px;}
  .slotrow.manual{grid-template-columns:44px 1fr 1fr 26px;}
  .slotrole{font-family:'Mazzard',system-ui,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.08em;
    color:var(--fg-3);text-align:center;border:1px solid var(--line-2);border-radius:4px;padding:6px 0;}
  .slotrole.n{font-size:11.5px;letter-spacing:0;color:var(--gold-bright);border-color:var(--line-gold);
    font-variant-numeric:tabular-nums;}
  .rowbtn{font-family:'DM Sans',system-ui,sans-serif;font-size:12px;font-weight:500;letter-spacing:0;
    text-transform:none;padding:5px 0;width:26px;text-align:center;
    background:transparent;color:var(--fg-3);border:1px solid var(--line-2);border-radius:4px;}
  .rowbtn:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  .coachrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;
    margin-top:11px;padding-top:11px;border-top:1px solid var(--line-2);}
  .coachrow .slotrole{color:var(--gold-bright);border-color:var(--line-gold);}

  /* ─── campo ─── */
  .pitchwrap{position:relative;background:linear-gradient(180deg,#101A3E 0%,#0C1330 100%);
    border:1px solid var(--line-gold);border-radius:12px;overflow:hidden;}
  .pitchwrap svg{display:block;width:100%;height:auto;}
  .dots{position:absolute;inset:0;}
  /* La casella non e' piu' fissa a 104px: vale --nmw, calcolato sul passo fra
     le linee del modulo. Il numero resta un cerchio di dimensione fissa, e' solo
     il nome che si allarga — cosi' due giocatori vicini non si toccano. */
  .pdot{position:absolute;transform:translate(-50%,-50%);text-align:center;
    width:var(--nmw,200px);
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .pdot.drag{cursor:grabbing;z-index:20;}
  .pdot .num{display:inline-flex;align-items:center;justify-content:center;
    width:37px;height:37px;border-radius:50%;
    font-family:'Mazzard',system-ui,sans-serif;font-size:15px;font-weight:800;
    background:var(--gold);color:#0A0F24;border:2px solid rgba(245,241,230,.9);
    box-shadow:0 3px 12px rgba(0,0,0,.55);pointer-events:none;}
  .pdot.away .num{background:#20284E;color:var(--ivory);border-color:var(--gold);}
  /* Niente ritaglio con i puntini: il nome si rimpicciolisce finche' ci sta.
     Un cognome tagliato a meta' in onda e' peggio di un cognome piccolo. */
  .pdot .nm{display:block;margin-top:3px;pointer-events:none;
    font-family:'Mazzard',system-ui,sans-serif;font-size:var(--nmfs,15px);font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;color:#FFFFFF;
    text-shadow:0 1px 3px rgba(0,0,0,1),0 0 10px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.9);
    white-space:nowrap;}
  .pdot.empty .num{background:rgba(245,241,230,.12);color:var(--fg-3);border-style:dashed;border-color:rgba(245,241,230,.3);}
  .teamtag{position:absolute;top:10px;pointer-events:none;
    font-family:'Mazzard',system-ui,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold-bright);text-shadow:0 1px 6px rgba(0,0,0,.8);}
  .teamtag.home{left:14px;}
  .teamtag.away{right:14px;}

  /* ─── panchine sotto ─── */
  .benches{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .benchgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;}

  /* ─── export / status / note ─── */
  .exportbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:6px 0 8px;}
  .seg{display:flex;border:1px solid var(--line-gold);border-radius:6px;overflow:hidden;}
  .seg button{border:0;border-radius:0;padding:12px 16px;background:var(--surface-panel);
    color:var(--ivory-dim);letter-spacing:.1em;}
  .seg button + button{border-left:1px solid var(--line-2);}
  .seg button:hover{color:var(--gold-bright);}
  .seg button.act{background:var(--gold);color:#0A0F24;}
  .seg button.act:hover{background:var(--gold);color:#0A0F24;}
  .toggles label{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;letter-spacing:0;text-transform:none;
    font-weight:500;color:var(--ivory-dim);display:flex;align-items:center;gap:7px;cursor:pointer;}
  .toggles input{accent-color:var(--gold);}
  .status{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;
    padding:12px 16px;background:var(--surface-panel);
    border:1px solid var(--line-2);border-left:3px solid var(--line-2);
    border-radius:5px;font-size:13px;margin-top:10px;}
  .status.ok{border-left-color:var(--ok);}
  .status.warn{border-left-color:var(--gold-bright);}
  .status.err{border-left-color:var(--red);}
  .status .msg{color:var(--ivory-dim);}
  .status .msg b{color:var(--ivory);}
  .pbar{height:6px;background:rgba(245,241,230,.08);border-radius:3px;overflow:hidden;
    flex:1 1 240px;min-width:200px;align-self:center;}
  .pfill{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;
    animation:pfill 2.6s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes pfill{0%{width:0}60%{width:72%}100%{width:92%}}
  .pfill.done{animation:none;width:100%;background:var(--ok);transition:width .25s ease;}
  .note{margin-top:18px;font-size:12.5px;color:var(--fg-3);max-width:92ch;line-height:1.65;}
  .note b{color:var(--ivory-dim);}
  .note code{font-size:.9em;background:rgba(245,241,230,.06);border:1px solid var(--line-2);
    border-radius:3px;padding:.1em .4em;color:var(--ivory-dim);}

  @media (max-width: 1080px){
    .teams{grid-template-columns:1fr;}
    .vs{display:none;}
    .main{grid-template-columns:1fr;}
    .pitchwrap{order:-1;}
    .benches{grid-template-columns:1fr;}
  }
  label{white-space:nowrap;}
  #btnRegia2{background:#4FA3E8;border-color:#4FA3E8;color:#0A0F24;}
  #btnRegia2:hover:not(:disabled){background:#74B9F0;border-color:#74B9F0;color:#0A0F24;}
  #btnRegia2:disabled{opacity:.4;cursor:default;}
  select option{background-color:#141B3C;color:#F5F1E6;}
  #btnPosReset{background:var(--gold);border-color:var(--gold);color:#0A0F24;}
  #btnPosReset:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#0A0F24;}
  #btnPrevChiudi{color:#FF6B6E;border-color:rgba(229,27,32,.5);}
  #btnPrevChiudi:hover{background:rgba(229,27,32,.12);border-color:var(--red);color:#FF6B6E;}
</style>
</head>

<script>
(function () {
  "use strict";

  function scegliCanale() {
    var s = document.getElementById("canaleSel");
    // il vecchio menu salvava "3|studio": si tiene solo il numero
    var c = parseInt(((s && s.value) || "1").split("|")[0], 10);
    if (!(c >= 1 && c <= 7)) c = 1;
    try { localStorage.setItem("comotv.regia.canale", String(c)); } catch (e) {}
    return { c: c, dest: "" };
  }


  // Una sola destinazione per macchina: il playout di quel vMix porta tutto,
  // grafiche e partita insieme, quindi non c'e' piu' da scegliere fra
  // "Live Studio" e "Live Match".
  (function () {
    var s = document.getElementById("canaleSel");
    if (!s) return;
    for (var i = 1; i <= 7; i++) {
      var op = document.createElement("option");
      op.value = String(i); op.textContent = "vMix " + i;
      s.appendChild(op);
    }
    var c = 1;
    try {
      var v = parseInt(localStorage.getItem("comotv.regia.canale"), 10); if (v >= 1 && v <= 7) c = v;
    } catch (e) {}
    s.value = String(c);
    if (!s.value) s.value = "1";
    s.addEventListener("change", function () {
      try { localStorage.setItem("comotv.regia.canale", s.value); } catch (e) {}
    });
  })();



  // Elenco omologato al portfolio della piattaforma Como TV (2026-08-25).
  // Le coppe a eliminazione diretta (Carabao, DFB-Pokal, Coupe de France,
  // Taça, Scottish Cup, King's Cup, supercoppe, Recopa, Como Cup, Trofeo
  // de Campeones, Supercopa Internacional) su ESPN non hanno un elenco
  // squadre: le loro partecipanti si pescano dal campionato di appartenenza
  // nel gruppo "Rose per le coppe". Tutte le voci sotto sono verificate
  // (standings CORS ok, roster ok — anche con codici coppa CONMEBOL).
  var COMPS = [
    { band: "🇮🇹", nome: "Serie A",                 code: "ita.1" },
    { band: "🇮🇹", nome: "Serie B",                 code: "ita.2" },

    { band: "🇮🇹", nome: "Under 18",                code: "giovanili.u18" },
    { band: "🇸🇦", nome: "Saudi Pro League",        code: "ksa.1" },
    { band: "🇦🇷", nome: "LPF Argentina",           code: "arg.1" },
    { band: "🇦🇷", nome: "Nacional B Argentina",    code: "arg.2" },
    { band: "🇦🇹", nome: "Bundesliga Austria",      code: "aut.1" },
    { band: "🇧🇷", nome: "Brasileirão (coppe CONMEBOL)", code: "bra.1" },
    { band: "🇫🇷", nome: "Ligue 1 (Coupe de France)", code: "fra.1" },
    { band: "🇫🇷", nome: "Ligue 2 (Coupe de France)", code: "fra.2" },
    { band: "🇩🇪", nome: "Bundesliga (DFB-Pokal)",  code: "ger.1" },
    { band: "🇩🇪", nome: "2. Bundesliga (DFB-Pokal)", code: "ger.2" },
    { band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "EFL Championship",        code: "eng.2" },
    { band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "Premier League (Carabao)",code: "eng.1" },
    { band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "League One (Carabao)",    code: "eng.3" },
    { band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "League Two (Carabao)",    code: "eng.4" },
    { band: "🇳🇱", nome: "Eredivisie",              code: "ned.1" },
    { band: "🇳🇱", nome: "Eerste Divisie NL",       code: "ned.2" },

    { band: "🇪🇺", nome: "Champions League",        code: "uefa.champions" },

    { band: "🌎", nome: "CONMEBOL Libertadores",   code: "conmebol.libertadores" },

  ];

  // la competizione proposta all'apertura resta l'EFL Championship
  // anche ora che l'elenco e' in ordine di paese
  var COMP_BASE = 0;
  COMPS.forEach(function (c, i) { if (c.code === "eng.2") COMP_BASE = i; });

  var MODULI = ["4-3-3","4-4-2","4-2-3-1","3-5-2","3-4-3","4-3-1-2","4-1-4-1","4-4-1-1","4-5-1","5-3-2","5-4-1","3-4-2-1"];
  var API = "https://site.api.espn.com/apis/site/v2/sports/soccer";
  var NBENCH = 20;

  var teamsCache = {};

  // slot: null | {p: indiceRosa} | {m:1, num, nome, cognome}
  function mkSide(label) {
    return { label: label, comp: COMP_BASE, teamId: "", teamName: "", roster: [], manualMode: false,
             mod: "4-3-3", tit: [], pan: [], custom: {}, posGraf: null, coachN: "", coachC: "",
             kit: label === "Trasferta" ? "#C8102E" : "#1735C8", maglia: "" };

  var sides = [mkSide("Casa"), mkSide("Trasferta")];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function status(kind, html) {
    el.status.className = "status" + (kind ? " " + kind : "");
    el.status.innerHTML = html;
  }

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function memoKey(side) { return "comotv.formazioni." + COMPS[side.comp].code + "." + side.teamId; }
  function saveMemo(side) {
    if (!side.teamId) return;
    safeSet(memoKey(side), JSON.stringify({ mod: side.mod, coachN: side.coachN, coachC: side.coachC }));
  }
  function loadMemo(side) {
    try {
      var m = JSON.parse(safeGet(memoKey(side)) || "{}");
      if (m.mod && MODULI.indexOf(m.mod) !== -1) side.mod = m.mod;
      side.coachN = m.coachN || "";
      side.coachC = m.coachC || "";
    } catch (e) {}
  }

  // ---------------- moduli / coordinate ----------------

  function linesOf(mod) { return [1].concat(mod.split("-").map(Number)); }

  function roleOfLine(li, tot) {
    if (li === 0) return "P";
    if (li === 1) return "D";
    if (li === tot - 1) return "A";
    return "C";
  }

  function slotGeo(mod) {
    var lines = linesOf(mod);
    var out = [];
    lines.forEach(function (n, li) {
      var x = lines.length > 1 ? li / (lines.length - 1) : 0;
      for (var k = 0; k < n; k++) {
        // La fascia occupata da ogni squadra passa da 0,82 a 0,92 della sua
        // meta' campo: le linee si allontanano del 12% e il nome ha piu' spazio.
        // Oltre non si puo' andare senza far toccare portiere e bandierina.
        out.push({ x: 0.04 + x * 0.92, y: (k + 1) / (n + 1), role: roleOfLine(li, lines.length) });
      }
    });
    return out;
  }

  // ---------------- risoluzione slot ----------------

  function resolve(side, v) {
    if (!v) return null;
    if (v.m) return { num: v.num, nome: v.nome, cognome: v.cognome };
    var p = side.roster[v.p];
    return p ? { num: p.num, nome: p.nome, cognome: p.cognome } : null;
  }

  function findPlayer(side, idx, skipZone, skipK) {
    var zones = [["tit", side.tit], ["pan", side.pan]];
    for (var z = 0; z < 2; z++) {
      var arr = zones[z][1];
      for (var k = 0; k < arr.length; k++) {
        if (zones[z][0] === skipZone && k === skipK) continue;
        if (arr[k] && !arr[k].m && arr[k].p === idx) return { zone: zones[z][0], k: k };
      }
    }
    return null;
  }

  // ---------------- fetch ----------------

  function loadTeams(side, then) {
    var code = COMPS[side.comp].code;
    if (teamsCache[code]) { then(); return; }
    // i campionati giovanili non stanno su ESPN: squadre dal database interno
    if (window.GIOVANILI && GIOVANILI.mia(code)) {
      teamsCache[code] = GIOVANILI.squadre(code);
      if (!teamsCache[code].length) {
        status("", '<span class="msg"><b>' + esc(COMPS[side.comp].nome) + '</b>: nessuna squadra ancora nel database interno (si scrive tutto a mano, o si aggiunge la rosa in giovanili.js).</span>');
      }
      then(); return;
    }
    status("", '<span class="msg">Carico le squadre di <b>' + esc(COMPS[side.comp].nome) + '</b>…</span>');
    // l'endpoint /teams non manda gli header CORS: l'elenco squadre si
    // ricava dalle classifiche (apis/v2), che il browser può leggere.
    fetch("https://site.api.espn.com/apis/v2/sports/soccer/" + code + "/standings")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        var teams = [];
        (d.children || []).forEach(function (ch) {
          ((ch.standings && ch.standings.entries) || []).forEach(function (e) {
            teams.push({ id: String(e.team.id), name: e.team.displayName || e.team.name });
          });
        });
        teams.sort(function (a, b) { return a.name.localeCompare(b.name); });
        teamsCache[code] = teams;
        then();
      })
      .catch(function (err) {
        status("err", '<span class="msg"><b>Squadre non caricate.</b> ' + esc(err.message) + '</span>');
      });
  }

  function loadRoster(side) {
    var code = COMPS[side.comp].code;
    side.posGraf = null;   // rosa nuova = via le posizioni trascinate a mano
    if (window.GIOVANILI && GIOVANILI.mia(code)) {
      side.roster = GIOVANILI.rosa(code, side.teamId);
      // squadra senza rosa in database (le avversarie): dritti alla
      // scrittura manuale, col nome squadra gia' compilato
      if (!side.roster.length) {
        var nomeSq = side.teamName;
        side.manualMode = true;
        side.teamId = ""; side.custom = {};
        side.tit = []; for (var mi = 0; mi < 11; mi++) side.tit.push(mkManualRow());
        side.pan = []; for (var mj = 0; mj < NBENCH; mj++) side.pan.push(mkManualRow());
        side.coachN = ""; side.coachC = "";
        side.teamName = nomeSq;
        renderAll();
        status("", '<span class="msg"><b>' + esc(nomeSq) + '</b>: rosa non ancora in database — scrivi gli undici a mano (nome squadra gi\u00e0 compilato).</span>');
        return;
      }
      loadMemo(side);
      autoFill(side);
      renderAll();
      status("ok", '<span class="msg"><b>' + esc(side.teamName) + '</b>: rosa di ' + side.roster.length + ' giocatori dal database interno (i numeri di maglia si scrivono qui).</span>');
      return;
    }
    status("", '<span class="msg">Carico la rosa di <b>' + esc(side.teamName) + '</b>…</span>');
    fetch(API + "/" + code + "/teams/" + side.teamId + "/roster")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        side.roster = (d.athletes || []).map(function (a, i) {
          return {
            idx: i,
            num: a.jersey || "",
            nome: a.firstName || "",
            cognome: a.lastName || (a.displayName || ""),
            ruolo: (a.position && a.position.abbreviation) || "?"
          };
        });
        loadMemo(side);
        autoFill(side);
        renderAll();
        status("ok", '<span class="msg"><b>' + esc(side.teamName) + '</b>: rosa di ' + side.roster.length + ' giocatori caricata.</span>');
      })
      .catch(function (err) {
        side.roster = []; side.tit = []; side.pan = [];
        renderAll();
        status("err", '<span class="msg"><b>Rosa non caricata.</b> ' + esc(err.message) + '</span>');
      });
  }

  // ---------------- schieramento automatico ----------------

  function autoFill(side) {
    var geo = slotGeo(side.mod);
    var used = {};
    side.custom = {};
    side.tit = geo.map(function (g) {
      var want = g.role === "P" ? "G" : g.role === "D" ? "D" : g.role === "C" ? "M" : "F";
      for (var i = 0; i < side.roster.length; i++) {
        var p = side.roster[i];
        if (used[p.idx]) continue;
        if (p.ruolo === want) { used[p.idx] = true; return { p: p.idx }; }
      }
      return null;
    });
    side.tit = side.tit.map(function (s) {
      if (s) return s;
      for (var i = 0; i < side.roster.length; i++) {
        if (!used[side.roster[i].idx]) { used[side.roster[i].idx] = true; return { p: side.roster[i].idx }; }
      }
      return null;
    });
    side.pan = [];
    for (var i = 0; i < side.roster.length && side.pan.length < NBENCH; i++) {
      if (!used[side.roster[i].idx]) side.pan.push({ p: side.roster[i].idx });
    }
    while (side.pan.length < NBENCH) side.pan.push(null);
  }

  // ---------------- render ----------------

  function renderAll() { renderTeams(); renderPitch(); renderCols(); renderBenches(); }

  function renderTeams() {
    var h = "";

          moduloSel +

      } else {
        var code = COMPS[side.comp].code;
        var teams = teamsCache[code] || [];
        h += '<div class="row">' +
          '<div class="field"><label>Competizione</label><select data-si="' + si + '" data-k="comp">' +
            COMPS.map(function (c, i) {
              return '<option value="' + i + '"' + (i === side.comp ? " selected" : "") + '>' + esc((c.band ? c.band + " " : "") + c.nome) + '</option>';
            }).join("") +
          '</select></div>' +
          '<div class="field"><label>Squadra</label><select data-si="' + si + '" data-k="team">' +
            '<option value="">—</option>' +
            teams.map(function (t) { return '<option value="' + t.id + '"' + (t.id === side.teamId ? " selected" : "") + '>' + esc(t.name) + '</option>'; }).join("") +
          '</select></div>' +

        '</div>';

      h += lineaLato + '</div>';

  // ---------------- misura dei nomi sul campo ----------------
  // Obiettivo: 200px per nome. Dove il modulo non li concede — un 4-2-3-1 ha
  // quattro linee per meta' campo, e il passo fra due linee su un campo largo
  // 800px sta intorno ai 140px — si usa lo spazio che c'e' e si rimpicciolisce
  // il testo, invece di tagliarlo con i puntini. Un cognome mozzato in onda e'
  // peggio di un cognome piccolo.
  var NM_MAX = 200, NM_FS_MAX = 15, NM_FS_MIN = 9;
  var _mis = null, _fontPronto = false;
  if (document.fonts && document.fonts.load) {
    document.fonts.load("700 15px Mazzard").then(function () {
      _fontPronto = true;
      if (typeof renderPitch === "function") renderPitch();   // rimisura col font vero
    }).catch(function () { _fontPronto = true; });
  } else { _fontPronto = true; }
  function larghezzaTesto(txt, px) {
    if (!_mis) _mis = document.createElement("canvas").getContext("2d");
    _mis.font = "700 " + px + "px Mazzard, system-ui, sans-serif";
    // Il CSS scrive in maiuscolo e aggiunge 0.02em fra le lettere: misurare la
    // stringa come arriva sottostima, le maiuscole sono piu' larghe.
    var T = String(txt).toUpperCase();
    return _mis.measureText(T).width + T.length * px * 0.02;
  }
  // Passo orizzontale fra due linee del modulo, in pixel reali.
  // Se il campo misura meno di 320px il layout non e' ancora pronto (succede al
  // primo disegno e a finestra ridisegnata): meglio non congelare le caselle
  // sul minimo, si usa il valore pieno e si rimisura appena c'e' spazio vero.
  function passoLinee(mod) {
    var w = el.pitch ? el.pitch.getBoundingClientRect().width : 0;
    if (w < 320) return NM_MAX;
    var linee = linesOf(mod).length;
    if (linee < 2) return NM_MAX;
    return w * 0.472 * 0.92 / (linee - 1);
  }
  function misuraNome(txt, passo) {
    var largh = Math.max(64, Math.min(NM_MAX, passo - 14));
    var fs = NM_FS_MAX, w = larghezzaTesto(txt, fs);
    // col font di sistema la misura sottostima: si tiene un margine finche'
    // Mazzard non e' caricato, poi il ridisegno usa la misura vera
    if (!_fontPronto) w *= 1.12;
    if (w > largh) fs = Math.max(NM_FS_MIN, Math.floor(fs * largh / w * 10) / 10);
    return { w: Math.round(largh), fs: fs };
  }

  // La larghezza del campo cambia con la finestra: le caselle dei nomi sono
  // calcolate in pixel, quindi vanno rifatte.
  var _rid = 0;
  window.addEventListener("resize", function () {
    clearTimeout(_rid);
    _rid = setTimeout(function () { if (typeof renderPitch === "function") renderPitch(); }, 180);
  });
  function renderPitch() {
    var h = "";
    sides.forEach(function (side, si) {
      var geo = slotGeo(side.mod), passo = passoLinee(side.mod);
      geo.forEach(function (g, k) {
        var c = side.custom[k];
        var px = c ? c.x : (si === 0 ? (1.4 + g.x * 47.2) : (98.6 - g.x * 47.2));
        // lo slot 1 e' il SINISTRO della squadra (vista dalla sua porta):
        // in casa e' la parte alta del campo, in trasferta quella bassa
        var py = c ? c.y : (si === 0 ? (4 + g.y * 92) : (96 - g.y * 92));
        var d = resolve(side, side.tit[k]);
        var cognome = d ? String(d.cognome || "") : "—";
        var m = misuraNome(cognome, passo);
        h += '<div class="pdot' + (si === 1 ? " away" : "") + (d ? "" : " empty") + '"' +
             ' data-si="' + si + '" data-slot="' + k + '"' +
             ' style="left:' + px + '%;top:' + py + '%;--nmw:' + m.w + 'px;--nmfs:' + m.fs + 'px">' +
             '<span class="num">' + (d ? esc(d.num || "–") : "?") + '</span>' +
             '<span class="nm">' + esc(cognome) + '</span>' +
             '</div>';
      });
    });
    el.dots.innerHTML = h;
    el.tagHome.textContent = sides[0].teamName ? sides[0].teamName + " · " + sides[0].mod : "";
    el.tagAway.textContent = sides[1].teamName ? sides[1].teamName + " · " + sides[1].mod : "";
  }

  function playerLabel(p) {
    return p.cognome + (p.nome ? " " + p.nome : "") + " · " + p.ruolo;
  }

  function slotRowHTML(side, si, zone, k, roleLabel) {
    var v = zone === "tit" ? side.tit[k] : side.pan[k];
    var at = ' data-si="' + si + '" data-zone="' + zone + '" data-slot="' + k + '"';

    if (v && v.m) {
      return '<div class="slotrow manual">' +
        '<input type="text" placeholder="N°" value="' + esc(v.num) + '" data-k="mnum"' + at + '>' +
        '<input type="text" placeholder="Nome" value="' + esc(v.nome) + '" data-k="mnome"' + at + '>' +
        '<input type="text" placeholder="Cognome" value="' + esc(v.cognome) + '" data-k="mcog"' + at + '>' +
        '<button class="rowbtn" title="Torna al menu" data-act="rev"' + at + '>&#10226;</button>' +
        '</div>';
    }

    var d = resolve(side, v);
    var hasNum = d && String(d.num || "").length;
    return '<div class="slotrow">' +
      '<span class="slotrole' + (hasNum ? " n" : "") + '">' + (hasNum ? esc(d.num) : roleLabel) + '</span>' +
      '<select data-k="slot"' + at + '>' +

  // ---------------- csv ----------------

  function stripAccents(s) {
    return s.normalize ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : s;
  }

  function clean(s) {
    s = String(s || "").replace(/,/g, " ").replace(/\s+/g, " ").trim();
    return el.ascii.checked ? stripAccents(s) : s;
  }

  function buildCSV(side) {
    var lines = ["NUMERO,NOME,COGNOME"];
    side.tit.forEach(function (v) {
      var d = resolve(side, v);
      lines.push(clean(d.num) + "," + clean(d.nome) + "," + clean(d.cognome));
    });
    // riga 13: allenatore (vincolo di Formazioni 7.0.jsx)
    lines.push("," + clean(side.coachN) + "," + clean(side.coachC));
    side.pan.forEach(function (v) {
      var d = resolve(side, v);
      if (d && (d.cognome || d.nome)) lines.push(clean(d.num) + "," + clean(d.nome) + "," + clean(d.cognome));
    });
    return lines.join("\r\n") + "\r\n";
  }

  function download(which) {
    var chosen = which.map(function (i) { return sides[i]; });
    var problemi = [], bloccanti = [];

    chosen.forEach(function (side) {
      if (!side.tit.length) {
        bloccanti.push(side.label + ": nessuna squadra caricata");
        return;
      }
      var vuoti = side.tit.filter(function (v) {
        var d = resolve(side, v);
        return !d || !(d.cognome || d.nome);
      }).length;
      if (vuoti) bloccanti.push(side.label + ": " + vuoti + " maglie non assegnate");
      if (!side.coachC) problemi.push(side.label + ": manca l'allenatore (riga 13 del CSV)");
    });

    if (bloccanti.length) {
      status("err", '<span class="msg"><b>Non posso esportare:</b> ' + esc(bloccanti.join(" · ")) + '</span>');
      return;
    }

    function fnameOf(side) {
      return "FORMAZIONE " + (clean(side.teamName).toUpperCase() || side.label.toUpperCase()) + ".csv";
    }

    if (chosen.length === 1) {
      saveBlob(new Blob([buildCSV(chosen[0])], { type: "text/csv;charset=utf-8" }), fnameOf(chosen[0]));
    } else {
      // due file in un colpo solo: i browser bloccano i download multipli,
      // quindi le due squadre viaggiano dentro un unico ZIP
      var files = chosen.map(function (side) { return { name: fnameOf(side), text: buildCSV(side) }; });
      var zipName = "FORMAZIONI " + chosen.map(function (s) {
        return (clean(s.teamName).toUpperCase() || s.label.toUpperCase());
      }).join(" - ") + ".zip";
      saveBlob(buildZip(files), zipName);
    }

    if (problemi.length) {
      status("warn", '<span class="msg"><b>Esportato con avvisi:</b> ' + esc(problemi.join(" · ")) + '</span>');
    } else {
      status("ok", '<span class="msg">Scaricat' + (chosen.length > 1 ? 'o <b>1 ZIP</b> con 2 CSV' : 'o <b>1 file</b>') + ': ' +
        chosen.map(function (s) { return esc(s.teamName || s.label); }).join(" e ") + '.</span>');
    }
  }

  function crc32(bytes) {
    if (!crc32.t) {
      crc32.t = [];
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        crc32.t[n] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = crc32.t[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZip(files) {   // files: [{name, text}] — ZIP metodo STORE
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0;

    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);

      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true);
      parts.push(lh.buffer, name, data);

      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);

      offset += 30 + name.length + data.length;
    });

    var centralSize = 0;
    central.forEach(function (b) { centralSize += b.byteLength || b.length; });

    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, centralSize, true); eocd.setUint32(16, offset, true);

    return new Blob(parts.concat(central, [eocd.buffer]), { type: "application/zip" });
  }

  function saveBlob(blob, fname) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  // ---------------- ponte verso il foglio Google ----------------
  // L'URL del ponte (Apps Script /exec) e il token si configurano una
  // volta per postazione col pulsante ⚙ e restano in localStorage:
  // così non finiscono nel codice pubblicato su Pages.

  var PONTE_URL = "comotv.ponte.url", PONTE_TOKEN = "comotv.ponte.token";
  // Ponte già configurato di serie: funziona da qualsiasi postazione senza
  // impostare nulla. Il pulsante ⚙ serve solo se un giorno cambia l'indirizzo.
  var PONTE_DEFAULT = {
    url: "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec",
    token: "como_tv_grafiche"
  };
  if (window.Destinazione) Destinazione.adotta(document.getElementById("canaleSel"), PONTE_DEFAULT.url, PONTE_DEFAULT.token);

  function ponteConfig(forza) {
    var url = safeGet(PONTE_URL) || PONTE_DEFAULT.url;
    var tok = safeGet(PONTE_TOKEN) || PONTE_DEFAULT.token;
    if (forza) {
      url = window.prompt("Indirizzo del ponte Apps Script (finisce con /exec):", url);
      if (url === null) return null;
      url = url.trim() || PONTE_DEFAULT.url;
      safeSet(PONTE_URL, url);
      tok = window.prompt("Parola d'ordine del ponte:", tok);
      if (tok === null) return null;
      tok = tok.trim() || PONTE_DEFAULT.token;
      safeSet(PONTE_TOKEN, tok);
    }
    return { url: url, token: tok };
  }

  function ymd() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  }

  function inviaAlFoglio(which) {
    which = which || [0, 1];
    var cfg = ponteConfig(false);
    if (!cfg) return;

    var pronte = [], problemi = [];
    sides.forEach(function (side, si) {
      if (which.indexOf(si) === -1) return;
      if (!side.tit.length) return;
      var vuoti = side.tit.filter(function (v) {
        var d = resolve(side, v);
        return !d || !(d.cognome || d.nome);
      }).length;
      if (vuoti) { problemi.push(side.label + ": " + vuoti + " maglie non assegnate"); return; }
      pronte.push({
        nome: side.teamName || side.label,
        lato: side.label === "Trasferta" ? "trasferta" : "casa",
        modulo: side.mod,
        titolari: side.tit.map(function (v) { var d = resolve(side, v); return [d.num || "", d.nome || "", d.cognome || ""]; }),
        allenatore: [side.coachN || "", side.coachC || ""],
        panchina: side.pan.map(function (v) { return resolve(side, v); })
          .filter(function (d) { return d && (d.cognome || d.nome); })
          .map(function (d) { return [d.num || "", d.nome || "", d.cognome || ""]; })
      });
    });

    if (!pronte.length) {
      status("err", '<span class="msg"><b>Niente da inviare.</b> ' + esc(problemi.join(" · ") || "Carica almeno una squadra completa.") + '</span>');
      return;
    }

    status("", '<span class="msg">Invio al foglio&hellip;</span>');
    fetch(cfg.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: cfg.token, tipo: "formazioni", data: ymd(), squadre: pronte })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          (function(){var FURL='https://docs.google.com/spreadsheets/d/1Wa9-jSSPbc7l2Y4Ewau2k9sDgTD1JPc8cD6KCPfXjJU/edit';window.linkFoglio=function(res){var gids=res&&res.gids;var tabs=(res&&res.tabs)||[];if(gids&&gids.length===tabs.length){return tabs.map(function(t,i){return '<a href="'+FURL+'#gid='+gids[i]+'" target="_blank" style="color:var(--gold-bright)">'+t+'</a>';}).join(', ');}return tabs.map(function(t){return esc(t);}).join(', ')+' &nbsp;<a href="'+FURL+'" target="_blank" style="color:var(--gold-bright)">apri il foglio &rarr;</a>';};})();
          status("ok", '<span class="msg">Creat' + (res.tabs.length > 1 ? 'i' : 'o') + ' nel foglio: <b>' + linkFoglio(res) + '</b>' +
            (problemi.length ? ' · non inviata: ' + esc(problemi.join(" · ")) : '') + '</span>');
        } else {
          status("err", '<span class="msg"><b>Il foglio ha rifiutato l\'invio:</b> ' + esc(res.errore || "errore sconosciuto") + '</span>');
        }
      })
      .catch(function () {
        status("err", '<span class="msg"><b>Ponte non raggiungibile.</b> Controlla indirizzo /exec e che la Web App sia pubblicata per "Chiunque" (pulsante &#9881; per ricontrollare i dati).</span>');
      });
  }

  document.getElementById("btnSheet").addEventListener("click", function () { inviaAlFoglio(targetIdx()); });

  // ---------------- grafica vMix ----------------
  // Genera l'URL della grafica animata (formazione-vmix.html) con i dati
  // della squadra dentro: quell'URL si incolla in vMix come input
  // "Web Browser" 1920x1080. Doppio click o tasto R = replay.

  function vmixPayload(si) {
    var side = sides[si];
    if (!side.tit.length) {
      status("err", '<span class="msg"><b>' + side.label + ':</b> nessuna squadra caricata.</span>');
      return null;
    }
    var vuoti = side.tit.filter(function (v) {
      var d = resolve(side, v);
      return !d || !(d.cognome || d.nome);
    }).length;
    if (vuoti) {
      status("err", '<span class="msg"><b>' + side.label + ':</b> ' + vuoti + ' maglie non assegnate.</span>');
      return null;
    }

    function tri(v) { var d = resolve(side, v); return [d.num || "", d.nome || "", d.cognome || ""]; }

    return {
      n: side.teamName || side.label,
      m: side.mod,
      k: side.kit,
      mg: side.maglia ? magliaUrl(side, side.maglia) || undefined : undefined,
      l: (function () {
        // magazzino prima (anche col nome senza la coda "Primavera"/"Under"),
        // poi lo stemma del club senior per le giovanili, poi ESPN
        var mio = slugM(side.teamName || "");
        var corto = mio.replace(/-(primavera|under-\d+|u\d+)$/, "");
        if (LOGHI_SCAVALCO[mio]) return LOGHI_SCAVALCO[mio];
        if (LOGHI_SCAVALCO[corto]) return LOGHI_SCAVALCO[corto];
        var code = COMPS[side.comp].code;
        if (window.GIOVANILI && GIOVANILI.mia(code)) {
          var t = GIOVANILI.tid(code, side.teamId);
          return t ? "https://a.espncdn.com/i/teamlogos/soccer/500/" + t + ".png" : "";
        }
        return side.teamId ? "https://a.espncdn.com/i/teamlogos/soccer/500/" + side.teamId + ".png" : "";
      })(),
      a: [side.coachN || "", side.coachC || ""],
      g: side.posGraf || undefined,
      t: side.tit.map(tri),
      p: side.pan.map(function (v) { return resolve(side, v); })
        .filter(function (d) { return d && (d.cognome || d.nome); })
        .map(function (d) { return [d.num || "", d.nome || "", d.cognome || ""]; })
    };
  }

  // ── le maglie vere: il magazzino del ponte ──────────────────────────
  // Convenzione: maglia-<squadra>-casa.png / -trasferta.png nel deposito
  // dei loghi. Caricata una volta, resta per tutte le prossime grafiche.
  var MAGLIE = {};                 // chiave file -> url
  var LOGHI_SCAVALCO = {};         // slug squadra -> logo che sostituisce ESPN
  function slugM(nome) {
    return String(nome || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48);
  }
  // L'archivio usa nomi da collezione ("milan", "inter", "manunited"),
  // ESPN nomi per esteso ("AC Milan", "Internazionale"): si prova
  // l'aggancio esatto e poi il contenimento, preferendo la chiave piu'
  // lunga. Sotto i 4 caratteri niente contenimento: troppi falsi amici.
  function magliaUrl(side, dove) {
    var mio = slugM(side.teamName || side.label);
    var k = "maglia-" + mio + "-" + dove;
    if (MAGLIE[k]) return MAGLIE[k];
    if (mio.length < 4) return "";   // slug corto/vuoto: mai l'aggancio elastico
    var fine = "-" + dove, meglio = "", lungo = 0;
    for (var chiave in MAGLIE) {
      if (chiave.slice(-fine.length) !== fine) continue;
      var squadra = chiave.slice(7, -fine.length);
      if (squadra.length < 4) continue;
      var mioC = "-" + mio + "-", sqC = "-" + squadra + "-";
      if (mioC.indexOf(sqC) < 0 && sqC.indexOf(mioC) < 0
          && mio.indexOf(squadra) !== 0 && squadra.indexOf(mio) !== 0) continue;
      if (squadra.length > lungo) { lungo = squadra.length; meglio = MAGLIE[chiave]; }
    }
    return meglio;
  }
  function caricaElencoMaglie(poi) {
    var cfg = ponteConfig(false);
    if (!cfg) { if (poi) poi(); return; }
    fetch(cfg.url + "?loghi=1", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        MAGLIE = {}; LOGHI_SCAVALCO = {};
        (j.loghi || []).forEach(function (x) {
          if (/^maglia-/.test(x.chiave)) MAGLIE[x.chiave] = x.url;
          // un logo caricato col nome della squadra scavalca quello ESPN:
          // serve per gli stemmi neri, illeggibili sul fondo navy (Juve)
          else LOGHI_SCAVALCO[x.chiave] = x.url;
        });
        if (poi) poi();
      })
      .catch(function () { if (poi) poi(); });
  }
  caricaElencoMaglie();

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("magliaSel")) {
      sides[+t.dataset.si].maglia = t.value;
      renderAll();
      return;
    }
    if (t.classList && t.classList.contains("magliaFile") && t.files && t.files[0]) {
      var si = +t.dataset.si, side = sides[si];
      var dove = window.confirm("OK = maglia di CASA · Annulla = maglia da TRASFERTA") ? "casa" : "trasferta";
      var lettore = new FileReader();
      lettore.onload = function () {
        var cfg = ponteConfig(false);
        if (!cfg) return;
        status("", '<span class="msg">Carico la maglia di ' + esc(side.teamName || side.label) + ' (' + dove + ')&hellip;</span>');
        fetch(cfg.url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ token: cfg.token, tipo: "logo-carica",
                                 nome: "maglia " + (side.teamName || side.label) + " " + dove,
                                 dati: lettore.result })
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.errore || "carico fallito");
            caricaElencoMaglie(function () {
              side.maglia = dove;
              renderAll();
              status("ok", '<span class="msg">Maglia <b>' + dove + '</b> di <b>' + esc(side.teamName || side.label) + '</b> nel magazzino: resta per le prossime grafiche.</span>');
            });
          })
          .catch(function (err) { status("err", '<span class="msg">Maglia non caricata: ' + esc(err.message) + '</span>'); });
      };
      lettore.readAsDataURL(t.files[0]);
      t.value = "";
    }
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest('button[data-act="maglia-su"]') : null;
    if (!b) return;
    var inp = document.querySelector('.magliaFile[data-si="' + b.dataset.si + '"]');
    if (inp) inp.click();
  });

  // ── anteprima incorporata: la grafica vera, con le maglie trascinabili ──
  var latoInPreview = null;

  function grafVmix(si) {
    var side = sides[si];
    var payload = vmixPayload(si);
    if (!payload) return;

    latoInPreview = si;
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

    var box = document.getElementById("prevFbox");
    box.style.display = "block";
    document.getElementById("prevF").src = "formazione-vmix.html?d=" + b64 + "&edit=1";
    fitPrevF();
    document.getElementById("prevFcap").innerHTML =
      "<b>" + esc(side.teamName || side.label) + "</b> — trascina le maglie per sistemare i nomi; " +
      "doppio click su una maglia per rimetterla al suo posto.";
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function fitPrevF() {
    var box = document.getElementById("prevFbox");
    if (!box || box.style.display === "none") return;
    var w = box.firstElementChild.clientWidth;
    document.getElementById("prevF").style.transform = "scale(" + (w / 1920) + ")";
  }
  window.addEventListener("resize", fitPrevF);

  // le posizioni sistemate a mano tornano dalla grafica e restano
  // attaccate al lato: partiranno col prossimo invio in regia
  window.addEventListener("message", function (ev) {
    if (!ev.data || ev.data.comotv !== "formazione-posizioni") return;
    if (latoInPreview === null) return;
    var side = sides[latoInPreview];
    side.posGraf = ev.data.mosse ? ev.data.g : null;
    var cap = document.getElementById("prevFcap");
    if (ev.data.mosse) {
      cap.innerHTML = "<b>" + esc(side.teamName || side.label) + "</b> &mdash; " + ev.data.mosse +
        (ev.data.mosse === 1 ? " maglia sistemata" : " maglie sistemate") +
        ": partiranno cos&igrave; con <b>Invia alla regia</b>.";
    } else {
      cap.innerHTML = "<b>" + esc(side.teamName || side.label) + "</b> &mdash; schieramento automatico dal modulo. " +
        "Trascina le maglie per sistemare i nomi.";
    }
  });

  document.getElementById("btnPosReset").addEventListener("click", function () {
    var fr = document.getElementById("prevF");
    if (fr.contentWindow) fr.contentWindow.postMessage({ comotv: "formazione-reset" }, "*");
  });
  document.getElementById("btnPrevChiudi").addEventListener("click", function () {
    document.getElementById("prevFbox").style.display = "none";
    document.getElementById("prevF").src = "about:blank";
    latoInPreview = null;
  });

  function anteprimaLato(si, nome) {
    if (!sideCompleto(si)) {
      status("err", '<span class="msg"><b>Formazione ' + nome + ' non completa:</b> controlla le maglie non assegnate.</span>');
      return;
    }
    grafVmix(si);
  }
  el.teams.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest('button[data-act="anteprima"]') : null;
    if (!b) return;
    var si = +b.dataset.si;
    anteprimaLato(si, si === 0 ? "di casa" : "in trasferta");
  });

  // ---------------- invio alla regia ----------------
  var __canale = { c: 1, dest: "studio" };   // scelto al click, vale per entrambe le squadre
  // Carica la formazione sul "centralino": la pagina grafica-live.html
  // (URL fisso dentro vMix) la riceve e la console regia.html decide
  // quando mandarla in onda.

  function inviaRegia(si) {
    var payload = vmixPayload(si);
    if (!payload) return;
    var cfg = ponteConfig(false);
    if (!cfg) return;

    // il nome in scaletta lo decide chi invia (proposta modificabile)
    var proposto = "FORMAZIONE " + String(payload.n || sides[si].label).toUpperCase();
    var titolo = window.prompt("Nome in scaletta di regia:", proposto);
    if (titolo === null) return;
    titolo = titolo.trim() || proposto;

    var avvisoPos = payload.g ? " (con le posizioni sistemate a mano \u2014 \u21bb Rimetti in ordine nell\u2019anteprima per lo schieramento automatico)" : "";
    status("", '<span class="msg">Invio di <b>' + esc(payload.n) + '</b> a ' + Destinazione.dove() + avvisoPos + '&hellip;</span>' +
               '<span class="pbar"><span class="pfill" id="pfill"></span></span>');
    return fetch(cfg.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: cfg.token }, Destinazione.corpo({ grafica: "formazione",
                             titolo: titolo, dati: payload })))
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          var pf = document.getElementById("pfill");
          if (pf) pf.className = "pfill done";
          setTimeout(function () {
            status("ok", '<span class="msg"><b>' + esc(payload.n) + '</b> aggiunta a ' + Destinazione.dove() + '. ' +
              'Dalla <a href="regia.html" target="_blank" style="color:var(--gold-bright)">console</a> la mandi in onda quando vuoi.</span>');
          }, 350);
        } else {
          status("err", '<span class="msg"><b>La regia ha rifiutato il carico:</b> ' + esc(res.errore || "errore sconosciuto") + '</span>');
        }
      })
      .catch(function () {
        status("err", '<span class="msg"><b>Ponte non raggiungibile.</b> Se lo script è stato appena aggiornato, serve la nuova versione del deployment.</span>');
      });
  }

  document.getElementById("btnRegia2").addEventListener("click", function () {
    var list = targetIdx().filter(sideCompleto);
    if (!list.length) {
      status("err", '<span class="msg"><b>Nessuna formazione completa</b> per la selezione: controlla le maglie non assegnate.</span>');
      return;
    }
    var scelto = scegliCanale();
    if (scelto === null) return;
    __canale = scelto;
    (function run(rest) {
      if (!rest.length) return;
      var p = inviaRegia(rest[0]);
      (p && p.then ? p : Promise.resolve()).then(function () {
        // piccola pausa tra i due invii perché i messaggi restino leggibili
        setTimeout(function () { run(rest.slice(1)); }, rest.length > 1 ? 700 : 0);
      });
    })(list);
  });

  // ---------------- init ----------------

  loadTeams(sides[0], function () {
    teamsCache[COMPS[sides[1].comp].code] = teamsCache[COMPS[sides[0].comp].code];
    renderAll();
    status("", '<span class="msg"></span>');   // il "Carico le squadre" ha finito il suo lavoro
  });
  renderAll();
})();
</script>
</body>
</html>
