<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa dei tiri · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  /* ── testata: identica a Confronto, perche' e' la stessa famiglia ── */
  #eyebrow{position:absolute;left:128px;top:74px;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:.24em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #title{position:absolute;left:125px;top:96px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:76px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #rule{position:absolute;left:128px;top:204px;width:300px;height:3px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.15) 100%);
    transform:scaleX(0);transform-origin:left center;}

  /* ── il campo: due meta' d'attacco affiancate ──
     Non e' un campo intero: e' la meta' d'attacco della squadra di casa a
     sinistra e quella dell'ospite a destra, appaiate. ESPN da' le coordinate
     gia' girate verso la porta attaccata, quindi la stessa formula serve
     tutte e due — a sinistra specchiata. */
  #campo{position:absolute;opacity:0;}
  #campo .erba{position:absolute;inset:0;border-radius:4px;
    background:rgba(245,241,230,.028);
    box-shadow:inset 0 0 0 2px rgba(245,241,230,.20);}
  #campo .l{position:absolute;background:rgba(245,241,230,.20);}
  #campo .box{position:absolute;box-shadow:inset 0 0 0 2px rgba(245,241,230,.20);}
  #campo .cerchio{position:absolute;border:2px solid rgba(245,241,230,.20);border-radius:50%;}
  /* la porta sporge fuori dalla linea di fondo, come una porta vera */
  #campo .rete{position:absolute;box-shadow:inset 0 0 0 2px rgba(201,162,75,.7);
    background:rgba(201,162,75,.10);}
  /* la riga di mezzo separa due campi diversi, non e' la linea di centrocampo
     di uno solo: si vede che e' d'altra pasta */
  #campo .divisorio{position:absolute;top:-16px;bottom:-16px;width:2px;
    background:linear-gradient(180deg,transparent,rgba(201,162,75,.55) 16%,rgba(201,162,75,.55) 84%,transparent);}

  /* ── i tiri ── */
  .tiro{position:absolute;transform:translate(-50%,-50%);opacity:0;}
  .tiro .segno{display:block;border-radius:50%;box-sizing:border-box;}
  /* gol: pieno oro e piu' grande, e' il punto della grafica */
  .tiro.gol .segno{width:34px;height:34px;background:#C9A24B;
    box-shadow:0 0 0 5px rgba(201,162,75,.22), 0 6px 16px rgba(0,0,0,.45);}
  .tiro.on .segno{width:24px;height:24px;background:#F5F1E6;
    box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .tiro.leg .segno{width:26px;height:26px;background:transparent;border:3px solid #C9A24B;}
  .tiro.off .segno{width:22px;height:22px;background:transparent;
    border:2px solid rgba(245,241,230,.55);}
  /* murato: piccolo e spento, non deve rubare l'occhio ai gol */
  .tiro.blk .segno{width:14px;height:14px;background:rgba(245,241,230,.3);}

  /* L'etichetta del gol non sta dentro il segno ma per conto suo: e' il
     codice che le trova un posto libero, e per farlo deve poterla spostare.
     Niente larghezza: si stringe addosso al nome, ed e' cosi' che si misura. */
  .etigol{position:absolute;height:28px;line-height:28px;opacity:0;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;
    text-transform:uppercase;color:#F5F1E6;white-space:nowrap;
    text-shadow:0 2px 10px rgba(7,11,29,.95), 0 0 22px rgba(7,11,29,.8);}
  .etigol b{color:#C9A24B;font-weight:800;margin-left:9px;}

  /* ── le due colonne di riepilogo, ai lati del campo ── */
  .lato{position:absolute;width:300px;opacity:0;}
  .lato.dx{text-align:right;}
  .lato .capo{display:flex;align-items:center;gap:16px;}
  .lato.dx .capo{flex-direction:row-reverse;}
  .lato .capo img{width:72px;height:72px;object-fit:contain;flex:none;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));}
  .lato .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:34px;
    letter-spacing:.01em;text-transform:uppercase;line-height:1.02;min-width:0;}
  .lato .nome em{font-style:normal;color:#C9A24B;}
  .lato .filo{height:2px;margin:20px 0 4px;
    background:linear-gradient(90deg,rgba(201,162,75,.75),rgba(201,162,75,.06));}
  .lato.dx .filo{background:linear-gradient(270deg,rgba(201,162,75,.75),rgba(201,162,75,.06));}

  /* i numeri: etichetta da una parte, cifra dall'altra */
  .lato .num{display:flex;align-items:baseline;justify-content:space-between;
    gap:14px;padding:7px 0;border-bottom:1px solid rgba(245,241,230,.07);}
  .lato.dx .num{flex-direction:row-reverse;}
  .lato .num .eti{font-family:'DM Sans',sans-serif;font-weight:500;font-size:17px;
    letter-spacing:.16em;color:rgba(245,241,230,.55);text-transform:uppercase;white-space:nowrap;}
  .lato .num .cif{font-family:'Mazzard',sans-serif;font-weight:800;font-size:30px;
    font-variant-numeric:tabular-nums;color:#F5F1E6;line-height:1;}
  .lato .num.forte .cif{color:#C9A24B;font-size:36px;}

  /* i gol, in fondo alla colonna */
  .lato .titgol{font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;
    letter-spacing:.24em;color:#C9A24B;text-transform:uppercase;margin:18px 0 6px;}
  .lato .gol{display:flex;align-items:center;gap:13px;padding:4px 0;}
  .lato.dx .gol{flex-direction:row-reverse;}
  /* La faccia del marcatore: le stesse foto delle formazioni premium, prese
     dal magazzino col cognome, e nella stessa cornice — rettangolo
     arrotondato, non un tondo. Il tondo con l'anello dorato le faceva
     sembrare gettoni, e siccome quelle foto hanno lo SFONDO BIANCO (non
     trasparente) il bianco stacca gia' da solo sul navy: non serve bordo.
     Se la foto manca la cornice sparisce e la riga resta buona: meglio
     senza faccia che con un buco in onda. */
  .lato .gol .faccia{width:44px;height:54px;border-radius:9px;flex:none;overflow:hidden;
    position:relative;background:linear-gradient(180deg,#1a2550 0%,#0c1230 100%);
    box-shadow:0 6px 16px rgba(0,0,0,.45);}
  /* Le foto sono busti quadrati con la testa in alto: la formazione premium
     le ancora "center top", e qui si fa lo stesso con uno zoom, se no in un
     riquadro cosi' piccolo la faccia sarebbe un puntino in mezzo al busto. */
  .lato .gol .faccia img{position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:190%;height:190%;object-fit:cover;object-position:center top;display:block;}
  .lato .gol .m{font-family:'Mazzard',sans-serif;font-weight:800;font-size:20px;
    color:#C9A24B;font-variant-numeric:tabular-nums;flex:none;min-width:52px;}
  .lato.dx .gol .m{text-align:right;}
  /* nome e distanza stanno insieme: separati ai due capi della riga, nella
     colonna specchiata i metri finivano prima del minuto e si leggevano come
     un altro minuto. */
  .lato .gol .chi{font-family:'Mazzard',sans-serif;font-weight:700;font-size:21px;
    letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lato .gol .chi em{font-style:normal;font-family:'DM Sans',sans-serif;font-weight:500;
    font-size:14px;letter-spacing:0;text-transform:none;
    color:rgba(245,241,230,.45);margin-left:10px;}

  /* ── legenda ── */
  #legenda{position:absolute;left:0;right:0;display:flex;justify-content:center;
    gap:40px;opacity:0;}
  #legenda .voce{display:flex;align-items:center;gap:11px;
    font-family:'DM Sans',sans-serif;font-weight:500;font-size:16px;letter-spacing:.16em;
    color:rgba(245,241,230,.5);text-transform:uppercase;white-space:nowrap;}
  #legenda i{display:block;border-radius:50%;box-sizing:border-box;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes tiroIn {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(2.1); }
    60%  { opacity:1; transform:translate(-50%,-50%) scale(.88); }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="eyebrow"></div>
  <div id="title">LA MAPPA DEI TIRI</div>
  <div id="rule"></div>
  <div id="lati"></div>
  <div id="campo"></div>
  <div id="legenda"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url>
  //   { e:"SERIE A · 3ª GIORNATA", t:"LA MAPPA DEI TIRI",
  //     a:{ n:"Genoa", l:"…stemma…", g:1 },     // meta' campo di sinistra
  //     b:{ n:"Como",  l:"…stemma…", g:4 },     // meta' campo di destra
  //     s:[ { q:"a"|"b", x:91.5, y:56.9, e:"gol"|"on"|"off"|"blk"|"leg",
  //           m:"19'", p:"Osmajic", f:"…foto…" }, … ] }
  //   "f" e' la faccia del marcatore, e la mette solo l'editor quando in
  //   magazzino c'e' davvero: cosi' in onda non compare un'immagine rotta.
  //
  //   x,y sono le coordinate ESPN: 0-100, con x=100 sulla linea di porta
  //   ATTACCATA (ESPN le gira gia' lui, per tutte e due le squadre) e y da
  //   una fascia laterale all'altra.
  var DEMO = {
    e: "SERIE A · 3ª GIORNATA", t: "LA MAPPA DEI TIRI",
    a: { n: "Genoa", g: 1, l: "https://a.espncdn.com/i/teamlogos/soccer/500/3263.png" },
    b: { n: "Como",  g: 4, l: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png" },
    s: [
      { q: "a", x: 91.5, y: 56.9, e: "gol", m: "19'", p: "Osmajic", f: "/loghi/foto-premium-osmajic.png" },
      { q: "a", x: 72.0, y: 53.0, e: "off", m: "6'",  p: "Colombo" },
      { q: "a", x: 87.8, y: 55.8, e: "blk", m: "24'", p: "Baldanzi" },
      { q: "a", x: 89.6, y: 73.9, e: "off", m: "50'", p: "Baldanzi" },
      { q: "a", x: 76.7, y: 35.8, e: "on",  m: "84'", p: "Vitinha" },
      { q: "b", x: 76.2, y: 57.7, e: "gol", m: "25'", p: "Baturina", f: "/loghi/foto-premium-baturina.png" },
      { q: "b", x: 91.7, y: 36.4, e: "gol", m: "30'", p: "Diao", f: "/loghi/foto-premium-diao.png" },
      { q: "b", x: 93.3, y: 39.7, e: "gol", m: "40'", p: "Paz", f: "/loghi/foto-premium-paz.png" },
      { q: "b", x: 90.1, y: 37.0, e: "gol", m: "78'", p: "Diao", f: "/loghi/foto-premium-diao.png" },
      { q: "b", x: 80.4, y: 24.8, e: "on",  m: "7'",  p: "Couto" },
      { q: "b", x: 73.5, y: 55.1, e: "on",  m: "17'", p: "Paz" },
      { q: "b", x: 84.7, y: 56.8, e: "leg", m: "67'", p: "Paz" },
      { q: "b", x: 81.3, y: 44.8, e: "off", m: "10'", p: "Perrone" },
      { q: "b", x: 80.6, y: 48.3, e: "blk", m: "43'", p: "Perrone" }
    ]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.a && d.b && d.s) ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "TIRI — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "TIRI " + ((D.a.n || "") + " " + (D.b.n || "")).trim();

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    el("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  // ── testata ─────────────────────────────────────────────────────────
  var eb = el("eyebrow"); eb.textContent = D.e || "";
  var tt = el("title"); tt.textContent = D.t || "LA MAPPA DEI TIRI";
  var rl = el("rule");
  if (STILL) { eb.style.opacity = 1; tt.style.clipPath = "inset(0 0 0 0)"; rl.style.transform = "scaleX(1)"; }
  else {
    eb.style.animation = "fadeIn .5s ease .15s forwards";
    tt.style.animation = "wipeIn .7s cubic-bezier(.2,.7,.3,1) .3s forwards";
    rl.style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) .85s forwards";
  }

  // ── la geometria del campo ──────────────────────────────────────────
  // Mezzo campo vero: 52,5 m per 68 m. Le due meta' si toccano al centro e le
  // porte finiscono sui bordi esterni. Le misure sono quelle regolamentari,
  // convertite in pixel dalla stessa scala: cosi' l'area e' grande davvero
  // quanto deve, e un tiro dal limite cade sul limite.
  var PH = 600, PY = 286;
  var MPX = PH / 68;                            // pixel per metro
  var HW = Math.round(52.5 * MPX);              // larghezza di mezza meta'
  var PW = HW * 2, PX = Math.round((1920 - PW) / 2);
  var CX = PX + HW;                             // dove le due meta' si toccano
  function m(v) { return Math.round(v * MPX); }

  var campo = el("campo");
  campo.style.cssText = "left:" + PX + "px;top:" + PY + "px;width:" + PW + "px;height:" + PH + "px;" +
    (STILL ? "opacity:1" : "animation:fadeIn .6s ease 1.0s forwards");

  // Una meta' campo, disegnata per intero. "verso" dice da che parte guarda
  // la porta: -1 la meta' di sinistra, +1 quella di destra.
  function metaCampo(x0, verso) {
    var h = "";
    var fondo = verso < 0 ? x0 : x0 + HW;         // la linea di porta
    var mezzo = verso < 0 ? x0 + HW : x0;         // la linea di meta' campo
    var dentro = function (met) { return verso < 0 ? fondo + m(met) : fondo - m(met); };

    // area di rigore (16,5 x 40,32) e area piccola (5,5 x 18,32)
    [[16.5, 40.32], [5.5, 18.32]].forEach(function (a) {
      var w = m(a[0]), hh = m(a[1]);
      h += '<i class="box" style="left:' + (verso < 0 ? fondo : fondo - w) + 'px;top:' +
           Math.round((PH - hh) / 2) + 'px;width:' + w + 'px;height:' + hh + 'px"></i>';
    });

    // dischetto a 11 m e arco da 9,15 m. Dell'arco si vede solo la parte FUORI
    // dall'area, e il taglio si misura dal bordo dell'elemento, che sta un
    // raggio prima del dischetto.
    var dx = dentro(11), r = m(9.15), taglio = m(16.5 - 11) + r;
    h += '<i class="l" style="left:' + (dx - 3) + 'px;top:' + (PH / 2 - 3) +
         'px;width:6px;height:6px;border-radius:50%"></i>';
    h += '<i class="cerchio" style="left:' + (dx - r) + 'px;top:' + (PH / 2 - r) + 'px;' +
         'width:' + (2 * r) + 'px;height:' + (2 * r) + 'px;' +
         'clip-path:inset(0 ' + (verso < 0 ? "0 0 " + taglio + "px" : taglio + "px 0 0") + ')"></i>';

    // la porta, che sporge fuori dalla linea di fondo (7,32 m di luce)
    var gh = m(7.32), gd = m(2);
    h += '<i class="rete" style="left:' + (verso < 0 ? fondo - gd : fondo) + 'px;top:' +
         Math.round((PH - gh) / 2) + 'px;width:' + gd + 'px;height:' + gh + 'px"></i>';

    // gli angoli: un quarto di cerchio da 1 m per ogni spigolo del fondo. Si
    // disegna il cerchio intero e lo taglia il bordo del campo.
    var cr = m(1) + 5;
    [0, PH].forEach(function (yy) {
      h += '<i class="cerchio" style="left:' + (fondo - cr) + 'px;top:' + (yy - cr) + 'px;' +
           'width:' + (2 * cr) + 'px;height:' + (2 * cr) + 'px"></i>';
    });

    // meta' del cerchio di centrocampo: le due, ai lati del divisorio,
    // ricompongono il cerchio intero
    h += '<i class="cerchio" style="left:' + (mezzo - r) + 'px;top:' + (PH / 2 - r) + 'px;' +
         'width:' + (2 * r) + 'px;height:' + (2 * r) + 'px;' +
         'clip-path:inset(0 ' + (verso < 0 ? "0 0 " + r + "px" : r + "px 0 0") + ')"></i>';
    return h;
  }
  campo.innerHTML = '<i class="erba" style="overflow:hidden"></i>' +
    '<i style="position:absolute;inset:0;overflow:hidden;border-radius:4px">' +
    metaCampo(0, -1) + metaCampo(HW, +1) + '</i>' +
    '<i class="divisorio" style="left:' + (HW - 1) + 'px"></i>';

  // ── dove finisce un tiro sullo schermo ──────────────────────────────
  // La meta' di sinistra e' la stessa cosa girata di mezzo giro: si specchia
  // la x (la porta e' a sinistra) e con lei anche la y, se no la destra e la
  // sinistra del campo si scambiano e i tiri finiscono dalla parte sbagliata.
  //
  // Da che parte sta la y l'ho misurato, non dedotto: sui terzini di tutte e
  // due le squadre. Couto (destro) gioca a y 13,7 e Valle (sinistro) a 82,7;
  // nel Genoa Vasquez e Ellertsson, entrambi a sinistra, stanno a 77,6 e 85,5.
  // Quindi y bassa e' la DESTRA di chi attacca — e chi attacca verso destra
  // dello schermo ha la propria destra in BASSO, come si vede dall'alto.
  // Prima era rovesciato: un tiro dalla fascia destra compariva a sinistra.
  function punto(t) {
    var x = Math.max(50, Math.min(100, +t.x || 0));
    var y = Math.max(0, Math.min(100, +t.y || 50));
    var d = (x - 50) / 50;                       // 0 meta' campo, 1 linea di porta
    if (t.q === "a") return { px: PX + HW * (1 - d), py: PY + PH * (y / 100) };
    return { px: CX + HW * d, py: PY + PH * (1 - y / 100) };
  }

  // Da che distanza e' partito il tiro. Le coordinate sono metri veri su un
  // campo normalizzato — misurato: i rinvii dal fondo si fermano a x=5,5, che
  // e' l'area piccola, e le rimesse laterali stanno esatte a y=0 e y=100. Si
  // riportano quindi alle misure regolamentari, 105 per 68.
  function metri(t) {
    var dx = (100 - (+t.x || 0)) / 100 * 105;
    var dy = ((+t.y || 50) - 50) / 100 * 68;
    return Math.round(Math.sqrt(dx * dx + dy * dy));
  }

  // ── le due colonne di riepilogo ─────────────────────────────────────
  // Raccontano quello che c'e' sulla mappa, non la partita: se in grafica si
  // e' scelto di mettere solo il primo tempo, anche i numeri sono del primo
  // tempo. Un riepilogo che non torna coi pallini disegnati sarebbe peggio.
  function suoi(lettera) { return D.s.filter(function (t) { return t.q === lettera; }); }
  function conta(lista, esiti) {
    return lista.filter(function (t) { return esiti.indexOf(t.e) >= 0; }).length;
  }
  function colonna(q, lato, lettera) {
    var mie = suoi(lettera);
    var legni = conta(mie, ["leg"]);
    var righe = [
      ["Tiri", mie.length, true],
      ["Nello specchio", conta(mie, ["gol", "on"]), false],
      ["Fuori", conta(mie, ["off"]), false],
      ["Murati", conta(mie, ["blk"]), false]
    ];
    if (legni) righe.push(["Legni", legni, false]);

    var h = '<div class="capo">' +
      (q.l ? '<img src="' + esc(q.l) + '" onerror="this.style.display=\'none\'">' : "") +
      '<div class="nome">' + esc(q.n || "") +
        (q.g != null && String(q.g) !== "" ? " <em>" + esc(q.g) + "</em>" : "") +
      '</div></div><div class="filo"></div>';

    righe.forEach(function (r) {
      h += '<div class="num' + (r[2] ? " forte" : "") + '">' +
           '<span class="eti">' + esc(r[0]) + '</span>' +
           '<span class="cif">' + r[1] + '</span></div>';
    });

    // i gol, col minuto e da che distanza
    var gol = mie.filter(function (t) { return t.e === "gol"; });
    if (gol.length) {
      h += '<div class="titgol">' + (gol.length === 1 ? "Il gol" : "I gol") + '</div>';
      // Cinque e non di piu': con la faccia ogni riga e' alta 54 px, e la
      // colonna finirebbe sotto la legenda.
      gol.slice(0, 5).forEach(function (t) {
        h += '<div class="gol">' +
             (t.f ? '<span class="faccia"><img src="' + esc(t.f) +
                    '" onerror="this.parentNode.style.display=\'none\'"></span>' : "") +
             '<span class="m">' + esc(t.m || "") + '</span>' +
             '<span class="chi">' + esc(String(t.p || "").toUpperCase()) +
             '<em>' + metri(t) + ' m</em></span></div>';
      });
      if (gol.length > 5) {
        h += '<div class="gol"><span class="m"></span>' +
             '<span class="chi" style="color:rgba(245,241,230,.5)">e altri ' + (gol.length - 5) + '</span></div>';
      }
    }

    var anim = STILL ? "opacity:1"
      : "animation:fadeIn .55s ease " + (lato === "dx" ? "1.15s" : "1.0s") + " forwards";
    var pos = lato === "sx" ? "left:128px" : "right:128px";
    return '<div class="lato ' + lato + '" style="' + pos + ';top:' + PY + 'px;' + anim + '">' + h + '</div>';
  }
  el("lati").innerHTML = colonna(D.a, "sx", "a") + colonna(D.b, "dx", "b");

  // ── i tiri, in ordine di minuto ─────────────────────────────────────
  var CLASSI = { gol: "gol", on: "on", off: "off", blk: "blk", leg: "leg" };
  var h = "", daEtichettare = [];
  D.s.forEach(function (t, i) {
    var p = punto(t);
    var cls = CLASSI[t.e] || "off";
    var anim = STILL ? "opacity:1"
      : "animation:tiroIn .42s cubic-bezier(.2,.7,.3,1) " + (1.35 + i * 0.07).toFixed(2) + "s forwards";
    h += '<div class="tiro ' + cls + '" style="left:' + Math.round(p.px) + 'px;top:' + Math.round(p.py) + 'px;' + anim + '">' +
         '<i class="segno"></i></div>';
    // Il nome sulla mappa solo ai gol e ai legni: sono quelli che si
    // raccontano. Gli altri hanno gia' il loro posto nella colonna.
    if ((t.e === "gol" || t.e === "leg") && String(t.p || "").trim()) {
      daEtichettare.push({ t: t, p: p, i: i });
    }
  });
  el("stage").insertAdjacentHTML("beforeend", h);

  // ── le etichette dei gol ────────────────────────────────────────────
  // Quattro gol nella stessa mezza area e i nomi si accavallano: succede
  // sempre, non e' il caso raro. Quindi prima si disegnano per misurarle —
  // un elemento assoluto senza larghezza si stringe addosso al testo — e poi
  // si cerca a ciascuna un posto libero, sopra il segno o sotto.
  var POSATE = [];
  var AH = 28, ARIA = 8, STACCO = 16;

  // I segni dei tiri sono ostacoli quanto le altre etichette: la prima
  // versione guardava solo le etichette, e i nomi finivano seduti sopra i
  // pallini. Un tiro largo 34px si tiene un rettangolo di quella misura.
  var SEGNI = D.s.map(function (t) {
    var p = punto(t);
    var d = t.e === "gol" ? 44 : (t.e === "blk" ? 18 : 28);
    return { x: p.px - d / 2, y: p.py - d / 2, w: d, h: d };
  });
  function pesta(r, lista, aria) {
    for (var k = 0; k < lista.length; k++) {
      var o = lista[k];
      if (r.x < o.x + o.w + aria && o.x < r.x + r.w + aria &&
          r.y < o.y + o.h + aria && o.y < r.y + r.h + aria) return true;
    }
    return false;
  }
  // Le etichette restano dentro il campo: fuori finirebbero addosso alle
  // colonne del riepilogo, che stanno proprio li' di fianco.
  function nelCampo(r) {
    return r.x >= PX + 6 && r.x + r.w <= PX + PW - 6 &&
           r.y >= PY - 34 && r.y + r.h <= PY + PH + 30;
  }
  function libero(r, ancheSegni) {
    if (!nelCampo(r)) return false;
    if (pesta(r, POSATE, ARIA)) return false;
    return !(ancheSegni && pesta(r, SEGNI, 4));
  }

  daEtichettare.sort(function (u, v) { return u.p.py - v.p.py; });
  daEtichettare.forEach(function (g) {
    var d = document.createElement("div");
    d.className = "etigol";
    d.innerHTML = esc(String(g.t.p).trim().toUpperCase()) +
                  (g.t.m ? "<b>" + esc(g.t.m) + "</b>" : "");
    el("stage").appendChild(d);
    g.el = d;
  });

  // Tutto il conto sta in piedi sulla larghezza dei nomi, e la larghezza
  // cambia col carattere: al primo giro il Mazzard non e' ancora arrivato e
  // si misura quello di ripiego, che e' piu' largo. Quindi si posa una volta
  // subito — se il font tardasse, meglio qualcosa che niente — e si riposa da
  // capo quando il carattere vero e' pronto.
  function posa() {
    POSATE = [];
    daEtichettare.forEach(function (g) {
      var d = g.el;
      var w = d.offsetWidth || d.clientWidth || 160;

      // Si cerca un posto: sopra o sotto, allontanandosi a scatti, e se serve
      // spostandosi di lato. Vince il primo libero. Al primo giro contano
      // anche i segni dei tiri; se in mezzo a quella selva non c'e' proprio
      // posto, al secondo giro si accetta di stare sopra un pallino ma mai
      // sopra un altro nome — un nome coperto da un nome non si legge.
      function cerca(ancheSegni) {
        for (var passo = 0; passo < 6; passo++) {
          for (var v = 0; v < 2; v++) {
            var cy = (v === 0) ? g.p.py - STACCO - passo * (AH + ARIA) - AH
                               : g.p.py + STACCO + passo * (AH + ARIA);
            for (var o = 0; o < 3; o++) {
              var dx = o === 0 ? 0 : (o === 1 ? w / 2 + 26 : -(w / 2 + 26));
              var r = { x: Math.round(g.p.px - w / 2 + dx), y: Math.round(cy), w: w, h: AH };
              if (libero(r, ancheSegni)) return r;
            }
          }
        }
        return null;
      }
      var scelto = cerca(true) || cerca(false) ||
        { x: Math.round(g.p.px - w / 2), y: Math.round(g.p.py - STACCO - AH), w: w, h: AH };
      POSATE.push(scelto);
      d.style.left = scelto.x + "px";
      d.style.top = scelto.y + "px";
      d.style.animation = STILL ? "" : "fadeIn .4s ease " + (1.35 + g.i * 0.07 + 0.25).toFixed(2) + "s forwards";
      if (STILL) d.style.opacity = 1;
    });
  }
  posa();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(posa);

  // ── legenda ─────────────────────────────────────────────────────────
  var VOCI = [
    ["Gol",      "width:20px;height:20px;background:#C9A24B"],
    ["In porta", "width:16px;height:16px;background:#F5F1E6"],
    ["Legno",    "width:16px;height:16px;border:3px solid #C9A24B"],
    ["Fuori",    "width:15px;height:15px;border:2px solid rgba(245,241,230,.55)"],
    ["Murato",   "width:11px;height:11px;background:rgba(245,241,230,.3)"]
  ];
  var lg = el("legenda");
  lg.style.cssText = "top:" + (PY + PH + 52) + "px;" +
    (STILL ? "opacity:1" : "animation:fadeIn .5s ease " + (1.35 + D.s.length * 0.07 + 0.2).toFixed(2) + "s forwards");
  lg.innerHTML = VOCI.map(function (v) {
    return '<span class="voce"><i style="' + v[1] + '"></i>' + esc(v[0]) + '</span>';
  }).join("");

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
