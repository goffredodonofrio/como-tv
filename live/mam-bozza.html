<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como TV</title>
<meta name="theme-color" content="#0A0F24">
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}

  /* ══════════════════════════════════════════════════════════════
     UNA PAGINA SOLA.
     Le tre colonne non si muovono mai: a sinistra le partite, al centro
     quello che si guarda, a destra quello che si fa. A cambiare e' solo
     il contenuto, scelto dalla riga di linguette — LIVE compreso.
     Prima erano due pagine e un interruttore in alto a destra: due posti
     dove cercare la stessa cosa, e infatti non si trovava.
     Colori: la variante "carta" del design system — avorio come fondo,
     navy come inchiostro, oro profondo per il testo in oro. Restano scure
     la riga di stato e i riquadri del video: strumentazione e immagine.
     ══════════════════════════════════════════════════════════════ */
  :root{
    color-scheme:light;
    --carta:#F5F1E6;--carta-2:#FFFDF7;--bianco:#FFFFFF;
    --inchiostro:#0A0F24;--inchiostro-2:#464E6E;--inchiostro-3:#6B7290;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;--ok:#2E9E68;
    --linea:rgba(10,15,36,.10);--linea-oro:rgba(166,124,46,.35);
    --scuro:#0A0F24;
    --ombra:0 1px 2px rgba(10,15,36,.06), 0 6px 18px rgba(10,15,36,.05);
    --barra:52px;
  }
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.45;
    color:var(--inchiostro);min-height:100vh;background-color:var(--carta);
    background-image:
      radial-gradient(90% 70% at 18% 4%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(70% 70% at 95% 100%, rgba(201,162,75,.13), transparent 60%);
    background-attachment:fixed;padding-bottom:var(--barra);}

  .testata{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:13px clamp(14px,3vw,26px);position:sticky;top:0;z-index:50;
    background:var(--scuro);color:var(--carta);border-bottom:2px solid var(--gold);}
  .marchio{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;white-space:nowrap;}
  .marchio small{display:block;font-size:9px;letter-spacing:.26em;color:var(--gold-bright);font-weight:700;}
  .cerca{flex:1 1 320px;display:flex;gap:8px;align-items:center;
    background:rgba(245,241,230,.10);border:1px solid rgba(245,241,230,.16);border-radius:10px;padding:9px 13px;}
  .cerca input{flex:1;background:none;border:none;color:var(--carta);font-family:inherit;font-size:14px;}
  .cerca input:focus{outline:none;}
  .cerca input::placeholder{color:rgba(245,241,230,.45);}
  .cerca .lente{color:rgba(245,241,230,.55);}
  .torna{color:rgba(245,241,230,.6);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
  .torna:hover{color:var(--gold-bright);}

  .tre{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;min-height:calc(100vh - 118px);}
  @media (max-width:1240px){.tre{grid-template-columns:1fr;}}
  .col{padding:16px clamp(12px,1.4vw,20px);overflow:auto;}
  .col + .col{border-left:1px solid var(--linea);}
  .col h2{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.26em;
    text-transform:uppercase;color:var(--inchiostro-3);margin-bottom:14px;
    display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--linea);}
  .col h2 span{color:var(--gold-deep);}

  .ramo>.testa{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
    font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--inchiostro-2);}
  .ramo .conta{margin-left:auto;color:var(--inchiostro-3);font-family:'DM Sans';font-size:11px;letter-spacing:0;text-transform:none;}
  .foglia{display:flex;gap:8px;align-items:baseline;padding:8px 10px 8px 22px;border-radius:7px;
    cursor:pointer;font-size:13px;}
  .foglia:hover{background:rgba(10,15,36,.045);}
  .foglia.scelta{background:rgba(201,162,75,.16);box-shadow:inset 2px 0 0 var(--gold-deep);font-weight:700;}
  .foglia .quando{margin-left:auto;color:var(--inchiostro-3);font-size:11px;}
  .foglia .rec{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
    box-shadow:0 0 8px rgba(229,27,32,.8);animation:batte 1.4s ease-in-out infinite;}

  /* ── le linguette: sono la navigazione, non un filtro ───────────── */
  .linguette{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .linguette button{background:var(--carta-2);border:1px solid var(--linea);border-radius:20px;
    color:var(--inchiostro-2);cursor:pointer;padding:7px 15px;
    font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .linguette button:hover{border-color:var(--linea-oro);}
  .linguette button.acceso{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .linguette button.live{border-color:rgba(229,27,32,.45);color:#9E1418;}
  .linguette button.live.acceso{background:var(--red);border-color:var(--red);color:#fff;}
  .linguette .pallino{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);
    margin-right:7px;vertical-align:1px;animation:batte 1.4s ease-in-out infinite;}
  @keyframes batte{0%,100%{opacity:1}50%{opacity:.3}}

  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .scheda{background:var(--carta-2);border:1px solid var(--linea);border-radius:10px;overflow:hidden;
    cursor:pointer;box-shadow:var(--ombra);transition:border-color .12s, transform .12s;}
  .scheda:hover{border-color:var(--linea-oro);transform:translateY(-1px);}
  .scheda.scelta{border-color:var(--gold-deep);box-shadow:0 0 0 2px rgba(166,124,46,.28), var(--ombra);}
  .mini{position:relative;aspect-ratio:16/9;background:var(--scuro);overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .mini .telo{background:linear-gradient(135deg,#1b2a5e,#0d1430);height:100%;aspect-ratio:16/9;}
  .mini.v .telo{aspect-ratio:9/16;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini.q .telo{aspect-ratio:4/3;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini .durata{position:absolute;right:6px;bottom:6px;background:rgba(10,15,36,.85);border-radius:4px;
    color:var(--carta);padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;}
  .mini .formato{position:absolute;left:6px;top:6px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;letter-spacing:.1em;}
  .mini .fonte{position:absolute;left:6px;bottom:6px;font-size:10px;color:rgba(245,241,230,.9);
    background:rgba(10,15,36,.8);border-radius:4px;padding:2px 6px;}
  .scheda .testo{padding:9px 10px 11px;}
  .scheda .nome{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scheda .sotto{font-size:11px;color:var(--inchiostro-3);margin-top:3px;}

  /* ── il visore ─────────────────────────────────────────────────── */
  video{width:100%;aspect-ratio:16/9;background:var(--scuro);border-radius:9px;display:block;
    border:1px solid var(--linea);}
  video.v{aspect-ratio:9/16;max-height:60vh;margin:0 auto;}
  video.q{aspect-ratio:4/3;}
  .barra{margin-top:10px;}
  input[type=range]{width:100%;accent-color:var(--gold-deep);}
  .tempi{display:flex;justify-content:space-between;font-family:'Mazzard',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--inchiostro-3);margin-top:4px;}
  .trasporto{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
  .trasporto button{flex:1 1 auto;}

  button.b{font-family:'Mazzard',sans-serif;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;color:var(--inchiostro);background:var(--bianco);border:1px solid var(--linea);
    border-radius:8px;padding:10px 13px;cursor:pointer;box-shadow:var(--ombra);}
  button.b:hover:not(:disabled){border-color:var(--gold-deep);}
  button.b:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  button.b.oro{background:var(--gold);border-color:var(--gold-deep);color:var(--scuro);}
  button.b.rosso{background:var(--red);border-color:#B3151A;color:#fff;}
  button.b.scuro{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .fila{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;}
  .gruppo{display:flex;gap:7px;}
  .gruppo.pari button{flex:1 1 0;}
  .et{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--inchiostro-3);display:block;margin-bottom:6px;}
  .colonnina{display:flex;flex-direction:column;}
  .colonnina.cresce{flex:1 1 160px;}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:14px;color:var(--inchiostro);
    background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;width:100%;}
  select:focus,input:focus{outline:none;border-color:var(--gold-deep);}

  .inout{display:flex;gap:9px;}
  .inout .box{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;
    padding:9px 13px;min-width:96px;text-align:center;}
  .inout .box.messo{border-color:var(--gold-deep);background:rgba(201,162,75,.10);}
  .numeroni{font-family:'Mazzard',sans-serif;font-weight:800;font-size:24px;line-height:1.1;}
  .numeroni small{display:block;font-size:9px;letter-spacing:.24em;color:var(--inchiostro-3);margin-bottom:3px;}

  /* ── la console: qui si opera, ed e' scura apposta ──────────────── */
  .console{background:var(--scuro);color:var(--carta);border-radius:10px;padding:15px;margin-bottom:14px;
    border-top:2px solid var(--gold);}
  .console .et{color:rgba(245,241,230,.5);}
  .console select,.console input[type=text]{background:rgba(245,241,230,.08);border-color:rgba(245,241,230,.18);
    color:var(--carta);}
  .console button.b{background:rgba(245,241,230,.10);border-color:rgba(245,241,230,.2);color:var(--carta);box-shadow:none;}
  .console button.b.oro{background:var(--gold);border-color:var(--gold);color:var(--scuro);}
  .console button.b.rosso{background:var(--red);border-color:var(--red);color:#fff;}
  .console button.b.acceso{background:var(--carta);color:var(--scuro);border-color:var(--carta);}
  .console .riga-stato{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:12px;
    border-top:1px solid rgba(245,241,230,.14);font-family:'Mazzard',sans-serif;font-size:13px;
    font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
  .console .dot{width:11px;height:11px;border-radius:50%;background:rgba(245,241,230,.35);flex:none;}
  .console .dot.rec{background:var(--red);box-shadow:0 0 10px rgba(229,27,32,.9);animation:batte 1.4s ease-in-out infinite;}
  .console .dot.ok{background:#4FCB8B;}
  .console .coda{margin-left:auto;font-size:11px;letter-spacing:.14em;color:rgba(245,241,230,.6);}
  .indirizzo{margin-top:11px;background:rgba(201,162,75,.16);border:1px solid rgba(201,162,75,.4);
    border-radius:8px;padding:10px 12px;font-size:12px;word-break:break-all;}
  .indirizzo code{color:var(--gold-bright);}

  .voce{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;
    display:flex;gap:9px;align-items:center;margin-bottom:7px;box-shadow:var(--ombra);}
  .voce .testo{flex:1;min-width:0;}
  .voce .nome{font-family:'Mazzard',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce .dett{font-size:11px;color:var(--inchiostro-3);}
  .voce a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
  .voce a:hover{color:var(--inchiostro);}
  .voce .azioni{display:flex;gap:9px;}

  .dati{width:100%;font-size:13px;}
  .dati tr{border-bottom:1px solid var(--linea);}
  .dati td{padding:7px 0;vertical-align:top;}
  .dati td:first-child{color:var(--inchiostro-3);width:44%;font-size:12px;}
  .schede{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:14px 0;}
  .schede button{background:none;border:none;border-bottom:2px solid transparent;color:var(--inchiostro-3);
    cursor:pointer;padding:8px 11px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;}
  .schede button.acceso{color:var(--inchiostro);border-bottom-color:var(--gold-deep);}

  .avviso{margin:0 0 12px;padding:11px 14px;border-radius:8px;font-size:13px;display:none;
    background:#FDECEC;border:1px solid rgba(229,27,32,.35);color:#8E1216;}
  .avviso.ok{background:#E9F6EF;border-color:rgba(46,158,104,.4);color:#1D6B45;}
  .avviso.vedi{display:block;}
  .vuoto{color:var(--inchiostro-3);font-size:13px;padding:10px 2px;}
  kbd{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;
    border:1px solid var(--linea);background:var(--bianco);border-radius:4px;padding:1px 6px;}
  .aiuto{color:var(--inchiostro-3);font-size:12px;margin-top:10px;}

  .stato{position:fixed;left:0;right:0;bottom:0;height:var(--barra);z-index:60;
    display:flex;align-items:center;gap:22px;padding:0 clamp(14px,3vw,26px);
    background:var(--scuro);color:var(--carta);border-top:2px solid var(--gold);font-size:12px;overflow-x:auto;}
  .stato .voce2{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .stato .pallino{width:9px;height:9px;border-radius:50%;background:rgba(245,241,230,.35);flex:none;}
  .stato .pallino.rec{background:var(--red);box-shadow:0 0 9px rgba(229,27,32,.9);animation:batte 1.4s ease-in-out infinite;}
  .stato .pallino.ok{background:#4FCB8B;}
  .stato .e{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(245,241,230,.5);}
  .stato .val{font-family:'Mazzard',sans-serif;font-size:13px;font-weight:800;letter-spacing:.04em;}
  .stato .barretta{width:90px;height:5px;border-radius:3px;background:rgba(245,241,230,.16);overflow:hidden;}
  .stato .barretta i{display:block;height:100%;background:var(--gold);}
</style>
</head>
<body>

<div class="testata">
  <div class="marchio">MAM<small>Como TV</small></div>
  <div class="cerca">
    <span class="lente">⌕</span>
    <input type="text" id="q" placeholder="Genoa-Como del 4 settembre · gol di Diao · le clip 9:16 di settembre">
  </div>
  <a class="torna" href="../index.html">Como TV</a>
</div>

<div class="tre">
  <div class="col">
    <h2>Partite <span id="nPartite">—</span></h2>
    <div id="albero"></div>
  </div>

  <div class="col">
    <div class="linguette" id="linguette">
      <button class="live acceso" data-v="live">Live</button>
      <button data-v="tutto">Tutto</button>
      <button data-v="clip">Clip</button>
      <button data-v="hl">Highlights</button>
      <button data-v="integrale">Integrali</button>
      <button data-v="9:16">9:16</button>
      <button data-v="4:3">4:3</button>
    </div>
    <div class="avviso" id="avviso"></div>
    <div id="centro"></div>
  </div>

  <div class="col" id="destra"></div>
</div>

<div class="stato">
  <div class="voce2"><span class="pallino" id="sPall"></span><span class="e">In registrazione</span>
    <span class="val" id="sRec">—</span></div>
  <div class="voce2"><span class="e">Disco</span><span class="val" id="sDisco">—</span>
    <span class="barretta"><i id="sBarra" style="width:10%"></i></span></div>
  <div class="voce2"><span class="e">In lavorazione</span><span class="val" id="sLav">—</span></div>
  <div class="voce2"><span class="pallino ok" id="sPonteP"></span><span class="e">Ponte</span>
    <span class="val" id="sPonte">—</span></div>
</div>

<script src="chiave.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
  "use strict";
  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var BASE = PONTE.replace(/\/(api|exec)$/, "");
  var GEN = "../10_Look%26Feel/Como%20TV%20OTT%20Design/generatore.html?solo=social";
  var TOKEN = (window.ChiaveComoTV ? ChiaveComoTV.valore() : "");
  var el = function (id) { return document.getElementById(id); };

  var VISTA = "live";          // quale linguetta
  var REG = null;              // la registrazione scelta
  var REGISTRAZIONI = [], CLIP = [], SEQ = null, DISCO = null, ASSET = 0;
  var hls = null, apertaId = "", seguiLive = true;
  var dentro = null, fuori = null, formato = "16:9", preciso = false;

  function orologio(s) {
    if (s === null || s === undefined || !isFinite(s)) return "—";
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), q = s%60;
    return (h ? h + ":" + ("0"+m).slice(-2) : m) + ":" + ("0"+q).slice(-2);
  }
  function peso(b) { return !b ? "" : (b > 1e9 ? (b/1e9).toFixed(1) + " GB" : Math.round(b/1e6) + " MB"); }
  function dice(t, buona) {
    var a = el("avviso"); a.textContent = t; a.className = "avviso vedi" + (buona ? " ok" : "");
    if (buona) setTimeout(function () { a.className = "avviso"; }, 4000);
  }
  function manda(c) {
    c.token = TOKEN;
    return fetch(PONTE, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(c) }).then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) throw new Error(d.errore || "il ponte ha detto no"); return d; });
  }

  // ── colonna 1: le partite ───────────────────────────────────────
  function albero() {
    var c = el("albero"); c.innerHTML = "";
    if (!REGISTRAZIONI.length) {
      c.innerHTML = '<div class="vuoto">Nessuna partita registrata.<br>Con <b>Live</b> se ne comincia una.</div>';
      el("nPartite").textContent = "0"; return;
    }
    var gruppi = {};
    REGISTRAZIONI.forEach(function (r) {
      var g = r.competizione || "Senza competizione";
      (gruppi[g] = gruppi[g] || []).push(r);
    });
    el("nPartite").textContent = REGISTRAZIONI.length;
    Object.keys(gruppi).forEach(function (g) {
      var ramo = document.createElement("div"); ramo.className = "ramo";
      var t = document.createElement("div"); t.className = "testa";
      t.innerHTML = "<span>" + g + "</span><span class='conta'>" + gruppi[g].length + "</span>";
      ramo.appendChild(t);
      gruppi[g].forEach(function (r) {
        var f = document.createElement("div");
        f.className = "foglia" + (REG && r.id === REG.id ? " scelta" : "");
        var quando = new Date(r.avviata);
        f.innerHTML = (r.stato === "registra" && !r.attesa ? "<span class='rec'></span>" : "") +
          "<span>" + r.titolo + "</span><span class='quando'>" +
          ("0"+quando.getDate()).slice(-2) + "/" + ("0"+(quando.getMonth()+1)).slice(-2) + "</span>";
        f.addEventListener("click", function () { REG = r; ASSET = 0; disegna(); });
        ramo.appendChild(f);
      });
      c.appendChild(ramo);
    });
  }

  // ── colonna 2, vista LIVE: il visore e il taglio ────────────────
  function centroLive() {
    var c = el("centro");
    c.innerHTML =
      '<video id="player" controls playsinline></video>' +

  function segnaIn() { if (!el("player")) return; dentro = el("player").currentTime; if (fuori !== null && fuori <= dentro) fuori = null; mostraInOut(); }

  function taglia() {

      .catch(function (e) { dice(e.message); mostraInOut(); });

  function apri(r) {
    var v = el("player"); if (!v) return;
    if (apertaId === r.id && hls) return;          // gia' aperta: non ricominciare

    if (r.materiale === "integrale") { v.src = BASE + "/clip/" + r.id + "/integrale.mp4"; v.play().catch(function(){}); return; }
    if (r.materiale === "scaduto") { v.removeAttribute("src"); v.load(); return; }
    var indirizzo = BASE + "/clip/" + r.id + "/live.m3u8";
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDuration: 8, backBufferLength: 3600 });
      hls.on(Hls.Events.ERROR, function (ev, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(function () { try { hls.startLoad(); } catch (e) {} }, 2000);
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(indirizzo); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = indirizzo; }
    v.play().catch(function () {});

  function aggiorna() {
    return manda({ tipo:"clip-stato" }).then(function (d) {
      REGISTRAZIONI = d.reg || [];
      DISCO = d.disco || null;
      if (REG) { var mio = REGISTRAZIONI.filter(function (r) { return r.id === REG.id; })[0]; if (mio) REG = mio; else REG = null; }
      if (!REG && REGISTRAZIONI.length) REG = REGISTRAZIONI[0];
      CLIP = (d.clip || []).filter(function (c) { return !REG || c.reg === REG.id; });
      barra();
      if (VISTA === "live") { if (REG && el("player")) apri(REG); disegnaConsole(); }
      else centroArchivio();
      albero();
      if (REG) {
        manda({ tipo:"clip-hl-elenco", reg:REG.id }).then(function (h) {
          SEQ = (h.seq || [])[0] || null;
          if (VISTA === "hl") centroArchivio();
        }).catch(function () {});
      }
    }).catch(function (e) { el("sPonte").textContent = "non risponde"; el("sPonteP").className = "pallino"; });
  }

  function barra() {
    var aperte = REGISTRAZIONI.filter(function (r) { return r.stato === "registra"; });
    var lav = CLIP.filter(function (c) { return c.stato === "lavora"; }).length;
    el("sRec").textContent = aperte.length ? aperte.length + " · " + orologio(aperte[0].durata || 0) : "nessuna";
    el("sPall").className = "pallino" + (aperte.some(function (r) { return !r.attesa && !r.guarda; }) ? " rec" : "");
    if (DISCO) {
      el("sDisco").textContent = DISCO.liberi + " GB · ~" + DISCO.partite + " partite";
      el("sBarra").style.width = Math.max(4, Math.min(100, 100 - DISCO.liberi / 79 * 100)) + "%";
    }
    el("sLav").textContent = lav ? lav + " in lavorazione" : "niente in coda";
    el("sPonte").textContent = "risponde"; el("sPonteP").className = "pallino ok";
    // la linguetta LIVE si accende da sola quando qualcosa sta girando
    var b = document.querySelector('#linguette [data-v="live"]');
    if (b) b.innerHTML = (aperte.length ? "<span class='pallino'></span>" : "") + "Live";
  }

  document.querySelectorAll("#linguette button").forEach(function (b) {
    b.addEventListener("click", function () {
      VISTA = b.dataset.v; ASSET = 0;
      document.querySelectorAll("#linguette button").forEach(function (x) {
        x.className = (x.dataset.v === "live" ? "live" : "");
      });
      b.className = (VISTA === "live" ? "live acceso" : "acceso");
      if (VISTA !== "live" && hls) { hls.destroy(); hls = null; apertaId = ""; }
      disegna();
    });
  });

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (VISTA !== "live") return;
    var k = e.key.toLowerCase();
    if (k === "i") { segnaIn(); e.preventDefault(); }
    else if (k === "o") { segnaOut(); e.preventDefault(); }
    else if (k === "t") { if (el("btnTaglia") && !el("btnTaglia").disabled) taglia(); e.preventDefault(); }
    else if (k === " ") { var v = el("player"); if (v) { v.paused ? v.play().catch(function(){}) : v.pause(); } e.preventDefault(); }
  });

  disegna();
  aggiorna();
  setInterval(aggiorna, 3000);
})();
</script>
</body>
</html>
