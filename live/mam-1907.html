<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como 1907 · Como TV</title>
<!--
  MAM COMO 1907 (Goffredo, 27/09/2026)
  Il materiale del club (QNAP "COMOTV - FRAME", sola lettura): stagioni,
  academy, documentari, i format (Discover Como, Behind the Team, Taste of
  Como…), drone, interviste. NON sono partite, ma si cerca, si sceglie e si
  monta come nel MAM di Como TV:
   - il campo a gettoni (collezione, episodio, cartella, stagione, anno, tipo);
   - i risultati a tessere, TUTTO / VIDEO / FOTO, il pannello FILTRI a colonne;
   - il + sulla tessera e la barra in basso: MONTA QUESTI (una sequenza
     nell'Editing, clip-1907-monta) e SALVA IN RACCOLTA (raccolte 1907, un
     file loro sul ponte). Niente regia.
   - la LINEA DEL TEMPO: stagioni → mesi → cartelle, dal piu' recente. La data
     e' quella delle riprese (nome della cartella, orologio della camera, nome
     del file), NON quella della NAS, che e' il giorno della copia.
  Dati: /como-tv/mam-1907/indice/{indice,file}.json e copertine/;
  miniature e copie leggere dal servizio-1907 (/como-tv/mam-1907/mini/, /copia);
  i file originali: /como-tv/mam-1907/file/ (sola lettura).
-->
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none!important;}
  :root{color-scheme:dark;--navy:#1B1C20;--navy2:#222327;--pan:#2A2B30;--pan2:#33343A;--riga:rgba(255,255,255,.08);--riga2:rgba(255,255,255,.16);
    --oro:#C9A24B;--oro2:#E3C271;--ivory:#EDEDEE;--ivory2:#C9CACF;--fumo:#8E9096;--ok:#4FCB8B;--blu:#5AA7E8;--rosso:#E5484D;}
  body{font:14px/1.45 'DM Sans',system-ui,sans-serif;font-weight:500;color:var(--ivory);background:var(--navy);min-height:100vh;}
  button,.b{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border-radius:7px;cursor:pointer;
    background:rgba(245,241,230,.05);color:var(--ivory2);border:1px solid var(--riga2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none;}
  button:hover,.b:hover{color:var(--oro2);border-color:var(--oro);}
  button.mini,.b.mini{padding:5px 9px;font-size:10px;}
  button.oro,.b.oro{background:var(--oro);border-color:var(--oro);color:#10131c;} button.oro:hover{color:#10131c;background:var(--oro2);}
  :focus-visible{outline:2px solid var(--oro);outline-offset:2px;}
  a{color:inherit;}
  #libreria{display:flex;flex-direction:column;padding:22px 26px 110px;gap:22px;}
  .lib-testa h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.01em;}
  .lib-testa h1 span{color:var(--oro);}
  .lib-testa p{color:var(--fumo);margin-top:4px;font-size:13px;}
  /* il campo a gettoni del MAM */
  .lib-cerca{position:relative;max-width:820px;}
  .lib-cerca .lu{position:absolute;left:18px;top:27px;transform:translateY(-50%);opacity:.6;font-size:18px;pointer-events:none;z-index:1;}
  .campo-g{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:54px;padding:7px 44px 7px 50px;border-radius:12px;border:1px solid var(--riga2);background:rgba(245,241,230,.06);cursor:text;}
  .campo-g:focus-within{border-color:var(--oro);}
  .campo-g input{flex:1 1 220px;min-width:160px;border:0;background:transparent;padding:8px 2px;font:inherit;font-size:17px;color:var(--ivory);}
  .campo-g input:focus{outline:none;}
  .lib-cerca .via{position:absolute;right:10px;top:27px;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--ivory2);padding:4px 8px;letter-spacing:0;}
  .gt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 6px;border-radius:999px;background:rgba(245,241,230,.1);border:1px solid rgba(245,241,230,.18);font:600 13px/1 'DM Sans',sans-serif;color:var(--ivory);white-space:nowrap;max-width:100%;}
  .gt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;} .gt small{color:var(--fumo);font-weight:500;font-size:12px;}
  .gt button{border:0;background:transparent;color:inherit;opacity:.6;font-size:17px;line-height:1;width:22px;height:22px;border-radius:50%;padding:0;justify-content:center;letter-spacing:0;}
  .gt button:hover{opacity:1;background:rgba(245,241,230,.16);}
  .gt-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--c,var(--oro));margin:0 3px;}
  .gt-mini{width:18px;height:26px;border-radius:3px;background:#111 center/cover;flex:0 0 18px;}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:#141826;border:1px solid var(--riga2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;max-height:480px;overflow:auto;}
  .sugg h5{margin:10px 10px 4px;font:700 10px/1 'Mazzard',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--fumo);}
  .sugg h5:first-child{margin-top:6px;}
  .sugg a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ivory);font-size:14px;}
  .sugg a em{font-style:normal;color:var(--fumo);font-size:12.5px;margin-left:6px;}
  .sugg a small{margin-left:auto;color:var(--fumo);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sugg a.on,.sugg a:hover{background:rgba(201,162,75,.14);}
  .sugg a .gt-mini{width:24px;height:36px;flex-basis:24px;}
  .sez{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .sez h2{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);}
  .sez span{font-size:12px;color:var(--fumo);}
  .sez .dx{margin-left:auto;font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--oro2);cursor:pointer;background:none;border:0;padding:0;}
  /* raccolte, come nel MAM */
  .prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px;}
  .prog .pc{background:var(--pan);border:1px solid var(--riga);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ivory);
    font:inherit;letter-spacing:0;text-transform:none;align-items:stretch;white-space:normal;}
  .prog .pc:hover{border-color:var(--oro);color:var(--ivory);} .prog .pc b{display:block;font-size:14px;}
  .prog .pc .rc-n{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--fumo);} .prog .pc .rc-n b{display:inline;font-size:11.5px;color:var(--oro2);font-variant-numeric:tabular-nums;}
  .prog .pc small{color:var(--fumo);font-size:11.5px;}
  .vuota-racc{margin-top:10px;color:var(--fumo);font-size:13px;}
  /* Sfoglia */
  .filtri{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filtri-eti{font-family:'Mazzard',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);margin-right:4px;}
  .filtri select{background:rgba(245,241,230,.06);border:1px solid var(--riga2);color:var(--ivory);border-radius:7px;padding:6px 8px;font:500 12.5px 'DM Sans',sans-serif;max-width:280px;}
  /* locandine */
  .locandine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px;}
  .locandine.riga1{grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);grid-template-columns:none;overflow-x:auto;padding-bottom:8px;}
  .loc{display:flex;flex-direction:column;gap:7px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ivory);font:inherit;letter-spacing:0;text-transform:none;align-items:stretch;white-space:normal;}
  .loc:hover{color:var(--ivory);}
  .loc .poster{aspect-ratio:2/3;border-radius:9px;background:#101114 center/cover no-repeat;border:1px solid var(--riga);transition:transform .15s,border-color .15s;position:relative;overflow:hidden;}
  .loc:hover .poster{transform:translateY(-3px);border-color:var(--oro);}
  .loc .poster .senza{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font:800 15px/1.1 'Mazzard',sans-serif;text-transform:uppercase;color:var(--ivory2);}
  .loc .m{font-size:11.5px;color:var(--fumo);line-height:1.35;}
  .loc .m b{color:var(--ivory);font-weight:700;display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* LA LINEA DEL TEMPO */
  .tempo{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-width:1100px;}
  .tempo details.st{border:1px solid var(--riga);border-radius:12px;background:var(--pan);overflow:hidden;}
  .tempo details.st[open]{border-color:rgba(201,162,75,.45);}
  .tempo summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:12px 16px;}
  .tempo summary::-webkit-details-marker{display:none;}
  .tempo summary::before{content:"";width:0;height:0;border:5px solid transparent;border-left:7px solid var(--oro);align-self:center;transition:transform .15s;margin-right:-2px;}
  .tempo details[open] > summary::before{transform:rotate(90deg) translateX(2px);}
  .tempo .st > summary b{font:800 18px/1 'Mazzard',sans-serif;} .tempo summary span{color:var(--fumo);font-size:12px;}
  .tempo .mesi{padding:0 16px 14px 34px;display:flex;flex-direction:column;gap:6px;}
  .tempo details.me > summary{padding:8px 0;border-top:1px solid var(--riga);}
  .tempo details.me > summary b{font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--oro2);}
  .tempo .righe{display:flex;flex-direction:column;padding:0 0 8px 20px;}
  .tempo .rg{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:5px 8px;border-radius:6px;cursor:pointer;background:none;border:0;
    font:inherit;letter-spacing:0;text-transform:none;color:var(--ivory);text-align:left;white-space:normal;}
  .tempo .rg:hover{background:rgba(245,241,230,.06);color:var(--ivory);}
  .tempo .rg .gg{font:600 12px/1.4 ui-monospace,Menlo,monospace;color:var(--oro2);font-variant-numeric:tabular-nums;}
  .tempo .rg .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .tempo .rg .nm small{color:var(--fumo);font-size:11.5px;margin-left:6px;}
  .tempo .rg .nn{font-size:11.5px;color:var(--fumo);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tempo .rg .cam{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fumo);border:1px solid var(--riga2);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px;}
  .tempo .piu-r{padding:4px 8px;color:var(--oro2);font-size:12px;cursor:pointer;background:none;border:0;text-align:left;letter-spacing:0;text-transform:none;font-family:inherit;}
  .nota-date{color:var(--fumo);font-size:12px;margin-top:6px;max-width:900px;}
  /* LA RICERCA A TESSERE, come nel MAM */
  .ris{display:flex;flex-direction:column;gap:10px;}
  .ris .filtri-ris{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 6px;}
  .ris .filtri-ris button{font:700 10.5px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--riga2);background:transparent;color:var(--ivory2);cursor:pointer;}
  .ris .filtri-ris button b{font-family:ui-monospace,Menlo,monospace;font-weight:600;margin-left:6px;color:var(--fumo);letter-spacing:0;}
  .ris .filtri-ris button.on{background:var(--oro);border-color:var(--oro);color:#10131c;} .ris .filtri-ris button.on b{color:#10131c;}
  .ris .filtri-ris button:disabled{opacity:.4;cursor:default;}
  .ris .filtri-ris .apri-filtri{margin-left:auto;} .ris .filtri-ris .apri-filtri.aperto{border-color:var(--oro);color:var(--oro2);}
  .ris .filtri-ris .apri-filtri b{background:var(--oro);color:#10131c;border-radius:999px;padding:1px 6px;margin-left:6px;}
  .ris .filtri-ris .ordina{display:flex;align-items:center;gap:6px;font:700 10px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--fumo);margin-left:8px;}
  .ris .filtri-ris .ordina select{font:600 12px/1 'DM Sans',system-ui,sans-serif;letter-spacing:0;text-transform:none;color:var(--ivory);background:rgba(245,241,230,.06);border:1px solid var(--riga2);border-radius:8px;padding:6px 8px;}
  .pannello-filtri{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 22px;padding:14px 16px 16px;border:1px solid var(--riga2);border-radius:10px;background:rgba(245,241,230,.035);}
  .col-f{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .col-f legend{width:100%;padding:0 0 6px;font:700 10px/1 'Mazzard',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--oro2);}
  .col-f legend small{float:right;font:600 9px/1 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:none;color:var(--fumo);margin-top:1px;}
  .col-v{display:flex;align-items:center;gap:7px;padding:4px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ivory);min-width:0;}
  .col-v:hover{background:rgba(245,241,230,.06);}
  .col-v input{accent-color:#C9A24B;margin:0;flex:0 0 auto;width:15px;height:15px;}
  .col-v .col-n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .col-v b{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--fumo);font-variant-numeric:tabular-nums;}
  .col-v.zero{opacity:.45;}
  .col-cerca{font:inherit;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--riga2);background:rgba(245,241,230,.06);color:var(--ivory);margin:0 0 4px;}
  .col-tutte{align-self:flex-start;border:0;background:none;color:var(--oro2);font-size:12px;cursor:pointer;padding:4px 4px 0;letter-spacing:.1em;}
  .col-azzera{grid-column:1/-1;justify-self:start;border-radius:999px;font-family:'DM Sans',sans-serif;font-weight:500;text-transform:none;letter-spacing:0;font-size:12px;}
  .sez-ris{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px;flex-wrap:wrap;}
  .sez-ris h3{font:700 10.5px/1 'Mazzard',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ok);margin:0;}
  .sez-ris a{font-size:11.5px;color:var(--oro2);cursor:pointer;}
  .sez-ris a:first-of-type{margin-left:auto;}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .card{background:var(--pan);border:1px solid var(--riga);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;}
  .card:hover{border-color:var(--oro);}
  .card .mini{position:relative;aspect-ratio:16/9;background:#101114;}
  .card .mini .foto{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:0;transition:opacity .3s;}
  .card .mini .foto.su{opacity:1;}
  .card .mini .sopra{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 35%,transparent 65%,rgba(0,0,0,.55));}
  .card .mini .su{display:flex;justify-content:flex-start;align-items:flex-start;gap:6px;padding-right:38px;}
  .card .mini .giu{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;color:rgba(245,241,230,.85);text-transform:uppercase;letter-spacing:.08em;}
  .tipo-az{font:800 10px/1 'Mazzard',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:4px;color:#10131c;background:#8CC5F2;}
  .tipo-az.foto{background:#7FDCA9;} .tipo-az.altro{background:rgba(245,241,230,.85);}
  .quando{font:700 11px/1 ui-monospace,Menlo,monospace;color:#F5F1E6;background:rgba(10,15,36,.8);padding:4px 6px;border-radius:4px;margin-left:auto;}
  .peso{font:600 10px/1 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.7);padding:3px 6px;border-radius:4px;letter-spacing:0;}
  .card .scegli{position:absolute;right:8px;top:8px;z-index:3;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(245,241,230,.85);
    background:rgba(10,15,36,.72);color:#F5F1E6;line-height:0;cursor:pointer;display:grid;place-items:center;padding:0;}
  .card .scegli:hover,.card .scegli:focus-visible{background:rgba(201,162,75,.35);outline:none;}
  .card .scegli.on{background:#C9A24B;border-color:#C9A24B;color:#10131c;}
  .card.scelta{box-shadow:0 0 0 2px #C9A24B inset, 0 0 0 1px #C9A24B;}
  .card .t{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;}
  .card .t .testo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.35;color:var(--ivory);word-break:break-word;}
  .card .t .testo mark{background:rgba(201,162,75,.35);color:inherit;border-radius:2px;padding:0 1px;}
  .card .t small{display:block;color:var(--fumo);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .comp-et{display:inline-block;max-width:66%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:-2px;
    font:700 8.5px/1 'Mazzard',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 6px 3px;border-radius:4px;margin-right:6px;color:#10131c;}
  .rac-testa{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:12px 14px;border:1px solid var(--oro);border-radius:12px;background:rgba(201,162,75,.08);}
  .rac-testa .rc-eti{font:700 10.5px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--oro2);}
  .rac-testa h2{margin:0;font-size:18px;min-width:0;overflow-wrap:anywhere;} .rac-testa small{color:var(--fumo);font-size:12px;}
  .rac-testa .rc-az{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
  .piu{padding:12px 0;color:var(--fumo);font-size:13px;display:flex;gap:12px;align-items:center;}
  .attesa,.vuoto{color:var(--fumo);font-size:14px;padding:10px 0;}
  /* la barra in basso, come nel MAM */
  #barraScelte{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    padding:8px 8px 8px 18px;border-radius:999px;background:#141826;border:1px solid #C9A24B;box-shadow:0 14px 34px rgba(0,0,0,.55);color:var(--ivory);font-size:14px;width:max-content;max-width:calc(100vw - 32px);}
  #barraScelte[hidden]{display:none;}
  #barraScelte b{color:#E3C271;font-variant-numeric:tabular-nums;} #barraScelte em{font-style:normal;color:var(--fumo);font-size:12.5px;}
  #barraScelte button{border-radius:999px;padding:9px 16px;font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
  #barraScelte .monta{background:#C9A24B;border:1px solid #C9A24B;color:#10131c;} #barraScelte .monta:disabled{opacity:.6;cursor:wait;}
  #barraScelte .salva{background:transparent;border:1px solid #C9A24B;color:#E3C271;}
  #barraScelte .svuota{background:transparent;border:1px solid var(--riga2);color:var(--ivory2);}
  #barraScelte .form-r{display:flex;align-items:center;gap:8px;}
  #barraScelte .form-r input{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--riga2);background:rgba(245,241,230,.08);color:var(--ivory);width:220px;max-width:100%;}
  #barraScelte .form-r input:focus{outline:none;border-color:var(--oro);}
  @media (max-width:560px){ #barraScelte{left:16px;right:16px;transform:none;border-radius:14px;width:auto;} #barraScelte .form-r{flex-wrap:wrap;} #libreria{padding:16px 16px 140px;} }
  /* lettore */
  .velo[hidden]{display:none}

<script>
(function () {

  var I = null, COP = {}, F = null, CARICO = null, CART = {}, RACC = [], RACCOLTA = null;

  try { PANNELLO = localStorage.getItem("mam1907-filtri") === "1"; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function dataRip(d) { if (!d) return ""; var a = Math.floor(d / 10000), m = Math.floor(d / 100) % 100, g = d % 100; return g ? ("0" + g).slice(-2) + "/" + ("0" + m).slice(-2) + "/" + String(a).slice(2) : MESI[m - 1].slice(0, 3) + " " + a; }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

  function tipo(nm) { nm = nm.toLowerCase(); return /\.(mp4|mov|mxf|m4v|avi|mkv|mts|m2ts|webm)$/.test(nm) ? "video" : /\.(jpe?g|png|webp|heic|tiff?|cr2|cr3|arw|nef|dng|psd)$/.test(nm) ? "foto" : "altro"; }
  function url(p) { return BASE + "file/" + p.split("/").map(encodeURIComponent).join("/"); }
  function copertina(p) { var c = COP[p]; return c && (c.pronta || c.src) ? BASE + "indice/copertine/" + c.k + ".jpg" : ""; }

  // la chiave delle miniature: sha1 del percorso, come nel servizio-1907

  }
  var PALETTE = ["#C9A24B", "#8CC5F2", "#7FDCA9", "#F2A0A0", "#C7A6F2", "#F2C98C", "#9FE0E0", "#E3E08C"];
  function colore(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }

  // ══════════ GETTONI ══════════

  function di(k) { return G.filter(function (x) { return x.k === k; }).map(function (x) { return x.v; }); }

    }).join("");
    $("svuota").hidden = !G.length && !$("cerca").value && !RACCOLTA;
  }
  function metti(g, sostituisci) {

    if (!G.some(function (x) { return x.k === g.k && x.v === g.v; })) G.push(g);
    $("cerca").value = ""; Q = ""; chiudiSugg(); disegnaGettoni(); vai();
  }
  function togli(k, v) { G = G.filter(function (x) { return !(x.k === k && x.v === v); }); disegnaGettoni(); vai(); }

  // ══════════ SUGGERIMENTI, per categoria ══════════
  var SEL = -1, VOCI_S = [];
  function chiudiSugg() { $("sugg").hidden = true; SEL = -1; }
  function suggerisci() {
    var q = norm($("cerca").value.trim());
    if (!I || q.length < 2) { chiudiSugg(); return; }
    var coll = I.collezioni.filter(function (c) { return norm(c.p).indexOf(q) >= 0; }).slice(0, 5);
    var ep = I.episodi.filter(function (e) { return norm(e.p.split("/")[1]).indexOf(q) >= 0 || norm(titolo(e.p)).indexOf(q) >= 0; }).slice(0, 8);
    var cart = I.cartelle.filter(function (r) { var u = ultimo(r[0]); return r[0].split("/").length > 2 && norm(u).indexOf(q) >= 0; }).slice(0, 6);
    var stag = Object.keys(STAGIONI).filter(function (s) { return s.indexOf(q.replace(/[-]/g, "/")) >= 0 || ("stagione " + s).indexOf(q) >= 0; }).slice(0, 4);
    var tipi = [["video", "Solo video"], ["foto", "Solo foto"]].filter(function (t) { return norm(t[1]).indexOf(q) >= 0 || t[0].indexOf(q) === 0; });
    VOCI_S = [];
    function voce(g, testo, dett, conta) { VOCI_S.push(g); var u = (g.k === "coll" || g.k === "ep") ? copertina(g.v) : ""; return '<a data-s="' + (VOCI_S.length - 1) + '">' + (u ? '<span class="gt-mini" style="' + bg(u) + '"></span>' : '<span class="gt-dot"></span>') + "<span>" + esc(testo) + (dett ? "<em>" + esc(dett) + "</em>" : "") + "</span><small>" + conta + "</small></a>"; }
    var h = "";
    if (coll.length) h += "<h5>Collezioni</h5>" + coll.map(function (c) { return voce({ k: "coll", v: c.p, n: c.p }, c.p, "", c.attesa ? "in indicizzazione" : n(c.file) + " file"); }).join("");
    if (ep.length) h += "<h5>Episodi</h5>" + ep.map(function (e) { return voce({ k: "ep", v: e.p, n: e.p.split("/")[1] }, e.p.split("/")[1], e.p.split("/")[0], n(e.file) + " file"); }).join("");
    if (cart.length) h += "<h5>Cartelle</h5>" + cart.map(function (r) { return voce({ k: "cart", v: r[0], n: ultimo(r[0]) }, ultimo(r[0]), r[0].split("/").slice(0, -1).join(" › "), (r[1] ? dataRip(r[1]) + " · " : "") + n(r[3]) + " file"); }).join("");
    if (stag.length) h += "<h5>Stagioni</h5>" + stag.map(function (s) { return voce({ k: "stag", v: s, n: "Stagione " + s }, "Stagione " + s, "", n(STAGIONI[s]) + " file"); }).join("");
    if (tipi.length) h += "<h5>Tipo</h5>" + tipi.map(function (t) { return voce({ k: "tipo", v: t[0], n: t[1] }, t[1], "", ""); }).join("");
    h += '<h5>File</h5><a data-testo="1"><span class="gt-dot" style="--c:var(--fumo)"></span><span>Cerca «' + esc($("cerca").value.trim()) + '» nei nomi dei file e delle cartelle</span><small>Invio</small></a>';
    $("sugg").innerHTML = h; $("sugg").hidden = false; SEL = -1;
  }
  $("cerca").addEventListener("input", function () { suggerisci(); disegnaGettoni(); });
  $("cerca").addEventListener("keydown", function (e) {
    var tutte = $("sugg").querySelectorAll("a");
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !$("sugg").hidden) { e.preventDefault(); if (!tutte.length) return; SEL = (SEL + (e.key === "ArrowDown" ? 1 : -1) + tutte.length) % tutte.length; tutte.forEach(function (a, i) { a.classList.toggle("on", i === SEL); }); return; }
    if (e.key === "Enter") { e.preventDefault(); if (SEL >= 0 && tutte[SEL] && tutte[SEL].dataset.s) { metti(VOCI_S[+tutte[SEL].dataset.s], VOCI_S[+tutte[SEL].dataset.s].k === "tipo"); return; } Q = this.value.trim(); chiudiSugg(); vai(); return; }
    if (e.key === "Escape") chiudiSugg();
    if (e.key === "Backspace" && !this.value && G.length) { G.pop(); disegnaGettoni(); vai(); }
  });
  $("sugg").addEventListener("mousedown", function (e) { var a = e.target.closest("a"); if (!a) return; e.preventDefault(); if (a.dataset.s) { var g = VOCI_S[+a.dataset.s]; metti(g, g.k === "tipo"); } else { Q = $("cerca").value.trim(); chiudiSugg(); vai(); } });
  $("cerca").addEventListener("blur", function () { setTimeout(chiudiSugg, 150); });
  $("campoG").addEventListener("click", function (e) { var b = e.target.closest("[data-via]"); if (b) { G.splice(+b.dataset.via, 1); disegnaGettoni(); vai(); return; } $("cerca").focus(); });
  $("svuota").onclick = function () { G = []; Q = ""; RACCOLTA = null; $("cerca").value = ""; disegnaGettoni(); vai(); };

  // ══════════ INDIRIZZO: la ricerca si manda a un collega ══════════
  function salvaIndirizzo() {
    var h = new URLSearchParams();
    if (G.length) h.set("g", JSON.stringify(G.map(function (x) { return [x.k, x.v]; })));
    if (Q) h.set("q", Q); if (RACCOLTA) h.set("r", RACCOLTA.id); if (TAB !== "tutto") h.set("t", TAB);
    history.replaceState(null, "", location.pathname + location.search + (h.toString() ? "#" + h.toString() : ""));
  }
  function nomeDi(k, v) { return k === "ep" ? v.split("/")[1] : k === "cart" ? ultimo(v) : k === "stag" ? "Stagione " + v : k === "tipo" ? (v === "video" ? "Solo video" : "Solo foto") : v; }
  function leggiIndirizzo() {

    // i link della versione di prima (#c=…&t=…)

    if (h.get("t") === "video" || h.get("t") === "foto") TAB = h.get("t");

  // ══════════ HOME ══════════
  var STAGIONI = {};
  function locandina(p, info) {

    return '<button class="loc" data-apri="' + esc(p) + '"><div class="poster" style="' + bg(u) + '">' + (u ? "" : '<span class="senza">' + esc(titolo(p)) + "</span>") + '</div><span class="m"><b title="' + esc(ultimo(p)) + '">' + esc(ultimo(p)) + "</b>" + info + "</span></button>";
  }
  function infoC(c) { if (c.attesa) return "in indicizzazione"; return [c.data ? dataRip(c.data) : "", c.video ? n(c.video) + " video" : "", c.foto ? n(c.foto) + " foto" : "", gb(c.peso)].filter(Boolean).join(" · "); }
  function disegnaHome() {
    var sc = $("selStag").value, cc = $("selColl").value, tt = $("selTipo").value;
    // la linea del tempo: stagioni → mesi → cartelle
    var righe = I.cartelle.filter(function (r) {
      if (cc && r[0] !== cc && r[0].indexOf(cc + "/") !== 0) return false;
      if (sc && r[2] !== sc) return false;
      if (tt === "video" && !r[4]) return false; if (tt === "foto" && !r[5]) return false;
      return r[4] || r[5];
    });
    var perSt = {};

    $("tempoConto").textContent = n(righe.length) + " cartelle · " + st.filter(function (s) { return s !== "senza stagione"; }).length + " stagioni";
    $("tempo").innerHTML = st.length ? st.map(function (s, i) {
      var rr = perSt[s], file = rr.reduce(function (t, r) { return t + (tt === "video" ? r[4] : tt === "foto" ? r[5] : r[4] + r[5]); }, 0);
      var perM = {}; rr.forEach(function (r) { var m = r[1] ? Math.floor(r[1] / 100) : 0; (perM[m] = perM[m] || []).push(r); });
      var mesi = Object.keys(perM).map(Number).sort(function (a, b) { return b - a; });
      return '<details class="st"' + (i === 0 ? " open" : "") + "><summary><b>" + esc(s === "senza stagione" ? "Senza stagione" : "Stagione " + s) + "</b><span>" + n(file) + " file · " + n(rr.length) + " cartelle</span></summary><div class=\"mesi\">" +
        mesi.map(function (m, j) {
          var rm = perM[m].slice().sort(function (a, b) { return (b[1] || 0) - (a[1] || 0) || a[0].localeCompare(b[0]); });
          var nomeM = m ? MESI[m % 100 - 1] + " " + Math.floor(m / 100) : "Data da trovare";
          return '<details class="me"' + (i === 0 && j === 0 ? " open" : "") + "><summary><b>" + esc(nomeM) + "</b><span>" + n(rm.length) + " cartelle</span></summary><div class=\"righe\" data-m=\"" + s + "|" + m + "\">" + righeTempo(rm, 40) + "</div></details>";

  // ══════════ RACCOLTE 1907 ══════════

    if ((t = e.target.closest("[data-apri]"))) { apriCollezione(t.dataset.apri); return; }
    if ((t = e.target.closest(".card[data-f]"))) { var x = VISTI.find(function (y) { return y.via === t.dataset.f; }); if (x) apri(x); }
  });
  $("risultati").addEventListener("change", function (e) {
    var c = e.target.closest("[data-col]"); if (c) { if (c.checked) metti({ k: c.dataset.col, v: c.value, n: nomeDi(c.dataset.col, c.value) }); else togli(c.dataset.col, c.value); return; }
    if (e.target.id === "selOrd") { ORD = e.target.value; quanti = MAX; risultati(); }
  });
  $("risultati").addEventListener("input", function (e) {
    var c = e.target.closest("[data-colcerca]"); if (!c) return;
    COL_CERCA[c.dataset.colcerca] = c.value; var pos = c.selectionStart, k = c.dataset.colcerca; risultati();
    var i = document.querySelector('[data-colcerca="' + k + '"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });
  $("avvisi").addEventListener("click", function (e) {
    var a = e.target.closest("[data-ripristina]"); if (!a) return; e.preventDefault();
    post({ tipo: "clip-1907-raccolta-ripristina", id: a.dataset.ripristina }).then(function () { caricaRaccolte(); avviso("", "Raccolta ripristinata."); });
  });
  $("home").addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-racc]"))) { apriRaccolta(t.dataset.racc); return; }
    if ((t = e.target.closest("[data-cart]"))) { metti({ k: "cart", v: t.dataset.cart, n: ultimo(t.dataset.cart) }); window.scrollTo(0, 0); return; }
    if ((t = e.target.closest("[data-apri]"))) apriCollezione(t.dataset.apri);
  });
  function apriCollezione(p) { var ep = p.indexOf("/") > 0; G = G.filter(function (x) { return x.k === "tipo"; }); metti({ k: ep ? "ep" : "coll", v: p, n: nomeDi(ep ? "ep" : "coll", p) }); window.scrollTo(0, 0); }
  $("risultati").addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.classList.contains("card")) e.target.click(); });

  // ══════════ IL LETTORE ══════════
  // I 4K a 10 bit delle camere il browser non li legge: si guarda la copia
  // leggera (720p) se c'e', e se non c'e' la si chiede al servizio-1907.
  var SEGUI = null;
  function apri(x) {
    var u = url(x.via), dx = '<a class="b" href="' + u + '" download>Scarica l’originale</a>' + (x.tipo === "video" ? '<button data-fa="monta-uno" class="oro">Monta questo</button>' : "") + '<button data-fa="scegli-uno">' + (SCELTI.has(x.via) ? "Togli dalla scelta" : "Scegli") + '</button><button id="chiudi">Chiudi</button>';
    var info = '<div class="info"><div><b>' + esc(x.nome) + "</b><br>" + esc(x.d.split("/").join(" › ")) + " · " + gb(x.peso) + (x.data ? " · girato il " + dataRip(x.data) : "") + '</div><div class="dx">' + dx + "</div></div>";
    var schermo;
    if (x.tipo === "foto" && /\.(jpe?g|png|webp)$/i.test(x.via)) schermo = '<div class="schermo"><img src="' + u + '" alt=""></div>';
    else if (x.tipo === "video") schermo = '<div class="schermo" id="schermo"><div class="copia"><b>Preparo l’anteprima…</b></div></div>';
    else schermo = '<div class="schermo" id="schermo"><div class="copia"><b>Anteprima non disponibile</b><span>Questo formato si apre solo scaricandolo.</span></div></div>';
    $("velo").innerHTML = '<div class="lettore" role="dialog" aria-label="' + esc(x.nome) + '">' + schermo + info + "</div>";
    $("velo").hidden = false; $("chiudi").onclick = chiudi;
    $("velo").querySelector('[data-fa="scegli-uno"]').onclick = function () { scegli(x.via); this.textContent = SCELTI.has(x.via) ? "Togli dalla scelta" : "Scegli"; };
    var mu = $("velo").querySelector('[data-fa="monta-uno"]'); if (mu) mu.onclick = function () { monta([x.via], mu, x.nome); };
    if (x.tipo === "video") {
      chiave(x.via).then(function (k) { $("schermo").style.backgroundImage = 'url("' + BASE + "mini/" + k + ".jpg?v=" + encodeURIComponent(x.via) + '")'; });
      guardaCopia(x, false);
    }
  }
  function guardaCopia(x, chiedi) {
    clearTimeout(SEGUI);
    fetch(BASE + "copia?v=" + encodeURIComponent(x.via) + (chiedi ? "&fai=1" : "") + (chiedi === 2 ? "&riprova=1" : ""), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
      var sc = $("schermo"); if (!sc || $("velo").hidden) return;
      if (s.stato === "pronta") { sc.innerHTML = '<video src="' + s.via + '" controls autoplay playsinline preload="metadata"></video>'; return; }
      // intanto si prova l'originale: gli 8 bit il browser li legge
      if (!sc.querySelector("video.orig")) {
        sc.innerHTML = '<video class="orig" src="' + url(x.via) + '" controls playsinline preload="metadata"></video><div class="copia" id="statoCopia" hidden></div>';
        // l'originale non si vede: solo allora si chiede la copia leggera
        var nonVa = function () { var c = $("statoCopia"); if (c && c.hidden) { c.hidden = false; guardaCopia(x, 1); } };
        sc.querySelector("video").addEventListener("error", nonVa);
        sc.querySelector("video").addEventListener("loadeddata", function () { if (this.videoWidth === 0) nonVa(); });
      }
      if (s.stato === "assente") return;
      var c = $("statoCopia"); if (!c) return;
      var pct = Math.round((s.avanzamento || 0) * 100);
      c.innerHTML = "<b>Questo originale il browser non lo legge</b><span>" + (s.stato === "errore" ? "La copia leggera non è riuscita." : s.stato === "lavoro" ? "Sto facendo la copia leggera (720p): " + pct + "%" : /pausa/.test(s.stato) ? "Copia in pausa: c’è una diretta." : "Copia leggera in coda" + (s.davanti ? " (" + s.davanti + " prima)" : "") + ".") +
        "</span>" + (s.stato === "lavoro" ? '<div class="barra-c"><i style="width:' + pct + '%"></i></div>' : "") + '<span style="font-size:12px;color:var(--fumo)">Si fa sulla VM, a bassa priorità: un 4K a 10 bit richiede più o meno la sua durata, di più se la macchina è occupata. Puoi chiudere e tornare dopo.</span>' +
        (s.stato === "errore" ? '<button class="mini" id="riprova">Riprova</button>' : "");
      var rp = $("riprova"); if (rp) rp.onclick = function () { guardaCopia(x, 2); };
      if (s.stato !== "errore") SEGUI = setTimeout(function () { guardaCopia(x, 1); }, 5000);
    }).catch(function () {});
  }
  function chiudi() { clearTimeout(SEGUI); var v = $("velo").querySelector("video"); if (v) v.pause(); $("velo").hidden = true; $("velo").innerHTML = ""; }
  $("velo").addEventListener("click", function (e) { if (e.target.id === "velo") chiudi(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("velo").hidden) chiudi(); });

  // ══════════ PARTENZA ══════════
  fetch(BASE + "indice/copertine/copertine.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : { copertine: [] }; }).catch(function () { return { copertine: [] }; })
    .then(function (c) { (c.copertine || []).forEach(function (v) { COP[v.p] = v; }); return fetch(BASE + "indice/indice.json", { cache: "no-store" }); })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      I = j; I.episodi = I.episodi || []; I.cartelle = I.cartelle || [];
      I.cartelle.forEach(function (r) { CART[r[0]] = [r[1], r[2]]; if (r[2]) STAGIONI[r[2]] = (STAGIONI[r[2]] || 0) + r[4] + r[5]; });
      var datate = I.cartelle.filter(function (r) { return r[1]; }).length;
      $("sotto").textContent = n(I.file) + " file · " + I.collezioni.length + " collezioni · " + n(I.episodi.length) + " episodi · " + gb(I.peso) + " sulla NAS" +
        (I.parziale ? " · indicizzazione in corso" : "") + ". Cerca, guarda, monta.";
      $("notaDate").textContent = "Le date sono quelle delle riprese, non della NAS (lì tutti i file hanno la data della copia, estate 2026). Vengono dal nome della cartella, dall’orologio della camera (segnate «camera») o dal nome del file. Per ora " + n(datate) + " cartelle su " + n(I.cartelle.length) + " hanno il giorno" + (I.conDataCamera ? "" : ": la lettura degli orologi delle camere è in corso") + ".";
      $("collConto").textContent = I.collezioni.length;
      $("collezioni").innerHTML = I.collezioni.slice().sort(function (a, b) { return (b.data || 0) - (a.data || 0); }).map(function (c) { return locandina(c.p, infoC(c)); }).join("");
      $("selColl").innerHTML = '<option value="">Tutte le collezioni</option>' + I.collezioni.slice().sort(function (a, b) { return a.p.localeCompare(b.p); }).map(function (c) { return '<option value="' + esc(c.p) + '">' + esc(c.p) + "</option>"; }).join("");
      $("selStag").innerHTML = '<option value="">Tutte le stagioni</option>' + Object.keys(STAGIONI).sort().reverse().map(function (s) { return '<option value="' + s + '">Stagione ' + s + "</option>"; }).join("");
      disegnaHome(); caricaRaccolte(); leggiIndirizzo(); vai();
    })
    .catch(function () { $("tempo").innerHTML = ""; $("collezioni").innerHTML = '<div class="attesa">L’indice del materiale non è ancora pronto: lo stiamo preparando sulla NAS. Riprova tra qualche minuto.</div>'; });
})();
</script>
