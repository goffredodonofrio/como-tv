<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como 1907 · Como TV</title>
<!--
  MAM COMO 1907 (Goffredo, 27/09/2026)
  Il materiale del club (QNAP "COMOTV - FRAME"): stagioni, academy, documentari,
  i format (Discover Como, Behind the Team, Taste of Como, Inside Sinigaglia…),
  drone, interviste, fan stories. NON sono partite: si organizza per
  COLLEZIONI (cartelle di primo livello) ed EPISODI (secondo livello), con le
  copertine (ufficiali da COMO TV - THUMBNAILS o composte: copertine-1907.py).
  Stessa grammatica del MAM di Como TV: saluto, campo a gettoni, suggerimenti,
  Sfoglia, la tabella.
  Dati: /como-tv/mam-1907/indice/indice.json (collezioni, episodi),
        /como-tv/mam-1907/indice/file.json (i file per cartella, a richiesta),
        /como-tv/mam-1907/indice/copertine/ ; i file: /como-tv/mam-1907/file/ (sola lettura).
-->
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{color-scheme:dark;--navy:#1B1C20;--navy2:#222327;--pan:#2A2B30;--pan2:#33343A;--riga:rgba(255,255,255,.08);--riga2:rgba(255,255,255,.16);
    --oro:#C9A24B;--oro2:#E3C271;--ivory:#EDEDEE;--ivory2:#C9CACF;--fumo:#8E9096;--ok:#4FCB8B;--blu:#5AA7E8;--rosso:#E5484D;}
  body{font:14px/1.45 'DM Sans',system-ui,sans-serif;font-weight:500;color:var(--ivory);background:var(--navy);min-height:100vh;}
  button,.b{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border-radius:7px;cursor:pointer;
    background:rgba(245,241,230,.05);color:var(--ivory2);border:1px solid var(--riga2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none;}
  button:hover,.b:hover{color:var(--oro2);border-color:var(--oro);}
  button.mini,.b.mini{padding:5px 9px;font-size:10px;}
  :focus-visible{outline:2px solid var(--oro);outline-offset:2px;}
  #libreria{display:flex;flex-direction:column;padding:22px 26px 60px;gap:22px;max-width:1600px;margin:0 auto;}
  .lib-testa h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.01em;}
  .lib-testa h1 span{color:var(--oro);}
  .lib-testa p{color:var(--fumo);margin-top:4px;font-size:13px;}
  /* il campo a gettoni del MAM */
  .lib-cerca{position:relative;max-width:820px;}
  .lib-cerca .lu{position:absolute;left:18px;top:27px;transform:translateY(-50%);opacity:.6;font-size:18px;pointer-events:none;z-index:1;}
  .campo-g{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:54px;padding:7px 44px 7px 50px;border-radius:12px;border:1px solid var(--riga2);background:rgba(245,241,230,.06);cursor:text;}
  .campo-g:focus-within{border-color:var(--oro);}
  .campo-g input{flex:1 1 220px;min-width:160px;border:0;background:transparent;padding:8px 2px;font:inherit;font-size:17px;color:var(--ivory);}
  .campo-g input:focus{outline:none;}
  .lib-cerca .via{position:absolute;right:10px;top:27px;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--ivory2);padding:4px 8px;}
  .gt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 6px;border-radius:999px;background:rgba(245,241,230,.1);border:1px solid rgba(245,241,230,.18);font:600 13px/1 'DM Sans',sans-serif;color:var(--ivory);white-space:nowrap;max-width:100%;}
  .gt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;} .gt small{color:var(--fumo);font-weight:500;font-size:12px;}
  .gt button{border:0;background:transparent;color:inherit;opacity:.6;font-size:17px;line-height:1;width:22px;height:22px;border-radius:50%;padding:0;justify-content:center;letter-spacing:0;}
  .gt button:hover{opacity:1;background:rgba(245,241,230,.16);}
  .gt-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--oro);margin:0 3px;}
  .gt-mini{width:18px;height:26px;border-radius:3px;background:#111 center/cover;flex:0 0 18px;}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:#141826;border:1px solid var(--riga2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;max-height:480px;overflow:auto;}
  .sugg h5{margin:10px 10px 4px;font:700 10px/1 'Mazzard',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--fumo);}
  .sugg h5:first-child{margin-top:6px;}
  .sugg a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ivory);font-size:14px;}
  .sugg a em{font-style:normal;color:var(--fumo);font-size:12.5px;margin-left:6px;}
  .sugg a small{margin-left:auto;color:var(--fumo);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sugg a.on,.sugg a:hover{background:rgba(201,162,75,.14);}
  .sugg a .gt-mini{width:24px;height:36px;flex-basis:24px;}
  .sez{display:flex;align-items:baseline;gap:12px;}
  .sez h2{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);}
  .sez span{font-size:12px;color:var(--fumo);}
  /* locandine: collezioni ed episodi */
  .locandine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px;}
  .locandine.riga1{grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);grid-template-columns:none;overflow-x:auto;padding-bottom:8px;}
  .loc{display:flex;flex-direction:column;gap:7px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ivory);font:inherit;letter-spacing:0;text-transform:none;align-items:stretch;white-space:normal;}
  .loc:hover{color:var(--ivory);}
  .loc .poster{aspect-ratio:2/3;border-radius:9px;background:#101114 center/cover no-repeat;border:1px solid var(--riga);transition:transform .15s,border-color .15s;position:relative;overflow:hidden;}
  .loc:hover .poster{transform:translateY(-3px);border-color:var(--oro);}
  .loc .poster .senza{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font:800 15px/1.1 'Mazzard',sans-serif;text-transform:uppercase;color:var(--ivory2);}
  .loc .m{font-size:11.5px;color:var(--fumo);line-height:1.35;}
  .loc .m b{color:var(--ivory);font-weight:700;display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Sfoglia, come nel MAM */
  .filtri{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filtri-eti{font-family:'Mazzard',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);margin-right:4px;}
  .filtri select{background:rgba(245,241,230,.06);border:1px solid var(--riga2);color:var(--ivory);border-radius:7px;padding:6px 8px;font:500 12.5px 'DM Sans',sans-serif;max-width:280px;}
  .filtri select.on{border-color:var(--oro);color:var(--oro2);}
  /* la tabella del MAM */
  .lista{width:100%;border-collapse:collapse;font-size:13px;background:var(--pan);border:1px solid var(--riga);border-radius:12px;overflow:hidden;}
  .lista th{font-family:'Mazzard',sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fumo);text-align:left;padding:8px 10px;border-bottom:1px solid var(--riga);font-weight:700;}
  .lista td{padding:7px 10px;border-bottom:1px solid var(--riga);vertical-align:middle;white-space:nowrap;}
  .lista tr:last-child td{border-bottom:0;} .lista tbody tr{cursor:pointer;} .lista tbody tr:hover td{background:rgba(245,241,230,.04);}
  .lista td.p{white-space:normal;font-weight:600;word-break:break-word;} .lista td.p small{display:block;color:var(--fumo);font-weight:400;font-size:11px;}
  .lista td.n{color:var(--fumo);font-variant-numeric:tabular-nums;}
  .lista .tp{font:700 9px/1 'Mazzard',sans-serif;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:3px 6px;}
  .tp.video{background:rgba(90,167,232,.18);color:#8CC5F2;} .tp.foto{background:rgba(79,203,139,.16);color:#7FDCA9;} .tp.altro{background:rgba(245,241,230,.08);color:var(--fumo);}
  .lista td.cop{width:44px;padding:4px 0 4px 8px;} .lista .cm{width:28px;height:42px;border-radius:3px;background:#101114 center/cover;display:block;}
  .attesa,.vuoto{color:var(--fumo);font-size:14px;padding:18px 0;}
  .piu{padding:12px 0;color:var(--fumo);font-size:13px;display:flex;gap:12px;align-items:center;}
  .scroll-x{overflow-x:auto;}
  /* lettore */
  .velo[hidden]{display:none}
  .velo{position:fixed;inset:0;background:rgba(5,6,10,.88);display:grid;place-items:center;padding:20px;z-index:50;}
  .lettore{width:min(1200px,100%);background:var(--pan);border-radius:14px;overflow:hidden;border:1px solid rgba(201,162,75,.35);}
  .lettore video,.lettore img{display:block;width:100%;max-height:72vh;background:#000;object-fit:contain;}
  .lettore .info{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;font-size:13px;color:var(--ivory2);}
  .lettore .info b{color:var(--ivory);} .lettore .info .dx{margin-left:auto;display:flex;gap:8px;}
  .avviso{padding:14px 16px;background:rgba(229,27,32,.12);color:#FF9A9C;font-size:13px;}
</style>
</head>
<body>
<script src="nav-mam.js"></script>
<div id="libreria">
  <div class="lib-testa"><h1 id="saluto">Buongiorno, <span>Como 1907</span></h1><p id="sotto">Il materiale del club: stagioni, format, documentari, academy. Cerca, guarda, scarica.</p></div>
  <div class="lib-cerca">
    <span class="lu">&#128269;</span>
    <div class="campo-g" id="campoG"><span id="gettoni" style="display:contents"></span><input id="cerca" type="search" placeholder="Cerca qui: una collezione, un episodio, un file" autocomplete="off" data-1p-ignore data-lpignore="true" aria-autocomplete="list" aria-controls="sugg"></div>
    <button class="via" id="svuota" title="svuota la ricerca" aria-label="svuota la ricerca" hidden>×</button>
    <div id="sugg" class="sugg" role="listbox" hidden></div>
  </div>
  <div id="home">
    <div class="sez"><h2>Collezioni</h2><span id="collConto"></span></div>
    <div class="locandine riga1" id="collezioni"><div class="attesa">Carico le collezioni…</div></div>
  </div>
  <div id="episodiBox" hidden>
    <div class="sez"><h2 id="epTitolo">Episodi</h2><span id="epConto"></span></div>
    <div class="locandine" id="episodi"></div>
  </div>
  <div>
    <div class="filtri">
      <span class="filtri-eti">Sfoglia</span>
      <select id="selColl" title="collezione"><option value="">Tutte le collezioni</option></select>
      <select id="selTipo" title="tipo di file"><option value="">Video e foto</option><option value="video">Solo video</option><option value="foto">Solo foto</option><option value="altro">Altri file</option></select>
      <select id="selOrd" title="ordine"><option value="data">Più recenti</option><option value="nome">Per nome</option><option value="peso">Più pesanti</option></select>
    </div>
    <div class="sez" style="margin:18px 0 10px"><h2 id="fileTitolo">File</h2><span id="fileConto"></span></div>
    <div id="elenco" class="scroll-x"></div>
  </div>
</div>
<div class="velo" id="velo" hidden></div>
<script>
(function () {
  var BASE = "/como-tv/mam-1907/";
  var I = null, COP = {}, F = null, CARICO = null;
  var G = [];            // gettoni: {k:"coll"|"ep"|"tipo", v, n}
  var Q = "", MAX = 300, quanti = MAX;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function gb(b) { return b > 1e12 ? (b / 1e12).toFixed(2).replace(".", ",") + " TB" : b > 1e9 ? (b / 1e9).toFixed(1).replace(".", ",") + " GB" : Math.max(1, Math.round(b / 1e6)) + " MB"; }
  function n(x) { return (x || 0).toLocaleString("it-IT"); }
  function data(t) { return new Date(t * 1000).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "2-digit" }); }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function ultimo(p) { return p.split("/").pop(); }
  function tipo(nm) { nm = nm.toLowerCase(); return /\.(mp4|mov|mxf|m4v|avi|mkv|mts|m2ts|webm)$/.test(nm) ? "video" : /\.(jpe?g|png|webp|heic|tiff?|cr2|cr3|arw|nef|dng|psd)$/.test(nm) ? "foto" : "altro"; }
  function url(p) { return BASE + "file/" + p.split("/").map(encodeURIComponent).join("/"); }
  function copertina(p) { var c = COP[p]; return c && (c.pronta || c.src) ? BASE + "indice/copertine/" + c.k + ".jpg" : ""; }
  function titolo(p) { var c = COP[p]; return c && c.titolo ? c.titolo : ultimo(p); }
  function bg(u) { return u ? "background-image:url(&quot;" + u + "&quot;)" : ""; }

  (function () { var h = new Date().getHours(); $("saluto").innerHTML = (h < 13 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera") + ", <span>Como 1907</span>"; })();

  function locandina(p, info) {
    var u = copertina(p);
    return '<button class="loc" data-apri="' + esc(p) + '"><div class="poster" style="' + bg(u) + '">' + (u ? "" : '<span class="senza">' + esc(titolo(p)) + "</span>") + '</div><span class="m"><b title="' + esc(ultimo(p)) + '">' + esc(ultimo(p)) + "</b>" + info + "</span></button>";
  }
  function infoC(c) { if (c.attesa) return "in indicizzazione"; return [c.video ? n(c.video) + " video" : "", c.foto ? n(c.foto) + " foto" : "", gb(c.peso)].filter(Boolean).join(" · "); }

  // ── gettoni ──
  function gColl() { var g = G.filter(function (x) { return x.k === "coll" || x.k === "ep"; }).pop(); return g ? g.v : ""; }
  function gTipo() { var g = G.filter(function (x) { return x.k === "tipo"; }).pop(); return g ? g.v : ""; }
  function disegnaGettoni() {
    $("gettoni").innerHTML = G.map(function (g, i) {
      var u = g.k !== "tipo" ? copertina(g.v) : "";
      return '<span class="gt">' + (u ? '<span class="gt-mini" style="' + bg(u) + '"></span>' : '<span class="gt-dot"></span>') + "<b>" + esc(g.n) + "</b>" + (g.k === "ep" ? "<small>" + esc(g.v.split("/")[0]) + "</small>" : "") + '<button data-via="' + i + '" aria-label="togli ' + esc(g.n) + '">×</button></span>';
    }).join("");
    $("svuota").hidden = !G.length && !$("cerca").value;
  }
  function metti(g) {
    if (g.k === "tipo") G = G.filter(function (x) { return x.k !== "tipo"; });
    else G = G.filter(function (x) { return x.k === "tipo"; });
    G.push(g); $("cerca").value = ""; Q = ""; chiudiSugg(); disegnaGettoni(); tutto(); salvaIndirizzo();
  }

  // ── suggerimenti, come nel MAM: per categoria ──
  var SEL = -1, VOCI_S = [];
  function chiudiSugg() { $("sugg").hidden = true; SEL = -1; }
  function suggerisci() {
    var q = norm($("cerca").value.trim());
    if (!I || q.length < 2) { chiudiSugg(); return; }
    var coll = I.collezioni.filter(function (c) { return norm(c.p).indexOf(q) >= 0; }).slice(0, 6);
    var ep = I.episodi.filter(function (e) { return norm(e.p.split("/")[1]).indexOf(q) >= 0 || norm(titolo(e.p)).indexOf(q) >= 0; }).slice(0, 10);
    var tipi = [["video", "Solo video"], ["foto", "Solo foto"]].filter(function (t) { return norm(t[1]).indexOf(q) >= 0 || t[0].indexOf(q) === 0; });
    VOCI_S = [];
    function voce(g, testo, dett, conta) { VOCI_S.push(g); var u = g.k !== "tipo" ? copertina(g.v) : ""; return '<a data-s="' + (VOCI_S.length - 1) + '">' + (u ? '<span class="gt-mini" style="' + bg(u) + '"></span>' : '<span class="gt-dot"></span>') + "<span>" + esc(testo) + (dett ? "<em>" + esc(dett) + "</em>" : "") + "</span><small>" + conta + "</small></a>"; }
    var h = "";
    if (coll.length) h += "<h5>Collezioni</h5>" + coll.map(function (c) { return voce({ k: "coll", v: c.p, n: c.p }, c.p, "", n(c.file) + " file"); }).join("");
    if (ep.length) h += "<h5>Episodi</h5>" + ep.map(function (e) { return voce({ k: "ep", v: e.p, n: e.p.split("/")[1] }, e.p.split("/")[1], e.p.split("/")[0], n(e.file) + " file"); }).join("");
    if (tipi.length) h += "<h5>Tipo</h5>" + tipi.map(function (t) { return voce({ k: "tipo", v: t[0], n: t[1] }, t[1], "", ""); }).join("");
    h += '<h5>File</h5><a data-testo="1"><span class="gt-dot" style="background:var(--fumo)"></span><span>Cerca «' + esc($("cerca").value.trim()) + '» nei nomi dei file</span><small>Invio</small></a>';
    $("sugg").innerHTML = h; $("sugg").hidden = false; SEL = -1;
  }
  $("cerca").addEventListener("input", function () { suggerisci(); disegnaGettoni(); });
  $("cerca").addEventListener("keydown", function (e) {
    var tutte = $("sugg").querySelectorAll("a");
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !$("sugg").hidden) { e.preventDefault(); if (!tutte.length) return; SEL = (SEL + (e.key === "ArrowDown" ? 1 : -1) + tutte.length) % tutte.length; tutte.forEach(function (a, i) { a.classList.toggle("on", i === SEL); }); return; }
    if (e.key === "Enter") { e.preventDefault(); if (SEL >= 0 && tutte[SEL] && tutte[SEL].dataset.s) { metti(VOCI_S[+tutte[SEL].dataset.s]); return; } Q = this.value.trim(); chiudiSugg(); tutto(); salvaIndirizzo(); return; }
    if (e.key === "Escape") chiudiSugg();
    if (e.key === "Backspace" && !this.value && G.length) { G.pop(); disegnaGettoni(); tutto(); salvaIndirizzo(); }
  });
  $("sugg").addEventListener("mousedown", function (e) { var a = e.target.closest("a"); if (!a) return; e.preventDefault(); if (a.dataset.s) metti(VOCI_S[+a.dataset.s]); else { Q = $("cerca").value.trim(); chiudiSugg(); tutto(); salvaIndirizzo(); } });
  $("cerca").addEventListener("blur", function () { setTimeout(chiudiSugg, 150); });
  $("campoG").addEventListener("click", function (e) { var b = e.target.closest("[data-via]"); if (b) { G.splice(+b.dataset.via, 1); disegnaGettoni(); tutto(); salvaIndirizzo(); return; } $("cerca").focus(); });
  $("svuota").onclick = function () { G = []; Q = ""; $("cerca").value = ""; disegnaGettoni(); tutto(); salvaIndirizzo(); };

  // ── indirizzo: la ricerca si puo' condividere ──
  function salvaIndirizzo() { var h = new URLSearchParams(); var c = gColl(); if (c) h.set("c", c); if (gTipo()) h.set("t", gTipo()); if (Q) h.set("q", Q); history.replaceState(null, "", location.pathname + location.search + (h.toString() ? "#" + h.toString() : "")); }
  function leggiIndirizzo() {
    var h = new URLSearchParams(location.hash.slice(1)); G = [];
    var c = h.get("c"); if (c) G.push({ k: c.indexOf("/") > 0 ? "ep" : "coll", v: c, n: c.indexOf("/") > 0 ? c.split("/")[1] : c });
    var t = h.get("t"); if (t) G.push({ k: "tipo", v: t, n: t === "video" ? "Solo video" : t === "foto" ? "Solo foto" : "Altri file" });
    Q = h.get("q") || ""; $("cerca").value = Q; disegnaGettoni();
  }

  // ── disegno ──
  function tutto() {
    if (!I) return;
    var c = gColl(), q = norm(Q);
    $("home").hidden = !!(c || q);
    var eps = [];
    if (c && c.indexOf("/") < 0) eps = I.episodi.filter(function (e) { return e.p.indexOf(c + "/") === 0; });
    else if (!c && q) eps = I.episodi.filter(function (e) { return norm(e.p).indexOf(q) >= 0 || norm(titolo(e.p)).indexOf(q) >= 0; });
    $("episodiBox").hidden = !eps.length;
    $("epTitolo").textContent = c && c.indexOf("/") < 0 ? "Episodi · " + c : "Episodi";
    $("epConto").textContent = eps.length ? n(eps.length) : "";
    $("episodi").innerHTML = eps.slice(0, 150).map(function (e) { return locandina(e.p, infoC(e)); }).join("");
    $("selColl").value = c && c.indexOf("/") < 0 ? c : ""; $("selColl").classList.toggle("on", !!c);
    $("selTipo").value = gTipo(); $("selTipo").classList.toggle("on", !!gTipo());
