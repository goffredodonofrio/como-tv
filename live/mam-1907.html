<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como 1907 · Como TV</title>
<!--
  MAM COMO 1907 (Goffredo, 27/09/2026)
  Il materiale del club (QNAP "COMOTV - FRAME", sola lettura): stagioni,
  academy, documentari, i format (Discover Como, Behind the Team, Taste of
  Como…), drone, interviste. NON sono partite, ma si cerca, si sceglie e si
  monta come nel MAM di Como TV:
   - il campo a gettoni (collezione, episodio, cartella, stagione, anno, tipo);
   - i risultati a tessere, TUTTO / VIDEO / FOTO, il pannello FILTRI a colonne;
   - il + sulla tessera e la barra in basso: MONTA QUESTI (una sequenza
     nell'Editing, clip-1907-monta) e SALVA IN RACCOLTA (raccolte 1907, un
     file loro sul ponte). Niente regia.
   - la LINEA DEL TEMPO: stagioni → mesi → cartelle, dal piu' recente. La data
     e' quella delle riprese (nome della cartella, orologio della camera, nome
     del file), NON quella della NAS, che e' il giorno della copia.
  Dati: /como-tv/mam-1907/indice/{indice,file}.json e copertine/;
  miniature e copie leggere dal servizio-1907 (/como-tv/mam-1907/mini/, /copia);
  i file originali: /como-tv/mam-1907/file/ (sola lettura).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&display=swap">
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none!important;}
  :root{color-scheme:dark;--navy:#1B1C20;--navy2:#222327;--pan:#2A2B30;--pan2:#33343A;--riga:rgba(255,255,255,.08);--riga2:rgba(255,255,255,.16);
    --oro:#C9A24B;--oro2:#E3C271;--ivory:#EDEDEE;--ivory2:#C9CACF;--fumo:#8E9096;--ok:#4FCB8B;--blu:#5AA7E8;--rosso:#E5484D;}
  body{font:14px/1.45 'DM Sans',system-ui,sans-serif;font-weight:500;color:var(--ivory);background:var(--navy);min-height:100vh;}
  button,.b{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border-radius:7px;cursor:pointer;
    background:rgba(245,241,230,.05);color:var(--ivory2);border:1px solid var(--riga2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none;}
  button:hover,.b:hover{color:var(--oro2);border-color:var(--oro);}
  button.mini,.b.mini{padding:5px 9px;font-size:10px;}
  button.oro,.b.oro{background:var(--oro);border-color:var(--oro);color:#10131c;} button.oro:hover{color:#10131c;background:var(--oro2);}
  :focus-visible{outline:2px solid var(--oro);outline-offset:2px;}
  a{color:inherit;}
  #libreria{display:flex;flex-direction:column;padding:22px 26px 110px;gap:22px;}
  .lib-testa h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.01em;}
  .lib-testa h1 span{color:var(--oro);}
  .lib-testa p{color:var(--fumo);margin-top:4px;font-size:13px;}
  /* il campo a gettoni del MAM */
  .lib-cerca{position:relative;max-width:820px;}
  .lib-cerca .lu{position:absolute;left:18px;top:27px;transform:translateY(-50%);opacity:.6;font-size:18px;pointer-events:none;z-index:1;}
  .campo-g{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:54px;padding:7px 44px 7px 50px;border-radius:12px;border:1px solid var(--riga2);background:rgba(245,241,230,.06);cursor:text;}
  .campo-g:focus-within{border-color:var(--oro);}
  .campo-g input{flex:1 1 220px;min-width:160px;border:0;background:transparent;padding:8px 2px;font:inherit;font-size:17px;color:var(--ivory);}
  .campo-g input:focus{outline:none;}
  .lib-cerca .via{position:absolute;right:10px;top:27px;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--ivory2);padding:4px 8px;letter-spacing:0;}
  .gt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 6px;border-radius:999px;background:rgba(245,241,230,.1);border:1px solid rgba(245,241,230,.18);font:600 13px/1 'DM Sans',sans-serif;color:var(--ivory);white-space:nowrap;max-width:100%;}
  .gt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;} .gt small{color:var(--fumo);font-weight:500;font-size:12px;}
  .gt button{border:0;background:transparent;color:inherit;opacity:.6;font-size:17px;line-height:1;width:22px;height:22px;border-radius:50%;padding:0;justify-content:center;letter-spacing:0;}
  .gt button:hover{opacity:1;background:rgba(245,241,230,.16);}
  .gt-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--c,var(--oro));margin:0 3px;}
  .gt-mini{width:18px;height:26px;border-radius:3px;background:#111 center/cover;flex:0 0 18px;}
  .gt-av{width:24px;height:24px;border-radius:50%;background:#2c2f3a center 15%/cover no-repeat;flex:0 0 24px;display:inline-grid;place-items:center;font:700 9px/1 'Mazzard',sans-serif;color:var(--oro2);}
  .gt-av-l{width:34px;height:34px;flex-basis:34px;font-size:11px;}
  /* LA SCHEDA DELLA PERSONA nei suggerimenti e in cima ai risultati: la stessa del MAM di Como TV */
  .sugg.con-scheda{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:0;padding:0;max-height:none;overflow:visible;right:auto;width:min(1120px,calc(100vw - 52px));}
  .sugg.con-scheda .sg-lista{padding:6px;max-height:520px;overflow:auto;}
  /* con la scheda aperta la lista va in secondo piano; ci si passa sopra e torna */
  .sugg.con-scheda .sg-lista{opacity:.38;filter:saturate(.4);transition:opacity .2s,filter .2s;}
  .sugg.con-scheda .sg-lista:hover,.sugg.con-scheda .sg-lista:focus-within,.sugg.con-scheda .sg-lista.attiva{opacity:1;filter:none;}
  .sugg .sg-lato{border-left:1px solid var(--riga2);padding:16px 18px;min-width:0;}
  @media (max-width:720px){ .sugg.con-scheda{grid-template-columns:1fr;} .sugg .sg-lato{border-left:0;border-top:1px solid var(--riga2);} }
  .sg{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;}
  .sg-foto{position:relative;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#E3C271,#9c7a2f);
    color:#10131c;display:grid;place-items:center;font:800 26px/1 'Mazzard',sans-serif;overflow:hidden;box-shadow:0 0 0 2px rgba(201,162,75,.55),0 8px 22px rgba(0,0,0,.35);}
  .sg-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:radial-gradient(circle at 50% 35%,#E3C271,#9c7a2f);}
  .sg-testa{min-width:0;display:flex;flex-direction:column;gap:5px;}
  .sg-nome{font:800 22px/1.05 'Mazzard',sans-serif;color:var(--ivory);letter-spacing:.01em;text-wrap:balance;}
  .sg-sq{display:flex;align-items:center;gap:7px;font:600 13px/1.2 'DM Sans',sans-serif;color:var(--ivory2);}
  .sg-stemma{width:20px;height:20px;object-fit:contain;}
  .sg-riga{font-size:12px;color:var(--fumo);line-height:1.4;} .sg-riga b{color:var(--ivory);font-variant-numeric:tabular-nums;}
  .sg-tessere{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px;}
  .sg-t{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:9px 10px 8px;border-radius:9px;border:1px solid var(--riga2);
    background:rgba(245,241,230,.04);color:var(--ivory);cursor:pointer;text-align:left;position:relative;min-width:0;overflow:hidden;font:inherit;letter-spacing:0;text-transform:none;white-space:normal;}
  .sg-t b{font:800 22px/1 'Mazzard',sans-serif;font-variant-numeric:tabular-nums;color:var(--ivory);}
  .sg-t span{display:block;font:700 9.5px/1.25 'Mazzard',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ivory2);min-width:0;white-space:normal;overflow-wrap:break-word;hyphens:auto;}
  .sg-t span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin:0 5px 1px 0;vertical-align:middle;}
  .sg-t:hover,.sg-t:focus-visible{border-color:rgba(201,162,75,.6);outline:none;color:var(--ivory);}
  .sg-t.on{border-color:#C9A24B;background:rgba(201,162,75,.16);}
  .sg-gruppo{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;}
  .sg-gruppo i{font:700 9.5px/1 'Mazzard',sans-serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--fumo);margin-right:4px;min-width:92px;}
  .sg-c{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--riga2);background:transparent;color:var(--ivory2);font:600 12px/1 'DM Sans',sans-serif;cursor:pointer;letter-spacing:0;text-transform:none;}
  .sg-c b{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--fumo);}
  .sg-c:hover{border-color:rgba(201,162,75,.6);color:var(--ivory);} .sg-c.on{border-color:#C9A24B;background:rgba(201,162,75,.16);color:var(--ivory);}
  .sg-azioni{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:12px;}
  .sg-cerca{border:0;border-radius:999px;background:#C9A24B;color:#10131c;padding:10px 18px;font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;}
  .sg-cerca:hover{color:#10131c;background:var(--oro2);}
  .sg-azioni span{font-size:11px;color:var(--fumo);border:1px solid var(--riga2);border-radius:5px;padding:3px 6px;}
  .sg-ris{padding:18px 20px;border:1px solid var(--riga2);border-radius:12px;background:linear-gradient(135deg,rgba(201,162,75,.08),rgba(245,241,230,.02) 60%);}
  .sg-ris .sg-foto{width:104px;height:104px;font-size:30px;}
  .pa-testa{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:800 26px/1.1 'Mazzard',sans-serif;text-transform:uppercase;}
  .pa-stemma{width:44px;height:44px;object-fit:contain;} .pa-ris{color:var(--oro2);font-variant-numeric:tabular-nums;padding:4px 12px;border:1px solid rgba(201,162,75,.45);border-radius:8px;background:rgba(201,162,75,.08);}
  a.sg-c{text-decoration:none;} .sg-ris .sg-nome{font-size:28px;}
  .sg-ris .sg-tessere{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
  /* la scheda della persona (vecchia) */
  .scheda-p{display:flex;gap:22px;align-items:flex-start;padding:18px 20px;border:1px solid var(--riga2);border-radius:12px;background:linear-gradient(135deg,rgba(201,162,75,.10),rgba(245,241,230,.02) 60%);}
  .sp-foto{width:120px;height:120px;border-radius:50%;background:#2c2f3a center 15%/cover no-repeat;flex:0 0 120px;display:grid;place-items:center;font:800 34px/1 'Mazzard',sans-serif;color:var(--oro2);border:2px solid rgba(201,162,75,.5);}
  .sp-corpo{min-width:0;display:flex;flex-direction:column;gap:8px;}
  .sp-eti{font:700 10.5px/1 'Mazzard',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--oro2);}
  .scheda-p h2{font:800 30px/1.05 'Mazzard',sans-serif;}
  .sp-num{color:var(--ivory2);font-size:13px;} .sp-num b{color:var(--ivory);}
  .sp-riga{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .sp-riga i{font:700 9.5px/1 'Mazzard',sans-serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--fumo);min-width:74px;}
  .chip-p{border-radius:999px;padding:6px 10px;font:600 12px/1 'DM Sans',sans-serif;letter-spacing:0;text-transform:none;}
  .chip-p b{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--fumo);margin-left:6px;}
  .chip-p.on{background:rgba(201,162,75,.18);border-color:var(--oro);color:var(--ivory);}
  .sp-nota{color:var(--fumo);font-size:11.5px;}
  @media (max-width:640px){ .scheda-p{flex-direction:column;} .sp-foto{width:88px;height:88px;flex-basis:88px;} }
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:#141826;border:1px solid var(--riga2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;max-height:480px;overflow:auto;}
  .sugg h5{margin:10px 10px 4px;font:700 10px/1 'Mazzard',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--fumo);}
  .sugg h5:first-child{margin-top:6px;}
  .sugg a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ivory);font-size:14px;}
  .sugg a em{font-style:normal;color:var(--fumo);font-size:12.5px;margin-left:6px;}
  .sugg a small{margin-left:auto;color:var(--fumo);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sugg a.on,.sugg a:hover{background:rgba(201,162,75,.14);}
  .sugg a .gt-mini{width:24px;height:36px;flex-basis:24px;}
  .sez{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .sez h2{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);}
  .sez span{font-size:12px;color:var(--fumo);}
  .sez .dx{margin-left:auto;font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--oro2);cursor:pointer;background:none;border:0;padding:0;}
  /* raccolte, come nel MAM */
  .prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px;}
  .prog .pc{background:var(--pan);border:1px solid var(--riga);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ivory);
    font:inherit;letter-spacing:0;text-transform:none;align-items:stretch;white-space:normal;}
  .prog .pc:hover{border-color:var(--oro);color:var(--ivory);} .prog .pc b{display:block;font-size:14px;}
  .prog .pc .rc-n{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--fumo);} .prog .pc .rc-n b{display:inline;font-size:11.5px;color:var(--oro2);font-variant-numeric:tabular-nums;}
  .prog .pc small{color:var(--fumo);font-size:11.5px;}
  .vuota-racc{margin-top:10px;color:var(--fumo);font-size:13px;}
  /* Sfoglia */
  .filtri{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filtri-eti{font-family:'Mazzard',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);margin-right:4px;}
  .filtri select{background:rgba(245,241,230,.06);border:1px solid var(--riga2);color:var(--ivory);border-radius:7px;padding:6px 8px;font:500 12.5px 'DM Sans',sans-serif;max-width:280px;}
  /* locandine */
  .locandine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px;}
  .locandine.riga1{grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);grid-template-columns:none;overflow-x:auto;padding-bottom:8px;}
  .loc{display:flex;flex-direction:column;gap:7px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ivory);font:inherit;letter-spacing:0;text-transform:none;align-items:stretch;white-space:normal;}
  .loc:hover{color:var(--ivory);}
  .loc .poster{aspect-ratio:2/3;border-radius:9px;background:#101114 center/cover no-repeat;border:1px solid var(--riga);transition:transform .15s,border-color .15s;position:relative;overflow:hidden;}
  .loc:hover .poster{transform:translateY(-3px);border-color:var(--oro);}
  .loc .poster .senza{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font:800 15px/1.1 'Mazzard',sans-serif;text-transform:uppercase;color:var(--ivory2);}
  .loc .m{font-size:11.5px;color:var(--fumo);line-height:1.35;}
  .loc .m b{color:var(--ivory);font-weight:700;display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* LA LINEA DEL TEMPO: i mesi, e per ogni mese i servizi a schede come le partite del MAM */
  .tempo{display:flex;flex-direction:column;gap:22px;margin-top:14px;}
  .mese-t{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--riga);margin-bottom:12px;}
  .mese-t b{font:800 20px/1 'Mazzard',sans-serif;text-transform:capitalize;} .mese-t span{color:var(--fumo);font-size:12px;}
  .mese-t button{margin-left:auto;background:none;border:0;padding:0;color:var(--oro2);font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;}
  .srv .mini .eti{position:absolute;left:8px;top:8px;font:700 10.5px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#E3C271;background:rgba(10,15,36,.85);padding:5px 7px;border-radius:4px;}
  .srv .mini .nn{position:absolute;right:8px;bottom:8px;font:600 10.5px/1 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.72);padding:3px 6px;border-radius:4px;}
  .srv .mini .poster-f{position:absolute;inset:0;background:#101114 center 30%/cover no-repeat;filter:brightness(.8);}
  .srv .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 11.5px/1.3 'Mazzard',sans-serif;text-transform:uppercase;letter-spacing:.01em;min-height:2.6em;}
  .srv .fonte{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fumo);border:1px solid var(--riga2);border-radius:3px;padding:1px 4px;margin-left:6px;}
  .senza-g{border:1px solid var(--riga);border-radius:12px;background:var(--pan);}
  .senza-g summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;list-style:none;}
  .senza-g summary::-webkit-details-marker{display:none;}
  .senza-g summary b{font:700 11px/1 'Mazzard',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--oro2);} .senza-g summary span{color:var(--fumo);font-size:12px;}
  .senza-g .griglia{padding:0 16px 16px;}
  /* STAGIONI COME LOCANDINE (Goffredo, 27/09/2026: "verticali le anteprime"): in riga, 2:3, come le collezioni */
  .stagioni{margin-top:12px;}
  .stg{position:relative;aspect-ratio:2/3;border-radius:9px;overflow:hidden;border:1px solid var(--riga);background:#101114;cursor:pointer;padding:0;text-align:center;color:#F5F1E6;
    display:block;font:inherit;letter-spacing:0;text-transform:none;white-space:normal;transition:transform .15s,border-color .15s;}
  .stg .foto{position:absolute;inset:0;background:#000 center 35%/cover no-repeat;opacity:0;transition:opacity .3s;}
  .stg .foto.su{opacity:1;}
  .stg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.8) 72%,#000 92%);pointer-events:none;}
  .stg .logo{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:24px;z-index:1;}
  .stg .dentro{position:absolute;left:10px;right:10px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:1;}
  .stg b{font:800 30px/1 'Mazzard',sans-serif;letter-spacing:-.01em;}
  .stg .eti{font:400 22px/1 'Allura',cursive;color:#F5F1E6;margin-top:2px;}
  .stg small{font-size:11px;color:rgba(245,241,230,.8);margin-top:6px;line-height:1.35;}
  .stg:hover{border-color:var(--oro);transform:translateY(-3px);color:#F5F1E6;} .stg.on{border:2px solid var(--oro);box-shadow:0 0 0 3px rgba(201,162,75,.25);}
  .stg.senza b{font-size:22px;}
  /* L'ANTEPRIMA CHE SCORRE: il provino (6 fotogrammi) segue il mouse */
  .card .mini .foto.provino{background-size:600% 100%;background-repeat:no-repeat;opacity:1;}
  .card .mini .scorri{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:2;display:none;}
  .card .mini .scorri i{display:block;height:100%;width:16.66%;background:var(--oro);}
  .card.provino-su .mini .scorri{display:block;}

  function apriCollezione(p) { var ep = p.indexOf("/") > 0; G = G.filter(function (x) { return x.k === "tipo"; }); metti({ k: ep ? "ep" : "coll", v: p, n: nomeDi(ep ? "ep" : "coll", p) }); window.scrollTo(0, 0); }

  // ══════════ VLC (Goffredo, 27/09/2026: "possibilità di vedere i .mov") ══════════
  //  I .mov del club sono in buona parte ProRes e HEVC 4:2:2: Chrome non li legge e la
  //  VM non ce la fa a convertirli mentre si guardano. Chi ha la NAS montata sul Mac

  var RADICE_NAS = "/Volumes/COMOTV - FRAME";
  try { RADICE_NAS = localStorage.getItem("mam1907-nas") || RADICE_NAS; } catch (e) {}
  function sulMac(via) { return RADICE_NAS.replace(/\/+$/, "") + "/" + via; }

    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    avviso("", "Playlist scaricata: aprila con VLC. Legge dalla NAS montata sul Mac (" + esc(RADICE_NAS) + "). <a href=\"#\" data-cambia-nas=\"1\" style=\"color:var(--oro2)\">La NAS sta altrove?</a>");

  }
  document.addEventListener("click", function (e) { var a = e.target.closest && e.target.closest("[data-cambia-nas]"); if (a) { e.preventDefault(); cambiaNas(); } });
  // PREMIERE (Goffredo, 27/09/2026): una raccolta o una scelta diventa una sequenza per
  // Premiere (XML come quello del MAM di Como TV), con gli originali gia' collegati sulla
  // NAS montata sul Mac. Il servizio-1907 legge durata e formato di ogni file.
  function premiereXml(vie, nome, bottone) {
    var video = vie.filter(function (v) { return tipo(v) === "video"; }).slice(0, 600);
    if (!video.length) { avviso("err", "Niente video da mandare a Premiere."); return; }
    var testo = bottone ? bottone.textContent : ""; if (bottone) { bottone.disabled = true; bottone.textContent = "Preparo l’XML…"; }
    avviso("", "Leggo " + n(video.length) + " file per Premiere: ci vuole circa " + Math.max(1, Math.round(video.length / 5)) + " secondi.");
    fetch(BASE + "premiere", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome: nome, vie: video, radice: RADICE_NAS }) })
      .then(function (r) { if (!r.ok) return r.json().then(function (j) { throw new Error(j.errore || "XML non riuscito"); }); return r.text().then(function (t) { return [t, r.headers.get("X-Quanti")]; }); })
      .then(function (x) {
        var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([x[0]], { type: "application/xml" }));
        a.download = (nome || "como1907").replace(/[^A-Za-z0-9 _.-]+/g, " ").trim().slice(0, 60) + ".xml"; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        avviso("", "XML per Premiere scaricato (" + (x[1] || video.length) + " file): in Premiere File → Importa. I file si agganciano da " + esc(RADICE_NAS) + ". <a href=\"#\" data-cambia-nas=\"1\" style=\"color:var(--oro2)\">La NAS sta altrove?</a>");
      })
      .catch(function (e) { avviso("err", esc(e.message)); })
      .then(function () { if (bottone) { bottone.disabled = false; bottone.textContent = testo; } });
  }
  // PREPARA LE COPIE: le copie leggere di una raccolta o di una scelta si mettono in coda
  // subito, cosi' quando si apre il lettore sono gia' pronte (la VM le fa una alla volta)
  function preparaCopie(vie) {
    var video = vie.filter(function (v) { return tipo(v) === "video"; }).slice(0, 400);
    if (!video.length) { avviso("err", "Niente video da preparare."); return; }
    var fatte = 0;
    video.forEach(function (v) { fetch(BASE + "copia?fai=1&v=" + encodeURIComponent(v), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function () { fatte++; if (fatte === video.length) avviso("", n(video.length) + " copie leggere in coda: la VM le prepara una alla volta, a bassa priorità."); }).catch(function () {}); });
  }

  // ══════════ IL LETTORE ══════════
  // I 4K a 10 bit delle camere il browser non li legge: si guarda la copia
  // leggera (720p) se c'e', e se non c'e' la si chiede al servizio-1907.
  var SEGUI = null;
  function apri(x) {
    var u = url(x.via), dx = (x.tipo === "video" ? '<button data-fa="vlc-uno" title="apre il file originale con VLC dalla NAS montata sul Mac">Apri in VLC</button><button data-fa="percorso-uno" title="il percorso del file sulla NAS, da incollare nel Finder (Vai alla cartella)">Copia percorso</button>' : "") + '<a class="b" href="' + u + '" download>Scarica l’originale</a>' + (x.tipo === "video" ? '<button data-fa="monta-uno" class="oro">Monta questo</button>' : "") + '<button data-fa="scegli-uno">' + (SCELTI.has(x.via) ? "Togli dalla scelta" : "Scegli") + '</button><button id="chiudi">Chiudi</button>';
    var info = '<div class="info"><div><b>' + esc(x.nome) + "</b><br>" + esc(x.d.split("/").join(" › ")) + " · " + gb(x.peso) + (x.data ? " · girato il " + dataRip(x.data) : "") + '</div><div class="dx">' + dx + "</div></div>";
    var schermo;
    if (x.tipo === "foto" && /\.(jpe?g|png|webp)$/i.test(x.via)) schermo = '<div class="schermo"><img src="' + u + '" alt=""></div>';
    else if (x.tipo === "video") schermo = '<div class="schermo" id="schermo"><div class="copia"><b>Preparo l’anteprima…</b></div></div>';
    else schermo = '<div class="schermo" id="schermo"><div class="copia"><b>Anteprima non disponibile</b><span>Questo formato si apre solo scaricandolo.</span></div></div>';
    $("velo").innerHTML = '<div class="lettore" role="dialog" aria-label="' + esc(x.nome) + '">' + schermo + info + "</div>";
    $("velo").hidden = false; $("chiudi").onclick = chiudi;
    $("velo").querySelector('[data-fa="scegli-uno"]').onclick = function () { scegli(x.via); this.textContent = SCELTI.has(x.via) ? "Togli dalla scelta" : "Scegli"; };
    var mu = $("velo").querySelector('[data-fa="monta-uno"]'); if (mu) mu.onclick = function () { monta([x.via], mu, x.nome); };
    var vl = $("velo").querySelector('[data-fa="vlc-uno"]'); if (vl) vl.onclick = function () { apriInVlc([x.via], x.nome); };
    var pc = $("velo").querySelector('[data-fa="percorso-uno"]'); if (pc) pc.onclick = function () { var t = sulMac(x.via); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { avviso("", "Percorso copiato: nel Finder, Vai → Vai alla cartella e incolla."); }).catch(function () { prompt("Il percorso sulla NAS", t); }); };
    if (x.tipo === "video") {
      chiave(x.via).then(function (k) { $("schermo").style.backgroundImage = 'url("' + BASE + "mini/" + k + ".jpg?v=" + encodeURIComponent(x.via) + '")'; });
      guardaCopia(x, false);
    }
  }
  function guardaCopia(x, chiedi) {
    clearTimeout(SEGUI);
    fetch(BASE + "copia?v=" + encodeURIComponent(x.via) + (chiedi ? "&fai=1" : "") + (chiedi === 2 ? "&riprova=1" : ""), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
      var sc = $("schermo"); if (!sc || $("velo").hidden) return;
      if (s.stato === "pronta") { sc.innerHTML = '<video src="' + s.via + '" controls autoplay playsinline preload="metadata"></video>'; return; }
      // intanto si prova l'originale: gli 8 bit il browser li legge
      if (!sc.querySelector("video.orig")) {
        sc.innerHTML = '<video class="orig" src="' + url(x.via) + '" controls playsinline preload="metadata"></video><div class="copia" id="statoCopia" hidden></div>';
        // l'originale non si vede: solo allora si chiede la copia leggera
        var nonVa = function () { var c = $("statoCopia"); if (c && c.hidden) { c.hidden = false; guardaCopia(x, 1); } };
        sc.querySelector("video").addEventListener("error", nonVa);
        sc.querySelector("video").addEventListener("loadeddata", function () { if (this.videoWidth === 0) nonVa(); });
      }
      if (s.stato === "assente") return;
      var c = $("statoCopia"); if (!c) return;
      var pct = Math.round((s.avanzamento || 0) * 100);
      c.innerHTML = "<b>Questo originale il browser non lo legge</b><span>" + (s.stato === "errore" ? "La copia leggera non è riuscita." : s.stato === "lavoro" ? "Sto facendo la copia leggera (720p): " + pct + "%" : /pausa/.test(s.stato) ? "Copia in pausa: c’è una diretta." : "Copia leggera in coda" + (s.davanti ? " (" + s.davanti + " prima)" : "") + ".") +
        "</span>" + (s.stato === "lavoro" ? '<div class="barra-c"><i style="width:' + pct + '%"></i></div>' : "") + '<span style="font-size:12px">Hai la NAS montata sul Mac? <a href="#" data-vlc-ora="1" style="color:var(--oro2)">Aprilo subito in VLC</a>, a piena qualità.</span>' + '<span style="font-size:12px;color:var(--fumo)">Si fa sulla VM, a bassa priorità: un 4K a 10 bit richiede più o meno la sua durata, di più se la macchina è occupata. Puoi chiudere e tornare dopo.</span>' +
        (s.stato === "errore" ? '<button class="mini" id="riprova">Riprova</button>' : "");
      var rp = $("riprova"); if (rp) rp.onclick = function () { guardaCopia(x, 2); };
      var vo = c.querySelector("[data-vlc-ora]"); if (vo) vo.onclick = function (ev) { ev.preventDefault(); apriInVlc([x.via], x.nome); };
      if (s.stato !== "errore") SEGUI = setTimeout(function () { guardaCopia(x, 1); }, 5000);
    }).catch(function () {});
  }
  function chiudi() { clearTimeout(SEGUI); var v = $("velo").querySelector("video"); if (v) v.pause(); $("velo").hidden = true; $("velo").innerHTML = ""; }
  $("velo").addEventListener("click", function (e) { if (e.target.id === "velo") chiudi(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("velo").hidden) chiudi(); });

  // ══════════ PARTENZA ══════════
  fetch(BASE + "indice/copertine/copertine.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : { copertine: [] }; }).catch(function () { return { copertine: [] }; })
    .then(function (c) { (c.copertine || []).forEach(function (v) { COP[v.p] = v; }); return fetch(BASE + "indice/indice.json", { cache: "no-cache" }); })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      I = j; I.episodi = I.episodi || []; I.cartelle = I.cartelle || [];
      I.cartelle.forEach(function (r) {
        CART[r[0]] = [r[1], r[2]]; if (r[2]) STAGIONI[r[2]] = (STAGIONI[r[2]] || 0) + r[4] + r[5];
        var m = r[8] || {}; MD[r[0]] = m; var nf = r[4] + r[5];
        (m.g || []).forEach(function (g) { VOC.gen[g] = (VOC.gen[g] || 0) + nf; });
        if (m.q) VOC.sq[m.q] = (VOC.sq[m.q] || 0) + nf; if (m.c) VOC.comp[m.c] = (VOC.comp[m.c] || 0) + nf; if (m.a) VOC.avv[m.a] = (VOC.avv[m.a] || 0) + nf;
        if (m.cam) VOC.cam[m.cam] = (VOC.cam[m.cam] || 0) + nf; if (m.ct) VOC.ct[m.ct] = (VOC.ct[m.ct] || 0) + nf;
        (m.mo || []).forEach(function (x) { VOC.mo[x] = (VOC.mo[x] || 0) + nf; }); (m.lu || []).forEach(function (x) { VOC.lu[x] = (VOC.lu[x] || 0) + nf; });
      });
      (I.persone || []).forEach(function (p) { PERS[p.id] = p; });
      PART = I.partite || {};
      var datate = I.cartelle.filter(function (r) { return r[1]; }).length;
      $("sotto").textContent = n(I.file) + " file · " + I.collezioni.length + " collezioni · " + n(I.episodi.length) + " episodi · " + gb(I.peso) + " sulla NAS" +
        (I.parziale ? " · indicizzazione in corso" : "") + ". Cerca, guarda, monta.";

      var stg = Object.keys(STAGIONI).sort().reverse(); STAG = stg[0] || "";


      disegnaStagioni(); disegnaAlbero(); disegnaCollezioni(); disegnaHome();
      var soloRacc = location.hash === "#raccolte";
      caricaRaccolte().then(function () { if (soloRacc) { disegnaRaccolte(true); $("raccolteBox").scrollIntoView({ block: "start" }); } });
      if (!soloRacc) { leggiIndirizzo(); vai(); }
    })
    .catch(function () { $("tempo").innerHTML = ""; $("collezioni").innerHTML = '<div class="attesa">L’indice del materiale non è ancora pronto: lo stiamo preparando sulla NAS. Riprova tra qualche minuto.</div>'; });
})();
