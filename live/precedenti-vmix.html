<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precedenti · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  /* la testata e' quella di casa: occhiello, titolo che entra da sinistra,
     filo d'oro sotto. Identica al confronto, cosi' le due grafiche in
     sequenza non sembrano venire da due programmi diversi */
  #eyebrow{position:absolute;left:128px;top:82px;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:.24em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #title{position:absolute;left:125px;top:104px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:76px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #rule{position:absolute;left:128px;top:212px;width:300px;height:3px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.15) 100%);
    transform:scaleX(0);transform-origin:left center;}

  /* ── le due squadre in testa ── */
  .testa{position:absolute;top:262px;width:540px;display:flex;align-items:center;gap:22px;opacity:0;}
  .testa.dx{flex-direction:row-reverse;text-align:right;}
  .testa img{width:96px;height:96px;object-fit:contain;flex:none;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));}
  .testa .tondo{width:92px;height:92px;flex:none;border-radius:50%;background:#243F8A;
    display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:34px;color:#FFF;
    box-shadow:inset 0 0 0 3px rgba(245,241,230,.7), 0 8px 22px rgba(0,0,0,.5);}
  .testa .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:42px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;line-height:1.05;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .testa .sotto{font-family:'DM Sans',sans-serif;font-weight:500;font-size:19px;letter-spacing:.14em;
    color:rgba(245,241,230,.55);text-transform:uppercase;margin-top:6px;white-space:nowrap;}

  /* ── il bilancio dei precedenti, fra i due stemmi ── */
  #bilancio{position:absolute;top:268px;left:50%;width:520px;margin-left:-260px;
    display:flex;justify-content:center;gap:0;opacity:0;}
  #bilancio .voce{flex:1 1 0;text-align:center;}
  #bilancio .cifra{font-family:'Mazzard',sans-serif;font-weight:800;font-size:64px;line-height:1;
    color:#C9A24B;font-variant-numeric:tabular-nums;}
  #bilancio .voce.pari .cifra{color:rgba(245,241,230,.75);}
  #bilancio .eti{font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;letter-spacing:.2em;
    color:rgba(245,241,230,.5);text-transform:uppercase;margin-top:10px;white-space:nowrap;}

  /* ── una riga di precedente ── */
  .prec{position:absolute;left:128px;width:1664px;height:92px;opacity:0;
    border-top:1px solid rgba(245,241,230,.07);}
  .prec .quando{position:absolute;left:0;top:22px;width:420px;}
  .prec .data{font-family:'Mazzard',sans-serif;font-weight:700;font-size:24px;letter-spacing:.06em;
    color:rgba(245,241,230,.8);text-transform:uppercase;white-space:nowrap;}
  .prec .comp{font-family:'DM Sans',sans-serif;font-weight:500;font-size:16px;letter-spacing:.16em;
    color:rgba(245,241,230,.38);text-transform:uppercase;margin-top:5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:420px;}
  .prec .sq{position:absolute;top:26px;font-family:'Mazzard',sans-serif;font-weight:700;font-size:32px;
    letter-spacing:.02em;color:rgba(245,241,230,.6);text-transform:uppercase;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:430px;}
  .prec .sq.vinta{color:#F5F1E6;}
  .prec .sq.casa{right:calc(50% + 120px);text-align:right;}
  .prec .sq.osp{left:calc(50% + 120px);}
  .prec .gol{position:absolute;top:18px;left:50%;width:240px;margin-left:-120px;text-align:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:44px;letter-spacing:.04em;
    color:#C9A24B;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .prec .gol i{font-style:normal;color:rgba(201,162,75,.4);margin:0 12px;}
  .prec.pari .gol{color:rgba(245,241,230,.8);}
  .prec.pari .gol i{color:rgba(245,241,230,.3);}

  /* ── come arrivano: due colonne, una per squadra ── */
  .col{position:absolute;top:262px;width:760px;}
  .col.sx{left:128px;} .col.dx{left:1032px;}
  .col .cima{display:flex;align-items:center;gap:20px;opacity:0;}
  .col .cima img{width:84px;height:84px;object-fit:contain;flex:none;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));}
  .col .cima .tondo{width:80px;height:80px;flex:none;border-radius:50%;background:#243F8A;
    display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:30px;color:#FFF;
    box-shadow:inset 0 0 0 3px rgba(245,241,230,.7);}
  .col .cima .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:40px;
    color:#F5F1E6;text-transform:uppercase;line-height:1.05;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .col .cima .bilancetto{font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;
    letter-spacing:.18em;color:#C9A24B;text-transform:uppercase;margin-top:7px;white-space:nowrap;}

  /* una partita dell'ultima striscia */
  .gara{position:absolute;left:0;width:760px;height:104px;opacity:0;
    border-top:1px solid rgba(245,241,230,.07);}
  .gara .esito{position:absolute;left:0;top:22px;width:50px;height:50px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:26px;color:#0A0F26;}
  .gara .esito.v{background:#C9A24B;}
  .gara .esito.n{background:rgba(245,241,230,.55);}
  .gara .esito.p{background:rgba(229,27,32,.85);color:#F5F1E6;}
  .gara .chi{position:absolute;left:74px;top:20px;right:170px;}
  .gara .avv{font-family:'Mazzard',sans-serif;font-weight:700;font-size:29px;letter-spacing:.02em;
    color:#F5F1E6;text-transform:uppercase;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gara .dove{font-family:'DM Sans',sans-serif;font-weight:500;font-size:15px;letter-spacing:.16em;
    color:rgba(245,241,230,.38);text-transform:uppercase;margin-top:5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .gara .gol{position:absolute;right:0;top:26px;width:160px;text-align:right;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:36px;letter-spacing:.04em;
    color:rgba(245,241,230,.85);font-variant-numeric:tabular-nums;white-space:nowrap;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes rigaIn {
    0%   { opacity:0; transform:translateY(18px); }
    100% { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="eyebrow"></div>
  <div id="title">I PRECEDENTI</div>
  <div id="rule"></div>
  <div id="corpo"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url>
  //   { v:"prec"|"forma",            quale delle due viste
  //     e:"SERIE A · 3ª GIORNATA", t:"I PRECEDENTI",
  //     a:{n:"Lecce", l:"…stemma…"}, b:{n:"Monza", l:"…"},
  //     p:[ {d:"feb 2025", c:"Serie A", ca:"Monza", ga:"0", gb:"0", os:"Lecce", w:0} ],
  //         w: 1 ha vinto la casa · 2 l'ospite · 0 pareggio
  //     fa:[ {r:"V"|"N"|"P", s:"1-0", o:"Monopoli", dv:"in casa", c:"Amichevole"} ],
  //     fb:[ … ] }
  //   Le due viste stanno in un file solo perche' hanno la stessa testata,
  //   gli stessi stemmi e la stessa animazione: separarle vorrebbe dire
  //   tenere allineate a mano due copie della stessa cosa.
  var DEMO = {
    v: "prec", e: "SERIE A · 3ª GIORNATA", t: "I PRECEDENTI",
    a: { n: "Como" }, b: { n: "Inter" },
    p: [
      { d: "mag 2026", c: "Serie A",    ca: "Inter", ga: "1", gb: "2", os: "Como", w: 2 },
      { d: "dic 2025", c: "Serie A",    ca: "Como",  ga: "0", gb: "0", os: "Inter", w: 0 },
      { d: "apr 2025", c: "Serie A",    ca: "Como",  ga: "1", gb: "2", os: "Inter", w: 2 },
      { d: "nov 2024", c: "Serie A",    ca: "Inter", ga: "2", gb: "0", os: "Como", w: 1 },
      { d: "ago 2023", c: "Coppa Italia", ca: "Inter", ga: "3", gb: "1", os: "Como", w: 1 }
    ],
    fa: [
      { r: "V", s: "2-0", o: "Lazio",    dv: "in casa",       c: "Serie A" },
      { r: "N", s: "1-1", o: "Bologna",  dv: "in trasferta",  c: "Serie A" },
      { r: "V", s: "3-1", o: "Genoa",    dv: "in casa",       c: "Serie A" },
      { r: "P", s: "0-2", o: "Juventus", dv: "in trasferta",  c: "Serie A" },
      { r: "V", s: "1-0", o: "Cagliari", dv: "in casa",       c: "Coppa Italia" }
    ],
    fb: [
      { r: "V", s: "5-0", o: "Torino",   dv: "in casa",      c: "Serie A" },
      { r: "V", s: "2-1", o: "Udinese",  dv: "in trasferta", c: "Serie A" },
      { r: "P", s: "1-2", o: "Milan",    dv: "in casa",      c: "Serie A" },
      { r: "N", s: "0-0", o: "Atalanta", dv: "in trasferta", c: "Serie A" },
      { r: "V", s: "4-0", o: "Empoli",   dv: "in casa",      c: "Serie A" }
    ]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      if (!d || !d.a || !d.b) return null;
      var righe = (d.v === "forma") ? ((d.fa || []).length + (d.fb || []).length) : (d.p || []).length;
      return righe ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "PRECEDENTI — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  var FORMA = D.v === "forma";
  document.title = (FORMA ? "COME ARRIVANO " : "PRECEDENTI ") +
                   ((D.a.n || "") + " " + (D.b.n || "")).trim();

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var eb = document.getElementById("eyebrow"); eb.textContent = D.e || "";
  var tt = document.getElementById("title");
  tt.textContent = D.t || (FORMA ? "COME ARRIVANO" : "I PRECEDENTI");
  var rl = document.getElementById("rule");
  if (STILL) { eb.style.opacity = 1; tt.style.clipPath = "inset(0 0 0 0)"; rl.style.transform = "scaleX(1)"; }
  else {
    eb.style.animation = "fadeIn .5s ease .15s forwards";
    tt.style.animation = "wipeIn .7s cubic-bezier(.2,.7,.3,1) .3s forwards";
    rl.style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) .85s forwards";
  }

  // lo stemma se c'e', altrimenti il tondo con le due iniziali: una grafica
  // senza stemma deve restare guardabile, non mostrare un buco
  function faccia(q, grande) {
    if (q.l) return '<img src="' + esc(q.l) + '" onerror="this.style.display=\'none\'">';
    return '<div class="tondo">' + esc(String(q.n || "").slice(0, 2).toUpperCase()) + '</div>';
  }
  function anim(quando) {
    return STILL ? "opacity:1" : "animation:fadeIn .55s ease " + quando + "s forwards";
  }
  function animRiga(i, da) {
    return STILL ? "opacity:1"
      : "animation:rigaIn .5s cubic-bezier(.2,.7,.3,1) " + (da + i * 0.13).toFixed(2) + "s forwards";
  }

  var h = "";

  if (!FORMA) {
    // ── I PRECEDENTI ────────────────────────────────────────────────
    // Il bilancio non si copia da ESPN: la sua stringa ("2-3-0") non dice
    // in che ordine stanno vittorie, pareggi e sconfitte, e sbagliare da
    // che parte sta il 2 vuol dire mandare in onda il contrario. Si conta
    // sulle partite, che sono li'.
    var P = (D.p || []).slice(0, 5);
    var vA = 0, vB = 0, pari = 0;
    P.forEach(function (r) {
      if (!r.w) { pari++; return; }
      var casaEA = String(r.ca || "").toLowerCase() === String(D.a.n || "").toLowerCase();
      var haVintoLaCasa = r.w === 1;
      if (haVintoLaCasa === casaEA) vA++; else vB++;
    });

    h += '<div class="testa sx" style="left:128px;' + anim(1.0) + '">' + faccia(D.a) +
         '<div><div class="nome">' + esc(D.a.n || "") + '</div>' +
         (D.a.s ? '<div class="sotto">' + esc(D.a.s) + '</div>' : "") + '</div></div>';
    h += '<div class="testa dx" style="right:128px;' + anim(1.1) + '">' + faccia(D.b) +
         '<div><div class="nome">' + esc(D.b.n || "") + '</div>' +
         (D.b.s ? '<div class="sotto">' + esc(D.b.s) + '</div>' : "") + '</div></div>';

    h += '<div id="bilancio" style="' + anim(1.2) + '">' +
      '<div class="voce"><div class="cifra">' + vA + '</div><div class="eti">vittorie</div></div>' +
      '<div class="voce pari"><div class="cifra">' + pari + '</div><div class="eti">pareggi</div></div>' +
      '<div class="voce"><div class="cifra">' + vB + '</div><div class="eti">vittorie</div></div>' +
      '</div>';

    var Y0 = 470, PASSO = Math.min(112, Math.floor((1040 - Y0) / Math.max(P.length, 1)));
    P.forEach(function (r, i) {
      var pareggio = !r.w;
      h += '<div class="prec' + (pareggio ? " pari" : "") + '" style="top:' + (Y0 + i * PASSO) + 'px;' +
             animRiga(i, 1.35) + '">' +
        '<div class="quando"><div class="data">' + esc(r.d || "") + '</div>' +
          (r.c ? '<div class="comp">' + esc(r.c) + '</div>' : "") + '</div>' +
        '<div class="sq casa' + (r.w === 1 ? " vinta" : "") + '">' + esc(r.ca || "") + '</div>' +
        '<div class="gol">' + esc(r.ga) + '<i>&ndash;</i>' + esc(r.gb) + '</div>' +
        '<div class="sq osp' + (r.w === 2 ? " vinta" : "") + '">' + esc(r.os || "") + '</div>' +
        '</div>';
    });

  } else {
    // ── COME ARRIVANO ───────────────────────────────────────────────
    function colonna(q, righe, lato, ritardo) {
      var R = (righe || []).slice(0, 5);
      var v = 0, n = 0, p = 0;
      R.forEach(function (g) {
        if (g.r === "V") v++; else if (g.r === "P") p++; else n++;
      });
      var out = '<div class="col ' + lato + '">' +
        '<div class="cima" style="' + anim(ritardo) + '">' + faccia(q) +
        '<div style="min-width:0"><div class="nome">' + esc(q.n || "") + '</div>' +
        '<div class="bilancetto">' + v + "V &middot; " + n + "N &middot; " + p + "P</div></div></div>";
      var Y0 = 190, PASSO = 112;
      R.forEach(function (g, i) {
        var cl = g.r === "V" ? "v" : (g.r === "P" ? "p" : "n");
        out += '<div class="gara" style="top:' + (Y0 + i * PASSO) + 'px;' +
                 animRiga(i, ritardo + 0.25) + '">' +
          '<div class="esito ' + cl + '">' + esc(g.r || "") + '</div>' +
          '<div class="chi"><div class="avv">' + esc(g.o || "") + '</div>' +
            '<div class="dove">' + esc([g.dv, g.c].filter(Boolean).join(" · ")) + '</div></div>' +
          '<div class="gol">' + esc(g.s || "") + '</div>' +
          '</div>';
      });
      return out + "</div>";
    }
    h += colonna(D.a, D.fa, "sx", 1.0);
    h += colonna(D.b, D.fb, "dx", 1.1);
  }

  document.getElementById("corpo").innerHTML = h;

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
