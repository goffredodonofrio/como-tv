<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  /* ── la foto: mezza scena a destra, sfumata nel navy ── */
  #fotobox{position:absolute;right:0;top:0;width:1060px;height:1080px;overflow:hidden;
    opacity:0;transform:translateX(70px);}
  #fotobox img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.82) saturate(1.05);}
  #fotobox .velo{position:absolute;inset:0;
    background:
      linear-gradient(90deg,#0A0F26 0%,rgba(10,15,38,.92) 16%,rgba(10,15,38,.55) 36%,rgba(10,15,38,.16) 62%,rgba(10,15,38,.35) 100%),
      linear-gradient(0deg,rgba(7,11,29,.85) 0%,transparent 34%),
      linear-gradient(180deg,rgba(7,11,29,.6) 0%,transparent 26%);}

  /* ── la colonna del testo ── */
  #kicker{position:absolute;left:130px;top:132px;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:32px;letter-spacing:.2em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #nome{position:absolute;left:126px;top:162px;
    font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;
    font-size:96px;line-height:1.1;color:#C9A24B;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #filo{position:absolute;left:130px;top:292px;width:330px;height:2px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.1) 100%);
    transform:scaleX(0);transform-origin:left center;}
  #sotto{position:absolute;left:130px;top:314px;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:30px;letter-spacing:.12em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;opacity:0;}

  /* ── i contatori ── */
  #numeri{position:absolute;left:130px;top:408px;display:flex;gap:20px;}
  .num{min-width:180px;padding:26px 30px 22px;border-radius:10px;text-align:center;
    border:1px solid rgba(245,241,230,.12);background:rgba(16,23,58,.35);
    opacity:0;transform:translateY(26px);}
  .num .v{font-family:'Mazzard',sans-serif;font-weight:800;font-size:66px;line-height:1;
    color:#C9A24B;font-variant-numeric:tabular-nums;}
  .num .l{margin-top:10px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:17px;
    letter-spacing:.16em;color:#D8D2C2;text-transform:uppercase;}

  /* ── il racconto ── */
  #testo{position:absolute;left:130px;top:632px;width:660px;
    font-size:27px;line-height:1.5;color:#E9E4D6;opacity:0;}
  #punti{position:absolute;left:130px;width:660px;font-size:27px;line-height:1.62;color:#E9E4D6;}
  #punti .p{opacity:0;padding-left:34px;position:relative;}
  #punti .p::before{content:"";position:absolute;left:10px;top:.62em;width:8px;height:8px;
    border-radius:50%;background:rgba(245,241,230,.55);}
  #frase{position:absolute;left:130px;width:680px;
    font-family:'DM Sans',sans-serif;font-weight:500;font-size:28px;line-height:1.45;
    color:#C9A24B;opacity:0;}
  #frase .b{color:#F5F1E6;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes salita { to { opacity:1; transform:translateY(0); } }
  @keyframes daDestra { to { opacity:1; transform:translateX(0); } }
</style>
</head>
<body>

<div id="stage">
  <div id="fotobox" style="display:none"><img id="foto" alt=""><div class="velo"></div></div>
  <div id="kicker"></div>
  <div id="nome"></div>
  <div id="filo"></div>
  <div id="sotto"></div>
  <div id="numeri"></div>
  <div id="testo"></div>
  <div id="punti"></div>
  <div id="frase"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url>
  //   { k:"CESC", n:"Fàbregas", s:"TORNA A BARCELLONA",
  //     st:[["151","PRESENZE"],["42","GOL"],["50","ASSIST"]],
  //     tx:"3 stagioni al Barcellona, dal 2011 al 2014:",
  //     li:["2011-12","2012-13","2013-14"],
  //     fr:"Vince 6 trofei: tra cui 1 Liga (2012-13)",
  //     img:"/loghi/foto-....jpg" }
  var DEMO = {
    k: "CESC", n: "Fàbregas", s: "TORNA A BARCELLONA",
    st: [["151", "PRESENZE"], ["42", "GOL"], ["50", "ASSIST"]],
    tx: "3 stagioni al Barcellona, dal 2011 al 2014:",
    li: ["2011-12", "2012-13", "2013-14"],
    fr: "Vince 6 trofei: tra cui 1 Liga (2012-13)"
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.n) ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "FOCUS — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "FOCUS " + (D.n || "");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();
  function el(id) { return document.getElementById(id); }
  function anima(nodo, css) {
    if (STILL) { nodo.style.opacity = 1; nodo.style.transform = "none"; nodo.style.clipPath = "inset(0 0 0 0)"; }
    else nodo.style.animation = css;
  }

  // testata
  el("kicker").textContent = D.k || "";
  el("nome").textContent = D.n || "";
  el("sotto").textContent = D.s || "";
  anima(el("kicker"), "fadeIn .5s ease .15s forwards");
  anima(el("nome"), "wipeIn .8s cubic-bezier(.2,.7,.3,1) .3s forwards");
  if (STILL) el("filo").style.transform = "scaleX(1)";
  else el("filo").style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) .9s forwards";
  anima(el("sotto"), "fadeIn .5s ease .7s forwards");

  // il nome lungo non deve toccare la foto
  (function () {
    var n = el("nome");
    var largo = n.getBoundingClientRect ? n.scrollWidth : 0;
    if (largo > 720) n.style.fontSize = Math.max(54, Math.floor(96 * 720 / largo)) + "px";
  })();

  // contatori (fino a 3)
  var st = (D.st || []).slice(0, 3);
  var hN = "";
  st.forEach(function (x, i) {
    hN += '<div class="num" style="' +
      (STILL ? "opacity:1;transform:none" : "animation:salita .6s cubic-bezier(.2,.7,.3,1) " + (0.9 + i * 0.15).toFixed(2) + "s forwards") +
      '"><div class="v">' + esc(x[0]) + '</div><div class="l">' + esc(x[1]) + '</div></div>';
  });
  el("numeri").innerHTML = hN;
  if (!st.length) el("numeri").style.display = "none";

  // il racconto scorre verso il basso a seconda di cosa c'e'
  var y = st.length ? 632 : 430;
  if (D.tx) {
    el("testo").textContent = D.tx;
    el("testo").style.top = y + "px";
    anima(el("testo"), "fadeIn .6s ease 1.35s forwards");
    y += 46 + Math.ceil(D.tx.length / 46) * 40;
  } else el("testo").style.display = "none";

  var li = D.li || [];
  if (li.length) {
    var hP = "";
    li.forEach(function (r, i) {
      hP += '<div class="p" style="' +
        (STILL ? "opacity:1" : "animation:fadeIn .45s ease " + (1.5 + i * 0.12).toFixed(2) + "s forwards") +
        '">' + esc(r) + '</div>';
    });
    el("punti").innerHTML = hP;
    el("punti").style.top = y + "px";
    y += li.length * 44 + 26;
  } else el("punti").style.display = "none";

  if (D.fr) {
    // le parentesi in bianco, come nella grafica di riferimento
    el("frase").innerHTML = esc(D.fr).replace(/\(([^)]*)\)/g, '<span class="b">($1)</span>');
    el("frase").style.top = (y + 12) + "px";
    anima(el("frase"), "fadeIn .6s ease " + (1.6 + li.length * 0.12).toFixed(2) + "s forwards");
  } else el("frase").style.display = "none";

  // la foto
  if (D.img) {
    el("fotobox").style.display = "";
    el("foto").src = D.img;
    if (STILL) { el("fotobox").style.opacity = 1; el("fotobox").style.transform = "none"; }
    else el("fotobox").style.animation = "daDestra .9s cubic-bezier(.2,.7,.3,1) .55s forwards";
  }

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
