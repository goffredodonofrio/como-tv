          var o = document.createElement("option");
          o.value = (e.ids && e.ids[0]) || "";
          var p = pesa(e);
          o.textContent = (p === 0 ? "OGGI " : "") + dataOpz(e.quando) + "  " + (e.partita || e.etichetta || "");
          o.dataset.quando = e.quando || "";
          if (p === 2) o.className = "passata";
          o.dataset.titolo = (e.programma ? e.casa : e.casa + "-" + e.ospite);
          o.dataset.comp = e.competizione || "";
          if (el("evento")) el("evento").appendChild(o);
        });
        var sel0 = el("evento"); if (sel0 && sel0.options[0]) sel0.options[0].textContent = "\u2014 " + eventi.length + " eventi: scegli \u2014";
        if (sel0) sel0.addEventListener("change", agganciaFeed);
        // l'evento scelto si ASSEGNA al flusso su cui si sta lavorando: cosi'
        // il flusso "Ingresso 2" diventa "AL HILAL-NEOM" e prende appunti ed ESPN
        if (sel0) sel0.addEventListener("change", function () {
          var o = sel0.selectedOptions[0]; if (!o || !o.value || !REG || REG.arch) return;
          manda({ tipo: "clip-reg-evento", id: REG.id, evento: o.value, titolo: o.dataset.titolo || o.textContent.replace(/^OGGI /, "").replace(/^\S+\s+/, ""), competizione: o.dataset.comp || "" })
            .then(function () { aggiorna(); dice("Evento assegnato al flusso: " + (o.dataset.titolo || ""), true); })
            .catch(function (e) { dice(e.message); });
        });
        if (el("etEvento")) el("etEvento").textContent = "Evento";
        if (sel0 && sel0.options[0]) sel0.options[0].textContent = "\u2014 " + eventi.length + " eventi: assegna al flusso scelto \u2014";
      });
      // il LIVE e' uno strumento da diretta: l'archivio sta nel MAM ARCHIVIO
      // e qui non compare (niente gruppo in tendina, niente ricerca storica)
    } else {
      // MAM ARCHIVIO: UNA lista sola, dalla piu' recente. Ogni partita che
      // Airtable conosce c'e', con il suo stato: il video su S3 (si apre),
      // giocata ma non ancora caricata con Cyberduck (lo dice), ancora da
      // giocare (fondo rosso). Piu' le partite che stanno solo su S3.
      Promise.all([eventiPronti, archivioPronto]).then(function (r) {
        var eventi = r[0], partite = r[1], sel = el("evento"); if (!sel) return;
        // In tendina stanno SOLO le partite intere che hanno il video: niente
        // da giocare, niente pezzi, niente "non ancora su S3" (quelle si
        // trovano in ricerca). Tutte scritte allo stesso modo, dalla piu' recente.
        var perRec = {}; partite.forEach(function (p) { perRec[p.rec] = p; });
        var voci = [], visti = {};
        eventi.forEach(function (e) {
          var rec = (e.ids && e.ids[0]) || "";
          var p = rec ? perRec[rec] : null; if (!p) return;
          visti[rec] = true;
          voci.push({ quando: e.quando, titolo: e.partita || e.etichetta || "", rec: rec, arch: p, futura: false });
        });
        partite.forEach(function (p) {
          if (visti[p.rec]) return;
          voci.push({ quando: p.quando, titolo: p.titolo, rec: p.rec, arch: p, futura: false });
        });
        voci = voci.filter(function (v) { return v.arch && v.arch.intera !== false && Date.parse(v.quando) <= Date.now(); });
        // una cartella S3 con una data nel futuro e' un errore di battitura nel
        // nome (20270729 per 20250729): va in fondo, segnata, non in cima
        voci.forEach(function (v) { if (v.arch && Date.parse(v.quando) > Date.now()) v.sospetta = true; });
        voci.sort(function (x, y) {
          if (!!x.sospetta !== !!y.sospetta) return x.sospetta ? 1 : -1;
          return (Date.parse(y.quando) || 0) - (Date.parse(x.quando) || 0);
        });
        // Airtable a volte ha la stessa partita due volte (due righe per lo
        // stesso giorno e lo stesso nome): in tendina una basta, quella con il video
        var chiaveVoce = function (v) {
          return dataOpz(v.quando) + "|" + String(v.titolo).toUpperCase().replace(/\[[^\]]*\]|\(.*?\)|\b\d+\s*-\s*\d+\b/g, "").replace(/[^A-Z0-9]+/g, " ").trim();
        };
        var tenute = {}, uniche = [];
        voci.forEach(function (v) {
          var k = chiaveVoce(v), g = tenute[k];
          if (!g) { tenute[k] = v; uniche.push(v); return; }
          if (v.arch && (!g.arch || (g.arch.soloS3 && !v.arch.soloS3))) { uniche[uniche.indexOf(g)] = v; tenute[k] = v; }
        });
        voci = uniche;
        var conVideo = 0;
        voci.forEach(function (v) {
          var o = document.createElement("option");
          o.value = v.arch ? "arc:" + v.rec : "ev:" + v.rec;
          conVideo++;
          // una partita si scrive in un modo solo: MAIUSCOLO, SQUADRA-SQUADRA
          var nome = String(v.titolo).toUpperCase().replace(/\s+VS\.?\s+/g, "-").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();
          o.textContent = dataOpz(v.quando) + "  " + nome;
          o.dataset.arch = v.rec; o.dataset.parti = v.arch.pezzi || 1;
          o.dataset.titolo = nome;
          sel.appendChild(o);
        });
        sel.addEventListener("change", function () {
          var o = sel.selectedOptions[0]; if (!o || !o.value || !o.dataset.arch) return;
          // una partita in due file (primo e secondo tempo) entra tutta: prima
          // il secondo tempo in silenzio, poi il primo, che e' quello che si apre
          var parti = +o.dataset.parti || 1, rec = o.dataset.arch, titolo = o.dataset.titolo;
          // fino a tre parti entrano tutte; una serata a otto blocchi apre la prima
          var altre = []; if (parti <= 3) for (var i = parti - 1; i >= 1; i--) altre.push(i);
          if (parti > 3) dice("Evento in " + parti + " parti: apro la prima.");
          var giro = function () {
            if (!altre.length) return apriDaArchivio(rec, null, titolo, 0);
            manda({ tipo: "clip-archivio-apri", rec: rec, pezzo: altre.shift() }).then(giro).catch(function () { giro(); });
          };
          giro();
        });
        if (el("nPartite")) el("nPartite").textContent = conVideo;
        if (sel.options[0]) sel.options[0].textContent = "\u2014 " + voci.length + " partite: scegli \u2014";
        var f = el("eventoCerca");
        if (f) f.addEventListener("input", function () {
          var vis = Array.prototype.filter.call(sel.options, function (o) { return o.value && !o.hidden; }).length;
          sel.options[0].textContent = "\u2014 " + vis + (f.value.trim() ? " trovate" : " partite") + ": scegli \u2014";
        });
      });
    }

    // I FLUSSI, IN ORDINE. Cinquantadue righe in ordine di arrivo non sono un
    // menu: sono un elenco. Si raggruppano per famiglia (gli encoder, i tuner,
    // i canali) e dentro ogni famiglia si ordinano per numero — 2 prima di 11,
    // che l'ordine alfabetico sbaglia. Due flussi con lo stesso nome si
    // distinguono con la coda del loro indirizzo, se no si sceglie a caso.
    manda({ tipo:"clip-sorgenti" }).then(function (dd) {
      var sel = el("sorgente"); if (!sel) return;
      var FAM = [
        [/^SRT-CP9K[- ]?(\d+)/i, "Encoder CP9K"],
        [/^IP[- ]?TUNER[- ]?PRINCE[- ]?(\d+)/i, "IP Tuner"],
        [/^DIBSYS[- ]?(\d+)/i, "DIBSYS"],
        [/^SRT[- ]?(\d+)\b/i, "Canali"],
        [/^HNL[- ]?(\d*)/i, "HNL"]
      ];
      var gruppi = {}, ordine = [];
      (dd.sorgenti || []).forEach(function (x) {
        var fam = "Altri", n = 9999;
        for (var i = 0; i < FAM.length; i++) {
          var m = FAM[i][0].exec(x.nome || "");
          if (m) { fam = FAM[i][1]; n = parseInt(m[1] || "0", 10) || 0; break; }
        }
        if (!gruppi[fam]) { gruppi[fam] = []; ordine.push(fam); }
        gruppi[fam].push({ x: x, n: n });
      });
      // conta quante volte compare ogni nome: solo i doppioni portano la coda
      var quanti = {};
      (dd.sorgenti || []).forEach(function (x) { var k = (x.nome || "") + "|" + x.campo; quanti[k] = (quanti[k] || 0) + 1; });
      ["Encoder CP9K", "IP Tuner", "DIBSYS", "Canali", "HNL", "Altri"].forEach(function (fam) {
        if (!gruppi[fam]) return;
        var g = document.createElement("optgroup");
        g.label = fam + " \u00b7 " + gruppi[fam].length;
        gruppi[fam].sort(function (a, b) { return (a.n - b.n) || String(a.x.nome).localeCompare(String(b.x.nome)); });
        gruppi[fam].forEach(function (v) {
          var x = v.x, o = document.createElement("option");
          var campo = String(x.campo || "").toLowerCase().replace(/preview new/, "preview");
          // la parte dell'indirizzo che DISTINGUE: per un HLS e' la cartella
          // prima del file (index.m3u8 e' uguale per tutti), per un SRT l'host
          var pezzi = String(x.url).replace(/^\w+:\/\//, "").split(/[\/?]/).filter(Boolean);
          var distintivo = pezzi.length > 1 ? pezzi[pezzi.length - 2] : pezzi[0] || "";
          var coda = quanti[(x.nome || "") + "|" + x.campo] > 1
            ? " \u00b7 \u2026" + distintivo.slice(-6) : "";
          o.value = x.url;
          o.textContent = x.nome + "  \u00b7  " + campo + coda + "  \u00b7  " + String(x.tipo || "").toUpperCase();
          g.appendChild(o);
        });
        sel.appendChild(g);
      });
    }).catch(function () {});
    // L'indirizzo a mano serve una volta su venti: sta nascosto finche' non
    // lo si chiede, invece di occupare una riga per sempre.
    el("sorgente").addEventListener("change", function () {
      var mano = this.value === "__mano";
      el("rigaUrl").hidden = !mano;
      el("url").value = mano ? "" : this.value;
      if (mano) el("url").focus();
    });

    function avvia(extra) {
      var ev = el("evento").selectedOptions[0];
      var corpo = { tipo:"clip-avvia", evento: el("evento").value.replace(/^arc:/, ""),
        titolo: (ev && ev.dataset.titolo) || (extra.guarda ? "anteprima" : "senza evento"),
        competizione: (ev && ev.dataset.comp) || "",
        url: el("url").value.trim(),
        sorgente: el("sorgente").value ? el("sorgente").selectedOptions[0].textContent : "a mano" };
      Object.keys(extra).forEach(function (k) { corpo[k] = extra[k]; });
      if (!corpo.url) { corpo.ricevi = true; corpo.sorgente = "in ascolto"; }
      return manda(corpo).then(function (dd) { REG = dd.reg; apertaId = ""; aggiorna(); return dd; });
    }
    el("btnRec").addEventListener("click", function () {
      if (REG && REG.stato === "registra" && !REG.guarda) {
        manda({ tipo:"clip-ferma", id:REG.id }).then(function () { aggiorna(); dice("Registrazione fermata.", true); })
          .catch(function (e) { dice(e.message); });
        return;
      }
      avvia({}).then(function () { dice("Registrazione avviata.", true); }).catch(function (e) { dice(e.message); });
    });
    el("btnRicevi").addEventListener("click", function () {
      avvia({ ricevi:true }).then(function (dd) {
        dice(dd.gia ? "C’è già un ascolto aperto: è questo." : "In ascolto: dai l’indirizzo a chi trasmette.", true);
      }).catch(function (e) { dice(e.message); });
    });
    el("btnGuarda").addEventListener("click", function () {
      if (REG && REG.guarda && REG.stato === "registra") {
        manda({ tipo:"clip-ferma", id:REG.id }).then(function () { REG = null; apertaId = ""; aggiorna(); })
          .catch(function (e) { dice(e.message); });
        return;
      }
      avvia({ guarda:true }).catch(function (e) { dice(e.message); });
    });
    disegnaConsole();
    if (MODO !== "archivio") { aggiornaVivi(true); setInterval(aggiornaVivi, 8000); }
  }

  // Il foglio dei feed di MediaOps dice su quale encoder passa la partita:
  // scelta la partita, la Sorgente si imposta da sola sul main (il backup
  // resta a un clic) e parte l'anteprima. Se il foglio dice "no need
  // cleanfeed" o non la conosce, lo si dice e si lascia fare a mano.
  var FEED_SCELTO = null;
  function opzioneSorgente(sel, url, nome) {
    var o = Array.prototype.find.call(sel.options, function (x) { return x.value === url; });
    if (!o) { o = document.createElement("option"); o.value = url; sel.insertBefore(o, sel.options[1] || null); }
    o.textContent = nome; return o;
  }
  function agganciaFeed() {
    var sel = el("evento"), riga = el("rigaFeed"), nota = el("notaFeed");
    var o = sel && sel.selectedOptions[0];
    if (!o || !o.value || !riga) { if (riga) riga.hidden = true; FEED_SCELTO = null; return; }
    riga.hidden = false; nota.textContent = "cerco la partita nel foglio dei feed\u2026";
    manda({ tipo: "clip-feed-partita", partita: o.dataset.titolo || o.textContent, quando: o.dataset.quando || "" }).then(function (d) {
      var f = d.feed; FEED_SCELTO = f;
      if (!f) { nota.innerHTML = "non \u00e8 nel foglio dei feed: scegli la sorgente a mano, oppure <b>Ricevi</b>."; return; }
      if (f.senzaCleanfeed || !f.mainPronto) {
        nota.innerHTML = "dal foglio: <b>" + (f.source || "nessun cleanfeed") + "</b> \u00b7 nessun feed da prendere: usa <b>Ricevi</b>" + (f.vmix ? " \u00b7 vMix " + f.vmix : "") + ".";
        return;
      }
      var ss = el("sorgente");
      if (f.backupPronto) opzioneSorgente(ss, f.backupPronto, f.source + " \u00b7 backup");
      opzioneSorgente(ss, f.mainPronto, f.source + " \u00b7 main");
      ss.value = f.mainPronto; ss.dispatchEvent(new Event("change"));
      nota.innerHTML = "dal foglio: <b>" + f.source + "</b> \u00b7 main" +
        (f.backupPronto ? " \u00b7 <a href='#' id='usaBackup'>passa al backup</a>" : "") +
        (f.vmix ? " \u00b7 vMix " + f.vmix : "") + (f.vmixItaly ? " \u00b7 " + f.vmixItaly : "") + (f.passphrase ? " \u00b7 con passphrase" : "");
      var ub = el("usaBackup");
      if (ub) ub.addEventListener("click", function (e) {
        e.preventDefault(); ss.value = f.backupPronto; ss.dispatchEvent(new Event("change"));
        nota.innerHTML = "dal foglio: <b>" + f.source + "</b> \u00b7 <b>backup</b>" + (f.vmix ? " \u00b7 vMix " + f.vmix : "");
        if (REG && REG.guarda && REG.stato === "registra") { el("btnGuarda").click(); setTimeout(function () { el("btnGuarda").click(); }, 800); }
        else dice("Sorgente: backup di " + f.source + ".", true);
      });
      // niente anteprima automatica: il montatore sceglie lui quando guardare
      // (il flusso, di norma, lo spinge MCR e sta gia' fra quelli in arrivo)
    }).catch(function (e) { nota.textContent = "foglio dei feed non raggiungibile: " + e.message; });
  }

  // "Scelgo la partita e tac, appare": il MAM prova tutte le sorgenti e
  // mostra quelle che trasmettono adesso; un clic e la vedi nel monitor
  function aggiornaVivi(subito) {
    var box = el("vivi"); if (!box) return;
    manda({ tipo: "clip-flussi-vivi", subito: !!subito }).then(function (d) {
      var vivi = d.vivi || [];
      if (!vivi.length) {
        box.innerHTML = "<span class='nota'>" + (d.inCorso ? "cerco i flussi che trasmettono\u2026" : "nessun flusso in onda adesso") + "</span>";
        return;
      }
      var scelto = el("sorgente") ? el("sorgente").value : "";
      box.innerHTML = "";
      vivi.forEach(function (v) {
        var f = document.createElement("div"); f.className = "flusso" + (v.url === scelto ? " scelto" : "");
        f.title = v.nome + " \u00b7 " + v.tipo.toUpperCase() + " \u00b7 clicca: lo vedi nel monitor";
        f.innerHTML = (v.mini ? "<img src='" + BASE + v.mini + "?t=" + (d.quando || 0) + "' alt=''>" : "") + "<span>" + v.nome + "</span>";
        f.addEventListener("click", function () {
          var sel = el("sorgente"); if (!sel) return;
          var o = Array.prototype.find.call(sel.options, function (x) { return x.value === v.url; });
          if (!o) { o = document.createElement("option"); o.value = v.url; o.textContent = v.nome + " \u00b7 " + v.tipo.toUpperCase(); sel.appendChild(o); }
          sel.value = v.url; sel.dispatchEvent(new Event("change"));
          document.querySelectorAll("#vivi .flusso").forEach(function (x) { x.classList.toggle("scelto", x === f); });
          // si guarda subito, senza registrare: e' il "tac"
          if (el("btnGuarda") && !(REG && REG.guarda && REG.stato === "registra")) el("btnGuarda").click();
          else dice("Sorgente scelta: " + v.nome + ".", true);
        });
        box.appendChild(f);
      });
    }).catch(function () {});
  }

  function disegnaConsole() {
    if (!el("cTesto")) return;
    var dot = el("cDot"), t = el("cTesto"), coda = el("cCoda");
    if (!REG) { dot.className = "dot"; t.textContent = "Nessuna registrazione"; coda.textContent = ""; }
    else {

      t.textContent = (vivo ? (REG.attesa ? "In ascolto · " : REG.guarda ? "Guarda · non registra · " : "Registra · ")
                            : REG.stato + " · ") + REG.titolo;

                                                              : "Flusso in arrivo sulla porta " + REG.ascolto.porta + " \u00b7 " + orologio(REG.durata)) + "</span>" +

    // segni
    var m = el("segniCol");
    if (m) {
      var segni = (REG && REG.marker) || [];
      m.innerHTML = segni.length
        ? '<h2 style="margin-top:16px">Segni <span>' + segni.length + '</span></h2>' : "";
      segni.forEach(function (x) {
        var v = document.createElement("div"); v.className = "voce";
        v.innerHTML = "<div class='testo'><div class='nome'>" + orologio(x.secondi) + " · " +
          (x.testo || x.tipo || "segno") + "</div></div>";
        var a2 = document.createElement("a"); a2.href = "#"; a2.textContent = "vai";
        a2.addEventListener("click", function (e) { e.preventDefault(); seguiLive = false;
          if (el("player")) el("player").currentTime = x.secondi; });
        v.appendChild(a2); m.appendChild(v);
      });
    }

  }

  // TOGLIERE UNA CLIP.
  //
  //  Due passi, non uno: "elimina" diventa "sicuro?" e solo il secondo click
  //  cancella. Un file video non torna indietro, e in una griglia di
  //  francobolli tutti uguali il dito sbaglia bersaglio facilmente.
  //
  //  Serve la chiave di REGIA, non quella di lavoro: tagliare e guardare li
  //  puo' fare chiunque, buttare no. Se non ce l'hai in tasca te la chiede
  //  al momento, invece di dirti solo che non si puo'.
  function elimina(id, quando) {
    manda({ tipo: "clip-elimina", clip: id })
      .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
      .catch(function (e) {
        if (!/chiave/i.test(e.message)) { dice(e.message); return; }
        var k = window.ChiaveComoTV ? ChiaveComoTV.valore("comando",
          "Per eliminare una clip serve la chiave di COMANDO della regia.\n\n" +
          "Tagliare e guardare li puo' fare chiunque; buttare no.") : "";
        if (!k) { dice("Serve la chiave di comando della regia."); return; }
        TOKEN = k;
        manda({ tipo: "clip-elimina", clip: id })
          .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
          .catch(function (e2) { dice(e2.message); });
      });
  }
  // il tasto che si trasforma in domanda invece di aprire una finestra
  function tastoElimina(id, dopo) {
    var a = document.createElement("a");
    a.href = "#"; a.textContent = "elimina"; a.className = "togli";
    var chiesto = false, torna = null;
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (!chiesto) {
        chiesto = true; a.textContent = "sicuro?"; a.classList.add("sicuro");
        torna = setTimeout(function () {
          chiesto = false; a.textContent = "elimina"; a.classList.remove("sicuro");
        }, 4000);
        return;
      }
      clearTimeout(torna);
      a.textContent = "…";
      elimina(id, dopo);
    });
    return a;
  }

  function voceClip(x) {
    var v = document.createElement("div"); v.className = "voce";
    v.innerHTML = (x.mini ? "<img class='minivoce' src='" + BASE + x.mini + "' alt=''>" : "") +
      "<div class='testo'><div class='nome'>" + x.titolo + "</div><div class='dett'>" +
      x.formato + " · " + (x.durataVera || x.durata) + "s" + (x.peso ? " · " + peso(x.peso) : "") +
      (x.stato === "lavora" ? " · in lavorazione" : "") + (x.stato === "errore" ? " · errore" : "") + "</div></div>";
    if (x.stato === "pronta") {
      var url = BASE + "/clip/_clip/" + x.id + ".mp4";
      var az = document.createElement("div"); az.className = "azioni";
      var g = document.createElement("a");

  // ── viste d'archivio ────────────────────────────────────────────
  // Il progetto, come in Premiere: il MATERIALE (la partita), le SEQUENZE,

  function tuttoIlMateriale() {

  function assetVisibili() {

        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
        if (f !== FORMA) return false;

    tuttoIlMateriale().forEach(function (a) {
      if (FORMA) {
        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");

    lista.forEach(function (a, i) {

      // IL FOTOGRAMMA. Una griglia di rettangoli vuoti non e' un archivio:

      var mini = a.o.mini ? BASE + a.o.mini : "";
      var urlAnte = (a.t === "clip" && a.o.stato === "pronta") ? BASE + "/clip/_clip/" + a.o.id + ".mp4"

      var badge = a.t === "partita"
        ? '<span class="badge" title="materiale"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M2 6h12M2 10h12M5 3v10M11 3v10"/></svg></span>'
        : a.t === "hl" ? '<span class="badge" title="sequenza"><svg viewBox="0 0 16 16"><path d="M2 5h5v6H2zM9 5h5v6H9zM7 8h2"/></svg></span>' : "";
      d.innerHTML = "<div class='mini" + (fmt === "9:16" ? " v" : fmt === "3:4" ? " q" : "") + "'>" +
        (mini ? "<img class='telo' src='" + mini + "' alt='' draggable='false'>" : "<span class='telo'></span>") +
        (urlAnte ? "<video class='anteprima' muted preload='none' playsinline></video><span class='cursorino'></span>" : "") +
        badge + "<span class='formato'>" + fmt + "</span>" +
        "<span class='durata'>" + dur + "</span>" +
        "<span class='fonte'>" + (a.t === "hl" ? "sequenza" : a.t === "partita" ? "partita" : (a.o.tipo || "clip")) + "</span></div>" +
        "<div class='testo'><div class='nome'>" + nome + "</div><div class='sotto'>" +
        (a.t === "hl" ? (a.o.pezzi || []).length + " pezzi · " + dur : dur + " · " + fmt) + "</div></div>";
      // HOVER SCRUB, come nel bin di Premiere: si scorre la clip passandoci
      // sopra, senza aprirla. Il video si carica solo alla prima passata.
      if (urlAnte) {

        // Su un file da sette giga che sta su S3 ogni salto costa mezzo

  // ── il pannello: linguette, percorso, ricerca, barra ──

  // Sotto la griglia, i dati di quello che hai scelto. Il video non ci sta

  function schedaSotto(a) {

        var az = document.createElement("div"); az.className = "azioni";

        tasto("+fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori + 1 }); });
        tasto("−fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori - 1 }); });

            .then(function (d) { SEQ = d.seq; destraMateriale();
              dice("Orologio tarato di " + d.seq.scarto + "s: si sono spostati tutti.", true); })
            .catch(function (e) { dice(e.message); });
        }, "l’azione è dove sta il visore adesso: sposta tutti gli altri della stessa quantità");
        tasto("togli", function () { ritocca({ pezzo:x.id, togli:1 }); });
        v.appendChild(az);
        corpo.appendChild(v);
      });

      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      az2.innerHTML = '<button class="b oro" id="hlMp4">Esporta MP4</button>' +
                      '<button class="b" id="hlXml">Per Premiere</button>';
      corpo.appendChild(az2);
      if (q.export && q.export.stato === "pronto") {
        var g1 = document.createElement("div"); g1.className = "aiuto";
        g1.innerHTML = '<a href="' + BASE + q.export.file + '?scarica=1">scarica il video (' +
                       q.export.formato + ", " + orologio(q.export.durata) + ")</a>";
        corpo.appendChild(g1);
      }
      if (q.export && q.export.stato === "lavora") {
        var g2 = document.createElement("div"); g2.className = "aiuto";
        g2.textContent = "esporto… " + q.export.fatti + "/" + q.export.quanti;
        corpo.appendChild(g2);
      }
      if (q.premiere) {
        var g3 = document.createElement("div"); g3.className = "aiuto";
        g3.innerHTML = '<a href="' + BASE + q.premiere.file + '?scarica=1">scarica l’XML per Premiere</a>';
        corpo.appendChild(g3);
      }
      el("hlMp4").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, formato:formato })
          .then(function () { dice("Esporto il video in " + formato + "…", true); })
          .catch(function (e) { dice(e.message); });
      });
      el("hlXml").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, come:"premiere" })
          .then(function (d) { SEQ.premiere = d.premiere; destraMateriale();
            dice(d.premiere.integrale ? "XML pronto." :
                 "XML pronto, ma manca l’integrale: in Premiere andrà ricollegato.", true); })
          .catch(function (e) { dice(e.message); });
      });
      return;
    }

    var o = a.o;
    corpo.innerHTML = "<table class='dati'>" +
      "<tr><td>Nome</td><td>" + (o.titolo || "Integrale") + "</td></tr>" +
      (a.t === "clip" ? "<tr><td>Formato</td><td>" + o.formato + "</td></tr>" : "") +
      "<tr><td>Durata</td><td>" + (a.t === "clip" ? (o.durataVera || o.durata) + "s" : orologio(o.durata)) + "</td></tr>" +
      (o.peso || o.integralePeso ? "<tr><td>Peso</td><td>" + peso(o.peso || o.integralePeso) + "</td></tr>" : "") +
      (o.minuto ? "<tr><td>Minuto</td><td>" + o.minuto + "</td></tr>" : "") +
      (o.chi ? "<tr><td>Chi</td><td>" + o.chi + "</td></tr>" : "") +
      "</table>";
    if (a.t === "clip") {
      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      var g = document.createElement("a");
      g.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(o.titolo);
      g.target = "_blank"; g.rel = "noopener";
      g.innerHTML = '<button class="b oro">Grafica social</button>';
      var s2 = document.createElement("a"); s2.href = url + "?scarica=1";
      s2.innerHTML = '<button class="b">Scarica</button>';
      az2.appendChild(g); az2.appendChild(s2); corpo.appendChild(az2);
      var az3 = document.createElement("div"); az3.style.marginTop = "10px";
      var t = tastoElimina(o.id, function () { ASSET = 0; });
      t.className = "togli grande";
      az3.appendChild(t); corpo.appendChild(az3);
    }
  }

  // ── cercare ─────────────────────────────────────────────────────
  //
  //  La ricerca non e' una linguetta in piu': quando c'e' una domanda nella
  //  barra, la colonna centrale risponde a quella e basta. Si svuota la
  //  barra e si torna esattamente dov'eravamo.
  var RIS = null, vistaPrima = "live", attesaCerca = 0;

  function cerca(q) {
    manda({ tipo: "clip-cerca", q: q, limite: 150 }).then(function (d) {
      RIS = d; disegnaRisultati();
    }).catch(function (e) { dice(e.message); });
  }

  // Il secondo di un appunto e' una stima finche' il cronometro non e' stato
  // letto dal video: l'orario ufficiale sbaglia il fischio di un minuto e la
  // ripresa di cinque. La prima volta che si apre un'azione di quella
  // partita il server legge tre fotogrammi (un minuto circa); da li' in poi
  // ogni minuto degli appunti cade al secondo, e i risultati lo dicono.
  // OGNI COSA CHE SUCCEDE IN CAMPO HA IL SUO COLORE. Un gol non e' un
  // cartellino, e chi scorre cento righe deve vederlo prima di leggerlo.
  var TIPI_COLORE = [
    [/autogol|own goal/i, "autogol", "Autogol"],
    [/rigore sbagliato|penalty.*(missed|saved)/i, "rigsb", "Rigore sbagliato"],
    [/rigore|penalty/i, "rigore", "Rigore"],
    [/annullato|var\b/i, "var", "VAR"],
    [/gol|goal|rete/i, "gol", "Gol"],
    [/palo|traversa|legno/i, "palo", "Palo"],
    [/parata|paraton|miracolo/i, "parata", "Parata"],
    [/espuls|rosso/i, "rosso", "Espulsione"],
    [/ammoni|giallo|cartellino/i, "giallo", "Ammonizione"],
    [/sostituzione|cambio/i, "cambio", "Cambio"],
    [/skill|giocata|dribbling|tunnel|tacco/i, "skill", "Giocata"],
    [/occasione|chance|tiro|conclusion|punizione|contropiede|assist/i, "occasione", "Occasione"]
  ];
  function tipoChip(tipo, testo) {
    var t = String(tipo || "") + " " + String(testo || "").slice(0, 90);
    for (var i = 0; i < TIPI_COLORE.length; i++) {
      if (TIPI_COLORE[i][0].test(t)) return "<span class='tipo t-" + TIPI_COLORE[i][1] + "'>" + TIPI_COLORE[i][2] + "</span>";
    }
    return tipo ? "<span class='tipo t-altro'>" + pulito(tipo) + "</span>" : "";
  }

  function conCronometro(a, poi) {
    if (!a.archivio || a.orologio) return poi(a.dove);
    dice("Leggo il cronometro della partita\u2026 (circa un minuto)");
    manda({ tipo: "clip-archivio-orologio", rec: a.rec, tempo: a.tempo, d: a.d })
      .then(function (r) {
        a.orologio = true;
        if (r.dove || r.dove === 0) { a.dove = r.dove; a.pezzo = r.pezzo || 0; }
        dice("Cronometro letto" + (r.orologio && r.orologio.verificato ? " e verificato" : "") + ".", true);
        poi(a.dove);
        // le altre azioni della stessa partita si ricalcolano: la ricerca si rifa' da sola
        var q = el("projCerca") ? el("projCerca").value.trim() : "";
        if (q) cerca(q);
      })
      .catch(function (e) { dice("Cronometro non letto (" + e.message + "): vado a stima."); poi(a.dove); });
  }

  function disegnaRisultati() {
    var c = el("risultati"); if (!c) return; c.innerHTML = "";
    var box = document.createElement("div"); box.className = "risultati"; c.appendChild(box);
    if (!RIS || RIS.vuota) { box.innerHTML = '<div class="vuoto">Scrivi che cosa cerchi.</div>'; return; }

    // far vedere COME e' stata capita la domanda: se sbaglia, si vede subito
    var q = RIS.domanda || {}, letta = [];
    (q.parole || []).forEach(function (p) { letta.push("<em>" + p + "</em>"); });
    if (q.formato) letta.push("<em>formato " + q.formato + "</em>");
    if (q.genere) letta.push("<em>" + q.genere + "</em>");
    if (q.quando) {
      var mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
                  "agosto","settembre","ottobre","novembre","dicembre"];
      letta.push("<em>" + (q.quando.giorno || "") + " " +
                 (q.quando.mese >= 0 ? mesi[q.quando.mese] : "") + " " + (q.quando.anno || "") + "</em>");
    }
    var l = document.createElement("div"); l.className = "letta";
    l.innerHTML = "Cerco: " + letta.join(" ") + " · " + RIS.quante + " risultati";
    box.appendChild(l);

    if (!RIS.quante) { box.innerHTML += '<div class="vuoto">Niente. Prova con meno parole.</div>'; return; }

    // Ogni famiglia di risultati ha un colore suo, e ce l'ha dappertutto:
    // il quadratino nell'intestazione, il conto, il filetto a sinistra delle
    // righe. Cosi' si capisce da dove viene una riga senza leggerla.
    var famiglia = "";
    function titolo(t, n, fam) {
      famiglia = fam || "";
      var h = document.createElement("h3");
      h.className = "fam " + (fam ? "fam-" + fam : "");
      h.innerHTML = "<i class='bollo'></i>" + t + " <b>" + n + "</b>";
      box.appendChild(h);
    }
    function riga(nome, dett, coda, quando) {
      var v = document.createElement("div"); v.className = "voce cliccabile" + (famiglia ? " fam-" + famiglia : "");
      v.innerHTML = "<div class='testo'><div class='nome'>" + nome + "</div>" +
                    "<div class='dett'>" + dett + "</div></div>" +
                    (quando ? "<span class='quando2'>" + quando + "</span>" : "") +
                    (coda ? "<a href='#'>" + coda + "</a>" : "");
      box.appendChild(v); return v;
    }
    function data(ms) {
      if (!ms) return "";
      var d = new Date(ms);
      return ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2);
    }

    if (RIS.partite.length) {
      titolo("Partite registrate", RIS.partite.length, "partite");
      RIS.partite.forEach(function (r) {
        riga(r.titolo, (r.competizione || "senza competizione") + " · " + orologio(r.durata) +
             " · " + (r.quanteClip || 0) + " clip", "apri", data(r.avviata))
          .addEventListener("click", function () { vaiA(r.id, null, "tutto"); });
      });
    }
    if (RIS.clip.length) {
      titolo("Clip e sequenze", RIS.clip.length, "clip");
      RIS.clip.forEach(function (c) {
        riga(c.titolo, (c.seq ? c.pezzi + " pezzi · sequenza" : c.formato + " · " +
             (c.durataVera || c.durata) + "s") + (c.partita ? " · " + c.partita : ""),
             "vedi", data(c.creata))
          .addEventListener("click", function () { vaiA(c.reg, null, c.seq ? "hl" : "clip"); });
      });
    }
    // Le partite dell'archivio trovate per nome: si aprono nella Sorgente.
    if (RIS.archivio && RIS.archivio.length && MODO === "archivio") {
      titolo("Partite in archivio", RIS.archivio.length, "archivio");
      RIS.archivio.forEach(function (a) {
        riga(a.partita, (a.competizione || "") + (a.pezzi > 1 ? " \u00b7 " + a.pezzi + " parti" : "") +
             (a.soloS3 ? " \u00b7 senza appunti" : ""), "apri", data(Date.parse(a.quando)))
          .addEventListener("click", function () { apriDaArchivio(a.rec, null, a.partita, 0); });
      });
    }
    // Le azioni scritte dai giornalisti nelle partite passate. Quasi
    // sempre il video non e' qui: la riga dice dove andarlo a prendere —
    // quale partita, quale minuto. Quando invece la registrazione c'e',
    // la riga si apre come tutte le altre.
    if (RIS.azioni && RIS.azioni.length) {
      titolo("Azioni \u00b7 appunti e fatti ESPN", RIS.azioni.length, "azioni");
      RIS.azioni.forEach(function (a) {
        // una registrazione locale vale solo se COPRE l'azione: tre minuti di
        // prova con lo stesso evento non sono la partita
        var qui = REGISTRAZIONI.filter(function (x) { return x.evento === a.rec && (!a.dove || (x.durata || 0) >= a.dove + 5); })[0];
        var inArchivio = a.archivio && a.dove;
        // a colpo d'occhio: DA DOVE viene la riga (chip della fonte) e QUANTO
        // e' precisa (verde al secondo, ambra a stima)
        var chipFonte = a.fonte === "espn" ? "<span class='chip fonte espn'>ESPN</span>"
                      : "<span class='chip fonte " + (a.fonte === "storico" ? "storico" : "appunti") + "'>APPUNTI</span>";
        var chipTipo = tipoChip(a.tipo, a.testo);
        var chipVoce = a.telecronista ? "<span class='chip chi' title='telecronaca di " + a.telecronista + "'>\ud83c\udf99 " + a.telecronista + "</span>" : "";
        var chipRating = a.rating ? "<span class='chip voto v" + a.rating + "' title='voto della redazione a questo gol'>\u2605 " + a.rating + "</span>" : "";
        var chipPrec = inArchivio ? (a.orologio ? "<span class='chip prec sec' title='minuto convertito con il cronometro letto dal video'>\u23f1 al secondo</span>"
                                                : "<span class='chip prec stima' title='minuto convertito dall\u2019orario ufficiale: pu\u00f2 sbagliare di qualche minuto'>\u2248 a stima</span>") : "";
        var v = riga(chipTipo + (a.hl ? "<span class='stella'>\u2605</span> " : "") + pulito(a.testo || a.tipo || ""),
             chipFonte + chipRating + chipVoce + chipPrec +
             "<span class='dove'>" + a.partita + "</span>" +
             "<span class='sep2'>\u00b7</span>" + (a.tempo === 2 ? "2\u00ba T " : a.tempo === 1 ? "1\u00ba T " : "") + a.minuto +
             (a.dove ? "<span class='sep2'>\u00b7</span><span class='tc'>" + orologio(a.dove) + "</span>" : "") +
             (a.competizione ? "<span class='sep2'>\u00b7</span>" + a.competizione : ""),
             qui ? "VAI" : (inArchivio ? "VAI" : ""), data(Date.parse(a.quando)));
        v.classList.add("azione");
        v.classList.add("fonte-" + (a.fonte || "appunti"), inArchivio ? (a.orologio ? "al-secondo" : "a-stima") : "senza-video");
        // l'azione, non la partita: un tasto la mette dritta in sequenza
        if (inArchivio || qui) {
          var tl = document.createElement("a"); tl.href = "#"; tl.className = "inTimeline"; tl.textContent = "\u2192 timeline";
          tl.title = "mette questa azione nella sequenza (8 secondi prima, 8 dopo)";
          tl.addEventListener("click", function (e) {
            e.preventDefault(); e.stopPropagation();
            conCronometro(a, function () {
            var finisci = function () {
              if (!REG) return;
              var d0 = Math.max(0, (a.dove || 0) - 8), f0 = (a.dove || 0) + 8;
              var corpo = { tipo: "clip-hl-inserisci", reg: REG.id, dentro: d0, fuori: f0, titolo: (a.testo || a.tipo || "azione") + " \u00b7 " + a.minuto };
              ricorda();
      if (SEQ && SEQ.reg === REG.id) corpo.seq = SEQ.id;
              manda(corpo).then(function (r) { SEQ = r.seq; disegnaSequenza(); destraMateriale(); dice("In sequenza: " + (a.testo || a.tipo) + ".", true); })
                .catch(function (er) { dice(er.message); });
            };
            if (qui && REG && REG.id === qui.id) finisci();
            else if (qui) { vaiA(qui.id, null, "tutto"); setTimeout(finisci, 600); }
            else { manda({ tipo: "clip-archivio-apri", rec: a.rec, pezzo: a.pezzo || 0 }).then(function (d) { return aggiorna().then(function () { vaiA(d.reg.id, null, "tutto"); setTimeout(finisci, 600); }); }).catch(function (er) { dice(er.message); }); }
            });
          });
          v.appendChild(tl);
        }
        if (qui) v.addEventListener("click", function () { vaiA(qui.id, null, "tutto"); });
        else if (inArchivio) {
          v.addEventListener("click", function () {
            conCronometro(a, function (dove) { apriDaArchivio(a.rec, dove, a.partita, a.pezzo); });
          });
        } else {
          v.style.opacity = ".78";
          v.addEventListener("click", function () { apriAppunti(a.rec); });
        }
      });
    }
    // Le frasi dette in telecronaca: si vedono come FRASI — virgolette,
    // corsivo, il microfono — perche' non sono azioni scritte da qualcuno,
    // sono parole sentite: si apre il video nel punto in cui sono state dette.
    if (RIS.dette && RIS.dette.length) {
      titolo("Detto in telecronaca", RIS.dette.length, "voce");
      RIS.dette.forEach(function (m) {
        var v = riga("\u201c" + m.testo + "\u201d",
                     "<span class='chip fonte voce'>\ud83c\udf99 " + (m.telecronista || "TELECRONACA") + "</span><span class='chip prec sec'>\u23f1 al secondo</span>" + m.partita + " \u00b7 " + orologio(m.secondi),
                     "VAI", data(m.quando));
        v.classList.add("detta");
        var tl = document.createElement("a"); tl.href = "#"; tl.className = "inTimeline"; tl.textContent = "\u2192 timeline";
        tl.title = "mette questo passaggio nella sequenza (8 secondi prima, 8 dopo)";
        tl.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          var finisci = function () {
            if (!REG) return;
            var corpo = { tipo: "clip-hl-inserisci", reg: REG.id, dentro: Math.max(0, m.secondi - 8), fuori: m.secondi + 8, titolo: "\u201c" + m.testo.slice(0, 40) + "\u201d" };
            ricorda();
      if (SEQ && SEQ.reg === REG.id) corpo.seq = SEQ.id;
            manda(corpo).then(function (r) { SEQ = r.seq; disegnaSequenza(); destraMateriale(); dice("In sequenza: \u201c" + m.testo.slice(0, 40) + "\u201d", true); })
              .catch(function (er) { dice(er.message); });
          };
          if (REG && REG.id === m.reg) finisci(); else { vaiA(m.reg, null, "tutto"); setTimeout(finisci, 600); }
        });
        v.appendChild(tl);
        v.addEventListener("click", function () { vaiA(m.reg, m.secondi, "tutto"); });
      });
    }
    // VICINI PER SIGNIFICATO. Non contengono le parole cercate: vogliono dire
    // la stessa cosa. Si mostrano dopo, con quanto sono vicini, perche' chi
    // cerca deve sapere che qui il MAM sta interpretando, non trovando.
    if (RIS.vicini && RIS.vicini.length) {
      titolo("Vicini per significato", RIS.vicini.length, "vicini");
      RIS.vicini.forEach(function (a) {
        if (a.fonte === "voce") {
          var vv = riga("\u201c" + a.testo + "\u201d",
            "<span class='chip fonte voce'>\ud83c\udf99 " + (a.telecronista || "TELECRONACA") + "</span>" +
            "<span class='chip vicino'>" + Math.round(a.vicinanza * 100) + "%</span>" + a.partita + " \u00b7 " + orologio(a.secondi),
            "VAI", data(a.quando));
          vv.classList.add("detta");
          vv.addEventListener("click", function () { vaiA(a.reg, a.secondi, "tutto"); });
          return;
        }
        var chipF = "<span class='chip fonte " + (a.fonte === "storico" ? "storico" : "appunti") + "'>APPUNTI</span>";
        var chipV = a.telecronista ? "<span class='chip chi'>\ud83c\udf99 " + a.telecronista + "</span>" : "";
        var chipR = a.rating ? "<span class='chip voto v" + a.rating + "'>\u2605 " + a.rating + "</span>" : "";
        var chipP = a.dove ? (a.orologio ? "<span class='chip prec sec'>\u23f1 al secondo</span>" : "<span class='chip prec stima'>\u2248 a stima</span>") : "";
        var v = riga(tipoChip(a.tipo, a.testo) + pulito(a.testo || a.tipo || ""),
          chipF + chipR + chipV + "<span class='chip vicino'>" + Math.round(a.vicinanza * 100) + "%</span>" + chipP +
          "<span class='dove'>" + a.partita + "</span><span class='sep2'>\u00b7</span>" +
          (a.tempo === 2 ? "2\u00ba T " : a.tempo === 1 ? "1\u00ba T " : "") + a.minuto +
          (a.dove ? "<span class='sep2'>\u00b7</span><span class='tc'>" + orologio(a.dove) + "</span>" : ""),
          a.dove ? "VAI" : "", data(Date.parse(a.quando)));
        v.classList.add("fonte-" + (a.fonte || "appunti"), "azione");
        if (a.dove) v.addEventListener("click", function () {
          conCronometro(a, function (dove) { apriDaArchivio(a.rec, dove, a.partita, a.pezzo); });
        });
      });
    }
    if (RIS.segni.length) {
      titolo("Segni nelle partite", RIS.segni.length, "segni");
      RIS.segni.forEach(function (m) {
        riga(m.testo || m.tipo || "segno",
             "<span class='chip fonte segno'>SEGNO</span>" + m.partita + " · " + orologio(m.secondi) + (m.fonte ? " · " + m.fonte : ""),
             "VAI", data(m.quando))
          .addEventListener("click", function () { vaiA(m.reg, m.secondi, "live"); });
      });
    }
  }

  // Il video di questa partita non e' collegato al MAM. Quello che c'e' —
  // e non e' poco — sono gli appunti di chi l'ha guardata: la partita
  // intera, minuto per minuto. Serve a decidere se vale la pena andare a
  // cercare il file, prima di andarlo a cercare.
  function apriAppunti(rec) {
    manda({ tipo: "clip-appunti-partita", rec: rec }).then(function (d) {
      var vecchia = el("foglio"); if (vecchia) vecchia.remove();
      var s = document.createElement("div");
      s.className = "foglio"; s.id = "foglio";
      var d0 = new Date(d.quando);
      var quando = isFinite(d0) ? ("0"+d0.getDate()).slice(-2) + "/" +
                   ("0"+(d0.getMonth()+1)).slice(-2) + "/" + d0.getFullYear() : "";
      var righe = "", tempo = 0, hl = 0;
      d.righe.forEach(function (r) {
        if (r.s !== tempo) {
          tempo = r.s;
          righe += '<div class="tempo">' + (tempo === 1 ? "Primo tempo" : "Secondo tempo") + '</div>';
        }
        if (r.hl) hl++;
        righe += '<div class="az' + (r.hl ? " hl" : "") +
                 (r.dove ? " apri\" data-dove=\"" + r.dove +
                           "\" data-pezzo=\"" + (r.pezzo || 0) : "") + '">' +
                 '<u>' + (r.hl ? "\u2605 " : "") + r.m + '</u>' +
                 '<i>' + (r.t || "") + '</i><p>' + r.x + '</p></div>';
      });
      s.innerHTML = '<div><header><b>' + d.partita + '</b>' +
        '<span>' + (d.competizione || "") + (quando ? " \u00b7 " + quando : "") +
        " \u00b7 " + d.righe.length + ' azioni' + (hl ? " \u00b7 " + hl + " segnate per gli HL" : "") +
        '</span><a href="#" id="foglioChiudi">chiudi</a></header>' +
        '<div class="righe">' + (righe || '<div class="az"><p>Nessuna azione.</p></div>') + '</div>' +
        '<footer>Il video di questa partita non \u00e8 collegato al MAM: ' +
        'gli appunti dicono <b>quale minuto</b>, il file sta in archivio.</footer></div>';
      document.body.appendChild(s);
      s.querySelectorAll(".az.apri").forEach(function (r) {
        r.addEventListener("click", function () {
          apriDaArchivio(d.rec, +r.dataset.dove, d.partita, +r.dataset.pezzo || 0);
        });
      });
      var via = function (e) { if (e) e.preventDefault(); s.remove(); };
      s.addEventListener("click", function (e) { if (e.target === s) via(); });
      el("foglioChiudi").addEventListener("click", via);
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { via(); document.removeEventListener("keydown", esc); }
      });
    }).catch(function (e) { dice(e.message); });
  }

  // dal risultato al materiale: si sceglie la partita, si va alla vista
  // giusta e — se e' un segno — il player ci salta dentro.
  var POSIZIONE_APERTURA = null;   // il secondo su cui aprire il prossimo video, se qualcuno l'ha chiesto
  function vaiA(idReg, secondi, vista) {
    var r = REGISTRAZIONI.filter(function (x) { return x.id === idReg; })[0];
    if (r) REG = r;
    if (r) vaiTab("progetto");
    // i risultati restano nella linguetta Sorgenti: si apre un'azione, se
    // ne prende un'altra, senza cercare di nuovo
    if (secondi !== null && secondi !== undefined) POSIZIONE_APERTURA = secondi;
    VISTA = vista || "tutto";
    document.querySelectorAll("#linguette button").forEach(function (x) {
      x.className = (x.dataset.v === "live" ? "live" : "") + (x.dataset.v === VISTA ? " acceso" : "");
    });
    disegna();
    if (secondi !== null && secondi !== undefined) {
      var giri = 0;
      var attesa = setInterval(function () {
        var v = el("player");
        if (++giri > 30) return clearInterval(attesa);
        if (!v || !v.duration) return;
        clearInterval(attesa);
        seguiLive = false; v.currentTime = secondi;      // fermo li': si decide dopo se partire
      }, 300);
    }
  }

  el("q").addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(attesaCerca);
    if (!q) { RIS = null; VISTA = vistaPrima; accendiLinguette(); disegna(); return; }
    if (VISTA !== "cerca") { vistaPrima = VISTA; VISTA = "cerca";
      document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
        x.className = (x.dataset.v === "live" ? "live" : "");
      });
      if (hls) { hls.destroy(); hls = null; apertaId = ""; }

    }
    attesaCerca = setTimeout(function () { cerca(q); }, 280);
  });
  el("q").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { this.value = ""; this.dispatchEvent(new Event("input")); this.blur(); }
  });

  // ── il giro ─────────────────────────────────────────────────────
  // IL CENTRO NON CAMBIA MESTIERE.
  //
  //  Prima le linguette sostituivano la finestra di lavorazione con una
  //  griglia: si arrivava, si sceglieva "Clip", e il visore spariva. Ma il
  //  giro vero e' uno solo — si arriva, si lavora la clip, la si spedisce —
  //  e quel giro sta tutto al centro. Il materiale prodotto e' un'altra
  //  cosa: sta a destra, e da li' non toglie niente.
  function disegna() {
    firmaVecchia = "";                     // un gesto dell'utente ridisegna sempre
    albero(); consoleSinistra();
    if (!el("player")) centroLavoro();     // la finestra di lavorazione si costruisce una volta
    // cambiare flusso deve essere immediato: aspettare il giro di
    // aggiornamento voleva dire nove secondi di nero fra una partita e l'altra
    if (REG && el("player") && !guardando) { apri(REG); capo(); }
    disegnaConsole(); disegnaSequenza();
    if (VISTA === "cerca") { disegnaRisultati(); return; }
    destraMateriale();
  }

  // la firma di quello che si vede: se non cambia, non si tocca
  var firmaVecchia = "";
  function cambiato() {
    var f = [VISTA, FORMA, ASSET, REG ? REG.id + REG.stato + REG.integrale : "-",
      CLIP.map(function (c) { return c.id + c.stato + (c.mini ? "1" : "0"); }).join(","),
      SEQ ? SEQ.id + SEQ.pezzi.length + (SEQ.export ? SEQ.export.stato : "") : "-"].join("|");
    if (f === firmaVecchia) return false;
    firmaVecchia = f; return true;
  }

  function aggiorna() {
    return manda({ tipo:"clip-stato" }).then(function (d) {
      REGISTRAZIONI = d.reg || [];
      DISCO = d.disco || null;
      if (REG) { var mio = REGISTRAZIONI.filter(function (r) { return r.id === REG.id; })[0]; if (mio) REG = mio; else REG = null; }
      if (!REG && REGISTRAZIONI.length && MODO !== "archivio") REG = REGISTRAZIONI[0];
      // in archivio il bin e' della partita scelta: senza partita, vuoto —
      // entrare e trovarsi davanti le clip di tutte le altre confonde
      CLIP = d.clip || [];
      barra(); lavorazioneInCorso();
      if (REG && el("player") && !guardando) apri(REG);
      disegnaConsole(); capo(); disegnaSequenza();
      if (VISTA === "cerca") { albero(); return; }      // sta cercando: non si tocca la lista
      if (cambiato()) destraMateriale();
      // Se non e' cambiato niente NON si ridisegna: rifare la griglia ogni
      // tre secondi buttava via le miniature prima che finissero di
      // caricarsi (e con loro la posizione dello scorrimento). Una lista che
      // si rigenera da sola sotto le mani e' peggio di una lista vecchia.
      albero();
      if (REG) {
        manda({ tipo:"clip-hl-elenco", reg:REG.id }).then(function (h) {
          SEQS = h.seq || [];
          // la sequenza scelta resta scelta: il giro non la cambia sotto le mani
          var mia = SEQ && SEQS.filter(function (x) { return x.id === SEQ.id; })[0];
          // una sequenza appena nata puo' non essere ancora nell'elenco: si tiene
          SEQ = mia || ((SEQ && SEQ.reg === REG.id) ? SEQ : (SEQS[0] || null));
          if (VISTA === "hl") destraMateriale();
        }).catch(function () {});
      }
    }).catch(function (e) { el("sPonte").textContent = "non risponde"; el("sPonteP").className = "pallino"; });
  }

  (function () { var l = el("sLav"); if (l) l.addEventListener("click", function () { apriUscite(false); }); })();
  var PRONTI_VISTI = null, giroSvelto = null;
  function diceHtml(html, buona) {
    var a = el("avviso"); if (!a) return;
    a.innerHTML = html; a.className = "avviso vedi" + (buona ? " ok" : "");
    if (buona) setTimeout(function () { a.className = "avviso"; }, 9000);
  }
  function lavorazioneInCorso() {
    // chi e' appena finito lo si annuncia, una volta, con il tasto per scaricarlo
    var fatti = {};
    CLIP.forEach(function (c) { if (c.stato === "pronta") fatti["c:" + c.id] = { nome: c.nome || c.titolo, url: BASE + "/clip/_clip/" + c.id + ".mp4?scarica=1" }; });
    (SEQS.length ? SEQS : (SEQ ? [SEQ] : [])).forEach(function (q) {
      Object.keys(q.esportati || {}).forEach(function (k) { fatti["s:" + q.id + ":" + k] = { nome: q.esportati[k].nome || q.titolo, url: BASE + q.esportati[k].file + "?scarica=1" }; });
      if (q.premiere) fatti["x:" + q.id] = { nome: q.premiere.nome || "XML", url: BASE + q.premiere.file + "?scarica=1" };
    });
    if (PRONTI_VISTI) {
      Object.keys(fatti).forEach(function (k) {
        if (!PRONTI_VISTI[k]) diceHtml('\u2713 Esportazione completata: <b>' + pulito(fatti[k].nome) + '</b><a href="' + fatti[k].url + '">Scarica</a>', true);
      });
    }
    PRONTI_VISTI = fatti;
    var inCoda = CLIP.filter(function (c) { return c.stato !== "pronta" && c.stato !== "errore"; });
    var seqs = (SEQS.length ? SEQS : (SEQ ? [SEQ] : [])).filter(function (q) { return q.export && q.export.stato === "lavora"; });
    var n = inCoda.length + seqs.length, l = el("sLav"); if (!l) return;
    // il vassoio, se e' aperto, si ridisegna SEMPRE: anche l'ultimo giro,
    // quello in cui la barra al 98% deve diventare "completato"
    if (el("uscite")) apriUscite(true);
    if (!n) { l.innerHTML = "niente in coda"; return; }
    var av = 0; inCoda.forEach(function (c) { av += c.avanza || 0; }); seqs.forEach(function (q) { av += q.export.avanza || 0; });
    av = av / n;
    l.innerHTML = n + " in lavorazione \u00b7 " + Math.round(av * 100) + '%<span class="barraAv"><i style="width:' + Math.round(av * 100) + '%"></i></span>';
    // mentre qualcosa lavora il giro passa a un secondo: la barra deve muoversi
    if (!giroSvelto) giroSvelto = setTimeout(function () { giroSvelto = null; aggiorna(); }, 1000);
  }

  // ── COME STANNO I MONITOR ──
  //  Affiancati e' l'eredita' di Premiere; ma in diretta la Sorgente e' dove
  //  si lavora e il Programma e' un controllo. "Sorgente grande" li impila e
  //  fa il Programma piccolo. La scelta si ricorda.
  function impilaMonitor(si) {
    MONITOR_IMPILATI = !!si;
    document.body.classList.toggle("monitor-impilati", MONITOR_IMPILATI);
    try { var m = JSON.parse(localStorage.getItem("mam.misure") || "{}"); m.impilati = MONITOR_IMPILATI; localStorage.setItem("mam.misure", JSON.stringify(m)); } catch (e) {}
    costruisciMenu();
    telaioForma(); disegnaTutto();
  }
  document.body.classList.toggle("monitor-impilati", MONITOR_IMPILATI);

  // ── i divisori ──
  (function () {
    var radice = document.documentElement;
    function leggi() {
      try {
        var m = JSON.parse(localStorage.getItem("mam.misure") || "{}");
        if (m.projW) radice.style.setProperty("--projW", m.projW + "px");
        if (m.liveW) radice.style.setProperty("--liveW", m.liveW + "px");
        if (m.split) radice.style.setProperty("--split", m.split);
        if (m.tlH) radice.style.setProperty("--tlH", m.tlH + "px");
      } catch (e) {}
    }
    function salva(k, v) {
      try { var m = JSON.parse(localStorage.getItem("mam.misure") || "{}"); m[k] = v; localStorage.setItem("mam.misure", JSON.stringify(m)); } catch (e) {}
    }
    leggi();
    var presa = null;
    function attacca(id, modo) {
      var h = el(id); if (!h) return;
      h.addEventListener("mousedown", function (e) {
        e.preventDefault(); presa = { modo: modo, h: h, x0: e.clientX, y0: e.clientY,
          projW: el("sepProj") ? el("sepProj").previousElementSibling.getBoundingClientRect().width : 272,
          liveW: el("colLive") ? el("colLive").getBoundingClientRect().width : 210,
          split: parseFloat(getComputedStyle(radice).getPropertyValue("--split")) || 50,
          tlH: el("timeline").getBoundingClientRect().height,
          monW: el("monS") ? el("monS").parentElement.getBoundingClientRect().width : 1 };
        h.classList.add("presa"); document.body.classList.add("ridimensiono");
      });
    }
    document.addEventListener("mousemove", function (e) {
      if (!presa) return;
      if (presa.modo === "proj") {
        // in live il progetto sta a destra: allargarlo vuol dire tirare a sinistra
        var verso = document.body.classList.contains("modo-live") ? -1 : 1;
        var w = Math.max(200, Math.min(640, presa.projW + verso * (e.clientX - presa.x0)));
        radice.style.setProperty("--projW", w + "px"); presa.val = w;
      } else if (presa.modo === "live") {
        var lw = Math.max(150, Math.min(420, presa.liveW + (e.clientX - presa.x0)));
        radice.style.setProperty("--liveW", lw + "px"); presa.val = lw;
      } else if (presa.modo === "mon") {
        var sp = Math.max(25, Math.min(75, presa.split + (e.clientX - presa.x0) / presa.monW * 100));
        radice.style.setProperty("--split", sp); presa.val = Math.round(sp * 10) / 10;
      } else {
        var hh = Math.max(150, Math.min(520, presa.tlH - (e.clientY - presa.y0)));
        radice.style.setProperty("--tlH", hh + "px"); presa.val = hh;
      }
      telaioForma(); disegnaTutto();
    });
    document.addEventListener("mouseup", function () {
      if (!presa) return;
      if (presa.val !== undefined) salva(presa.modo === "proj" ? "projW" : presa.modo === "live" ? "liveW" : presa.modo === "mon" ? "split" : "tlH", presa.val);
      presa.h.classList.remove("presa"); document.body.classList.remove("ridimensiono"); presa = null;
      telaioForma(); disegnaTutto();
    });
    attacca("sepProj", "proj"); attacca("sepTl", "tl"); attacca("sepLive", "live");
    var giri = 0, att = setInterval(function () { if (el("sepMon") || ++giri > 40) { clearInterval(att); attacca("sepMon", "mon"); } }, 250);
  })();
  function barra() {
    var aperte = REGISTRAZIONI.filter(function (r) { return r.stato === "registra"; });
    var lav = CLIP.filter(function (c) { return c.stato === "lavora"; }).length;
    el("sRec").textContent = aperte.length ? aperte.length + " · " + orologio(aperte[0].durata || 0) : "nessuna";
    el("sPall").className = "pallino" + (aperte.some(function (r) { return !r.attesa && !r.guarda; }) ? " rec" : "");
    if (DISCO) {
      el("sDisco").textContent = DISCO.liberi + " GB · ~" + DISCO.partite + " partite";
      el("sBarra").style.width = Math.max(4, Math.min(100, 100 - DISCO.liberi / 79 * 100)) + "%";
    }
    el("sLav").textContent = lav ? lav + " in lavorazione" : "niente in coda";
    el("sPonte").textContent = "risponde"; el("sPonteP").className = "pallino ok";
    // la linguetta LIVE si accende da sola quando qualcosa sta girando
    segnaConteggi();
  }

  document.querySelectorAll("#linguette [data-v]").forEach(function (b) {
    b.dataset.nome = b.textContent;
    b.addEventListener("click", function () {
      VISTA = b.dataset.v; ASSET = 0;
      accendiLinguette(); disegna();
    });
  });
  document.querySelectorAll("#linguette [data-forma]").forEach(function (b) {
    b.addEventListener("click", function () {
      FORMA = b.dataset.forma; ASSET = 0;
      // scegliere una forma mentre si e' sul live vuol dire voler vedere
      // quel materiale: si passa a "tutto" invece di non far succedere niente
      if (VISTA === "cerca") VISTA = "tutto";
      accendiLinguette();
      disegna();
    });
  });
  function accendiLinguette() {
    document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
      x.className = (x.dataset.v === VISTA ? "acceso" : "");
    });
    document.querySelectorAll("#linguette [data-forma]").forEach(function (x) {
      x.className = (x.dataset.forma === FORMA ? "acceso" : "");
    });
  }


  disegna();
  aggiorna();
  setInterval(aggiorna, 3000);
})();
</script>
</body>
</html>
