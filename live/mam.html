<!doctype html>
<meta charset="utf-8">
<title>MAM — Como TV</title>
<!-- IL MAM E' UNO SOLO: mam2.html. Questa era la versione 1 (tolta il
     25/09/2026, resta nella storia di git). L'indirizzo resta valido per chi
     lo ha salvato e traduce le vecchie domande in quelle nuove:
       ?modo=archivio&apri=<rec>&t=<s>  -> la partita nella Libreria, a quel secondo
       ?modo=archivio                   -> la Libreria
       (senza modo, o ?modo=live)       -> MAM LIVE
       ?seq=<id>                        -> il montaggio di quella sequenza -->
<meta name="robots" content="noindex">
<link rel="canonical" href="mam2.html">
<body style="background:#1B1C20"><script src="dev.js"></script>
<script>
(function(){
  var q = location.search;
  var val = function(n){ var m = new RegExp("(\\?|&)" + n + "=([^&]+)").exec(q); return m ? decodeURIComponent(m[2]) : ""; };
  var apri = val("apri"), t = val("t"), seq = val("seq"), dove = "mam2.html";
  if (seq) dove += "?seq=" + encodeURIComponent(seq);
  else if (apri) dove += "?asset=" + encodeURIComponent(apri) + (t ? "&t=" + encodeURIComponent(t) : "");
  else if (!/(\?|&)modo=archivio/.test(q)) dove += "?live=1";
  location.replace(dove + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=mam2.html"></noscript>
</body>
