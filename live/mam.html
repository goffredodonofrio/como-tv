<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como TV</title>
<meta name="theme-color" content="#0A0F24">
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  /* "hidden" deve vincere: un display: scritto da noi batte quello del
     browser, e una riga nascosta restava in mezzo alla console. */
  [hidden]{display:none!important;}

  /* ══════════════════════════════════════════════════════════════
     UNA PAGINA SOLA.
     Le tre colonne non si muovono mai: a sinistra le partite, al centro
     quello che si guarda, a destra quello che si fa. A cambiare e' solo
     il contenuto, scelto dalla riga di linguette — LIVE compreso.
     Prima erano due pagine e un interruttore in alto a destra: due posti
     dove cercare la stessa cosa, e infatti non si trovava.
     Colori: la variante "carta" del design system — avorio come fondo,
     navy come inchiostro, oro profondo per il testo in oro. Restano scure
     la riga di stato e i riquadri del video: strumentazione e immagine.
     ══════════════════════════════════════════════════════════════ */
  :root{
    color-scheme:light;
    --carta:#F5F1E6;--carta-2:#FFFDF7;--bianco:#FFFFFF;
    --inchiostro:#0A0F24;--inchiostro-2:#464E6E;--inchiostro-3:#6B7290;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;--ok:#2E9E68;
    --linea:rgba(10,15,36,.10);--linea-oro:rgba(166,124,46,.35);
    --scuro:#0A0F24;
    --ombra:0 1px 2px rgba(10,15,36,.06), 0 6px 18px rgba(10,15,36,.05);
    --barra:52px;
    /* Una scala sola per tutta la pagina: prima ogni blocco aveva i suoi
       numeri e si vedeva — margini diversi a un pixel di distanza fanno
       sembrare storto anche quello che e' dritto. */
    --s1:6px;--s2:10px;--s3:16px;--s4:24px;
    --alto:38px;                     /* l'altezza di TUTTO cio' che si preme */
  }
  /* La pagina non scorre: sta dentro uno schermo di portatile e basta.
     A scorrere sono le colonne, ognuna per conto suo — cosi' mentre cerchi
     nella griglia non perdi di vista il visore, e mentre guardi il visore
     non perdi la lista delle partite. */
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.45;
    color:var(--inchiostro);background-color:var(--carta);
    display:flex;flex-direction:column;
    background-image:
      radial-gradient(90% 70% at 18% 4%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(70% 70% at 95% 100%, rgba(201,162,75,.13), transparent 60%);
    background-attachment:fixed;}

  .testata{display:flex;align-items:center;gap:18px;flex:0 0 auto;
    padding:11px clamp(14px,3vw,26px);z-index:50;
    background:var(--scuro);color:var(--carta);border-bottom:2px solid var(--gold);}
  .marchio{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;white-space:nowrap;}
  .marchio small{display:block;font-size:9px;letter-spacing:.26em;color:var(--gold-bright);font-weight:700;}
  .cerca{flex:1 1 320px;display:flex;gap:8px;align-items:center;
    background:rgba(245,241,230,.10);border:1px solid rgba(245,241,230,.16);border-radius:10px;padding:9px 13px;}
  .cerca input{flex:1;background:none;border:none;color:var(--carta);font-family:inherit;font-size:14px;}
  .cerca input:focus{outline:none;}
  .cerca input::placeholder{color:rgba(245,241,230,.45);}
  .cerca .lente{color:rgba(245,241,230,.55);}
  .torna{color:rgba(245,241,230,.6);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
  .torna:hover{color:var(--gold-bright);}

  /* Sopra si guarda, sotto si monta: le colonne prendono quello che resta,
     la timeline si tiene la sua fascia e non la molla. */
  .lavoro{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);}
  .colCentro{display:flex;flex-direction:column;min-height:0;}
  .colCentro #centro{flex:0 0 auto;}
  .tre{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:0;}

  /* LA TIMELINE DI PREMIERE. Non "ispirata": uguale. Fondo scuro, timecode
     blu, righello in timecode con la barra gialla dell'area di lavoro,
     testine con lucchetto e occhio, clip blu con la barra del titolo e fx,
     audio con la forma d'onda, cursore blu con la testa quadrata e la
     linea che attraversa tutte le tracce. E' il posto dove chi monta ha
     gia' le mani: qui non si inventa, si riproduce. */
  .timeline{--tl-fondo:#1F1F1F;--tl-fondo2:#262626;--tl-riga:#0F0F0F;--tl-testo:#C9C9C9;--tl-blu:#2D8CEB;
    --tl-clip:#2C5F7F;--tl-clip2:#3C7EA6;--tl-clipsel:#4A93C4;--tl-giallo:#E6D34A;
    background:var(--tl-fondo);color:var(--tl-testo);display:flex;flex-direction:column;min-height:0;
    font-family:'Inter',system-ui,sans-serif;border-top:1px solid var(--tl-riga);}
  .tltab{display:flex;align-items:center;gap:10px;height:26px;padding:0 10px;font-size:11.5px;
    background:#232323;border-bottom:1px solid var(--tl-riga);}
  .tltab .x{color:#8A8A8A;font-size:13px;} .tltab .menu{color:#8A8A8A;}
  .tltab #tlNome{color:#E6E6E6;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tltab .esp{display:flex;gap:6px;align-items:center;margin-left:auto;}
  .tltab .esportati a{font-size:10px;color:var(--tl-blu);font-weight:700;margin-left:8px;text-decoration:none;}
  .tltab .esportati .lavora{font-size:10px;color:#8A8A8A;margin-left:8px;}
  .tltab button.b.piccolo{height:20px;padding:0 8px;font-size:9px;background:#333;border-color:#444;color:#DDD;box-shadow:none;}
  .tltab button.b.piccolo.oro{background:var(--tl-blu);border-color:var(--tl-blu);color:#fff;}
  .tlcorpo{flex:1 1 auto;display:flex;min-height:0;}
  .tlnomi{width:150px;flex:0 0 150px;border-right:1px solid var(--tl-riga);display:flex;flex-direction:column;}
  .tltc{height:22px;line-height:22px;padding:0 10px;color:var(--tl-blu);font-size:13px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .tlstrumenti{height:22px;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--tl-riga);}
  .tlstrumenti i{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:#9A9A9A;font-style:normal;}
  .tlstrumenti i.on{color:var(--tl-blu);}
  .tlstrumenti svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .tlstrumenti svg .p{fill:currentColor;stroke:none;}
  .tlstrumenti .lente{margin-left:auto;display:flex;gap:1px;}
  .tlstrumenti .lente b{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;
    color:#BBB;font-size:12px;cursor:pointer;border-radius:3px;} .tlstrumenti .lente b:hover{background:#3A3A3A;}
  .tltraccia{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-bottom:1px solid var(--tl-riga);font-size:11px;color:#BDBDBD;}
  .tltraccia.v{height:34px;} .tltraccia.v[data-t="V1"]{height:56px;}
  .tltraccia.a{height:34px;} .tltraccia.a[data-t="A1"]{height:46px;}
  .tltraccia .lock{width:9px;height:11px;border:1.5px solid #9A9A9A;border-radius:2px;position:relative;}
  .tltraccia .lock::before{content:'';position:absolute;left:1.5px;top:-6px;width:4px;height:5px;border:1.5px solid #9A9A9A;border-bottom:0;border-radius:3px 3px 0 0;}
  .tltraccia .tag{width:30px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;color:#BDBDBD;}
  .tltraccia .tag.on{background:var(--tl-blu);color:#fff;border-radius:2px;}
  .tltraccia .eye{width:12px;height:8px;border:1.5px solid #9A9A9A;border-radius:50%;position:relative;}
  .tltraccia .eye::after{content:'';position:absolute;left:3px;top:1px;width:3px;height:3px;border-radius:50%;background:#9A9A9A;}
  .tltraccia .ms{font-size:9.5px;color:#BDBDBD;width:12px;text-align:center;font-style:normal;}
  .tltraccia .mic{width:5px;height:9px;border:1.5px solid #9A9A9A;border-radius:3px;position:relative;}
  .tltraccia .mic::after{content:'';position:absolute;left:-2.5px;bottom:-4px;width:8px;height:4px;border:1.5px solid #9A9A9A;border-top:0;border-radius:0 0 5px 5px;}

  .tlpista{position:relative;flex:1 1 auto;overflow:hidden;cursor:default;user-select:none;background:var(--tl-fondo);}
  .tlrighello{position:relative;height:44px;border-bottom:1px solid var(--tl-riga);background:#232323;}
  .tlrighello .ora{position:absolute;top:5px;font-size:10.5px;color:#BDBDBD;transform:translateX(3px);
    font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap;}
  .tlrighello .tacca{position:absolute;bottom:14px;width:1px;height:6px;background:#6A6A6A;}
  .tlrighello .tacca.grande{height:11px;background:#8E8E8E;}
  .tlrighello .lavoro{position:absolute;bottom:8px;height:3px;background:var(--tl-giallo);left:0;}
  .tlrighello .testa{position:absolute;bottom:2px;width:10px;height:14px;background:var(--tl-blu);
    clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);transform:translateX(-5px);z-index:7;}
  .tlcorsia{position:relative;border-bottom:1px solid var(--tl-riga);}
  .tlcorsia.v{height:34px;} #tlV1{height:56px;} .tlcorsia.a{height:34px;} #tlA1{height:46px;}
  .tlcorsia.vuota{background:var(--tl-fondo2);}

  /* la clip video: corpo blu, barra del titolo piu' chiara con nome e fx, miniatura */
  .tlpista .clipV{position:absolute;top:1px;height:54px;background:var(--tl-clip);border:1px solid #1B3D52;
    border-radius:2px;overflow:hidden;cursor:grab;color:#F2F2F2;}
  .tlpista .clipV .barra2{position:absolute;left:0;right:0;top:0;height:16px;background:var(--tl-clip2);
    display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:500;white-space:nowrap;}
  .tlpista .clipV .barra2 .tt{flex:1;overflow:hidden;text-overflow:ellipsis;}
  .tlpista .clipV .barra2 .fx{font-style:italic;color:#CFE6F5;font-size:9.5px;margin-left:6px;}
  .tlpista .clipV img{position:absolute;left:2px;top:18px;height:34px;width:auto;border-radius:1px;}
  .tlpista .clipV .dd{display:none;}
  .tlpista .clipV.sel{background:var(--tl-clipsel);}
  .tlpista .clipV.sel .barra2{background:#63A9D6;}
  .tlpista .clipV .bordo{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2;}
  .tlpista .clipV .bordo.sx{left:0;} .tlpista .clipV .bordo.dx{right:0;}
  .tlpista .clipV .bordo:hover{background:rgba(255,255,255,.18);}
  /* la clip audio: stesso blu, riga centrale e forma d'onda */
  .tlpista .clipA{position:absolute;top:1px;height:44px;background:var(--tl-clip);border:1px solid #1B3D52;border-radius:2px;overflow:hidden;}
  .tlpista .clipA::before{content:'';position:absolute;left:0;right:0;top:16px;bottom:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 3px),
               linear-gradient(180deg,transparent 0 35%,rgba(255,255,255,.22) 35% 65%,transparent 65%);}
  .tlpista .clipA::after{content:'fx';position:absolute;right:6px;top:1px;font-size:9.5px;font-style:italic;color:#CFE6F5;}
  .tlpista .clipA .onda{position:absolute;left:0;right:0;top:0;height:16px;background:var(--tl-clip2);}
  /* il cursore: linea blu su tutte le tracce, al fotogramma */
  .tltestina{position:absolute;top:44px;bottom:0;width:1px;background:var(--tl-blu);z-index:6;pointer-events:none;
    box-shadow:0 0 0 .5px rgba(45,140,235,.35);}
  .tlins{position:absolute;top:44px;bottom:0;width:2px;background:var(--tl-giallo);z-index:6;pointer-events:none;}
  .tlvuoto{position:absolute;left:0;right:0;top:44px;bottom:0;display:flex;align-items:center;justify-content:center;
    color:#7A7A7A;font-size:11px;pointer-events:none;}
  /* La timeline attraversa tutto lo schermo, come in Premiere: sta fissa in
     basso sopra la barra di stato, e le colonne le lasciano il posto. */
  .timeline{position:fixed;left:0;right:0;bottom:var(--barra);height:240px;z-index:55;}
  .lavoro{padding-bottom:240px;}

    justify-content:center;color:var(--fumo);font-size:11px;}
  .tltraccia-nome.a1{color:#2E8B57;height:36px;}
  .tlcima .esp{display:flex;gap:6px;align-items:center;margin-left:auto;}
  .tlcima .esportati a{font-size:10px;color:var(--gold-deep);font-weight:700;margin-left:8px;text-decoration:none;}
  .tlcima .esportati .lavora{font-size:10px;color:var(--fumo);margin-left:8px;}
  #sequenza{display:none!important;}

  /* Il marcatore: M apre il riquadro sopra il monitor, come il pannello
     marcatore di Premiere. Si scrive, invio, sparisce. */
  .segnaBox{position:absolute;left:0;right:0;top:34px;z-index:20;background:var(--carta);
    border:1px solid var(--gold-deep);border-radius:8px;padding:8px;display:flex;gap:6px;
    align-items:center;box-shadow:0 10px 30px rgba(10,15,36,.22);}
  .segnaBox input{flex:1 1 auto;min-width:0;}
  .segnaBox button.b{height:30px;padding:0 10px;font-size:10px;}
  .binSugg{margin-top:var(--s3);}
    justify-content:center;color:var(--fumo);font-size:11px;}
  @media (max-width:1240px){.tre{grid-template-columns:220px minmax(0,1fr);}}
  .col{padding:14px clamp(10px,1.2vw,18px);overflow:auto;min-height:0;}
  .col + .col{border-left:1px solid var(--linea);}
  .col h2{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--inchiostro-3);margin:0 0 var(--s2);
    display:flex;justify-content:space-between;padding-bottom:var(--s1);
    border-bottom:1px solid var(--linea);}
  .col h2 + *{margin-top:0;}
  .col > * + h2{margin-top:var(--s4);}
  .col h2 span{color:var(--gold-deep);}

  /* "Nuovo" e' una cosa sola: da qualche parte deve arrivare del materiale.
     Carica un file e accendi un flusso sono due modi della stessa domanda,
     quindi stanno nella stessa scatola e non in due. */
  .carica{border:1px dashed var(--linea-oro);border-radius:9px;padding:var(--s2);
    text-align:center;margin-bottom:var(--s2);background:rgba(201,162,75,.06);}
  .carica.sopra{background:rgba(201,162,75,.18);border-color:var(--gold-deep);}
  .carica .aiuto{margin-top:6px;font-size:11px;}
  .avanza{height:5px;border-radius:3px;background:rgba(10,15,36,.12);margin-top:9px;overflow:hidden;}
  .avanza i{display:block;height:100%;width:0;background:var(--gold-deep);transition:width .2s;}

  /* i contenuti hanno una faccia: una lista di righe di testo non si guarda,
     si legge — e leggere venti titoli per trovare una partita e' il modo
     piu' lento di cercare */
  .foglia .facc{width:46px;height:26px;border-radius:4px;object-fit:cover;flex:none;background:var(--scuro);}
  .foglia .vuota{width:46px;height:26px;border-radius:4px;flex:none;
    background:linear-gradient(135deg,#1b2a5e,#0d1430);}
  .foglia .righe{min-width:0;flex:1;}
  .foglia .tit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;}
  .foglia .sotto2{font-size:10px;color:var(--inchiostro-3);}

  .ramo{margin-bottom:var(--s2);}
  .ramo>.testa{display:flex;align-items:center;gap:8px;padding:var(--s1) 8px 3px;
    font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--inchiostro-3);}
  .ramo .conta{margin-left:auto;color:var(--inchiostro-3);font-family:'DM Sans';font-size:11px;letter-spacing:0;text-transform:none;}
  .foglia{display:flex;gap:var(--s1);align-items:center;padding:var(--s1) 8px;border-radius:7px;
    cursor:pointer;font-size:13px;}
  .foglia:hover{background:rgba(10,15,36,.045);}
  .foglia.scelta{background:rgba(201,162,75,.16);box-shadow:inset 2px 0 0 var(--gold-deep);font-weight:700;}
  .foglia .quando{margin-left:auto;color:var(--inchiostro-3);font-size:10px;flex:none;}
  .foglia .rec{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
    box-shadow:0 0 8px rgba(229,27,32,.8);animation:batte 1.4s ease-in-out infinite;}

  /* ── le linguette: sono la navigazione, non un filtro ───────────── */
  .linguette{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3);}
  .fila-ling{display:flex;gap:var(--s1);align-items:center;}
  .linguette button{padding:0 11px;height:30px;}
  .linguette .forme button{height:26px;padding:0 9px;font-size:9px;}
  .linguette .stacco{width:1px;align-self:stretch;background:var(--linea);margin:2px 5px;}
  .linguette .forme{display:flex;gap:5px;align-items:center;}
  .linguette .forme button{padding:6px 11px;font-size:9px;}
  .linguette .et2{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--inchiostro-3);margin-right:2px;}
  .linguette .conta2{margin-left:6px;opacity:.55;font-size:9px;}
  .linguette button{background:var(--carta-2);border:1px solid var(--linea);border-radius:20px;
    color:var(--inchiostro-2);cursor:pointer;padding:7px 15px;
    font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .linguette button:hover{border-color:var(--linea-oro);}
  .linguette button.acceso{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .linguette button.live{border-color:rgba(229,27,32,.45);color:#9E1418;}
  .linguette button.live.acceso{background:var(--red);border-color:var(--red);color:#fff;}
  /* quando una clip finisce in un formato, la sua linguetta lo dice */
  @keyframes arrivata{0%,100%{box-shadow:0 0 0 0 rgba(166,124,46,0)}
    35%{box-shadow:0 0 0 5px rgba(166,124,46,.35)}}
  .linguette button.arrivata{animation:arrivata 1.1s ease-out 2;border-color:var(--gold-deep);color:var(--gold-deep);}
  .linguette .pallino{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);
    margin-right:7px;vertical-align:1px;animation:batte 1.4s ease-in-out infinite;}
  @keyframes batte{0%,100%{opacity:1}50%{opacity:.3}}

  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:var(--s2);}
  .scheda{background:var(--carta-2);border:1px solid var(--linea);border-radius:10px;overflow:hidden;
    cursor:pointer;box-shadow:var(--ombra);transition:border-color .12s, transform .12s;}
  .scheda:hover{border-color:var(--linea-oro);transform:translateY(-1px);}
  .scheda.scelta{border-color:var(--gold-deep);box-shadow:0 0 0 2px rgba(166,124,46,.28), var(--ombra);}
  .mini{position:relative;aspect-ratio:16/9;background:var(--scuro);overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .mini .telo{background:linear-gradient(135deg,#1b2a5e,#0d1430);height:100%;aspect-ratio:16/9;
    display:block;object-fit:cover;}
  .mini.v .telo{aspect-ratio:9/16;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini.q .telo{aspect-ratio:3/4;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini .durata{position:absolute;right:6px;bottom:6px;background:rgba(10,15,36,.85);border-radius:4px;
    color:var(--carta);padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;}
  .mini .formato{position:absolute;left:6px;top:6px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;letter-spacing:.1em;}
  .mini .fonte{position:absolute;left:6px;bottom:6px;font-size:10px;color:rgba(245,241,230,.9);
    background:rgba(10,15,36,.8);border-radius:4px;padding:2px 6px;}
  .scheda .testo{padding:var(--s1) 9px;}
  .scheda .nome{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scheda .sotto{font-size:11px;color:var(--inchiostro-3);margin-top:3px;}
  /* i comandi della clip stanno sulla clip: per scaricarne tre di fila non
     si deve piu' sceglierle una per una e poi andarle a cercare a destra */
  .scheda .comandi{display:flex;gap:var(--s2);padding:0 9px var(--s1);flex-wrap:wrap;}
  .scheda .comandi a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .scheda .comandi a:hover{color:var(--inchiostro);}

  /* ── il visore ─────────────────────────────────────────────────── */
  /* IL RITAGLIO SI VEDE PRIMA DI TAGLIARE.
     Il telaio ha la forma del formato scelto e il video ci sta dentro con
     object-fit:cover — che e' esattamente quello che fa ffmpeg quando
     esporta (crop centrato). Quindi quello che vedi qui e' quello che esce:
     se in 9:16 l'azione finisce fuori, lo scopri adesso e non dopo. */
  .telaio{background:var(--scuro);border:1px solid var(--linea);border-radius:9px;
    overflow:hidden;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center;}
  .telaio video{width:100%;height:100%;object-fit:cover;display:block;background:var(--scuro);}
  .telaio .forma{position:absolute;left:9px;top:9px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 8px;font-family:'Mazzard',sans-serif;font-size:10px;
    font-weight:800;letter-spacing:.12em;pointer-events:none;}
  /* Chi guarda una clip deve sapere che sta guardando QUELLA clip: al
     centro passa di tutto — il live, l'integrale, un montato — e senza un
     cartellino si perde il filo dopo il terzo giro. */
  .telaio .targa{position:absolute;left:9px;bottom:9px;right:9px;display:flex;gap:8px;
    align-items:center;background:rgba(10,15,36,.82);color:var(--carta);border-radius:6px;
    padding:5px 10px;pointer-events:none;backdrop-filter:blur(3px);}
  .telaio .targa b{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1;}
  .telaio .targa i{font-style:normal;font-size:10px;color:var(--gold);letter-spacing:.14em;
    font-weight:800;white-space:nowrap;}

  /* La pista: dove stanno entrata, uscita e i segni della partita. Non e'
     una timeline di montaggio — e' il minimo per vedere che cosa si sta
     per tagliare senza doverlo immaginare. */
  /* IN ARCHIVIO TUTTO E' SCURO, COME PREMIERE. Gli stessi token del design,
     rimappati: la carta diventa il grigio dei pannelli, l'oro diventa il blu.
     Cosi' ogni componente cambia pelle senza cambiare una riga. */
  body.modo-archivio{color-scheme:dark;
    --carta:#1E1E1E;--carta-2:#2A2A2A;--bianco:#2B2B2B;
    --inchiostro:#E2E2E2;--inchiostro-2:#C0C0C0;--inchiostro-3:#A2A2A2;--fumo:#8A8A8A;
    --gold:#2D8CEB;--gold-bright:#5AA7F2;--gold-deep:#4CA3F0;
    --linea:rgba(255,255,255,.10);--linea-oro:rgba(45,140,235,.55);
    --scuro:#141414;--ombra:none;
    background:var(--carta);color:var(--inchiostro);}
  body.modo-archivio button.b.oro{color:#fff;}
  body.modo-archivio button.b.scuro{background:#2D8CEB;border-color:#2D8CEB;color:#fff;}
  body.modo-archivio input,body.modo-archivio select,body.modo-archivio textarea{
    background:#2B2B2B;color:#E2E2E2;border-color:#3A3A3A;}
  body.modo-archivio ::placeholder{color:#8A8A8A;}
  body.modo-archivio .console{background:#2A2A2A;color:#E2E2E2;}
  body.modo-archivio .mini .telo{background:#0F0F0F;}
  body.modo-archivio .telaio{border-color:#333;}
  body.modo-archivio .col + .col{border-left-color:#0F0F0F;}
  body.modo-archivio .stato{border-top-color:#2D8CEB;}
  body.modo-archivio .voce,body.modo-archivio .scheda{background:#2A2A2A;}
  body.modo-archivio .scheda.scelta{outline:2px solid #2D8CEB;}
  body.modo-archivio .segnaBox{background:#2A2A2A;border-color:#2D8CEB;}
  body.modo-archivio .foglio>div,body.modo-archivio .tasti>div{background:#232323;}
  body.modo-archivio .risultati h3 b{color:#5AA7F2;}
  /* dove il design scrive "carta" su "scuro" (testa, barra di stato, targa,
     console) il rimappaggio farebbe scuro su scuro: qui il testo resta chiaro */
  body.modo-archivio .testa,body.modo-archivio .marchio,body.modo-archivio .marchio small,
  body.modo-archivio .stato,body.modo-archivio .stato .val,body.modo-archivio .stato .e,
  body.modo-archivio .telaio .targa,body.modo-archivio .console,body.modo-archivio .console .et,
  body.modo-archivio .torna{color:#E2E2E2;}
  body.modo-archivio .testa{background:#141414;border-bottom:1px solid #0F0F0F;}
  body.modo-archivio .stato{background:#141414;}
  body.modo-archivio .soloLive{display:none!important;}
  /* questi due la classe se la riscrivono da soli a ogni aggiornamento:
     si nascondono per nome, che nessuno gli tocca */
  body.modo-archivio #btnRec,
  body.modo-archivio #ascolto,
  body.modo-archivio .riga-stato{display:none!important;}
  body.modo-live .soloArchivio{display:none!important;}
  /* La traccia. Presa da Premiere quello che serve davvero: un righello
     con i minuti, i marcatori sopra, la parte scelta in chiaro con due
     maniglie da trascinare, e la testina rossa. Non serve altro per
     decidere un taglio — il resto di Premiere e' per il montaggio lungo. */
  .pista{position:relative;height:38px;margin-top:3px;border-radius:5px;
    background:rgba(10,15,36,.06);cursor:text;overflow:hidden;user-select:none;
    border:1px solid var(--linea);}
  .pista .righello{position:absolute;left:0;right:0;top:0;height:13px;
    border-bottom:1px solid rgba(10,15,36,.10);}
  .pista .tacca{position:absolute;top:6px;width:1px;height:7px;background:rgba(10,15,36,.28);}
  .pista .tacca.grande{top:2px;height:11px;background:rgba(10,15,36,.45);}
  .pista .ora{position:absolute;top:1px;font-size:8.5px;font-weight:700;letter-spacing:.06em;
    color:var(--fumo);transform:translateX(2px);font-variant-numeric:tabular-nums;}
  .pista .presa{position:absolute;top:13px;bottom:0;background:rgba(201,162,75,.30);}
  .pista .maniglia{position:absolute;top:13px;bottom:0;width:9px;background:var(--gold-deep);
    cursor:ew-resize;border-radius:2px;}
  .pista .maniglia::after{content:'';position:absolute;left:3.5px;top:35%;width:2px;height:30%;
    background:rgba(255,255,255,.85);}
  .pista .segno{position:absolute;top:15px;height:10px;width:3px;border-radius:2px;
    background:var(--inchiostro-3);cursor:pointer;}
  .pista .segno.gol{background:var(--red);}
  .pista .segno:hover{background:var(--gold-deep);}
  .pista .capo{position:absolute;top:0;bottom:0;width:1px;background:var(--red);pointer-events:none;}
  .pista .capo::before{content:'';position:absolute;top:0;left:-4px;border-left:4.5px solid transparent;
    border-right:4.5px solid transparent;border-top:6px solid var(--red);}

  /* Il foglio dei tasti: si apre con ? e si chiude con qualunque cosa. */
  .tasti{position:fixed;inset:0;background:rgba(10,15,36,.45);z-index:70;display:flex;
    align-items:center;justify-content:center;padding:var(--s4);}
  .tasti>div{background:var(--carta);border:1px solid var(--linea);border-radius:10px;
    padding:var(--s4);max-width:640px;width:100%;box-shadow:0 18px 50px rgba(10,15,36,.28);}
  .tasti h4{margin:0 0 var(--s3);font-family:'Mazzard',sans-serif;font-size:11px;font-weight:800;
    letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep);}
  .tasti table{width:100%;border-collapse:collapse;font-size:12px;}
  .tasti td{padding:4px 0;vertical-align:top;}
  .tasti td:first-child{width:170px;white-space:nowrap;}
  .tasti kbd{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:800;background:var(--bianco);
    border:1px solid var(--linea);border-bottom-width:2px;border-radius:4px;padding:1px 5px;margin-right:3px;}
  video{width:100%;background:var(--scuro);border-radius:9px;display:block;border:1px solid var(--linea);}
  video.v{aspect-ratio:9/16;max-height:52vh;margin:0 auto;}
  video.q{aspect-ratio:3/4;}
  .barra{margin-top:9px;}
  input[type=range]{width:100%;accent-color:var(--gold-deep);}
  .tempi{display:flex;justify-content:space-between;font-family:'Mazzard',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--inchiostro-3);margin-top:4px;}
  /* I DUE MONITOR. Sorgente a sinistra, Programma a destra, come in
     Premiere: sotto il video il timecode di dove sei e di quanto dura, la
     barretta con le parentesi di entrata e uscita, la fila dei comandi a
     icone. Le icone sono quelle: chi monta le riconosce senza leggere. */
  .monitori{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
  .monitor{min-width:0;position:relative;}
  .monitor + .monitor{border-left:1px solid var(--linea);padding-left:22px;}
  .monitor.attivo .mbarra{color:var(--gold-deep);}
  .monitor .capo{margin-bottom:5px;}
  .monitor .capo span{font-size:10px;}
  .monitor .capo .rif{color:var(--gold-deep);font-size:9px;letter-spacing:.2em;margin-right:6px;}
  .mbarra{display:flex;align-items:center;justify-content:space-between;margin-top:6px;
    font-family:'Mazzard',sans-serif;font-size:12px;font-weight:800;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;color:var(--inchiostro);}
  .mbarra .tot{color:var(--inchiostro-3);}
  .mbarra .fit{font-size:9px;letter-spacing:.14em;color:var(--fumo);text-transform:uppercase;}
  .scrub{position:relative;height:14px;margin-top:4px;border-radius:3px;
    background:rgba(10,15,36,.08);cursor:pointer;overflow:hidden;}
  .scrub .presa{position:absolute;top:0;bottom:0;background:rgba(201,162,75,.45);}
  .scrub .par{position:absolute;top:0;bottom:0;width:6px;background:var(--gold-deep);}
  .scrub .segno{position:absolute;top:3px;bottom:3px;width:2px;background:var(--inchiostro-3);}
  .scrub .segno.gol{background:var(--red);}
  .scrub .pez{position:absolute;top:2px;bottom:2px;background:var(--gold);border-right:1px solid var(--carta);}
  .scrub .pez.ora{background:var(--gold-deep);}
  .scrub .capo{position:absolute;top:0;bottom:0;width:2px;background:var(--red);margin:0;}
  .trasporto{display:flex;gap:2px;margin-top:5px;justify-content:center;align-items:center;flex-wrap:nowrap;}
  .trasporto .stacco{width:1px;height:18px;background:var(--linea);margin:0 5px;}
  .tr{width:30px;height:28px;border:1px solid transparent;border-radius:6px;background:transparent;
    color:var(--inchiostro);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .tr svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tr svg .p{fill:currentColor;stroke:none;}
  .tr:hover{background:var(--bianco);border-color:var(--linea);}
  .tr.oro{color:var(--gold-deep);} .tr.play{width:36px;}
  .tr:disabled{opacity:.3;cursor:default;}
  .binCapo{margin-top:var(--s3);}
  /* Il bin di Premiere: la clip e' il suo fotogramma. Passandoci sopra con
     il cursore la si scorre (hover scrub); i comandi compaiono solo allora. */
  .mini video.anteprima{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;background:#000;}
  .mini.scorro video.anteprima{opacity:1;}
  .mini .cursorino{position:absolute;top:0;bottom:0;width:1px;background:#2D8CEB;display:none;pointer-events:none;}
  .mini.scorro .cursorino{display:block;}
  .mini img,.mini video{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
  .scheda .comandi{display:none;}
  .scheda:hover .comandi{display:flex;}
  #evento option.futura{background:#FDECEC;color:#8E1216;}
  #evento optgroup{font-style:normal;color:var(--gold-deep);}
  #bin .griglia{grid-template-columns:1fr 1fr;}
  @media (max-width:1240px){#bin .griglia{grid-template-columns:1fr;}}
  .arch{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:11.5px;}
  .arch:hover{background:rgba(201,162,75,.14);}
  .arch .q{color:var(--fumo);font-size:10px;font-variant-numeric:tabular-nums;flex:none;width:44px;}
  .arch .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .arch .k{color:var(--fumo);font-size:9px;letter-spacing:.1em;flex:none;}
  .archPiu{font-size:11px;color:var(--gold-deep);cursor:pointer;padding:6px;font-weight:700;}

  button.b{font-family:'Mazzard',sans-serif;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;color:var(--inchiostro);background:var(--bianco);border:1px solid var(--linea);
    border-radius:8px;padding:0 13px;height:var(--alto);cursor:pointer;box-shadow:var(--ombra);
    display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
  button.b:hover:not(:disabled){border-color:var(--gold-deep);}
  button.b:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  button.b.oro{background:var(--gold);border-color:var(--gold-deep);color:var(--scuro);}
  button.b.rosso{background:var(--red);border-color:#B3151A;color:#fff;}
  button.b.scuro{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .fila{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;}
  .gruppo{display:flex;gap:7px;}
  .gruppo.pari button{flex:1 1 0;}
  .et{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--inchiostro-3);display:block;margin-bottom:6px;}
  .colonnina{display:flex;flex-direction:column;}
  .colonnina.cresce{flex:1 1 160px;}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:13px;color:var(--inchiostro);
    background:var(--bianco);border:1px solid var(--linea);border-radius:8px;
    padding:0 11px;height:var(--alto);width:100%;}
  select:focus,input:focus{outline:none;border-color:var(--gold-deep);}

  /* La riga del taglio: forma, entrata, uscita, durata, precisione, esporta.
     Una riga sola, e se lo schermo e' stretto si stringe invece di andare
     a capo — a capo vorrebbe dire far scorrere la pagina. */
  /* l'intestazione della finestra di lavorazione: che cosa sto guardando */
  .capo{display:flex;align-items:baseline;gap:var(--s2);margin:0 0 var(--s2);
    padding-bottom:var(--s1);border-bottom:1px solid var(--linea);
    font-family:'Mazzard',sans-serif;font-size:13px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;}
  .capo a{margin-left:auto;color:var(--gold-deep);text-decoration:none;font-size:10px;
    font-weight:700;letter-spacing:.14em;}
  .capo a:hover{color:var(--inchiostro);}
  /* la riga per segnare, sotto il taglio */
  .segnafila{display:flex;gap:var(--s1);align-items:center;margin-top:var(--s1);}
  .segnafila button.b{height:30px;}

  /* la sequenza che si sta montando */
  .sequenza{margin-top:var(--s2);border:1px solid var(--linea);border-radius:9px;
    background:var(--carta-2);padding:var(--s2);box-shadow:var(--ombra);}
  .sequenza.pronta{border-color:var(--linea-oro);}
  .sequenza.sopra{border-color:var(--gold-deep);background:rgba(201,162,75,.12);}
  .sequenza .cima{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1);}
  .sequenza .cima .et{margin:0;}
  .sequenza .cima button.b{height:28px;font-size:9px;padding:0 9px;}
  .sequenza .pezzi{display:flex;gap:var(--s1);overflow-x:auto;min-height:52px;align-items:stretch;}
  .pezzo{flex:0 0 132px;border:1px solid var(--linea);border-radius:7px;background:var(--bianco);
    padding:5px 7px;cursor:grab;position:relative;display:flex;flex-direction:column;justify-content:center;}
  .pezzo:hover{border-color:var(--linea-oro);}
  .pezzo.trascino{opacity:.4;}
  .pezzo .n{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;color:var(--gold-deep);
    letter-spacing:.1em;}
  .pezzo .tt{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pezzo .dd{font-size:10px;color:var(--inchiostro-3);}
  .pezzo .via{position:absolute;top:2px;right:5px;color:var(--inchiostro-3);text-decoration:none;
    font-size:13px;line-height:1;}
  .pezzo .via:hover{color:var(--red);}
  .esportati{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s1);
    font-size:11px;}
  .esportati .et{margin:0;}
  .esportati a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .esportati a:hover{color:var(--inchiostro);}
  .esportati .lavora{color:var(--inchiostro-2);}
  .esportati .male{color:#8E1216;}
  .suggeriti{margin-top:var(--s2);padding-top:var(--s2);border-top:1px dashed var(--linea);}
  .suggeriti .et{margin-bottom:var(--s1);}
  .sugg{flex:0 0 176px;border:1px dashed var(--linea);border-radius:7px;background:var(--carta);
    padding:5px 7px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;}
  .sugg:hover{border-style:solid;border-color:var(--gold-deep);background:rgba(201,162,75,.10);}
  .sugg.fuori{opacity:.45;cursor:not-allowed;}
  .sugg .mm{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;color:var(--gold-deep);
    letter-spacing:.1em;}
  .sugg .tt{font-size:11px;line-height:1.25;max-height:29px;overflow:hidden;}
  .sequenza .invito{color:var(--inchiostro-3);font-size:12px;display:flex;align-items:center;
    justify-content:center;width:100%;border:1px dashed var(--linea-oro);border-radius:7px;}
  /* mentre si trascina, la striscia si fa vedere anche se e' vuota */
  body.trascinando .sequenza[hidden]{display:block!important;}
  .scheda[draggable]{cursor:grab;}
  .segnafila input{flex:1 1 auto;}
  .scheda-sotto{margin-top:var(--s4);}
  .scheda-sotto .dati td:first-child{width:46%;font-size:11px;}
  .scheda-sotto .dati td{padding:5px 0;font-size:12px;}
  .scheda-sotto .voce{padding:7px 9px;margin-bottom:var(--s1);}
  .scheda-sotto .voce .nome{font-size:11px;}
  .scheda-sotto .voce .dett{font-size:10px;}
  .scheda-sotto .voce .azioni{gap:7px;flex-wrap:wrap;}
  .scheda-sotto .voce a{font-size:9px;letter-spacing:.1em;}

  .taglio{display:flex;gap:var(--s1);align-items:center;margin-top:var(--s2);flex-wrap:nowrap;}
  .taglio .gruppo{gap:var(--s1);}
  .taglio button.b{padding:0 12px;}
  .taglio .gruppo{flex:0 0 auto;}
  .taglio button.b{padding:0 12px;white-space:nowrap;height:32px;}
  .taglio button.b i{font-style:normal;opacity:.55;margin-left:7px;font-size:9px;
    border:1px solid currentColor;border-radius:3px;padding:0 4px;}
  .taglio button.grosso{flex:1 1 auto;padding:0 12px;font-size:11px;height:32px;}
  .inout{display:flex;gap:var(--s1);flex:0 0 auto;min-width:0;}
  .inout .box{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;
    height:var(--alto);min-width:80px;text-align:center;display:flex;flex-direction:column;
    align-items:center;justify-content:center;box-shadow:var(--ombra);}
  .inout .box.messo{border-color:var(--gold-deep);background:rgba(201,162,75,.10);}
  .numeroni{font-family:'Mazzard',sans-serif;font-weight:800;font-size:12px;line-height:1.05;}
  .numeroni small{display:block;font-size:8px;letter-spacing:.2em;color:var(--inchiostro-3);
    font-weight:700;margin-bottom:1px;}

  /* ── la console: qui si opera, ed e' scura apposta ──────────────── */
  .console{background:var(--scuro);color:var(--carta);border-radius:10px;

<script>
(function () {

  var FPS = 25;

      var r = document.createElement("div"); r.className = "arch";

                    p.titolo + '</span><span class="k">' + (aperte[p.rec] ? "aperta" : (p.pezzi > 1 ? p.pezzi + " parti" : (p.soloS3 ? "S3" : ""))) + '</span>';

  // ── CARICARE UN FILE ────────────────────────────────────────────
  //
  //  Il file viaggia a pezzi: un video da un giga in una richiesta sola non
  //  arriva, e se cade si ricomincia da capo. A pezzi si vede anche a che
  //  punto e', che su un caricamento lungo e' l'unica cosa che tiene calmo
  //  chi guarda.
  var PEZZO = 4 * 1024 * 1024;

  function leggiPezzo(file, da) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(",")[1] || ""); };
      fr.onerror = function () { rej(new Error("non riesco a leggere il file")); };
      fr.readAsDataURL(file.slice(da, Math.min(file.size, da + PEZZO)));
    });
  }

  function carica(file) {
    if (!file) return;
    if (!/^video\//.test(file.type) && !/\.(mp4|mov|m4v|mkv|ts)$/i.test(file.name)) {
      dice("Questo non sembra un video."); return;
    }
    var ev = el("evento") ? el("evento").selectedOptions[0] : null;
    var barra = el("avanza");
    barra.hidden = false; barra.firstElementChild.style.width = "0";
    el("btnCarica").disabled = true;
    dice("Carico " + file.name + "…", true);

    manda({ tipo: "clip-carica-inizia", peso: file.size,
            titolo: file.name.replace(/\.[^.]+$/, ""),
            evento: (el("evento") ? el("evento").value.replace(/^arc:/, "") : ""),
            competizione: (ev && ev.dataset ? ev.dataset.comp : "") })
      .then(function (d) {
        var id = d.id, da = 0;
        function avanti() {
          if (da >= file.size) return manda({ tipo: "clip-carica-fine", id: id });
          return leggiPezzo(file, da).then(function (b64) {
            return manda({ tipo: "clip-carica-pezzo", id: id, pezzo: b64 });
          }).then(function (r) {
            da += PEZZO;
            barra.firstElementChild.style.width = Math.min(100, r.quanto || 0) + "%";
            return avanti();
          });
        }
        return avanti();
      })
      .then(function (d) {
        barra.hidden = true; el("btnCarica").disabled = false;
        REG = d.reg; ASSET = 0;
        dice("Caricato: " + d.reg.titolo + " · " + orologio(d.reg.durata) + ".", true);
        aggiorna();
      })
      .catch(function (e) {
        barra.hidden = true; el("btnCarica").disabled = false;
        dice(e.message);
      });
  }

  el("btnCarica").addEventListener("click", function () { el("fileIn").click(); });
  el("fileIn").addEventListener("change", function () { carica(this.files && this.files[0]); this.value = ""; });
  (function () {
    var z = el("zonaCarica");
    ["dragenter", "dragover"].forEach(function (t) {
      z.addEventListener(t, function (e) { e.preventDefault(); z.classList.add("sopra"); });
    });
    ["dragleave", "drop"].forEach(function (t) {
      z.addEventListener(t, function (e) { e.preventDefault(); z.classList.remove("sopra"); });
    });
    z.addEventListener("drop", function (e) {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) carica(e.dataTransfer.files[0]);
    });
  })();

  // Il telaio prende la forma del formato scelto, e si tiene dentro
  // l'altezza che la colonna ha davvero: la pagina non deve mai scorrere.
  function telaioForma() {
    var t = el("telaio"), tp = el("telaioP"), c = el("centro"); if (!t || !c) return;
    var col = c.parentElement;
    if (!col || !col.clientHeight || !c.clientWidth) { requestAnimationFrame(telaioForma); return; }
    // Si misura la COLONNA e si toglie quello che sta sotto i video: barre,
    // comandi, la fila del taglio, la sequenza se c'e'. Quel che resta se lo
    // dividono i due monitor, ognuno alto quanto gli permette la sua forma.
    var sotto = 0;
    ["capo", "mbarra", "scrub", "trasporto"].forEach(function (k) {
      var e = el("monS").querySelector("." + k); if (e) sotto += e.offsetHeight + 5;
    });
    var tg = c.querySelector(".taglio"); if (tg) sotto += tg.offsetHeight + 12;
    // la timeline e' fuori dalla colonna: la colonna e' gia' alta il giusto
    var largo = (c.clientWidth - 28 - 23) / 2 - 2;
    var alto = Math.max(120, col.clientHeight - sotto - 44);
    var r = { "16:9": 16/9, "3:4": 3/4, "9:16": 9/16 }[formato] || 16/9;
    var w = Math.min(largo, alto * r), h = w / r;
    t.style.width = Math.round(w) + "px"; t.style.height = Math.round(h) + "px";
    if (tp) { var wp = Math.min(largo, alto * 16/9); tp.style.width = Math.round(wp) + "px"; tp.style.height = Math.round(wp * 9/16) + "px"; }
    if (el("forma")) el("forma").textContent = formato;
  }
  window.addEventListener("resize", telaioForma);

  // ── TRASCINARE ──────────────────────────────────────────────────
  //
  //  Una clip si prende da destra e si lascia cadere nella striscia: dove
  //  la lasci, li' finisce. Dentro la striscia i pezzi si riordinano allo
  //  stesso modo. Nessun comando "aggiungi": il gesto e' il comando.
  var pezzoTrascinato = null;

  // ── IL PROGRAMMA ────────────────────────────────────────────────
  //
  //  Il monitor di destra riproduce la SEQUENZA: i pezzi uno dopo l'altro,
  //  ognuno dalla sua entrata alla sua uscita, senza esportare niente. E'
  //  il modo di rivedere l'highlight prima di mandarlo fuori — e di
  //  accorgersi che il terzo pezzo e' troppo lungo quando costa ancora
  //  niente accorciarlo.
  var MON = "s";
  var PROG = { i: -1, da: 0, a: null, hls: null };
  function pezziProg() { return (SEQ && SEQ.pezzi) || []; }
  function durataSeq() { return pezziProg().reduce(function (a, x) { return a + (x.fuori - x.dentro); }, 0); }
  function regDiSeq() {
    if (!SEQ) return null;
    return REGISTRAZIONI.filter(function (r) { return r.id === SEQ.reg; })[0] || null;
  }
  // da dove si prendono i byte di un pezzo: la clip gia' tagliata se c'e',
  // altrimenti il materiale della partita, dall'entrata all'uscita
  function sorgentePezzo(x) {
    if (x.clip) {
      var cl = CLIP.filter(function (k) { return k.id === x.clip; })[0];
      // il file della clip vale finche' il pezzo e' quello: se lo si e'
      // accorciato o allungato sulla timeline, si torna alla partita
      if (cl && cl.stato === "pronta" && Math.abs(cl.dentro - x.dentro) < 0.05 && Math.abs(cl.fuori - x.fuori) < 0.05)
        return { url: BASE + "/clip/_clip/" + x.clip + ".mp4", da: 0, a: null };
    }
    var r = regDiSeq(); if (!r) return null;
    if (r.materiale === "archivio" && r.via) return { url: r.via, da: x.dentro, a: x.fuori };
    if (r.materiale === "integrale") return { url: BASE + "/clip/" + r.id + "/integrale.mp4", da: x.dentro, a: x.fuori };
    if (r.materiale === "segmenti") return { url: BASE + "/clip/" + r.id + "/live.m3u8", da: x.dentro, a: x.fuori, hls: true };
    return null;
  }
  function progVai(i, riproduci, dentroIlPezzo) {
    var v = el("programma"), pz = pezziProg(); if (!v || !pz.length) return;
    i = Math.max(0, Math.min(pz.length - 1, i));
    var src = sorgentePezzo(pz[i]);
    if (!src) return dice("Questo pezzo non e' ancora riproducibile qui.");
    var stesso = (PROG.url === src.url);
    PROG.i = i; PROG.da = src.da; PROG.a = src.a; PROG.url = src.url;
    var avvia = function () {
      try { v.currentTime = src.da + (dentroIlPezzo || 0); } catch (e) {}
      if (riproduci) v.play().catch(function () {});
      disegnaProgramma();
    };
    if (stesso) return avvia();
    if (PROG.hls) { PROG.hls.destroy(); PROG.hls = null; }
    if (src.hls && window.Hls && Hls.isSupported()) {
      PROG.hls = new Hls({ backBufferLength: 600 });
      PROG.hls.loadSource(src.url); PROG.hls.attachMedia(v);
      PROG.hls.on(Hls.Events.MANIFEST_PARSED, avvia);
    } else {
      var f = function () { v.removeEventListener("loadedmetadata", f); avvia(); };
      v.addEventListener("loadedmetadata", f);
      v.src = src.url; v.load();
    }
  }
  function disegnaProgramma() {
    var sc = el("scrubP"), v = el("programma"); if (!sc) return;
    var pz = pezziProg(), tot = durataSeq();
    if (el("capoSeq")) el("capoSeq").textContent = SEQ ? (SEQ.titolo || "sequenza") + " · " + pz.length + " pezzi" : "nessuna sequenza";
    if (el("pTot")) el("pTot").textContent = tc(tot);
    if (!pz.length) { sc.innerHTML = ""; if (el("pPos")) el("pPos").textContent = tc(0); targaP(null); return; }
    var acc = 0, out = [], oraT = 0;
    pz.forEach(function (x, i) {
      var d = x.fuori - x.dentro;
      out.push('<span class="pez' + (i === PROG.i ? " ora" : "") + '" style="left:' + (acc / tot * 100) +
               '%;width:' + (d / tot * 100) + '%" title="' + String(x.titolo || "").replace(/"/g, "") + '"></span>');
      if (i === PROG.i && v) oraT = acc + Math.max(0, (v.currentTime || 0) - PROG.da);
      acc += d;
    });
    if (PROG.i >= 0) out.push('<span class="capo" style="left:' + (oraT / tot * 100) + '%"></span>');
    sc.innerHTML = out.join("");
    if (el("pPos")) el("pPos").textContent = tc(oraT);
    var x = pz[PROG.i];
    targaP(x ? ((PROG.i + 1) + ". " + x.titolo) : null, x ? Math.round(x.fuori - x.dentro) + "s" : "");
    disegnaTimeline();
  }
  function targaP(nome, coda) {
    var t = el("targaP"); if (!t) return;
    if (!nome) { t.hidden = true; return; }
    t.querySelector("b").textContent = nome; t.querySelector("i").textContent = coda || "";
    t.hidden = false;
  }
  // un fotogramma preso dal server, dove ffmpeg lo estrae dal file vero
  function fotogramma(reg, secondi) {
    if (!reg) return dice("Scegli prima un contenuto.");
    manda({ tipo: "clip-fotogramma", reg: reg, secondi: Math.max(0, secondi || 0) })
      .then(function (d) { window.open(BASE + d.file + "?scarica=1", "_blank"); })
      .catch(function (e) { dice(e.message); });
  }

  function disegnaSequenza() {
    disegnaProgramma();
    var box = el("sequenza"); if (!box) return;
    var pezzi = (SEQ && SEQ.pezzi) || [];
    var eraNascosta = box.hidden;
    box.hidden = !pezzi.length && !(SEQ && SEQ.suggerimenti && SEQ.suggerimenti.length);
    // Comparendo, la striscia si prende dello spazio: il visore deve
    // restringersi, altrimenti la sequenza finisce sotto il bordo e sembra
    // che il trascinamento non abbia fatto niente.
    if (eraNascosta !== box.hidden) setTimeout(telaioForma, 0);
    box.className = "sequenza" + (pezzi.length ? " pronta" : "");
    var c = el("seqPezzi"); if (!c) return;
    el("seqConto").textContent = pezzi.length
      ? pezzi.length + " pezzi · " + orologio(pezzi.reduce(function (a, x) { return a + (x.fuori - x.dentro); }, 0))
      : "";
    c.innerHTML = "";
    disegnaSuggerimenti(); disegnaEsportati();
    if (!pezzi.length) {
      c.innerHTML = '<div class="invito">trascina qui una clip per cominciare a montare</div>';
      return;
    }
    pezzi.forEach(function (x, i) {
      var d = document.createElement("div");
      d.className = "pezzo"; d.draggable = true; d.dataset.pezzo = x.id;
      d.innerHTML = "<div class='n'>" + (i + 1) + "</div>" +
        "<div class='tt' title='" + String(x.titolo).replace(/'/g, "") + "'>" + x.titolo + "</div>" +
        "<div class='dd'>" + Math.round(x.fuori - x.dentro) + "s · " + orologio(x.dentro) + "</div>" +
        "<a href='#' class='via' title='togli'>×</a>";
      d.addEventListener("click", function (e) {
        if (e.target.classList.contains("via")) return;
        tornaAlContenuto();
        var giri = 0, att = setInterval(function () {
          var v = el("player");
          if (++giri > 30) return clearInterval(att);
          if (!v || !v.duration) return;
          clearInterval(att); seguiLive = false; v.currentTime = x.dentro; v.play().catch(function () {});
        }, 250);
      });
      d.querySelector(".via").addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        manda({ tipo: "clip-hl-pezzo", seq: SEQ.id, pezzo: x.id, togli: 1 })
          .then(function (r) { SEQ = r.seq; disegnaSequenza(); destraMateriale(); })
          .catch(function (er) { dice(er.message); });
      });
      d.addEventListener("dragstart", function (e) {
        pezzoTrascinato = x.id; d.classList.add("trascino");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", "pezzo:" + x.id); } catch (er) {}
      });
      d.addEventListener("dragend", function () { pezzoTrascinato = null; d.classList.remove("trascino"); });
      c.appendChild(d);
    });
  }

  function disegnaEsportati() {
    var box = el("seqEsportati"); if (!box || !SEQ) return;
    var e = SEQ.export || {}, fatti = SEQ.esportati || {};
    var righe = [];
    if (e.stato === "lavora") {
      righe.push("<span class='lavora'>esporto " + (e.formato || "") +
                 (e.tutti ? " (e poi gli altri)" : "") + "…</span>");
    }
    if (e.stato === "errore") righe.push("<span class='male'>export fallito: " + (e.errore || "") + "</span>");
    Object.keys(fatti).forEach(function (f) {
      righe.push("<a href='" + BASE + fatti[f].file + "?scarica=1'>" + f + " · " +
                 orologio(fatti[f].durata) + "</a>");
    });
    if (SEQ.premiere) righe.push("<a href='" + BASE + SEQ.premiere.file + "?scarica=1'>XML Premiere</a>");
    box.innerHTML = righe.length ? "<span class='et'>Pronti</span>" + righe.join("") : "";
  }

  function disegnaSuggerimenti() {
    var box = el("seqSugg"); if (!box) return;
    var g = (SEQ && SEQ.suggerimenti) || [];
    box.hidden = !g.length;
    if (!g.length) return;
    var dentro = g.filter(function (x) { return x.collocabile; }).length;
    el("suggConto").textContent = g.length + (dentro < g.length ? " · " + dentro + " collocabili" : "");
    var c = el("suggPezzi"); c.innerHTML = "";
    g.forEach(function (x) {
      var d = document.createElement("div");
      d.className = "sugg" + (x.collocabile ? "" : " fuori");
      d.title = x.collocabile ? "aggiungi alla sequenza"
        : "non so dove cade: segna il fischio d’inizio del tempo giusto";
      d.innerHTML = "<div class='mm'>" + x.minuto + (x.tipo ? " · " + x.tipo : "") +
        (x.hl ? " ★" : "") + "</div><div class='tt'>" + x.testo + "</div>";
      if (x.collocabile) d.addEventListener("click", function () {
        manda({ tipo: "clip-hl-suggerimento", seq: SEQ.id, suggerimento: x.id })
          .then(function (r) { SEQ = r.seq; disegnaSequenza(); dice("Aggiunto: " + x.testo.slice(0, 40) + "…", true); })
          .catch(function (e) { dice(e.message); });
      });
      c.appendChild(d);
    });
  }

  // in quale posizione cade quello che sto lasciando
  function posizioneDiCaduta(x) {
    var c = el("seqPezzi");
    var figli = [].slice.call(c.querySelectorAll(".pezzo"));
    for (var i = 0; i < figli.length; i++) {
      var b = figli[i].getBoundingClientRect();
      if (x < b.left + b.width / 2) return i;
    }
    return figli.length;
  }

  (function () {
    var box = el("sequenza");
    if (!box) return;
    ["dragenter", "dragover"].forEach(function (t) {
      box.addEventListener(t, function (e) {
        e.preventDefault(); e.dataTransfer.dropEffect = "move";
        box.classList.add("sopra");
      });
    });
    box.addEventListener("dragleave", function () { box.classList.remove("sopra"); });
    box.addEventListener("drop", function (e) {
      e.preventDefault(); box.classList.remove("sopra");
      var dove = posizioneDiCaduta(e.clientX);
      var dati = "";
      try { dati = e.dataTransfer.getData("text/plain") || ""; } catch (er) {}

      if (pezzoTrascinato || dati.indexOf("pezzo:") === 0) {
        // riordino: si rimette la lista nell'ordine nuovo
        var id = pezzoTrascinato || dati.slice(6);
        var ordine = SEQ.pezzi.map(function (x) { return x.id; }).filter(function (x) { return x !== id; });
        ordine.splice(Math.min(dove, ordine.length), 0, id);
        manda({ tipo: "clip-hl-ordina", seq: SEQ.id, ordine: ordine })
          .then(function (r) { SEQ = r.seq; disegnaSequenza(); })
          .catch(function (er) { dice(er.message); });
        return;
      }
      if (dati.indexOf("clip:") === 0) {
        manda({ tipo: "clip-hl-aggiungi", clip: dati.slice(5), seq: SEQ ? SEQ.id : "", dove: dove })
          .then(function (r) {
            SEQ = r.seq; disegnaSequenza(); destraMateriale();
            dice(r.gia ? "Quella clip era già nella sequenza." : "Pezzo aggiunto.", !r.gia);
          })
          .catch(function (er) { dice(er.message); });
      }
    });
  })();

  // ── LA TRACCIA ──────────────────────────────────────────────────
  //
  //  Un righello con i minuti, i segni della partita, la parte scelta con
  //  due maniglie, la testina. Si legge in un colpo d'occhio che cosa si
  //  sta per tagliare, invece di doverlo immaginare guardando due numeri.
  var LENTE = 1;                 // 1 = tutta la partita, 8 = un ottavo

  function durataAperta() {
    var v = el("player");
    return (REG && REG.durata) || (v && v.duration) || 0;
  }
  // La finestra che si vede: con la lente stretta segue la testina.
  function finestra() {
    var tot = durataAperta(), v = el("player");
    if (!tot) return null;
    if (LENTE <= 1) return { a: 0, b: tot, tot: tot };
    var largo = tot / LENTE, meta = (v ? v.currentTime : 0) - largo / 2;
    var a = Math.max(0, Math.min(tot - largo, meta));
    return { a: a, b: a + largo, tot: tot };
  }
  function xDi(t, f, largo) { return (t - f.a) / (f.b - f.a) * largo; }

  function disegnaPista() {
    var p = el("pista"); if (!p) return;
    var f = finestra(), v = el("player");
    if (!f) { p.innerHTML = ""; return; }
    var largo = p.clientWidth || 600, dentroF = f.b - f.a, out = [];

    // il righello: un passo che dia una decina di tacche, non trecento
    var passi = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800];
    var passo = passi.find(function (x) { return dentroF / x <= 14; }) || 3600;
    for (var t = Math.ceil(f.a / passo) * passo; t < f.b; t += passo) {
      var x = xDi(t, f, largo), grande = (t % (passo * 5) === 0);
      out.push('<span class="tacca' + (grande ? " grande" : "") + '" style="left:' + x + 'px"></span>');
      if (grande) out.push('<span class="ora" style="left:' + x + 'px">' + orologio(t) + '</span>');
    }
    out.push('<span class="righello"></span>');

    ((REG && REG.marker) || []).forEach(function (m) {
      if (m.secondi < f.a || m.secondi > f.b) return;
      out.push('<span class="segno' + (/gol|goal/i.test(m.tipo || m.testo || "") ? " gol" : "") +
               '" style="left:' + xDi(m.secondi, f, largo) + 'px" data-vai="' + m.secondi +
               '" title="' + String(m.testo || "").replace(/"/g, "") + '"></span>');
    });

    if (dentro !== null || fuori !== null) {
      var a = dentro === null ? f.a : dentro, b = fuori === null ? f.b : fuori;
      var xa = Math.max(0, xDi(a, f, largo)), xb = Math.min(largo, xDi(b, f, largo));
      if (xb > xa) out.push('<span class="presa" style="left:' + xa + 'px;width:' + (xb - xa) + 'px"></span>');
      if (dentro !== null && xa >= -5 && xa <= largo)
        out.push('<span class="maniglia" data-lato="in" style="left:' + (xa - 4) + 'px"></span>');
      if (fuori !== null && xb >= -5 && xb <= largo)
        out.push('<span class="maniglia" data-lato="out" style="left:' + (xb - 5) + 'px"></span>');
    }
    if (v) out.push('<span class="capo" style="left:' + xDi(v.currentTime, f, largo) + 'px"></span>');
    p.innerHTML = out.join("");
  }

  // Trascinare una maniglia sposta entrata o uscita. E' il gesto che in
  // Premiere si fa sulle estremita' di una clip, ed e' l'unico modo per
  // aggiustare un taglio senza rimettersi a contare i secondi.
  function tempoAlPuntatore(e) {
    var p = el("pista"), f = finestra(); if (!p || !f) return null;
    var r = p.getBoundingClientRect();
    var q = (e.clientX - r.left) / r.width;
    return Math.max(0, Math.min(f.tot, f.a + q * (f.b - f.a)));
  }
  function attaccaPista() {
    var p = el("pista"); if (!p || p.dataset.viva) return;
    p.dataset.viva = "1";
    var lato = null;
    p.addEventListener("mousedown", function (e) {
      if (e.target.dataset && e.target.dataset.lato) { lato = e.target.dataset.lato; e.preventDefault(); return; }
      if (e.target.dataset && e.target.dataset.vai) { el("player").currentTime = +e.target.dataset.vai; return; }
      var t = tempoAlPuntatore(e);
      if (t !== null) { seguiLive = false; el("player").currentTime = t; }
    });
    document.addEventListener("mousemove", function (e) {
      if (!lato) return;
      var t = tempoAlPuntatore(e); if (t === null) return;
      if (lato === "in") { dentro = (fuori !== null && t >= fuori) ? fuori - 0.2 : t; }
      else { fuori = (dentro !== null && t <= dentro) ? dentro + 0.2 : t; }
      mostraInOut();
    });
    document.addEventListener("mouseup", function () { lato = null; });
  }

  // ── LA TIMELINE E' LA SEQUENZA ──────────────────────────────────
  //
  //  Come in Premiere: sotto i monitor non c'e' la partita, c'e' il
  //  montaggio. V1 con i blocchi delle clip e la loro miniatura, A1 con
  //  l'audio, il righello in timecode, la testina rossa che e' la stessa
  //  del monitor Programma. Si trascina un blocco per riordinare, se ne
  //  prende un bordo per accorciarlo o allungarlo, si clicca sul righello
  //  per andare li'. Una clip dal progetto si lascia cadere dove si vuole.
  //  Canc toglie il pezzo scelto.
  var TL = { sel: null, ghost: null, ins: null, trim: null, drag: null };

  function progPos() {
    var pz = pezziProg(), v = el("programma"); if (PROG.i < 0 || !pz[PROG.i]) return 0;
    var acc = 0;
    for (var i = 0; i < PROG.i; i++) acc += pz[i].fuori - pz[i].dentro;
    var d = pz[PROG.i].fuori - pz[PROG.i].dentro;
    return acc + Math.max(0, Math.min(d, (v ? v.currentTime : 0) - PROG.da));
  }
  function finestraSeq() {
    var tot = durataSeq(); if (!tot) return null;
    if (LENTE <= 1) return { a: 0, b: tot, tot: tot };
    var largo = tot / LENTE, a = Math.max(0, Math.min(tot - largo, progPos() - largo / 2));
    return { a: a, b: a + largo, tot: tot };
  }
  function pulito(x) { return String(x || "").replace(/[<>&"]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]; }); }

  function disegnaTimeline() {
    var p = el("tlPista"), rig = el("tlRighello"), v1 = el("tlV1"), a1 = el("tlA1"); if (!p || !rig) return;
    var pz = pezziProg(), tot = durataSeq(), largo = p.clientWidth || 900;
    var nome = el("tlNome");
    if (nome) nome.textContent = SEQ ? (SEQ.titolo || "sequenza") : "nessuna sequenza";
    if (el("seqMp4")) el("seqMp4").textContent = "Solo " + formato;
    if (el("tlTc")) el("tlTc").textContent = tc(progPos());
    var vuoto = el("tlVuoto");
    if (!pz.length) {
      rig.innerHTML = ""; v1.innerHTML = ""; a1.innerHTML = "";
      el("tlTestina").hidden = true; el("tlIns").hidden = true;
      if (!vuoto) { vuoto = document.createElement("div"); vuoto.className = "tlvuoto"; vuoto.id = "tlVuoto"; p.appendChild(vuoto); }
      vuoto.textContent = "Sequenza vuota: entrata, uscita, virgola — oppure trascina qui una clip dal progetto.";
      return;
    }
    if (vuoto) vuoto.remove();
    var f = finestraSeq();
    var X = function (t) { return (t - f.a) / (f.b - f.a) * largo; };

    // il righello: timecode pieni alle tacche grandi, come Premiere
    var passi = [1, 2, 4, 8, 10, 15, 30, 60, 120, 300, 600];
    var passo = passi.find(function (x) { return (f.b - f.a) / x <= 10; }) || 1800;
    var r = [];
    for (var t = Math.ceil(f.a / (passo / 4)) * (passo / 4); t < f.b; t += passo / 4) {
      var grande = Math.abs(t / passo - Math.round(t / passo)) < 1e-6;
      r.push('<span class="tacca' + (grande ? " grande" : "") + '" style="left:' + X(t) + 'px"></span>');
      if (grande) r.push('<span class="ora" style="left:' + X(t) + 'px">' + tc(t) + '</span>');
    }
    // la barra gialla: l'area di lavoro, cioe' tutta la sequenza
    var la = Math.max(0, X(0)), lb = Math.min(largo, X(tot));

  // Il video non e' qui: sta in un secchio S3 da sette giga. Non lo si
  // scarica — si chiede un indirizzo firmato e lo si apre al secondo
  // giusto, che e' l'unica cosa che interessa.
  function apriDaArchivio(rec, dove, nome, pezzo) {
    dice("Apro dall'archivio\u2026");
    manda({ tipo: "clip-archivio-apri", rec: rec, pezzo: pezzo || 0 }).then(function (d) {
      var sc = el("foglio"); if (sc) sc.remove();
      guardando = null;
      return aggiorna().then(function () {
        vaiA(d.reg.id, (dove || dove === 0) ? dove : null, "tutto");
        // il file d'archivio ci mette qualche secondo a farsi conoscere: il
        // salto si aggancia all'evento, non a un'attesa a tempo
        var v = el("player");
        if (v && dove) {
          var vai = function () {
            if (!v.duration) return;
            try { v.currentTime = dove; } catch (e) {}
            v.removeEventListener("loadedmetadata", vai);
            v.removeEventListener("durationchange", vai);
          };
          v.addEventListener("loadedmetadata", vai);
          v.addEventListener("durationchange", vai);
          vai();
        }
        dice(d.giaAperta ? "Gi\u00e0 fra i contenuti" :
             "Dall'archivio \u00b7 nessun byte copiato", true);
      });
    }).catch(function (e) { dice(e.message); });

  function apri(r) {
    var v = el("player"); if (!v) return;
    // L'indirizzo di una partita d'archivio e' firmato e cambia a ogni giro
    // di aggiornamento: riattaccarlo vorrebbe dire ricaricare il video ogni
    // tre secondi e riportarlo a zero sotto le mani di chi sta lavorando.
    if (apertaId === r.id && (hls || r.materiale === "archivio")) return;
    apertaId = r.id;
    if (hls) { hls.destroy(); hls = null; }
    // Una partita si apre FERMA su un fotogramma — il calcio d'inizio se lo
    // si conosce — e poi decide chi guarda se far partire. Il live invece
    // parte: e' live.
    var fermoSu = function () {
      var k = (r.kickoff && r.kickoff["1"]) || 0;
      var vai = function () { v.removeEventListener("loadedmetadata", vai); try { if (k) v.currentTime = k; } catch (e) {} };
      v.addEventListener("loadedmetadata", vai);
      v.preload = "auto"; v.load();
    };
    if (r.materiale === "archivio") {                 // i byte sono su S3, non qui
      if (r.via) { v.src = r.via; fermoSu(); }
      return;
    }
    if (r.materiale === "integrale") { v.src = BASE + "/clip/" + r.id + "/integrale.mp4"; fermoSu(); return; }
    if (r.materiale === "scaduto") { v.removeAttribute("src"); v.load(); return; }
    var indirizzo = BASE + "/clip/" + r.id + "/live.m3u8";
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDuration: 8, backBufferLength: 3600 });
      hls.on(Hls.Events.ERROR, function (ev, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(function () { try { hls.startLoad(); } catch (e) {} }, 2000);
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(indirizzo); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = indirizzo; }
    v.play().catch(function () {});
  }

    // Mille voci in una tendina non si scorrono: si scrive e restano

    el("eventoCerca").addEventListener("input", function () {
      var q = senzaAccentiPagina(this.value), sel = el("evento");
      var parole = q.split(/\s+/).filter(Boolean);
      Array.prototype.forEach.call(sel.options, function (o) {
        if (!o.value) return;
        var t = senzaAccentiPagina(o.textContent);
        o.hidden = !parole.every(function (p) { return t.indexOf(p) >= 0; });
      });
      Array.prototype.forEach.call(sel.querySelectorAll("optgroup"), function (g) {
        g.hidden = !Array.prototype.some.call(g.children, function (o) { return !o.hidden; });
      });
    });
    el("eventoCerca").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var primo = Array.prototype.filter.call(el("evento").options, function (o) { return o.value && !o.hidden; })[0];
      if (primo) { el("evento").value = primo.value; el("evento").dispatchEvent(new Event("change")); }
    });
    function senzaAccentiPagina(x) {
      return String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    // Una sola forma per tutte le date della tendina, live e archivio:
    // gg/mm/aa e poi la partita. Quelle ancora da giocare hanno un fondo
    // rosso leggero, cosi' si vede a colpo d'occhio dove finisce il passato.
    function dataOpz(iso) {
      var d = new Date(iso); if (!isFinite(d)) return "        ";

      // TUTTE, in tendina: con il filtro testuale seimila voci non fanno paura,

      dd.partite.forEach(function (p) {

        g.appendChild(o);

      sel.appendChild(g);

    }).catch(function () {});

    manda({ tipo:"clip-sorgenti" }).then(function (dd) {
      (dd.sorgenti || []).forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.url; o.textContent = x.nome + " · " + x.campo + " · " + x.tipo.toUpperCase();

    // L'indirizzo a mano serve una volta su venti: sta nascosto finche' non

        sorgente: el("sorgente").value ? el("sorgente").selectedOptions[0].textContent : "a mano" };
      Object.keys(extra).forEach(function (k) { corpo[k] = extra[k]; });
      if (!corpo.url) { corpo.ricevi = true; corpo.sorgente = "in ascolto"; }
      return manda(corpo).then(function (dd) { REG = dd.reg; apertaId = ""; aggiorna(); return dd; });

    el("btnRec").addEventListener("click", function () {
      if (REG && REG.stato === "registra" && !REG.guarda) {

      }).catch(function (e) { dice(e.message); });

    el("btnGuarda").addEventListener("click", function () {
      if (REG && REG.guarda && REG.stato === "registra") {
        manda({ tipo:"clip-ferma", id:REG.id }).then(function () { REG = null; apertaId = ""; aggiorna(); })
          .catch(function (e) { dice(e.message); });

  // TOGLIERE UNA CLIP.
  //
  //  Due passi, non uno: "elimina" diventa "sicuro?" e solo il secondo click
  //  cancella. Un file video non torna indietro, e in una griglia di
  //  francobolli tutti uguali il dito sbaglia bersaglio facilmente.
  //
  //  Serve la chiave di REGIA, non quella di lavoro: tagliare e guardare li
  //  puo' fare chiunque, buttare no. Se non ce l'hai in tasca te la chiede
  //  al momento, invece di dirti solo che non si puo'.
  function elimina(id, quando) {
    manda({ tipo: "clip-elimina", clip: id })
      .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
      .catch(function (e) {
        if (!/chiave/i.test(e.message)) { dice(e.message); return; }
        var k = window.ChiaveComoTV ? ChiaveComoTV.valore("comando",
          "Per eliminare una clip serve la chiave di COMANDO della regia.\n\n" +
          "Tagliare e guardare li puo' fare chiunque; buttare no.") : "";
        if (!k) { dice("Serve la chiave di comando della regia."); return; }
        TOKEN = k;
        manda({ tipo: "clip-elimina", clip: id })
          .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
          .catch(function (e2) { dice(e2.message); });
      });
  }
  // il tasto che si trasforma in domanda invece di aprire una finestra
  function tastoElimina(id, dopo) {
    var a = document.createElement("a");
    a.href = "#"; a.textContent = "elimina"; a.className = "togli";
    var chiesto = false, torna = null;
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (!chiesto) {
        chiesto = true; a.textContent = "sicuro?"; a.classList.add("sicuro");
        torna = setTimeout(function () {
          chiesto = false; a.textContent = "elimina"; a.classList.remove("sicuro");
        }, 4000);
        return;
      }
      clearTimeout(torna);
      a.textContent = "…";
      elimina(id, dopo);
    });
    return a;
  }

        if (f !== FORMA) return false;

        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
        if (f !== FORMA) return;

        el("btnGenera").addEventListener("click", function () {

          manda({ tipo: "clip-hl-genera", reg: REG.id,
                  pre: parseFloat(el("hlPre").value) || 8,

            .then(function (d) { SEQ = d.seq; ASSET = 0; destraMateriale();

        });
      } else {
        c.innerHTML = '<div class="vuoto">Niente con questa linguetta, su questa partita.</div>';
      }
      schedaSotto(null); return;
    }
    var g = document.createElement("div"); g.className = "griglia"; c.innerHTML = ""; c.appendChild(g);
    lista.forEach(function (a, i) {
      var fmt = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
      var dur = a.t === "clip" ? (a.o.durataVera || a.o.durata) + "s"
              : a.t === "integrale" ? orologio(a.o.durata)
              : orologio((a.o.pezzi || []).reduce(function (s2, x) { return s2 + (x.fuori - x.dentro); }, 0));
      var nome = a.t === "clip" ? a.o.titolo : a.t === "integrale" ? "Integrale" : a.o.titolo;
      var d = document.createElement("div");
      d.className = "scheda" + (i === ASSET ? " scelta" : "");

      // IL FOTOGRAMMA. Una griglia di rettangoli vuoti non e' un archivio:
