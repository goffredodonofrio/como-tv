      var mini = a.o.mini ? BASE + a.o.mini : "";
      var urlAnte = (a.t === "clip" && a.o.stato === "pronta") ? BASE + "/clip/_clip/" + a.o.id + ".mp4" : "";
      d.innerHTML = "<div class='mini" + (fmt === "9:16" ? " v" : fmt === "3:4" ? " q" : "") + "'>" +
        (mini ? "<img class='telo' src='" + mini + "' alt='' draggable='false'>" : "<span class='telo'></span>") +
        (urlAnte ? "<video class='anteprima' muted preload='none' playsinline></video><span class='cursorino'></span>" : "") +
        "<span class='formato'>" + fmt + "</span>" +
        "<span class='durata'>" + dur + "</span>" +
        "<span class='fonte'>" + (a.t === "hl" ? "sequenza" : a.t === "integrale" ? "registrazione" : (a.o.tipo || "clip")) + "</span></div>" +
        "<div class='testo'><div class='nome'>" + nome + "</div><div class='sotto'>" +
        (a.t === "hl" ? (a.o.pezzi || []).length + " pezzi · " + dur : dur + " · " + fmt) + "</div></div>";
      // HOVER SCRUB, come nel bin di Premiere: si scorre la clip passandoci
      // sopra, senza aprirla. Il video si carica solo alla prima passata.
      if (urlAnte) {
        var box = d.querySelector(".mini"), vid = box.querySelector("video.anteprima"), cur = box.querySelector(".cursorino");
        box.addEventListener("mouseenter", function () {
          if (!vid.src) { vid.src = urlAnte; vid.load(); }
          box.classList.add("scorro");
        });
        box.addEventListener("mousemove", function (e) {
          var r = box.getBoundingClientRect(), q = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
          cur.style.left = (q * 100) + "%";
          if (vid.duration) { try { vid.currentTime = q * vid.duration; } catch (er) {} }
        });
        box.addEventListener("mouseleave", function () { box.classList.remove("scorro"); });
      }
      if (a.t === "clip" && a.o.stato === "pronta") {
        d.draggable = true;
        d.addEventListener("dragstart", function (e) {
          document.body.classList.add("trascinando");
          e.dataTransfer.effectAllowed = "copy";
          try { e.dataTransfer.setData("text/plain", "clip:" + a.o.id); } catch (er) {}
        });
        d.addEventListener("dragend", function () { document.body.classList.remove("trascinando"); });
      }
      d.addEventListener("click", function () {
        ASSET = i;
        var suo = a.t === "clip" ? BASE + "/clip/_clip/" + a.o.id + ".mp4"
                : a.t === "integrale" ? BASE + "/clip/" + a.o.id + "/integrale.mp4"
                : (a.o.export && a.o.export.stato === "pronto" ? BASE + a.o.export.file : "");
        if (suo) mostraNelCentro(suo, fmt, nome);
        destraMateriale();
      });

      // I COMANDI SULLA SCHEDA. Prima stavano solo nel dettaglio: per
      // scaricare tre clip di fila bisognava sceglierle una per una e poi
      // andare a destra ogni volta.
      if (a.t === "clip" && a.o.stato === "pronta") {
        var url = BASE + "/clip/_clip/" + a.o.id + ".mp4";
        var az = document.createElement("div"); az.className = "comandi";
        var gr = document.createElement("a");
        gr.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(a.o.titolo) +
                  (a.o.evento ? "&evento=" + encodeURIComponent(a.o.evento) : "");
        gr.target = "_blank"; gr.rel = "noopener"; gr.textContent = "grafica";
        var sc = document.createElement("a"); sc.href = url + "?scarica=1"; sc.textContent = "scarica";
        [gr, sc].forEach(function (x) { x.addEventListener("click", function (e) { e.stopPropagation(); }); });
        var el2 = tastoElimina(a.o.id, function () { ASSET = 0; });
      el2.textContent = "togli";
        el2.addEventListener("click", function (e) { e.stopPropagation(); });
        az.appendChild(gr); az.appendChild(sc); az.appendChild(el2);
        d.appendChild(az);
      } else if (a.t !== "clip") {
        var url2 = a.t === "integrale" ? BASE + "/clip/" + a.o.id + "/integrale.mp4"
                 : (a.o.export && a.o.export.stato === "pronto" ? BASE + a.o.export.file : "");
        if (url2) {
          var az2 = document.createElement("div"); az2.className = "comandi";
          var s3 = document.createElement("a"); s3.href = url2 + "?scarica=1"; s3.textContent = "scarica";
          s3.addEventListener("click", function (e) { e.stopPropagation(); });
          az2.appendChild(s3); d.appendChild(az2);
        }
      }
      g.appendChild(d);
    });
    schedaSotto(lista[ASSET] || lista[0]);
  }

  // Sotto la griglia, i dati di quello che hai scelto. Il video non ci sta
  // piu': si guarda al centro, dove si guarda tutto il resto.
  function schedaSotto(a) {
    return;                                  // i comandi stanno sulla clip stessa
    var d = document.createElement("div");
    d.className = "scheda-sotto";
    if (!a) { d.innerHTML = ""; return; }
    d.innerHTML = '<h2 style="margin-top:16px">Scheda</h2><div id="corpo"></div>';
    var corpo = el("corpo");
    if (a.t === "hl") {
      var q = a.o;
      corpo.innerHTML = "<div class='vuoto'>" + q.pezzi.length + " pezzi · " +
        orologio(q.pezzi.reduce(function (x, y) { return x + (y.fuori - y.dentro); }, 0)) +
        (q.scarto ? " · orologio tarato di " + q.scarto + "s" : "") + "</div>";
      (q.avvisi || []).forEach(function (t) {
        var w = document.createElement("div"); w.className = "avviso vedi";
        w.style.marginTop = "8px"; w.textContent = t; corpo.appendChild(w);
      });

      // Il ritocco: si arriva vicini in automatico e si stringe guardando.
      // "Tara qui" e' il gesto che vale piu' di tutti: sposta TUTTI i pezzi
      // non toccati a mano della stessa quantita', perche' il ritardo del
      // flusso e' uno solo per tutta la partita.
      function ritocca(corpoRichiesta) {
        corpoRichiesta.tipo = "clip-hl-pezzo"; corpoRichiesta.seq = q.id;
        manda(corpoRichiesta).then(function (d) { SEQ = d.seq; destraMateriale(); })
          .catch(function (e) { dice(e.message); });
      }
      q.pezzi.forEach(function (x, n) {
        var v = document.createElement("div"); v.className = "voce";
        v.innerHTML = "<div class='testo'><div class='nome'>" + (n + 1) + ". " + x.titolo + "</div>" +
          "<div class='dett'>" + orologio(x.dentro) + " → " + orologio(x.fuori) + " · " +
          Math.round(x.fuori - x.dentro) + "s · " + x.fonte + (x.mano ? " · a mano" : "") + "</div></div>";
        var az = document.createElement("div"); az.className = "azioni";
        function tasto(testo, cosa, spiega) {
          var a2 = document.createElement("a"); a2.href = "#"; a2.textContent = testo;
          if (spiega) a2.title = spiega;
          a2.addEventListener("click", function (e) { e.preventDefault(); cosa(); });
          az.appendChild(a2);
        }
        tasto("vai", function () {
          tornaAlContenuto();               // il visore mostra la registrazione
          var giri = 0, attesa = setInterval(function () {
            var vv = el("player");
            if (++giri > 30) return clearInterval(attesa);
            if (!vv || !vv.duration) return;
            clearInterval(attesa); seguiLive = false;
            vv.currentTime = x.dentro; vv.play().catch(function () {});
          }, 300);
        });
        tasto("−1", function () { ritocca({ pezzo:x.id, dentro:x.dentro - 1 }); }, "entra un secondo prima");
        tasto("+1", function () { ritocca({ pezzo:x.id, dentro:x.dentro + 1 }); }, "entra un secondo dopo");
        tasto("+fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori + 1 }); });
        tasto("−fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori - 1 }); });
        tasto("tara qui", function () {
          var vv = el("player");
          if (!vv || !vv.duration) { dice("Apri il live e porta il visore dove sta l’azione, poi tara."); return; }
          manda({ tipo:"clip-hl-taratura", seq:q.id, pezzo:x.id, secondi:vv.currentTime })
            .then(function (d) { SEQ = d.seq; destraMateriale();
              dice("Orologio tarato di " + d.seq.scarto + "s: si sono spostati tutti.", true); })
            .catch(function (e) { dice(e.message); });
        }, "l’azione è dove sta il visore adesso: sposta tutti gli altri della stessa quantità");
        tasto("togli", function () { ritocca({ pezzo:x.id, togli:1 }); });
        v.appendChild(az);
        corpo.appendChild(v);
      });

      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      az2.innerHTML = '<button class="b oro" id="hlMp4">Esporta MP4</button>' +
                      '<button class="b" id="hlXml">Per Premiere</button>';
      corpo.appendChild(az2);
      if (q.export && q.export.stato === "pronto") {
        var g1 = document.createElement("div"); g1.className = "aiuto";
        g1.innerHTML = '<a href="' + BASE + q.export.file + '?scarica=1">scarica il video (' +
                       q.export.formato + ", " + orologio(q.export.durata) + ")</a>";
        corpo.appendChild(g1);
      }
      if (q.export && q.export.stato === "lavora") {
        var g2 = document.createElement("div"); g2.className = "aiuto";
        g2.textContent = "esporto… " + q.export.fatti + "/" + q.export.quanti;
        corpo.appendChild(g2);
      }
      if (q.premiere) {
        var g3 = document.createElement("div"); g3.className = "aiuto";
        g3.innerHTML = '<a href="' + BASE + q.premiere.file + '?scarica=1">scarica l’XML per Premiere</a>';
        corpo.appendChild(g3);
      }
      el("hlMp4").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, formato:formato })
          .then(function () { dice("Esporto il video in " + formato + "…", true); })
          .catch(function (e) { dice(e.message); });
      });
      el("hlXml").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, come:"premiere" })
          .then(function (d) { SEQ.premiere = d.premiere; destraMateriale();
            dice(d.premiere.integrale ? "XML pronto." :
                 "XML pronto, ma manca l’integrale: in Premiere andrà ricollegato.", true); })
          .catch(function (e) { dice(e.message); });
      });
      return;
    }

    var o = a.o;
    corpo.innerHTML = "<table class='dati'>" +
      "<tr><td>Nome</td><td>" + (o.titolo || "Integrale") + "</td></tr>" +
      (a.t === "clip" ? "<tr><td>Formato</td><td>" + o.formato + "</td></tr>" : "") +
      "<tr><td>Durata</td><td>" + (a.t === "clip" ? (o.durataVera || o.durata) + "s" : orologio(o.durata)) + "</td></tr>" +
      (o.peso || o.integralePeso ? "<tr><td>Peso</td><td>" + peso(o.peso || o.integralePeso) + "</td></tr>" : "") +
      (o.minuto ? "<tr><td>Minuto</td><td>" + o.minuto + "</td></tr>" : "") +
      (o.chi ? "<tr><td>Chi</td><td>" + o.chi + "</td></tr>" : "") +
      "</table>";
    if (a.t === "clip") {
      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      var g = document.createElement("a");
      g.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(o.titolo);
      g.target = "_blank"; g.rel = "noopener";
      g.innerHTML = '<button class="b oro">Grafica social</button>';
      var s2 = document.createElement("a"); s2.href = url + "?scarica=1";
      s2.innerHTML = '<button class="b">Scarica</button>';
      az2.appendChild(g); az2.appendChild(s2); corpo.appendChild(az2);
      var az3 = document.createElement("div"); az3.style.marginTop = "10px";
      var t = tastoElimina(o.id, function () { ASSET = 0; });
      t.className = "togli grande";
      az3.appendChild(t); corpo.appendChild(az3);
    }
  }

  // ── cercare ─────────────────────────────────────────────────────
  //
  //  La ricerca non e' una linguetta in piu': quando c'e' una domanda nella
  //  barra, la colonna centrale risponde a quella e basta. Si svuota la
  //  barra e si torna esattamente dov'eravamo.
  var RIS = null, vistaPrima = "live", attesaCerca = 0;

  function cerca(q) {
    manda({ tipo: "clip-cerca", q: q }).then(function (d) {
      RIS = d; disegnaRisultati();
    }).catch(function (e) { dice(e.message); });
  }

  function disegnaRisultati() {
    var c = el("bin"); if (!c) return; c.innerHTML = "";
    var box = document.createElement("div"); box.className = "risultati"; c.appendChild(box);
    if (!RIS || RIS.vuota) { box.innerHTML = '<div class="vuoto">Scrivi che cosa cerchi.</div>'; return; }

    // far vedere COME e' stata capita la domanda: se sbaglia, si vede subito
    var q = RIS.domanda || {}, letta = [];
    (q.parole || []).forEach(function (p) { letta.push("<em>" + p + "</em>"); });
    if (q.formato) letta.push("<em>formato " + q.formato + "</em>");
    if (q.genere) letta.push("<em>" + q.genere + "</em>");
    if (q.quando) {
      var mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
                  "agosto","settembre","ottobre","novembre","dicembre"];
      letta.push("<em>" + (q.quando.giorno || "") + " " +
                 (q.quando.mese >= 0 ? mesi[q.quando.mese] : "") + " " + (q.quando.anno || "") + "</em>");
    }
    var l = document.createElement("div"); l.className = "letta";
    l.innerHTML = "Cerco: " + letta.join(" ") + " · " + RIS.quante + " risultati";
    box.appendChild(l);

    if (!RIS.quante) { box.innerHTML += '<div class="vuoto">Niente. Prova con meno parole.</div>'; return; }

    function titolo(t, n) {
      var h = document.createElement("h3");
      h.innerHTML = t + " <b>" + n + "</b> <i></i>";
      box.appendChild(h);
    }
    function riga(nome, dett, coda, quando) {
      var v = document.createElement("div"); v.className = "voce cliccabile";
      v.innerHTML = "<div class='testo'><div class='nome'>" + nome + "</div>" +
                    "<div class='dett'>" + dett + "</div></div>" +
                    (quando ? "<span class='quando2'>" + quando + "</span>" : "") +
                    (coda ? "<a href='#'>" + coda + "</a>" : "");
      box.appendChild(v); return v;
    }
    function data(ms) {
      if (!ms) return "";
      var d = new Date(ms);
      return ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2);
    }

    if (RIS.partite.length) {
      titolo("Partite", RIS.partite.length);
      RIS.partite.forEach(function (r) {
        riga(r.titolo, (r.competizione || "senza competizione") + " · " + orologio(r.durata) +
             " · " + (r.quanteClip || 0) + " clip", "apri", data(r.avviata))
          .addEventListener("click", function () { vaiA(r.id, null, "tutto"); });
      });
    }
    if (RIS.clip.length) {
      titolo("Clip e sequenze", RIS.clip.length);
      RIS.clip.forEach(function (c) {
        riga(c.titolo, (c.seq ? c.pezzi + " pezzi · sequenza" : c.formato + " · " +
             (c.durataVera || c.durata) + "s") + (c.partita ? " · " + c.partita : ""),
             "vedi", data(c.creata))
          .addEventListener("click", function () { vaiA(c.reg, null, c.seq ? "hl" : "clip"); });
      });
    }
    // Le partite dell'archivio trovate per nome: si aprono nella Sorgente.
    if (RIS.archivio && RIS.archivio.length) {
      titolo("Nell\u2019archivio", RIS.archivio.length);
      RIS.archivio.forEach(function (a) {
        riga(a.partita, (a.competizione || "") + (a.pezzi > 1 ? " \u00b7 " + a.pezzi + " parti" : "") +
             (a.soloS3 ? " \u00b7 senza appunti" : ""), "apri", data(Date.parse(a.quando)))
          .addEventListener("click", function () { apriDaArchivio(a.rec, null, a.partita, 0); });
      });
    }
    // Le azioni scritte dai giornalisti nelle partite passate. Quasi
    // sempre il video non e' qui: la riga dice dove andarlo a prendere —
    // quale partita, quale minuto. Quando invece la registrazione c'e',
    // la riga si apre come tutte le altre.
    if (RIS.azioni && RIS.azioni.length) {
      titolo("Negli appunti della redazione", RIS.azioni.length);
      RIS.azioni.forEach(function (a) {
        var qui = REGISTRAZIONI.filter(function (x) { return x.evento === a.rec; })[0];
        var inArchivio = a.archivio && a.dove;
        var v = riga((a.hl ? "\u2605 " : "") + (a.testo || a.tipo),
             a.partita + " \u00b7 " + a.minuto + (a.tempo === 2 ? " (2\u00b0T)" : "") +
             (a.competizione ? " \u00b7 " + a.competizione : ""),
             qui ? "guarda" : (inArchivio ? "archivio" : ""), data(Date.parse(a.quando)));
        if (qui) v.addEventListener("click", function () { vaiA(qui.id, null, "tutto"); });
        else if (inArchivio) {
          v.addEventListener("click", function () {
            apriDaArchivio(a.rec, a.dove, a.partita, a.pezzo);
          });
        } else {
          v.style.opacity = ".78";
          v.addEventListener("click", function () { apriAppunti(a.rec); });
        }
      });
    }
    if (RIS.segni.length) {
      titolo("Segni nelle partite", RIS.segni.length);
      RIS.segni.forEach(function (m) {
        riga(m.testo || m.tipo || "segno",
             m.partita + " · " + orologio(m.secondi) + (m.fonte ? " · " + m.fonte : ""),
             "guarda", data(m.quando))
          .addEventListener("click", function () { vaiA(m.reg, m.secondi, "live"); });
      });
    }
  }

  // Il video di questa partita non e' collegato al MAM. Quello che c'e' —
  // e non e' poco — sono gli appunti di chi l'ha guardata: la partita
  // intera, minuto per minuto. Serve a decidere se vale la pena andare a
  // cercare il file, prima di andarlo a cercare.
  function apriAppunti(rec) {
    manda({ tipo: "clip-appunti-partita", rec: rec }).then(function (d) {
      var vecchia = el("foglio"); if (vecchia) vecchia.remove();
      var s = document.createElement("div");
      s.className = "foglio"; s.id = "foglio";
      var d0 = new Date(d.quando);
      var quando = isFinite(d0) ? ("0"+d0.getDate()).slice(-2) + "/" +
                   ("0"+(d0.getMonth()+1)).slice(-2) + "/" + d0.getFullYear() : "";
      var righe = "", tempo = 0, hl = 0;
      d.righe.forEach(function (r) {
        if (r.s !== tempo) {
          tempo = r.s;
          righe += '<div class="tempo">' + (tempo === 1 ? "Primo tempo" : "Secondo tempo") + '</div>';
        }
        if (r.hl) hl++;
        righe += '<div class="az' + (r.hl ? " hl" : "") +
                 (r.dove ? " apri\" data-dove=\"" + r.dove +
                           "\" data-pezzo=\"" + (r.pezzo || 0) : "") + '">' +
                 '<u>' + (r.hl ? "\u2605 " : "") + r.m + '</u>' +
                 '<i>' + (r.t || "") + '</i><p>' + r.x + '</p></div>';
      });
      s.innerHTML = '<div><header><b>' + d.partita + '</b>' +
        '<span>' + (d.competizione || "") + (quando ? " \u00b7 " + quando : "") +
        " \u00b7 " + d.righe.length + ' azioni' + (hl ? " \u00b7 " + hl + " segnate per gli HL" : "") +
        '</span><a href="#" id="foglioChiudi">chiudi</a></header>' +
        '<div class="righe">' + (righe || '<div class="az"><p>Nessuna azione.</p></div>') + '</div>' +
        '<footer>Il video di questa partita non \u00e8 collegato al MAM: ' +
        'gli appunti dicono <b>quale minuto</b>, il file sta in archivio.</footer></div>';
      document.body.appendChild(s);
      s.querySelectorAll(".az.apri").forEach(function (r) {
        r.addEventListener("click", function () {
          apriDaArchivio(d.rec, +r.dataset.dove, d.partita, +r.dataset.pezzo || 0);
        });
      });
      var via = function (e) { if (e) e.preventDefault(); s.remove(); };
      s.addEventListener("click", function (e) { if (e.target === s) via(); });
      el("foglioChiudi").addEventListener("click", via);
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { via(); document.removeEventListener("keydown", esc); }
      });
    }).catch(function (e) { dice(e.message); });
  }

  // dal risultato al materiale: si sceglie la partita, si va alla vista
  // giusta e — se e' un segno — il player ci salta dentro.
  function vaiA(idReg, secondi, vista) {
    var r = REGISTRAZIONI.filter(function (x) { return x.id === idReg; })[0];
    if (r) REG = r;
    el("q").value = ""; RIS = null;
    VISTA = vista || "tutto";
    document.querySelectorAll("#linguette button").forEach(function (x) {
      x.className = (x.dataset.v === "live" ? "live" : "") + (x.dataset.v === VISTA ? " acceso" : "");
    });
    disegna();
    if (secondi !== null && secondi !== undefined) {
      var giri = 0;
      var attesa = setInterval(function () {
        var v = el("player");
        if (++giri > 30) return clearInterval(attesa);
        if (!v || !v.duration) return;
        clearInterval(attesa);
        seguiLive = false; v.currentTime = secondi;      // fermo li': si decide dopo se partire
      }, 300);
    }
  }

  el("q").addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(attesaCerca);
    if (!q) { RIS = null; VISTA = vistaPrima; accendiLinguette(); disegna(); return; }
    if (VISTA !== "cerca") { vistaPrima = VISTA; VISTA = "cerca";
      document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
        x.className = (x.dataset.v === "live" ? "live" : "");
      });
      if (hls) { hls.destroy(); hls = null; apertaId = ""; }

    }
    attesaCerca = setTimeout(function () { cerca(q); }, 280);
  });
  el("q").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { this.value = ""; this.dispatchEvent(new Event("input")); this.blur(); }
  });

  // ── il giro ─────────────────────────────────────────────────────
  // IL CENTRO NON CAMBIA MESTIERE.
  //
  //  Prima le linguette sostituivano la finestra di lavorazione con una
  //  griglia: si arrivava, si sceglieva "Clip", e il visore spariva. Ma il
  //  giro vero e' uno solo — si arriva, si lavora la clip, la si spedisce —
  //  e quel giro sta tutto al centro. Il materiale prodotto e' un'altra
  //  cosa: sta a destra, e da li' non toglie niente.
  function disegna() {
    firmaVecchia = "";                     // un gesto dell'utente ridisegna sempre
    albero(); consoleSinistra();
    if (!el("player")) centroLavoro();     // la finestra di lavorazione si costruisce una volta
    disegnaConsole(); disegnaSequenza();
    if (VISTA === "cerca") { disegnaRisultati(); return; }
    destraMateriale();
  }

  // la firma di quello che si vede: se non cambia, non si tocca
  var firmaVecchia = "";
  function cambiato() {
    var f = [VISTA, FORMA, ASSET, REG ? REG.id + REG.stato + REG.integrale : "-",
      CLIP.map(function (c) { return c.id + c.stato + (c.mini ? "1" : "0"); }).join(","),
      SEQ ? SEQ.id + SEQ.pezzi.length + (SEQ.export ? SEQ.export.stato : "") : "-"].join("|");
    if (f === firmaVecchia) return false;
    firmaVecchia = f; return true;
  }

  function aggiorna() {
    return manda({ tipo:"clip-stato" }).then(function (d) {
      REGISTRAZIONI = d.reg || [];
      DISCO = d.disco || null;
      if (REG) { var mio = REGISTRAZIONI.filter(function (r) { return r.id === REG.id; })[0]; if (mio) REG = mio; else REG = null; }
      if (!REG && REGISTRAZIONI.length) REG = REGISTRAZIONI[0];
      CLIP = (d.clip || []).filter(function (c) { return !REG || c.reg === REG.id; });
      barra();
      if (REG && el("player") && !guardando) apri(REG);
      disegnaConsole(); capo(); disegnaSequenza();
      if (VISTA === "cerca") { albero(); return; }      // sta cercando: non si tocca la lista
      if (cambiato()) destraMateriale();
      // Se non e' cambiato niente NON si ridisegna: rifare la griglia ogni
      // tre secondi buttava via le miniature prima che finissero di
      // caricarsi (e con loro la posizione dello scorrimento). Una lista che
      // si rigenera da sola sotto le mani e' peggio di una lista vecchia.
      albero();
      if (REG) {
        manda({ tipo:"clip-hl-elenco", reg:REG.id }).then(function (h) {
          SEQ = (h.seq || [])[0] || null;
          if (VISTA === "hl") destraMateriale();
        }).catch(function () {});
      }
    }).catch(function (e) { el("sPonte").textContent = "non risponde"; el("sPonteP").className = "pallino"; });
  }

  function barra() {
    var aperte = REGISTRAZIONI.filter(function (r) { return r.stato === "registra"; });
    var lav = CLIP.filter(function (c) { return c.stato === "lavora"; }).length;
    el("sRec").textContent = aperte.length ? aperte.length + " · " + orologio(aperte[0].durata || 0) : "nessuna";
    el("sPall").className = "pallino" + (aperte.some(function (r) { return !r.attesa && !r.guarda; }) ? " rec" : "");
    if (DISCO) {
      el("sDisco").textContent = DISCO.liberi + " GB · ~" + DISCO.partite + " partite";
      el("sBarra").style.width = Math.max(4, Math.min(100, 100 - DISCO.liberi / 79 * 100)) + "%";
    }
    el("sLav").textContent = lav ? lav + " in lavorazione" : "niente in coda";
    el("sPonte").textContent = "risponde"; el("sPonteP").className = "pallino ok";
    // la linguetta LIVE si accende da sola quando qualcosa sta girando
    segnaConteggi();
  }

  document.querySelectorAll("#linguette [data-v]").forEach(function (b) {
    b.dataset.nome = b.textContent;
    b.addEventListener("click", function () {
      VISTA = b.dataset.v; ASSET = 0;
      accendiLinguette(); disegna();
    });
  });
  document.querySelectorAll("#linguette [data-forma]").forEach(function (b) {
    b.addEventListener("click", function () {
      FORMA = b.dataset.forma; ASSET = 0;
      // scegliere una forma mentre si e' sul live vuol dire voler vedere
      // quel materiale: si passa a "tutto" invece di non far succedere niente
      if (VISTA === "cerca") VISTA = "tutto";
      accendiLinguette();
      disegna();
    });
  });
  function accendiLinguette() {
    document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
      x.className = (x.dataset.v === VISTA ? "acceso" : "");
    });
    document.querySelectorAll("#linguette [data-forma]").forEach(function (x) {
      x.className = (x.dataset.forma === FORMA ? "acceso" : "");
    });
  }

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "i") { segnaIn(); e.preventDefault(); }
    else if (k === "o") { segnaOut(); e.preventDefault(); }
    else if (k === "t") { if (el("btnTaglia") && !el("btnTaglia").disabled) taglia(); e.preventDefault(); }
    else if (k === " ") { var v = el("player"); if (v) { v.paused ? v.play().catch(function(){}) : v.pause(); } e.preventDefault(); }
  });

  disegna();
  aggiorna();
  setInterval(aggiorna, 3000);
})();
</script>
</body>
</html>
