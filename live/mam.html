    });
  })();

  // ── LA TRACCIA ──────────────────────────────────────────────────
  //
  //  Un righello con i minuti, i segni della partita, la parte scelta con
  //  due maniglie, la testina. Si legge in un colpo d'occhio che cosa si
  //  sta per tagliare, invece di doverlo immaginare guardando due numeri.
  var LENTE = 1;                 // 1 = tutta la partita, 8 = un ottavo

  function durataAperta() {
    var v = el("player");
    return (REG && REG.durata) || (v && v.duration) || 0;
  }
  // La finestra che si vede: con la lente stretta segue la testina.
  function finestra() {
    var tot = durataAperta(), v = el("player");
    if (!tot) return null;
    if (LENTE <= 1) return { a: 0, b: tot, tot: tot };
    var largo = tot / LENTE, meta = (v ? v.currentTime : 0) - largo / 2;
    var a = Math.max(0, Math.min(tot - largo, meta));
    return { a: a, b: a + largo, tot: tot };
  }
  function xDi(t, f, largo) { return (t - f.a) / (f.b - f.a) * largo; }

  function disegnaPista() {
    var p = el("pista"); if (!p) return;
    var f = finestra(), v = el("player");
    if (!f) { p.innerHTML = ""; return; }
    var largo = p.clientWidth || 600, dentroF = f.b - f.a, out = [];

    // il righello: un passo che dia una decina di tacche, non trecento
    var passi = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800];
    var passo = passi.find(function (x) { return dentroF / x <= 14; }) || 3600;
    for (var t = Math.ceil(f.a / passo) * passo; t < f.b; t += passo) {
      var x = xDi(t, f, largo), grande = (t % (passo * 5) === 0);
      out.push('<span class="tacca' + (grande ? " grande" : "") + '" style="left:' + x + 'px"></span>');
      if (grande) out.push('<span class="ora" style="left:' + x + 'px">' + orologio(t) + '</span>');
    }
    out.push('<span class="righello"></span>');

    ((REG && REG.marker) || []).forEach(function (m) {
      if (m.secondi < f.a || m.secondi > f.b) return;
      out.push('<span class="segno' + (/gol|goal/i.test(m.tipo || m.testo || "") ? " gol" : "") +
               '" style="left:' + xDi(m.secondi, f, largo) + 'px" data-vai="' + m.secondi +
               '" title="' + String(m.testo || "").replace(/"/g, "") + '"></span>');
    });

    if (dentro !== null || fuori !== null) {
      var a = dentro === null ? f.a : dentro, b = fuori === null ? f.b : fuori;
      var xa = Math.max(0, xDi(a, f, largo)), xb = Math.min(largo, xDi(b, f, largo));
      if (xb > xa) out.push('<span class="presa" style="left:' + xa + 'px;width:' + (xb - xa) + 'px"></span>');
      if (dentro !== null && xa >= -5 && xa <= largo)
        out.push('<span class="maniglia" data-lato="in" style="left:' + (xa - 4) + 'px"></span>');
      if (fuori !== null && xb >= -5 && xb <= largo)
        out.push('<span class="maniglia" data-lato="out" style="left:' + (xb - 5) + 'px"></span>');
    }
    if (v) out.push('<span class="capo" style="left:' + xDi(v.currentTime, f, largo) + 'px"></span>');
    p.innerHTML = out.join("");
  }

  // Trascinare una maniglia sposta entrata o uscita. E' il gesto che in
  // Premiere si fa sulle estremita' di una clip, ed e' l'unico modo per
  // aggiustare un taglio senza rimettersi a contare i secondi.
  function tempoAlPuntatore(e) {
    var p = el("pista"), f = finestra(); if (!p || !f) return null;
    var r = p.getBoundingClientRect();
    var q = (e.clientX - r.left) / r.width;
    return Math.max(0, Math.min(f.tot, f.a + q * (f.b - f.a)));
  }
  function attaccaPista() {
    var p = el("pista"); if (!p || p.dataset.viva) return;
    p.dataset.viva = "1";
    var lato = null;
    p.addEventListener("mousedown", function (e) {
      if (e.target.dataset && e.target.dataset.lato) { lato = e.target.dataset.lato; e.preventDefault(); return; }
      if (e.target.dataset && e.target.dataset.vai) { el("player").currentTime = +e.target.dataset.vai; return; }
      var t = tempoAlPuntatore(e);
      if (t !== null) { seguiLive = false; el("player").currentTime = t; }
    });
    document.addEventListener("mousemove", function (e) {
      if (!lato) return;
      var t = tempoAlPuntatore(e); if (t === null) return;
      if (lato === "in") { dentro = (fuori !== null && t >= fuori) ? fuori - 0.2 : t; }
      else { fuori = (dentro !== null && t <= dentro) ? dentro + 0.2 : t; }
      mostraInOut();
    });
    document.addEventListener("mouseup", function () { lato = null; });
  }

  // ── LA TIMELINE ─────────────────────────────────────────────────
  //
  //  Stessa finestra e stessa lente della traccia piccola: sono lo stesso
  //  tempo guardato da due distanze. Qui pero' c'e' spazio per il nastro
  //  della partita, i segni e i pezzi gia' montati, e soprattutto per il
  //  gesto: si prende il cursore e lo si porta dove serve.
  function disegnaTimeline() {
    var p = el("tlPista"); if (!p) return;
    var f = finestra(), v = el("player");
    if (!f) { p.innerHTML = '<div class="vuoto2">Scegli un contenuto: la partita si distende qui.</div>'; return; }
    var largo = p.clientWidth || 900, out = [];
    var nome = el("tlNome"); if (nome) nome.textContent = REG ? REG.titolo : "—";

    var passi = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600];
    var passo = passi.find(function (x) { return (f.b - f.a) / x <= 16; }) || 3600;
    for (var t = Math.ceil(f.a / passo) * passo; t < f.b; t += passo) {
      var x = xDi(t, f, largo), grande = (t % (passo * 4) === 0);
      out.push('<span class="tacca' + (grande ? " grande" : "") + '" style="left:' + x + 'px"></span>');
      if (grande) out.push('<span class="ora" style="left:' + x + 'px">' + orologio(t) + '</span>');
    }
    out.push('<span class="righello"></span>');

    // V1: il nastro della partita, con dentro il nome
    var xa = xDi(0, f, largo), xb = xDi(f.tot, f, largo);
    out.push('<span class="nastro" style="left:' + Math.max(0, xa) + 'px;right:auto;width:' +
             (Math.min(largo, xb) - Math.max(0, xa)) + 'px"><b>' +
             (REG ? REG.titolo : "") + '</b><i class="onda"></i></span>');

    ((REG && REG.marker) || []).forEach(function (m) {
      if (m.secondi < f.a || m.secondi > f.b) return;
      out.push('<span class="segno' + (/gol|goal/i.test(m.tipo || m.testo || "") ? " gol" : "") +
               '" style="left:' + xDi(m.secondi, f, largo) + 'px" data-vai="' + m.secondi +
               '" title="' + String(m.testo || "").replace(/"/g, "") + '"></span>');
    });

    if (dentro !== null || fuori !== null) {
      var a = dentro === null ? f.a : dentro, b = fuori === null ? f.b : fuori;
      var pa = Math.max(0, xDi(a, f, largo)), pb = Math.min(largo, xDi(b, f, largo));
      if (pb > pa) out.push('<span class="presa" style="left:' + pa + 'px;width:' + (pb - pa) + 'px"></span>');
      if (dentro !== null) out.push('<span class="maniglia" data-lato="in" style="left:' + (pa - 4) + 'px"></span>');
      if (fuori !== null) out.push('<span class="maniglia" data-lato="out" style="left:' + (pb - 5) + 'px"></span>');
    }

    // SEQ: i pezzi montati. Quelli che vengono da questa partita stanno al
    // loro posto nel tempo; gli altri si mettono in fila all'inizio, in
    // chiaro, perche' non hanno un posto qui dentro.
    var fuoriPosto = 0;
    ((SEQ && SEQ.pezzi) || []).forEach(function (z, i) {
      var suo = (z.reg === (REG && REG.id));
      if (suo && z.dentro !== undefined) {
        var za = xDi(z.dentro, f, largo), zb = xDi(z.fuori, f, largo);
        if (zb < 0 || za > largo) return;
        out.push('<span class="pezzo" data-vai="' + z.dentro + '" style="left:' + Math.max(0, za) +
                 'px;width:' + Math.max(14, Math.min(largo, zb) - Math.max(0, za)) + 'px">' +
                 (i + 1) + '. ' + String(z.titolo || "").slice(0, 22) + '</span>');
      } else {
        out.push('<span class="pezzo fuori" style="left:' + (fuoriPosto * 78 + 2) +
                 'px;width:74px" title="' + String(z.titolo || "").replace(/"/g, "") + '">' +
                 (i + 1) + '. ' + String(z.titolo || "").slice(0, 16) + '</span>');
        fuoriPosto++;
      }
    });

    if (v) out.push('<span class="capo" style="left:' + xDi(v.currentTime, f, largo) + 'px"></span>');
    p.innerHTML = out.join("");
  }

  function attaccaTimeline() {
    var p = el("tlPista"); if (!p || p.dataset.viva) return;
    p.dataset.viva = "1";
    var lato = null;
    function tempoQui(e) {
      var f = finestra(); if (!f) return null;
      var r = p.getBoundingClientRect();
      return Math.max(0, Math.min(f.tot, f.a + (e.clientX - r.left) / r.width * (f.b - f.a)));
    }
    p.addEventListener("mousedown", function (e) {
      var d = e.target.dataset || {};
      if (d.lato) { lato = d.lato; e.preventDefault(); return; }
      if (d.vai) { seguiLive = false; el("player").currentTime = +d.vai; return; }
      var t = tempoQui(e);
      if (t !== null) { seguiLive = false; el("player").currentTime = t; }
    });
    document.addEventListener("mousemove", function (e) {
      if (!lato) return;
      var t = tempoQui(e); if (t === null) return;
      if (lato === "in") dentro = (fuori !== null && t >= fuori) ? fuori - 0.2 : t;
      else fuori = (dentro !== null && t <= dentro) ? dentro + 0.2 : t;
      mostraInOut();
    });
    document.addEventListener("mouseup", function () { lato = null; });
    var q = function (id, f) { var b = el(id); if (b) b.addEventListener("click", f); };
    q("tlPiu", function () { LENTE = Math.min(32, LENTE * 2); disegnaTutto(); });
    q("tlMeno", function () { LENTE = Math.max(1, LENTE / 2); disegnaTutto(); });
    q("tlTutto", function () { LENTE = 1; disegnaTutto(); });
    window.addEventListener("resize", disegnaTutto);
  }
  function disegnaScrub() {
    var sc = el("scrubS"), v = el("player"), tot = durataAperta(); if (!sc) return;
    if (!tot) { sc.innerHTML = ""; return; }
    var out = [];
    if (dentro !== null || fuori !== null) {
      var a = dentro === null ? 0 : dentro, b = fuori === null ? tot : fuori;
      out.push('<span class="presa" style="left:' + (a / tot * 100) + '%;width:' + ((b - a) / tot * 100) + '%"></span>');
      if (dentro !== null) out.push('<span class="par" style="left:calc(' + (dentro / tot * 100) + '% - 3px)"></span>');
      if (fuori !== null) out.push('<span class="par" style="left:calc(' + (fuori / tot * 100) + '% - 3px)"></span>');
    }
    ((REG && REG.marker) || []).forEach(function (m) {
      out.push('<span class="segno' + (/gol|goal/i.test(m.tipo || m.testo || "") ? " gol" : "") +
               '" style="left:' + (m.secondi / tot * 100) + '%"></span>');
    });
    if (v) out.push('<span class="capo" style="left:' + (v.currentTime / tot * 100) + '%"></span>');
    sc.innerHTML = out.join("");
  }
  function disegnaTutto() { disegnaPista(); disegnaTimeline(); disegnaScrub(); }

  function mostraInOut() {
    disegnaPista(); disegnaTimeline(); disegnaScrub();
    var d = (dentro !== null && fuori !== null) ? fuori - dentro : null;
    // in mezzo alla barra del monitor: la durata di quello che si sta per
    // tagliare, come fa Premiere; "adatta" quando non c'e' niente di scelto
    var f = el("fitS");
    if (f) f.textContent = d !== null && d > 0 ? tc(d) + "  \u00b7  " + d.toFixed(1) + "s" : "adatta";
    var bt = el("btnTaglia"), bi = el("btnInserisci");
    var puo = !!(REG && !REG.guarda && d !== null && d > 0.5);
    if (bt) bt.disabled = !puo;
    if (bi) bi.disabled = !puo;
  }
  // I tasti. Chi monta tiene una mano sulla tastiera e non la sposta: ogni
  // viaggio verso il mouse e' un secondo perso, e in una partita di secondi
  // ce ne sono novanta volte sessanta.
  var TASTI = { "j": -5, "l": 5, "arrowleft": -1, "arrowright": 1 };
  var AIUTO = [
    ["spazio · K", "ferma e riparte"],
    ["J · L", "indietro e avanti di 5\u2033 (con alt: 50\u2033)"],
    ["\u2190 \u2192", "un secondo \u00b7 con shift un fotogramma"],
    ["\u2191 \u2193", "al segno precedente e successivo"],
    ["I \u00b7 O", "entrata e uscita qui"],
    [", \u00b7 .", "inserisci nella sequenza \u00b7 esporta la clip"],
    ["shift+I \u00b7 shift+O", "vai all'entrata, vai all'uscita"],
    ["alt+I \u00b7 alt+O", "togli entrata, togli uscita"],
    ["M", "metti un segno dove sei"],
    ["home \u00b7 fine", "inizio e fine"],
    ["+ \u00b7 \u2212 \u00b7 \\", "avvicina, allontana, tutta la partita"],
    ["1 \u00b7 2 \u00b7 3", "16:9 \u00b7 3:4 \u00b7 9:16"],
    ["T", "esporta la clip"],
    ["?", "questo foglio"]
  ];
  function fogliettoTasti() {
    var vecchio = el("tasti"); if (vecchio) { vecchio.remove(); return; }
    var d = document.createElement("div");
    d.className = "tasti"; d.id = "tasti";
    d.innerHTML = "<div><h4>Comandi</h4><table>" + AIUTO.map(function (r) {
      return "<tr><td>" + r[0].split(" ").map(function (x) {
        return /^[·\u00b7]$/.test(x) ? x : "<kbd>" + x + "</kbd>";
      }).join(" ") + "</td><td>" + r[1] + "</td></tr>";
    }).join("") + "</table></div>";
    document.body.appendChild(d);
    d.addEventListener("click", function () { d.remove(); });
  }

  // I tasti sono quelli di Premiere dove Premiere ne ha uno: chi monta li
  // ha gia' nelle dita e non deve impararne altri. Dove Premiere non
  // c'entra (i formati, l'esportazione) si e' scelto il piu' vicino.
  document.addEventListener("keydown", function (e) {
    var t = e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || e.metaKey || e.ctrlKey) return;
    // il video che riceve i tasti e' quello del monitor toccato per ultimo:
    // spazio sul Programma riproduce la sequenza, non la partita
    var v = (MON === "p" && el("programma")) ? el("programma") : el("player"); if (!v) return;
    var k = e.key.toLowerCase();
    if (k === "," ) { var bi = el("btnInserisci"); if (bi) { e.preventDefault(); bi.click(); } return; }
    if (k === "." ) { var bt = el("btnTaglia"); if (bt && !bt.disabled) { e.preventDefault(); bt.click(); } return; }
    if (MON === "p" && (k === "home" || k === "end")) {
      e.preventDefault(); (k === "home" ? el("pInizio") : el("pFine")).click(); return;
    }
    if (MON === "p" && (k === "arrowup" || k === "arrowdown")) {
      e.preventDefault(); progVai(PROG.i + (k === "arrowdown" ? 1 : -1), !v.paused); return;
    }
    var foglio = el("tasti");
    if (foglio) { foglio.remove(); if (k === "escape" || k === "?") { e.preventDefault(); return; } }
    if (k === "?" || (k === "/" && e.shiftKey)) { e.preventDefault(); fogliettoTasti(); return; }
    if (k === " " || k === "k") { e.preventDefault(); v.paused ? v.play().catch(function(){}) : v.pause(); return; }
    if (TASTI[k] !== undefined) {
      e.preventDefault(); seguiLive = false;
      var passo = TASTI[k];
      if (e.shiftKey && (k === "arrowleft" || k === "arrowright")) passo = passo / Math.abs(passo) / FPS;
      else if (e.altKey) passo *= 10;
      v.currentTime = Math.max(0, v.currentTime + passo);
      return;
    }
    // su e giu': di segno in segno, come Premiere salta di taglio in taglio
    if (k === "arrowup" || k === "arrowdown") {
      e.preventDefault(); seguiLive = false;
      var segni = ((REG && REG.marker) || []).map(function (m) { return m.secondi; }).sort(function (a, b) { return a - b; });
      var ora = v.currentTime;
      var meta = (k === "arrowdown")
        ? segni.find(function (x) { return x > ora + 0.3; })
        : segni.filter(function (x) { return x < ora - 0.3; }).pop();
      if (meta !== undefined) v.currentTime = meta;
      return;
    }
    if (k === "i") { e.preventDefault(); if (e.shiftKey) { if (dentro !== null) v.currentTime = dentro; }
                     else if (e.altKey) { dentro = null; mostraInOut(); } else segnaIn(); return; }
    if (k === "o") { e.preventDefault(); if (e.shiftKey) { if (fuori !== null) v.currentTime = fuori; }
                     else if (e.altKey) { fuori = null; mostraInOut(); } else segnaOut(); return; }
    if (k === "m") { var bm = el("btnMarker"); if (bm) { e.preventDefault(); bm.click(); } return; }
    if (k === "home") { e.preventDefault(); seguiLive = false; v.currentTime = 0; return; }
    if (k === "end") { e.preventDefault(); v.currentTime = Math.max(0, durataAperta() - 1); return; }
    if (k === "+" || k === "=") { e.preventDefault(); LENTE = Math.min(32, LENTE * 2); disegnaTutto(); return; }
    if (k === "-") { e.preventDefault(); LENTE = Math.max(1, LENTE / 2); disegnaTutto(); return; }
    if (k === "\\") { e.preventDefault(); LENTE = 1; disegnaTutto(); return; }
    if (k === "t") {
      var b = el("btnTaglia");
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
      return;
    }
    if (k === "1" || k === "2" || k === "3") {
      var f = ["16:9", "3:4", "9:16"][+k - 1];
      var bf = document.querySelector('#formati button[data-f="' + f + '"]');
      if (bf) { e.preventDefault(); bf.click(); }
    }
  });

  function segnaIn() { if (!el("player")) return; dentro = el("player").currentTime; if (fuori !== null && fuori <= dentro) fuori = null; mostraInOut(); }
  function segnaOut() { if (!el("player")) return; fuori = el("player").currentTime; if (dentro !== null && dentro >= fuori) dentro = null; mostraInOut(); }
  function taglia(inSequenza) {
    if (!REG) return;
    var suo = formato;                      // dove andra' a finire
    el("btnTaglia").disabled = true;
    manda({ tipo:"clip-taglia", reg:REG.id, dentro:dentro, fuori:fuori, formato:suo, preciso:preciso,
            inSequenza: inSequenza === true })
      .then(function () {
        dice(inSequenza === true ? "Pezzo in lavorazione: entra nella sequenza appena pronto."
                                 : "Clip in lavorazione: la trovi nel progetto, a sinistra.", true);
        dentro = null; fuori = null; mostraInOut(); aggiorna();
      })
      .catch(function (e) { dice(e.message); mostraInOut(); });
  }

  // Guardare una clip gia' fatta non e' un altro mestiere: si guarda dove
  // si guarda tutto, al centro. Con un modo per tornare al contenuto.
  var guardando = null;
  function mostraNelCentro(url, fmt, nome) {
    var v = el("player"); if (!v) return;

    apertaId = ""; guardando = nome || "clip";

  // Il video non e' qui: sta in un secchio S3 da sette giga. Non lo si
  // scarica — si chiede un indirizzo firmato e lo si apre al secondo
  // giusto, che e' l'unica cosa che interessa.
  function apriDaArchivio(rec, dove, nome, pezzo) {
    dice("Apro dall'archivio\u2026");
    manda({ tipo: "clip-archivio-apri", rec: rec, pezzo: pezzo || 0 }).then(function (d) {
      var sc = el("foglio"); if (sc) sc.remove();
      guardando = null;
      return aggiorna().then(function () {
        vaiA(d.reg.id, (dove || dove === 0) ? dove : null, "tutto");
        // il file d'archivio ci mette qualche secondo a farsi conoscere: il
        // salto si aggancia all'evento, non a un'attesa a tempo
        var v = el("player");
        if (v && dove) {
          var vai = function () {
            if (!v.duration) return;
            try { v.currentTime = dove; } catch (e) {}
            v.removeEventListener("loadedmetadata", vai);
            v.removeEventListener("durationchange", vai);
          };
          v.addEventListener("loadedmetadata", vai);
          v.addEventListener("durationchange", vai);
          vai();
        }
        dice(d.giaAperta ? "Gi\u00e0 fra i contenuti" :
             "Dall'archivio \u00b7 nessun byte copiato", true);
      });
    }).catch(function (e) { dice(e.message); });
  }

  // Il cartellino in basso al video: che cosa sto guardando, e in che forma.
  function targa(nome, fmt, coda) {
    var t = el("targa"); if (!t) return;
    if (!nome) { t.hidden = true; return; }
    t.querySelector("b").textContent = nome;
    t.querySelector("i").textContent = [fmt || formato, coda].filter(Boolean).join("  \u00b7  ");

  function apri(r) {
    var v = el("player"); if (!v) return;
    // L'indirizzo di una partita d'archivio e' firmato e cambia a ogni giro
    // di aggiornamento: riattaccarlo vorrebbe dire ricaricare il video ogni
    // tre secondi e riportarlo a zero sotto le mani di chi sta lavorando.
    if (apertaId === r.id && (hls || r.materiale === "archivio")) return;
    apertaId = r.id;
    if (hls) { hls.destroy(); hls = null; }
    if (r.materiale === "archivio") {                 // i byte sono su S3, non qui
      if (r.via) { v.src = r.via; v.play().catch(function(){}); }
      return;
    }
    if (r.materiale === "integrale") { v.src = BASE + "/clip/" + r.id + "/integrale.mp4"; v.play().catch(function(){}); return; }
    if (r.materiale === "scaduto") { v.removeAttribute("src"); v.load(); return; }
    var indirizzo = BASE + "/clip/" + r.id + "/live.m3u8";
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDuration: 8, backBufferLength: 3600 });
      hls.on(Hls.Events.ERROR, function (ev, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(function () { try { hls.startLoad(); } catch (e) {} }, 2000);
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(indirizzo); hls.attachMedia(v);

    v.play().catch(function () {});

    // Mille voci in una tendina non si scorrono: si scrive e restano

    el("eventoCerca").addEventListener("input", function () {

  // TOGLIERE UNA CLIP.
  //
  //  Due passi, non uno: "elimina" diventa "sicuro?" e solo il secondo click
  //  cancella. Un file video non torna indietro, e in una griglia di
  //  francobolli tutti uguali il dito sbaglia bersaglio facilmente.
  //
  //  Serve la chiave di REGIA, non quella di lavoro: tagliare e guardare li
  //  puo' fare chiunque, buttare no. Se non ce l'hai in tasca te la chiede
  //  al momento, invece di dirti solo che non si puo'.
  function elimina(id, quando) {
    manda({ tipo: "clip-elimina", clip: id })
      .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
      .catch(function (e) {
        if (!/chiave/i.test(e.message)) { dice(e.message); return; }
        var k = window.ChiaveComoTV ? ChiaveComoTV.valore("comando",
          "Per eliminare una clip serve la chiave di COMANDO della regia.\n\n" +
          "Tagliare e guardare li puo' fare chiunque; buttare no.") : "";
        if (!k) { dice("Serve la chiave di comando della regia."); return; }
        TOKEN = k;
        manda({ tipo: "clip-elimina", clip: id })
          .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
          .catch(function (e2) { dice(e2.message); });
      });
  }
  // il tasto che si trasforma in domanda invece di aprire una finestra
  function tastoElimina(id, dopo) {
    var a = document.createElement("a");
    a.href = "#"; a.textContent = "elimina"; a.className = "togli";
    var chiesto = false, torna = null;
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (!chiesto) {
        chiesto = true; a.textContent = "sicuro?"; a.classList.add("sicuro");
        torna = setTimeout(function () {
          chiesto = false; a.textContent = "elimina"; a.classList.remove("sicuro");
        }, 4000);
        return;
      }
      clearTimeout(torna);
      a.textContent = "…";
      elimina(id, dopo);
    });
    return a;
  }

  // ── viste d'archivio ────────────────────────────────────────────
  function tuttoIlMateriale() {
    var lista = [];
    CLIP.forEach(function (c) { lista.push({ t:"clip", o:c }); });
    if (REG && REG.integrale === "pronto") lista.push({ t:"integrale", o:REG });
    if (SEQ) lista.push({ t:"hl", o:SEQ });

  // Il tipo e la forma si sommano: "clip" e "9:16" insieme vogliono dire le
  // clip verticali, non due elenchi separati.
  function assetVisibili() {
    return tuttoIlMateriale().filter(function (a) {
      if (VISTA !== "tutto" && a.t !== VISTA) return false;
      if (FORMA) {
        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
        if (f !== FORMA) return false;
      }
      return true;
    });
  }
  // quanti ce ne sono per ogni linguetta, con la forma scelta gia' applicata
  function conteggi() {
    var c = { tutto:0, clip:0, hl:0, integrale:0 };
    tuttoIlMateriale().forEach(function (a) {
      if (FORMA) {
        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
        if (f !== FORMA) return;
      }
      c.tutto++; c[a.t]++;

    return c;

      }
      schedaSotto(null); return;
    }
    var g = document.createElement("div"); g.className = "griglia"; c.innerHTML = ""; c.appendChild(g);
    lista.forEach(function (a, i) {
      var fmt = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
      var dur = a.t === "clip" ? (a.o.durataVera || a.o.durata) + "s"
              : a.t === "integrale" ? orologio(a.o.durata)
              : orologio((a.o.pezzi || []).reduce(function (s2, x) { return s2 + (x.fuori - x.dentro); }, 0));
      var nome = a.t === "clip" ? a.o.titolo : a.t === "integrale" ? "Integrale" : a.o.titolo;
      var d = document.createElement("div");
      d.className = "scheda" + (i === ASSET ? " scelta" : "");

      // IL FOTOGRAMMA. Una griglia di rettangoli vuoti non e' un archivio:

        "<span class='durata'>" + dur + "</span>" +

        "<div class='testo'><div class='nome'>" + nome + "</div><div class='sotto'>" +
        (a.t === "hl" ? (a.o.pezzi || []).length + " pezzi" : a.t) + "</div></div>";
      if (a.t === "clip" && a.o.stato === "pronta") {

        });

      }

        ASSET = i;
        var suo = a.t === "clip" ? BASE + "/clip/_clip/" + a.o.id + ".mp4"
                : a.t === "integrale" ? BASE + "/clip/" + a.o.id + "/integrale.mp4"

        if (suo) mostraNelCentro(suo, fmt, nome);

      // I COMANDI SULLA SCHEDA. Prima stavano solo nel dettaglio: per

      if (a.t === "clip" && a.o.stato === "pronta") {

        var az = document.createElement("div"); az.className = "comandi";
        var gr = document.createElement("a");
        gr.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(a.o.titolo) +
                  (a.o.evento ? "&evento=" + encodeURIComponent(a.o.evento) : "");
        gr.target = "_blank"; gr.rel = "noopener"; gr.textContent = "grafica";
        var sc = document.createElement("a"); sc.href = url + "?scarica=1"; sc.textContent = "scarica";
        [gr, sc].forEach(function (x) { x.addEventListener("click", function (e) { e.stopPropagation(); }); });
        var el2 = tastoElimina(a.o.id, function () { ASSET = 0; });

        d.appendChild(az);
      } else if (a.t !== "clip") {
        var url2 = a.t === "integrale" ? BASE + "/clip/" + a.o.id + "/integrale.mp4"

        if (url2) {
          var az2 = document.createElement("div"); az2.className = "comandi";
          var s3 = document.createElement("a"); s3.href = url2 + "?scarica=1"; s3.textContent = "scarica";
          s3.addEventListener("click", function (e) { e.stopPropagation(); });
          az2.appendChild(s3); d.appendChild(az2);
        }
      }
      g.appendChild(d);
    });
    schedaSotto(lista[ASSET] || lista[0]);
  }

  // Sotto la griglia, i dati di quello che hai scelto. Il video non ci sta
  // piu': si guarda al centro, dove si guarda tutto il resto.
  function schedaSotto(a) {
    return;                                  // i comandi stanno sulla clip stessa
    var d = document.createElement("div");
    d.className = "scheda-sotto";
    if (!a) { d.innerHTML = ""; return; }
    d.innerHTML = '<h2 style="margin-top:16px">Scheda</h2><div id="corpo"></div>';
    var corpo = el("corpo");
    if (a.t === "hl") {
      var q = a.o;
      corpo.innerHTML = "<div class='vuoto'>" + q.pezzi.length + " pezzi · " +
        orologio(q.pezzi.reduce(function (x, y) { return x + (y.fuori - y.dentro); }, 0)) +
        (q.scarto ? " · orologio tarato di " + q.scarto + "s" : "") + "</div>";
      (q.avvisi || []).forEach(function (t) {
        var w = document.createElement("div"); w.className = "avviso vedi";
        w.style.marginTop = "8px"; w.textContent = t; corpo.appendChild(w);
      });

      // Il ritocco: si arriva vicini in automatico e si stringe guardando.
      // "Tara qui" e' il gesto che vale piu' di tutti: sposta TUTTI i pezzi
      // non toccati a mano della stessa quantita', perche' il ritardo del
      // flusso e' uno solo per tutta la partita.
      function ritocca(corpoRichiesta) {
        corpoRichiesta.tipo = "clip-hl-pezzo"; corpoRichiesta.seq = q.id;
        manda(corpoRichiesta).then(function (d) { SEQ = d.seq; destraMateriale(); })
          .catch(function (e) { dice(e.message); });
      }
      q.pezzi.forEach(function (x, n) {
        var v = document.createElement("div"); v.className = "voce";
        v.innerHTML = "<div class='testo'><div class='nome'>" + (n + 1) + ". " + x.titolo + "</div>" +
          "<div class='dett'>" + orologio(x.dentro) + " → " + orologio(x.fuori) + " · " +
          Math.round(x.fuori - x.dentro) + "s · " + x.fonte + (x.mano ? " · a mano" : "") + "</div></div>";
        var az = document.createElement("div"); az.className = "azioni";
        function tasto(testo, cosa, spiega) {
          var a2 = document.createElement("a"); a2.href = "#"; a2.textContent = testo;
          if (spiega) a2.title = spiega;
          a2.addEventListener("click", function (e) { e.preventDefault(); cosa(); });
          az.appendChild(a2);
        }
        tasto("vai", function () {
          tornaAlContenuto();               // il visore mostra la registrazione
          var giri = 0, attesa = setInterval(function () {
            var vv = el("player");
            if (++giri > 30) return clearInterval(attesa);
            if (!vv || !vv.duration) return;
            clearInterval(attesa); seguiLive = false;
            vv.currentTime = x.dentro; vv.play().catch(function () {});
          }, 300);
        });
        tasto("−1", function () { ritocca({ pezzo:x.id, dentro:x.dentro - 1 }); }, "entra un secondo prima");
        tasto("+1", function () { ritocca({ pezzo:x.id, dentro:x.dentro + 1 }); }, "entra un secondo dopo");
        tasto("+fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori + 1 }); });
        tasto("−fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori - 1 }); });
        tasto("tara qui", function () {
          var vv = el("player");
          if (!vv || !vv.duration) { dice("Apri il live e porta il visore dove sta l’azione, poi tara."); return; }
          manda({ tipo:"clip-hl-taratura", seq:q.id, pezzo:x.id, secondi:vv.currentTime })
            .then(function (d) { SEQ = d.seq; destraMateriale();
              dice("Orologio tarato di " + d.seq.scarto + "s: si sono spostati tutti.", true); })
            .catch(function (e) { dice(e.message); });
        }, "l’azione è dove sta il visore adesso: sposta tutti gli altri della stessa quantità");
        tasto("togli", function () { ritocca({ pezzo:x.id, togli:1 }); });
        v.appendChild(az);
        corpo.appendChild(v);
      });

      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      az2.innerHTML = '<button class="b oro" id="hlMp4">Esporta MP4</button>' +
                      '<button class="b" id="hlXml">Per Premiere</button>';
      corpo.appendChild(az2);
      if (q.export && q.export.stato === "pronto") {
        var g1 = document.createElement("div"); g1.className = "aiuto";
        g1.innerHTML = '<a href="' + BASE + q.export.file + '?scarica=1">scarica il video (' +
                       q.export.formato + ", " + orologio(q.export.durata) + ")</a>";
        corpo.appendChild(g1);
      }
      if (q.export && q.export.stato === "lavora") {
        var g2 = document.createElement("div"); g2.className = "aiuto";
        g2.textContent = "esporto… " + q.export.fatti + "/" + q.export.quanti;
        corpo.appendChild(g2);
      }
      if (q.premiere) {
        var g3 = document.createElement("div"); g3.className = "aiuto";
        g3.innerHTML = '<a href="' + BASE + q.premiere.file + '?scarica=1">scarica l’XML per Premiere</a>';
        corpo.appendChild(g3);
      }
      el("hlMp4").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, formato:formato })
          .then(function () { dice("Esporto il video in " + formato + "…", true); })
          .catch(function (e) { dice(e.message); });
      });
      el("hlXml").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, come:"premiere" })
          .then(function (d) { SEQ.premiere = d.premiere; destraMateriale();
            dice(d.premiere.integrale ? "XML pronto." :
                 "XML pronto, ma manca l’integrale: in Premiere andrà ricollegato.", true); })
          .catch(function (e) { dice(e.message); });
      });
      return;
    }

    var o = a.o;
    corpo.innerHTML = "<table class='dati'>" +
      "<tr><td>Nome</td><td>" + (o.titolo || "Integrale") + "</td></tr>" +
      (a.t === "clip" ? "<tr><td>Formato</td><td>" + o.formato + "</td></tr>" : "") +
      "<tr><td>Durata</td><td>" + (a.t === "clip" ? (o.durataVera || o.durata) + "s" : orologio(o.durata)) + "</td></tr>" +
      (o.peso || o.integralePeso ? "<tr><td>Peso</td><td>" + peso(o.peso || o.integralePeso) + "</td></tr>" : "") +
      (o.minuto ? "<tr><td>Minuto</td><td>" + o.minuto + "</td></tr>" : "") +
      (o.chi ? "<tr><td>Chi</td><td>" + o.chi + "</td></tr>" : "") +
      "</table>";
    if (a.t === "clip") {
      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      var g = document.createElement("a");
      g.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(o.titolo);
      g.target = "_blank"; g.rel = "noopener";
      g.innerHTML = '<button class="b oro">Grafica social</button>';
      var s2 = document.createElement("a"); s2.href = url + "?scarica=1";
      s2.innerHTML = '<button class="b">Scarica</button>';
      az2.appendChild(g); az2.appendChild(s2); corpo.appendChild(az2);
      var az3 = document.createElement("div"); az3.style.marginTop = "10px";
      var t = tastoElimina(o.id, function () { ASSET = 0; });
      t.className = "togli grande";
      az3.appendChild(t); corpo.appendChild(az3);
    }
  }

  // ── cercare ─────────────────────────────────────────────────────
  //
  //  La ricerca non e' una linguetta in piu': quando c'e' una domanda nella
  //  barra, la colonna centrale risponde a quella e basta. Si svuota la
  //  barra e si torna esattamente dov'eravamo.
  var RIS = null, vistaPrima = "live", attesaCerca = 0;

  function cerca(q) {
    manda({ tipo: "clip-cerca", q: q }).then(function (d) {
      RIS = d; disegnaRisultati();
    }).catch(function (e) { dice(e.message); });
  }

  function disegnaRisultati() {
    var c = el("bin"); if (!c) return; c.innerHTML = "";
    var box = document.createElement("div"); box.className = "risultati"; c.appendChild(box);
    if (!RIS || RIS.vuota) { box.innerHTML = '<div class="vuoto">Scrivi che cosa cerchi.</div>'; return; }

    // far vedere COME e' stata capita la domanda: se sbaglia, si vede subito
    var q = RIS.domanda || {}, letta = [];
    (q.parole || []).forEach(function (p) { letta.push("<em>" + p + "</em>"); });
    if (q.formato) letta.push("<em>formato " + q.formato + "</em>");
    if (q.genere) letta.push("<em>" + q.genere + "</em>");
    if (q.quando) {
      var mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
                  "agosto","settembre","ottobre","novembre","dicembre"];
      letta.push("<em>" + (q.quando.giorno || "") + " " +
                 (q.quando.mese >= 0 ? mesi[q.quando.mese] : "") + " " + (q.quando.anno || "") + "</em>");
    }
    var l = document.createElement("div"); l.className = "letta";
    l.innerHTML = "Cerco: " + letta.join(" ") + " · " + RIS.quante + " risultati";
    box.appendChild(l);

    if (!RIS.quante) { box.innerHTML += '<div class="vuoto">Niente. Prova con meno parole.</div>'; return; }

    function titolo(t, n) {
      var h = document.createElement("h3");
      h.innerHTML = t + " <b>" + n + "</b> <i></i>";
      box.appendChild(h);
    }
    function riga(nome, dett, coda, quando) {
      var v = document.createElement("div"); v.className = "voce cliccabile";
      v.innerHTML = "<div class='testo'><div class='nome'>" + nome + "</div>" +
                    "<div class='dett'>" + dett + "</div></div>" +
                    (quando ? "<span class='quando2'>" + quando + "</span>" : "") +
                    (coda ? "<a href='#'>" + coda + "</a>" : "");
      box.appendChild(v); return v;
    }
    function data(ms) {
      if (!ms) return "";
      var d = new Date(ms);
      return ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2);
    }

    if (RIS.partite.length) {
      titolo("Partite", RIS.partite.length);
      RIS.partite.forEach(function (r) {
        riga(r.titolo, (r.competizione || "senza competizione") + " · " + orologio(r.durata) +
             " · " + (r.quanteClip || 0) + " clip", "apri", data(r.avviata))
          .addEventListener("click", function () { vaiA(r.id, null, "tutto"); });
      });
    }
    if (RIS.clip.length) {
      titolo("Clip e sequenze", RIS.clip.length);
      RIS.clip.forEach(function (c) {
        riga(c.titolo, (c.seq ? c.pezzi + " pezzi · sequenza" : c.formato + " · " +
             (c.durataVera || c.durata) + "s") + (c.partita ? " · " + c.partita : ""),
             "vedi", data(c.creata))
          .addEventListener("click", function () { vaiA(c.reg, null, c.seq ? "hl" : "clip"); });
      });
    }
    // Le azioni scritte dai giornalisti nelle partite passate. Quasi
    // sempre il video non e' qui: la riga dice dove andarlo a prendere —
    // quale partita, quale minuto. Quando invece la registrazione c'e',
    // la riga si apre come tutte le altre.
    if (RIS.azioni && RIS.azioni.length) {
      titolo("Negli appunti della redazione", RIS.azioni.length);
      RIS.azioni.forEach(function (a) {
        var qui = REGISTRAZIONI.filter(function (x) { return x.evento === a.rec; })[0];
        var inArchivio = a.archivio && a.dove;
        var v = riga((a.hl ? "\u2605 " : "") + (a.testo || a.tipo),
             a.partita + " \u00b7 " + a.minuto + (a.tempo === 2 ? " (2\u00b0T)" : "") +
             (a.competizione ? " \u00b7 " + a.competizione : ""),
             qui ? "guarda" : (inArchivio ? "archivio" : ""), data(Date.parse(a.quando)));
        if (qui) v.addEventListener("click", function () { vaiA(qui.id, null, "tutto"); });
        else if (inArchivio) {
          v.addEventListener("click", function () {
            apriDaArchivio(a.rec, a.dove, a.partita, a.pezzo);
          });
        } else {
          v.style.opacity = ".78";
          v.addEventListener("click", function () { apriAppunti(a.rec); });
        }
      });
    }
    if (RIS.segni.length) {
      titolo("Segni nelle partite", RIS.segni.length);
      RIS.segni.forEach(function (m) {
        riga(m.testo || m.tipo || "segno",
             m.partita + " · " + orologio(m.secondi) + (m.fonte ? " · " + m.fonte : ""),
             "guarda", data(m.quando))
          .addEventListener("click", function () { vaiA(m.reg, m.secondi, "live"); });
      });
    }
  }

  // Il video di questa partita non e' collegato al MAM. Quello che c'e' —
  // e non e' poco — sono gli appunti di chi l'ha guardata: la partita
  // intera, minuto per minuto. Serve a decidere se vale la pena andare a
  // cercare il file, prima di andarlo a cercare.
  function apriAppunti(rec) {
    manda({ tipo: "clip-appunti-partita", rec: rec }).then(function (d) {
      var vecchia = el("foglio"); if (vecchia) vecchia.remove();
      var s = document.createElement("div");
      s.className = "foglio"; s.id = "foglio";
      var d0 = new Date(d.quando);
      var quando = isFinite(d0) ? ("0"+d0.getDate()).slice(-2) + "/" +
                   ("0"+(d0.getMonth()+1)).slice(-2) + "/" + d0.getFullYear() : "";
      var righe = "", tempo = 0, hl = 0;
      d.righe.forEach(function (r) {
        if (r.s !== tempo) {
          tempo = r.s;
          righe += '<div class="tempo">' + (tempo === 1 ? "Primo tempo" : "Secondo tempo") + '</div>';
        }
        if (r.hl) hl++;
        righe += '<div class="az' + (r.hl ? " hl" : "") +
                 (r.dove ? " apri\" data-dove=\"" + r.dove +
                           "\" data-pezzo=\"" + (r.pezzo || 0) : "") + '">' +
                 '<u>' + (r.hl ? "\u2605 " : "") + r.m + '</u>' +
                 '<i>' + (r.t || "") + '</i><p>' + r.x + '</p></div>';
      });
      s.innerHTML = '<div><header><b>' + d.partita + '</b>' +
        '<span>' + (d.competizione || "") + (quando ? " \u00b7 " + quando : "") +
        " \u00b7 " + d.righe.length + ' azioni' + (hl ? " \u00b7 " + hl + " segnate per gli HL" : "") +
        '</span><a href="#" id="foglioChiudi">chiudi</a></header>' +
        '<div class="righe">' + (righe || '<div class="az"><p>Nessuna azione.</p></div>') + '</div>' +
        '<footer>Il video di questa partita non \u00e8 collegato al MAM: ' +
        'gli appunti dicono <b>quale minuto</b>, il file sta in archivio.</footer></div>';
      document.body.appendChild(s);
      s.querySelectorAll(".az.apri").forEach(function (r) {
        r.addEventListener("click", function () {
          apriDaArchivio(d.rec, +r.dataset.dove, d.partita, +r.dataset.pezzo || 0);
        });
      });
      var via = function (e) { if (e) e.preventDefault(); s.remove(); };
      s.addEventListener("click", function (e) { if (e.target === s) via(); });
      el("foglioChiudi").addEventListener("click", via);
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { via(); document.removeEventListener("keydown", esc); }
      });
    }).catch(function (e) { dice(e.message); });
  }

  // dal risultato al materiale: si sceglie la partita, si va alla vista
  // giusta e — se e' un segno — il player ci salta dentro.
  function vaiA(idReg, secondi, vista) {
    var r = REGISTRAZIONI.filter(function (x) { return x.id === idReg; })[0];
    if (r) REG = r;
    el("q").value = ""; RIS = null;
    VISTA = vista || "tutto";
    document.querySelectorAll("#linguette button").forEach(function (x) {
      x.className = (x.dataset.v === "live" ? "live" : "") + (x.dataset.v === VISTA ? " acceso" : "");
    });
    disegna();
    if (secondi !== null && secondi !== undefined) {
      var giri = 0;
      var attesa = setInterval(function () {
        var v = el("player");
        if (++giri > 30) return clearInterval(attesa);
        if (!v || !v.duration) return;
        clearInterval(attesa);
        seguiLive = false; v.currentTime = secondi; v.play().catch(function () {});
      }, 300);
    }
  }

  el("q").addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(attesaCerca);
    if (!q) { RIS = null; VISTA = vistaPrima; accendiLinguette(); disegna(); return; }
    if (VISTA !== "cerca") { vistaPrima = VISTA; VISTA = "cerca";
      document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
        x.className = (x.dataset.v === "live" ? "live" : "");
      });
      if (hls) { hls.destroy(); hls = null; apertaId = ""; }

    }
    attesaCerca = setTimeout(function () { cerca(q); }, 280);
  });
  el("q").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { this.value = ""; this.dispatchEvent(new Event("input")); this.blur(); }
  });

  // ── il giro ─────────────────────────────────────────────────────
  // IL CENTRO NON CAMBIA MESTIERE.
  //
  //  Prima le linguette sostituivano la finestra di lavorazione con una
  //  griglia: si arrivava, si sceglieva "Clip", e il visore spariva. Ma il
  //  giro vero e' uno solo — si arriva, si lavora la clip, la si spedisce —
  //  e quel giro sta tutto al centro. Il materiale prodotto e' un'altra
  //  cosa: sta a destra, e da li' non toglie niente.
  function disegna() {
    firmaVecchia = "";                     // un gesto dell'utente ridisegna sempre
    albero(); consoleSinistra();
    if (!el("player")) centroLavoro();     // la finestra di lavorazione si costruisce una volta
    disegnaConsole(); disegnaSequenza();
    if (VISTA === "cerca") { disegnaRisultati(); return; }
    destraMateriale();
  }

  // la firma di quello che si vede: se non cambia, non si tocca
  var firmaVecchia = "";
  function cambiato() {
    var f = [VISTA, FORMA, ASSET, REG ? REG.id + REG.stato + REG.integrale : "-",
      CLIP.map(function (c) { return c.id + c.stato + (c.mini ? "1" : "0"); }).join(","),
      SEQ ? SEQ.id + SEQ.pezzi.length + (SEQ.export ? SEQ.export.stato : "") : "-"].join("|");
    if (f === firmaVecchia) return false;
    firmaVecchia = f; return true;
  }

  function aggiorna() {
    return manda({ tipo:"clip-stato" }).then(function (d) {
      REGISTRAZIONI = d.reg || [];
      DISCO = d.disco || null;
      if (REG) { var mio = REGISTRAZIONI.filter(function (r) { return r.id === REG.id; })[0]; if (mio) REG = mio; else REG = null; }
      if (!REG && REGISTRAZIONI.length) REG = REGISTRAZIONI[0];
      CLIP = (d.clip || []).filter(function (c) { return !REG || c.reg === REG.id; });
      barra();
      if (REG && el("player") && !guardando) apri(REG);
      disegnaConsole(); capo(); disegnaSequenza();
      if (VISTA === "cerca") { albero(); return; }      // sta cercando: non si tocca la lista
      if (cambiato()) destraMateriale();
      // Se non e' cambiato niente NON si ridisegna: rifare la griglia ogni
      // tre secondi buttava via le miniature prima che finissero di
      // caricarsi (e con loro la posizione dello scorrimento). Una lista che
      // si rigenera da sola sotto le mani e' peggio di una lista vecchia.
      albero();
      if (REG) {
        manda({ tipo:"clip-hl-elenco", reg:REG.id }).then(function (h) {
          SEQ = (h.seq || [])[0] || null;
          if (VISTA === "hl") destraMateriale();
        }).catch(function () {});
      }
    }).catch(function (e) { el("sPonte").textContent = "non risponde"; el("sPonteP").className = "pallino"; });
  }

  function barra() {
    var aperte = REGISTRAZIONI.filter(function (r) { return r.stato === "registra"; });
    var lav = CLIP.filter(function (c) { return c.stato === "lavora"; }).length;
    el("sRec").textContent = aperte.length ? aperte.length + " · " + orologio(aperte[0].durata || 0) : "nessuna";
    el("sPall").className = "pallino" + (aperte.some(function (r) { return !r.attesa && !r.guarda; }) ? " rec" : "");
    if (DISCO) {
      el("sDisco").textContent = DISCO.liberi + " GB · ~" + DISCO.partite + " partite";
      el("sBarra").style.width = Math.max(4, Math.min(100, 100 - DISCO.liberi / 79 * 100)) + "%";
    }
    el("sLav").textContent = lav ? lav + " in lavorazione" : "niente in coda";
    el("sPonte").textContent = "risponde"; el("sPonteP").className = "pallino ok";
    // la linguetta LIVE si accende da sola quando qualcosa sta girando
    segnaConteggi();
  }

  document.querySelectorAll("#linguette [data-v]").forEach(function (b) {
    b.dataset.nome = b.textContent;
    b.addEventListener("click", function () {
      VISTA = b.dataset.v; ASSET = 0;
      accendiLinguette(); disegna();
    });
  });
  document.querySelectorAll("#linguette [data-forma]").forEach(function (b) {
    b.addEventListener("click", function () {
      FORMA = b.dataset.forma; ASSET = 0;
      // scegliere una forma mentre si e' sul live vuol dire voler vedere
      // quel materiale: si passa a "tutto" invece di non far succedere niente
      if (VISTA === "cerca") VISTA = "tutto";
      accendiLinguette();
      disegna();
    });
  });
  function accendiLinguette() {
    document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
      x.className = (x.dataset.v === VISTA ? "acceso" : "");
    });
    document.querySelectorAll("#linguette [data-forma]").forEach(function (x) {
      x.className = (x.dataset.forma === FORMA ? "acceso" : "");
    });
  }

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "i") { segnaIn(); e.preventDefault(); }
    else if (k === "o") { segnaOut(); e.preventDefault(); }
    else if (k === "t") { if (el("btnTaglia") && !el("btnTaglia").disabled) taglia(); e.preventDefault(); }
    else if (k === " ") { var v = el("player"); if (v) { v.paused ? v.play().catch(function(){}) : v.pause(); } e.preventDefault(); }
  });

  disegna();
  aggiorna();
  setInterval(aggiorna, 3000);
})();
</script>
