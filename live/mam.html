<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como TV</title>
<meta name="theme-color" content="#0A0F24">
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}

  /* ══════════════════════════════════════════════════════════════
     UNA PAGINA SOLA.
     Le tre colonne non si muovono mai: a sinistra le partite, al centro
     quello che si guarda, a destra quello che si fa. A cambiare e' solo
     il contenuto, scelto dalla riga di linguette — LIVE compreso.
     Prima erano due pagine e un interruttore in alto a destra: due posti
     dove cercare la stessa cosa, e infatti non si trovava.
     Colori: la variante "carta" del design system — avorio come fondo,
     navy come inchiostro, oro profondo per il testo in oro. Restano scure
     la riga di stato e i riquadri del video: strumentazione e immagine.
     ══════════════════════════════════════════════════════════════ */
  :root{
    color-scheme:light;
    --carta:#F5F1E6;--carta-2:#FFFDF7;--bianco:#FFFFFF;
    --inchiostro:#0A0F24;--inchiostro-2:#464E6E;--inchiostro-3:#6B7290;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;--ok:#2E9E68;
    --linea:rgba(10,15,36,.10);--linea-oro:rgba(166,124,46,.35);
    --scuro:#0A0F24;
    --ombra:0 1px 2px rgba(10,15,36,.06), 0 6px 18px rgba(10,15,36,.05);
    --barra:52px;
  }
  /* La pagina non scorre: sta dentro uno schermo di portatile e basta.
     A scorrere sono le colonne, ognuna per conto suo — cosi' mentre cerchi
     nella griglia non perdi di vista il visore, e mentre guardi il visore
     non perdi la lista delle partite. */
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.45;
    color:var(--inchiostro);background-color:var(--carta);
    display:flex;flex-direction:column;
    background-image:
      radial-gradient(90% 70% at 18% 4%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(70% 70% at 95% 100%, rgba(201,162,75,.13), transparent 60%);
    background-attachment:fixed;}

  .testata{display:flex;align-items:center;gap:18px;flex:0 0 auto;
    padding:11px clamp(14px,3vw,26px);z-index:50;
    background:var(--scuro);color:var(--carta);border-bottom:2px solid var(--gold);}
  .marchio{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;white-space:nowrap;}
  .marchio small{display:block;font-size:9px;letter-spacing:.26em;color:var(--gold-bright);font-weight:700;}
  .cerca{flex:1 1 320px;display:flex;gap:8px;align-items:center;
    background:rgba(245,241,230,.10);border:1px solid rgba(245,241,230,.16);border-radius:10px;padding:9px 13px;}
  .cerca input{flex:1;background:none;border:none;color:var(--carta);font-family:inherit;font-size:14px;}
  .cerca input:focus{outline:none;}
  .cerca input::placeholder{color:rgba(245,241,230,.45);}
  .cerca .lente{color:rgba(245,241,230,.55);}
  .torna{color:rgba(245,241,230,.6);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
  .torna:hover{color:var(--gold-bright);}

  .tre{display:grid;grid-template-columns:262px minmax(0,1fr) 380px;
    flex:1 1 auto;min-height:0;}
  @media (max-width:1240px){.tre{grid-template-columns:200px minmax(0,1fr) 320px;}}
  .col{padding:14px clamp(10px,1.2vw,18px);overflow:auto;min-height:0;}
  .col + .col{border-left:1px solid var(--linea);}
  .col h2{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.26em;
    text-transform:uppercase;color:var(--inchiostro-3);margin-bottom:14px;
    display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--linea);}
  .col h2 span{color:var(--gold-deep);}

  .ramo>.testa{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
    font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--inchiostro-2);}
  .ramo .conta{margin-left:auto;color:var(--inchiostro-3);font-family:'DM Sans';font-size:11px;letter-spacing:0;text-transform:none;}
  .foglia{display:flex;gap:8px;align-items:baseline;padding:8px 10px 8px 22px;border-radius:7px;
    cursor:pointer;font-size:13px;}
  .foglia:hover{background:rgba(10,15,36,.045);}
  .foglia.scelta{background:rgba(201,162,75,.16);box-shadow:inset 2px 0 0 var(--gold-deep);font-weight:700;}
  .foglia .quando{margin-left:auto;color:var(--inchiostro-3);font-size:11px;}
  .foglia .rec{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
    box-shadow:0 0 8px rgba(229,27,32,.8);animation:batte 1.4s ease-in-out infinite;}

  /* ── le linguette: sono la navigazione, non un filtro ───────────── */
  .linguette{display:flex;gap:6px;align-items:center;margin-bottom:13px;flex-wrap:wrap;}
  .linguette .stacco{width:1px;align-self:stretch;background:var(--linea);margin:2px 5px;}
  .linguette .forme{display:flex;gap:5px;align-items:center;}
  .linguette .forme button{padding:6px 11px;font-size:9px;}
  .linguette .et2{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--inchiostro-3);margin-right:2px;}
  .linguette .conta2{margin-left:6px;opacity:.55;font-size:9px;}
  .linguette button{background:var(--carta-2);border:1px solid var(--linea);border-radius:20px;
    color:var(--inchiostro-2);cursor:pointer;padding:7px 15px;
    font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .linguette button:hover{border-color:var(--linea-oro);}
  .linguette button.acceso{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .linguette button.live{border-color:rgba(229,27,32,.45);color:#9E1418;}
  .linguette button.live.acceso{background:var(--red);border-color:var(--red);color:#fff;}
  /* quando una clip finisce in un formato, la sua linguetta lo dice */
  @keyframes arrivata{0%,100%{box-shadow:0 0 0 0 rgba(166,124,46,0)}
    35%{box-shadow:0 0 0 5px rgba(166,124,46,.35)}}
  .linguette button.arrivata{animation:arrivata 1.1s ease-out 2;border-color:var(--gold-deep);color:var(--gold-deep);}
  .linguette .pallino{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);
    margin-right:7px;vertical-align:1px;animation:batte 1.4s ease-in-out infinite;}
  @keyframes batte{0%,100%{opacity:1}50%{opacity:.3}}

  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .scheda{background:var(--carta-2);border:1px solid var(--linea);border-radius:10px;overflow:hidden;
    cursor:pointer;box-shadow:var(--ombra);transition:border-color .12s, transform .12s;}
  .scheda:hover{border-color:var(--linea-oro);transform:translateY(-1px);}
  .scheda.scelta{border-color:var(--gold-deep);box-shadow:0 0 0 2px rgba(166,124,46,.28), var(--ombra);}
  .mini{position:relative;aspect-ratio:16/9;background:var(--scuro);overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .mini .telo{background:linear-gradient(135deg,#1b2a5e,#0d1430);height:100%;aspect-ratio:16/9;
    display:block;object-fit:cover;}
  .mini.v .telo{aspect-ratio:9/16;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini.q .telo{aspect-ratio:4/3;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini .durata{position:absolute;right:6px;bottom:6px;background:rgba(10,15,36,.85);border-radius:4px;
    color:var(--carta);padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;}
  .mini .formato{position:absolute;left:6px;top:6px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;letter-spacing:.1em;}
  .mini .fonte{position:absolute;left:6px;bottom:6px;font-size:10px;color:rgba(245,241,230,.9);
    background:rgba(10,15,36,.8);border-radius:4px;padding:2px 6px;}
  .scheda .testo{padding:9px 10px 11px;}
  .scheda .nome{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scheda .sotto{font-size:11px;color:var(--inchiostro-3);margin-top:3px;}
  /* i comandi della clip stanno sulla clip: per scaricarne tre di fila non
     si deve piu' sceglierle una per una e poi andarle a cercare a destra */
  .scheda .comandi{display:flex;gap:12px;padding:0 10px 10px;}
  .scheda .comandi a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
  .scheda .comandi a:hover{color:var(--inchiostro);}

  /* ── il visore ─────────────────────────────────────────────────── */
  /* IL RITAGLIO SI VEDE PRIMA DI TAGLIARE.
     Il telaio ha la forma del formato scelto e il video ci sta dentro con
     object-fit:cover — che e' esattamente quello che fa ffmpeg quando
     esporta (crop centrato). Quindi quello che vedi qui e' quello che esce:
     se in 9:16 l'azione finisce fuori, lo scopri adesso e non dopo. */
  .telaio{background:var(--scuro);border:1px solid var(--linea);border-radius:9px;
    overflow:hidden;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center;}
  .telaio video{width:100%;height:100%;object-fit:cover;display:block;background:var(--scuro);}
  .telaio .forma{position:absolute;left:9px;top:9px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 8px;font-family:'Mazzard',sans-serif;font-size:10px;
    font-weight:800;letter-spacing:.12em;pointer-events:none;}
  video{width:100%;background:var(--scuro);border-radius:9px;display:block;border:1px solid var(--linea);}
  video.v{aspect-ratio:9/16;max-height:52vh;margin:0 auto;}
  video.q{aspect-ratio:4/3;}
  .barra{margin-top:9px;}
  input[type=range]{width:100%;accent-color:var(--gold-deep);}
  .tempi{display:flex;justify-content:space-between;font-family:'Mazzard',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--inchiostro-3);margin-top:4px;}
  .trasporto{display:flex;gap:7px;margin-top:9px;flex-wrap:nowrap;}
  .trasporto button{flex:1 1 auto;}

  button.b{font-family:'Mazzard',sans-serif;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;color:var(--inchiostro);background:var(--bianco);border:1px solid var(--linea);
    border-radius:8px;padding:10px 13px;cursor:pointer;box-shadow:var(--ombra);}
  button.b:hover:not(:disabled){border-color:var(--gold-deep);}
  button.b:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  button.b.oro{background:var(--gold);border-color:var(--gold-deep);color:var(--scuro);}
  button.b.rosso{background:var(--red);border-color:#B3151A;color:#fff;}
  button.b.scuro{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .fila{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;}
  .gruppo{display:flex;gap:7px;}
  .gruppo.pari button{flex:1 1 0;}
  .et{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--inchiostro-3);display:block;margin-bottom:6px;}
  .colonnina{display:flex;flex-direction:column;}
  .colonnina.cresce{flex:1 1 160px;}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:14px;color:var(--inchiostro);
    background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;width:100%;}
  select:focus,input:focus{outline:none;border-color:var(--gold-deep);}

  /* La riga del taglio: forma, entrata, uscita, durata, precisione, esporta.
     Una riga sola, e se lo schermo e' stretto si stringe invece di andare
     a capo — a capo vorrebbe dire far scorrere la pagina. */
  .taglio{display:flex;gap:10px;align-items:stretch;margin-top:11px;flex-wrap:nowrap;}
  .taglio > *{display:flex;align-items:center;}
  .taglio .inout .box{display:flex;flex-direction:column;justify-content:center;}
  .taglio .gruppo{flex:0 0 auto;}
  .taglio button.b{padding:11px 12px;white-space:nowrap;}
  .taglio button.b i{font-style:normal;opacity:.55;margin-left:7px;font-size:9px;
    border:1px solid currentColor;border-radius:3px;padding:0 4px;}
  .taglio button.grosso{flex:1 1 auto;padding:14px 12px;font-size:12px;}
  .inout{display:flex;gap:9px;flex:0 1 auto;min-width:0;}
  .inout .box{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;
    padding:7px 11px;min-width:84px;text-align:center;}
  .inout .box.messo{border-color:var(--gold-deep);background:rgba(201,162,75,.10);}
  .numeroni{font-family:'Mazzard',sans-serif;font-weight:800;font-size:20px;line-height:1.15;}
  .numeroni small{display:block;font-size:9px;letter-spacing:.24em;color:var(--inchiostro-3);margin-bottom:3px;}

  /* ── la console: qui si opera, ed e' scura apposta ──────────────── */
  .console{background:var(--scuro);color:var(--carta);border-radius:10px;padding:15px;margin-bottom:14px;
    border-top:2px solid var(--gold);}
  .console .et{color:rgba(245,241,230,.5);}
  .console select,.console input[type=text]{background:rgba(245,241,230,.08);border-color:rgba(245,241,230,.18);
    color:var(--carta);}
  .console button.b{background:rgba(245,241,230,.10);border-color:rgba(245,241,230,.2);color:var(--carta);box-shadow:none;}
  .console button.b.oro{background:var(--gold);border-color:var(--gold);color:var(--scuro);}
  .console button.b.rosso{background:var(--red);border-color:var(--red);color:#fff;}
  .console button.b.acceso{background:var(--carta);color:var(--scuro);border-color:var(--carta);}
  .console .riga-stato{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:12px;
    border-top:1px solid rgba(245,241,230,.14);font-family:'Mazzard',sans-serif;font-size:13px;
    font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
  .console .dot{width:11px;height:11px;border-radius:50%;background:rgba(245,241,230,.35);flex:none;}
  .console .dot.rec{background:var(--red);box-shadow:0 0 10px rgba(229,27,32,.9);animation:batte 1.4s ease-in-out infinite;}
  .console .dot.ok{background:#4FCB8B;}
  .console .coda{margin-left:auto;font-size:11px;letter-spacing:.14em;color:rgba(245,241,230,.6);}
  .indirizzo{margin-top:11px;background:rgba(201,162,75,.16);border:1px solid rgba(201,162,75,.4);
    border-radius:8px;padding:10px 12px;font-size:12px;word-break:break-all;}
  .indirizzo code{color:var(--gold-bright);}

  .voce{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;
    display:flex;gap:9px;align-items:center;margin-bottom:7px;box-shadow:var(--ombra);}
  .voce .testo{flex:1;min-width:0;}
  .voce .minivoce{width:58px;height:33px;object-fit:cover;border-radius:5px;flex:none;background:var(--scuro);}
  .voce .nome{font-family:'Mazzard',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce .dett{font-size:11px;color:var(--inchiostro-3);}
  .voce a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
  .voce a:hover{color:var(--inchiostro);}
  .voce .azioni{display:flex;gap:9px;align-items:center;}
  a.togli{color:var(--inchiostro-3)!important;}
  a.togli:hover{color:var(--red)!important;}
  a.togli.sicuro{color:#fff!important;background:var(--red);border-radius:5px;padding:2px 8px;}
  a.togli.grande{display:inline-block;border:1px solid var(--linea);border-radius:8px;
    padding:10px 14px;background:var(--bianco);}
  a.togli.grande.sicuro{border-color:var(--red);}

  .dati{width:100%;font-size:13px;}
  .dati tr{border-bottom:1px solid var(--linea);}
  .dati td{padding:7px 0;vertical-align:top;}
  .dati td:first-child{color:var(--inchiostro-3);width:44%;font-size:12px;}
  .schede{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:14px 0;}
  .schede button{background:none;border:none;border-bottom:2px solid transparent;color:var(--inchiostro-3);
    cursor:pointer;padding:8px 11px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;}
  .schede button.acceso{color:var(--inchiostro);border-bottom-color:var(--gold-deep);}

  .risultati h3{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--inchiostro-3);margin:16px 0 9px;
    display:flex;gap:9px;align-items:center;}
  .risultati h3:first-child{margin-top:0;}
  .risultati h3 i{flex:1;height:1px;background:var(--linea);font-style:normal;}
  .risultati h3 b{color:var(--gold-deep);font-weight:700;}
  .letta{font-size:12px;color:var(--inchiostro-3);margin-bottom:14px;}
  .letta em{font-style:normal;color:var(--inchiostro);background:rgba(201,162,75,.18);
    border-radius:4px;padding:1px 7px;margin-right:5px;}
  .voce.cliccabile{cursor:pointer;}
  .voce.cliccabile:hover{border-color:var(--gold-deep);}
  .voce .quando2{color:var(--inchiostro-3);font-size:11px;white-space:nowrap;}

  .avviso{margin:0 0 12px;padding:11px 14px;border-radius:8px;font-size:13px;display:none;
    background:#FDECEC;border:1px solid rgba(229,27,32,.35);color:#8E1216;}
  .avviso.ok{background:#E9F6EF;border-color:rgba(46,158,104,.4);color:#1D6B45;}
  .avviso.vedi{display:block;}
  .vuoto{color:var(--inchiostro-3);font-size:13px;padding:10px 2px;}
  kbd{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;
    border:1px solid var(--linea);background:var(--bianco);border-radius:4px;padding:1px 6px;}
  .aiuto{color:var(--inchiostro-3);font-size:12px;margin-top:10px;}

  .stato{flex:0 0 var(--barra);height:var(--barra);z-index:60;
    display:flex;align-items:center;gap:22px;padding:0 clamp(14px,3vw,26px);
    background:var(--scuro);color:var(--carta);border-top:2px solid var(--gold);font-size:12px;overflow-x:auto;}
  .stato .voce2{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .stato .pallino{width:9px;height:9px;border-radius:50%;background:rgba(245,241,230,.35);flex:none;}
  .stato .pallino.rec{background:var(--red);box-shadow:0 0 9px rgba(229,27,32,.9);animation:batte 1.4s ease-in-out infinite;}
  .stato .pallino.ok{background:#4FCB8B;}
  .stato .e{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(245,241,230,.5);}
  .stato .val{font-family:'Mazzard',sans-serif;font-size:13px;font-weight:800;letter-spacing:.04em;}
  .stato .barretta{width:90px;height:5px;border-radius:3px;background:rgba(245,241,230,.16);overflow:hidden;}
  .stato .barretta i{display:block;height:100%;background:var(--gold);}
</style>
</head>
<body>

<div class="testata">
  <div class="marchio">MAM<small>Como TV</small></div>
  <div class="cerca">
    <span class="lente">⌕</span>
    <input type="text" id="q" placeholder="Genoa-Como del 4 settembre · gol di Diao · le clip 9:16 di settembre">
  </div>
  <a class="torna" href="../index.html">Como TV</a>
</div>

<div class="tre">
  <div class="col">
    <h2>Partite <span id="nPartite">—</span></h2>
    <div id="albero"></div>
  </div>

  <div class="col">
    <!-- Tre gruppi, non sette fratelli: dove sto, che cosa guardo, che forma
         ha. Prima erano in fila e si escludevano — non si poteva chiedere
         "le clip in 9:16", che e' la domanda del social. -->
    <div class="linguette" id="linguette">
      <button class="live acceso" data-v="live">Live</button>
      <span class="stacco"></span>
      <button data-v="tutto">Tutto</button>
      <button data-v="clip">Clip</button>
      <button data-v="hl">Highlights</button>
      <button data-v="integrale">Integrali</button>
      <span class="stacco"></span>
      <span class="forme" id="forme">
        <span class="et2">Forma</span>
        <button class="acceso" data-forma="">Tutte</button>
        <button data-forma="16:9">16:9</button>
        <button data-forma="4:3">4:3</button>
        <button data-forma="9:16">9:16</button>
      </span>
    </div>
    <div class="avviso" id="avviso"></div>
    <div id="centro"></div>
  </div>

  <div class="col" id="destra"></div>
</div>

<div class="stato">
  <div class="voce2"><span class="pallino" id="sPall"></span><span class="e">In registrazione</span>
    <span class="val" id="sRec">—</span></div>
  <div class="voce2"><span class="e">Disco</span><span class="val" id="sDisco">—</span>
    <span class="barretta"><i id="sBarra" style="width:10%"></i></span></div>
  <div class="voce2"><span class="e">In lavorazione</span><span class="val" id="sLav">—</span></div>
  <div class="voce2"><span class="pallino ok" id="sPonteP"></span><span class="e">Ponte</span>
    <span class="val" id="sPonte">—</span></div>
</div>

<script src="chiave.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
  "use strict";
  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var BASE = PONTE.replace(/\/(api|exec)$/, "");
  var GEN = "../10_Look%26Feel/Como%20TV%20OTT%20Design/generatore.html?solo=social";
  var TOKEN = (window.ChiaveComoTV ? ChiaveComoTV.valore() : "");
  var el = function (id) { return document.getElementById(id); };

  var VISTA = "live";          // dove sto: live, un tipo di materiale, o una ricerca
  var FORMA = "";              // e con che forma, che e' un'altra domanda
  var REG = null;              // la registrazione scelta
  var REGISTRAZIONI = [], CLIP = [], SEQ = null, DISCO = null, ASSET = 0;
  var hls = null, apertaId = "", seguiLive = true;
  var dentro = null, fuori = null, formato = "16:9", preciso = false;

  function orologio(s) {
    if (s === null || s === undefined || !isFinite(s)) return "—";
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), q = s%60;
    return (h ? h + ":" + ("0"+m).slice(-2) : m) + ":" + ("0"+q).slice(-2);
  }
  function peso(b) { return !b ? "" : (b > 1e9 ? (b/1e9).toFixed(1) + " GB" : Math.round(b/1e6) + " MB"); }
  function dice(t, buona) {
    var a = el("avviso"); a.textContent = t; a.className = "avviso vedi" + (buona ? " ok" : "");
    if (buona) setTimeout(function () { a.className = "avviso"; }, 4000);
  }
  function manda(c) {
    c.token = TOKEN;
    return fetch(PONTE, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(c) }).then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) throw new Error(d.errore || "il ponte ha detto no"); return d; });
  }

  // ── colonna 1: le partite ───────────────────────────────────────
  function albero() {
    var c = el("albero"); c.innerHTML = "";
    if (!REGISTRAZIONI.length) {
      c.innerHTML = '<div class="vuoto">Nessuna partita registrata.<br>Con <b>Live</b> se ne comincia una.</div>';
      el("nPartite").textContent = "0"; return;
    }
    var gruppi = {};
    REGISTRAZIONI.forEach(function (r) {
      var g = r.competizione || "Senza competizione";
      (gruppi[g] = gruppi[g] || []).push(r);
    });
    el("nPartite").textContent = REGISTRAZIONI.length;
    Object.keys(gruppi).forEach(function (g) {
      var ramo = document.createElement("div"); ramo.className = "ramo";
      var t = document.createElement("div"); t.className = "testa";
      t.innerHTML = "<span>" + g + "</span><span class='conta'>" + gruppi[g].length + "</span>";
      ramo.appendChild(t);
      gruppi[g].forEach(function (r) {
        var f = document.createElement("div");
        f.className = "foglia" + (REG && r.id === REG.id ? " scelta" : "");
        var quando = new Date(r.avviata);
        f.innerHTML = (r.stato === "registra" && !r.attesa ? "<span class='rec'></span>" : "") +
          "<span>" + r.titolo + "</span><span class='quando'>" +
          ("0"+quando.getDate()).slice(-2) + "/" + ("0"+(quando.getMonth()+1)).slice(-2) + "</span>";
        f.addEventListener("click", function () { REG = r; ASSET = 0; disegna(); });
        ramo.appendChild(f);
      });
      c.appendChild(ramo);
    });
  }

  // ── colonna 2, vista LIVE: il visore e il taglio ────────────────
  function centroLive() {
    var c = el("centro");
    c.innerHTML =
      '<div class="telaio" id="telaio"><video id="player" controls playsinline></video>' +
        '<span class="forma" id="forma">16:9</span></div>' +
      '<div class="barra"><input type="range" id="slider" min="0" max="100" value="0" step="0.1">' +
      '<div class="tempi"><span id="tPos">0:00</span><span id="tTot">0:00</span></div></div>' +
      '<div class="trasporto">' +
        '<button class="b" data-salta="-30">− 30″</button>' +
        '<button class="b" data-salta="-10">− 10″</button>' +
        '<button class="b" data-salta="-3">− 3″</button>' +
        '<button class="b" data-salta="3">+ 3″</button>' +
        '<button class="b" data-salta="10">+ 10″</button>' +
        '<button class="b oro" id="btnLive">Torna al live</button>' +
      '</div>' +
      // UNA RIGA SOLA: si sceglie la forma, si segnano entrata e uscita, si
      // manda. Niente altro in mezzo: durante una partita ogni riga in piu'
      // e' un posto dove perdere tempo.
      '<div class="taglio">' +
        '<div class="gruppo" id="formati">' +
          '<button class="b scuro" data-f="16:9">16:9</button>' +
          '<button class="b" data-f="4:3">4:3</button>' +
          '<button class="b" data-f="9:16">9:16</button></div>' +
        '<div class="inout">' +
          '<div class="box" id="boxIn"><div class="numeroni"><small>Entrata</small><span id="vIn">—</span></div></div>' +
          '<div class="box" id="boxOut"><div class="numeroni"><small>Uscita</small><span id="vOut">—</span></div></div>' +
          '<div class="box"><div class="numeroni"><small>Durata</small><span id="vDur">—</span></div></div>' +
        '</div>' +
        '<div class="gruppo">' +
          '<button class="b oro" id="btnIn">Entrata<i>I</i></button>' +
          '<button class="b oro" id="btnOut">Uscita<i>O</i></button></div>' +
        '<button class="b" id="btnPreciso" title="Ai secondi si copia e basta: un secondo. Al fotogramma si ricodifica: qualche secondo in piu\u2019, ma parte esatta.">Ai secondi</button>' +
        '<button class="b oro grosso" id="btnTaglia" disabled>Esporta<i>T</i></button>' +
      '</div>';

    telaioForma();
    el("player").addEventListener("timeupdate", function () {
      // Si usa l'elemento che ha generato l'evento, non uno cercato per id:
      // cambiando vista il visore sparisce dal documento ma continua a
      // battere ancora un istante, e la ricerca per id tornava "niente".
      var v = this;
      if (!el("tPos")) return;                     // la vista e' cambiata: non c'e' piu' dove scrivere
      var tot = REG ? (REG.durata || v.duration || 0) : (v.duration || 0);
      el("tPos").textContent = orologio(v.currentTime);
      el("tTot").textContent = orologio(tot);
      if (tot) { el("slider").max = tot; el("slider").value = v.currentTime; }
    });
    el("slider").addEventListener("input", function () { seguiLive = false; el("player").currentTime = parseFloat(this.value); });
    c.querySelectorAll("[data-salta]").forEach(function (b) {
      b.addEventListener("click", function () {
        seguiLive = false;
        el("player").currentTime = Math.max(0, el("player").currentTime + parseFloat(b.dataset.salta));
      });
    });
    el("btnLive").addEventListener("click", function () {
      seguiLive = true; var v = el("player");
      if (hls && hls.liveSyncPosition) v.currentTime = hls.liveSyncPosition; else if (v.duration) v.currentTime = v.duration;
      v.play().catch(function () {});
    });
    el("btnIn").addEventListener("click", segnaIn);
    el("btnOut").addEventListener("click", segnaOut);
    c.querySelectorAll("#formati button").forEach(function (b) {
      b.addEventListener("click", function () {
        formato = b.dataset.f;
        c.querySelectorAll("#formati button").forEach(function (x) { x.className = "b"; });
        b.className = "b scuro";
        telaioForma();                 // il visore prende subito quella forma
      });
    });
    el("btnPreciso").addEventListener("click", function () {
      preciso = !preciso;
      this.className = preciso ? "b scuro" : "b";
      this.textContent = preciso ? "Al fotogramma" : "Ai secondi";
    });
    el("btnTaglia").addEventListener("click", taglia);
    mostraInOut();
    if (REG) apri(REG);
  }

  // Il telaio prende la forma del formato scelto, e si tiene dentro
  // l'altezza che la colonna ha davvero: la pagina non deve mai scorrere.
  function telaioForma() {
    var t = el("telaio"), c = el("centro"); if (!t || !c) return;
    // Al primo giro la colonna puo' non avere ancora un'altezza: si aspetta
    // il disegno invece di calcolare su zero e lasciare un telaio invisibile.
    var col = c.parentElement;
    if (!col || !col.clientHeight || !c.clientWidth) { requestAnimationFrame(telaioForma); return; }
    // Si misura la COLONNA, non il contenuto: il contenuto e' alto quanto il
    // telaio, e chiedere a lui quanto spazio c'e' e' un cane che si morde la
    // coda — al primo giro rispondeva "niente" e il visore restava un
    // francobollo.
    var linguette = el("linguette");
    var sopra = (linguette ? linguette.offsetHeight + 14 : 0);
    var sotto = 186;                        // barra, trasporto e riga del taglio
    var r = { "16:9": 16/9, "4:3": 4/3, "9:16": 9/16 }[formato] || 16/9;
    var alto = Math.max(170, col.clientHeight - sopra - sotto - 24);
    var largo = c.clientWidth;
    var w = Math.min(largo, alto * r), h = w / r;
    t.style.width = Math.round(w) + "px";
    t.style.height = Math.round(h) + "px";
    if (el("forma")) el("forma").textContent = formato;
  }
  window.addEventListener("resize", function () { if (VISTA === "live") telaioForma(); });

  function mostraInOut() {
    if (!el("vIn")) return;
    el("vIn").textContent = orologio(dentro);
    el("vOut").textContent = orologio(fuori);
    el("boxIn").className = "box" + (dentro !== null ? " messo" : "");
    el("boxOut").className = "box" + (fuori !== null ? " messo" : "");
    var d = (dentro !== null && fuori !== null) ? fuori - dentro : null;
    el("vDur").textContent = d !== null && d > 0 ? d.toFixed(1) + "s" : "—";
    el("btnTaglia").disabled = !(REG && !REG.guarda && d !== null && d > 0.5);
  }
  function segnaIn() { if (!el("player")) return; dentro = el("player").currentTime; if (fuori !== null && fuori <= dentro) fuori = null; mostraInOut(); }
  function segnaOut() { if (!el("player")) return; fuori = el("player").currentTime; if (dentro !== null && dentro >= fuori) dentro = null; mostraInOut(); }
  function taglia() {
    if (!REG) return;
    var suo = formato;                      // dove andra' a finire
    el("btnTaglia").disabled = true;
    manda({ tipo:"clip-taglia", reg:REG.id, dentro:dentro, fuori:fuori, formato:suo, preciso:preciso })
      .then(function () {
        // La clip finisce nel menu del suo formato: invece di dirlo e basta,
        // la linguetta si accende un momento. Non ti porto li' io: durante
        // una partita si resta sul live, e la si va a prendere quando serve.
        dice("Clip in lavorazione: la trovi in Clip · " + suo + ".", true);
        var b = document.querySelector('#linguette [data-forma="' + suo + '"]');
        if (b) { b.classList.add("arrivata"); setTimeout(function () { b.classList.remove("arrivata"); }, 2400); }
        dentro = null; fuori = null; mostraInOut(); aggiorna();
      })
      .catch(function (e) { dice(e.message); mostraInOut(); });
  }

  function apri(r) {
    var v = el("player"); if (!v) return;
    if (apertaId === r.id && hls) return;          // gia' aperta: non ricominciare
    apertaId = r.id;
    if (hls) { hls.destroy(); hls = null; }
    if (r.materiale === "integrale") { v.src = BASE + "/clip/" + r.id + "/integrale.mp4"; v.play().catch(function(){}); return; }
    if (r.materiale === "scaduto") { v.removeAttribute("src"); v.load(); return; }
    var indirizzo = BASE + "/clip/" + r.id + "/live.m3u8";
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDuration: 8, backBufferLength: 3600 });
      hls.on(Hls.Events.ERROR, function (ev, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(function () { try { hls.startLoad(); } catch (e) {} }, 2000);
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(indirizzo); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = indirizzo; }
    v.play().catch(function () {});
  }

  // ── colonna 3, vista LIVE: la console ───────────────────────────
  function destraLive() {
    var d = el("destra");
    d.innerHTML =
      '<h2>Il flusso</h2>' +
      '<div class="console">' +
        '<div class="fila" style="gap:10px">' +
          '<div class="colonnina cresce"><span class="et">Partita</span><select id="evento"><option value="">— senza evento —</option></select></div>' +
          '<div class="colonnina cresce"><span class="et">Sorgente</span><select id="sorgente"><option value="">— scegli —</option></select></div>' +
        '</div>' +
        '<div class="colonnina" style="margin-top:10px"><span class="et">Indirizzo del flusso</span>' +
          '<input type="text" id="url" placeholder="https://…/index.m3u8 · srt://…:7000"></div>' +
        '<div class="gruppo pari" style="margin-top:12px">' +
          '<button class="b" id="btnGuarda">Guarda</button>' +
          '<button class="b" id="btnRicevi">Ricevi</button>' +
          '<button class="b oro" id="btnRec">Registra</button>' +
        '</div>' +
        '<div id="ascolto"></div>' +
        '<div class="riga-stato"><span class="dot" id="cDot"></span><span id="cTesto">Nessuna registrazione</span>' +
          '<span class="coda" id="cCoda"></span></div>' +
      '</div>' +
      '<h2>Segni <span id="nSegni">—</span></h2>' +
      '<div class="fila" style="margin-bottom:10px">' +
        '<div class="colonnina cresce"><input type="text" id="markerTesto" placeholder="es. gol Douvikas"></div>' +
        '<div class="gruppo"><button class="b" id="btnMarker">Segna qui</button>' +
        '<button class="b" data-kick="1">1º T</button><button class="b" data-kick="2">2º T</button></div>' +
      '</div>' +
      '<div id="marker"></div>' +
      '<h2 style="margin-top:18px">Ultime clip <span id="nClip">—</span></h2>' +
      '<div id="clipRecenti"></div>';

    // tendine
    fetch(PONTE + "?partite=1").then(function (r) { return r.json(); }).then(function (dd) {
      (dd.eventi || []).forEach(function (e) {
        var o = document.createElement("option");
        o.value = (e.ids && e.ids[0]) || ""; o.textContent = e.etichetta;
        o.dataset.titolo = (e.programma ? e.casa : e.casa + "-" + e.ospite);
        o.dataset.comp = e.competizione || "";
        if (el("evento")) el("evento").appendChild(o);
      });
    }).catch(function () {});
    manda({ tipo:"clip-sorgenti" }).then(function (dd) {
      (dd.sorgenti || []).forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.url; o.textContent = x.nome + " · " + x.campo + " · " + x.tipo.toUpperCase();
        if (el("sorgente")) el("sorgente").appendChild(o);
      });
    }).catch(function () {});
    el("sorgente").addEventListener("change", function () { el("url").value = this.value; });

    function avvia(extra) {
      var ev = el("evento").selectedOptions[0];
      var corpo = { tipo:"clip-avvia", evento: el("evento").value,
        titolo: (ev && ev.dataset.titolo) || (extra.guarda ? "anteprima" : "senza evento"),
        competizione: (ev && ev.dataset.comp) || "",
        url: el("url").value.trim(),
        sorgente: el("sorgente").value ? el("sorgente").selectedOptions[0].textContent : "a mano" };
      Object.keys(extra).forEach(function (k) { corpo[k] = extra[k]; });
      if (!corpo.url) { corpo.ricevi = true; corpo.sorgente = "in ascolto"; }
      return manda(corpo).then(function (dd) { REG = dd.reg; apertaId = ""; aggiorna(); return dd; });
    }
    el("btnRec").addEventListener("click", function () {
      if (REG && REG.stato === "registra" && !REG.guarda) {
        manda({ tipo:"clip-ferma", id:REG.id }).then(function () { aggiorna(); dice("Registrazione fermata.", true); })
          .catch(function (e) { dice(e.message); });
        return;
      }
      avvia({}).then(function () { dice("Registrazione avviata.", true); }).catch(function (e) { dice(e.message); });
    });
    el("btnRicevi").addEventListener("click", function () {
      avvia({ ricevi:true }).then(function (dd) {
        dice(dd.gia ? "C’è già un ascolto aperto: è questo." : "In ascolto: dai l’indirizzo a chi trasmette.", true);
      }).catch(function (e) { dice(e.message); });
    });
    el("btnGuarda").addEventListener("click", function () {
      if (REG && REG.guarda && REG.stato === "registra") {
        manda({ tipo:"clip-ferma", id:REG.id }).then(function () { REG = null; apertaId = ""; aggiorna(); })
          .catch(function (e) { dice(e.message); });
        return;
      }
      avvia({ guarda:true }).catch(function (e) { dice(e.message); });
    });
    el("btnMarker").addEventListener("click", function () {
      if (!REG) { dice("Prima serve una registrazione."); return; }
      manda({ tipo:"clip-marker", reg:REG.id, secondi: el("player") ? el("player").currentTime : 0,
              testo: el("markerTesto").value.trim() })
        .then(function () { el("markerTesto").value = ""; aggiorna(); }).catch(function (e) { dice(e.message); });
    });
    d.querySelectorAll("[data-kick]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!REG) { dice("Prima serve una registrazione."); return; }
        manda({ tipo:"clip-kickoff", reg:REG.id, tempo:b.dataset.kick,
                secondi: el("player") ? el("player").currentTime : 0 })
          .then(function () { dice("Fischio del " + b.dataset.kick + "º tempo segnato.", true); aggiorna(); })
          .catch(function (e) { dice(e.message); });
      });
    });
    disegnaConsole();
  }

  function disegnaConsole() {
    if (!el("cTesto")) return;
    var dot = el("cDot"), t = el("cTesto"), coda = el("cCoda");
    if (!REG) { dot.className = "dot"; t.textContent = "Nessuna registrazione"; coda.textContent = ""; }
    else {
      var vivo = REG.stato === "registra";
      dot.className = "dot" + (vivo && !REG.attesa && !REG.guarda ? " rec" : vivo ? " ok" : "");
      t.textContent = (vivo ? (REG.attesa ? "In ascolto · " : REG.guarda ? "Guarda · non registra · " : "Registra · ")
                            : REG.stato + " · ") + REG.titolo;
      coda.textContent = orologio(REG.durata) +
        (REG.kickoff && REG.kickoff["1"] !== undefined ? " · 1ºT " + orologio(REG.kickoff["1"]) : "");
      if (el("btnRec")) {
        el("btnRec").textContent = (vivo && !REG.guarda) ? "Ferma" : "Registra";
        el("btnRec").className = (vivo && !REG.guarda) ? "b rosso" : "b oro";
      }
      if (el("btnGuarda")) {
        el("btnGuarda").className = (REG.guarda && vivo) ? "b acceso" : "b";
        el("btnGuarda").textContent = (REG.guarda && vivo) ? "Chiudi" : "Guarda";
      }
    }
    var a = el("ascolto");
    if (a) {
      if (REG && REG.ascolto && REG.stato === "registra") {
        a.className = "indirizzo";
        a.innerHTML = "<div class='et' style='margin-bottom:5px'>Da dare a chi trasmette · porta " +
          REG.ascolto.porta + (REG.attesa ? " · nessuno trasmette" : " · flusso in arrivo") + "</div>" +
          "<code>" + REG.ascolto.indirizzo + "</code>";
      } else { a.className = ""; a.innerHTML = ""; }
    }
    // segni
    var m = el("marker");
    if (m) {
      var segni = (REG && REG.marker) || [];
      el("nSegni").textContent = segni.length;
      m.innerHTML = segni.length ? "" : '<div class="vuoto">Nessun segno.</div>';
      segni.forEach(function (x) {
        var v = document.createElement("div"); v.className = "voce";
        v.innerHTML = "<div class='testo'><div class='nome'>" + orologio(x.secondi) + " · " +
          (x.testo || x.tipo || "segno") + "</div></div>";
        var a2 = document.createElement("a"); a2.href = "#"; a2.textContent = "vai";
        a2.addEventListener("click", function (e) { e.preventDefault(); seguiLive = false;
          if (el("player")) el("player").currentTime = x.secondi; });
        v.appendChild(a2); m.appendChild(v);
      });
    }
    var cr = el("clipRecenti");
    if (cr) {
      var mie = CLIP.slice(0, 6);
      el("nClip").textContent = CLIP.length;
      cr.innerHTML = mie.length ? "" : '<div class="vuoto">Ancora nessuna clip.</div>';
      mie.forEach(function (x) { cr.appendChild(voceClip(x)); });
    }
  }

  // TOGLIERE UNA CLIP.
  //
  //  Due passi, non uno: "elimina" diventa "sicuro?" e solo il secondo click
  //  cancella. Un file video non torna indietro, e in una griglia di
  //  francobolli tutti uguali il dito sbaglia bersaglio facilmente.
  //
  //  Serve la chiave di REGIA, non quella di lavoro: tagliare e guardare li
  //  puo' fare chiunque, buttare no. Se non ce l'hai in tasca te la chiede
  //  al momento, invece di dirti solo che non si puo'.
  function elimina(id, quando) {
    manda({ tipo: "clip-elimina", clip: id })
      .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
      .catch(function (e) {
        if (!/chiave/i.test(e.message)) { dice(e.message); return; }
        var k = window.ChiaveComoTV ? ChiaveComoTV.valore("comando",
          "Per eliminare una clip serve la chiave di COMANDO della regia.\n\n" +
          "Tagliare e guardare li puo' fare chiunque; buttare no.") : "";
        if (!k) { dice("Serve la chiave di comando della regia."); return; }
        TOKEN = k;
        manda({ tipo: "clip-elimina", clip: id })
          .then(function () { dice("Clip eliminata.", true); if (quando) quando(); aggiorna(); })
          .catch(function (e2) { dice(e2.message); });
      });
  }
  // il tasto che si trasforma in domanda invece di aprire una finestra
  function tastoElimina(id, dopo) {
    var a = document.createElement("a");
    a.href = "#"; a.textContent = "elimina"; a.className = "togli";
    var chiesto = false, torna = null;
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (!chiesto) {
        chiesto = true; a.textContent = "sicuro?"; a.classList.add("sicuro");
        torna = setTimeout(function () {
          chiesto = false; a.textContent = "elimina"; a.classList.remove("sicuro");
        }, 4000);
        return;
      }
      clearTimeout(torna);
      a.textContent = "…";
      elimina(id, dopo);
    });
    return a;
  }

  function voceClip(x) {
    var v = document.createElement("div"); v.className = "voce";
    v.innerHTML = (x.mini ? "<img class='minivoce' src='" + BASE + x.mini + "' alt=''>" : "") +
      "<div class='testo'><div class='nome'>" + x.titolo + "</div><div class='dett'>" +
      x.formato + " · " + (x.durataVera || x.durata) + "s" + (x.peso ? " · " + peso(x.peso) : "") +
      (x.stato === "lavora" ? " · in lavorazione" : "") + (x.stato === "errore" ? " · errore" : "") + "</div></div>";
    if (x.stato === "pronta") {
      var url = BASE + "/clip/_clip/" + x.id + ".mp4";
      var az = document.createElement("div"); az.className = "azioni";
      var g = document.createElement("a");
      g.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(x.titolo) +
               (x.evento ? "&evento=" + encodeURIComponent(x.evento) : "");
      g.target = "_blank"; g.rel = "noopener"; g.textContent = "grafica";
      var s2 = document.createElement("a"); s2.href = url + "?scarica=1"; s2.textContent = "scarica";
      az.appendChild(g); az.appendChild(s2); az.appendChild(tastoElimina(x.id));
      v.appendChild(az);
    }
    return v;
  }

  // ── viste d'archivio ────────────────────────────────────────────
  function tuttoIlMateriale() {
    var lista = [];
    CLIP.forEach(function (c) { lista.push({ t:"clip", o:c }); });
    if (REG && REG.integrale === "pronto") lista.push({ t:"integrale", o:REG });
    if (SEQ) lista.push({ t:"hl", o:SEQ });
    return lista;
  }
  // Il tipo e la forma si sommano: "clip" e "9:16" insieme vogliono dire le
  // clip verticali, non due elenchi separati.
  function assetVisibili() {
    return tuttoIlMateriale().filter(function (a) {
      if (VISTA !== "tutto" && a.t !== VISTA) return false;
      if (FORMA) {
        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
        if (f !== FORMA) return false;
      }
      return true;
    });
  }
  // quanti ce ne sono per ogni linguetta, con la forma scelta gia' applicata
  function conteggi() {
    var c = { tutto:0, clip:0, hl:0, integrale:0 };
    tuttoIlMateriale().forEach(function (a) {
      if (FORMA) {
        var f = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
        if (f !== FORMA) return;
      }
      c.tutto++; c[a.t]++;
    });
    return c;
  }
  function segnaConteggi() {
    var c = conteggi();
    document.querySelectorAll("#linguette [data-v]").forEach(function (b) {
      var k = b.dataset.v;
      if (k === "live") return;
      var n = c[k] || 0;
      b.innerHTML = b.dataset.nome + (n ? " <span class='conta2'>" + n + "</span>" : "");
    });
  }
  function centroArchivio() {
    var c = el("centro"), lista = assetVisibili();
    if (!lista.length) {
      if (VISTA === "hl" && REG) {
        c.innerHTML = '<div class="vuoto">Nessuna sequenza su questa partita.<br>' +
          'Si costruisce dalle clip già tagliate, dai segni e dagli eventi ESPN.</div>' +
          '<div class="fila" style="margin-top:12px">' +
            '<div class="colonnina"><span class="et">Maniglie (prima / dopo)</span><div class="gruppo">' +
              '<input type="number" id="hlPre" value="8" min="0" max="60" style="width:76px">' +
              '<input type="number" id="hlPost" value="6" min="0" max="60" style="width:76px"></div></div>' +
            '<div class="colonnina"><span class="et">&nbsp;</span>' +
              '<button class="b oro" id="btnGenera">Genera HL</button></div></div>';
        el("btnGenera").addEventListener("click", function () {
          this.disabled = true;
          manda({ tipo: "clip-hl-genera", reg: REG.id,
                  pre: parseFloat(el("hlPre").value) || 8,
                  post: parseFloat(el("hlPost").value) || 6 })
            .then(function (d) { SEQ = d.seq; ASSET = 0; centroArchivio();
              dice("Sequenza pronta: " + d.seq.pezzi.length + " pezzi.", true); })
            .catch(function (e) { dice(e.message); el("btnGenera").disabled = false; });
        });
      } else {
        c.innerHTML = '<div class="vuoto">Niente con questa linguetta, su questa partita.</div>';
      }
      destraArchivio(null); return;
    }
    var g = document.createElement("div"); g.className = "griglia"; c.innerHTML = ""; c.appendChild(g);
    lista.forEach(function (a, i) {
      var fmt = a.t === "clip" ? a.o.formato : (a.t === "hl" && a.o.export ? a.o.export.formato : "16:9");
      var dur = a.t === "clip" ? (a.o.durataVera || a.o.durata) + "s"
              : a.t === "integrale" ? orologio(a.o.durata)
              : orologio((a.o.pezzi || []).reduce(function (s2, x) { return s2 + (x.fuori - x.dentro); }, 0));
      var nome = a.t === "clip" ? a.o.titolo : a.t === "integrale" ? "Integrale" : a.o.titolo;
      var d = document.createElement("div");
      d.className = "scheda" + (i === ASSET ? " scelta" : "");

      // IL FOTOGRAMMA. Una griglia di rettangoli vuoti non e' un archivio:
      // si dovrebbe leggere ogni titolo per capire che cosa si ha davanti.
      var mini = a.o.mini ? BASE + a.o.mini : "";
      d.innerHTML = "<div class='mini" + (fmt === "9:16" ? " v" : fmt === "4:3" ? " q" : "") + "'>" +
        (mini ? "<img class='telo' src='" + mini + "' alt=''>" : "<span class='telo'></span>") +
        "<span class='formato'>" + fmt + "</span>" +
        "<span class='durata'>" + dur + "</span>" +
        "<span class='fonte'>" + (a.t === "hl" ? "sequenza" : a.t === "integrale" ? "registrazione" : (a.o.tipo || "clip")) + "</span></div>" +
        "<div class='testo'><div class='nome'>" + nome + "</div><div class='sotto'>" +
        (a.t === "hl" ? (a.o.pezzi || []).length + " pezzi" : a.t) + "</div></div>";
      d.addEventListener("click", function () { ASSET = i; disegna(); });

      // I COMANDI SULLA SCHEDA. Prima stavano solo nel dettaglio: per
      // scaricare tre clip di fila bisognava sceglierle una per una e poi
      // andare a destra ogni volta.
      if (a.t === "clip" && a.o.stato === "pronta") {
        var url = BASE + "/clip/_clip/" + a.o.id + ".mp4";
        var az = document.createElement("div"); az.className = "comandi";
        var gr = document.createElement("a");
        gr.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(a.o.titolo) +
                  (a.o.evento ? "&evento=" + encodeURIComponent(a.o.evento) : "");
        gr.target = "_blank"; gr.rel = "noopener"; gr.textContent = "grafica";
        var sc = document.createElement("a"); sc.href = url + "?scarica=1"; sc.textContent = "scarica";
        [gr, sc].forEach(function (x) { x.addEventListener("click", function (e) { e.stopPropagation(); }); });
        var el2 = tastoElimina(a.o.id, function () { ASSET = 0; });
        el2.addEventListener("click", function (e) { e.stopPropagation(); });
        az.appendChild(gr); az.appendChild(sc); az.appendChild(el2);
        d.appendChild(az);
      } else if (a.t !== "clip") {
        var url2 = a.t === "integrale" ? BASE + "/clip/" + a.o.id + "/integrale.mp4"
                 : (a.o.export && a.o.export.stato === "pronto" ? BASE + a.o.export.file : "");
        if (url2) {
          var az2 = document.createElement("div"); az2.className = "comandi";
          var s3 = document.createElement("a"); s3.href = url2 + "?scarica=1"; s3.textContent = "scarica";
          s3.addEventListener("click", function (e) { e.stopPropagation(); });
          az2.appendChild(s3); d.appendChild(az2);
        }
      }
      g.appendChild(d);
    });
    destraArchivio(lista[ASSET] || lista[0]);
  }

  function destraArchivio(a) {
    var d = el("destra");
    if (!a) { d.innerHTML = '<h2>Dettaglio</h2><div class="vuoto">Niente di scelto.</div>'; return; }
    var url = a.t === "clip" ? BASE + "/clip/_clip/" + a.o.id + ".mp4"
            : a.t === "integrale" ? BASE + "/clip/" + a.o.id + "/integrale.mp4" : "";
    d.innerHTML = '<h2>Dettaglio</h2>' +
      (url ? '<video controls playsinline class="' + (a.t === "clip" && a.o.formato === "9:16" ? "v" : "") + '" src="' + url + '"></video>' : '') +
      '<div id="corpo"></div>';
    var corpo = el("corpo");
    if (a.t === "hl") {
      var q = a.o;
      corpo.innerHTML = "<div class='vuoto'>" + q.pezzi.length + " pezzi · " +
        orologio(q.pezzi.reduce(function (x, y) { return x + (y.fuori - y.dentro); }, 0)) +
        (q.scarto ? " · orologio tarato di " + q.scarto + "s" : "") + "</div>";
      (q.avvisi || []).forEach(function (t) {
        var w = document.createElement("div"); w.className = "avviso vedi";
        w.style.marginTop = "8px"; w.textContent = t; corpo.appendChild(w);
      });

      // Il ritocco: si arriva vicini in automatico e si stringe guardando.
      // "Tara qui" e' il gesto che vale piu' di tutti: sposta TUTTI i pezzi
      // non toccati a mano della stessa quantita', perche' il ritardo del
      // flusso e' uno solo per tutta la partita.
      function ritocca(corpoRichiesta) {
        corpoRichiesta.tipo = "clip-hl-pezzo"; corpoRichiesta.seq = q.id;
        manda(corpoRichiesta).then(function (d) { SEQ = d.seq; centroArchivio(); })
          .catch(function (e) { dice(e.message); });
      }
      q.pezzi.forEach(function (x, n) {
        var v = document.createElement("div"); v.className = "voce";
        v.innerHTML = "<div class='testo'><div class='nome'>" + (n + 1) + ". " + x.titolo + "</div>" +
          "<div class='dett'>" + orologio(x.dentro) + " → " + orologio(x.fuori) + " · " +
          Math.round(x.fuori - x.dentro) + "s · " + x.fonte + (x.mano ? " · a mano" : "") + "</div></div>";
        var az = document.createElement("div"); az.className = "azioni";
        function tasto(testo, cosa, spiega) {
          var a2 = document.createElement("a"); a2.href = "#"; a2.textContent = testo;
          if (spiega) a2.title = spiega;
          a2.addEventListener("click", function (e) { e.preventDefault(); cosa(); });
          az.appendChild(a2);
        }
        tasto("vai", function () {
          // per guardarlo serve il visore: si passa alla vista live
          VISTA = "live"; ASSET = 0; accendiLinguette(); disegna();
          var giri = 0, attesa = setInterval(function () {
            var vv = el("player");
            if (++giri > 30) return clearInterval(attesa);
            if (!vv || !vv.duration) return;
            clearInterval(attesa); seguiLive = false;
            vv.currentTime = x.dentro; vv.play().catch(function () {});
          }, 300);
        });
        tasto("−1", function () { ritocca({ pezzo:x.id, dentro:x.dentro - 1 }); }, "entra un secondo prima");
        tasto("+1", function () { ritocca({ pezzo:x.id, dentro:x.dentro + 1 }); }, "entra un secondo dopo");
        tasto("+fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori + 1 }); });
        tasto("−fine", function () { ritocca({ pezzo:x.id, fuori:x.fuori - 1 }); });
        tasto("tara qui", function () {
          var vv = el("player");
          if (!vv || !vv.duration) { dice("Apri il live e porta il visore dove sta l’azione, poi tara."); return; }
          manda({ tipo:"clip-hl-taratura", seq:q.id, pezzo:x.id, secondi:vv.currentTime })
            .then(function (d) { SEQ = d.seq; centroArchivio();
              dice("Orologio tarato di " + d.seq.scarto + "s: si sono spostati tutti.", true); })
            .catch(function (e) { dice(e.message); });
        }, "l’azione è dove sta il visore adesso: sposta tutti gli altri della stessa quantità");
        tasto("togli", function () { ritocca({ pezzo:x.id, togli:1 }); });
        v.appendChild(az);
        corpo.appendChild(v);
      });

      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      az2.innerHTML = '<button class="b oro" id="hlMp4">Esporta MP4</button>' +
                      '<button class="b" id="hlXml">Per Premiere</button>';
      corpo.appendChild(az2);
      if (q.export && q.export.stato === "pronto") {
        var g1 = document.createElement("div"); g1.className = "aiuto";
        g1.innerHTML = '<a href="' + BASE + q.export.file + '?scarica=1">scarica il video (' +
                       q.export.formato + ", " + orologio(q.export.durata) + ")</a>";
        corpo.appendChild(g1);
      }
      if (q.export && q.export.stato === "lavora") {
        var g2 = document.createElement("div"); g2.className = "aiuto";
        g2.textContent = "esporto… " + q.export.fatti + "/" + q.export.quanti;
        corpo.appendChild(g2);
      }
      if (q.premiere) {
        var g3 = document.createElement("div"); g3.className = "aiuto";
        g3.innerHTML = '<a href="' + BASE + q.premiere.file + '?scarica=1">scarica l’XML per Premiere</a>';
        corpo.appendChild(g3);
      }
      el("hlMp4").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, formato:formato })
          .then(function () { dice("Esporto il video in " + formato + "…", true); })
          .catch(function (e) { dice(e.message); });
      });
      el("hlXml").addEventListener("click", function () {
        manda({ tipo:"clip-hl-esporta", seq:q.id, come:"premiere" })
          .then(function (d) { SEQ.premiere = d.premiere; centroArchivio();
            dice(d.premiere.integrale ? "XML pronto." :
                 "XML pronto, ma manca l’integrale: in Premiere andrà ricollegato.", true); })
          .catch(function (e) { dice(e.message); });
      });
      return;
    }

    var o = a.o;
    corpo.innerHTML = "<table class='dati'>" +
      "<tr><td>Nome</td><td>" + (o.titolo || "Integrale") + "</td></tr>" +
      (a.t === "clip" ? "<tr><td>Formato</td><td>" + o.formato + "</td></tr>" : "") +
      "<tr><td>Durata</td><td>" + (a.t === "clip" ? (o.durataVera || o.durata) + "s" : orologio(o.durata)) + "</td></tr>" +
      (o.peso || o.integralePeso ? "<tr><td>Peso</td><td>" + peso(o.peso || o.integralePeso) + "</td></tr>" : "") +
      (o.minuto ? "<tr><td>Minuto</td><td>" + o.minuto + "</td></tr>" : "") +
      (o.chi ? "<tr><td>Chi</td><td>" + o.chi + "</td></tr>" : "") +
      "</table>";
    if (a.t === "clip") {
      var az2 = document.createElement("div"); az2.className = "gruppo"; az2.style.marginTop = "12px";
      var g = document.createElement("a");
      g.href = GEN + "&clip=" + encodeURIComponent(url) + "&titolo=" + encodeURIComponent(o.titolo);
      g.target = "_blank"; g.rel = "noopener";
      g.innerHTML = '<button class="b oro">Grafica social</button>';
      var s2 = document.createElement("a"); s2.href = url + "?scarica=1";
      s2.innerHTML = '<button class="b">Scarica</button>';
      az2.appendChild(g); az2.appendChild(s2); corpo.appendChild(az2);
      var az3 = document.createElement("div"); az3.style.marginTop = "10px";
      var t = tastoElimina(o.id, function () { ASSET = 0; });
      t.className = "togli grande";
      az3.appendChild(t); corpo.appendChild(az3);
    }
  }

  // ── cercare ─────────────────────────────────────────────────────
  //
  //  La ricerca non e' una linguetta in piu': quando c'e' una domanda nella
  //  barra, la colonna centrale risponde a quella e basta. Si svuota la
  //  barra e si torna esattamente dov'eravamo.
  var RIS = null, vistaPrima = "live", attesaCerca = 0;

  function cerca(q) {
    manda({ tipo: "clip-cerca", q: q }).then(function (d) {
      RIS = d; disegnaRisultati();
    }).catch(function (e) { dice(e.message); });
  }

  function disegnaRisultati() {
    var c = el("centro"); c.innerHTML = "";
    var box = document.createElement("div"); box.className = "risultati"; c.appendChild(box);
    if (!RIS || RIS.vuota) { box.innerHTML = '<div class="vuoto">Scrivi che cosa cerchi.</div>'; return; }

    // far vedere COME e' stata capita la domanda: se sbaglia, si vede subito
    var q = RIS.domanda || {}, letta = [];
    (q.parole || []).forEach(function (p) { letta.push("<em>" + p + "</em>"); });
    if (q.formato) letta.push("<em>formato " + q.formato + "</em>");
    if (q.genere) letta.push("<em>" + q.genere + "</em>");
    if (q.quando) {
      var mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
                  "agosto","settembre","ottobre","novembre","dicembre"];
      letta.push("<em>" + (q.quando.giorno || "") + " " +
                 (q.quando.mese >= 0 ? mesi[q.quando.mese] : "") + " " + (q.quando.anno || "") + "</em>");
    }
    var l = document.createElement("div"); l.className = "letta";
    l.innerHTML = "Cerco: " + letta.join(" ") + " · " + RIS.quante + " risultati";
    box.appendChild(l);

    if (!RIS.quante) { box.innerHTML += '<div class="vuoto">Niente. Prova con meno parole.</div>'; return; }

    function titolo(t, n) {
      var h = document.createElement("h3");
      h.innerHTML = t + " <b>" + n + "</b> <i></i>";
      box.appendChild(h);
    }
    function riga(nome, dett, coda, quando) {
      var v = document.createElement("div"); v.className = "voce cliccabile";
      v.innerHTML = "<div class='testo'><div class='nome'>" + nome + "</div>" +
                    "<div class='dett'>" + dett + "</div></div>" +
                    (quando ? "<span class='quando2'>" + quando + "</span>" : "") +
                    (coda ? "<a href='#'>" + coda + "</a>" : "");
      box.appendChild(v); return v;
    }
    function data(ms) {
      if (!ms) return "";
      var d = new Date(ms);
      return ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2);
    }

    if (RIS.partite.length) {
      titolo("Partite", RIS.partite.length);
      RIS.partite.forEach(function (r) {
        riga(r.titolo, (r.competizione || "senza competizione") + " · " + orologio(r.durata) +
             " · " + (r.quanteClip || 0) + " clip", "apri", data(r.avviata))
          .addEventListener("click", function () { vaiA(r.id, null, "tutto"); });
      });
    }
    if (RIS.clip.length) {
      titolo("Clip e sequenze", RIS.clip.length);
      RIS.clip.forEach(function (c) {
        riga(c.titolo, (c.seq ? c.pezzi + " pezzi · sequenza" : c.formato + " · " +
             (c.durataVera || c.durata) + "s") + (c.partita ? " · " + c.partita : ""),
             "vedi", data(c.creata))
          .addEventListener("click", function () { vaiA(c.reg, null, c.seq ? "hl" : "clip"); });
      });
    }
    if (RIS.segni.length) {
      titolo("Segni nelle partite", RIS.segni.length);
      RIS.segni.forEach(function (m) {
        riga(m.testo || m.tipo || "segno",
             m.partita + " · " + orologio(m.secondi) + (m.fonte ? " · " + m.fonte : ""),
             "guarda", data(m.quando))
          .addEventListener("click", function () { vaiA(m.reg, m.secondi, "live"); });
      });
    }
  }

  // dal risultato al materiale: si sceglie la partita, si va alla vista
  // giusta e — se e' un segno — il player ci salta dentro.
  function vaiA(idReg, secondi, vista) {
    var r = REGISTRAZIONI.filter(function (x) { return x.id === idReg; })[0];
    if (r) REG = r;
    el("q").value = ""; RIS = null;
    VISTA = vista || "tutto";
    document.querySelectorAll("#linguette button").forEach(function (x) {
      x.className = (x.dataset.v === "live" ? "live" : "") + (x.dataset.v === VISTA ? " acceso" : "");
    });
    disegna();
    if (secondi !== null && secondi !== undefined) {
      var giri = 0;
      var attesa = setInterval(function () {
        var v = el("player");
        if (++giri > 30) return clearInterval(attesa);
        if (!v || !v.duration) return;
        clearInterval(attesa);
        seguiLive = false; v.currentTime = secondi; v.play().catch(function () {});
      }, 300);
    }
  }

  el("q").addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(attesaCerca);
    if (!q) { RIS = null; VISTA = vistaPrima; accendiLinguette(); disegna(); return; }
    if (VISTA !== "cerca") { vistaPrima = VISTA; VISTA = "cerca";
      document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
        x.className = (x.dataset.v === "live" ? "live" : "");
      });
      if (hls) { hls.destroy(); hls = null; apertaId = ""; }
      el("destra").innerHTML = '<h2>Dettaglio</h2><div class="vuoto">Scegli un risultato.</div>';
    }
    attesaCerca = setTimeout(function () { cerca(q); }, 280);
  });
  el("q").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { this.value = ""; this.dispatchEvent(new Event("input")); this.blur(); }
  });

  // ── il giro ─────────────────────────────────────────────────────
  function disegna() {
    firmaVecchia = "";                     // un gesto dell'utente ridisegna sempre
    if (VISTA === "cerca") { albero(); disegnaRisultati(); return; }
    albero();
    if (VISTA === "live") { centroLive(); destraLive(); disegnaConsole(); }
    else centroArchivio();
  }

  // la firma di quello che si vede: se non cambia, non si tocca
  var firmaVecchia = "";
  function cambiato() {
    var f = [VISTA, FORMA, ASSET, REG ? REG.id + REG.stato + REG.integrale : "-",
      CLIP.map(function (c) { return c.id + c.stato + (c.mini ? "1" : "0"); }).join(","),
      SEQ ? SEQ.id + SEQ.pezzi.length + (SEQ.export ? SEQ.export.stato : "") : "-"].join("|");
    if (f === firmaVecchia) return false;
    firmaVecchia = f; return true;
  }

  function aggiorna() {
    return manda({ tipo:"clip-stato" }).then(function (d) {
      REGISTRAZIONI = d.reg || [];
      DISCO = d.disco || null;
      if (REG) { var mio = REGISTRAZIONI.filter(function (r) { return r.id === REG.id; })[0]; if (mio) REG = mio; else REG = null; }
      if (!REG && REGISTRAZIONI.length) REG = REGISTRAZIONI[0];
      CLIP = (d.clip || []).filter(function (c) { return !REG || c.reg === REG.id; });
      barra();
      if (VISTA === "cerca") { albero(); return; }      // sta cercando: non si tocca niente
      if (VISTA === "live") { if (REG && el("player")) apri(REG); disegnaConsole(); }
      else if (cambiato()) centroArchivio();
      // Se non e' cambiato niente NON si ridisegna: rifare la griglia ogni
      // tre secondi buttava via le miniature prima che finissero di
      // caricarsi (e con loro la posizione dello scorrimento). Una lista che
      // si rigenera da sola sotto le mani e' peggio di una lista vecchia.
      albero();
      if (REG) {
        manda({ tipo:"clip-hl-elenco", reg:REG.id }).then(function (h) {
          SEQ = (h.seq || [])[0] || null;
          if (VISTA === "hl") centroArchivio();
        }).catch(function () {});
      }
    }).catch(function (e) { el("sPonte").textContent = "non risponde"; el("sPonteP").className = "pallino"; });
  }

  function barra() {
    var aperte = REGISTRAZIONI.filter(function (r) { return r.stato === "registra"; });
    var lav = CLIP.filter(function (c) { return c.stato === "lavora"; }).length;
    el("sRec").textContent = aperte.length ? aperte.length + " · " + orologio(aperte[0].durata || 0) : "nessuna";
    el("sPall").className = "pallino" + (aperte.some(function (r) { return !r.attesa && !r.guarda; }) ? " rec" : "");
    if (DISCO) {
      el("sDisco").textContent = DISCO.liberi + " GB · ~" + DISCO.partite + " partite";
      el("sBarra").style.width = Math.max(4, Math.min(100, 100 - DISCO.liberi / 79 * 100)) + "%";
    }
    el("sLav").textContent = lav ? lav + " in lavorazione" : "niente in coda";
    el("sPonte").textContent = "risponde"; el("sPonteP").className = "pallino ok";
    // la linguetta LIVE si accende da sola quando qualcosa sta girando
    var b = document.querySelector('#linguette [data-v="live"]');
    if (b) b.innerHTML = (aperte.length ? "<span class='pallino'></span>" : "") + "Live";
    segnaConteggi();
  }

  document.querySelectorAll("#linguette [data-v]").forEach(function (b) {
    b.dataset.nome = b.textContent;
    b.addEventListener("click", function () {
      VISTA = b.dataset.v; ASSET = 0;
      accendiLinguette();
      if (VISTA !== "live" && hls) { hls.destroy(); hls = null; apertaId = ""; }
      disegna();
    });
  });
  document.querySelectorAll("#linguette [data-forma]").forEach(function (b) {
    b.addEventListener("click", function () {
      FORMA = b.dataset.forma; ASSET = 0;
      // scegliere una forma mentre si e' sul live vuol dire voler vedere
      // quel materiale: si passa a "tutto" invece di non far succedere niente
      if (VISTA === "live" || VISTA === "cerca") VISTA = "tutto";
      accendiLinguette();
      disegna();
    });
  });
  function accendiLinguette() {
    document.querySelectorAll("#linguette [data-v]").forEach(function (x) {
      x.className = (x.dataset.v === "live" ? "live" : "") + (x.dataset.v === VISTA ? " acceso" : "");
    });
    document.querySelectorAll("#linguette [data-forma]").forEach(function (x) {
      x.className = (x.dataset.forma === FORMA ? "acceso" : "");
    });
  }

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (VISTA !== "live") return;
    var k = e.key.toLowerCase();
    if (k === "i") { segnaIn(); e.preventDefault(); }
    else if (k === "o") { segnaOut(); e.preventDefault(); }
    else if (k === "t") { if (el("btnTaglia") && !el("btnTaglia").disabled) taglia(); e.preventDefault(); }
    else if (k === " ") { var v = el("player"); if (v) { v.paused ? v.play().catch(function(){}) : v.pause(); } e.preventDefault(); }
  });

  disegna();
  aggiorna();
  setInterval(aggiorna, 3000);
})();
</script>
</body>
</html>
