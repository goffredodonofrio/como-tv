<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAM Como TV</title>
<meta name="theme-color" content="#0A0F24">
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  /* "hidden" deve vincere: un display: scritto da noi batte quello del
     browser, e una riga nascosta restava in mezzo alla console. */
  [hidden]{display:none!important;}

  /* ══════════════════════════════════════════════════════════════
     UNA PAGINA SOLA.
     Le tre colonne non si muovono mai: a sinistra le partite, al centro
     quello che si guarda, a destra quello che si fa. A cambiare e' solo
     il contenuto, scelto dalla riga di linguette — LIVE compreso.
     Prima erano due pagine e un interruttore in alto a destra: due posti
     dove cercare la stessa cosa, e infatti non si trovava.
     Colori: la variante "carta" del design system — avorio come fondo,
     navy come inchiostro, oro profondo per il testo in oro. Restano scure
     la riga di stato e i riquadri del video: strumentazione e immagine.
     ══════════════════════════════════════════════════════════════ */
  :root{
    color-scheme:light;
    --carta:#F5F1E6;--carta-2:#FFFDF7;--bianco:#FFFFFF;
    --inchiostro:#0A0F24;--inchiostro-2:#464E6E;--inchiostro-3:#6B7290;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;--ok:#2E9E68;
    --linea:rgba(10,15,36,.10);--linea-oro:rgba(166,124,46,.35);
    --scuro:#0A0F24;
    --ombra:0 1px 2px rgba(10,15,36,.06), 0 6px 18px rgba(10,15,36,.05);
    --barra:52px;
    /* Una scala sola per tutta la pagina: prima ogni blocco aveva i suoi
       numeri e si vedeva — margini diversi a un pixel di distanza fanno
       sembrare storto anche quello che e' dritto. */
    --s1:6px;--s2:10px;--s3:16px;--s4:24px;
    --alto:38px;                     /* l'altezza di TUTTO cio' che si preme */
  }
  /* La pagina non scorre: sta dentro uno schermo di portatile e basta.
     A scorrere sono le colonne, ognuna per conto suo — cosi' mentre cerchi
     nella griglia non perdi di vista il visore, e mentre guardi il visore
     non perdi la lista delle partite. */
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.45;
    color:var(--inchiostro);background-color:var(--carta);
    display:flex;flex-direction:column;
    background-image:
      radial-gradient(90% 70% at 18% 4%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(70% 70% at 95% 100%, rgba(201,162,75,.13), transparent 60%);
    background-attachment:fixed;}

  .testata{display:flex;align-items:center;gap:18px;flex:0 0 auto;
    padding:11px clamp(14px,3vw,26px);z-index:50;
    background:var(--scuro);color:var(--carta);border-bottom:2px solid var(--gold);}
  .marchio{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;white-space:nowrap;}
  .marchio small{display:inline-block;margin-left:10px;font-size:9px;letter-spacing:.26em;color:var(--gold-bright);font-weight:700;vertical-align:1px;}
  .cerca{flex:1 1 320px;display:flex;gap:8px;align-items:center;
    background:rgba(245,241,230,.10);border:1px solid rgba(245,241,230,.16);border-radius:10px;padding:9px 13px;}
  .cerca input{flex:1;background:none;border:none;color:var(--carta);font-family:inherit;font-size:14px;}
  .cerca input:focus{outline:none;}
  .cerca input::placeholder{color:rgba(245,241,230,.45);}
  .cerca .lente{color:rgba(245,241,230,.55);}
  .torna{color:rgba(245,241,230,.6);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
  .torna:hover{color:var(--gold-bright);}

  /* Sopra si guarda, sotto si monta: le colonne prendono quello che resta,
     la timeline si tiene la sua fascia e non la molla. */
  .lavoro{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);}
  .colCentro{display:flex;flex-direction:column;min-height:0;}
  .colCentro #centro{flex:0 0 auto;}
  /* LE FINESTRE SI RIDIMENSIONANO, come in Premiere: si prende il divisore e
     si trascina. Le misure stanno in tre variabili e si ricordano. */
  :root{--projW:272px;--split:50;--tlH:254px;--liveW:210px;}
  .tre{display:grid;grid-template-columns:var(--projW) 6px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;}
  /* MAM LIVE: tre colonne — i flussi che arrivano, i monitor, il progetto.
     L'ordine sullo schermo non e' quello del documento: si mette a posto qui. */
  body.modo-live .tre{grid-template-columns:var(--liveW) 6px minmax(0,1fr) 6px var(--projW);}
  /* le colonne vanno messe una per una, e tutte sulla PRIMA RIGA: senza
     dirlo, la griglia che incontra una colonna gia' passata apre una riga
     nuova e i pannelli finiscono uno sotto l'altro */
  body.modo-live .tre > *{grid-row:1;}
  body.modo-live #colLive{grid-column:1;} body.modo-live #sepLive{grid-column:2;}
  body.modo-live .colCentro{grid-column:3;} body.modo-live #sepProj{grid-column:4;} body.modo-live .proj{grid-column:5;}
  body.mam #colLive{background:#141414;border-right:1px solid #0F0F0F;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  body.mam .liveTesta{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid #0F0F0F;}
  body.mam .liveTesta .et{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A;font-weight:700;}
  body.mam .liveTesta .n{font-size:11px;color:#5AA7F2;font-weight:700;margin-left:auto;}
  body.mam .liveCorpo{flex:1;min-height:0;overflow:auto;}
  /* la colonna si chiama gia' "In onda": la prima intestazione dentro la
     lista direbbe due volte la stessa cosa */
  body.modo-live #liveCorpo #albero > .sez:first-child{display:none;}
  body.modo-live #colLive > .console{flex:0 0 auto;border-bottom:1px solid #0F0F0F;background:#171717;}
  .sepV{cursor:col-resize;background:transparent;position:relative;z-index:40;}
  .sepV::after{content:'';position:absolute;top:0;bottom:0;left:2px;width:2px;background:transparent;transition:background .15s;}
  .sepV:hover::after,.sepV.presa::after{background:#2D8CEB;}
  .sepH{position:absolute;left:0;right:0;top:-3px;height:7px;cursor:row-resize;z-index:60;}
  .sepH::after{content:'';position:absolute;left:0;right:0;top:2px;height:2px;background:transparent;transition:background .15s;}
  .sepH:hover::after,.sepH.presa::after{background:#2D8CEB;}
  body.ridimensiono{user-select:none;}
  body.ridimensiono *{pointer-events:none;}

  /* LA TIMELINE DI PREMIERE. Non "ispirata": uguale. Fondo scuro, timecode
     blu, righello in timecode con la barra gialla dell'area di lavoro,
     testine con lucchetto e occhio, clip blu con la barra del titolo e fx,
     audio con la forma d'onda, cursore blu con la testa quadrata e la
     linea che attraversa tutte le tracce. E' il posto dove chi monta ha
     gia' le mani: qui non si inventa, si riproduce. */
  .timeline{--tl-fondo:#1F1F1F;--tl-fondo2:#262626;--tl-riga:#0F0F0F;--tl-testo:#C9C9C9;--tl-blu:#2D8CEB;
    --tl-clip:#2C5F7F;--tl-clip2:#3C7EA6;--tl-clipsel:#4A93C4;--tl-giallo:#E6D34A;
    background:var(--tl-fondo);color:var(--tl-testo);display:flex;flex-direction:column;min-height:0;
    font-family:'Inter',system-ui,sans-serif;border-top:1px solid var(--tl-riga);}
  .tltab{display:flex;align-items:center;gap:10px;height:26px;padding:0 10px;font-size:11.5px;
    background:#232323;border-bottom:1px solid var(--tl-riga);}
  .tltab .x{color:#8A8A8A;font-size:13px;} .tltab .menu{color:#8A8A8A;}
  .tltab #tlNome{color:#E6E6E6;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tltab .esp{display:flex;gap:6px;align-items:center;margin-left:auto;}
  .tltab .esportati a{font-size:10px;color:var(--tl-blu);font-weight:700;margin-left:8px;text-decoration:none;}
  .tltab .esportati .lavora{font-size:10px;color:#8A8A8A;margin-left:8px;}
  .tltab button.b.piccolo{height:20px;padding:0 8px;font-size:9px;background:#333;border-color:#444;color:#DDD;box-shadow:none;}
  .tltab button.b.piccolo.oro{background:var(--tl-blu);border-color:var(--tl-blu);color:#fff;}
  .tlcorpo{flex:1 1 auto;display:flex;min-height:0;}
  .tlnomi{width:150px;flex:0 0 150px;border-right:1px solid var(--tl-riga);display:flex;flex-direction:column;}
  .tltc{height:22px;line-height:22px;padding:0 10px;color:var(--tl-blu);font-size:13px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .tlstrumenti{height:22px;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--tl-riga);}
  .tlstrumenti i{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:#9A9A9A;font-style:normal;}
  .tlstrumenti i.on{color:var(--tl-blu);}
  .tlstrumenti svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .tlstrumenti svg .p{fill:currentColor;stroke:none;}
  .tlstrumenti .lente{margin-left:auto;display:flex;gap:1px;}
  .tlstrumenti .lente b{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;
    color:#BBB;font-size:12px;cursor:pointer;border-radius:3px;} .tlstrumenti .lente b:hover{background:#3A3A3A;}
  .tltraccia{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-bottom:1px solid var(--tl-riga);font-size:11px;color:#BDBDBD;}
  .tltraccia.v{height:34px;} .tltraccia.v[data-t="V1"]{height:56px;}
  .tltraccia.a{height:34px;} .tltraccia.a[data-t="A1"]{height:46px;}
  .tltraccia .lock{width:9px;height:11px;border:1.5px solid #9A9A9A;border-radius:2px;position:relative;}
  .tltraccia .lock::before{content:'';position:absolute;left:1.5px;top:-6px;width:4px;height:5px;border:1.5px solid #9A9A9A;border-bottom:0;border-radius:3px 3px 0 0;}
  .tltraccia .tag{width:30px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;color:#BDBDBD;}
  .tltraccia .tag.on{background:var(--tl-blu);color:#fff;border-radius:2px;}
  .tltraccia .eye{width:12px;height:8px;border:1.5px solid #9A9A9A;border-radius:50%;position:relative;}
  .tltraccia .eye::after{content:'';position:absolute;left:3px;top:1px;width:3px;height:3px;border-radius:50%;background:#9A9A9A;}
  .tltraccia .ms{font-size:9.5px;color:#BDBDBD;width:12px;text-align:center;font-style:normal;}
  .tltraccia .mic{width:5px;height:9px;border:1.5px solid #9A9A9A;border-radius:3px;position:relative;}
  .tltraccia .mic::after{content:'';position:absolute;left:-2.5px;bottom:-4px;width:8px;height:4px;border:1.5px solid #9A9A9A;border-top:0;border-radius:0 0 5px 5px;}

  .tlpista{position:relative;flex:1 1 auto;overflow:hidden;cursor:default;user-select:none;background:var(--tl-fondo);}
  .tlrighello{position:relative;height:44px;border-bottom:1px solid var(--tl-riga);background:#232323;cursor:ew-resize;}
  .tlrighello .ora{position:absolute;top:5px;font-size:10.5px;color:#BDBDBD;transform:translateX(3px);
    font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap;}
  .tlrighello .tacca{position:absolute;bottom:14px;width:1px;height:6px;background:#6A6A6A;}
  .tlrighello .tacca.grande{height:11px;background:#8E8E8E;}
  .tlrighello .areaLavoro{position:absolute;bottom:8px;height:3px;background:var(--tl-giallo);left:0;}
  .tlrighello .testa{position:absolute;bottom:2px;width:10px;height:14px;background:var(--tl-blu);
    clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);transform:translateX(-5px);z-index:7;}
  .tlcorsia{position:relative;border-bottom:1px solid var(--tl-riga);}
  .tlcorsia.v{height:34px;} #tlV1{height:56px;} .tlcorsia.a{height:34px;} #tlA1{height:46px;}
  .tlcorsia.vuota{background:var(--tl-fondo2);}

  /* la clip video: corpo blu, barra del titolo piu' chiara con nome e fx, miniatura */
  .tlpista .clipV{position:absolute;top:1px;height:54px;background:var(--tl-clip);border:1px solid #1B3D52;
    border-radius:2px;overflow:hidden;cursor:grab;color:#F2F2F2;}
  .tlpista.lametta .clipV,.tlpista.lametta .clipA{cursor:crosshair;}
  .tlpista .clipV.sotto{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
  .tlpista .clipV .barra2{position:absolute;left:0;right:0;top:0;height:16px;background:var(--tl-clip2);
    display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:500;white-space:nowrap;}
  .tlpista .clipV .barra2 .tt{flex:1;overflow:hidden;text-overflow:ellipsis;}
  .tlpista .clipV .barra2 .fx{font-style:italic;color:#CFE6F5;font-size:9.5px;margin-left:6px;}
  .tlpista .clipV img{position:absolute;left:2px;top:18px;height:34px;width:auto;border-radius:1px;}
  .tlpista .clipV .dd{display:none;}
  .tlpista .clipV.sel{background:var(--tl-clipsel);}
  .tlpista .clipV.sel .barra2{background:#63A9D6;}
  .tlpista .clipV .bordo{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2;}
  .tlpista .clipV .bordo.sx{left:0;} .tlpista .clipV .bordo.dx{right:0;}
  .tlpista .clipV .bordo:hover{background:rgba(255,255,255,.18);}
  /* la clip audio: stesso blu, riga centrale e forma d'onda */
  .tlpista .clipA{position:absolute;top:1px;height:44px;background:var(--tl-clip);border:1px solid #1B3D52;border-radius:2px;overflow:hidden;}
  .tlpista .clipA::before{content:'';position:absolute;left:0;right:0;top:16px;bottom:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 3px),
               linear-gradient(180deg,transparent 0 35%,rgba(255,255,255,.22) 35% 65%,transparent 65%);}
  .tlpista .clipA::after{content:'fx';position:absolute;right:6px;top:1px;font-size:9.5px;font-style:italic;color:#CFE6F5;}
  .tlpista .clipA .onda{position:absolute;left:0;right:0;top:0;height:16px;background:var(--tl-clip2);}
  /* il cursore: linea blu su tutte le tracce, al fotogramma */
  .tltestina{position:absolute;top:44px;bottom:0;width:1px;background:var(--tl-blu);z-index:6;pointer-events:none;
    box-shadow:0 0 0 .5px rgba(45,140,235,.35);}
  .tlins{position:absolute;top:44px;bottom:0;width:2px;background:var(--tl-giallo);z-index:6;pointer-events:none;}
  .tlvuoto{position:absolute;left:0;right:0;top:44px;bottom:0;display:flex;align-items:center;justify-content:center;
    color:#7A7A7A;font-size:11px;pointer-events:none;}
  /* La timeline attraversa tutto lo schermo, come in Premiere: sta fissa in
     basso sopra la barra di stato, e le colonne le lasciano il posto. */
  .timeline{position:fixed;left:0;right:0;bottom:var(--barra);height:var(--tlH);z-index:55;}
  .lavoro{padding-bottom:var(--tlH);}

    justify-content:center;color:var(--fumo);font-size:11px;}
  .tltraccia-nome.a1{color:#2E8B57;height:36px;}
  .tlcima .esp{display:flex;gap:6px;align-items:center;margin-left:auto;}
  .tlcima .esportati a{font-size:10px;color:var(--gold-deep);font-weight:700;margin-left:8px;text-decoration:none;}
  .tlcima .esportati .lavora{font-size:10px;color:var(--fumo);margin-left:8px;}
  #sequenza{display:none!important;}

  /* Il marcatore: M apre il riquadro sopra il monitor, come il pannello
     marcatore di Premiere. Si scrive, invio, sparisce. */
  .segnaBox{position:absolute;left:0;right:0;top:34px;z-index:20;background:var(--carta);
    border:1px solid var(--gold-deep);border-radius:8px;padding:8px;display:flex;gap:6px;
    align-items:center;box-shadow:0 10px 30px rgba(10,15,36,.22);}
  .segnaBox input{flex:1 1 auto;min-width:0;}
  .segnaBox button.b{height:30px;padding:0 10px;font-size:10px;}
  .binSugg{margin-top:var(--s3);}
    justify-content:center;color:var(--fumo);font-size:11px;}

  .col{padding:14px clamp(10px,1.2vw,18px);overflow:auto;min-height:0;}
  .col + .col{border-left:1px solid var(--linea);}
  .col h2{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--inchiostro-3);margin:0 0 var(--s2);
    display:flex;justify-content:space-between;padding-bottom:var(--s1);
    border-bottom:1px solid var(--linea);}
  .col h2 + *{margin-top:0;}
  .col > * + h2{margin-top:var(--s4);}
  .col h2 span{color:var(--gold-deep);}

  /* "Nuovo" e' una cosa sola: da qualche parte deve arrivare del materiale.
     Carica un file e accendi un flusso sono due modi della stessa domanda,
     quindi stanno nella stessa scatola e non in due. */
  .carica{border:1px dashed var(--linea-oro);border-radius:9px;padding:var(--s2);
    text-align:center;margin-bottom:var(--s2);background:rgba(201,162,75,.06);}
  .carica.sopra{background:rgba(201,162,75,.18);border-color:var(--gold-deep);}
  .carica .aiuto{margin-top:6px;font-size:11px;}
  .avanza{height:5px;border-radius:3px;background:rgba(10,15,36,.12);margin-top:9px;overflow:hidden;}
  .avanza i{display:block;height:100%;width:0;background:var(--gold-deep);transition:width .2s;}

  /* i contenuti hanno una faccia: una lista di righe di testo non si guarda,
     si legge — e leggere venti titoli per trovare una partita e' il modo
     piu' lento di cercare */
  .foglia .facc{width:46px;height:26px;border-radius:4px;object-fit:cover;flex:none;background:var(--scuro);}
  .foglia .vuota{width:46px;height:26px;border-radius:4px;flex:none;
    background:linear-gradient(135deg,#1b2a5e,#0d1430);}
  .foglia .righe{min-width:0;flex:1;}
  .foglia .tit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;}
  .foglia .sotto2{font-size:10px;color:var(--inchiostro-3);}

  .ramo{margin-bottom:var(--s2);}
  .ramo>.testa{display:flex;align-items:center;gap:8px;padding:var(--s1) 8px 3px;
    font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--inchiostro-3);}
  .ramo .conta{margin-left:auto;color:var(--inchiostro-3);font-family:'DM Sans';font-size:11px;letter-spacing:0;text-transform:none;}
  .foglia{display:flex;gap:var(--s1);align-items:center;padding:var(--s1) 8px;border-radius:7px;
    cursor:pointer;font-size:13px;}
  .foglia:hover{background:rgba(10,15,36,.045);}
  .foglia.scelta{background:rgba(201,162,75,.16);box-shadow:inset 2px 0 0 var(--gold-deep);font-weight:700;}
  .foglia .quando{margin-left:auto;color:var(--inchiostro-3);font-size:10px;flex:none;}
  .foglia .rec{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
    box-shadow:0 0 8px rgba(229,27,32,.8);animation:batte 1.4s ease-in-out infinite;}

  /* ── le linguette: sono la navigazione, non un filtro ───────────── */
  .linguette{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3);}
  .fila-ling{display:flex;gap:var(--s1);align-items:center;}
  .linguette button{padding:0 11px;height:30px;}
  .linguette .forme button{height:26px;padding:0 9px;font-size:9px;}
  .linguette .stacco{width:1px;align-self:stretch;background:var(--linea);margin:2px 5px;}
  .linguette .forme{display:flex;gap:5px;align-items:center;}
  .linguette .forme button{padding:6px 11px;font-size:9px;}
  .linguette .et2{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--inchiostro-3);margin-right:2px;}
  .linguette .conta2{margin-left:6px;opacity:.55;font-size:9px;}
  .linguette button{background:var(--carta-2);border:1px solid var(--linea);border-radius:20px;
    color:var(--inchiostro-2);cursor:pointer;padding:7px 15px;
    font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .linguette button:hover{border-color:var(--linea-oro);}
  .linguette button.acceso{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .linguette button.live{border-color:rgba(229,27,32,.45);color:#9E1418;}
  .linguette button.live.acceso{background:var(--red);border-color:var(--red);color:#fff;}
  /* quando una clip finisce in un formato, la sua linguetta lo dice */
  @keyframes arrivata{0%,100%{box-shadow:0 0 0 0 rgba(166,124,46,0)}
    35%{box-shadow:0 0 0 5px rgba(166,124,46,.35)}}
  .linguette button.arrivata{animation:arrivata 1.1s ease-out 2;border-color:var(--gold-deep);color:var(--gold-deep);}
  .linguette .pallino{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);
    margin-right:7px;vertical-align:1px;animation:batte 1.4s ease-in-out infinite;}
  @keyframes batte{0%,100%{opacity:1}50%{opacity:.3}}

  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:var(--s2);}
  .scheda{background:var(--carta-2);border:1px solid var(--linea);border-radius:10px;overflow:hidden;
    cursor:pointer;box-shadow:var(--ombra);transition:border-color .12s, transform .12s;}
  .scheda:hover{border-color:var(--linea-oro);transform:translateY(-1px);}
  .scheda.scelta{border-color:var(--gold-deep);box-shadow:0 0 0 2px rgba(166,124,46,.28), var(--ombra);}
  .mini{position:relative;aspect-ratio:16/9;background:var(--scuro);overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .mini .telo{background:linear-gradient(135deg,#1b2a5e,#0d1430);height:100%;aspect-ratio:16/9;
    display:block;object-fit:cover;}
  .mini.v .telo{aspect-ratio:9/16;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini.q .telo{aspect-ratio:3/4;box-shadow:0 0 0 1px rgba(245,241,230,.08);}
  .mini .durata{position:absolute;right:6px;bottom:6px;background:rgba(10,15,36,.85);border-radius:4px;
    color:var(--carta);padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;}
  .mini .formato{position:absolute;left:6px;top:6px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 6px;font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;letter-spacing:.1em;}
  .mini .fonte{position:absolute;left:6px;bottom:6px;font-size:10px;color:rgba(245,241,230,.9);
    background:rgba(10,15,36,.8);border-radius:4px;padding:2px 6px;}
  .scheda .testo{padding:var(--s1) 9px;}
  .scheda .nome{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scheda .sotto{font-size:11px;color:var(--inchiostro-3);margin-top:3px;}
  /* i comandi della clip stanno sulla clip: per scaricarne tre di fila non
     si deve piu' sceglierle una per una e poi andarle a cercare a destra */
  .scheda .comandi{display:flex;gap:var(--s2);padding:0 9px var(--s1);flex-wrap:wrap;}
  .scheda .comandi a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .scheda .comandi a:hover{color:var(--inchiostro);}

  /* ── il visore ─────────────────────────────────────────────────── */
  /* IL RITAGLIO SI VEDE PRIMA DI TAGLIARE.
     Il telaio ha la forma del formato scelto e il video ci sta dentro con
     object-fit:cover — che e' esattamente quello che fa ffmpeg quando
     esporta (crop centrato). Quindi quello che vedi qui e' quello che esce:
     se in 9:16 l'azione finisce fuori, lo scopri adesso e non dopo. */
  .telaio{background:var(--scuro);border:1px solid var(--linea);border-radius:9px;
    overflow:hidden;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center;}
  .telaio video{width:100%;height:100%;object-fit:cover;display:block;background:var(--scuro);}
  .telaio .forma{position:absolute;left:9px;top:9px;background:rgba(201,162,75,.92);color:var(--scuro);
    border-radius:4px;padding:2px 8px;font-family:'Mazzard',sans-serif;font-size:10px;
    font-weight:800;letter-spacing:.12em;pointer-events:none;}
  /* Chi guarda una clip deve sapere che sta guardando QUELLA clip: al
     centro passa di tutto — il live, l'integrale, un montato — e senza un
     cartellino si perde il filo dopo il terzo giro. */
  .telaio .targa{position:absolute;left:9px;bottom:9px;right:9px;display:flex;gap:8px;
    align-items:center;background:rgba(10,15,36,.82);color:var(--carta);border-radius:6px;
    padding:5px 10px;pointer-events:none;backdrop-filter:blur(3px);}
  .telaio .targa b{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1;}
  .telaio .targa i{font-style:normal;font-size:10px;color:var(--gold);letter-spacing:.14em;
    font-weight:800;white-space:nowrap;}

  /* La pista: dove stanno entrata, uscita e i segni della partita. Non e'
     una timeline di montaggio — e' il minimo per vedere che cosa si sta
     per tagliare senza doverlo immaginare. */
  /* TUTTO IL MAM E' SCURO, COME PREMIERE — live e archivio. Gli stessi token del design,
     rimappati: la carta diventa il grigio dei pannelli, l'oro diventa il blu.
     Cosi' ogni componente cambia pelle senza cambiare una riga. */
  body.mam{color-scheme:dark;
    --carta:#1E1E1E;--carta-2:#2A2A2A;--bianco:#2B2B2B;
    --inchiostro:#E2E2E2;--inchiostro-2:#C0C0C0;--inchiostro-3:#A2A2A2;--fumo:#8A8A8A;
    --gold:#2D8CEB;--gold-bright:#5AA7F2;--gold-deep:#4CA3F0;
    --linea:rgba(255,255,255,.10);--linea-oro:rgba(45,140,235,.55);
    --scuro:#141414;--ombra:none;
    background:var(--carta);color:var(--inchiostro);}
  body.mam button.b.oro{color:#fff;}
  body.mam button.b.scuro{background:#2D8CEB;border-color:#2D8CEB;color:#fff;}
  body.mam input,body.mam select,body.mam textarea{
    background:#2B2B2B;color:#E2E2E2;border-color:#3A3A3A;}
  body.mam ::placeholder{color:#8A8A8A;}
  body.mam .console{background:#2A2A2A;color:#E2E2E2;}
  body.mam .console .riga-stato,body.mam .console .et,body.mam #ascolto{color:#C0C0C0;}
  body.mam .pallino.rec{box-shadow:0 0 9px rgba(229,27,32,.9);}
  body.mam .mini .telo{background:#0F0F0F;}
  body.mam .telaio{border-color:#333;}
  body.mam .col + .col{border-left-color:#0F0F0F;}
  body.mam .stato{border-top-color:#2D8CEB;}
  body.mam .voce,body.mam .scheda{background:#2A2A2A;}
  body.mam .scheda.scelta{outline:2px solid #2D8CEB;}
  body.mam .segnaBox{background:#2A2A2A;border-color:#2D8CEB;}
  body.mam .foglio>div,body.mam .tasti>div{background:#232323;}
  body.mam .risultati h3 b{color:#5AA7F2;}
  /* I CHIP dei risultati: la fonte (da dove viene la riga) e la precisione
     (quanto ci si puo' fidare del secondo). Colori fissi, sempre gli stessi:
     appunti grigio, ESPN blu, telecronaca azzurro, segni viola;
     al secondo verde, a stima ambra. La riga ha il bordo del colore della fonte. */
  body.mam .voce .dett{display:flex;flex-wrap:wrap;align-items:center;gap:5px;line-height:1.5;}
  body.mam .voce .chip{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:1px 5px;border-radius:2px;line-height:1.5;white-space:nowrap;flex:none;}
  body.mam .voce .chip.appunti{background:#3A3A3A;color:#D8D8D8;}
  body.mam .voce .chip.storico{background:#3A3A3A;color:#B8B8B8;border:1px dashed #5A5A5A;}
  body.mam .voce .chip.espn{background:#1F3A5A;color:#7CC0FF;}
  body.mam .voce .chip.voce{background:#24405A;color:#9AD0FF;}
  body.mam .voce .chip.segno{background:#3C2F5A;color:#C9A8FF;}
  body.mam .voce .chip.chi{background:#2A2A2A;color:#B8B8B8;border:1px solid #3A3A3A;text-transform:none;letter-spacing:.04em;}
  /* il voto della redazione al gol: piu' e' alto, piu' scalda */
  body.mam .voce .chip.vicino{background:#2F3A2A;color:#A8D08A;}
  /* IL TIPO DI AZIONE, in testa alla riga: un colore per ogni cosa che puo'
     succedere in campo. Si legge prima del testo, ed e' quello che si cerca
     con gli occhi quando si scorrono cento righe. */
  body.mam .voce .tipo{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px;margin-right:8px;vertical-align:2px;line-height:1.5;white-space:nowrap;}
  body.mam .voce .tipo.t-gol{background:#C9A24B;color:#141414;}
  body.mam .voce .tipo.t-rigore{background:#D9B45F;color:#141414;}
  body.mam .voce .tipo.t-autogol{background:#8A6A2E;color:#F0DCA8;}
  body.mam .voce .tipo.t-rigsb{background:#6B4A1A;color:#F0C060;}
  body.mam .voce .tipo.t-palo{background:#E0762F;color:#141414;}
  body.mam .voce .tipo.t-parata{background:#2D6FB8;color:#EAF3FF;}
  body.mam .voce .tipo.t-rosso{background:#B3261E;color:#fff;}
  body.mam .voce .tipo.t-giallo{background:#C9B02E;color:#141414;}
  body.mam .voce .tipo.t-var{background:#5A3E8A;color:#E2D6FF;}
  body.mam .voce .tipo.t-cambio{background:#3A3A3A;color:#C8C8C8;}
  body.mam .voce .tipo.t-skill{background:#7B4FA8;color:#F0E4FF;}
  body.mam .voce .tipo.t-occasione{background:#33506B;color:#BBD6F0;}
  body.mam .voce .tipo.t-altro{background:#3A3A3A;color:#C8C8C8;}
  body.mam .voce .stella{color:#F0C060;}
  /* la riga in due piani: sopra cosa e' successo, sotto dove e quando */
  body.mam .voce.azione .nome{text-transform:none;font-size:12.5px;letter-spacing:.01em;line-height:1.45;
    white-space:normal;overflow:visible;text-overflow:clip;}
  body.mam .voce.azione .dett{margin-top:5px;color:#9A9A9A;}
  body.mam .voce.azione .dett .dove{color:#D0D0D0;font-weight:700;}
  body.mam .voce.azione .dett .sep2{color:#5A5A5A;}
  body.mam .voce.azione .dett .tc{font-variant-numeric:tabular-nums;color:#B8B8B8;}
  body.mam .voce.azione{padding:10px 12px;align-items:flex-start;}
  body.mam .voce.azione .quando2{margin-top:2px;}
  /* LE FAMIGLIE DEI RISULTATI. Un colore per ciascuna, sempre lo stesso:
     nell'intestazione, nel conto, nel filetto a sinistra della riga. */
  body.mam .risultati h3.fam{color:#8A8A8A;margin:18px 0 8px;padding-top:14px;border-top:1px solid #262626;}
  body.mam .risultati h3.fam:first-child{border-top:0;padding-top:0;margin-top:2px;}
  body.mam .risultati h3.fam .bollo{width:8px;height:8px;border-radius:2px;background:#6A6A6A;flex:none;}
  body.mam .risultati h3.fam b{color:inherit;opacity:.85;}
  body.mam .risultati h3.fam-partite,body.mam .risultati h3.fam-archivio{color:#D9B45F;}
  body.mam .risultati h3.fam-partite .bollo,body.mam .risultati h3.fam-archivio .bollo{background:#C9A24B;}
  body.mam .risultati h3.fam-clip .bollo{background:#8A8A8A;}
  body.mam .risultati h3.fam-azioni{color:#9AB6D8;} body.mam .risultati h3.fam-azioni .bollo{background:#5AA7F2;}
  body.mam .risultati h3.fam-voce{color:#9AD0FF;} body.mam .risultati h3.fam-voce .bollo{background:#7CC0FF;}
  body.mam .risultati h3.fam-vicini{color:#A8D08A;} body.mam .risultati h3.fam-vicini .bollo{background:#7FBF5F;}
  body.mam .risultati h3.fam-segni{color:#C9A8FF;} body.mam .risultati h3.fam-segni .bollo{background:#A87FE0;}
  /* il filetto della riga: la famiglia si vede anche quando si scorre */
  body.mam .voce.fam-partite,body.mam .voce.fam-archivio{border-left:3px solid #C9A24B;}
  body.mam .voce.fam-clip{border-left:3px solid #6A6A6A;}
  body.mam .voce.fam-vicini{border-left:3px solid #7FBF5F;}
  body.mam .voce.fam-segni{border-left:3px solid #A87FE0;}
  body.mam .voce.fam-voce,body.mam .voce.detta{border-left:3px solid #7CC0FF;}
  body.mam .voce .chip.voto{background:#3A3A3A;color:#D8D8D8;}
  body.mam .voce .chip.voto.v3{background:#4A3A1F;color:#F0C060;}
  body.mam .voce .chip.voto.v4{background:#5A3A1A;color:#FFB84D;}
  body.mam .voce .chip.voto.v5{background:#6B2E1A;color:#FF9A5C;}
  body.mam .voce .chip.sec{background:#1F4D2E;color:#6FE0A0;}
  body.mam .voce .chip.stima{background:#4D3A1F;color:#F0C060;}
  body.mam .voce.fonte-espn{border-left:3px solid #2D8CEB;}
  body.mam .voce.fonte-appunti,body.mam .voce.fonte-storico{border-left:3px solid #6A6A6A;}
  body.mam .voce.a-stima .nome{color:#D8D8D8;}
  body.mam .voce a{color:#5AA7F2;font-weight:800;letter-spacing:.1em;font-size:10px;}
  /* una frase detta non e' un'azione scritta: corsivo, minuscole, virgolette, riga blu a sinistra */
  body.mam .voce.detta{border-left:3px solid #5AA7F2;}
  body.mam .voce.detta .nome{text-transform:none;font-style:italic;font-weight:500;letter-spacing:0;color:#E6E6E6;font-family:inherit;font-size:12.5px;}
  /* dove il design scrive "carta" su "scuro" (testa, barra di stato, targa,
     console) il rimappaggio farebbe scuro su scuro: qui il testo resta chiaro */
  body.mam .testa,body.mam .marchio,body.mam .marchio small,
  body.mam .stato,body.mam .stato .val,body.mam .stato .e,
  body.mam .telaio .targa,body.mam .console,body.mam .console .et,
  body.mam .torna{color:#E2E2E2;}
  body.mam .testa{background:#141414;border-bottom:1px solid #0F0F0F;}
  body.mam .stato{background:#141414;}
  body.modo-archivio .soloLive{display:none!important;}
  /* questi due la classe se la riscrivono da soli a ogni aggiornamento:
     si nascondono per nome, che nessuno gli tocca */
  body.modo-archivio #btnRec,
  body.modo-archivio #ascolto,
  body.modo-archivio .riga-stato{display:none!important;}
  /* ── RIFINITURA (7 settembre): aria sotto la riga blu, gerarchie chiare ──
     etichetta piccola, spaziata, blu; nome grande e bianco; le barre con
     un po' di respiro; i tasti laterali allineati al video, non al titolo. */
  body.mam .monitori{padding-top:10px;}
  body.mam .monitor .capo{margin:0 0 8px;padding:4px 0 7px;border-bottom:1px solid #2A2A2A;align-items:center;gap:10px;}
  body.mam .monitor .capo .rif{color:#5AA7F2;font-size:10px;letter-spacing:.22em;font-weight:700;margin:0;}
  body.mam .monitor .capo #capoNome,body.mam .monitor .capo #capoSeq{font-size:12px;letter-spacing:.05em;color:#E6E6E6;font-weight:700;}
  body.mam .monitor .capo a{font-size:10px;letter-spacing:.12em;color:#5AA7F2;}
  body.mam .monitor > .lato{padding-top:36px;gap:6px;}
  body.mam .lato button.b{border-radius:3px;letter-spacing:.08em;font-weight:700;}
  body.mam .mbarra{margin-top:8px;font-size:12.5px;letter-spacing:.05em;}
  body.mam .mbarra .fit{color:#8A8A8A;font-size:9px;letter-spacing:.16em;}
  body.mam .trasporto{margin-top:8px;}
  body.mam .projPath{padding:8px 12px;color:#D4D4D4;}
  body.mam .console .colonnina,body.mam .projCerca{padding:9px 12px;}
  body.mam .projTabs button.on{font-weight:600;}
  body.mam .tltc{padding:0 12px;}
  body.mam .stato{font-size:11.5px;}
  /* La pista sotto i monitor, come in Premiere: alta abbastanza da prenderla
     senza mirare, un righello leggero, la testina blu con la testa larga in
     alto. Si trascina da qualunque punto, anche sopra la linea. */
  body.mam .scrub{height:22px;margin-top:2px;border-radius:0;overflow:visible;cursor:ew-resize;
    background:#1B1B1B;border-top:1px solid #0F0F0F;
    background-image:repeating-linear-gradient(90deg,#3A3A3A 0 1px,transparent 1px 2%),repeating-linear-gradient(90deg,#4C4C4C 0 1px,transparent 1px 10%);
    background-size:100% 5px,100% 9px;background-repeat:no-repeat;background-position:0 100%,0 100%;}
  body.mam .scrub .capo{width:1px;background:#2D8CEB;top:0;bottom:0;margin-left:0;z-index:2;}
  body.mam .scrub .capo::before{content:'';position:absolute;top:0;left:-6px;width:13px;height:12px;background:#2D8CEB;
    border-radius:3px 3px 7px 7px;box-shadow:0 0 0 1px rgba(0,0,0,.35);}
  body.mam .scrub .segno{top:12px;bottom:0;width:2px;background:#8A8A8A;}
  body.mam .scrub .segno.gol{background:#E05A3B;}
  body.mam .scrub .presa{top:12px;bottom:0;background:rgba(45,140,235,.28);}
  body.mam .scrub .par{top:11px;bottom:0;width:5px;background:#2D8CEB;}
  body.mam .scrub .pez{top:12px;bottom:0;background:#3B5F8A;border-right:1px solid #1B1B1B;}
  body.mam .scrub .pez.ora{background:#5A88C2;}
  /* il bollo "16:9" sopra il video copriva il cronometro della regia: il
     formato lo dicono gia' i tasti a lato del monitor */
  .telaio .forma{display:none!important;}
  /* MAM ARCHIVIO: la scelta della partita e' UNA riga, sopra la ricerca:
     etichetta · filtro · tendina. Niente scheda, niente seconda casella
     che sembra una ricerca. Sotto, la riga "Cerca" per le azioni. */
  body.mam .console{background:none;border-radius:0;padding:0;box-shadow:none;border:0;margin:0;}
  body.mam .console .colonnina{flex-direction:row;align-items:center;gap:8px;margin:0;padding:8px 12px;border-bottom:1px solid #0F0F0F;}
  body.mam .console .colonnina .et,body.mam .projCerca .chip,body.mam .console .ricezione .et{flex:0 0 46px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9A9A9A;font-weight:700;margin:0;}
  body.mam .console #eventoCerca{flex:0 0 32%;min-width:0;height:26px;margin:0!important;font-size:12px;border-radius:3px;color:#E2E2E2;background:#1B1B1B;border:1px solid #3A3A3A;}
  body.mam .console #eventoCerca::placeholder{color:#7A7A7A;}
  body.mam .console #evento,body.mam .console #sorgente,body.mam .console #url{flex:1;min-width:0;height:26px;font-size:12px;border-radius:3px;margin:0;}
  body.mam .console #rigaUrl{padding-top:0;border-top:0;}
  body.mam .console #rigaUrl .et{visibility:hidden;}
  body.modo-archivio .console #ascolto{display:none;}
  /* MAM LIVE: il blocco della ricezione. Due modi, una riga ciascuno, e
     l'indirizzo da dare alla regia scritto grande, con lo stato accanto. */
  body.mam .console .ricezione{padding:9px 12px 10px;border-bottom:1px solid #0F0F0F;display:flex;flex-direction:column;gap:8px;}
  body.mam .console .ricezione .riga{display:flex;align-items:center;gap:6px;}
  body.mam .console .ricezione .b{height:26px;padding:0 11px;font-size:10.5px;letter-spacing:.08em;font-weight:700;border-radius:3px;text-transform:uppercase;}
  body.mam .console .ricezione .spiega{font-size:11px;line-height:1.4;color:#9A9A9A;padding-left:52px;}
  body.mam .console .ricezione .spiega b{color:#D0D0D0;font-weight:700;}
  body.mam .console .indirizzo{margin-left:52px;background:#1B1B1B;border:1px solid #3A3A3A;border-radius:3px;padding:7px 10px 8px;}
  body.mam .console .indirizzo .statoA{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#E0B13B;margin-bottom:5px;}
  body.mam .console .indirizzo.arrivo .statoA{color:#4FCB8B;}

     con i minuti, i marcatori sopra, la parte scelta in chiaro con due
     maniglie da trascinare, e la testina rossa. Non serve altro per
     decidere un taglio — il resto di Premiere e' per il montaggio lungo. */
  .pista{position:relative;height:38px;margin-top:3px;border-radius:5px;
    background:rgba(10,15,36,.06);cursor:text;overflow:hidden;user-select:none;
    border:1px solid var(--linea);}

  .pista .tacca.grande{top:2px;height:11px;background:rgba(10,15,36,.45);}
  .pista .ora{position:absolute;top:1px;font-size:8.5px;font-weight:700;letter-spacing:.06em;
    color:var(--fumo);transform:translateX(2px);font-variant-numeric:tabular-nums;}
  .pista .presa{position:absolute;top:13px;bottom:0;background:rgba(201,162,75,.30);}
  .pista .maniglia{position:absolute;top:13px;bottom:0;width:9px;background:var(--gold-deep);
    cursor:ew-resize;border-radius:2px;}
  .pista .maniglia::after{content:'';position:absolute;left:3.5px;top:35%;width:2px;height:30%;
    background:rgba(255,255,255,.85);}
  .pista .segno{position:absolute;top:15px;height:10px;width:3px;border-radius:2px;
    background:var(--inchiostro-3);cursor:pointer;}
  .pista .segno.gol{background:var(--red);}
  .pista .segno:hover{background:var(--gold-deep);}
  .pista .capo{position:absolute;top:0;bottom:0;width:1px;background:var(--red);pointer-events:none;}
  .pista .capo::before{content:'';position:absolute;top:0;left:-4px;border-left:4.5px solid transparent;
    border-right:4.5px solid transparent;border-top:6px solid var(--red);}

  .tlnav .corsa{position:absolute;top:3px;height:10px;background:#8C8C8C;border:1px solid #B0B0B0;box-sizing:border-box;border-radius:5px;cursor:grab;min-width:24px;}

  /* I DUE MONITOR. Sorgente a sinistra, Programma a destra, come in

  .monitori{display:grid;grid-template-columns:calc(var(--split) * 1%) 6px minmax(0,1fr);gap:0 11px;align-items:start;}
  /* "Sorgente grande": il Programma non e' un gemello, e' un controllo. Sta

  .exp .expT td:first-child{width:110px;color:var(--fumo);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding-top:11px;}
  .exp .expT input[type=text],.exp .expT select{width:100%;height:30px;}
  .exp .expF label{margin-right:14px;}
  .exp footer{display:flex;justify-content:flex-end;gap:8px;}
  .foglio .az.uscita img,.foglio .az.uscita .telo2{width:72px;height:40px;object-fit:cover;border-radius:3px;background:#0F0F0F;flex:none;}
  .foglio .az.uscita p{flex:1;} .foglio .az.uscita small{color:var(--fumo);}
  .foglio .az.uscita a{font-size:11px;font-weight:700;color:var(--gold-deep);text-decoration:none;margin-left:6px;}
  .stato #sLav{cursor:pointer;text-decoration:underline dotted;}
  #bin h2.sez{margin-top:var(--s3);} #bin h2.sez .apri{margin-left:6px;font-style:normal;color:var(--gold-deep);}
  /* Il bin di Premiere: la clip e' il suo fotogramma. Passandoci sopra con
     il cursore la si scorre (hover scrub); i comandi compaiono solo allora. */
  .mini video.anteprima{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;background:#000;}
  .mini.scorro video.anteprima{opacity:1;}
  .mini .cursorino{position:absolute;top:0;bottom:0;width:1px;background:#2D8CEB;display:none;pointer-events:none;}
  .mini.scorro .cursorino{display:block;}
  .mini img,.mini video{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
  .scheda .comandi{display:none;}
  .scheda:hover .comandi{display:flex;}
  #evento option.futura{background:#FDECEC;color:#8E1216;}
  #evento option.senzaVideo{color:#8A8A8A;}
  #evento option.passata{color:#8A8A8A;}
  #sorgente optgroup{font-style:normal;color:var(--gold-deep);}
  body.mam #sorgente optgroup{color:#8A8A8A;}
  /* MAM LIVE, la colonna Sorgenti: l'elenco delle registrazioni come la
     vista elenco di Premiere — righe basse, fotogramma, nome, da dove e
     quanto, data; la scelta ha la barra blu a sinistra */
  body.mam #albero .sez{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;}
  body.mam #albero .sez .et{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9A9A9A;font-weight:700;}
  body.mam #albero .sez b{color:#5AA7F2;font-size:11px;font-weight:700;}
  body.mam #albero .sez.altre a{color:#5AA7F2;text-decoration:none;cursor:pointer;}
  body.mam #albero .vuoto{padding:8px 12px 10px;font-size:11px;color:#8A8A8A;}
  body.mam .ramo{border-top:1px solid #0F0F0F;}
  body.mam .foglia{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 9px;border-bottom:1px solid #1B1B1B;cursor:pointer;border-left:3px solid transparent;background:none;border-radius:0;margin:0;}
  body.mam .foglia:hover{background:#2A2A2A;}
  body.mam .foglia.scelta{background:#22364F;border-left-color:#2D8CEB;}
  body.mam .foglia .facc,body.mam .foglia .vuota{width:56px;height:32px;border-radius:2px;object-fit:cover;background:#0F0F0F;flex:none;display:block;}
  body.mam .foglia .righe{flex:1;min-width:0;}
  body.mam .foglia .tit{font-size:12px;color:#E6E6E6;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  body.mam .foglia .sotto2{font-size:10.5px;color:#9A9A9A;margin-top:1px;}
  body.mam .foglia .quando{font-size:11px;color:#9A9A9A;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;}
  body.mam .foglia .rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E05A3B;animation:batte 1.4s ease-in-out infinite;margin-right:5px;vertical-align:1px;}
  #evento optgroup{font-style:normal;color:var(--gold-deep);}
  #bin .griglia{grid-template-columns:1fr 1fr;}
  @media (max-width:1240px){#bin .griglia{grid-template-columns:1fr;}}
  .arch{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:11.5px;}
  .arch:hover{background:rgba(201,162,75,.14);}
  .arch .q{color:var(--fumo);font-size:10px;font-variant-numeric:tabular-nums;flex:none;width:44px;}
  .arch .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .arch .k{color:var(--fumo);font-size:9px;letter-spacing:.1em;flex:none;}
  .archPiu{font-size:11px;color:var(--gold-deep);cursor:pointer;padding:6px;font-weight:700;}

  button.b{font-family:'Mazzard',sans-serif;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;color:var(--inchiostro);background:var(--bianco);border:1px solid var(--linea);
    border-radius:8px;padding:0 13px;height:var(--alto);cursor:pointer;box-shadow:var(--ombra);
    display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
  button.b:hover:not(:disabled){border-color:var(--gold-deep);}
  button.b:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  button.b.oro{background:var(--gold);border-color:var(--gold-deep);color:var(--scuro);}
  button.b.rosso{background:var(--red);border-color:#B3151A;color:#fff;}
  button.b.scuro{background:var(--scuro);border-color:var(--scuro);color:var(--carta);}
  .fila{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;}
  .gruppo{display:flex;gap:7px;}
  .gruppo.pari button{flex:1 1 0;}
  .et{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--inchiostro-3);display:block;margin-bottom:6px;}
  .colonnina{display:flex;flex-direction:column;}
  .colonnina.cresce{flex:1 1 160px;}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:13px;color:var(--inchiostro);
    background:var(--bianco);border:1px solid var(--linea);border-radius:8px;
    padding:0 11px;height:var(--alto);width:100%;}
  select:focus,input:focus{outline:none;border-color:var(--gold-deep);}

  /* La riga del taglio: forma, entrata, uscita, durata, precisione, esporta.
     Una riga sola, e se lo schermo e' stretto si stringe invece di andare
     a capo — a capo vorrebbe dire far scorrere la pagina. */
  /* l'intestazione della finestra di lavorazione: che cosa sto guardando */
  .capo{display:flex;align-items:baseline;gap:var(--s2);margin:0 0 var(--s2);
    padding-bottom:var(--s1);border-bottom:1px solid var(--linea);
    font-family:'Mazzard',sans-serif;font-size:13px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;}
  .capo a{margin-left:auto;color:var(--gold-deep);text-decoration:none;font-size:10px;
    font-weight:700;letter-spacing:.14em;}
  .capo a:hover{color:var(--inchiostro);}
  /* la riga per segnare, sotto il taglio */
  .segnafila{display:flex;gap:var(--s1);align-items:center;margin-top:var(--s1);}
  .segnafila button.b{height:30px;}

  /* la sequenza che si sta montando */
  .sequenza{margin-top:var(--s2);border:1px solid var(--linea);border-radius:9px;
    background:var(--carta-2);padding:var(--s2);box-shadow:var(--ombra);}
  .sequenza.pronta{border-color:var(--linea-oro);}
  .sequenza.sopra{border-color:var(--gold-deep);background:rgba(201,162,75,.12);}
  .sequenza .cima{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1);}
  .sequenza .cima .et{margin:0;}
  .sequenza .cima button.b{height:28px;font-size:9px;padding:0 9px;}
  .sequenza .pezzi{display:flex;gap:var(--s1);overflow-x:auto;min-height:52px;align-items:stretch;}
  .pezzo{flex:0 0 132px;border:1px solid var(--linea);border-radius:7px;background:var(--bianco);
    padding:5px 7px;cursor:grab;position:relative;display:flex;flex-direction:column;justify-content:center;}
  .pezzo:hover{border-color:var(--linea-oro);}
  .pezzo.trascino{opacity:.4;}
  .pezzo .n{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;color:var(--gold-deep);
    letter-spacing:.1em;}
  .pezzo .tt{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pezzo .dd{font-size:10px;color:var(--inchiostro-3);}
  .pezzo .via{position:absolute;top:2px;right:5px;color:var(--inchiostro-3);text-decoration:none;
    font-size:13px;line-height:1;}
  .pezzo .via:hover{color:var(--red);}
  .esportati{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s1);
    font-size:11px;}
  .esportati .et{margin:0;}
  .esportati a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .esportati a:hover{color:var(--inchiostro);}
  .esportati .lavora{color:var(--inchiostro-2);}
  .esportati .male{color:#8E1216;}
  .suggeriti{margin-top:var(--s2);padding-top:var(--s2);border-top:1px dashed var(--linea);}
  .suggeriti .et{margin-bottom:var(--s1);}
  .sugg{flex:0 0 176px;border:1px dashed var(--linea);border-radius:7px;background:var(--carta);
    padding:5px 7px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;}
  .sugg:hover{border-style:solid;border-color:var(--gold-deep);background:rgba(201,162,75,.10);}
  .sugg.fuori{opacity:.45;cursor:not-allowed;}
  .sugg .mm{font-family:'Mazzard',sans-serif;font-size:9px;font-weight:800;color:var(--gold-deep);
    letter-spacing:.1em;}
  .sugg .tt{font-size:11px;line-height:1.25;max-height:29px;overflow:hidden;}
  .sequenza .invito{color:var(--inchiostro-3);font-size:12px;display:flex;align-items:center;
    justify-content:center;width:100%;border:1px dashed var(--linea-oro);border-radius:7px;}
  /* mentre si trascina, la striscia si fa vedere anche se e' vuota */
  body.trascinando .sequenza[hidden]{display:block!important;}
  .scheda[draggable]{cursor:grab;}
  .segnafila input{flex:1 1 auto;}
  .scheda-sotto{margin-top:var(--s4);}
  .scheda-sotto .dati td:first-child{width:46%;font-size:11px;}
  .scheda-sotto .dati td{padding:5px 0;font-size:12px;}
  .scheda-sotto .voce{padding:7px 9px;margin-bottom:var(--s1);}
  .scheda-sotto .voce .nome{font-size:11px;}
  .scheda-sotto .voce .dett{font-size:10px;}
  .scheda-sotto .voce .azioni{gap:7px;flex-wrap:wrap;}
  .scheda-sotto .voce a{font-size:9px;letter-spacing:.1em;}

  .taglio{display:flex;gap:var(--s1);align-items:center;margin-top:var(--s2);flex-wrap:nowrap;}
  .taglio .gruppo{gap:var(--s1);}
  .taglio button.b{padding:0 12px;}
  .taglio .gruppo{flex:0 0 auto;}
  .taglio button.b{padding:0 12px;white-space:nowrap;height:32px;}
  .taglio button.b i{font-style:normal;opacity:.55;margin-left:7px;font-size:9px;
    border:1px solid currentColor;border-radius:3px;padding:0 4px;}
  .taglio button.grosso{flex:1 1 auto;padding:0 12px;font-size:11px;height:32px;}
  .inout{display:flex;gap:var(--s1);flex:0 0 auto;min-width:0;}
  .inout .box{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;
    height:var(--alto);min-width:80px;text-align:center;display:flex;flex-direction:column;
    align-items:center;justify-content:center;box-shadow:var(--ombra);}
  .inout .box.messo{border-color:var(--gold-deep);background:rgba(201,162,75,.10);}
  .numeroni{font-family:'Mazzard',sans-serif;font-weight:800;font-size:12px;line-height:1.05;}
  .numeroni small{display:block;font-size:8px;letter-spacing:.2em;color:var(--inchiostro-3);
    font-weight:700;margin-bottom:1px;}

  /* ── la console: qui si opera, ed e' scura apposta ──────────────── */
  .console{background:var(--scuro);color:var(--carta);border-radius:10px;
    padding:var(--s2) var(--s2) var(--s2);margin-bottom:var(--s3);border-top:2px solid var(--gold);}
  .console .et{color:rgba(245,241,230,.45);margin-bottom:4px;letter-spacing:.18em;}
  .console .colonnina{margin-bottom:var(--s2);}
  .console .colonnina:last-of-type{margin-bottom:0;}
  .console .et{color:rgba(245,241,230,.5);}
  .console select,.console input[type=text]{background:rgba(245,241,230,.08);border-color:rgba(245,241,230,.18);
    color:var(--carta);}
  .console button.b{background:rgba(245,241,230,.10);border-color:rgba(245,241,230,.2);color:var(--carta);box-shadow:none;}
  .console button.b.oro{background:var(--gold);border-color:var(--gold);color:var(--scuro);}
  .console button.b.rosso{background:var(--red);border-color:var(--red);color:#fff;}
  .console button.b.acceso{background:var(--carta);color:var(--scuro);border-color:var(--carta);}
  .console .riga-stato{display:flex;align-items:center;gap:var(--s1);margin-top:var(--s2);padding-top:var(--s2);
    border-top:1px solid rgba(245,241,230,.14);font-family:'Mazzard',sans-serif;font-size:11px;
    font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.25;}
  .console .riga-stato span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .console .dot{width:11px;height:11px;border-radius:50%;background:rgba(245,241,230,.35);flex:none;}
  .console .dot.rec{background:var(--red);box-shadow:0 0 10px rgba(229,27,32,.9);animation:batte 1.4s ease-in-out infinite;}
  .console .dot.ok{background:#4FCB8B;}
  .console .coda{margin-left:auto;font-size:10px;letter-spacing:.1em;color:rgba(245,241,230,.6);flex:none;}
  .indirizzo{margin-top:11px;background:rgba(201,162,75,.16);border:1px solid rgba(201,162,75,.4);
    border-radius:8px;padding:10px 12px;font-size:12px;word-break:break-all;}
  .indirizzo code{color:var(--gold-bright);}

  .voce{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:9px 11px;
    display:flex;gap:9px;align-items:center;margin-bottom:7px;box-shadow:var(--ombra);}
  .voce .testo{flex:1;min-width:0;}
  .voce .minivoce{width:58px;height:33px;object-fit:cover;border-radius:5px;flex:none;background:var(--scuro);}
  .voce .nome{font-family:'Mazzard',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce .dett{font-size:11px;color:var(--inchiostro-3);}
  .voce a{color:var(--gold-deep);text-decoration:none;font-family:'Mazzard',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
  .voce a:hover{color:var(--inchiostro);}
  .voce .azioni{display:flex;gap:9px;align-items:center;}
  a.togli{color:var(--inchiostro-3)!important;}
  a.togli:hover{color:var(--red)!important;}
  a.togli.sicuro{color:#fff!important;background:var(--red);border-radius:5px;padding:2px 8px;}
  a.togli.grande{display:inline-block;border:1px solid var(--linea);border-radius:8px;
    padding:10px 14px;background:var(--bianco);}
  a.togli.grande.sicuro{border-color:var(--red);}

  .dati{width:100%;font-size:13px;}
  .dati tr{border-bottom:1px solid var(--linea);}
  .dati td{padding:7px 0;vertical-align:top;}
  .dati td:first-child{color:var(--inchiostro-3);width:44%;font-size:12px;}
  .schede{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:14px 0;}
  .schede button{background:none;border:none;border-bottom:2px solid transparent;color:var(--inchiostro-3);
    cursor:pointer;padding:8px 11px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;}
  .schede button.acceso{color:var(--inchiostro);border-bottom-color:var(--gold-deep);}

  /* la partita come l'ha scritta il giornalista: quando il video non c'e',
     questo e' tutto quello che c'e' da vedere — e spesso basta */
  .foglio{position:fixed;inset:0;background:rgba(10,15,36,.42);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:var(--s4);}
  .foglio>div{background:var(--carta);border:1px solid var(--linea);border-radius:10px;
    width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;
    box-shadow:0 18px 50px rgba(10,15,36,.28);}
  .foglio header{padding:var(--s3) var(--s4);border-bottom:1px solid var(--linea);
    display:flex;align-items:baseline;gap:var(--s2);}
  .foglio header b{font-family:'Mazzard',sans-serif;font-size:15px;letter-spacing:.02em;}
  .foglio header span{color:var(--fumo);font-size:11px;flex:1;}
  .foglio header a{color:var(--gold-deep);font-size:11px;text-decoration:none;font-weight:700;}
  .foglio .righe{overflow-y:auto;padding:var(--s2) 0;}
  .foglio .az{display:flex;gap:var(--s3);padding:7px var(--s4);align-items:baseline;
    border-bottom:1px solid rgba(10,15,36,.05);}
  .foglio .az:last-child{border-bottom:0;}
  .foglio .az u{font-variant-numeric:tabular-nums;text-decoration:none;font-weight:700;
    font-size:12px;min-width:44px;color:var(--gold-deep);}
  .foglio .az i{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fumo);min-width:74px;}
  .foglio .az p{margin:0;font-size:12.5px;line-height:1.45;flex:1;}
  .foglio .az.hl{background:rgba(201,162,75,.10);}
  .foglio .az.apri{cursor:pointer;}
  .foglio .az.apri:hover{background:rgba(10,15,36,.05);}
  .foglio .az.apri u::after{content:' \\25B6';font-size:9px;color:var(--gold);}
  .foglio .tempo{padding:var(--s3) var(--s4) 4px;font-family:'Mazzard',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--fumo);}
  .foglio footer{padding:var(--s3) var(--s4);border-top:1px solid var(--linea);
    font-size:11px;color:var(--fumo);line-height:1.5;}
  .risultati h3{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--inchiostro-3);margin:16px 0 9px;
    display:flex;gap:9px;align-items:center;}
  .risultati h3:first-child{margin-top:0;}
  .risultati h3 i{flex:1;height:1px;background:var(--linea);font-style:normal;}
  .risultati h3 b{color:var(--gold-deep);font-weight:700;}
  .letta{font-size:12px;color:var(--inchiostro-3);margin-bottom:14px;}
  .letta em{font-style:normal;color:var(--inchiostro);background:rgba(201,162,75,.18);
    border-radius:4px;padding:1px 7px;margin-right:5px;}
  .voce.cliccabile{cursor:pointer;}
  .voce.cliccabile:hover{border-color:var(--gold-deep);}
  .voce .quando2{color:var(--inchiostro-3);font-size:11px;white-space:nowrap;}
  .voce .inTimeline{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2D8CEB;text-decoration:none;white-space:nowrap;margin-left:8px;}

  .avviso{position:fixed;right:18px;bottom:calc(var(--barra) + 12px);z-index:80;max-width:420px;
    padding:11px 14px;border-radius:8px;font-size:13px;display:none;box-shadow:0 8px 24px rgba(10,15,36,.18);
    background:#FDECEC;border:1px solid rgba(229,27,32,.35);color:#8E1216;}
  .avviso.ok{background:#E9F6EF;border-color:rgba(46,158,104,.4);color:#1D6B45;}
  .avviso.vedi{display:block;}
  .vuoto{color:var(--inchiostro-3);font-size:13px;padding:10px 2px;}
  kbd{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;
    border:1px solid var(--linea);background:var(--bianco);border-radius:4px;padding:1px 6px;}
  .aiuto{color:var(--inchiostro-3);font-size:12px;margin-top:10px;}

  .stato{flex:0 0 var(--barra);height:var(--barra);z-index:60;
    display:flex;align-items:center;gap:22px;padding:0 clamp(14px,3vw,26px);
    background:var(--scuro);color:var(--carta);border-top:2px solid var(--gold);font-size:12px;overflow-x:auto;}
  .stato .voce2{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .stato .pallino{width:9px;height:9px;border-radius:50%;background:rgba(245,241,230,.35);flex:none;}

<script src="chiave.js"></script>

<script>
(function () {
  "use strict";
  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var BASE = PONTE.replace(/\/(api|exec)$/, "");
  var GEN = "../10_Look%26Feel/Como%20TV%20OTT%20Design/generatore.html?solo=social";
  var TOKEN = (window.ChiaveComoTV ? ChiaveComoTV.valore() : "");
  var el = function (id) { return document.getElementById(id); };

  // Due porte sulla stessa macchina. Il MAM LIVE prende gli SRT e taglia
  // mentre la partita va; il MAM ARCHIVIO apre le mille partite gia'
  // giocate. Sotto e' lo stesso codice — cambia quello che si vede, perche'
  // chi entra per registrare non deve inciampare nell'archivio e chi entra
  // per cercare non deve avere sotto le mani il tasto Registra.
  var MODO = /modo=archivio/.test(location.search) ? "archivio" : "live";
  var MONITOR_IMPILATI = false;
  try { MONITOR_IMPILATI = JSON.parse(localStorage.getItem("mam.misure") || "{}").impilati === true; } catch (e) {}
  document.body.classList.add("modo-" + MODO, "mam");
  if (el("qualeMam")) el("qualeMam").textContent = (MODO === "archivio" ? "Archivio" : "Live");
  document.title = "MAM " + (MODO === "archivio" ? "ARCHIVIO" : "LIVE") + " — Como TV";

  var VISTA = "tutto";         // che materiale guardo a destra (o "cerca")
  var FORMA = "";              // e con che forma, che e' un'altra domanda
  var REG = null;              // la registrazione scelta
  var REGISTRAZIONI = [], CLIP = [], SEQ = null, SEQS = [], DISCO = null, ASSET = 0;
  var ESPORTAZIONI_APERTE = false, ORD = "tipo", TAB = "sorgenti";
  var AREA = "timeline";      // dove sta l'attenzione: progetto o timeline (per Canc)
  var hls = null, apertaId = "", seguiLive = true;
  var dentro = null, fuori = null, formato = "16:9", preciso = false;

  // Il timecode come lo legge un montatore: ore, minuti, secondi e
  // FOTOGRAMMI. "1:23" non dice niente a chi deve tagliare sul frame;
  // 00:01:23:12 si', ed e' la stessa lingua del pannello di Premiere.
  var FPS = 25;
  function tc(s) {
    if (s === null || s === undefined || !isFinite(s)) return "--:--:--:--";
    s = Math.max(0, s);
    var f = Math.round((s - Math.floor(s)) * FPS);
    var t = Math.floor(s); if (f >= FPS) { f = 0; t++; }
    var due = function (n) { return ("0" + n).slice(-2); };
    return due(Math.floor(t / 3600)) + ":" + due(Math.floor((t % 3600) / 60)) +
           ":" + due(t % 60) + ":" + due(f);
  }

  function orologio(s) {
    if (s === null || s === undefined || !isFinite(s)) return "—";
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), q = s%60;
    return (h ? h + ":" + ("0"+m).slice(-2) : m) + ":" + ("0"+q).slice(-2);
  }
  function peso(b) { return !b ? "" : (b > 1e9 ? (b/1e9).toFixed(1) + " GB" : Math.round(b/1e6) + " MB"); }
  function dice(t, buona) {
    var a = el("avviso"); if (!a) return;
    a.textContent = t; a.className = "avviso vedi" + (buona ? " ok" : "");
    if (buona) setTimeout(function () { a.className = "avviso"; }, 4000);
  }
  function manda(c) {
    c.token = TOKEN;
    return fetch(PONTE, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(c) }).then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) throw new Error(d.errore || "il ponte ha detto no"); return d; });
  }

  // ── colonna 1: le partite ───────────────────────────────────────
  // L'ARCHIVIO NEL PANNELLO PROGETTO. Prima le partite giocate stavano solo
  // nella tendina, e in un pannello Progetto non si cerca il materiale in
  // una tendina: sta in elenco, e la ricerca lo filtra.
  var ARCH_LISTA = [], ARCH_MOSTRA = 40;
  function alberoArchivio() {
    var c = el("albero"); if (!c || !ARCH_LISTA.length) return;
    var vecchio = el("alberoArch"); if (vecchio) vecchio.remove();
    var box = document.createElement("div"); box.id = "alberoArch";
    box.innerHTML = '<h2 style="margin-top:14px">Archivio <span>' + ARCH_LISTA.length + '</span></h2>';
    var aperte = {}; REGISTRAZIONI.forEach(function (r) { if (r.evento) aperte[r.evento] = 1; });
    ARCH_LISTA.slice(0, ARCH_MOSTRA).forEach(function (p) {
      var d = new Date(p.quando), q = isFinite(d) ? ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2) + "/" + String(d.getFullYear()).slice(-2) : "";
      var r = document.createElement("div"); r.className = "arch";
      r.innerHTML = '<span class="q"' + (p.dataSospetta ? ' title="data della cartella non credibile" style="color:#B3151A"' : '') + '>' + q +
                    '</span><span class="n" title="' + String(p.titolo).replace(/"/g, "") + (p.competizione ? " \u00b7 " + p.competizione : "") + '">' +
                    p.titolo + '</span><span class="k">' + (aperte[p.rec] ? "aperta" : (p.pezzi > 1 ? p.pezzi + " parti" : (p.soloS3 ? "S3" : ""))) + '</span>';
      r.addEventListener("click", function () { apriDaArchivio(p.rec, null, p.titolo, 0); });
      box.appendChild(r);
    });
    if (ARCH_LISTA.length > ARCH_MOSTRA) {
      var piu = document.createElement("div"); piu.className = "archPiu";
      piu.textContent = "mostra altre " + Math.min(200, ARCH_LISTA.length - ARCH_MOSTRA) + " \u2193";
      piu.addEventListener("click", function () { ARCH_MOSTRA += 200; alberoArchivio(); });
      box.appendChild(piu);
    }
    c.appendChild(box);
  }

  function albero() { alberoSolo(); }
  function alberoSolo() {
    var c = el("albero"); c.innerHTML = "";
    if (MODO !== "archivio") c.innerHTML = '<div class="sez"><span class="et">Registrazioni</span><b id="nPartite">\u2014</b></div>';
    // in archivio la partita si sceglie dalla tendina o dall'elenco
    // Archivio: rifare qui la lista delle registrazioni era un doppione
    if (MODO === "archivio") return;
    if (!REGISTRAZIONI.length) {
      // l'intestazione resta: senza, il contatore non c'e' e l'errore fermava
      // tutto il disegno della pagina (console e monitor compresi)
      c.innerHTML += '<div class="vuoto">Ancora niente.<br>Con <b>Live</b> si registra un flusso, oppure si carica un file qui sopra.</div>';
      if (el("nPartite")) el("nPartite").textContent = "0";
      return;
    }
    // Il LIVE e' il presente: in alto quello che sta succedendo ADESSO
    // (registra, in ascolto, anteprima), sotto le ultime 48 ore per il
    // lavoro del dopo-partita. Il resto e' passato: sta nell'Archivio, e qui
    // compare solo se lo si chiede.
    var ora = Date.now(), inCorso = [], recenti = [], vecchie = [];
    REGISTRAZIONI.slice().sort(function (x, y) { return (y.avviata || 0) - (x.avviata || 0); }).forEach(function (r) {
      if (r.stato === "registra" || r.stato === "carica") inCorso.push(r);
      else if ((r.finita || r.avviata || 0) > ora - 48 * 3600000) recenti.push(r);
      else vecchie.push(r);
    });
    if (el("nPartite")) el("nPartite").textContent = inCorso.length ? inCorso.length + " in corso" : recenti.length + " recenti";
    if (el("liveN")) el("liveN").textContent = inCorso.length ? inCorso.length + (inCorso.length === 1 ? " flusso" : " flussi") : "";
    c.querySelector(".sez .et").textContent = "In corso";
    var ramo = document.createElement("div"); ramo.className = "ramo";
    var disegnaVoce = function (r) {
      var f = document.createElement("div");
      f.className = "foglia" + (REG && r.id === REG.id ? " scelta" : "");
      f.dataset.nome = String(r.titolo || "").toLowerCase();
      var quando = new Date(r.avviata);
      var data = ("0"+quando.getDate()).slice(-2) + "/" + ("0"+(quando.getMonth()+1)).slice(-2) + "/" + String(quando.getFullYear()).slice(2);
      var da = r.origine === "file" ? "file" : r.arch ? "archivio" : (r.ascolto ? (r.attesa ? "in ascolto" : "SRT ricevuto") : "SRT");
      var vivo = r.stato === "registra";
      f.innerHTML =
        (r.mini ? "<img class='facc' src='" + BASE + r.mini + "' alt=''>" : "<span class='vuota'></span>") +
        "<div class='righe'>" +
          "<div class='tit'>" + (vivo && !r.attesa ? "<span class='rec'></span>" : "") + r.titolo + "</div>" +
          "<div class='sotto2'>" + (vivo ? (r.attesa ? "in attesa del flusso" : "REGISTRA") : da) + " \u00b7 " + orologio(r.durata) +
            (r.stato === "carica" ? " \u00b7 caricamento" : "") + "</div>" +
        "</div>" +
        "<span class='quando'>" + data + "</span>";
      f.addEventListener("click", function () { REG = r; ASSET = 0; disegna(); });
      ramo.appendChild(f);
    };
    c.querySelector(".sez .et").textContent = "In arrivo adesso";
    // una SCHEDA per flusso, grande, con il fotogramma e il REC che conta:

    if (!inCorso.length) { var v0 = document.createElement("div"); v0.className = "vuoto"; v0.innerHTML = "Nessun flusso in arrivo. Quando MCR spinge una partita, compare qui.<br>Per aprire una porta o andare a prendere un feed: <b>Ingressi</b>."; griglia.appendChild(v0); }
    inCorso.forEach(function (r) {
      var d = document.createElement("div");
      d.className = "scheda flusso" + (REG && r.id === REG.id ? " scelta" : "") + (r.attesa ? " attesa" : "");
      d.dataset.nome = String(r.titolo || "").toLowerCase();
      var vivo = r.stato === "registra" && !r.attesa && !r.guarda;
      var nome = r.attesa ? "Ingresso \u00b7 porta " + (r.ascolto ? r.ascolto.porta : "") : r.titolo;
      d.innerHTML = "<div class='mini'>" +
          (r.mini ? "<img class='telo' src='" + BASE + r.mini + "' alt='' draggable='false'>" : "<span class='telo'></span>") +
          (vivo ? "<span class='recBox'><i></i>REC " + orologio(r.durata) + "</span>" : r.attesa ? "<span class='recBox attesa'>IN ATTESA</span>" : r.guarda ? "<span class='recBox guarda'>ANTEPRIMA</span>" : "") +
        "</div>" +
        "<div class='testo'><div class='nome'>" + nome + "</div>" +
        "<div class='sotto'>" + (r.attesa ? (r.ascolto ? "<code>" + r.ascolto.indirizzo + "</code>" : "") : ((r.ascolto ? "spinto da MCR" : r.origine === "file" ? "file" : "preso dalla sorgente") + (r.competizione ? " \u00b7 " + r.competizione : ""))) + "</div></div>";
      d.addEventListener("click", function () { REG = r; ASSET = 0; disegna(); });
      griglia.appendChild(d);
    });
    ramo.appendChild(griglia);
    c.appendChild(ramo);
    if (el("ingressiRiassunto")) {
      var inAttesa = inCorso.filter(function (r) { return r.attesa; }).length, vivi = inCorso.filter(function (r) { return r.stato === "registra" && !r.attesa && !r.guarda; }).length;
      el("ingressiRiassunto").textContent = ((vivi ? vivi + " in registrazione" : "") + (vivi && inAttesa ? " \u00b7 " : "") +

  // ── CARICARE UN FILE ────────────────────────────────────────────
  //
  //  Il file viaggia a pezzi: un video da un giga in una richiesta sola non
  //  arriva, e se cade si ricomincia da capo. A pezzi si vede anche a che
  //  punto e', che su un caricamento lungo e' l'unica cosa che tiene calmo
  //  chi guarda.
  var PEZZO = 4 * 1024 * 1024;

  function leggiPezzo(file, da) {
    return new Promise(function (res, rej) {

            evento: (el("evento") ? el("evento").value.replace(/^arc:/, "") : ""),
            competizione: (ev && ev.dataset ? ev.dataset.comp : "") })

          return leggiPezzo(file, da).then(function (b64) {

    var sotto = 0;

  // ── TRASCINARE ──────────────────────────────────────────────────

  // altrimenti il materiale della partita, dall'entrata all'uscita
  function sorgentePezzo(x) {
    if (x.clip) {

      // il file della clip vale finche' il pezzo e' quello: se lo si e'
      // accorciato o allungato sulla timeline, si torna alla partita

    }
    var r = regDiSeq(); if (!r) return null;
    if (r.materiale === "archivio" && r.via) return { url: r.via, da: x.dentro, a: x.fuori };
    if (r.materiale === "integrale") return { url: BASE + "/clip/" + r.id + "/integrale.mp4", da: x.dentro, a: x.fuori };
    if (r.materiale === "segmenti") return { url: BASE + "/clip/" + r.id + "/live.m3u8", da: x.dentro, a: x.fuori, hls: true };
    return null;

    if (el("pTot")) el("pTot").textContent = tc(tot);

    var acc = 0, out = [], oraT = 0;
    pz.forEach(function (x, i) {
      var d = x.fuori - x.dentro;
      out.push('<span class="pez' + (i === PROG.i ? " ora" : "") + '" style="left:' + (acc / tot * 100) +
               '%;width:' + (d / tot * 100) + '%" title="' + String(x.titolo || "").replace(/"/g, "") + '"></span>');
      if (i === PROG.i) oraT = acc + Math.max(0, Math.min(d, PROG.pos - PROG.da));

  // in quale posizione cade quello che sto lasciando

  // ── LA TRACCIA ──────────────────────────────────────────────────
  //
  //  Un righello con i minuti, i segni della partita, la parte scelta con

  //  sta per tagliare, invece di doverlo immaginare guardando due numeri.
  var LENTE = 1;                 // 1 = tutta la partita, 8 = un ottavo

  function disegnaPista() {

    // il righello: un passo che dia una decina di tacche, non trecento

  // Trascinare una maniglia sposta entrata o uscita. E' il gesto che in

  // ── LA TIMELINE E' LA SEQUENZA ──────────────────────────────────
  //

  //  prende un bordo per accorciarlo o allungarlo, si clicca sul righello

  //  Canc toglie il pezzo scelto.
  var TL = { sel: null, ghost: null, ins: null, trim: null, drag: null, vista: null, nav: null, scrub: null, lock: { V1: false, A1: false } };
  var MOD = /Mac|iPhone|iPad/.test(navigator.platform || "") ? "\u2318" : "ctrl+";
  var STRUMENTO = "v";        // v = selezione, c = lametta

  function progPos() {
    var pz = pezziProg(); if (PROG.i < 0 || !pz[PROG.i]) return 0;
    var acc = 0;
    for (var i = 0; i < PROG.i; i++) acc += pz[i].fuori - pz[i].dentro;

  function finestraSeq() {

  function disegnaNav() {
    var nav = el("tlNav"), corsa = el("tlCorsa"), f = finestraSeq(); if (!nav || !corsa) return;
    if (!f) { corsa.style.left = "0"; corsa.style.width = "100%"; return; }
    var w = nav.clientWidth || 900;
    var intero = f.tot * 1.25 + 2;
    corsa.style.left = (f.a / intero * w) + "px";
    corsa.style.width = Math.max(24, (f.b - f.a) / intero * w) + "px";
  }
  function pulito(x) { return String(x || "").replace(/[<>&"]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]; }); }

  function disegnaTimeline() {
    var p = el("tlPista"), rig = el("tlRighello"), v1 = el("tlV1"), a1 = el("tlA1"); if (!p || !rig) return;
    var pz = pezziProg(), tot = durataSeq(), largo = p.clientWidth || 900;
    var nome = el("tlNome");
    if (nome) nome.textContent = SEQ ? (SEQ.titolo || "sequenza") : "nessuna sequenza";
    if (el("seqMp4")) el("seqMp4").textContent = "Solo " + formato;
    if (el("tlTc")) el("tlTc").textContent = tc(progPos());
    var vuoto = el("tlVuoto");
    if (!pz.length) {
      rig.innerHTML = ""; v1.innerHTML = ""; a1.innerHTML = "";

    SHUTTLE.dir = dir; SHUTTLE.rate = SHUTTLE.rate ? Math.min(8, SHUTTLE.rate * 2) : 1;
    clearInterval(SHUTTLE.timer); SHUTTLE.timer = null;
    if (dir > 0) { v.playbackRate = SHUTTLE.rate; v.play().catch(function () {}); }
    else {

    }

    v.playbackRate = 1; v.pause();

  // ridisegna; il server risponde dopo e, se dice di no, si torna a quello
  // che ha lui. Un taglio che si vede dopo un secondo sembra non aver preso.
  // L'ANNULLA. Prima di ogni modifica si fotografa la lista dei pezzi;
