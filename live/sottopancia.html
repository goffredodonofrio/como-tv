<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio (un vecchio segnalibro, un input vMix non aggiornato) comanderebbe
   un sistema che nessuno ascolta, e le grafiche non andrebbero in onda.
   Da GitHub si viene quindi portati sulla macchina giusta. Sulla VM questo
   non fa nulla. Se l'indirizzo della macchina cambia, va cambiato anche qui. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  // il percorso su GitHub (/como-tv/...) e' identico a quello sul dominio:
  // si cambia solo la casa
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>

<script>
(function () {
  "use strict";

  function scegliCanale() {
    var s = document.getElementById("canaleSel");
    // il vecchio menu salvava "3|studio": si tiene solo il numero
    var c = parseInt(((s && s.value) || "1").split("|")[0], 10);
    if (!(c >= 1 && c <= 7)) c = 1;
    try { localStorage.setItem("comotv.regia.canale", String(c)); } catch (e) {}
    return { c: c, dest: "" };
  }


  // Una sola destinazione per macchina: il playout di quel vMix porta tutto,
  // grafiche e partita insieme, quindi non c'e' piu' da scegliere fra
  // "Live Studio" e "Live Match".
  (function () {
    var s = document.getElementById("canaleSel");
    if (!s) return;
    for (var i = 1; i <= 7; i++) {
      var op = document.createElement("option");
      op.value = String(i); op.textContent = "vMix " + i;
      s.appendChild(op);
    }
    var c = 1;
    try {
      var v = parseInt(localStorage.getItem("comotv.regia.canale"), 10); if (v >= 1 && v <= 7) c = v;
    } catch (e) {}
    s.value = String(c);
    if (!s.value) s.value = "1";
    s.addEventListener("change", function () {
      try { localStorage.setItem("comotv.regia.canale", s.value); } catch (e) {}
    });
  })();



  var PONTE_URL = "comotv.ponte.url", PONTE_TOKEN = "comotv.ponte.token";
  var PONTE_DEFAULT = {
    url: "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec",
    token: "como_tv_grafiche"
  };
  // il menu' della destinazione: vMix + Progetti (adottato QUI, dopo la
  // definizione del ponte: prima crollerebbe sullo hoisting di var)
  if (window.Destinazione) Destinazione.adotta(document.getElementById("canaleSel"), PONTE_DEFAULT.url, PONTE_DEFAULT.token);
  var MEMO = "comotv.sottopancia.ultimo";

  var kk = document.getElementById("kk");
  var nn = document.getElementById("nn");
  var jj = document.getElementById("jj");
  var kk2 = document.getElementById("kk2");
  var nn2 = document.getElementById("nn2");
  var jj2 = document.getElementById("jj2");
  var fmt = document.getElementById("fmt");
  var prev = document.getElementById("prev");
  var elStatus = document.getElementById("status");

  function doppio() { return fmt.value === "2"; }
  function engine() { return doppio() ? "sottopancia2-vmix.html" : "sottopancia-vmix.html"; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function status(kind, html) {
    elStatus.className = "status" + (kind ? " " + kind : "");
    elStatus.innerHTML = html;
  }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function ponteConfig(forza) {
    var url = safeGet(PONTE_URL) || PONTE_DEFAULT.url;
    var tok = safeGet(PONTE_TOKEN) || PONTE_DEFAULT.token;
    if (forza) {
      url = window.prompt("Indirizzo del ponte Apps Script (finisce con /exec):", url);
      if (url === null) return null;
      safeSet(PONTE_URL, url.trim() || PONTE_DEFAULT.url);
      tok = window.prompt("Parola d'ordine del ponte:", tok);
      if (tok === null) return null;
      safeSet(PONTE_TOKEN, tok.trim() || PONTE_DEFAULT.token);
      return ponteConfig(false);
    }
    return { url: url, token: tok };
  }

  function b64url(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function dati() {
    var a = { k: kk.value.trim(), n: nn.value.trim(), j: jj.value.trim() };
    if (!doppio()) return a;
    return { a: a, b: { k: kk2.value.trim(), n: nn2.value.trim(), j: jj2.value.trim() } };
  }

  function nomiOk() {
    if (!nn.value.trim()) return false;
    if (doppio() && !nn2.value.trim()) return false;
    return true;
  }

  function fitPrev() {
    var w = document.getElementById("prevbox").clientWidth;
    prev.style.transform = "scale(" + (w / 1920) + ")";
  }
  window.addEventListener("resize", fitPrev);

  var t = null;
  function refreshStill() {
    clearTimeout(t);
    t = setTimeout(function () {
      prev.src = engine() + "?d=" + b64url(dati()) + "&still=1";
      fitPrev();
      safeSet(MEMO, JSON.stringify({ fmt: fmt.value, a: { k: kk.value, n: nn.value, j: jj.value },
                                     b: { k: kk2.value, n: nn2.value, j: jj2.value } }));
    }, 350);
  }
  [kk, nn, jj, kk2, nn2, jj2].forEach(function (i) { i.addEventListener("input", refreshStill); });

  function applicaFormato() {
    document.getElementById("lati").classList.toggle("doppio", doppio());
    document.getElementById("row2").style.display = doppio() ? "" : "none";
  }
  fmt.addEventListener("change", function () { applicaFormato(); refreshStill(); });

  document.getElementById("btnPrev").addEventListener("click", function () {
    if (!nomiOk()) { status("err", '<span class="msg"><b>Serve il nome' + (doppio() ? " di entrambi i lati" : "") + '.</b></span>'); return; }
    document.getElementById("prevwrap").style.display = "block";
    prev.src = engine() + "?d=" + b64url(dati()) + "&n=" + Date.now();
    fitPrev();
    document.getElementById("prevwrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  document.getElementById("btnPrevChiudi").addEventListener("click", function () {
    document.getElementById("prevwrap").style.display = "none";
  });

  document.getElementById("btnRegia").addEventListener("click", function () {
    if (!nomiOk()) { status("err", '<span class="msg"><b>Serve il nome' + (doppio() ? " di entrambi i lati" : "") + '.</b></span>'); return; }
    var d = dati();
    var cfg = ponteConfig(false);
    if (!cfg) return;
    var propostaTitolo = doppio()
      ? "SOTTOPANCIA 2X " + d.a.n.toUpperCase() + " / " + d.b.n.toUpperCase()
      : "SOTTOPANCIA " + d.n.toUpperCase();
    var titolo = window.prompt("Nome in scaletta di regia:", propostaTitolo);
    if (titolo === null) return;

    var __canale = scegliCanale();
    if (__canale === null) return;
    status("", '<span class="msg">Invio a ' + Destinazione.dove() + '&hellip;</span>');
    fetch(cfg.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: cfg.token },
        Destinazione.corpo({ grafica: doppio() ? "sottopancia2" : "sottopancia",
                             titolo: titolo.trim() || "SOTTOPANCIA", dati: d })))
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          status("ok", '<span class="msg"><b>' + esc(titolo) + '</b> aggiunta a ' + Destinazione.dove() + '. ' +
            '<a href="regia.html" target="_blank" style="color:var(--gold-bright)">Apri la console</a>.</span>');
        } else {
          status("err", '<span class="msg"><b>La regia ha rifiutato:</b> ' + esc(res.errore || "errore") + '</span>');
        }
      })
      .catch(function () { status("err", '<span class="msg"><b>Ponte non raggiungibile.</b></span>'); });
  });


  // riparto dagli ultimi valori usati su questa postazione
  try {
    var m = JSON.parse(safeGet(MEMO) || "{}");
    if (m.a) {   // memo nuovo (con formato e due lati)
      if (m.a.k) kk.value = m.a.k;
      if (m.a.n) nn.value = m.a.n;
      if (m.a.j) jj.value = m.a.j;
      if (m.b && m.b.k) kk2.value = m.b.k;
      if (m.b && m.b.n) nn2.value = m.b.n;
      if (m.b && m.b.j) jj2.value = m.b.j;
      if (m.fmt === "2") fmt.value = "2";
    } else {     // memo vecchio a tre campi
      if (m.k) kk.value = m.k;
      if (m.n) nn.value = m.n;
      if (m.j) jj.value = m.j;
    }
  } catch (e) {}
  applicaFormato();
  refreshStill();
  fitPrev();
})();
</script>
