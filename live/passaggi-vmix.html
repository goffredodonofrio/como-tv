<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa dei passaggi · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  #eyebrow{position:absolute;left:128px;top:74px;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:.24em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #title{position:absolute;left:125px;top:96px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:76px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #rule{position:absolute;left:128px;top:204px;width:300px;height:3px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.15) 100%);
    transform:scaleX(0);transform-origin:left center;}

  /* ── il campo, intero: i passaggi vanno da una parte all'altra ── */
  #campo{position:absolute;opacity:0;}
  #campo .erba{position:absolute;inset:0;border-radius:4px;
    background:rgba(245,241,230,.028);
    box-shadow:inset 0 0 0 2px rgba(245,241,230,.20);}
  #campo .l{position:absolute;background:rgba(245,241,230,.20);}
  #campo .box{position:absolute;box-shadow:inset 0 0 0 2px rgba(245,241,230,.20);}
  #campo .cerchio{position:absolute;border:2px solid rgba(245,241,230,.20);border-radius:50%;}
  #campo .rete{position:absolute;box-shadow:inset 0 0 0 2px rgba(201,162,75,.7);
    background:rgba(201,162,75,.10);}
  /* la freccia che dice da che parte si attacca: senza, "in avanti" non
     vuol dire niente */
  #verso{position:absolute;display:flex;align-items:center;gap:12px;opacity:0;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;letter-spacing:.24em;
    color:rgba(245,241,230,.42);text-transform:uppercase;white-space:nowrap;}
  #verso .asta{width:74px;height:2px;background:linear-gradient(90deg,rgba(201,162,75,.15),rgba(201,162,75,.85));
    position:relative;}
  #verso .asta::after{content:"";position:absolute;right:-1px;top:-4px;
    border:5px solid transparent;border-left-color:rgba(201,162,75,.85);}

  /* ── i giocatori ── */
  .nodo{position:absolute;transform:translate(-50%,-50%);opacity:0;}
  /* il tondo: grande quanto ha giocato il pallone */
  /* L'ALONE dice quanti palloni ha giocato, ed e' luce, non un oggetto:
     puo' sovrapporsi a quello del vicino senza che nessuno debba spostarsi.
     E' questo che permette di tenere le posizioni ESATTE e insieme far
     vedere la quantita' — un cerchio pieno grande avrebbe dovuto spingere
     via i vicini, un alone no, si somma e basta. Dove due giocatori hanno
     lavorato vicini la luce si addensa, ed e' un'informazione vera. */
  .nodo .alone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle,
      rgba(201,162,75,.52) 0%, rgba(201,162,75,.24) 40%,
      rgba(201,162,75,.07) 68%, rgba(201,162,75,0) 100%);}
  /* il punto: piccolo e pieno, e' la posizione vera */
  .nodo .bolla{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border-radius:50%;background:#F0DEB4;
    box-shadow:0 0 0 3px rgba(10,15,38,.75), 0 3px 12px rgba(7,11,29,.9);}
  /* Dentro il cerchio c'e' il COGNOME e basta. Il numero di maglia era li'
     quando il cerchio non diceva chi fosse; adesso che il nome c'e' e' un
     doppione, e toglierlo libera tutta la larghezza per il nome — che e'
     esattamente cio' che serviva per renderlo leggibile.
     Chi non ci sta dentro nemmeno alla misura minima lo porta fuori. */
  .nodo .quanti{display:none;}
  /* Il cognome non sta dentro il nodo ma per conto suo: al centro del campo
     i giocatori si accalcano, e i nomi finivano uno sull'altro. Cosi' il
     codice puo' cercargli un posto. Niente larghezza: si stringe addosso al
     testo, ed e' cosi' che lo misura. */
  /* Il nome sta SEMPRE sotto il suo cerchio, mai altrove: e' l'ingombro dei
     cerchi che si allarga per fargli posto, non il nome che si sposta a
     cercarselo. Cosi' non c'e' mai da chiedersi di chi sia. */
  /* Sotto il pallino: il nome, e sotto ancora la barra con quanti palloni ha
     giocato. Tre righe sole, sempre incolonnate sotto il loro pallino — non
     c'e' mai da chiedersi di chi siano. */
  .cogn{position:absolute;opacity:0;text-align:center;white-space:nowrap;}
  .cogn .nm{display:block;height:26px;line-height:26px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:20px;letter-spacing:.04em;
    text-transform:uppercase;color:#F5F1E6;
    text-shadow:0 2px 10px rgba(7,11,29,.95), 0 0 20px rgba(7,11,29,.85);}
  /* sotto il nome il conteggio esatto: l'alone dice a colpo d'occhio, il
     numero dice preciso */
  .cogn .q{display:block;margin-top:4px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:17px;
    color:#C9A24B;font-variant-numeric:tabular-nums;line-height:1;
    text-shadow:0 2px 8px rgba(7,11,29,.95);}
  /* la freccia del passaggio medio: dove e quanto lontano gioca il pallone */
  .nodo .dir{position:absolute;left:50%;top:50%;height:3px;transform-origin:left center;
    background:linear-gradient(90deg,rgba(110,231,212,.15),rgba(110,231,212,.9));border-radius:2px;}
  .nodo .dir::after{content:"";position:absolute;right:-2px;top:-4px;
    border:5.5px solid transparent;border-left-color:rgba(110,231,212,.9);}

  /* ── le colonne ── */
  .lato{position:absolute;width:300px;opacity:0;}
  .lato.dx{text-align:right;}
  .lato .capo{display:flex;align-items:center;gap:16px;}
  .lato.dx .capo{flex-direction:row-reverse;}
  .lato .capo img{width:72px;height:72px;object-fit:contain;flex:none;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));}
  .lato .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:34px;
    letter-spacing:.01em;text-transform:uppercase;line-height:1.02;min-width:0;}
  .lato .nome em{font-style:normal;color:#C9A24B;}
  .lato .filo{height:2px;margin:20px 0 4px;
    background:linear-gradient(90deg,rgba(201,162,75,.75),rgba(201,162,75,.06));}
  .lato.dx .filo{background:linear-gradient(270deg,rgba(201,162,75,.75),rgba(201,162,75,.06));}
  .lato .num{display:flex;align-items:baseline;justify-content:space-between;
    gap:14px;padding:7px 0;border-bottom:1px solid rgba(245,241,230,.07);}
  .lato.dx .num{flex-direction:row-reverse;}
  .lato .num .eti{font-family:'DM Sans',sans-serif;font-weight:500;font-size:17px;
    letter-spacing:.16em;color:rgba(245,241,230,.55);text-transform:uppercase;white-space:nowrap;}
  .lato .num .cif{font-family:'Mazzard',sans-serif;font-weight:800;font-size:30px;
    font-variant-numeric:tabular-nums;color:#F5F1E6;line-height:1;}
  .lato .num.forte .cif{color:#C9A24B;font-size:36px;}

  .lato .titel{font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;
    letter-spacing:.24em;color:#C9A24B;text-transform:uppercase;margin:18px 0 6px;}
  .lato .rigag{display:flex;align-items:center;gap:13px;padding:4px 0;}
  .lato.dx .rigag{flex-direction:row-reverse;}
  /* stessa cornice della formazione premium: le foto hanno lo sfondo bianco,
     stacca gia' da solo sul navy e non serve bordo */
  .lato .rigag .faccia{width:44px;height:54px;border-radius:9px;flex:none;overflow:hidden;
    position:relative;background:linear-gradient(180deg,#1a2550 0%,#0c1230 100%);
    box-shadow:0 6px 16px rgba(0,0,0,.45);}
  .lato .rigag .faccia img{position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:190%;height:190%;object-fit:cover;object-position:center top;display:block;}
  .lato .rigag .chi{font-family:'Mazzard',sans-serif;font-weight:700;font-size:21px;
    letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lato .rigag .q{font-family:'Mazzard',sans-serif;font-weight:800;font-size:22px;
    color:#C9A24B;font-variant-numeric:tabular-nums;flex:none;}

  #chiosa{position:absolute;left:0;right:0;text-align:center;opacity:0;
    font-family:'DM Sans',sans-serif;font-weight:500;font-size:16px;letter-spacing:.16em;
    color:rgba(245,241,230,.42);text-transform:uppercase;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes nodoIn {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(1.9); }
    60%  { opacity:1; transform:translate(-50%,-50%) scale(.92); }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="eyebrow"></div>
  <div id="title">LA MAPPA DEI PASSAGGI</div>
  <div id="rule"></div>
  <div id="lati"></div>
  <div id="campo"></div>
  <div id="verso"></div>
  <div id="chiosa"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url>
  //   { e:"SERIE A · 3ª GIORNATA", t:"LA MAPPA DEI PASSAGGI",
  //     sq:{ n:"Como", l:"…stemma…", g:4 },
  //     st:{ tot:618, prec:"92%", avanti:"46%", lung:"18 m" },
  //     n:[ { num:"5", p:"Perrone", x:47.7, y:43.6, q:89, dx:6.2, dy:-1.1,
  //           f:"…foto…" }, … ] }
  //
  //   x,y sono le coordinate ESPN (0-100) del punto medio da cui il giocatore
  //   ha giocato il pallone; dx,dy il passaggio medio, nelle stesse unita'.
  //   La squadra attacca sempre verso x=100: e' ESPN che gira le coordinate.
  var DEMO = {
    e: "SERIE A · 3ª GIORNATA", t: "LA MAPPA DEI PASSAGGI",
    sq: { n: "Como", g: 4 },
    st: { tot: 618, prec: "92%", avanti: "44%", lung: "17 m" },
    n: [
      { num: "1",  p: "Butez",    x: 10.0, y: 48.3, q: 32, dx: 14.0, dy: 1.0 },
      { num: "27", p: "Couto",    x: 49.4, y: 16.0, q: 70, dx: 6.0,  dy: 4.0 },
      { num: "4",  p: "Ramón",    x: 39.0, y: 28.8, q: 55, dx: 7.0,  dy: -3.0 },
      { num: "99", p: "Chalobah", x: 33.8, y: 69.0, q: 62, dx: 8.0,  dy: 2.0 },
      { num: "3",  p: "Valle",    x: 46.0, y: 77.2, q: 45, dx: 6.0,  dy: -4.0 },
      { num: "5",  p: "Perrone",  x: 47.7, y: 43.6, q: 89, dx: 5.0,  dy: 1.0 },
      { num: "8",  p: "Caqueret", x: 50.1, y: 61.0, q: 20, dx: 4.0,  dy: -2.0 },
      { num: "7",  p: "Da Cunha", x: 53.2, y: 57.1, q: 55, dx: 6.0,  dy: -5.0 },
      { num: "10", p: "Paz",      x: 62.0, y: 29.7, q: 67, dx: 5.0,  dy: 6.0 },
      { num: "20", p: "Baturina", x: 63.9, y: 62.8, q: 37, dx: 5.0,  dy: -6.0 },
      { num: "11", p: "Diao",     x: 67.1, y: 20.0, q: 38, dx: 4.0,  dy: 5.0 },
      { num: "9",  p: "Douvikas", x: 57.3, y: 58.6, q: 15, dx: 2.0,  dy: -3.0 }
    ]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.sq && d.n && d.n.length) ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "PASSAGGI — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "PASSAGGI " + (D.sq.n || "");

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    el("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var eb = el("eyebrow"); eb.textContent = D.e || "";
  var tt = el("title"); tt.textContent = D.t || "LA MAPPA DEI PASSAGGI";
  var rl = el("rule");
  if (STILL) { eb.style.opacity = 1; tt.style.clipPath = "inset(0 0 0 0)"; rl.style.transform = "scaleX(1)"; }
  else {
    eb.style.animation = "fadeIn .5s ease .15s forwards";
    tt.style.animation = "wipeIn .7s cubic-bezier(.2,.7,.3,1) .3s forwards";
    rl.style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) .85s forwards";
  }

  // ── il campo intero, con le misure regolamentari ────────────────────
  var PH = 620, PY = 288;
  var MPX = PH / 68;                            // pixel per metro
  var PW = Math.round(105 * MPX);
  var PX = Math.round((1920 - PW) / 2);
  function m(v) { return Math.round(v * MPX); }

  var campo = el("campo");
  campo.style.cssText = "left:" + PX + "px;top:" + PY + "px;width:" + PW + "px;height:" + PH + "px;" +
    (STILL ? "opacity:1" : "animation:fadeIn .6s ease .95s forwards");

  // meta' campo: "verso" -1 e' quella di sinistra (porta a sinistra), +1 quella
  // di destra. La squadra attacca sempre verso destra.
  function metaCampo(x0, verso) {
    var h = "";
    var HW = PW / 2;
    var fondo = verso < 0 ? x0 : x0 + HW;
    [[16.5, 40.32], [5.5, 18.32]].forEach(function (a) {
      var w = m(a[0]), hh = m(a[1]);
      h += '<i class="box" style="left:' + Math.round(verso < 0 ? fondo : fondo - w) + 'px;top:' +
           Math.round((PH - hh) / 2) + 'px;width:' + w + 'px;height:' + hh + 'px"></i>';
    });
    var dx = verso < 0 ? fondo + m(11) : fondo - m(11);
    var r = m(9.15), taglio = m(16.5 - 11) + r;
    h += '<i class="l" style="left:' + (dx - 3) + 'px;top:' + (PH / 2 - 3) +
         'px;width:6px;height:6px;border-radius:50%"></i>';
    h += '<i class="cerchio" style="left:' + (dx - r) + 'px;top:' + (PH / 2 - r) + 'px;' +
         'width:' + (2 * r) + 'px;height:' + (2 * r) + 'px;' +
         'clip-path:inset(0 ' + (verso < 0 ? "0 0 " + taglio + "px" : taglio + "px 0 0") + ')"></i>';
    var gh = m(7.32), gd = m(2);
    h += '<i class="rete" style="left:' + Math.round(verso < 0 ? fondo - gd : fondo) + 'px;top:' +
         Math.round((PH - gh) / 2) + 'px;width:' + gd + 'px;height:' + gh + 'px"></i>';
    var cr = m(1) + 5;
    [0, PH].forEach(function (yy) {
      h += '<i class="cerchio" style="left:' + Math.round(fondo - cr) + 'px;top:' + (yy - cr) + 'px;' +
           'width:' + (2 * cr) + 'px;height:' + (2 * cr) + 'px"></i>';
    });
    return h;
  }
  var rc = m(9.15);
  campo.innerHTML = '<i class="erba"></i>' +
    '<i style="position:absolute;inset:0;overflow:hidden;border-radius:4px">' +
      metaCampo(0, -1) + metaCampo(PW / 2, +1) +
      // la linea di meta' campo e il cerchio, questa volta veri: il campo e' uno
      '<i class="l" style="left:' + Math.round(PW / 2 - 1) + 'px;top:0;width:2px;height:' + PH + 'px"></i>' +
      '<i class="cerchio" style="left:' + Math.round(PW / 2 - rc) + 'px;top:' + Math.round(PH / 2 - rc) +
        'px;width:' + (2 * rc) + 'px;height:' + (2 * rc) + 'px"></i>' +
      '<i class="l" style="left:' + Math.round(PW / 2 - 3) + 'px;top:' + (PH / 2 - 3) +
        'px;width:6px;height:6px;border-radius:50%"></i>' +
    '</i>';

  // ── dal campo allo schermo ──────────────────────────────────────────
  // La squadra attacca verso x=100, cioe' verso destra. La y bassa e' la sua
  // DESTRA — misurato sui terzini: Couto, destro, gioca a y 13,7; Valle,
  // sinistro, a 82,7. E chi attacca verso destra, visto dall'alto, ha la
  // propria destra in BASSO: percio' la y si rovescia.
  function px(x) { return PX + PW * (Math.max(0, Math.min(100, x)) / 100); }
  function py(y) { return PY + PH * (1 - Math.max(0, Math.min(100, y)) / 100); }

  // ── la freccia del verso d'attacco ──────────────────────────────────
  var vs = el("verso");
  vs.style.cssText = "left:" + PX + "px;top:" + (PY - 34) + "px;" +
    (STILL ? "opacity:1" : "animation:fadeIn .5s ease 1.05s forwards");
  vs.innerHTML = '<span>Attacca</span><span class="asta"></span>';

  // ── i giocatori ─────────────────────────────────────────────────────
  // Il tondo cresce con quanto ciascuno ha giocato il pallone. Cresce come la
  // RADICE, non come il numero: l'occhio legge l'area, e raddoppiando il
  // raggio l'area quadruplica — un giocatore con il doppio dei passaggi
  // sembrerebbe averne quattro volte tanti.
  var quante = D.n.map(function (g) { return +g.q || 0; });
  var maxQ = Math.max.apply(null, quante.concat([1]));
  // Cerchi piu' grandi, perche' adesso sono otto e devono contenere un nome
  // che si legga. La radice resta: l'occhio legge l'area, e col raggio
  // proporzionale chi ha il doppio dei passaggi sembrerebbe averne quattro
  // volte tanti.
  // Il pallino e' piccolo e UGUALE per tutti: cosi' la posizione media e'
  // quella vera, non spinta di lato da un cerchio grande che aveva bisogno di
  // spazio. La quantita' se la prende la barra sotto il nome, dove si legge
  // per lunghezza — e la lunghezza l'occhio la confronta meglio di un'area.
  function raggio() { return 10; }
  // L'alone cresce come la RADICE dei palloni: l'occhio legge l'area, e col
  // raggio proporzionale chi ne ha il doppio sembrerebbe averne quattro volte
  // tanti. Senza costanti aggiunte: sommavo trenta pixel a tutti e le
  // differenze si schiacciavano — chi aveva il triplo dei palloni faceva un
  // alone appena una volta e mezza, cioe' la quantita' non si vedeva piu'.
  // Resta solo un minimo, perche' chi ha giocato poco non sparisca del tutto.
  function alone(q) { return Math.round(Math.max(36, 100 * Math.sqrt((+q || 0) / maxQ))); }

  var ordine = D.n.slice().sort(function (a, b) { return (b.q || 0) - (a.q || 0); });

  // ── dove va ciascun cerchio, col suo nome sotto ─────────────────────
  // Il cerchio diceva tre cose insieme: dove, quanto e chi. Troppe. Adesso
  // ne dice due — dove sta e quanti palloni ha giocato, col numero dentro —
  // e il CHI sta sotto, fuori, grande abbastanza da leggersi.
  //
  // Perche' il nome stia sempre attaccato al SUO cerchio e non ballino, i
  // cerchi si scansano tenendo conto anche dell'etichetta: l'ingombro di un
  // giocatore non e' il tondo, e' il tondo PIU' il nome che ci sta sotto. Due
  // rettangoli che non si toccano garantiscono che nessun nome finisca
  // addosso a un altro, e che nessuno debba andarselo a cercare un posto
  // altrove. Prima cercavo un posto ai nomi dopo aver messo i cerchi, ed era
  // il momento sbagliato: a quel punto il posto non c'era piu'.
  var GIU = 8, ALT = 48;            // stacco dal punto, e altezza di nome + conteggio

  var NODI = D.n.map(function (g, k) {
    var d = document.createElement("div");
    d.className = "cogn";
    // la barra e' lunga IN PROPORZIONE ai palloni, non alla radice: qui si
    // confrontano lunghezze, e la lunghezza l'occhio la legge dritta
    d.innerHTML = '<span class="nm">' + esc(String(g.p || "").toUpperCase()) + '</span>' +
                  '<span class="q">' + (+g.q || 0) + '</span>';
    el("stage").appendChild(d);
    return { g: g, el: d, r: raggio(g.q), x: px(g.x), y: py(g.y),
             peso: 1 / (1 + (+g.q || 0) / 20), i: 0, w: 0 };
  });
  var ordine = D.n.slice().sort(function (a, b) { return (b.q || 0) - (a.q || 0); });
  NODI.forEach(function (n) { n.i = ordine.indexOf(n.g); });

  function ingombro(n) {
    var w = Math.max(2 * n.r, n.w) + 10;
    return { x: n.x - w / 2, y: n.y - n.r - 4, w: w, h: 2 * n.r + GIU + ALT + 8 };
  }
  function scansa() {
    for (var giro = 0; giro < 140; giro++) {
      var mosso = false;
      for (var i = 0; i < NODI.length; i++) {
        for (var j = i + 1; j < NODI.length; j++) {
          var a = NODI[i], b = NODI[j], A = ingombro(a), B = ingombro(b);
          var ox = Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x);
          var oy = Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y);
          if (ox <= 0 || oy <= 0) continue;
          // si spinge lungo il lato dove si pestano di meno: e' lo spostamento
          // piu' corto che li separa, quindi la bugia piu' piccola
          var qa = a.peso / (a.peso + b.peso), qb = 1 - qa;
          if (ox < oy) {
            var sx = (a.x < b.x ? -1 : 1) * ox / 2;
            a.x += sx * 2 * qa; b.x -= sx * 2 * qb;
          } else {
            var sy = (a.y < b.y ? -1 : 1) * oy / 2;
            a.y += sy * 2 * qa; b.y -= sy * 2 * qb;
          }
          mosso = true;
        }
      }
      NODI.forEach(function (n) {
        var w = Math.max(2 * n.r, n.w) / 2 + 6;
        n.x = Math.max(PX + w, Math.min(PX + PW - w, n.x));
        n.y = Math.max(PY + n.r + 6, Math.min(PY + PH - n.r - GIU - ALT - 4, n.y));
      });
      if (!mosso) break;
    }
  }

  function disegna() {
    // le larghezze dei nomi cambiano col carattere: si misurano prima di
    // decidere gli ingombri, e si rifa' tutto a Mazzard caricato
    NODI.forEach(function (n) {
      n.el.style.display = "";
      n.w = n.el.offsetWidth || 90;
      n.x = px(n.g.x); n.y = py(n.g.y);      // si riparte sempre dal punto vero
    });
    scansa();

    var h = "";
    NODI.forEach(function (n) {
      var g = n.g, r = n.r, d = 2 * r;
      var anim = STILL ? "opacity:1"
        : "animation:nodoIn .5s cubic-bezier(.2,.7,.3,1) " + (1.2 + n.i * 0.09).toFixed(2) + "s forwards";
      // la freccia del passaggio medio, in metri veri sul campo
      var fr = "";
      if (g.dx != null && g.dy != null) {
        var ax = (+g.dx) / 100 * 105 * MPX, ay = -(+g.dy) / 100 * 68 * MPX;
        // Accorciate: la freccia deve dire il VERSO del passaggio medio, e
        // per quello basta poco. Alla lunghezza vera attraversavano mezza
        // mappa e andavano a finire addosso ai nomi degli altri.
        var lung = Math.sqrt(ax * ax + ay * ay) * 0.58;
        if (lung > 5) {
          var ang = Math.atan2(ay, ax) * 180 / Math.PI;
          fr = '<i class="dir" style="width:' + Math.round(r + lung) + 'px;' +
               'transform:rotate(' + ang.toFixed(1) + 'deg)"></i>';
        }
      }
      h += '<div class="nodo" style="left:' + Math.round(n.x) + 'px;top:' + Math.round(n.y) + 'px;' +
             'width:' + d + 'px;height:' + d + 'px;' + anim + '">' +
           '<i class="alone" style="width:' + (2 * alone(g.q)) + 'px;height:' + (2 * alone(g.q)) + 'px"></i>' +
           fr + '<i class="bolla" style="width:' + d + 'px;height:' + d + 'px"></i></div>';

      n.el.style.left = Math.round(n.x - n.w / 2) + "px";
      n.el.style.top = Math.round(n.y + r + GIU) + "px";
      n.el.style.animation = STILL ? "" : "fadeIn .4s ease " + (1.2 + n.i * 0.09 + 0.2).toFixed(2) + "s forwards";
      if (STILL) n.el.style.opacity = 1;
    });
    var vecchi = el("stage").querySelectorAll(".nodo");
    Array.prototype.forEach.call(vecchi, function (x) { x.remove(); });
    el("stage").insertAdjacentHTML("beforeend", h);
  }
  disegna();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(disegna);


  // ── le due colonne ──────────────────────────────────────────────────
  function colonna(lato, dentro, ritardo) {
    var anim = STILL ? "opacity:1" : "animation:fadeIn .55s ease " + ritardo + "s forwards";
    var pos = lato === "sx" ? "left:128px" : "right:128px";
    return '<div class="lato ' + lato + '" style="' + pos + ';top:' + PY + 'px;' + anim + '">' + dentro + '</div>';
  }
  var q = D.sq, st = D.st || {};
  var sinistra = '<div class="capo">' +
    (q.l ? '<img src="' + esc(q.l) + '" onerror="this.style.display=\'none\'">' : "") +
    // Niente punteggio: questa grafica racconta come si e' giocato, non
    // com'e' finita.
    '<div class="nome">' + esc(q.n || "") + '</div></div><div class="filo"></div>';
  [["Passaggi", st.tot, true], ["Precisione", st.prec, false],
   ["In avanti", st.avanti, false], ["Lunghezza media", st.lung, false]].forEach(function (r) {
    if (r[1] == null || r[1] === "") return;
    sinistra += '<div class="num' + (r[2] ? " forte" : "") + '">' +
                '<span class="eti">' + esc(r[0]) + '</span>' +
                '<span class="cif">' + esc(r[1]) + '</span></div>';
  });

  var destra = '<div class="titel">Palloni giocati</div>';
  ordine.slice(0, 5).forEach(function (g) {
    destra += '<div class="rigag">' +
      (g.f ? '<span class="faccia"><img src="' + esc(g.f) + '" onerror="this.parentNode.style.display=\'none\'"></span>' : "") +
      '<span class="chi">' + esc(String(g.p || "").toUpperCase()) + '</span>' +
      '<span class="q">' + (g.q || 0) + '</span></div>';
  });
  el("lati").innerHTML = colonna("sx", sinistra, "1.0") + colonna("dx", destra, "1.15");

  // ── la chiosa: dire che cosa si sta guardando ───────────────────────
  var ch = el("chiosa");
  ch.style.cssText = "top:" + (PY + PH + 40) + "px;" +
    (STILL ? "opacity:1" : "animation:fadeIn .5s ease " + (1.2 + D.n.length * 0.09 + 0.3).toFixed(2) + "s forwards");
  // La chiosa deve dire quello che la grafica fa DAVVERO: con i pallini tutti
  // uguali, "la grandezza sono i passaggi" era diventata una bugia.
  ch.innerHTML = "Ogni punto &egrave; il posto medio da cui il giocatore ha giocato il pallone &middot; " +
                 "l&rsquo;alone quanti ne ha giocati &middot; la freccia il passaggio medio";

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
