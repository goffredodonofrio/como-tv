<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anteprime partite · prova</title>
<!-- PROVA DELLE ANTEPRIME (25/09/2026). Due varianti della stessa grafica —
     solo grafica sul campo navy, e la grafica sopra un fotogramma della
     partita — a grandezza scheda e a grandezza lista. Tre casi veri: una
     partita del Como, una estera, una senza logo e senza risultato. Scelta
     la variante, la grafica va nella Libreria disegnata dai dati (niente
     immagini da fabbricare per 1.700 partite). -->
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  :root{
    --navy-900:#0A0F24;--navy-850:#0E1430;--navy-800:#141B3C;--navy-700:#20284E;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;--red:#E51B20;
    --ivory:#F5F1E6;--ivory-dim:#D8D2C2;--fg-3:#8A8B96;
    --line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font:500 14px/1.45 'DM Sans',system-ui,sans-serif;color:var(--ivory);min-height:100vh;
    background:radial-gradient(1200px 600px at 15% -10%,rgba(201,162,75,.10),transparent 60%),
               radial-gradient(900px 500px at 110% 10%,rgba(32,40,78,.9),transparent 60%),
               linear-gradient(165deg,var(--navy-850),var(--navy-900)) fixed;
    padding:32px 24px 64px;}
  .pagina{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px;}
  .eyebrow{font:700 11px/1 'DM Sans',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
  h1{font:800 26px/1.1 'Mazzard',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin-top:8px;}
  .intro p{color:var(--ivory-dim);max-width:70ch;margin-top:8px;}
  h2{font:700 13px/1 'Mazzard',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-bright);}
  .blocco{display:flex;flex-direction:column;gap:14px;}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;}
  .lista{display:flex;flex-direction:column;gap:8px;max-width:640px;}
  .riga{display:flex;align-items:center;gap:14px;padding:8px;border:1px solid var(--line-2);border-radius:10px;background:rgba(10,15,36,.5);}
  .riga .ant{width:168px;flex:none;}
  .riga b{font:700 13px/1.2 'Mazzard',sans-serif;text-transform:uppercase;display:block;}
  .riga span{color:var(--fg-3);font-size:12px;}

  /* ── L'ANTEPRIMA ─────────────────────────────────────────────────
     Tutto in cqw: la stessa scheda da 168 px (lista) a 600 (scheda) */
  .ant{position:relative;container-type:inline-size;aspect-ratio:16/9;border-radius:10px;overflow:hidden;isolation:isolate;
    background:radial-gradient(120% 90% at 50% 0%,var(--navy-700),var(--navy-900) 70%);
    border:1px solid var(--line-gold);box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .ant::before{content:"";position:absolute;inset:0;z-index:-1;
    background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(201,162,75,.045) 22px 23px);}
  /* il fotogramma si ingrandisce e scende: in alto a sinistra c'e' il
     punteggio della regia, che non deve comparire sotto la competizione */
  .ant .foto{position:absolute;inset:0;z-index:-2;background-size:135% auto;background-position:55% 90%;filter:saturate(.75);}
  .ant.con-foto::before{background:linear-gradient(180deg,rgba(10,15,36,.9),rgba(10,15,36,.62) 30%,rgba(10,15,36,.7) 60%,rgba(10,15,36,.95));}
  .ant header{position:absolute;top:5cqw;left:5.5cqw;right:5.5cqw;display:flex;justify-content:space-between;align-items:center;gap:3cqw;}
  .ant .comp{font:700 2.5cqw/1 'DM Sans',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ant .data{font:500 2.4cqw/1 'DM Sans',sans-serif;color:var(--ivory-dim);letter-spacing:.06em;white-space:nowrap;}
  .ant .centro{position:absolute;left:4cqw;right:4cqw;top:17cqw;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2cqw;}
  .ant figure{display:flex;flex-direction:column;align-items:center;gap:2.2cqw;min-width:0;}
  .ant .stemma{width:15cqw;height:15cqw;display:grid;place-items:center;}
  .ant .stemma img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 .6cqw 1.2cqw rgba(0,0,0,.45));}
  /* senza logo: la sigla dentro un tondo, nei colori di casa */
  .ant .sigla{width:13cqw;height:13cqw;border-radius:50%;display:grid;place-items:center;
    border:.5cqw solid var(--gold);background:radial-gradient(circle at 35% 30%,var(--navy-700),var(--navy-900));
    font:800 3.6cqw/1 'Mazzard',sans-serif;color:var(--gold-bright);letter-spacing:.04em;}
  .ant figcaption{font:800 3.3cqw/1.05 'Mazzard',sans-serif;text-transform:uppercase;text-align:center;letter-spacing:.02em;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ant .ris{font:800 11cqw/1 'Mazzard',sans-serif;color:var(--gold-bright);font-variant-numeric:tabular-nums;white-space:nowrap;
    text-shadow:0 .5cqw 2cqw rgba(0,0,0,.4);padding-bottom:4cqw;}
  .ant .ris i{font-style:normal;color:var(--gold-deep);margin:0 1.2cqw;}
  .ant .ris.vs{font-size:6cqw;color:var(--ivory-dim);letter-spacing:.1em;}
  .ant footer{position:absolute;left:0;right:0;bottom:0;height:13cqw;display:flex;align-items:center;gap:2.4cqw;padding:0 5.5cqw;
    background:linear-gradient(90deg,rgba(10,15,36,.92),rgba(10,15,36,.6));border-top:.25cqw solid var(--gold);}
  .ant .tele{display:flex;flex-direction:column;gap:.8cqw;min-width:0;}
  .ant .tele em{font:700 1.9cqw/1 'DM Sans',sans-serif;font-style:normal;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
  .ant .tele b{font:700 3cqw/1 'Mazzard',sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ant .lingua{font:700 2.1cqw/1 'DM Sans',sans-serif;letter-spacing:.14em;padding:.9cqw 1.6cqw;border-radius:99px;border:.25cqw solid var(--line-gold);color:var(--gold-bright);}
  .ant .marchio{margin-left:auto;height:9.5cqw;width:auto;}

  /* a grandezza lista si tiene l'essenziale: stemmi e risultato */
  @container (max-width: 260px){
    .ant header,.ant footer,.ant figcaption{display:none;}
    .ant .centro{top:50%;transform:translateY(-50%);}
    .ant .stemma{width:24cqw;height:24cqw;} .ant .sigla{width:21cqw;height:21cqw;font-size:6cqw;}
    .ant .ris{font-size:17cqw;padding-bottom:0;} .ant .ris.vs{font-size:10cqw;}
  }
  @media (max-width:520px){ body{padding:20px 16px 48px;} .griglia{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="pagina">
  <div class="intro">
    <div class="eyebrow">MAM · prova</div>
    <h1>Anteprime delle partite</h1>
    <p>Tre partite vere in due varianti. La grafica si disegna dai dati della partita: stemmi, nomi, competizione, risultato, telecronista e lingua. Sotto, la stessa scheda alla grandezza della lista della Libreria.</p>
  </div>
  <section class="blocco"><h2>A · Grafica</h2><div class="griglia" id="gA"></div></section>
  <section class="blocco"><h2>B · Fotogramma sotto</h2><div class="griglia" id="gB"></div></section>
  <section class="blocco"><h2>Nella lista</h2><div class="lista" id="gL"></div></section>
</div>
<script>
// I dati come li da' il ponte (archivio, ESPN, appunti). ENG = Paul Dempsey.
var PARTITE = [
  { partita: "COMO-PARMA", comp: "Serie A", data: "14.09.2026", lingua: "ITA", tele: "Angelo Taglieri",
    casa: { nome: "Como", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png" },
    osp: { nome: "Parma", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/115.png" },
    ris: [2, 1], foto: "anteprime-prova/como-parma-1500.jpg" },
  { partita: "CELTIC-RANGERS", comp: "Scottish Premiership", data: "20.09.2026", lingua: "ITA", tele: "Riccardo Restini",
    casa: { nome: "Celtic", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/256.png" },
    osp: { nome: "Rangers", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/257.png" },
    ris: [0, 1], foto: "" },
  { partita: "COMO-ALULA", comp: "Como Cup", data: "29.07.2026", lingua: "ENG", tele: "Paul Dempsey",
    casa: { nome: "Como", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png" },
    osp: { nome: "AlUla", logo: "" },
    ris: null, foto: "" }
];
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
// la sigla quando manca il logo: tre lettere, o le iniziali se il nome e' di piu' parole
function sigla(nome){
  var p = String(nome).toUpperCase().replace(/[^A-Z0-9 ]/g, "").split(/\s+/).filter(Boolean);
  return p.length > 1 ? p.map(function(w){ return w[0]; }).join("").slice(0, 3) : (p[0] || "?").slice(0, 3);
}
function squadra(s){
  return '<figure><div class="stemma">' + (s.logo ? '<img src="' + esc(s.logo) + '" alt="" loading="lazy">' : '<div class="sigla">' + esc(sigla(s.nome)) + '</div>') +
    '</div><figcaption>' + esc(s.nome) + '</figcaption></figure>';
}
function anteprima(p, conFoto){
  var foto = conFoto && p.foto;
  return '<article class="ant' + (foto ? ' con-foto' : '') + '" aria-label="' + esc(p.partita) + '">' +
    (foto ? '<div class="foto" style="background-image:url(\'' + esc(p.foto) + '\')"></div>' : '') +
    '<header><span class="comp">' + esc(p.comp) + '</span><span class="data">' + esc(p.data) + '</span></header>' +
    '<div class="centro">' + squadra(p.casa) +
      (p.ris ? '<div class="ris">' + p.ris[0] + '<i>–</i>' + p.ris[1] + '</div>' : '<div class="ris vs">VS</div>') +
      squadra(p.osp) + '</div>' +
    '<footer><span class="tele"><em>Telecronaca</em><b>' + esc(p.tele || "—") + '</b></span><span class="lingua">' + esc(p.lingua) + '</span>' +
      '<img class="marchio" src="../loghi/como-tv-logo.png" alt="Como TV"></footer></article>';
}
document.getElementById("gA").innerHTML = PARTITE.map(function(p){ return anteprima(p, false); }).join("");
document.getElementById("gB").innerHTML = PARTITE.map(function(p){ return anteprima(p, true); }).join("");
document.getElementById("gL").innerHTML = PARTITE.map(function(p){
  return '<div class="riga">' + anteprima(p, true) + '<div><b>' + esc(p.partita) + (p.ris ? " " + p.ris.join("-") : "") + '</b><span>' +
    esc(p.comp) + ' · ' + esc(p.data) + ' · ' + esc(p.tele) + ' (' + esc(p.lingua) + ')</span></div></div>';
}).join("");
</script>
</body>
</html>
