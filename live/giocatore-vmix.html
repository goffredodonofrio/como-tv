<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giocatore · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  /* ── la foto del giocatore: mezza scena a destra, come Focus e Scheda ── */
  #fotobox{position:absolute;right:0;top:0;width:1000px;height:1080px;overflow:hidden;
    opacity:0;transform:translateX(70px);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 16%,rgba(0,0,0,.7) 34%,#000 52%);
            mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 16%,rgba(0,0,0,.7) 34%,#000 52%);}
  #fotobox img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.84) saturate(1.05);}
  #fotobox .velo{position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(10,15,38,.3) 0%,rgba(10,15,38,.1) 45%,rgba(10,15,38,.35) 100%),
      linear-gradient(0deg,rgba(7,11,29,.85) 0%,transparent 34%),
      linear-gradient(180deg,rgba(7,11,29,.6) 0%,transparent 26%);}

  /* ── intestazione: occhiello + titolo (mostrati solo se compilati) ── */
  #testa{position:absolute;left:130px;top:64px;width:820px;opacity:0;transform:translateY(24px);}
  #testa .occhiello{font-family:'Mazzard',sans-serif;font-weight:700;font-size:24px;letter-spacing:.28em;
    color:#C9A24B;text-transform:uppercase;line-height:1;}
  #testa .titolone{font-family:'Mazzard',sans-serif;font-weight:800;font-size:54px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;line-height:1.02;margin-top:12px;white-space:nowrap;}

  /* ── il giocatore: lockup di Focus, alto e grande ── */
  #chi{position:absolute;left:130px;top:118px;width:760px;opacity:0;transform:translateY(24px);}
  #chi .kicker{font-family:'Mazzard',sans-serif;font-weight:700;font-size:38px;letter-spacing:.2em;
    color:#F5F1E6;text-transform:uppercase;line-height:1;}
  #chi .nome{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;
    font-size:122px;line-height:1.06;color:#C9A24B;white-space:nowrap;}
  #chi .sotto{font-family:'DM Sans',sans-serif;font-weight:500;font-size:27px;letter-spacing:.16em;
    color:rgba(245,241,230,.6);text-transform:uppercase;margin-top:12px;}
  #chi .filo{width:300px;height:3px;margin-top:26px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.15) 100%);}

  /* ── le statistiche, sotto il nome ── */
  .riga{position:absolute;left:130px;width:760px;height:64px;opacity:0;
    border-bottom:1px solid rgba(245,241,230,.1);}
  .riga .eti{position:absolute;left:0;top:14px;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:26px;letter-spacing:.16em;
    color:rgba(245,241,230,.6);text-transform:uppercase;white-space:nowrap;}
  .riga .val{position:absolute;right:0;top:6px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:44px;
    font-variant-numeric:tabular-nums;color:#C9A24B;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes salita { to { opacity:1; transform:translateY(0); } }
  @keyframes daDestra { to { opacity:1; transform:translateX(0); } }
  @keyframes rigaIn {
    0%   { opacity:0; transform:translateX(28px); }
    100% { opacity:1; transform:translateX(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="fotobox" style="display:none"><img id="foto" alt=""><div class="velo"></div></div>
  <div id="testa"></div>
  <div id="chi"></div>
  <div id="righe"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url> — stesso contratto di prima:
  //   { e:"COMO · SERIE A", t:"LA SCHEDA",
  //     g:{n:"Patrick Cutrone", s:"Attaccante · Como", num:"63", f:"…foto…"},
  //     st:[["Presenze", 12], ["Gol", 7], …] }
  // La foto (f) e' un ritratto verticale a colori (come Focus e Duello);
  // le vecchie foto quadrate ci stanno lo stesso: la quinta le ritaglia.
  var DEMO = {
    e: "COMO · SERIE A", t: "LA SCHEDA",
    g: { n: "Patrick Cutrone", s: "Attaccante · Como", num: "63" },
    st: [["Presenze", 12], ["Gol", 7], ["Assist", 3], ["Tiri in porta", 21],
         ["Minuti giocati", 987], ["Ammonizioni", 2]]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.g && d.st && d.st.length) ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "GIOCATORE — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "GIOCATORE " + (D.g.n || "");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();
  function el(id) { return document.getElementById(id); }

  // niente titolo ne' occhiello: il giocatore E' il titolo.
  var g = D.g;
  var parole = String(g.n || "").trim().split(/\s+/);
  var cognome = parole.length > 1 ? parole.slice(-1)[0] : parole[0] || "";
  var davanti = parole.length > 1 ? parole.slice(0, -1).join(" ") : "";

  // intestazione (occhiello + titolo): compare solo se compilata; allora il
  // giocatore scende per farle spazio
  var conTesta = !!(D.e || D.t);
  el("testa").innerHTML =
    (D.e ? '<div class="occhiello">' + esc(D.e) + '</div>' : "") +
    (D.t ? '<div class="titolone">' + esc(D.t) + '</div>' : "");
  if (conTesta) {
    el("chi").style.top = "236px";
    if (STILL) el("testa").style.opacity = 1;
    else el("testa").style.animation = "salita .6s cubic-bezier(.2,.7,.3,1) .12s forwards";
  }

  el("chi").innerHTML =
    (davanti ? '<div class="kicker">' + esc(davanti) + '</div>' : "") +
    '<div class="nome">' + esc(cognome) + '</div>' +
    (g.s ? '<div class="sotto">' + esc(g.s) + '</div>' : "") +
    '<div class="filo"></div>';
  if (STILL) { el("chi").style.opacity = 1; el("chi").style.transform = "none"; }
  else el("chi").style.animation = "salita .6s cubic-bezier(.2,.7,.3,1) .25s forwards";
  // il nome lungo non deve toccare la foto
  (function () {
    var n = el("chi").querySelector(".nome");
    if (n && n.scrollWidth > 740) n.style.fontSize = Math.max(56, Math.floor(122 * 740 / n.scrollWidth)) + "px";
  })();

  // la foto: quinta verticale a colori; senza foto, resta il fondo
  if (g.f) {
    el("fotobox").style.display = "";
    el("foto").src = g.f;
    if (STILL) { el("fotobox").style.opacity = 1; el("fotobox").style.transform = "none"; }
    else el("fotobox").style.animation = "daDestra .9s cubic-bezier(.2,.7,.3,1) .5s forwards";
  }

  // le statistiche: piu' spazio se non c'e' il sottotitolo; scendono se c'e' l'intestazione
  var Y0 = (conTesta ? 118 : 0) + (g.s ? 452 : 404);
  var PASSO = Math.min(100, Math.floor((1030 - Y0) / D.st.length));
  var h = "";
  D.st.forEach(function (r, i) {
    var anim = STILL ? "opacity:1" : "animation:rigaIn .5s cubic-bezier(.2,.7,.3,1) " + (0.7 + i * 0.13).toFixed(2) + "s forwards";
    h += '<div class="riga" style="top:' + (Y0 + i * PASSO) + 'px;height:' + (PASSO - 8) + 'px;' + anim + '">' +
      '<span class="eti" style="top:' + Math.max(8, (PASSO - 8 - 30) / 2) + 'px">' + esc(r[0]) + '</span>' +
      '<span class="val" style="top:' + Math.max(2, (PASSO - 8 - 46) / 2) + 'px">' + esc(r[1]) + '</span>' +
      '</div>';
  });
  document.getElementById("righe").innerHTML = h;

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
