<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giocatore · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);
  }

  #eyebrow{position:absolute;left:128px;top:82px;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:.24em;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #title{position:absolute;left:125px;top:104px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:76px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #rule{position:absolute;left:128px;top:212px;width:300px;height:3px;
    background:linear-gradient(90deg,#C9A24B 0%,rgba(201,162,75,.15) 100%);
    transform:scaleX(0);transform-origin:left center;}

  /* ── la scheda del giocatore, a sinistra ── */
  #scheda{position:absolute;left:128px;top:300px;width:560px;text-align:center;opacity:0;}
  #scheda .tondo{width:220px;height:220px;margin:0 auto 26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:88px;color:#FFF;
    box-shadow:inset 0 0 0 5px rgba(245,241,230,.7), 0 16px 44px rgba(0,0,0,.5);}
  #scheda img{width:220px;height:220px;object-fit:contain;margin:0 auto 26px;display:block;
    filter:drop-shadow(0 16px 44px rgba(0,0,0,.5));}
  /* la foto nel cerchio: bicromia navy/oro, coerente con la grafica */
  #scheda .fotondo{width:220px;height:220px;margin:0 auto 26px;border-radius:50%;overflow:hidden;
    position:relative;background:#10173A;
    box-shadow:inset 0 0 0 5px rgba(245,241,230,.7), 0 16px 44px rgba(0,0,0,.5);}
  #scheda .fotondo img{width:100%;height:100%;object-fit:cover;margin:0;filter:grayscale(1) contrast(1.06) brightness(1.02);}
  #scheda .fotondo i{position:absolute;inset:0;border-radius:50%;}
  #scheda .fotondo .d1{background:#C9A24B;mix-blend-mode:multiply;}
  #scheda .fotondo .d2{background:#141B3C;mix-blend-mode:lighten;}
  #scheda .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:52px;letter-spacing:.01em;
    color:#F5F1E6;text-transform:uppercase;line-height:1.04;}
  #scheda .sotto{font-family:'DM Sans',sans-serif;font-weight:500;font-size:22px;letter-spacing:.16em;
    color:rgba(245,241,230,.55);text-transform:uppercase;margin-top:12px;}
  #scheda .filo{width:120px;height:3px;margin:22px auto 0;
    background:linear-gradient(90deg,transparent,#C9A24B,transparent);}

  /* ── le statistiche, a destra ── */
  .riga{position:absolute;left:800px;width:990px;height:64px;opacity:0;
    border-bottom:1px solid rgba(245,241,230,.08);}
  .riga .eti{position:absolute;left:0;top:14px;
    font-family:'Mazzard',sans-serif;font-weight:700;font-size:23px;letter-spacing:.16em;
    color:rgba(245,241,230,.6);text-transform:uppercase;white-space:nowrap;}
  .riga .val{position:absolute;right:0;top:6px;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:38px;
    font-variant-numeric:tabular-nums;color:#C9A24B;}

  @keyframes wipeIn { to { clip-path:inset(0 0 0 0); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes ruleIn { to { transform:scaleX(1); } }
  @keyframes rigaIn {
    0%   { opacity:0; transform:translateX(28px); }
    100% { opacity:1; transform:translateX(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="eyebrow"></div>
  <div id="title">LA SCHEDA</div>
  <div id="rule"></div>
  <div id="scheda"></div>
  <div id="righe"></div>
</div>

<script>
(function () {
  "use strict";

  // Dati: ?d=<base64url>
  //   { e:"COMO · SERIE A", t:"LA SCHEDA",
  //     g:{n:"Patrick Cutrone", s:"Attaccante · Como", l:"…foto…", num:"63", c:"#1735C8"},
  //     st:[["Presenze", 12], ["Gol", 7], …] }
  var DEMO = {
    e: "COMO · SERIE A", t: "LA SCHEDA",
    g: { n: "Patrick Cutrone", s: "Attaccante · Como", num: "63", c: "#1735C8" },
    st: [["Presenze", 12], ["Gol", 7], ["Assist", 3], ["Tiri in porta", 21],
         ["Minuti giocati", 987], ["Ammonizioni", 2]]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.g && d.st && d.st.length) ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    document.title = "GIOCATORE — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "GIOCATORE " + (D.g.n || "");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  var eb = document.getElementById("eyebrow"); eb.textContent = D.e || "";
  var tt = document.getElementById("title"); tt.textContent = D.t || "LA SCHEDA";
  var rl = document.getElementById("rule");
  if (STILL) { eb.style.opacity = 1; tt.style.clipPath = "inset(0 0 0 0)"; rl.style.transform = "scaleX(1)"; }
  else {
    eb.style.animation = "fadeIn .5s ease .15s forwards";
    tt.style.animation = "wipeIn .7s cubic-bezier(.2,.7,.3,1) .3s forwards";
    rl.style.animation = "ruleIn .55s cubic-bezier(.2,.7,.3,1) .85s forwards";
  }

  var g = D.g;
  var faccia = g.f
    ? '<div class="fotondo"><img src="' + esc(g.f) + '"><i class="d1"></i><i class="d2"></i></div>'
    : g.l
    ? '<img src="' + esc(g.l) + '" onerror="this.style.display=\'none\'">'
    : '<div class="tondo" style="background:' + esc(g.c || "#243F8A") + '">' +
      esc(g.num || String(g.n || "").slice(0, 2).toUpperCase()) + '</div>';
  var sk = document.getElementById("scheda");
  sk.innerHTML = faccia +
    '<div class="nome">' + esc(g.n || "") + '</div>' +
    (g.s ? '<div class="sotto">' + esc(g.s) + '</div>' : "") +
    '<div class="filo"></div>';
  sk.style.cssText += STILL ? "opacity:1" : "animation:fadeIn .6s ease 1.0s forwards";

  var Y0 = 300, PASSO = Math.min(96, Math.floor((1030 - Y0) / D.st.length));
  var h = "";
  D.st.forEach(function (r, i) {
    var anim = STILL ? "opacity:1" : "animation:rigaIn .5s cubic-bezier(.2,.7,.3,1) " + (1.15 + i * 0.13).toFixed(2) + "s forwards";
    h += '<div class="riga" style="top:' + (Y0 + i * PASSO) + 'px;height:' + (PASSO - 8) + 'px;' + anim + '">' +
      '<span class="eti" style="top:' + Math.max(8, (PASSO - 8 - 30) / 2) + 'px">' + esc(r[0]) + '</span>' +
      '<span class="val" style="top:' + Math.max(2, (PASSO - 8 - 46) / 2) + 'px">' + esc(r[1]) + '</span>' +
      '</div>';
  });
  document.getElementById("righe").innerHTML = h;

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
