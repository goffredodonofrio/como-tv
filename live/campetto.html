<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio (un vecchio segnalibro, un input vMix non aggiornato) comanderebbe
   un sistema che nessuno ascolta, e le grafiche non andrebbero in onda.
   Da GitHub si viene quindi portati sulla macchina giusta. Sulla VM questo
   non fa nulla. Se l'indirizzo della macchina cambia, va cambiato anche qui. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  // il percorso su GitHub (/como-tv/...) e' identico a quello sul dominio:
  // si cambia solo la casa
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campetto · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  @page{size:A4 landscape;margin:0;}
  html,body{background:#8A8F9C;}
  body{font-family:'DM Sans',system-ui,sans-serif;color:#14161C;}

  .page{
    width:297mm;height:209mm;background:#FFFFFF;
    margin:8mm auto;box-shadow:0 4px 22px rgba(0,0,0,.35);
    padding:9mm 11mm 8mm;position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .head,.pitchH{flex:none;}

  /* barra strumenti (solo schermo) */
  #tools{position:fixed;top:10px;right:14px;z-index:50;}
  #tools button{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;padding:10px 16px;border-radius:5px;cursor:pointer;
    background:#C9A24B;border:1px solid #C9A24B;color:#14161C;}

  /* ── intestazione ── */
  .head{display:flex;align-items:baseline;gap:4mm;border-bottom:.7mm solid #14161C;padding-bottom:2.2mm;}
  .head .team{font-family:'Mazzard',sans-serif;font-weight:800;font-size:15pt;letter-spacing:.02em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70mm;}
  .head .mod{font-family:'Mazzard',sans-serif;font-weight:700;font-size:10pt;color:#666;}
  .head .vs{font-family:'Mazzard',sans-serif;font-weight:800;font-size:11pt;color:#8A6A1E;}
  .head .data{margin-left:auto;font-family:'Mazzard',sans-serif;font-weight:700;font-size:9pt;color:#666;}

  /* ── un campo solo, orizzontale, con le due formazioni una contro l'altra:
     la casa attacca verso destra, l'ospite verso sinistra. E' la partita
     vista dall'alto, come sul campetto della pagina Formazioni. ── */
  .pitchH{position:relative;width:100%;flex:1;min-height:80mm;margin-top:2.4mm;}
  .pitchH svg{position:absolute;inset:0;width:100%;height:100%;}
  .pdot{position:absolute;transform:translate(-50%,-50%);text-align:center;width:30mm;}
  .pdot .n{display:inline-flex;align-items:center;justify-content:center;
    width:8.2mm;height:8.2mm;border-radius:50%;border:.5mm solid #14161C;background:#fff;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:10.5pt;}
  .pdot.away .n{background:#14161C;color:#fff;}
  .pdot .c{display:block;margin-top:.4mm;font-family:'DM Sans',sans-serif;font-weight:700;
    font-size:8.2pt;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}

  /* ── liste sotto il campo: una colonna per squadra ── */
  .lists{display:flex;gap:10mm;margin-top:2.6mm;flex:none;}
  .col{flex:1;min-width:0;}
  .col h3{font-family:'Mazzard',sans-serif;font-weight:800;font-size:9.8pt;
    letter-spacing:.14em;text-transform:uppercase;border-bottom:.4mm solid #14161C;
    padding-bottom:.9mm;margin-bottom:1mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .all{margin:1mm 0 1.4mm;font-size:9pt;}
  .all b{font-family:'Mazzard',sans-serif;font-weight:800;text-transform:uppercase;}
  .btitle{font-family:'Mazzard',sans-serif;font-weight:800;font-size:9pt;letter-spacing:.12em;
    text-transform:uppercase;border-bottom:.3mm solid #999;padding-bottom:.6mm;margin-bottom:.8mm;color:#333;}
  .bcols{column-count:3;column-gap:6mm;}
  .bcols .r{display:flex;gap:1.8mm;align-items:baseline;padding:.1mm 0;line-height:1.15;break-inside:avoid;}
  .bcols .r .num{width:6mm;text-align:right;font-family:'Mazzard',sans-serif;font-weight:800;font-size:8.2pt;flex:none;}
  .bcols .r .nm{font-size:8.2pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bcols .r .nm b{font-weight:700;}

  .vuoto{padding:30mm 0;text-align:center;color:#555;font-size:12pt;}

  @media print{
    html,body{background:#fff;}
    .page{margin:0;box-shadow:none;}
    #tools{display:none;}
  }
</style>
</head>
<body>

<div id="tools"><button onclick="window.print()">&#128424; Stampa / Salva PDF</button></div>
<div id="pages"></div>

<script>
(function () {
  "use strict";

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return null;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return d && d.s && d.s.length ? d : null;
    } catch (err) { return null; }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Mezzo campo per squadra: la casa parte da sinistra e attacca a destra,
  // l'ospite e' specchiata. Le due formazioni stanno sullo stesso campo.
  function slotGeo(mod, lato) {
    var lines = [1].concat(String(mod || "4-3-3").split("-").map(Number));
    var out = [];
    var nLin = lines.length;
    lines.forEach(function (n, li) {
      var gx = nLin > 1 ? li / (nLin - 1) : 0;          // 0 = porta, 1 = centrocampo
      var x = 7 + gx * 37;                               // 7%..44% della larghezza
      if (lato === 1) x = 100 - x;
      for (var k = 0; k < n; k++) {
        // ordine della lista: portiere, terzino DESTRO, centrale destro… e la
        // destra di chi attacca verso destra e' la parte BASSA del foglio.
        // (Prima questo campetto partiva dall'alto: le fasce risultavano
        // scambiate rispetto al campetto della pagina Formazioni.)
        var y = 8 + (n - k) / (n + 1) * 84;
        if (lato === 1) y = 100 - y;
        out.push({ x: x, y: y });
      }
    });
    return out;
  }

  function pitchSVG() {
    // campo intero orizzontale (viewBox 186x82, tratto leggero)
    return '<svg viewBox="0 0 186 82" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">' +
      '<g stroke="#9AA0AB" stroke-width="0.45" fill="none">' +
      '<rect x="1" y="1" width="184" height="80"/>' +
      '<line x1="93" y1="1" x2="93" y2="81"/>' +
      '<circle cx="93" cy="41" r="10"/>' +
      '<rect x="1" y="20" width="17" height="42"/>' +
      '<rect x="1" y="31" width="6.5" height="20"/>' +
      '<rect x="168" y="20" width="17" height="42"/>' +
      '<rect x="178.5" y="31" width="6.5" height="20"/>' +
      '<path d="M 18 33 A 9 9 0 0 1 18 49"/>' +
      '<path d="M 168 33 A 9 9 0 0 0 168 49"/>' +
      '</g></svg>';
  }

  var D = decodeData();
  var wrap = document.getElementById("pages");

  if (!D) {
    wrap.innerHTML = '<div class="page"><div class="vuoto">Apri questa pagina dal pulsante <b>Scarica campetto</b> della pagina Formazioni.</div></div>';
    return;
  }

  var oggi = new Date();
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  var dataStr = p2(oggi.getDate()) + "/" + p2(oggi.getMonth() + 1) + "/" + oggi.getFullYear();

  var sq = D.s.slice(0, 2);

  // intestazione: SQUADRA1 (mod)  VS  SQUADRA2 (mod)  ·  data
  var h = '<div class="page"><div class="head">';
  sq.forEach(function (s, i) {
    if (i > 0) h += '<span class="vs">VS</span>';
    h += '<span class="team">' + esc(s.n) + '</span><span class="mod">' + esc(s.m) + '</span>';
  });
  h += '<span class="data">' + dataStr + '</span></div>';

  // un campo solo, le due formazioni una contro l'altra
  h += '<div class="pitchH">' + pitchSVG();
  sq.forEach(function (s, si) {
    var geo = slotGeo(s.m, si);
    (s.t || []).forEach(function (r, i) {
      var g = geo[i] || geo[geo.length - 1];
      h += '<div class="pdot' + (si === 1 ? " away" : "") + '" style="left:' + g.x + '%;top:' + g.y + '%">' +
        '<span class="n">' + esc(r[0]) + '</span>' +
        '<span class="c">' + esc(r[2]) + '</span></div>';
    });
  });
  h += '</div>';

  // sotto il campo: solo allenatore e panchina (gli undici sono in campo)
  h += '<div class="lists">';
  sq.forEach(function (s) {
    h += '<div class="col"><h3>' + esc(s.n) + '</h3>';
    if (s.a && (s.a[0] || s.a[1])) {
      h += '<div class="all">Allenatore: <b>' + esc((s.a[0] || "") + " " + (s.a[1] || "")) + '</b></div>';
    } else {
      h += '<div class="all">&nbsp;</div>';
    }
    h += '<div class="btitle">Panchina</div><div class="bcols">';
    (s.p || []).forEach(function (r) {
      h += '<div class="r"><span class="num">' + esc(r[0]) + '</span>' +
        '<span class="nm">' + esc(r[1]) + ' <b>' + esc(r[2]) + '</b></span></div>';
    });
    h += '</div></div>';
  });
  h += '</div>';

  h += '</div>';

  wrap.innerHTML = h;
  document.title = "CAMPETTO " + sq.map(function (s) { return (s.n || "").toUpperCase(); }).join(" - ");

  if (new URLSearchParams(location.search).get("noprint") !== "1") {
    window.addEventListener("load", function () {
      setTimeout(function () { window.print(); }, 650);
    });
  }
})();
</script>
</body>
</html>
