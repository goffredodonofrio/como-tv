<title>Cartelle 1907 · Como TV</title>
<!--
  CARTELLE 1907 COME IL FINDER DEL MAC (Goffredo, 30/09/2026: "come un finder di Mac, con visualizzazione
  e azioni": come icone / come elenco / come colonne / come galleria).
  La cartella COMOTV - FRAME della NAS del club: si entra, si guarda, si crea, si rinomina, si sposta
  (anche trascinando), si CARICA trascinando i file dal Mac (a blocchi, con controllo d'integrita'),
  si condivide, si scarica; elimina solo chi e' autorizzato (un file alla volta, definitivo).
  Clic destro per le azioni; scorciatoie del Finder: Cmd+1..4 le viste, Spazio l'anteprima, Invio rinomina,
  Cmd+freccia su/giu' la cartella sopra / apri, Cmd+Maiusc+N nuova cartella, Cmd+A tutto.
  Dati dal servizio-1907: GET/POST /cartelle, /carica/…, /condividi, /elimina-clip; miniature /mini/.
-->
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}

  body{font:14px/1.45 'DM Sans',system-ui,sans-serif;font-weight:500;color:var(--ivory);background:var(--navy);min-height:100vh;}
  button{font:600 12.5px/1 'DM Sans',sans-serif;padding:7px 11px;border-radius:7px;cursor:pointer;background:rgba(245,241,230,.05);color:var(--ivory2);border:1px solid var(--riga2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}

  .testa{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px;}

  .torna:hover,.torna:focus-visible{background:rgba(201,162,75,.2);outline:none;}
  .finestra .rosso{background:var(--rosso);color:#fff;border-color:var(--rosso);} .finestra .rosso:disabled{opacity:.4;}
  .avanz-bar{height:8px;border-radius:4px;background:var(--riga2);overflow:hidden;} .avanz-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rosso),#f07a7e);transition:width .3s;}
  .finestra ul.via{margin:0;padding-left:18px;font-size:13px;color:var(--ivory2);max-height:160px;overflow:auto;}
  .testa h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:24px;} .testa h1 span{color:var(--oro);}

  .fin{border:1px solid var(--riga2);border-radius:12px;background:var(--navy2);overflow:hidden;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:calc(100vh - 150px);min-height:480px;}

  .percorso a{color:var(--ivory2);padding:4px 7px;border-radius:6px;cursor:pointer;border:1px dashed transparent;white-space:nowrap;}
  .percorso a:hover{color:var(--oro2);background:rgba(245,241,230,.05);} .percorso a.qui{color:var(--ivory);font-weight:700;}
  .percorso a.bersaglio{border-color:var(--oro);background:rgba(201,162,75,.14);} .percorso i{color:var(--fumo);font-style:normal;}
  .viste{display:inline-flex;border:1px solid var(--riga2);border-radius:8px;overflow:hidden;}
  .viste button{border:0;border-radius:0;padding:7px 10px;background:none;} .viste button+button{border-left:1px solid var(--riga2);}
  .viste button.on{background:var(--oro);color:#10131c;}
  .viste svg{width:16px;height:16px;display:block;}
  .fin-tb input[type=search]{height:32px;border-radius:8px;border:1px solid var(--riga2);background:var(--navy);color:var(--ivory);padding:0 10px;font:inherit;font-size:13px;width:190px;}
  .lato{border-right:1px solid var(--riga);overflow:auto;padding:10px 6px;background:rgba(0,0,0,.12);}
  .lato h3{font:700 10px/1 'Mazzard',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--fumo);margin:6px 8px 6px;}
  .lato a{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;color:var(--ivory2);cursor:pointer;font-size:13px;border:1px dashed transparent;}
  .lato a:hover{background:rgba(245,241,230,.06);} .lato a.on{background:var(--sel);color:var(--ivory);} .lato a.bersaglio{border-color:var(--oro);}
  .lato a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .lato a svg{flex:0 0 16px;width:16px;height:16px;}
  .lato hr{border:0;border-top:1px dashed var(--riga2);margin:6px 8px;}
  .corpo{overflow:auto;position:relative;outline:none;}
  .corpo.sopra{box-shadow:inset 0 0 0 3px var(--oro);}
  .stato{grid-column:1/-1;border-top:1px solid var(--riga);padding:6px 12px;font-size:12px;color:var(--fumo);display:flex;gap:14px;align-items:center;background:var(--pan);}
  .stato b{color:var(--ivory2);font-weight:600;}
  .vuoto{padding:40px;color:var(--fumo);text-align:center;}
  .ico-dir{width:100%;height:100%;display:grid;place-items:center;}

  .ico-est{font:800 11px/1 'Mazzard',sans-serif;color:var(--fumo);letter-spacing:.06em;}
  .ogg.scelto .etich{background:var(--oro);color:#10131c;}

  .icone .ogg.dir .miniatura{background:none;}
  .icone .ogg.scelto .miniatura{box-shadow:0 0 0 3px var(--sel);}
  .icone .etich{font-size:12.5px;line-height:1.25;text-align:center;padding:2px 6px;border-radius:5px;max-width:124px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .elenco tr.ogg.scelto td{background:var(--sel)!important;}
  .elenco tr.ogg.bersaglio td{outline:1px dashed var(--oro);}
  .elenco .nomec{display:flex;align-items:center;gap:7px;min-width:0;}
  .elenco .tri{width:14px;flex:0 0 14px;color:var(--fumo);cursor:pointer;text-align:center;font-size:10px;}
  .elenco .miniatura{width:34px;height:22px;border-radius:3px;background:#121317 center/cover no-repeat;flex:0 0 34px;display:grid;place-items:center;}
  .elenco .ogg.dir .miniatura{background:none;} .elenco .miniatura svg{width:20px;} .elenco .ico-est{font-size:8px;}
  .elenco .n{color:var(--ivory2);font-variant-numeric:tabular-nums;}
  /* COME COLONNE */
  .colonne{display:flex;height:100%;overflow-x:auto;}
  .col{flex:0 0 250px;border-right:1px solid var(--riga);overflow:auto;padding:4px 0;}
  .col .ogg{display:flex;align-items:center;gap:7px;padding:4px 10px;font-size:13px;cursor:default;user-select:none;white-space:nowrap;}
  .col .ogg span.nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .col .ogg.scelto{background:var(--sel);} .col .ogg.via{background:rgba(245,241,230,.08);}
  .col .miniatura{width:26px;height:18px;border-radius:3px;background:#121317 center/cover no-repeat;flex:0 0 26px;display:grid;place-items:center;} .col .ogg.dir .miniatura{background:none;} .col .miniatura svg{width:18px;} .col .ico-est{font-size:7px;}
  .col .fr{color:var(--fumo);font-size:10px;}

  .col.anteprima .grande{width:100%;aspect-ratio:16/10;border-radius:8px;background:#121317 center/contain no-repeat;display:grid;place-items:center;}
  .col.anteprima b{word-break:break-word;} .col.anteprima dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;color:var(--fumo);} .col.anteprima dd{color:var(--ivory2);}
  .col.anteprima .az{display:flex;gap:6px;flex-wrap:wrap;}

  .galleria{display:grid;grid-template-rows:minmax(0,1fr) auto auto;height:100%;}
  .galleria .palco{display:grid;place-items:center;padding:16px;min-height:0;}
  .galleria .palco .grande{max-width:100%;max-height:100%;aspect-ratio:16/9;height:100%;border-radius:8px;background:#0e0f12 center/contain no-repeat;display:grid;place-items:center;}
  .galleria .palco video{max-width:100%;max-height:100%;border-radius:8px;background:#000;}
  .galleria .didascalia{text-align:center;font-size:13px;color:var(--ivory2);padding:0 12px 8px;}
  .galleria .striscia{display:flex;gap:6px;overflow-x:auto;padding:10px;border-top:1px solid var(--riga);}
  .galleria .striscia .ogg{flex:0 0 96px;cursor:default;}
  .galleria .striscia .miniatura{width:96px;height:60px;border-radius:5px;background:#121317 center/cover no-repeat;display:grid;place-items:center;border:2px solid transparent;}

  .menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;border-radius:5px;padding:6px 10px;font-weight:500;color:var(--ivory);}
  .menu button:hover:not(:disabled){background:var(--oro);color:#10131c;} .menu button kbd{font:inherit;color:var(--fumo);font-size:11.5px;} .menu button:hover kbd{color:#10131c;}

  .finestra label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fumo);} .finestra .due{display:flex;gap:10px;} .finestra .due label{flex:1;}

  .scegli-dir{border:1px solid var(--riga2);border-radius:10px;max-height:340px;overflow:auto;}

  .ql{width:min(1200px,100%);background:#0e0f12;border-radius:12px;overflow:hidden;border:1px solid var(--riga2);}
  .ql video,.ql img{display:block;width:100%;max-height:78vh;object-fit:contain;background:#000;}
  .ql .info{display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:13px;} .ql .info b{flex:1;min-width:0;word-break:break-word;}
  .ql .non{padding:60px 20px;text-align:center;color:var(--fumo);}
  #carichi{position:fixed;right:16px;bottom:16px;z-index:120;width:340px;max-height:50vh;overflow:auto;background:var(--pan);border:1px solid rgba(201,162,75,.45);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  #carichi h4{font:700 10.5px/1 'Mazzard',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);display:flex;justify-content:space-between;}
  .car{font-size:12px;} .car b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;} .car small{color:var(--fumo);}
  .car .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 2px;} .car .bar i{display:block;height:100%;background:var(--oro);}
  .car.fatto .bar i{background:var(--ok);} .car.errore .bar i{background:var(--rosso);} .car.errore small{color:#F08A8D;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:220;background:#13141a;border:1px solid var(--oro);border-radius:10px;padding:11px 16px;max-width:620px;font-size:13px;color:var(--ivory2);box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .toast.err{border-color:var(--rosso);}
  @media (max-width:760px){ .fin{grid-template-columns:1fr;} .lato{display:none;} .elenco .c-tipo,.elenco .c-data{display:none;} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

  fetch(BASE + "commenti?conti=1", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { ELIM = !!j.elimina; }).catch(function () {});
  QUI = daIndirizzo(); carica(); $("corpo").focus();
})();
