<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contributo · Playout vMix</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  /* motore universale dei contributi: video, immagini, pagine web.
     Sfondo trasparente di default (overlay); un contributo pieno
     imposta bg nero dal payload. color-scheme:dark come gli altri motori. */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;overflow:hidden;
    opacity:0;transition:opacity .55s ease;
  }
  #stage.on{opacity:1;}
  #stage.out{opacity:0;transition:opacity .85s ease;}
  #stage.nero{background:#000;}

  #stage video,#stage img{width:100%;height:100%;object-fit:contain;display:block;}
  #stage.cover video,#stage.cover img{object-fit:cover;}
  #stage iframe{width:100%;height:100%;border:0;display:block;}
</style>
</head>
<body>

<div id="stage"></div>

<script>
(function () {
  "use strict";

  // dati: ?d=<b64 {k: video|img|web, src, fit: contain|cover, loop, mute, dur,
  //                 da, a,                       secondi: da dove parte, dove finisce
  //                 bg: nero|trasparente}>
  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return null;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return d && d.src ? d : null;
    } catch (err) { return null; }
  }

  var Q = new URLSearchParams(location.search);
  var STILL = Q.get("still") === "1";
  var MUTO = Q.get("muto") === "1";   // monitor e anteprime della console: mai audio
  var stage = document.getElementById("stage");
  var D = decodeData();

  if (!D) {
    // nessun dato o dati non validi: MEGLIO NIENTE che un contributo sbagliato in onda
    document.title = "CONTRIBUTO — dati non validi";
    stage.style.display = "none";
    return;
  }
  document.title = "CONTRIBUTO " + (D.k || "").toUpperCase();

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  if (D.bg !== "trasparente") stage.classList.add("nero");
  if (D.fit === "cover") stage.classList.add("cover");

  var el = null;

  if (D.k === "video") {
    el = document.createElement("video");
    el.src = D.src;
    el.playsInline = true;
    // Il loop lo governiamo noi quando c'e' un punto di fine: quello nativo
    // tornerebbe al fotogramma zero, non al punto d'inizio scelto.
    el.loop = !!D.loop && !D.a;
    el.muted = MUTO || !!D.mute;

    // ── da dove a dove ──────────────────────────────────────────────
    // Un contributo di due minuti da cui servono gli ultimi trenta secondi
    // non si taglia in montaggio: si dice al lettore dove partire e dove
    // fermarsi. Il file resta intero, cambia solo cosa si vede.
    var DA = Math.max(0, parseFloat(D.da) || 0);
    var A = Math.max(0, parseFloat(D.a) || 0);
    if (DA) {
      el.addEventListener("loadedmetadata", function () {
        try { el.currentTime = Math.min(DA, (el.duration || DA) - 0.05); } catch (e) {}
      }, { once: true });
    }
    if (A > DA) {
      el.addEventListener("timeupdate", function () {
        if (el.currentTime < A) return;
        if (D.loop) { try { el.currentTime = DA; } catch (e) {} return; }
        el.pause();                       // e resta sull'ultimo fotogramma, come a fine clip
      });
    }
    if (STILL) {
      // fermo-immagine per le anteprime: NON il frame 0 (spesso e' nero),
      // ma un fotogramma dentro la clip — 10% della durata, al massimo 2s
      el.preload = "auto";
      el.addEventListener("loadedmetadata", function () {
        // il fotogramma fermo va preso DENTRO il pezzo scelto, se ce n'e' uno
        var d0 = Math.max(0, parseFloat(D.da) || 0);
        var d1 = Math.max(0, parseFloat(D.a) || 0) || (el.duration || 5);
        var q = d0 + Math.min(2, (d1 - d0) * 0.1);
        try { el.currentTime = q || 0.5; } catch (e) {}
      });
      el.addEventListener("seeked", function () { el.pause(); });
      el.addEventListener("loadeddata", function () { el.pause(); });
    } else {
      el.autoplay = true;
      // niente "flashino" all'avvio: la scena resta invisibile finche' il
      // primo fotogramma non e' pronto da disegnare (poi appare in un soffio)
      stage.style.opacity = "0";
      stage.style.transition = "opacity .18s ease";
      var pronta = function () { stage.style.opacity = "1"; };
      el.addEventListener("canplay", pronta, { once: true });
      setTimeout(pronta, 1500);   // rete di sicurezza: mai restare invisibili
      // se l'autoplay con audio è bloccato (anteprime in Chrome), riparto muto
      var p = el.play ? el.play() : null;
      if (p && p.catch) p.catch(function () {
        // partire e' piu' importante che partire con l'audio: si mette il muto
        // e si parte. Ma subito dopo si riprova a toglierlo — il blocco vale
        // sull'AVVIO, non su un video che sta gia' andando, e in molti browser
        // (il vMix fra questi) da li' in poi l'audio torna. Se non torna resta
        // muto, che e' dove si era comunque.
        var loVolevo = !(MUTO || D.mute);
        el.muted = true;
        el.play().then(function () {
          if (!loVolevo) return;
          [200, 800, 2000].forEach(function (t) {
            setTimeout(function () { if (!el.paused) el.muted = false; }, t);
          });
        }).catch(function () {});
      });
      // a fine clip TENGO L'ULTIMO FRAME: si esce solo con Fuori onda dalla console
      if (!el.loop) el.addEventListener("ended", function () { el.pause(); });
      // se il documento parte nascosto (input non ancora a video), riparto appena visibile
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && el.paused && !el.ended) el.play().catch(function () {});
      });
    }
  } else if (D.k === "img") {
    el = document.createElement("img");
    el.src = D.src;
    el.alt = "";
  } else {
    el = document.createElement("iframe");
    el.src = D.src;
    el.setAttribute("allow", "autoplay; encrypted-media");
    el.setAttribute("allowtransparency", "true");

    // ── L'AUDIO DEI PLAYER INCORPORATI ──────────────────────────────
    // Il problema non e' il player: e' la regola dei browser, che non lasciano
    // partire da soli i video con l'audio acceso. Quindi si parte muti (se no
    // non parte niente) e appena il video E' AVVIATO gli si toglie il muto —
    // il divieto vale sull'avvio, non su un video che sta gia' andando.
    //
    // Con YouTube si usa la sua API vera invece di sparare messaggi alla cieca:
    // dice quando il player e' pronto e quando ha davvero cominciato, e li' il
    // comando arriva a destinazione. Prima insistevo a tempo sperando di
    // beccare il momento giusto.
    var voglioAudio = !STILL && !MUTO && !D.mute;
    var idYT = (String(D.src).match(/youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{6,})/) || [])[1];

    if (voglioAudio && idYT) {
      var acceso = false;
      window.__voceYT = function (p) {
        try {
          p.unMute();
          p.setVolume(100);
          acceso = !p.isMuted();
        } catch (e) {}
      };
      var partiYT = function () {
        try {
          // il riferimento resta a portata: serve per capire, dall'esterno, se
        // l'audio si e' davvero acceso — con prova-audio.html si controlla
        // dentro il vMix senza dover indovinare
        window.__playerYT = new YT.Player(el, {
            events: {
              onReady: function (e) { window.__voceYT(e.target); },
              onStateChange: function (e) {
                // 1 = sta suonando: e' il momento in cui il divieto non vale piu'
                if (e.data === 1 && !acceso) {
                  window.__voceYT(e.target);
                  setTimeout(function () { window.__voceYT(e.target); }, 400);
                }
              }
            }
          });
        } catch (e) {}
      };
      if (window.YT && window.YT.Player) setTimeout(partiYT, 0);
      else {
        window.onYouTubeIframeAPIReady = partiYT;
        var sc = document.createElement("script");
        sc.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(sc);
      }
    } else if (voglioAudio) {
      // Vimeo e il resto: non hanno un'API caricabile qui, si parla a messaggi
      var voce = function () {
        var w = el.contentWindow;
        if (!w) return;
        try {
          w.postMessage(JSON.stringify({ method: "setMuted", value: false }), "*");
          w.postMessage(JSON.stringify({ method: "setVolume", value: 1 }), "*");
        } catch (e) {}
      };
      el.addEventListener("load", function () {
        [300, 900, 1800, 3000].forEach(function (t) { setTimeout(voce, t); });
      });
    }
  }
  stage.appendChild(el);

  // Se il contributo non si carica, dirlo. Un riquadro nero in anteprima non
  // spiega niente e si scopre il perche' quando e' tardi: con un link che
  // arriva da fuori (Drive, un sito, un file spostato) sbagliare e' facile.
  // Il messaggio e' piccolo e in basso: se per disgrazia finisce in onda, e'
  // meno peggio di un buco nero, e in anteprima si legge benissimo.
  el.addEventListener("error", function () {
    var av = document.createElement("div");
    av.style.cssText = "position:absolute;left:0;right:0;bottom:6%;text-align:center;" +
      "font-family:'DM Sans',system-ui,sans-serif;font-size:26px;color:#FF9A9C;" +
      "text-shadow:0 2px 10px rgba(0,0,0,.9);padding:0 8%;line-height:1.4;";
    // Niente ipotesi sulla causa: la prima versione diceva "controlla la
    // condivisione" e mandava fuori strada chi il file lo aveva gia' condiviso.
    av.textContent = D.k === "video"
      ? "Video non caricato: il link non risponde, o quel sito non lascia riprodurre i suoi file altrove."
      : "Pagina non caricata: il link non risponde.";
    stage.appendChild(av);
  });

  // niente uscite automatiche: qualunque contributo resta sull'ultimo
  // frame finché la console non manda Fuori onda

  // niente requestAnimationFrame: in un documento nascosto non scatta mai
  setTimeout(function () { stage.classList.add("on"); }, 30);
})();
</script>
</body>
</html>
