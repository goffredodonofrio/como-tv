<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio (un vecchio segnalibro, un input vMix non aggiornato) comanderebbe
   un sistema che nessuno ascolta, e le grafiche non andrebbero in onda.
   Da GitHub si viene quindi portati sulla macchina giusta. Sulla VM questo
   non fa nulla. Se l'indirizzo della macchina cambia, va cambiato anche qui. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  var p = location.pathname.replace(/^\/como-tv/, "");
  location.replace("http://209.227.239.211" + p + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafica Live · Como TV</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  /* pagina TRASPARENTE: vMix mostra il programma quando non c'è grafica.
     La grafica vera vive dentro gli iframe dei motori: stesso file
     dell'anteprima → onda identica. color-scheme:dark allineato ai
     motori, altrimenti Chrome rende opachi gli iframe trasparenti. */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}

  /* Cinque livelli sovrapposti, come i canali overlay di vMix: ognuno vive per
     conto suo, quindi una grafica non ne scalza piu' un'altra. Il livello 1 sta
     sotto, il 5 sopra: scorebug in basso, schermate piene in alto. */
  .liv{position:absolute;inset:0;pointer-events:none;}

  /* DUE telai per livello. Il contenuto nuovo si carica in quello nascosto e
     compare solo quando ha gia' disegnato; poi i due si scambiano. Cosi' non
     esiste l'istante in cui un documento non ancora dipinto e' agganciato al
     livello in onda — era da li' che veniva il lampo bianco, la tela di base
     dell'iframe prima che il CSS della pagina entrasse in vigore. */
  .fr{
    position:absolute;inset:0;border:0;width:100%;height:100%;
    opacity:0;transition:opacity .55s ease;pointer-events:none;
    background:transparent;color-scheme:dark;
  }
  .fr.on{opacity:1;}
  .fr.muto{opacity:0!important;transition:none!important;}

  /* Le due parti del Live Match (scoreboard e schermata al centro) vivono
     qui dentro, ciascuna sul livello scelto in regia: cosi' una sola sorgente
     vMix porta tutto, grafiche e partita insieme. Sono trasparenti e non
     disegnano nulla finche' la regia non le manda in onda. */
  .mt{
    position:absolute;inset:0;border:0;width:100%;height:100%;
    pointer-events:none;background:transparent;color-scheme:dark;
  }
</style>
</head>
<body>

<div class="liv" style="z-index:1"><iframe class="fr muto" id="l1a" src="about:blank" allowtransparency="true"></iframe><iframe class="fr muto" id="l1b" src="about:blank" allowtransparency="true"></iframe></div>
<div class="liv" style="z-index:2"><iframe class="fr muto" id="l2a" src="about:blank" allowtransparency="true"></iframe><iframe class="fr muto" id="l2b" src="about:blank" allowtransparency="true"></iframe></div>
<div class="liv" style="z-index:3"><iframe class="fr muto" id="l3a" src="about:blank" allowtransparency="true"></iframe><iframe class="fr muto" id="l3b" src="about:blank" allowtransparency="true"></iframe></div>
<div class="liv" style="z-index:4"><iframe class="fr muto" id="l4a" src="about:blank" allowtransparency="true"></iframe><iframe class="fr muto" id="l4b" src="about:blank" allowtransparency="true"></iframe></div>
<div class="liv" style="z-index:5"><iframe class="fr muto" id="l5a" src="about:blank" allowtransparency="true"></iframe><iframe class="fr muto" id="l5b" src="about:blank" allowtransparency="true"></iframe></div>

<!-- Live Match: scoreboard e schermata al centro, ognuno sul suo livello -->
<iframe class="mt" id="mbug" src="about:blank" allowtransparency="true"></iframe>
<iframe class="mt" id="mcard" src="about:blank" allowtransparency="true"></iframe>

<script>
(function () {
  "use strict";

  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var POLL_MS = 1500;
  var NLIV = 5;
  var DISS = 550;    // durata della dissolvenza, allineata al CSS

  // canale playout: ogni vMix carica il SUO url (?c=1..7) e ascolta
  // solo la scaletta di quel canale
  var CANALE = (function () {
    var c = parseInt(new URLSearchParams(location.search).get("c"), 10);
    return (c >= 1 && c <= 7) ? c : 1;
  })();

  // stato di ogni livello: i due telai e quale dei due e' davanti
  var L = {};
  for (var i = 1; i <= NLIV; i++) {
    L[i] = { a: document.getElementById("l" + i + "a"),
             b: document.getElementById("l" + i + "b"),
             fronte: "a", gen: 0 };
  }
  var ultimo = {};        // playNonce gia' servito, livello per livello
  var primaVolta = true;

  function b64url(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  var ENGINES = {
    formazione: "formazione-vmix.html",
    classifica: "classifica-vmix.html",
    risultati:  "risultati-vmix.html",
    sottopancia: "sottopancia-vmix.html",
    sottopancia2: "sottopancia2-vmix.html",
    marcatori:  "marcatori-vmix.html",
    video:      "media-vmix.html",
    immagine:   "media-vmix.html",
    web:        "media-vmix.html"
  };

  function davanti(n) { return L[n].fronte === "a" ? L[n].a : L[n].b; }
  function dietro(n)  { return L[n].fronte === "a" ? L[n].b : L[n].a; }

  // Il documento ha davvero disegnato? 'load' non basta: dice che le risorse
  // ci sono. Un fotogramma della finestra figlia scatta quando sta per dipingere.
  function alPrimoDisegno(f, poi) {
    // Rete di sicurezza obbligatoria: requestAnimationFrame NON scatta in un
    // documento che il browser non sta disegnando (scheda nascosta, input non
    // in programma). Senza questo, in quei casi la grafica non comparirebbe
    // MAI — e in onda perdere una grafica e' peggio di un lampo.
    var fatto = false;
    function una() { if (fatto) return; fatto = true; poi(); }
    setTimeout(una, 400);
    var w = null;
    try { w = f.contentWindow; } catch (e) {}
    if (w && w.requestAnimationFrame) w.requestAnimationFrame(function () { w.requestAnimationFrame(una); });
    else requestAnimationFrame(function () { requestAnimationFrame(una); });
  }

  function spegni(f) { f.classList.add("muto"); f.classList.remove("on"); f.src = "about:blank"; }

  function play(n, j) {
    var st = L[n], back = dietro(n), front = davanti(n);
    var eng = ENGINES[j.tipo] || ENGINES.formazione;
    var mio = ++st.gen;
    back.classList.add("muto");
    back.classList.remove("on");
    back.style.zIndex = 2;      // il nuovo entra sopra il vecchio
    front.style.zIndex = 1;
    back.onload = function () {
      if (mio !== st.gen) return;
      if (back.src.indexOf("about:blank") >= 0) return;
      alPrimoDisegno(back, function () {
        if (mio !== st.gen) return;
        back.classList.remove("muto");
        void back.offsetWidth;   // senza il ricalcolo la dissolvenza non parte
        back.classList.add("on");
        front.classList.remove("on");          // dissolvenza incrociata
        setTimeout(function () {
          if (mio !== st.gen) return;
          spegni(front);
          st.fronte = (st.fronte === "a") ? "b" : "a";
        }, DISS + 150);
      });
    };
    back.src = eng + "?d=" + b64url(j.dati || {}) + "&n=" + j.playNonce;
  }

  function fadeOut(n) {
    var st = L[n], front = davanti(n);
    st.gen++;                                  // annulla un caricamento in arrivo
    front.classList.remove("muto");            // qui la dissolvenza SERVE
    front.classList.remove("on");
    setTimeout(function () { spegni(front); }, 900);
  }

  function clearNow(n) {
    var st = L[n];
    st.gen++;
    spegni(st.a); spegni(st.b);
  }

  // Applica lo stato di UN livello. Non tocca gli altri: e' tutto il punto.
  function applica(n, s) {
    if (!s || s.playNonce == null || s.playNonce === ultimo[n]) return;
    var prima = ultimo[n] === undefined;
    ultimo[n] = s.playNonce;
    if (prima && primaVolta && s.state !== "play") { clearNow(n); return; }
    if (s.state === "play" && s.dati) play(n, s);
    else if (s.state === "out") fadeOut(n);
    else clearNow(n);
  }


  // ── ricarica automatica ──────────────────────────────────────────
  // Questa pagina resta accesa per ore dentro vMix: senza questo
  // controllo continuerebbe a girare la versione caricata all'avvio,
  // anche dopo un aggiornamento del disegno. Il ponte dichiara la
  // versione delle pagine: se cambia, ci si ricarica da soli — ma mai
  // mentre qualcosa è in onda, per non far sparire una grafica.
  var verIniziale = null;
  function controllaVersione(j, inOnda) {
    if (!j || !j.ver) return;
    if (verIniziale === null) { verIniziale = j.ver; return; }
    if (j.ver === verIniziale) return;
    if (inOnda) return;               // si aspetta il fuori onda
    location.reload();
  }

  function tick() {
    fetch(PONTE + "?regia=1&canale=" + CANALE, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j) return;
        if (j.liv) {
          for (var n = 1; n <= NLIV; n++) applica(n, j.liv[n] || j.liv[String(n)]);
        } else {
          // ponte non ancora aggiornato: si comporta come prima, tutto sul
          // livello 1. Cosi' la pagina nuova funziona anche col ponte vecchio.
          applica(1, j);
        }
        primaVolta = false;
        var qualcosaInOnda = false;
        for (var k in ultimo) {
          var st = j.liv ? (j.liv[k] || j.liv[String(k)]) : j;
          if (st && st.state === "play") qualcosaInOnda = true;
        }
        controllaVersione(j, qualcosaInOnda);
      })
      .catch(function () {});
  }

  // ── Live Match dentro lo stesso playout ─────────────────────────────
  // Le due parti si montano una volta sola e restano lì: sono trasparenti
  // e si accendono da sole quando la regia le manda in onda. Qui si segue
  // soltanto il livello su cui stanno, per farle scorrere fra le grafiche.
  var mBug = document.getElementById("mbug");
  var mCard = document.getElementById("mcard");
  mBug.src = "partita-live.html?c=" + CANALE + "&solo=bug";
  mCard.src = "partita-live.html?c=" + CANALE + "&solo=card";
  mBug.style.zIndex = 2;
  mCard.style.zIndex = 4;

  function tickPartita() {
    fetch(PONTE + "?partita=1&canale=" + CANALE, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j) return;
        var lf = j.livFase || {};
        var card = (j.card !== undefined) ? (j.card || null)
                 : ((j.fase === "pres" || j.fase === "int" || j.fase === "fin") ? j.fase : null);
        mBug.style.zIndex = lf.live || 2;
        mCard.style.zIndex = (card && lf[card]) || 4;
      })
      .catch(function () {});
  }

  setInterval(tick, POLL_MS);
  tick();
  setInterval(tickPartita, POLL_MS);
  tickPartita();
})();
</script>
</body>
</html>
