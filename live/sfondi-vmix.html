<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sfondo bucato · Grafica vMix</title>
<style>
  /* ═════════════════════════════════════════════════════════════════
     SFONDO BUCATO — il fondo di casa dietro i box di vMix
     ═════════════════════════════════════════════════════════════════

     In regia i collegamenti stanno dentro due riquadri. Il fondo che
     ci sta dietro finora era una tinta: qui invece c'e' il fondo vero
     delle grafiche — il navy che respira e la polvere d'oro — e i
     riquadri sono BUCHI veri, trasparenti, non rettangoli neri. Cosi'
     vMix ci mette sotto le sorgenti e non serve incastrare niente:
     la pagina si mette sopra come overlay e i buchi sono gia' al
     posto giusto, al pixel.

     Le misure sono quelle dei layout della regia. Nei due 2BOX i
     riquadri prendono tutta la larghezza e quello che avanza — sedici
     pixel scarsi — e' lo spazio fra loro; in verticale stanno in mezzo.
     Si puo' cambiare tutto per indirizzo senza toccare il file:

       ?l=1    primo 2box   16:9 grande a sinistra, 3:4 a destra
       ?l=2    secondo 2box 3:4 a sinistra, 16:9 grande a destra
       ?l=3    terzo box    due 16:9 uguali
       &g=24   lo spazio fra i due riquadri
       &m=0    il margine ai lati (se c'e', lo spazio in mezzo si stringe)
       &y=-20  alza o abbassa i riquadri
       &r=18   angoli arrotondati dei buchi
       &t1=STUDIO &t2=COMO   le scritte sotto i due box (vuote = niente)
       &filo=1 un filo d'oro attorno ai buchi
       &monitor=scacchi   per guardarla senza vMix (come nel playout)
       &polvere=quieta|media|forte|buchi  quanta polvere (qui parte da "buchi")

     Il fondo pagina e' trasparente: in vMix va aggiunta come Web
     Browser input con la trasparenza accesa. */

  /* La riga che mancava, e che hanno tutte le altre grafiche. Quando una
     pagina non dichiara niente, il browser le mette dietro il suo fondo di
     riserva, che e' BIANCO: si vede dentro i buchi, nei monitor della
     regia e in vMix. Dicendo che la pagina e' scura il fondo di riserva
     diventa scuro, e sopra i telai trasparenti — il playout, i monitor —
     non si vede piu' niente di chiaro. E' la differenza fra questa pagina
     e il sottopancia, che questa riga ce l'ha dal primo giorno. */
  :root{color-scheme:dark;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}

  /* Lo stage non dipinge NIENTE: e' solo il telaio 1920x1080. Il fondo lo
     fanno le fasce attorno ai riquadri (.pezzo), una per una. Sembra un
     giro lungo e invece e' il punto di tutto: un buco fatto togliendo —
     una maschera, un ritaglio — passa dal compositore, e nel browser
     dentro vMix quel pezzo tolto torna bianco. Un buco fatto non
     dipingendo non puo' tornare niente, perche' li' non c'e' nessun
     elemento. E' come si comporta un sottopancia, che in vMix funziona da
     sempre: dipinge la pastiglia e basta. */
  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:transparent;
  }
  /* Una fascia di fondo. L'immagine e' quella dell'intero 1920x1080 —
     gradiente e aloni — spostata all'indietro di quanto la fascia e'
     lontana dall'angolo: cosi' le fasce sono finestre su uno stesso
     disegno e le giunture non si vedono. */
  .pezzo{position:absolute;overflow:hidden;background-repeat:no-repeat;background-size:1920px 1080px;
    background-image:
      radial-gradient(120% 90% at 8% 0%, rgba(28,48,110,.55), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);}
  /* Dentro la fascia ci sta il formato intero, spostato all'indietro: e' la
     finestra da cui si vedono gli aloni che derivano. Ogni fascia ha la sua
     copia, tutte inserite nello stesso istante, quindi respirano insieme e
     le giunture non si notano. Fuori dalla fascia non esce niente. */
  .dentro{position:absolute;width:1920px;height:1080px;pointer-events:none;}
  /* ── le scritte sotto i box ──────────────────────────────────────
     Stessa lingua del sottopancia, in piccolo: la barretta d'oro a
     sinistra, il pannello semitrasparente, il nome in Mazzard maiuscolo
     spaziato. Servono a dire dov'e' chi si vede nel riquadro — STUDIO,
     COMO, il posto dov'e' l'inviato — e stanno sotto al loro box,
     allineate al suo bordo sinistro come la barra del sottopancia sta al
     bordo del pannello. */
  .scritta{position:absolute;display:flex;align-items:stretch;opacity:0;
    animation:scrittaIn .55s cubic-bezier(.2,.7,.3,1) .35s forwards;}
  .scritta i{width:6px;flex:none;background:linear-gradient(180deg,#C9A24B 0%,#AC8C47 100%);}
  .scritta b{display:flex;align-items:center;padding:0 20px;font-family:'Mazzard',sans-serif;
    font-weight:800;font-size:26px;letter-spacing:4.4px;color:#F3EFE5;text-transform:uppercase;
    white-space:nowrap;
    background:linear-gradient(180deg,
      rgba(87,90,107,.85) 0%, rgba(62,66,84,.84) 17%,
      rgba(36,41,60,.82) 33%, rgba(40,44,63,.82) 70%, rgba(44,48,67,.82) 100%);}
  @keyframes scrittaIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

  /* il filo d'oro attorno al buco, quando lo si chiede */
  .filo{position:absolute;pointer-events:none;border:2px solid rgba(201,162,75,.55);
    box-shadow:0 0 22px rgba(201,162,75,.16);}
</style>
</head>
<body>

<div id="stage"><div id="fili"></div></div>

<!-- La polvere di casa cade su tutto il formato, ma qui i due terzi
     centrali sono buchi: nelle fasce ne arriva una manciata e non si vede.
     Quindi, se nessuno ha chiesto altro, questa grafica parte dalla
     taratura "buchi" — e' la stessa polvere, solo piu' fitta e piu' accesa,
     per avere nelle fasce la stessa aria che nelle altre grafiche si ha su
     tutto lo schermo. Va deciso PRIMA di caricare sfondo.js, che legge
     l'indirizzo appena parte. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.get("polvere")) {
    q.set("polvere", "buchi");
    try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (e) {}
  }
})();
</script>
<!-- prima la polvere, poi il disegno: serve la tela gia' in pagina -->
<script src="sfondo.js"></script>
<script>
(function () {
  "use strict";

  var Q = new URLSearchParams(location.search);
  // La regia manda le grafiche cosi': motore + "?d=" col pacchetto dentro.
  // Qui il pacchetto porta le stesse cose che si possono scrivere per
  // indirizzo, quindi si travasa nei parametri e il resto del file non
  // deve sapere da dove sono arrivate.
  (function () {
    var d = Q.get("d");
    if (!d) return;
    try {
      var j = JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g, "+").replace(/_/g, "/")))));
      Object.keys(j || {}).forEach(function (k) {
        if (j[k] !== "" && j[k] != null) Q.set(k, String(j[k]));
      });
    } catch (e) {}
  })();
  function num(k, d) { var v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; }

  var W = 1920, H = 1080;

  // I riquadri della regia, misurati da lei. Restano scritti qui in
  // chiaro: sono la cosa che deve combaciare, e vanno lette senza
  // aprire un foglio di calcolo.
  var LAYOUT = {
    "1": { nome: "Primo 2box",  box: [[1339.21, 753.31], [564.98, 753.31]] },
    "2": { nome: "Secondo 2box", box: [[564.98, 753.31], [1339.21, 753.31]] },
    "3": { nome: "Terzo box",   box: [[951.95, 535.47], [951.95, 535.47]] }
  };
  var L = LAYOUT[String(Q.get("l") || "1")] || LAYOUT["1"];
  document.title = "Sfondo bucato · " + L.nome;

  var m = num("m", 0);                       // margine ai lati
  var largTot = L.box.reduce(function (a, b) { return a + b[0]; }, 0);
  var g = num("g", W - 2 * m - largTot);     // quel che avanza sta in mezzo
  var r = num("r", 0);                       // angoli
  var dy = num("y", 0);                      // su e giu'

  var st = document.getElementById("stage");

  // dove finisce ogni riquadro
  var x = m, buchi = [];
  L.box.forEach(function (b, i) {
    var alt = b[1], y = (H - alt) / 2 + dy;
    buchi.push({ x: x, y: y, w: b[0], h: alt });
    x += b[0] + g;
  });

  // ── il fondo: le fasce attorno ai buchi ────────────────────────────
  // Si calcola il complemento dei riquadri: la fascia sopra, quella
  // sotto, e le strisce verticali fra e ai lati. Ogni fascia dipinge la
  // sua porzione dello stesso disegno. Dove ci sono i riquadri non viene
  // creato proprio niente: e' quello che rende il buco un buco anche nel
  // browser di vMix.
  var cima = Math.min.apply(null, buchi.map(function (b) { return b.y; }));
  var fondo = Math.max.apply(null, buchi.map(function (b) { return b.y + b.h; }));
  var fasce = [];
  if (cima > 0) fasce.push({ x: 0, y: 0, w: W, h: cima });
  if (fondo < H) fasce.push({ x: 0, y: fondo, w: W, h: H - fondo });
  // la banda dei riquadri, divisa dalle strisce verticali
  var ordinati = buchi.slice().sort(function (a2, b2) { return a2.x - b2.x; });
  var cur = 0;
  ordinati.forEach(function (b) {
    if (b.x > cur) fasce.push({ x: cur, y: cima, w: b.x - cur, h: fondo - cima });
    // un riquadro piu' basso della banda: sopra e sotto si dipinge
    if (b.y > cima) fasce.push({ x: b.x, y: cima, w: b.w, h: b.y - cima });
    if (b.y + b.h < fondo) fasce.push({ x: b.x, y: b.y + b.h, w: b.w, h: fondo - (b.y + b.h) });
    cur = b.x + b.w;
  });
  if (cur < W) fasce.push({ x: cur, y: cima, w: W - cur, h: fondo - cima });

  fasce.forEach(function (f) {
    if (f.w <= 0 || f.h <= 0) return;
    var d = document.createElement("div");
    d.className = "pezzo";
    d.style.left = f.x + "px"; d.style.top = f.y + "px";
    d.style.width = f.w + "px"; d.style.height = f.h + "px";
    d.style.backgroundPosition = (-f.x) + "px " + (-f.y) + "px";
    var dentro = document.createElement("div");
    dentro.className = "dentro";
    dentro.style.left = (-f.x) + "px";
    dentro.style.top = (-f.y) + "px";
    d.appendChild(dentro);
    st.appendChild(d);
    f.dentro = dentro;
  });

  // La polvere d'oro resta una tela sola su tutto il formato — e' gia'
  // trasparente dove non si disegna — ma dentro i riquadri non deve
  // cadere: si ritaglia il CONTESTO del canvas, che e' rasterizzazione
  // pura e non passa dal compositore. La tela di sfondo.js e' a meta'
  // risoluzione, quindi le misure si dimezzano.
  (function () {
    var tela = document.getElementById("polvere");
    if (!tela || !tela.getContext) return;
    var g2 = tela.getContext("2d");
    // prima si spazza: sfondo.js ha gia' disegnato un fotogramma appena
    // caricato, e quella polvere e' caduta anche dentro i riquadri. Dopo
    // il ritaglio non si potrebbe piu' togliere — la pulizia stessa
    // resterebbe fuori dal ritaglio — e resterebbe li' ferma per sempre.
    g2.clearRect(0, 0, tela.width, tela.height);
    g2.beginPath();
    g2.rect(0, 0, tela.width, tela.height);
    buchi.forEach(function (b) { g2.rect(b.x / 2, b.y / 2, b.w / 2, b.h / 2); });
    g2.clip("evenodd");
  })();

  // Gli aloni che respirano. Quello a schermo pieno di sfondo.js si
  // spegne — coprirebbe anche i buchi — e al suo posto ogni fascia riceve
  // una copia dello stesso gruppo, messa al posto giusto dentro la sua
  // finestra. Le copie entrano tutte nello stesso istante, quindi le
  // animazioni partono insieme e restano in fase: da fascia a fascia il
  // disegno continua senza salti.
  (function () {
    var al = document.getElementById("aloni");
    if (!al) return;
    al.style.display = "none";
    fasce.forEach(function (f) {
      if (!f.dentro) return;
      var copia = al.cloneNode(true);
      copia.style.display = "";
      f.dentro.appendChild(copia);
    });
  })();

  // le scritte: stanno DENTRO lo stage, sotto il buco, dove il ritaglio
  // tiene tutto. Vuote non si disegnano — una pastiglia senza parole in
  // onda e' solo un rettangolo grigio.
  buchi.forEach(function (b, i) {
    var t = String(Q.get("t" + (i + 1)) || "").trim();
    if (!t) return;
    var d = document.createElement("div");
    d.className = "scritta";
    // non attaccata al bordo: il sottopancia sta a 129 dal bordo dello
    // schermo per lo stesso motivo, e il primo riquadro qui comincia a
    // zero — la scritta finirebbe incollata al lato
    d.style.left = (b.x + 26) + "px";
    d.style.top = (b.y + b.h + 26) + "px";
    d.style.height = "54px";
    d.innerHTML = '<i></i><b></b>';
    d.querySelector("b").textContent = t;
    st.appendChild(d);
  });

  // il filo d'oro, se lo si chiede: sta FUORI dallo stage, altrimenti il
  // ritaglio se lo mangerebbe insieme al resto — e il filo deve stare
  // proprio sul bordo del buco
  if (Q.get("filo") === "1") {
    var f = document.createElement("div");
    f.style.cssText = "position:absolute;left:0;top:0;width:" + W + "px;height:" + H + "px;pointer-events:none;";
    f.innerHTML = buchi.map(function (b) {
      return '<i class="filo" style="left:' + (b.x - 1) + 'px;top:' + (b.y - 1) + 'px;width:' +
             (b.w + 2) + 'px;height:' + (b.h + 2) + 'px;' + (r ? 'border-radius:' + (r + 1) + 'px;' : '') + '"></i>';
    }).join("");
    document.body.appendChild(f);
  }

  // ── guardarla senza vMix ────────────────────────────────────────────
  // Stessa convenzione del playout: ?monitor=scacchi mette la scacchiera
  // sotto, ?monitor=1 un grigio da monitor. Senza il parametro non
  // cambia niente e il fondo pagina resta trasparente, che e' quello che
  // serve in onda. La pagina aperta nel browser SENZA monitor sembra
  // bianca dentro i buchi: e' il browser che dipinge bianco dietro, non
  // la grafica.
  (function () {
    var m = Q.get("monitor");
    if (!m) return;
    var b = document.body.style;
    if (m === "scacchi") {
      b.backgroundColor = "#8A8B96";
      b.backgroundImage =
        "linear-gradient(45deg,rgba(0,0,0,.22) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.22) 75%)," +
        "linear-gradient(45deg,rgba(0,0,0,.22) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.22) 75%)";
      b.backgroundSize = "56px 56px";
      b.backgroundPosition = "0 0, 28px 28px";
    } else b.background = "#12141A";
  })();

  // I riquadri finti con la misura scritta servono a far vedere dove
  // cadono i buchi, e si accendono SOLO se l'indirizzo lo chiede.
  //
  // Erano legati allo stare dentro un telaio, che sembrava piu' prudente:
  // era la trappola. I monitor della regia e il playout che va in vMix
  // sono telai anche loro, quindi i riquadri finti comparivano proprio
  // dove non dovevano — ed erano loro, quel "bianco" dentro i box. La
  // pagina di scelta chiede prova=1 di suo; il pacchetto che la regia
  // manda non lo porta e non puo' portarlo.
  if (Q.get("prova") === "1") {
    var sotto = document.createElement("div");
    sotto.id = "prova";
    sotto.style.cssText = "position:absolute;left:50%;top:50%;width:" + W + "px;height:" + H +
      "px;transform-origin:center center;z-index:-1;";
    sotto.innerHTML = buchi.map(function (b, i) {
      var rap = (b.w / b.h > 1.5) ? "16:9" : "3:4";
      return '<div style="position:absolute;left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w +
        'px;height:' + b.h + 'px;' + (r ? 'border-radius:' + r + 'px;' : '') +
        'overflow:hidden;background:' +
        'repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 22px, rgba(255,255,255,0) 22px 44px),' +
        'linear-gradient(160deg,#4a5570,#2b3145 60%,#1d2233);' +
        'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;' +
        'font-family:Mazzard,system-ui,sans-serif;color:rgba(245,241,230,.62)">' +
        '<svg width="86" height="86" viewBox="0 0 86 86" fill="none">' +
          '<circle cx="43" cy="43" r="41" stroke="rgba(245,241,230,.45)" stroke-width="3"/>' +
          '<path d="M35 28l26 15-26 15z" fill="rgba(245,241,230,.5)"/></svg>' +
        '<div style="font-size:30px;font-weight:800;letter-spacing:.14em">BOX ' + (i + 1) + ' \u00b7 ' + rap + '</div>' +
        '<div style="font-size:22px;letter-spacing:.06em;color:rgba(245,241,230,.42)">' +
          b.w.toFixed(2).replace(".", ",") + " \u00d7 " + b.h.toFixed(2).replace(".", ",") + '</div>' +
      '</div>';
    }).join("");
    document.body.appendChild(sotto);
  }

  // la pagina sta in un 1920x1080 e si adatta alla finestra, come le altre
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    st.style.transform = "translate(-50%,-50%) scale(" + s + ")";
    // il filo d'oro e i riquadri di prova stanno fuori dallo stage: si
    // scalano insieme a lui, o si scollerebbero dai buchi
    [].forEach.call(document.querySelectorAll("body > div:not(#stage)"), function (f2) {
      f2.style.position = "absolute"; f2.style.left = "50%"; f2.style.top = "50%";
      f2.style.transformOrigin = "center center";
      f2.style.transform = "translate(-50%,-50%) scale(" + s + ")";
    });
  }
  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
