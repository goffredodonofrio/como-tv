<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formazione Premium · vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(28,48,110,.5), transparent 55%),
      radial-gradient(90% 70% at 50% 110%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);}

  /* ── testata: stemma, nome, modulo ── */
  #logo{position:absolute;left:110px;top:70px;width:150px;height:150px;object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));opacity:0;}
  #team{position:absolute;left:286px;top:86px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:66px;letter-spacing:.01em;color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #modulo{position:absolute;left:290px;top:172px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:30px;letter-spacing:.32em;color:#C9A24B;opacity:0;}
  #occh{position:absolute;left:290px;top:172px;font-family:'Mazzard',sans-serif;font-weight:700;
    font-size:22px;letter-spacing:.24em;color:rgba(245,241,230,.6);text-transform:uppercase;opacity:0;}

  /* ── il campo ── */
  #pitch{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;}

  /* ── card giocatore ── */
  .pcard{position:absolute;transform:translate(-50%,-50%) translateY(24px);opacity:0;}
  .pcard.in{animation:cardIn .5s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes cardIn{to{opacity:1;transform:translate(-50%,-50%) translateY(0);}}

  /* variante CARD: pillola col numero grande e cognome */
  .vcard .box{width:150px;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg, rgba(30,44,96,.96), rgba(14,22,52,.97));
    box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(201,162,75,.28);}
  .vcard .num{font-family:'Mazzard',sans-serif;font-weight:800;font-size:54px;line-height:1;
    color:#F5F1E6;text-align:center;padding:16px 0 12px;letter-spacing:.02em;}
  .vcard .nome{background:rgba(201,162,75,.16);border-top:1px solid rgba(201,162,75,.3);
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:17px;letter-spacing:.06em;
    color:#F5F1E6;text-transform:uppercase;text-align:center;padding:8px 6px 9px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .vcard .nome small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;
    letter-spacing:.02em;color:rgba(245,241,230,.6);text-transform:none;margin-top:1px;}

  /* variante FOTO: la foto del giocatore nella card */
  .vfoto .box{width:172px;border-radius:16px 16px 14px 14px;overflow:hidden;position:relative;
    background:linear-gradient(180deg, rgba(30,44,96,.5), rgba(14,22,52,.92));
    box-shadow:0 16px 38px rgba(0,0,0,.55), inset 0 0 0 1px rgba(201,162,75,.32);}
  .vfoto .foto{width:100%;height:196px;position:relative;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 18%, rgba(46,64,120,.5), rgba(12,18,44,.2));}
  .vfoto .foto img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    height:210px;width:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
  .vfoto .foto .velo{position:absolute;left:0;right:0;bottom:0;height:50%;
    background:linear-gradient(0deg, rgba(14,22,52,.96), transparent);}
  .vfoto .foto .np{position:absolute;left:12px;top:10px;font-family:'Mazzard',sans-serif;
    font-weight:800;font-size:38px;color:#C9A24B;text-shadow:0 3px 10px rgba(0,0,0,.6);}
  .vfoto .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:18px;letter-spacing:.05em;
    color:#F5F1E6;text-transform:uppercase;text-align:center;padding:2px 6px 12px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .vfoto .nome small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;
    letter-spacing:.02em;color:rgba(245,241,230,.6);text-transform:none;margin-top:1px;}

  /* ── panchina laterale (compare se c'è) ── */
  #panca{position:absolute;right:58px;top:150px;width:352px;opacity:0;}
  #panca.in{animation:pancaIn .6s ease .5s forwards;}
  @keyframes pancaIn{to{opacity:1;}}
  #panca h3{font-family:'Mazzard',sans-serif;font-weight:800;font-size:20px;letter-spacing:.2em;
    color:#C9A24B;text-transform:uppercase;padding-bottom:12px;margin-bottom:10px;
    border-bottom:1px solid rgba(201,162,75,.35);}
  #panca .pr{display:flex;align-items:baseline;gap:12px;padding:7px 0;
    border-bottom:1px solid rgba(245,241,230,.07);}
  #panca .pr b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:18px;color:#C9A24B;
    min-width:34px;font-variant-numeric:tabular-nums;}
  #panca .pr span{font-family:'DM Sans',sans-serif;font-weight:500;font-size:17px;color:#F5F1E6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #panca .pr span i{color:rgba(245,241,230,.6);font-style:normal;}
  /* lo stemma grande, filigrana dietro la panchina */
  #pancastemma{position:absolute;right:40px;bottom:60px;width:340px;height:340px;object-fit:contain;
    opacity:.06;filter:grayscale(.2);}

  #allen{position:absolute;left:110px;bottom:56px;font-family:'DM Sans',sans-serif;
    font-weight:500;font-size:24px;letter-spacing:.06em;color:rgba(245,241,230,.82);opacity:0;}
  #allen b{font-family:'Mazzard',sans-serif;font-weight:800;color:#F5F1E6;letter-spacing:.02em;}
  #allen span{color:#C9A24B;text-transform:uppercase;font-family:'Mazzard',sans-serif;font-weight:700;
    font-size:15px;letter-spacing:.2em;margin-right:12px;}

  @keyframes fadeIn{to{opacity:1;}}
  @keyframes daSx{to{clip-path:inset(0 0 0 0);}}
</style>
</head>
<body>

<div id="stage">
  <img id="logo" alt="">
  <div id="team"></div>
  <div id="modulo"></div>
  <div id="occh"></div>
  <div id="pitch"></div>
  <div id="panca"><img id="pancastemma" alt=""><h3>Panchina</h3><div id="pancarighe"></div></div>
  <div id="allen"></div>
</div>

<script>
(function () {
  "use strict";

  // Payload IDENTICO al motore standard, con due extra:
  //   pv : "card" | "foto"  (variante premium; default "card")
  //   le foto della variante "foto" arrivano dal magazzino come
  //   foto-premium-<numero>.png  (o dal campo t come 4° elemento).
  var DEMO = {
    n: "Como 1907", m: "4-3-3", k: "#1735C8", pv: "foto",
    l: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png",
    a: ["Cesc", "Fabregas"],
    t: [["1","Jean","Butez","/loghi/foto-premium-01.png"],
        ["2","Marc-Oliver","Kempf","/loghi/foto-premium-02.png"],
        ["18","Edoardo","Goldaniga","/loghi/foto-premium-03.png"],
        ["3","Álex","Valle","/loghi/foto-premium-04.png"],
        ["99","Trevoh","Chalobah","/loghi/foto-premium-05.png"],
        ["6","Luis","Milla","/loghi/foto-premium-06.png"],
        ["8","Maxence","Caqueret","/loghi/foto-premium-01.png"],
        ["7","Lucas","Da Cunha","/loghi/foto-premium-02.png"],
        ["23","Álvaro","Morata","/loghi/foto-premium-03.png"],
        ["19","Nicolas","Kühn","/loghi/foto-premium-04.png"],
        ["9","Anastasios","Douvikas","/loghi/foto-premium-05.png"]],
    p: [["12","Emil","Audero"],["10","Nico","Paz"],["90","Ivan","Azón"],
        ["11","Assane","Diao"],["30","Mattia","Liberali"]]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.t && d.t.length) ? d : null;
    } catch (e) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  // la variante si puo' forzare da URL (?v=card|foto) per il confronto rapido
  var vURL = (new URLSearchParams(location.search).get("v") || "").toLowerCase();

  var D = decodeData();
  if (!D) { document.title = "PREMIUM — dati non validi"; document.getElementById("stage").style.display = "none"; return; }
  var VAR = (vURL === "card" || vURL === "foto") ? vURL : (D.pv === "foto" ? "foto" : "card");
  document.title = "FORMAZIONE PREMIUM " + (D.n || "").toUpperCase();

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function el(id){return document.getElementById(id);}
  function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);el("stage").style.transform="translate(-50%,-50%) scale("+s+")";}
  window.addEventListener("resize",fit); fit();

  // ── testata ──
  if (D.l) { var lg = el("logo"); lg.src = D.l; lg.onerror=function(){lg.style.display="none";}; }
  el("team").textContent = (D.n || "").toUpperCase();
  (function () {   // il nome resta nella colonna sinistra, non entra in campo
    var t = el("team"), MAX = 806 - 286 - 24;
    if (t.scrollWidth > MAX) t.style.fontSize = Math.max(30, Math.floor(66 * MAX / t.scrollWidth)) + "px";
    var fs = parseFloat(getComputedStyle(t).fontSize);
    el("modulo").style.top = el("occh").style.top = (86 + Math.round(fs * 1.4)) + "px";
  })();
  el("modulo").textContent = D.m || "";

  // ── slotGeo: stessa geometria del motore standard ──
  function slotGeo(mod) {
    var lines = [1].concat(String(mod || "4-3-3").split("-").map(Number));
    // con la panchina laterale il campo si stringe, così le card di destra
    // non finiscono sotto al pannello
    var conPanca = D.p && D.p.length;
    var out = [], L = 806, R = conPanca ? 1500 : 1856, yGK = 900, nOut = lines.length - 1;
    lines.forEach(function (n, li) {
      var y = li === 0 ? yGK : (700 - (li - 1) * (nOut > 1 ? (700 - 210) / (nOut - 1) : 0));
      for (var k = 0; k < n; k++) {
        var x = L + 40 + (k + 1) / (n + 1) * (R - L - 80);
        var off = 0;
        if (li > 0 && n > 1) {
          var dist = Math.min(k, n - 1 - k), sign = (dist % 2 === 0) ? -1 : 1;
          if (li === lines.length - 1) sign = -sign;
          off = sign * 30;
        }
        out.push({ x: x, y: y + off });
      }
    });
    return out;
  }

  // ── le card in campo ──
  var geo = slotGeo(D.m);
  var pitch = el("pitch");
  var h = "";
  D.t.slice(0, geo.length).forEach(function (r, i) {
    var g = geo[i];
    var num = r[0] || "", nome = r[1] || "", cognome = r[2] || "";
    var foto = r[3] || ("/loghi/foto-premium-" + num + ".png");
    var box;
    if (VAR === "foto") {
      box = '<div class="box">' +
        '<div class="foto"><span class="np">' + esc(num) + '</span>' +
        '<img src="' + esc(foto) + '" onerror="this.style.display=\'none\'">' +
        '<span class="velo"></span></div>' +
        '<div class="nome">' + esc(cognome) + (nome ? '<small>' + esc(nome) + '</small>' : '') + '</div></div>';
    } else {
      box = '<div class="box"><div class="num">' + esc(num) + '</div>' +
        '<div class="nome">' + esc(cognome) + (nome ? '<small>' + esc(nome) + '</small>' : '') + '</div></div>';
    }
    var cls = "pcard " + (VAR === "foto" ? "vfoto" : "vcard");
    var stile = STILL ? "opacity:1;transform:translate(-50%,-50%)" : "";
    h += '<div class="' + cls + (STILL ? "" : " in") + '" style="left:' + g.x + 'px;top:' + g.y + 'px;' + stile +
         (STILL ? "" : ';animation-delay:' + (0.15 + i * 0.07).toFixed(2) + 's') + '">' + box + '</div>';
  });
  pitch.innerHTML = h;

  // ── panchina laterale ──
  if (D.p && D.p.length) {
    var pr = "";
    D.p.slice(0, 9).forEach(function (r) {
      pr += '<div class="pr"><b>' + esc(r[0] || "") + '</b><span>' + esc(r[2] || "") +
            (r[1] ? ' <i>' + esc(r[1]) + '</i>' : '') + '</span></div>';
    });
    el("pancarighe").innerHTML = pr;
    if (D.l) { var ps = el("pancastemma"); ps.src = D.l; ps.onerror=function(){ps.style.display="none";}; }
  } else { el("panca").style.display = "none"; }

  // ── allenatore ──
  if (D.a && (D.a[0] || D.a[1])) {
    el("allen").innerHTML = '<span>Allenatore</span> <b>' + esc([D.a[0], D.a[1]].filter(Boolean).join(" ")) + '</b>';
  }

  // ── animazioni d'ingresso ──
  if (STILL) {
    el("logo").style.opacity = 1;
    el("team").style.clipPath = "inset(0 0 0 0)";
    el("modulo").style.opacity = el("allen").style.opacity = 1;
    el("panca").style.opacity = 1;
  } else {
    el("logo").style.animation = "fadeIn .6s ease .15s forwards";
    el("team").style.animation = "daSx .7s cubic-bezier(.2,.7,.3,1) .3s forwards";
    el("modulo").style.animation = "fadeIn .5s ease .6s forwards";
    el("allen").style.animation = "fadeIn .6s ease .9s forwards";
    el("panca").classList.add("in");
  }

  document.addEventListener("dblclick", function(){ location.reload(); });
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
