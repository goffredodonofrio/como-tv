<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formazione Premium · vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(28,48,110,.5), transparent 55%),
      radial-gradient(90% 70% at 50% 110%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);}

  /* sigla squadra ripetuta in filigrana, come la reference */
  #tile{position:absolute;inset:0;pointer-events:none;overflow:hidden;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:150px;letter-spacing:.06em;
    color:rgba(245,241,230,.028);line-height:1.15;white-space:nowrap;opacity:0;
    transform:rotate(-8deg) scale(1.4);transform-origin:center;}

  /* ── testata ── */
  #logo{position:absolute;left:110px;top:66px;width:150px;height:150px;object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));opacity:0;}
  #team{position:absolute;left:286px;top:82px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:66px;letter-spacing:.01em;color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #modulo{position:absolute;left:290px;top:168px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:30px;letter-spacing:.32em;color:#C9A24B;opacity:0;}

  #pitch{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;}

  /* card piccola (in campo) — lo stato finale */
  .pcard{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s ease;}
  .vcard .box{width:150px;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg, rgba(30,44,96,.96), rgba(14,22,52,.97));
    box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(201,162,75,.28);}
  .vcard .num{font-family:'Mazzard',sans-serif;font-weight:800;font-size:52px;line-height:1;
    color:#F5F1E6;text-align:center;padding:15px 0 11px;}
  .vcard .nome{background:rgba(201,162,75,.16);border-top:1px solid rgba(201,162,75,.3);
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:17px;letter-spacing:.06em;
    color:#F5F1E6;text-transform:uppercase;text-align:center;padding:8px 6px 9px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .vcard .nome small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;
    color:rgba(245,241,230,.6);text-transform:none;margin-top:1px;}
  .vfoto .box{width:168px;border-radius:16px 16px 14px 14px;overflow:hidden;position:relative;
    background:linear-gradient(180deg, rgba(30,44,96,.5), rgba(14,22,52,.92));
    box-shadow:0 16px 38px rgba(0,0,0,.55), inset 0 0 0 1px rgba(201,162,75,.32);}
  .vfoto .foto{width:100%;height:190px;position:relative;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 18%, rgba(46,64,120,.5), rgba(12,18,44,.2));}
  .vfoto .foto img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:204px;width:auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
  .vfoto .foto .velo{position:absolute;left:0;right:0;bottom:0;height:50%;
    background:linear-gradient(0deg, rgba(14,22,52,.96), transparent);}
  .vfoto .foto .np{position:absolute;left:12px;top:8px;font-family:'Mazzard',sans-serif;
    font-weight:800;font-size:36px;color:#C9A24B;text-shadow:0 3px 10px rgba(0,0,0,.6);}
  .vfoto .nome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:18px;letter-spacing:.05em;
    color:#F5F1E6;text-transform:uppercase;text-align:center;padding:2px 6px 11px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .vfoto .nome small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;
    color:rgba(245,241,230,.6);text-transform:none;margin-top:1px;}

  /* ── RIBALTA: il reparto grande in primo piano ── */
  #ribalta{position:absolute;left:0;right:0;top:340px;height:520px;
    display:flex;align-items:center;justify-content:center;gap:26px;pointer-events:none;}
  .bigcard{width:250px;opacity:0;transform:translateY(60px) scale(.94);
    border-radius:20px;overflow:hidden;position:relative;
    background:linear-gradient(180deg, rgba(34,50,110,.72), rgba(12,20,48,.96));
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1.5px rgba(201,162,75,.5);}
  .bigcard.in{animation:bigIn .55s cubic-bezier(.2,.75,.3,1) forwards;}
  .bigcard.out{animation:bigOut .4s ease forwards;}
  @keyframes bigIn{to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes bigOut{to{opacity:0;transform:translateY(-40px) scale(.96);}}
  .bigcard .bfoto{width:100%;height:330px;position:relative;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 12%, rgba(52,72,140,.6), rgba(12,18,44,.2));}
  .bigcard .bfoto img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:352px;width:auto;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));}
  .bigcard .bfoto .bvelo{position:absolute;left:0;right:0;bottom:0;height:46%;
    background:linear-gradient(0deg, rgba(12,20,48,.96), transparent);}
  .bigcard .bnum{position:absolute;left:18px;top:12px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:104px;line-height:.8;color:#F5F1E6;text-shadow:0 6px 20px rgba(0,0,0,.6);letter-spacing:-.02em;}
  .bigcard .bchi{padding:6px 16px 20px;text-align:center;}
  .bigcard .bcog{font-family:'Mazzard',sans-serif;font-weight:800;font-size:30px;letter-spacing:.03em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05;}
  .bigcard .bnom{font-family:'DM Sans',sans-serif;font-weight:500;font-size:16px;letter-spacing:.04em;
    color:rgba(245,241,230,.66);margin-top:2px;}
  .bigcard .bfilo{margin:10px auto 0;width:70%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(201,162,75,.85),transparent);}

  /* etichetta reparto verticale a destra */
  #reparto{position:absolute;right:-30px;top:50%;transform:translateY(-50%) rotate(90deg);
    transform-origin:center;font-family:'Mazzard',sans-serif;font-weight:800;font-size:92px;
    letter-spacing:.04em;color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  #reparto.in{animation:repIn .5s cubic-bezier(.2,.7,.3,1) forwards;}
  #reparto.out{animation:repOut .35s ease forwards;}
  @keyframes repIn{from{opacity:0;transform:translateY(-50%) translateX(60px) rotate(90deg);}
    to{opacity:1;transform:translateY(-50%) translateX(0) rotate(90deg);}}
  @keyframes repOut{to{opacity:0;transform:translateY(-50%) translateX(-40px) rotate(90deg);}}

  /* ── panchina ── */
  #panca{position:absolute;right:58px;top:150px;width:352px;opacity:0;}
  #panca.in{animation:pancaIn .6s ease forwards;}
  @keyframes pancaIn{to{opacity:1;}}
  #panca h3{font-family:'Mazzard',sans-serif;font-weight:800;font-size:20px;letter-spacing:.2em;
    color:#C9A24B;text-transform:uppercase;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid rgba(201,162,75,.35);}
  #panca .pr{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid rgba(245,241,230,.07);}
  #panca .pr b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:18px;color:#C9A24B;min-width:34px;font-variant-numeric:tabular-nums;}
  #panca .pr span{font-family:'DM Sans',sans-serif;font-weight:500;font-size:17px;color:#F5F1E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #panca .pr span i{color:rgba(245,241,230,.6);font-style:normal;}
  #pancastemma{position:absolute;right:40px;bottom:60px;width:340px;height:340px;object-fit:contain;opacity:.06;}

  #allen{position:absolute;left:110px;bottom:52px;font-family:'DM Sans',sans-serif;font-weight:500;
    font-size:24px;letter-spacing:.06em;color:rgba(245,241,230,.82);opacity:0;}
  #allen b{font-family:'Mazzard',sans-serif;font-weight:800;color:#F5F1E6;}
  #allen span{color:#C9A24B;text-transform:uppercase;font-family:'Mazzard',sans-serif;font-weight:700;
    font-size:15px;letter-spacing:.2em;margin-right:12px;}

  @keyframes fadeIn{to{opacity:1;}}
  @keyframes daSx{to{clip-path:inset(0 0 0 0);}}
</style>
</head>
<body>

<div id="stage">
  <div id="tile"></div>
  <img id="logo" alt="">
  <div id="team"></div>
  <div id="modulo"></div>
  <div id="pitch"></div>
  <div id="ribalta"></div>
  <div id="reparto"></div>
  <div id="panca"><img id="pancastemma" alt=""><h3>Panchina</h3><div id="pancarighe"></div></div>
  <div id="allen"></div>
</div>

<script>
(function () {
  "use strict";

  var DEMO = {
    n: "Como 1907", m: "4-3-3", k: "#1735C8", pv: "foto",
    l: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png",
    a: ["Cesc", "Fabregas"],
    t: [["1","Jean","Butez","/loghi/foto-premium-01.png"],
        ["2","Marc-Oliver","Kempf","/loghi/foto-premium-02.png"],
        ["18","Edoardo","Goldaniga","/loghi/foto-premium-03.png"],
        ["3","Álex","Valle","/loghi/foto-premium-04.png"],
        ["99","Trevoh","Chalobah","/loghi/foto-premium-05.png"],
        ["6","Luis","Milla","/loghi/foto-premium-06.png"],
        ["8","Maxence","Caqueret","/loghi/foto-premium-01.png"],
        ["7","Lucas","Da Cunha","/loghi/foto-premium-02.png"],
        ["23","Álvaro","Morata","/loghi/foto-premium-03.png"],
        ["19","Nicolas","Kühn","/loghi/foto-premium-04.png"],
        ["9","Anastasios","Douvikas","/loghi/foto-premium-05.png"]],
    p: [["12","Emil","Audero"],["10","Nico","Paz"],["90","Ivan","Azón"],
        ["11","Assane","Diao"],["30","Mattia","Liberali"]]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.t && d.t.length) ? d : null;
    } catch (e) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var vURL = (new URLSearchParams(location.search).get("v") || "").toLowerCase();

  var D = decodeData();
  if (!D) { document.title = "PREMIUM — dati non validi"; document.getElementById("stage").style.display = "none"; return; }
  var VAR = (vURL === "card" || vURL === "foto") ? vURL : (D.pv === "foto" ? "foto" : "card");
  document.title = "FORMAZIONE PREMIUM " + (D.n || "").toUpperCase();

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function el(id){return document.getElementById(id);}
  function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);el("stage").style.transform="translate(-50%,-50%) scale("+s+")";}
  window.addEventListener("resize",fit); fit();

  // sigla per la filigrana di sfondo
  var sigla = (D.n || "COMO").replace(/[^A-Za-zÀ-ÿ ]/g,"").trim().split(/\s+/)[0].slice(0,4).toUpperCase();
  (function(){ var riga = (sigla + " ").repeat(9); el("tile").innerHTML = (riga + "<br>").repeat(9); })();

  // ── testata ──
  if (D.l) { var lg = el("logo"); lg.src = D.l; lg.onerror=function(){lg.style.display="none";}; }
  el("team").textContent = (D.n || "").toUpperCase();
  (function () {
    var t = el("team"), MAX = 806 - 286 - 24;
    if (t.scrollWidth > MAX) t.style.fontSize = Math.max(30, Math.floor(66 * MAX / t.scrollWidth)) + "px";
    el("modulo").style.top = (82 + Math.round(parseFloat(getComputedStyle(t).fontSize) * 1.35)) + "px";
  })();
  el("modulo").textContent = D.m || "";

  // ── geometria del campo (linee del modulo) ──
  var conPanca = D.p && D.p.length;
  function slotGeo(mod) {
    var lines = [1].concat(String(mod || "4-3-3").split("-").map(Number));
    var out = [], L = 806, R = conPanca ? 1500 : 1856, yGK = 902, nOut = lines.length - 1;
    lines.forEach(function (n, li) {
      var y = li === 0 ? yGK : (708 - (li - 1) * (nOut > 1 ? (708 - 214) / (nOut - 1) : 0));
      var riga = [];
      for (var k = 0; k < n; k++) {
        var x = L + 40 + (k + 1) / (n + 1) * (R - L - 80);
        var off = 0;
        if (li > 0 && n > 1) {
          var dist = Math.min(k, n - 1 - k), sign = (dist % 2 === 0) ? -1 : 1;
          if (li === lines.length - 1) sign = -sign;
          off = sign * 28;
        }
        riga.push({ x: x, y: y + off, linea: li });
      }
      out.push(riga);
    });
    return out;   // array di righe (ognuna array di slot)
  }
  var righe = slotGeo(D.m);            // [[gk], [dif...], [cen...], [att...]]
  var slots = [];                       // piatto, in ordine
  righe.forEach(function (r) { r.forEach(function (g) { slots.push(g); }); });

  // etichetta del reparto per indice di linea
  function repartoNome(li, totLinee) {
    if (li === 0) return "Portiere";
    if (li === totLinee - 1) return "Attacco";
    if (li === 1) return "Difesa";
    return "Centrocampo";
  }

  // ── le card piccole in campo (stato finale) ──
  var pitch = el("pitch");
  function cardHTML(r) {
    var num = r[0] || "", nome = r[1] || "", cognome = r[2] || "";
    var foto = r[3] || ("/loghi/foto-premium-" + num + ".png");
    if (VAR === "foto") {
      return '<div class="box"><div class="foto"><span class="np">' + esc(num) + '</span>' +
        '<img src="' + esc(foto) + '" onerror="this.style.display=\'none\'"><span class="velo"></span></div>' +
        '<div class="nome">' + esc(cognome) + (nome ? '<small>' + esc(nome) + '</small>' : '') + '</div></div>';
    }
    return '<div class="box"><div class="num">' + esc(num) + '</div>' +
      '<div class="nome">' + esc(cognome) + (nome ? '<small>' + esc(nome) + '</small>' : '') + '</div></div>';
  }
  var titolari = D.t.slice(0, slots.length);
  var h = "";
  titolari.forEach(function (r, i) {
    var g = slots[i];
    h += '<div class="pcard ' + (VAR === "foto" ? "vfoto" : "vcard") + '" data-i="' + i +
         '" style="left:' + g.x + 'px;top:' + g.y + 'px">' + cardHTML(r) + '</div>';
  });
  pitch.innerHTML = h;
  var pcards = pitch.querySelectorAll(".pcard");

  // ── panchina + allenatore ──
  if (conPanca) {
    var pr = "";
    D.p.slice(0, 9).forEach(function (r) {
      pr += '<div class="pr"><b>' + esc(r[0]||"") + '</b><span>' + esc(r[2]||"") + (r[1]?' <i>'+esc(r[1])+'</i>':'') + '</span></div>';
    });
    el("pancarighe").innerHTML = pr;
    if (D.l) { var ps = el("pancastemma"); ps.src = D.l; ps.onerror=function(){ps.style.display="none";}; }
  } else el("panca").style.display = "none";
  if (D.a && (D.a[0] || D.a[1]))
    el("allen").innerHTML = '<span>Allenatore</span> <b>' + esc([D.a[0],D.a[1]].filter(Boolean).join(" ")) + '</b>';

  // ── card grande della ribalta ──
  function bigHTML(r) {
    var num = r[0] || "", nome = r[1] || "", cognome = r[2] || "";
    var foto = r[3] || ("/loghi/foto-premium-" + num + ".png");
    return '<div class="bigcard">' +
      '<div class="bfoto"><span class="bnum">' + esc(num) + '</span>' +
      '<img src="' + esc(foto) + '" onerror="this.style.display=\'none\'"><span class="bvelo"></span></div>' +
      '<div class="bchi"><div class="bcog">' + esc(cognome) + '</div>' +
      (nome ? '<div class="bnom">' + esc(nome) + '</div>' : '') + '<div class="bfilo"></div></div></div>';
  }

  // indice di partenza di ogni riga nell'array piatto
  var startIdx = []; (function(){ var s=0; righe.forEach(function(r){ startIdx.push(s); s+=r.length; }); })();

  // ══════════════════════════════════════════════════════════════════
  //  FERMO-IMMAGINE: stato finale, senza ouverture (miniatura regia)
  // ══════════════════════════════════════════════════════════════════
  if (STILL) {
    el("tile").style.opacity = 1;
    el("logo").style.opacity = 1;
    el("team").style.clipPath = "inset(0 0 0 0)";
    el("modulo").style.opacity = 1;
    el("allen").style.opacity = 1;
    if (conPanca) el("panca").style.opacity = 1;
    pcards.forEach(function (c) { c.style.opacity = 1; });
    return;
  }

  // ══════════════════════════════════════════════════════════════════
  //  OUVERTURE a reparti: Portiere → Difesa → Centrocampo → Attacco
  // ══════════════════════════════════════════════════════════════════
  el("tile").style.animation = "fadeIn 1s ease .1s forwards";
  el("logo").style.animation = "fadeIn .6s ease .2s forwards";
  el("team").style.animation = "daSx .7s cubic-bezier(.2,.7,.3,1) .35s forwards";
  el("modulo").style.animation = "fadeIn .5s ease .7s forwards";

  var ribalta = el("ribalta"), reparto = el("reparto");
  var SLOW = parseFloat(new URLSearchParams(location.search).get("slow")) || 1;
  var T0 = 900 * SLOW, PER_FASE = 1500 * SLOW;   // partenza e durata di ogni reparto

  righe.forEach(function (r, li) {
    var inizio = T0 + li * PER_FASE;
    // entra la ribalta del reparto
    setTimeout(function () {
      reparto.textContent = repartoNome(li, righe.length);
      reparto.className = "in";
      ribalta.innerHTML = r.map(function (_, k) { return bigHTML(titolari[startIdx[li] + k] || []); }).join("");
      var bigs = ribalta.querySelectorAll(".bigcard");
      bigs.forEach(function (b, k) { setTimeout(function () { b.classList.add("in"); }, k * 90); });
    }, inizio);
    // esce e le card piccole del reparto si accendono al loro posto
    setTimeout(function () {
      reparto.className = "out";
      ribalta.querySelectorAll(".bigcard").forEach(function (b) { b.classList.add("out"); });
      for (var k = 0; k < r.length; k++) {
        var pc = pcards[startIdx[li] + k]; if (pc) pc.style.opacity = 1;
      }
    }, inizio + PER_FASE - 340);
  });

  // chiusura: ribalta pulita, panchina e allenatore entrano
  var fine = T0 + righe.length * PER_FASE;
  setTimeout(function () {
    ribalta.innerHTML = ""; reparto.className = "";
    pcards.forEach(function (c) { c.style.opacity = 1; });
    if (conPanca) el("panca").classList.add("in");
    el("allen").style.animation = "fadeIn .6s ease forwards";
  }, fine);

  document.addEventListener("dblclick", function(){ location.reload(); });
})();
</script>
<script src="sfondo.js"></script>
</body>
</html>
