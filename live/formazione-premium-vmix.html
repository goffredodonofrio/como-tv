<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formazione Premium · vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070B1D;}

  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;font-family:'DM Sans',system-ui,sans-serif;color:#F5F1E6;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(28,48,110,.5), transparent 55%),
      radial-gradient(90% 70% at 50% 110%, rgba(20,27,60,.6), transparent 60%),
      linear-gradient(160deg,#10173A 0%,#0A0F26 45%,#070B1D 100%);}

  /* Stadio Sinigaglia come sfondo d'ambiente: sotto a tutto, sfocato e
     tinto navy cosi' testo e magliette restano perfettamente leggibili. */
  #sfondostadio{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  #sfondostadio img{width:100%;height:100%;object-fit:cover;object-position:center 42%;
    filter:blur(3px) saturate(.85) brightness(.6);transform:scale(1.06);}
  #sfondostadio::after{content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% 8%, rgba(10,16,40,.45), transparent 55%),
      linear-gradient(165deg, rgba(9,13,32,.70) 0%, rgba(8,12,30,.84) 55%, rgba(6,10,26,.93) 100%);}

  /* sigla in filigrana */
  #tile{display:none;position:absolute;inset:0;pointer-events:none;overflow:hidden;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:150px;letter-spacing:.06em;
    color:rgba(245,241,230,.026);line-height:1.15;white-space:nowrap;opacity:0;
    transform:rotate(-8deg) scale(1.4);transform-origin:center;}

  /* campo di calcio (SVG) */
  #campo{position:absolute;left:0;bottom:0;width:1920px;height:1080px;pointer-events:none;opacity:0;transition:transform .8s cubic-bezier(.3,.7,.3,1);
    will-change:transform;transform:translateZ(0);backface-visibility:hidden;}
  #campo.on{animation:fadeIn 1s ease .3s forwards;}

  /* ── testata ── */
  #logo{position:absolute;left:96px;top:56px;width:140px;height:140px;object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));opacity:0;}
  #team{position:absolute;left:262px;top:70px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:62px;letter-spacing:.01em;color:#F5F1E6;text-transform:uppercase;white-space:nowrap;
    clip-path:inset(0 100% 0 0);}
  #modulo{position:absolute;left:266px;top:150px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:28px;letter-spacing:.32em;color:#C9A24B;opacity:0;}

  /* le maglie stanno SOPRA il velo (z 6 > dim 5): staccano sempre e non si
     perdono mai, qualunque sia la luminosita' dello stadio dietro. */
  #pitch{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:6;
    transition:transform .8s cubic-bezier(.3,.7,.3,1);
    will-change:transform;transform:translateZ(0);backface-visibility:hidden;}

  /* ── GIOCATORE al suo posto sul campo ──────────────────────────────────
     Campo VUOTO all'inizio. La FIGURA con la foto appare direttamente alla
     posizione del giocatore, GIRA su se stessa (foto → maglia) e posandosi
     si rimpicciolisce nella maglia definitiva con numero e nome. Tutto
     avviene sul posto: niente palco separato, niente convivenze. */
  .pcard{position:absolute;transform:translate(-50%,-50%);text-align:center;}
  /* la maglia definitiva (stato finale), nascosta finche' non atterra.
     Lo scambio con la maglia grande e' ISTANTANEO (i pixel coincidono: non si
     vede) — niente dissolvenza sulla maglia, o si crea un mini-flash. Il nome
     invece appare in dissolvenza. */
  .pjer{opacity:1;transition:opacity .4s ease;}
  .pjer .jersey{opacity:0;}
  .pcard.su .pjer .jersey{opacity:1;}
  .pjer .pnome{opacity:0;transition:opacity .45s ease;}
  .pcard.su .pjer .pnome{opacity:1;}
  /* durante la presentazione di un reparto, le maglie gia' atterrate vanno in
     secondo piano: le figure che crescono non ci si accavallano piu' sopra */
  .pcard.tenue .pjer{opacity:.35;}
  .jersey{position:relative;width:132px;height:132px;margin:0 auto;}
  .jersey img{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));}
  .pcard .pnome{font-family:'Mazzard',sans-serif;font-weight:800;font-size:20px;letter-spacing:.04em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;margin-top:4px;
    text-shadow:0 2px 8px rgba(0,0,0,.7);}
  .pcard .pnome .pnum{color:#C9A24B;margin-right:8px;}
  .pcard .pnome small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:12px;
    color:rgba(245,241,230,.72);text-transform:none;margin-top:0;}
  /* il flipper 3D alla posizione: faccia FOTO (riquadro navy/oro) e faccia
     MAGLIA (sola maglia). Cresce dal punto, gira, poi si posa rimpicciolendo. */
  .pflip{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%) scale(.5);
    transform-origin:center bottom;width:250px;height:340px;perspective:1100px;
    opacity:0;pointer-events:none;will-change:transform,opacity;
    transition:transform .6s cubic-bezier(.2,.75,.25,1), opacity .4s ease;}
  .pcard.giu .pflip{bottom:auto;top:-24px;transform-origin:center top;}
  .pcard.entra .pflip{opacity:1;transform:translateX(-50%) scale(1);}
  .pface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    transition:transform .8s cubic-bezier(.45,.08,.25,1);}
  .pfoto{transform:rotateY(0deg);border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#1a2550 0%,#0c1230 100%);
    border:2px solid rgba(201,162,75,.55);box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .pfoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;}
  .pfoto .pvelo{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(7,11,29,.88) 88%);}
  .pfoto .pfnum{position:absolute;top:8px;right:14px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:64px;line-height:1;color:#F5F1E6;text-shadow:0 3px 14px rgba(0,0,0,.8);}
  .pfoto .pchi{position:absolute;left:0;right:0;bottom:10px;text-align:center;}
  .pfoto .pnomef{font-family:'DM Sans',sans-serif;font-weight:500;font-size:16px;color:rgba(245,241,230,.8);}
  .pfoto .pcogf{font-family:'Mazzard',sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em;
    color:#F5F1E6;text-transform:uppercase;line-height:1.05;}
  .pfoto .pfilo{margin:7px auto 0;width:90px;height:2.5px;
    background:linear-gradient(90deg,transparent,#C9A24B,transparent);}
  .pmag{transform:rotateY(-180deg);display:flex;align-items:center;justify-content:center;}
  .pmag img{width:210px;height:210px;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));}
  /* GIRA su se stessa: foto → maglia */
  .pcard.gira .pfoto{transform:rotateY(180deg);}
  .pcard.gira .pmag{transform:rotateY(0deg);}
  /* la POSA la guida il JS (tecnica FLIP): la maglia grande scivola e
     rimpicciolisce ESATTAMENTE sopra la maglia finale — un solo oggetto in
     movimento, scambio invisibile a fine corsa. */
  .pcard.entra{z-index:8;}

  /* velo che scurisce SOLO lo stadio/campo dietro (le maglie sono sopra, z 6).
     Cosi' lo si puo' tenere leggero senza far sparire le maglie schierate. */
  #dim{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
    background:radial-gradient(120% 95% at 50% 45%, rgba(6,9,24,.55), rgba(4,6,16,.74));}
  #dim.on{animation:dimIn .7s ease forwards;}
  #dim.off{animation:dimOut .7s ease forwards;}
  @keyframes dimIn{from{opacity:0}to{opacity:1}}
  @keyframes dimOut{from{opacity:1}to{opacity:0}}
  #ribalta{z-index:10;}
  #reparto{z-index:11;}

  /* ── RIBALTA: la foto grande del reparto ── */
  #ribalta{position:absolute;left:0;right:0;top:300px;height:560px;pointer-events:none;}
  /* ogni reparto e' un gruppo impilato: nascono TUTTI all'avvio (card a
     opacity 0), cosi' alla spazzata non si costruisce nulla — solo si accende
     il gruppo giusto. E' la costruzione a meta' wipe che bloccava il thread. */
  #ribalta .rgrp{position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;gap:22px;}
  /* la FIGURA con la foto: riquadro navy/oro con la foto, numero e nome.
     Quando ha finito la presentazione si TRASFORMA in sola maglia (il
     riquadro e i testi sfumano, resta la maglia) e vola al suo posto. */
  .bigcard{width:270px;flex:0 0 270px;opacity:0;transform:translateY(54px) scale(.95);position:relative;
    will-change:transform,opacity;transition:transform .6s cubic-bezier(.16,.84,.28,1), opacity .5s ease;}
  .bigcard.mostra{opacity:1;transform:none;}
  .bigcard .bcorpo{position:relative;width:100%;height:360px;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#1a2550 0%,#0c1230 100%);
    border:2px solid rgba(201,162,75,.55);
    box-shadow:0 18px 50px rgba(0,0,0,.6);
    transition:opacity .4s ease;}
  /* la foto ancorata alla TESTA (mai tagliata): il taglio cade al petto */
  .bigcard .bcorpo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;}
  .bigcard .bvelo{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(7,11,29,.85) 90%);}
  .bigcard .bfnum{position:absolute;top:8px;right:14px;font-family:'Mazzard',sans-serif;font-weight:800;
    font-size:64px;line-height:1;color:#F5F1E6;text-shadow:0 3px 14px rgba(0,0,0,.8);}
  .bigcard .bchi{text-align:center;margin-top:10px;transition:opacity .35s ease;}
  .bigcard .bcog{font-family:'Mazzard',sans-serif;font-weight:800;font-size:34px;letter-spacing:.03em;
    color:#F5F1E6;text-transform:uppercase;white-space:nowrap;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .bigcard .bnom{font-family:'DM Sans',sans-serif;font-weight:500;font-size:18px;letter-spacing:.04em;
    color:rgba(245,241,230,.72);margin-top:3px;}
  .bigcard .bfilo{margin:10px auto 0;width:120px;height:3px;
    background:linear-gradient(90deg,transparent,#C9A24B,transparent);}
  /* la faccia-MAGLIA del morph: sola maglia, senza riquadro */
  .bigcard .bmagface{position:absolute;left:0;top:0;width:100%;height:360px;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .45s ease;}
  .bigcard .bmagface img{width:210px;height:210px;object-fit:contain;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));}
  .bigcard.maglia .bcorpo{opacity:0;}
  .bigcard.maglia .bchi{opacity:0;}
  .bigcard.maglia .bmagface{opacity:1;}

  /* etichetta reparto verticale */
  #reparto{position:absolute;right:-24px;top:50%;transform:translateY(-50%) rotate(90deg);
    transform-origin:center;font-family:'Mazzard',sans-serif;font-weight:800;font-size:104px;
    letter-spacing:.03em;color:rgba(201,162,75,.9);text-transform:uppercase;white-space:nowrap;opacity:0;}
  #reparto.in{animation:repIn .5s cubic-bezier(.2,.7,.3,1) forwards;}
  #reparto.out{animation:repOut .35s ease forwards;}
  @keyframes repIn{from{opacity:0;transform:translateY(-50%) translateX(70px) rotate(90deg);}
    to{opacity:1;transform:translateY(-50%) translateX(0) rotate(90deg);}}
  @keyframes repOut{to{opacity:0;transform:translateY(-50%) translateX(-50px) rotate(90deg);}}

  /* ── WIPE: UNA sola lama che spazza e rivela ──────────────────────────
     Logica nuova: un unico pannello (solo transform, tutto su GPU) attraversa
     lo schermo una volta. Sotto, il reparto e' gia' posato: e' la lama che,
     scorrendo, lo scopre. Le card NON si animano — cosi' non c'e' nulla di
     pesante da disegnare durante il movimento e la spazzata resta fluida.
     Sempre a video (nessun display:none), a riposo e' fuori campo a sinistra.
     Colori Como: blu nel corpo, oro brillante sul bordo di testa. */
  #wipe{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden;}
  /* larga e centrata (left:-50% + width:200%): a translateX 0 sborda di 50%
     per lato, cosi' c'e' una finestra ampia in cui copre TUTTO lo schermo.
     La sosta al centro (44%→56%) tiene lo schermo coperto mentre avviene lo
     scambio reparto: e' questo a sincronizzare, cosi' i numeri vecchi non
     restano un attimo. */
  /* lama VETRO: semitrasparente. Non copre piu' — e' una luce oro-navy che
     passa, mentre sotto i reparti si scambiano in dissolvenza (vedi .bigcard
     transition:opacity). Trasparente sul bordo di coda, oro brillante in testa. */
  #wipe .lama{position:absolute;top:-14%;height:128%;left:-50%;width:200%;
    transform:skewX(-12deg) translateX(-190%);will-change:transform;backface-visibility:hidden;
    background:linear-gradient(90deg,rgba(10,16,38,0) 0%,rgba(19,28,70,.40) 45%,rgba(40,60,120,.5) 70%,rgba(201,162,75,.85) 93%,rgba(227,194,113,.95) 100%);
    box-shadow:0 0 90px rgba(201,162,75,.28);}
  #wipe.go .lama{animation:lamaGo 1.8s cubic-bezier(.4,0,.6,1) forwards;}
  @keyframes lamaGo{
    0%{transform:skewX(-12deg) translateX(-190%);}
    100%{transform:skewX(-12deg) translateX(190%);}
  }

  /* ── panchina lunga (destra) ── */
  #panca{position:absolute;right:52px;top:118px;width:396px;opacity:0;}
  #panca.in{animation:pancaIn .6s ease forwards;}
  @keyframes pancaIn{to{opacity:1;}}
  #panca .coach{display:flex;align-items:center;gap:16px;padding:0 0 16px;margin-bottom:12px;
    border-bottom:1px solid rgba(201,162,75,.4);}
  #panca .coach .cf{width:96px;height:96px;border-radius:14px;flex:none;overflow:hidden;position:relative;
    background:radial-gradient(120% 120% at 35% 25%, rgba(46,64,120,.7), rgba(12,18,44,.95));
    box-shadow:inset 0 0 0 1.5px rgba(201,162,75,.5);}
  #panca .coach .cf img{width:100%;height:100%;object-fit:cover;}
  #panca .coach .cf .cfsig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:34px;color:#C9A24B;}
  #panca .coach .ct span{display:block;font-family:'Mazzard',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.24em;color:#C9A24B;text-transform:uppercase;margin-bottom:3px;}
  #panca .coach .ct b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:26px;color:#F5F1E6;
    text-transform:uppercase;letter-spacing:.02em;}
  #panca h3{font-family:'Mazzard',sans-serif;font-weight:800;font-size:16px;letter-spacing:.24em;
    color:rgba(245,241,230,.55);text-transform:uppercase;margin-bottom:6px;}
  #panca .pr{display:flex;align-items:baseline;gap:13px;padding:8px 0;border-bottom:1px solid rgba(245,241,230,.07);}
  #panca .pr b{font-family:'Mazzard',sans-serif;font-weight:800;font-size:19px;color:#C9A24B;min-width:36px;font-variant-numeric:tabular-nums;}
  #panca .pr span{font-family:'DM Sans',sans-serif;font-weight:500;font-size:18px;color:#F5F1E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #panca .pr span i{color:rgba(245,241,230,.6);font-style:normal;}
  #pancastemma{position:absolute;right:20px;bottom:-30px;width:360px;height:360px;object-fit:contain;opacity:.05;}

  @keyframes fadeIn{to{opacity:1;}}
  @keyframes daSx{to{clip-path:inset(0 0 0 0);}}
</style>
</head>
<body>

<div id="stage">
  <div id="sfondostadio"><img src="/loghi/sfondo-sinigaglia-2.jpg" alt="" onerror="this.parentNode.style.display='none'"></div>
  <div id="tile"></div>
  <svg id="campo" viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
  <img id="logo" alt="">
  <div id="team"></div>
  <div id="modulo"></div>
  <div id="pitch"></div>
  <div id="dim"></div>
  <div id="ribalta"></div>
  <div id="reparto"></div>
  <div id="wipe"></div>
  <div id="panca"><img id="pancastemma" alt=""><div class="coach"></div><h3>Panchina</h3><div id="pancarighe"></div></div>
</div>

<script>
(function () {
  "use strict";

  var DEMO = {
    n: "Como 1907", m: "4-3-3", k: "#1735C8",
    l: "https://a.espncdn.com/i/teamlogos/soccer/500/2572.png",
    mg: "/loghi/maglia-como-casa.png",
    a: ["Cesc", "Fabregas"],
    t: [["1","Jean","Butez","/loghi/foto-premium-butez.png"],
        ["2","Marc-Oliver","Kempf","/loghi/foto-premium-kempf.png"],
        ["28","Ivan","Smolcic","/loghi/foto-premium-smolcic.png"],
        ["99","Trevoh","Chalobah","/loghi/foto-premium-chalobah.png"],
        ["5","Máximo","Perrone","/loghi/foto-premium-perrone.png"],
        ["8","Maxence","Caqueret","/loghi/foto-premium-caqueret.png"],
        ["7","Lucas","Da Cunha","/loghi/foto-premium-da-cunha.png"],
        ["20","Martin","Baturina","/loghi/foto-premium-baturina.png"],
        ["11","Assane","Diao","/loghi/foto-premium-diao.png"],
        ["10","Nico","Paz","/loghi/foto-premium-paz.png"],
        ["9","Anastasios","Douvikas","/loghi/foto-premium-douvikas.png"]],
    p: [["19","Nicolas","Kühn","/loghi/foto-premium-kuhn.png"],
        ["30","Mattia","Liberali","/loghi/foto-premium-liberali.png"]]
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return (d && d.t && d.t.length) ? d : null;
    } catch (e) { return null; }
  }
  var qs = new URLSearchParams(location.search);
  var STILL = qs.get("still") === "1";
  var SLOW = parseFloat(qs.get("slow")) || 1;

  var D = decodeData();
  if (!D) { document.title = "PREMIUM — dati non validi"; document.getElementById("stage").style.display = "none"; return; }
  document.title = "FORMAZIONE PREMIUM " + (D.n || "").toUpperCase();
  var MAGLIA = D.mg || "/loghi/maglia-como-casa.png";

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function el(id){return document.getElementById(id);}
  function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);el("stage").style.transform="translate(-50%,-50%) scale("+s+")";}
  window.addEventListener("resize",fit); fit();

  // filigrana
  var sigla = (D.n || "COMO").replace(/[^A-Za-zÀ-ÿ ]/g,"").trim().split(/\s+/)[0].slice(0,4).toUpperCase();
  (function(){ el("tile").innerHTML = ((sigla+" ").repeat(9) + "<br>").repeat(9); })();

  // ── campo di calcio: mezzo campo in prospettiva, linee tenui ──
  (function () {
    var L = "rgba(245,241,230,.14)", W = 3;
    var s = '<defs><linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="rgba(30,52,110,.10)"/><stop offset="1" stop-color="rgba(10,16,40,0)"/></linearGradient></defs>';
    // prospettiva: base larga in basso (linea di fondo del Como), si stringe in alto
    var bx1=140, bx2=1780, tx1=560, tx2=1360, topY=250, botY=1010;
    s += '<polygon points="'+bx1+','+botY+' '+bx2+','+botY+' '+tx2+','+topY+' '+tx1+','+topY+'" fill="url(#grass)" stroke="'+L+'" stroke-width="'+W+'"/>';
    // linea di metà campo (in alto) con semicerchio
    s += '<line x1="'+tx1+'" y1="'+topY+'" x2="'+tx2+'" y2="'+topY+'" stroke="'+L+'" stroke-width="'+W+'"/>';
    s += '<path d="M '+(960-90)+' '+topY+' A 90 40 0 0 0 '+(960+90)+' '+topY+'" fill="none" stroke="'+L+'" stroke-width="'+W+'"/>';
    // area di rigore in basso (porta del Como)
    var ax1=560, ax2=1360, ay=botY, ah=170;
    s += '<polygon points="'+ax1+','+ay+' '+ax2+','+ay+' '+(ax2-80)+','+(ay-ah)+' '+(ax1+80)+','+(ay-ah)+'" fill="none" stroke="'+L+'" stroke-width="'+W+'"/>';
    var gx1=740, gx2=1180, gh=70;
    s += '<polygon points="'+gx1+','+ay+' '+gx2+','+ay+' '+(gx2-30)+','+(ay-gh)+' '+(gx1+30)+','+(ay-gh)+'" fill="none" stroke="'+L+'" stroke-width="'+W+'"/>';
    s += '<ellipse cx="960" cy="'+(ay-ah-40)+'" rx="70" ry="26" fill="none" stroke="'+L+'" stroke-width="'+W+'"/>';
    el("campo").innerHTML = s;
  })();

  // ── testata ──
  if (D.l) { var lg = el("logo"); lg.src = D.l; lg.onerror=function(){lg.style.display="none";}; }
  el("team").textContent = (D.n || "").toUpperCase();
  (function () {
    var t = el("team"), MAX = 806 - 262 - 24;
    if (t.scrollWidth > MAX) t.style.fontSize = Math.max(28, Math.floor(62 * MAX / t.scrollWidth)) + "px";
    el("modulo").style.top = (70 + Math.round(parseFloat(getComputedStyle(t).fontSize) * 1.32)) + "px";
  })();
  el("modulo").textContent = D.m || "";

  // ── geometria full-width (prospettiva del campo) ──
  function slotGeo(mod) {
    var lines = [1].concat(String(mod || "4-3-3").split("-").map(Number));
    var out = [], nOut = lines.length - 1;
    // le linee salgono dal basso (portiere) verso l'alto (attacco); il campo
    // si stringe in prospettiva, quindi le linee alte sono meno larghe
    lines.forEach(function (n, li) {
      var t = nOut > 0 ? (li) / (nOut) : 0;          // 0 = basso, 1 = alto
      var y = 934 - t * 660;
      var semi = 780 - t * 260;                       // metà larghezza della linea
      var cx = 960, riga = [];
      for (var k = 0; k < n; k++) {
        var x = n === 1 ? cx : cx - semi + (k + 0.5) / n * (2 * semi);
        var off = 0;
        if (li > 0 && n > 1) {
          // zig-zag: i LATI vanno in su e il centro in giu' — anche in attacco,
          // cosi' le punte esterne (Douvikas/Diao) non scendono addosso ai
          // nomi/maglie del centrocampo.
          var dist = Math.min(k, n - 1 - k), sign = (dist % 2 === 0) ? -1 : 1;
          off = sign * 26;
        }
        riga.push({ x: x, y: y + off, linea: li });
      }
      out.push(riga);
    });
    return out;
  }
  var righe = slotGeo(D.m);
  var slots = []; righe.forEach(function (r) { r.forEach(function (g) { slots.push(g); }); });
  var startIdx = []; (function(){ var s=0; righe.forEach(function(r){ startIdx.push(s); s+=r.length; }); })();

  function repartoNome(li, tot) {
    if (li === 0) return "Portiere";
    if (li === tot - 1) return "Attacco";
    if (li === 1) return "Difesa";
    return "Centrocampo";
  }

  // ── i giocatori in campo: tessera numero + card foto (stile reference) ──
  var pitch = el("pitch");
  var titolari = D.t.slice(0, slots.length);
  var h = "";
  titolari.forEach(function (r, i) {
    var g = slots[i], num = r[0] || "", nome = r[1] || "", cognome = r[2] || "";
    var foto = r[3] || ("/loghi/foto-premium-" + num + ".png");
    // linee alte: la figura cresce verso il basso, per non uscire dallo schermo
    var giu = g.y < 460 ? " giu" : "";
    h += '<div class="pcard' + giu + '" data-i="' + i + '" style="left:' + g.x + 'px;top:' + g.y + 'px">' +
      '<div class="pjer">' +
        '<div class="jersey"><img src="' + esc(MAGLIA) + '" onerror="this.style.opacity=.15"></div>' +
        '<div class="pnome"><span class="pnum">' + esc(num) + '</span>' + esc(cognome) + (nome ? '<small>' + esc(nome) + '</small>' : '') + '</div>' +
      '</div>' +
      '<div class="pflip">' +
        '<div class="pface pfoto"><img src="' + esc(foto) + '" onerror="this.style.display=\'none\'">' +
          '<div class="pvelo"></div><div class="pfnum">' + esc(num) + '</div>' +
          '<div class="pchi"><div class="pnomef">' + esc(nome) + '</div><div class="pcogf">' + esc(cognome) + '</div><div class="pfilo"></div></div></div>' +
        '<div class="pface pmag"><img src="' + esc(MAGLIA) + '" onerror="this.style.opacity=.15"></div>' +
      '</div></div>';
  });
  pitch.innerHTML = h;
  var pcards = pitch.querySelectorAll(".pcard");

  // ── pre-decodifica delle foto ──────────────────────────────────────
  // Senza questo il browser decodifica ogni foto (460px) proprio quando
  // la card entra in ribalta: e' da lì che nasce lo "scatto" all'ingresso
  // del reparto. Le scaldiamo tutte all'avvio — decode() e' asincrono e
  // non blocca — così l'iniezione poi e' istantanea.
  (function () {
    var urls = [MAGLIA];
    titolari.forEach(function (r) {
      urls.push((r && r[3]) || ("/loghi/foto-premium-" + (r && r[0]) + ".png"));
    });
    urls.push("/loghi/foto-cesc.png");
    urls.forEach(function (u) {
      if (!u) return;
      var im = new Image();
      im.src = u;
      if (im.decode) im.decode().catch(function () {});
    });
  })();

  // ── panchina lunga con Cesc ──
  var conPanca = D.p && D.p.length;
  if (conPanca) {
    var all = [D.a && D.a[0], D.a && D.a[1]].filter(Boolean).join(" ") || "Allenatore";
    var iniz = (D.a && D.a[1] ? D.a[1] : (D.a && D.a[0] ? D.a[0] : "C")).slice(0,1).toUpperCase()
             + (D.a && D.a[0] ? D.a[0].slice(0,1).toUpperCase() : "");
    // foto allenatore: dal magazzino per cognome (D.af), con Cesc come ripiego, poi le iniziali
    var afoto = D.af || "/loghi/foto-cesc.png";
    var cf = '<div class="cf"><img src="' + esc(afoto) + '" onerror="if(this.dataset.b){this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'}else{this.dataset.b=1;this.src=\'/loghi/foto-cesc.png\'}"><span class="cfsig" style="display:none">' + esc(iniz) + '</span></div>';
    el("panca").querySelector(".coach").innerHTML = cf +
      '<div class="ct"><span>Allenatore</span><b>' + esc(all) + '</b></div>';
    var pr = "";
    D.p.slice(0, 10).forEach(function (r) {
      pr += '<div class="pr"><b>' + esc(r[0]||"") + '</b><span>' + esc(r[2]||"") + (r[1]?' <i>'+esc(r[1])+'</i>':'') + '</span></div>';
    });
    el("pancarighe").innerHTML = pr;
    if (D.l) { var ps = el("pancastemma"); ps.src = D.l; ps.onerror=function(){ps.style.display="none";}; }
  } else el("panca").style.display = "none";

  // ── wipe: UNA sola lama che spazza ──
  el("wipe").innerHTML = '<div class="lama"></div>';
  function wipe(cb) {
    var w = el("wipe");
    w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
    if (cb) setTimeout(cb, 900 * SLOW);       // a metà (dentro la sosta, schermo coperto) scambio il reparto
    setTimeout(function(){ w.classList.remove("go"); }, 1900 * SLOW);
  }

  // ══════════════════════════════════════════════════════════════════
  //  FERMO-IMMAGINE
  // ══════════════════════════════════════════════════════════════════
  if (STILL) {
    el("tile").style.opacity = 1; el("campo").classList.add("on"); el("campo").style.opacity = 1;
    el("logo").style.opacity = 1; el("team").style.clipPath = "inset(0 0 0 0)"; el("modulo").style.opacity = 1;
    if (conPanca) { el("panca").style.opacity = 1; el("campo").style.transform = "translateX(-190px) translateZ(0)"; el("pitch").style.transform = "translateX(-190px) translateZ(0)"; }
    pcards.forEach(function (c) { c.classList.add("su"); });
    return;
  }

  // ══════════════════════════════════════════════════════════════════
  //  OUVERTURE a reparti con wipe diagonale
  // ══════════════════════════════════════════════════════════════════
  el("tile").style.animation = "fadeIn 1s ease .1s forwards";
  el("campo").classList.add("on");
  el("logo").style.animation = "fadeIn .6s ease .2s forwards";
  el("team").style.animation = "daSx .7s cubic-bezier(.2,.7,.3,1) .35s forwards";
  el("modulo").style.animation = "fadeIn .5s ease .7s forwards";

  var reparto = el("reparto");
  var T0 = 2100 * SLOW, PER = 3800 * SLOW;

  // il velo leggero resta acceso durante la presentazione: spinge indietro lo
  // stadio, le tessere sono sopra (z 6) e restano leggibili
  setTimeout(function () { el("dim").className = "on"; }, T0 - 900 * SLOW);

  // LA POSA (tecnica FLIP): misura dove sta la maglia grande e dove sta
  // quella definitiva, e porta la grande esattamente sopra la piccola —
  // stessa posizione, stessa taglia al pixel. Un solo oggetto si muove; lo
  // scambio avviene a corsa finita ed e' invisibile perche' i pixel coincidono.
  var stage = el("stage");
  function posaFluida(pc) {
    var flip = pc.querySelector(".pflip");
    var mia = pc.querySelector(".pmag img");
    var sua = pc.querySelector(".jersey img");
    if (!flip || !mia || !sua) { pc.classList.add("su"); if (flip) flip.style.opacity = "0"; return; }
    var sr = stage.getBoundingClientRect(), sc = (sr.width / 1920) || 1;
    function centro(e) { var r = e.getBoundingClientRect();
      return { x: (r.left + r.width / 2 - sr.left) / sc, y: (r.top + r.height / 2 - sr.top) / sc, w: r.width / sc }; }
    var A = centro(mia), B = centro(sua);
    var sf = B.w / A.w;
    flip.style.transformOrigin = "125px 170px";      // il centro della maglia dentro il flipper
    flip.style.transition = "transform .62s cubic-bezier(.45,.02,.28,1)";
    flip.style.transform = "translateX(-50%) translate(" + (B.x - A.x) + "px," + (B.y - A.y) + "px) scale(" + sf + ")";
    // a fine corsa: scambio secco (pixel coincidenti, non si vede), nome in dissolvenza
    setTimeout(function () {
      pc.classList.add("su");
      flip.style.transition = "none";
      flip.style.opacity = "0";
    }, 640 * SLOW);
  }

  // REPARTI, sul posto: campo vuoto; le FIGURE con la foto appaiono
  // direttamente alla posizione di ciascun giocatore, GIRANO su se stesse
  // (foto → maglia) e posandosi si rimpiccioliscono nella maglia definitiva.
  righe.forEach(function (r, li) {
    var tShow = T0 + li * PER;
    setTimeout(function () {
      var rn = repartoNome(li, righe.length);
      reparto.textContent = rn;
      reparto.style.fontSize = rn.length > 8 ? "70px" : "104px";
      reparto.className = ""; void reparto.offsetWidth; reparto.className = "in";
      // le maglie gia' atterrate vanno in secondo piano (si riaccendono alla fine)
      pcards.forEach(function (pc, i) {
        var attivo = i >= startIdx[li] && i < startIdx[li] + r.length;
        pc.classList.toggle("tenue", !attivo);
      });
      r.forEach(function (_, k) {
        var pc = pcards[startIdx[li] + k];
        setTimeout(function () { pc.classList.add("entra"); }, k * 140 * SLOW);
      });
    }, tShow);
    // gira su se stessa (foto → maglia), poi si posa nella maglia in campo
    setTimeout(function () {
      reparto.className = "out";
      r.forEach(function (_, k) {
        var pc = pcards[startIdx[li] + k];
        setTimeout(function () { pc.classList.add("gira"); }, k * 110 * SLOW);
        setTimeout(function () { posaFluida(pc); }, 820 * SLOW + k * 110 * SLOW);
      });
    }, tShow + PER - 1600 * SLOW);
  });

  // CHIUSURA: tutte le maglie a piena luce, via il velo, entra la panchina.
  var fine = T0 + righe.length * PER;
  setTimeout(function () {
    reparto.className = "out";
    el("dim").className = "off";
    pcards.forEach(function (pc) { pc.classList.remove("tenue"); pc.classList.add("su"); });
    if (conPanca) {
      el("campo").style.transform = "translateX(-190px) translateZ(0)";
      el("pitch").style.transform = "translateX(-190px) translateZ(0)";
      setTimeout(function(){ el("panca").classList.add("in"); }, 350 * SLOW);
    }
  }, fine);

  document.addEventListener("dblclick", function(){ location.reload(); });
})();
</script>
<script src="sfondo.js"></script>
</body>
