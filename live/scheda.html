<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio comanderebbe un sistema che nessuno ascolta. Da GitHub si viene
   quindi portati sulla macchina giusta. Sulla VM questo non fa nulla. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    color-scheme:dark;
    --gold:#C9A24B;--gold-bright:#E3C271;--red:#E51B20;
    --ivory:#F5F1E6;--ivory-dim:#D8D2C2;--fg-3:#8A8B96;
    --surface-panel:rgba(16,22,48,.66);
    --line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
    --ok:#4FCB8B;
  }
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;
    color:var(--ivory);min-height:100vh;
    background-color:#0A0F24;
    background-image:
      radial-gradient(90% 70% at 20% 8%, rgba(36,64,138,.5), transparent 55%),
      radial-gradient(80% 80% at 92% 108%, rgba(201,162,75,.16), transparent 55%),
      linear-gradient(165deg,#141B3C 0%,#0E1430 48%,#0A0F24 100%);
    background-attachment:fixed;padding-bottom:90px;
  }
  .nav{min-height:58px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:18px;
    padding:0 clamp(20px,4vw,56px);background:rgba(10,15,36,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2);}
  .nav-brand{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:800;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ivory);text-decoration:none;white-space:nowrap;}
  .nav-links{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;padding:8px 0;justify-content:flex-end;}
  .nav-links a{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ivory-dim);text-decoration:none;
    padding:7px 14px;border:1px solid var(--line-2);border-radius:4px;}
  .nav-links a:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  .nav-links a.qui{color:var(--gold-bright);border-color:var(--line-gold);background:rgba(201,162,75,.08);}

  .wrap{max-width:1500px;margin:0 auto;padding:0 clamp(18px,3vw,32px);}
  header.page{padding:38px 0 18px;}
  .eyebrow{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:clamp(28px,4vw,42px);
    line-height:.94;letter-spacing:-.02em;text-transform:uppercase;color:var(--ivory);}
  .sub{color:var(--fg-3);font-size:13.5px;margin-top:10px;}

  .panel{background:var(--surface-panel);border:1px solid var(--line-2);border-radius:10px;
    padding:16px;margin-bottom:16px;}
  .panel h2{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  label{font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:5px;}
  input[type=text],select{
    width:100%;padding:10px 12px;border-radius:7px;background:rgba(245,241,230,.05);
    border:1px solid var(--line-2);color:var(--ivory);font-family:'DM Sans',sans-serif;font-size:14px;}
  input:focus,select:focus{outline:none;border-color:var(--line-gold);}
  .riga{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:end;}
  .riga > div{flex:1;min-width:0;}

  button{font-family:'Mazzard',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;padding:11px 18px;border-radius:7px;cursor:pointer;
    background:rgba(245,241,230,.06);color:var(--ivory-dim);border:1px solid var(--line-2);}
  button:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  button.primary{background:var(--gold);color:#0A0F24;border-color:var(--gold);}
  button.primary:hover{background:var(--gold-bright);color:#0A0F24;}
  #btnPrev,#btnPrevG{background:rgba(79,203,139,.14);border-color:rgba(79,203,139,.55);color:#7BDCAA;}
  #btnPrev:hover,#btnPrevG:hover{background:rgba(79,203,139,.24);border-color:#4FCB8B;color:#8FE8BB;}

  .barra{display:flex;align-items:end;gap:8px;flex-wrap:wrap;
    padding:12px 14px;border-radius:10px;margin-bottom:16px;
    background:var(--surface-panel);border:1px solid var(--line-2);}
  .barra button{padding:10px 13px;font-size:11px;letter-spacing:.09em;}
  .barra .campo{display:flex;flex-direction:column;gap:5px;}
  .barra .campo label{margin-bottom:0;}
  .barra .campo select{padding:8px 9px;font-size:13px;}

  #stato{margin-top:10px;font-size:13px;color:var(--fg-3);min-height:20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  #stato .ok{color:var(--ok);} #stato .err{color:#FF6B6E;}
  .pbar{height:6px;background:rgba(245,241,230,.08);border-radius:3px;overflow:hidden;
    flex:1 1 240px;min-width:200px;align-self:center;}
  .pfill{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;
    animation:pfill 2.6s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes pfill{0%{width:0}60%{width:72%}100%{width:92%}}
  .pfill.done{animation:none;width:100%;background:var(--ok);transition:width .25s ease;}

  /* righe etichetta + valore, libere */
  .crow{display:flex;gap:10px;margin-bottom:8px;align-items:center;}
  .crow input.eti{flex:1;}
  .crow input.val{flex:2;}
  .crow .via{flex:0 0 auto;padding:9px 13px;color:#FF6B6E;border-color:rgba(229,27,32,.4);}
  .crow .via:hover{background:rgba(229,27,32,.12);border-color:var(--red);}

  /* editor della foto: stesse proporzioni del ritaglio in grafica */
  .fedit{display:flex;gap:16px;align-items:center;margin:2px 0 4px;}
  .frett{position:relative;width:220px;height:224px;border-radius:9px;overflow:hidden;
    flex:none;background:#10173A;cursor:grab;
    box-shadow:inset 0 0 0 2px rgba(245,241,230,.4), 0 6px 18px rgba(0,0,0,.4);}
  .frett:active{cursor:grabbing;}
  .frett img{position:absolute;user-select:none;pointer-events:none;}
  .fcomandi{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .fcomandi label{margin:0;}
  .fcomandi input[type=range]{width:200px;accent-color:#C9A24B;}
  .fcomandi .ftogli{align-self:flex-start;padding:8px 13px;color:#FF6B6E;border-color:rgba(229,27,32,.4);}

  #prevbox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:9px;
    border:1px solid var(--line-gold);background:#070B1D;}
  #prev{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;
    transform-origin:top left;}

  .due{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  @media (max-width:1080px){ .due{grid-template-columns:1fr;} }
  label{white-space:nowrap;}
  #btnRegia{background:#4FA3E8;border-color:#4FA3E8;color:#0A0F24;}
  #btnRegia:hover:not(:disabled){background:#74B9F0;border-color:#74B9F0;color:#0A0F24;}
  #btnRegia:disabled{opacity:.4;cursor:default;}
  select option{background-color:#141B3C;color:#F5F1E6;}
  #btnPosReset{background:var(--gold);border-color:var(--gold);color:#0A0F24;}
  #btnPosReset:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#0A0F24;}
  #btnPrevChiudi{color:#FF6B6E;border-color:rgba(229,27,32,.5);}
  #btnPrevChiudi:hover{background:rgba(229,27,32,.12);border-color:var(--red);color:#FF6B6E;}
</style>
</head>
<body>

<script src="nav.js"></script>

<div class="wrap">
  <header class="page">
    <div class="eyebrow">Como TV · Grafiche Live</div>
    <h1>Scheda</h1>
    <div class="sub">La carta d'identità di una squadra o di un avversario: titolo, campi liberi
      etichetta + valore e la foto grande. Tutto scritto a mano dalla redazione.</div>
  </header>

  <div class="barra" id="labarra">
    <button id="btnPrev">Anteprima</button>
    <div class="campo" style="margin-left:auto"><label for="canaleSel">Seleziona vMix o progetto</label><select id="canaleSel" style="min-width:0;width:290px;max-width:100%"></select></div>
    <button id="btnRegia">&#128225; Invia alla regia</button>
  </div>

  <div id="stato">Compila i campi e premi Anteprima.</div>
  <div id="prevwrap" style="display:none;margin:14px 0 20px">
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button id="btnPrevChiudi">Chiudi anteprima</button>
    </div>
    <div id="prevbox"><iframe id="prev" src="about:blank" scrolling="no"></iframe></div>
  </div>

  <div class="due">
      <div class="panel">
        <h2>Foto</h2>
        <div class="riga">
          <div style="flex:0 0 auto"><button type="button" id="fbtn">Carica la foto</button>
            <button type="button" id="fmag">&#128193; Dal magazzino</button>
            <input type="file" id="ffile" accept="image/*" hidden></div>
        </div>
        <div class="fedit" id="fedit" style="display:none">
          <div class="frett" id="fc"><img id="fimg" draggable="false"></div>
          <div class="fcomandi"><label>Trascina per inquadrare, ingrandisci col cursore</label>
            <input type="range" id="fz" min="100" max="320" value="100">
            <button type="button" class="ftogli" id="ftogli">Togli la foto</button></div>
        </div>
      </div>
      <div class="panel">
        <h2>Testata</h2>
        <div class="riga">
          <div><label for="n">Titolo</label>
            <input type="text" id="n" placeholder="es. AEK ATENE"></div>
          <div><label for="s">Sottotitolo</label>
            <input type="text" id="s" placeholder="es. GRECIA"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Campi <small style="font-family:'DM Sans',sans-serif;letter-spacing:0;text-transform:none;color:var(--fg-3);font-weight:500;font-size:11px">etichetta + valore, fino a sei righe</small></h2>
        <div id="crows"></div>
        <button id="btnAddRiga">+ Aggiungi riga</button>
      </div>

      <div class="panel">
        <h2>Nota finale</h2>
        <div class="riga">
          <div><label for="nt">Riga piccola sotto i campi</label>
            <input type="text" id="nt" placeholder="es. 1968–1969"></div>
        </div>
      </div>

  </div>
</div>

<script src="chiave.js"></script>
<script src="destinazione.js"></script>
<script src="sceglifoto.js"></script>
<script>
(function () {
  "use strict";

  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  var TOKEN = (window.ChiaveComoTV ? ChiaveComoTV.valore() : "");
  // le immagini stanno accanto al ponte: in dev /como-tv-dev/loghi,
  // in produzione /como-tv/loghi (cosi' ogni ambiente vede le SUE foto)
  var BASEIMG = PONTE.replace(/\/(api|exec)$/, "");
  if (window.Destinazione) Destinazione.adotta(document.getElementById("canaleSel"), PONTE, TOKEN);

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function b64url(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function stato(cls, txt) { el("stato").innerHTML = '<span class="' + cls + '">' + txt + '</span>'; }

  // ── i campi liberi ──────────────────────────────────────────────────
  var PRESET = ["ALLENATORE", "STELLA", "GIOCATORI PIÙ PREZIOSI", "PARTECIPAZIONI UCL", "MIGLIOR PIAZZAMENTO UCL"];
  function rigaCampo(eti, val) {
    return '<div class="crow">' +
      '<input type="text" class="eti" placeholder="etichetta" value="' + esc(eti || "") + '">' +
      '<input type="text" class="val" placeholder="valore" value="' + esc(val || "") + '">' +
      '<button type="button" class="via" title="Togli la riga">&times;</button></div>';
  }
  el("crows").innerHTML = PRESET.map(function (x) { return rigaCampo(x); }).join("");
  el("btnAddRiga").addEventListener("click", function () {
    if (document.querySelectorAll("#crows .crow").length >= 6) {
      stato("err", "Sei righe sono il massimo che sta nella grafica.");
      return;
    }
    el("crows").insertAdjacentHTML("beforeend", rigaCampo());
  });
  el("crows").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button.via") : null;
    if (b) b.parentNode.remove();
  });

  // ── la foto: editor con le proporzioni del ritaglio in grafica ──────
  var W_ED = 220, H_ED = 224;
  var W_OUT = 1060, H_OUT = 1080;
  var FOTO = null;

  function fotoDisegna() {
    var f = FOTO, im = el("fimg");
    if (!f || !im) return;
    var base = Math.max(W_ED / f.img.naturalWidth, H_ED / f.img.naturalHeight);
    var sc = base * f.z;
    var w = f.img.naturalWidth * sc, h = f.img.naturalHeight * sc;
    f.ox = Math.max(-(w - W_ED) / 2, Math.min((w - W_ED) / 2, f.ox));
    f.oy = Math.max(-(h - H_ED) / 2, Math.min((h - H_ED) / 2, f.oy));
    im.style.width = w + "px"; im.style.height = h + "px";
    im.style.left = (W_ED / 2 - w / 2 + f.ox) + "px";
    im.style.top = (H_ED / 2 - h / 2 + f.oy) + "px";
  }

  el("fbtn").addEventListener("click", function () { el("ffile").click(); });
  // seconda strada: pescare una foto gia' in magazzino (se non la si
  // ritocca viene riusata com'e', senza creare doppioni)
  if (window.SceltaFoto) {
    SceltaFoto.adotta(PONTE, TOKEN);
    el("fmag").addEventListener("click", function () {
      SceltaFoto.apri(function (url) {
        var img = new Image();
        img.onload = function () {
          FOTO = { img: img, ox: 0, oy: 0, z: 1, sporca: false, url: url };
          el("fedit").style.display = "";
          el("fimg").src = url;
          el("fz").value = 100;
          fotoDisegna();
        };
        img.src = url;
      });
    });
  }
  el("ftogli").addEventListener("click", function () {
    FOTO = null; el("fedit").style.display = "none"; el("ffile").value = "";
  });
  el("ffile").addEventListener("change", function () {
    if (!this.files || !this.files[0]) return;
    var lettore = new FileReader();
    lettore.onload = function () {
      var img = new Image();
      img.onload = function () {
        FOTO = { img: img, ox: 0, oy: 0, z: 1, sporca: true };
        el("fedit").style.display = "";
        el("fimg").src = lettore.result;
        el("fz").value = 100;
        fotoDisegna();
      };
      img.src = lettore.result;
    };
    lettore.readAsDataURL(this.files[0]);
  });
  el("fz").addEventListener("input", function () {
    if (FOTO) { FOTO.z = this.value / 100; FOTO.sporca = true; fotoDisegna(); }
  });
  var fdrag = null;
  el("fc").addEventListener("pointerdown", function (e) {
    if (!FOTO) return;
    fdrag = { x: e.clientX, y: e.clientY };
    this.setPointerCapture && this.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  document.addEventListener("pointermove", function (e) {
    if (!fdrag || !FOTO) return;
    FOTO.ox += e.clientX - fdrag.x; FOTO.oy += e.clientY - fdrag.y; FOTO.sporca = true;
    fdrag.x = e.clientX; fdrag.y = e.clientY;
    fotoDisegna();
  });
  document.addEventListener("pointerup", function () { fdrag = null; });

  function fotoCotta() {
    var f = FOTO;
    if (!f) return null;
    var F = W_OUT / W_ED;
    var base = Math.max(W_ED / f.img.naturalWidth, H_ED / f.img.naturalHeight);
    var sc = base * f.z;
    var tela = document.createElement("canvas");
    tela.width = W_OUT; tela.height = H_OUT;
    var g = tela.getContext("2d");
    g.drawImage(f.img,
      (W_ED / 2 - f.img.naturalWidth * sc / 2 + f.ox) * F,
      (H_ED / 2 - f.img.naturalHeight * sc / 2 + f.oy) * F,
      f.img.naturalWidth * sc * F, f.img.naturalHeight * sc * F);
    return tela.toDataURL("image/jpeg", 0.82);
  }

  function assicuraFoto() {
    if (!FOTO || !FOTO.img || !FOTO.sporca) return Promise.resolve();
    var nome = el("n").value.trim() || "scheda";
    return fetch(PONTE, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: TOKEN, tipo: "logo-carica",
                             nome: "foto scheda " + nome, dati: fotoCotta() })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok || !res.url) throw new Error(res.errore || "salvataggio foto fallito");
        FOTO.url = BASEIMG + res.url + "?t=" + Date.now();
        FOTO.sporca = false;
      });
  }

  // ── dai campi ai dati del motore ────────────────────────────────────
  function dati() {
    var c = [];
    document.querySelectorAll("#crows .crow").forEach(function (r) {
      var eti = r.querySelector(".eti").value.trim();
      var val = r.querySelector(".val").value.trim();
      if (eti && val) c.push([eti, val]);
    });
    var d = { n: el("n").value.trim(), s: el("s").value.trim(), c: c, nt: el("nt").value.trim() };
    if (FOTO && FOTO.url) d.img = FOTO.url;
    return d;
  }
  function valido(d) {
    if (!d.n) { stato("err", "Serve il titolo."); return false; }
    if (!d.c.length) { stato("err", "Serve almeno un campo con etichetta e valore."); return false; }
    return true;
  }

  // ── anteprima e invio ───────────────────────────────────────────────
  function adattaPrev() {
    el("prev").style.transform = "scale(" + (el("prevbox").clientWidth / 1920) + ")";
  }
  window.addEventListener("resize", adattaPrev);
  el("btnPrevChiudi").addEventListener("click", function () {
    el("prevwrap").style.display = "none";
    el("prev").src = "about:blank";
  });


  el("btnPrev").addEventListener("click", function () {
    stato("", "Preparo l'anteprima…");
    assicuraFoto().then(function () {
      var d = dati();
      if (!valido(d)) return;
      el("prevwrap").style.display = "block";
      el("prev").src = "scheda-vmix.html?d=" + b64url(d) + "&n=" + Date.now();
      adattaPrev();
      el("prevwrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
      stato("", "Anteprima aggiornata.");
    }).catch(function (e) { stato("err", "Foto non salvata: " + e.message); });
  });

  el("btnRegia").addEventListener("click", function () {
    assicuraFoto().then(avviaInvio)
      .catch(function (e) { stato("err", "Foto non salvata: " + e.message); });
  });
  function avviaInvio() {
    var d = dati();
    if (!valido(d)) return;
    var proposta = ("SCHEDA " + d.n).toUpperCase();
    var titolo = window.prompt("Nome in scaletta di regia:", proposta);
    if (titolo === null) return;
    el("stato").innerHTML = '<span>Invio a ' + Destinazione.dove() + '&hellip;</span>' +
      '<span class="pbar"><span class="pfill" id="pfill"></span></span>';
    fetch(PONTE, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: TOKEN }, Destinazione.corpo({
                             grafica: "scheda", titolo: titolo.trim() || proposta, dati: d })))
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          var pf = document.getElementById("pfill");
          if (pf) pf.className = "pfill done";
          setTimeout(function () {
            stato("ok", "Aggiunta a " + Destinazione.dove() + ". Dalla regia la mandi in onda.");
          }, 350);
        } else stato("err", "Errore: " + (res.errore || "sconosciuto"));
      })
      .catch(function () { stato("err", "Ponte non raggiungibile."); });
  }

  adattaPrev();
})();
</script>
</body>
</html>
