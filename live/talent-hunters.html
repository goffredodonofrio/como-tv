<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio comanderebbe un sistema che nessuno ascolta. Da GitHub si viene
   quindi portati sulla macchina giusta. Sulla VM questo non fa nulla. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Hunters · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    color-scheme:dark;
    --gold:#C9A24B;--gold-bright:#E3C271;--red:#E51B20;
    --ivory:#F5F1E6;--ivory-dim:#D8D2C2;--fg-3:#8A8B96;
    --surface-panel:rgba(16,22,48,.66);
    --line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
  }
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;
    color:var(--ivory);min-height:100vh;
    background-color:#0A0F24;
    background-image:
      radial-gradient(90% 70% at 20% 8%, rgba(36,64,138,.5), transparent 55%),
      radial-gradient(80% 80% at 92% 108%, rgba(201,162,75,.16), transparent 55%),
      linear-gradient(165deg,#141B3C 0%,#0E1430 48%,#0A0F24 100%);
    background-attachment:fixed;padding-bottom:90px;
  }
  .wrap{max-width:1500px;margin:0 auto;padding:0 clamp(18px,3vw,32px);}
  header.page{padding:38px 0 10px;}
  .eyebrow{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:clamp(28px,4vw,42px);
    line-height:.94;letter-spacing:-.02em;text-transform:uppercase;color:var(--ivory);}
  .sub{color:var(--fg-3);font-size:13.5px;margin-top:10px;max-width:980px;}
  .torna{display:inline-flex;align-items:center;gap:6px;font-family:'Mazzard',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-dim);text-decoration:none;margin-bottom:12px;}
  .torna:hover{color:var(--gold-bright);}
  h2.sezione{font-family:'Mazzard',sans-serif;font-size:13px;font-weight:800;letter-spacing:.24em;
    text-transform:uppercase;color:var(--gold);margin:26px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line-gold);}

  /* le stesse schede del catalogo */
  .fam-griglia{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  @media (max-width:1240px){ .fam-griglia{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:940px){  .fam-griglia{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:640px){  .fam-griglia{grid-template-columns:minmax(0,1fr);} }
  .fam{background:var(--surface-panel);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;}
  .fam:hover{border-color:var(--line-gold);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.45);}
  .anle{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#070B1D;}
  .anle.trasparente{background:
      linear-gradient(45deg, rgba(245,241,230,.05) 25%, transparent 25%, transparent 75%, rgba(245,241,230,.05) 75%),
      linear-gradient(45deg, rgba(245,241,230,.05) 25%, transparent 25%, transparent 75%, rgba(245,241,230,.05) 75%),
      #101528;background-size:26px 26px;background-position:0 0,13px 13px;}
  .anle iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:top left;pointer-events:none;}
  .faminfo{padding:11px 13px 12px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .faminfo h3{font-family:'Mazzard',sans-serif;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ivory);}
  .faminfo p{font-size:12px;line-height:1.45;color:var(--fg-3);flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .apri{font-family:'Mazzard',sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 12px;border-radius:6px;text-decoration:none;text-align:center;background:var(--gold);border:1px solid var(--gold);color:#0A0F24;}
  .apri:hover{background:var(--gold-bright);border-color:var(--gold-bright);}
</style>
</head>
<body>

<script src="nav.js"></script>

<div class="wrap">
  <header class="page">
    <a class="torna" href="classifiche.html">&larr; Catalogo</a>
    <div class="eyebrow">Como TV · Grafiche Live · Format</div>
    <h1>Talent Hunters</h1>
    <div class="sub">Tutte le grafiche del format. Ogni anteprima è la grafica vera:
      <b>passaci sopra</b> e parte l'animazione, <b>clicca</b> e sei nella sua pagina, dove scegli il giocatore dall'anagrafica e la mandi in regia.</div>
  </header>

  <div id="vetrina"></div>
</div>

<script>
(function () {
  "use strict";

  function b64url(o) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  var CONFRONTO = b64url({ v: [["NPG", 53], ["npxG", 75], ["GOAL CONVERSION %", 46], ["AERIAL", 72], ["TOUCHES IN BOX", 68], ["XA", 33], ["OFF DUELS WON", 92]],
                           b: [62, 76, 38, 74, 66, 40, 90], fo: "fonte DataMB" });
  var EVIDENZA = b64url({ z: [0, 1, 1, 0, 1, 3, 4, 4, 0, 2, 3, 1], t: "HEATMAP", st: "STAGIONALE", dir: "dx", fo: "fonte DataMB", ev: 1 });

  // Una pagina per grafica, come nel catalogo. "q" sono i dati d'esempio
  // quando la demo del motore non basta a far vedere la differenza.
  var SEZIONI = [
    { nome: "Il giocatore", fam: [
      { n: "Carta d'identità", m: "th-carta-vmix.html", e: "th-carta.html",
        d: "Nome, nascita, nazionalità, ruolo, piede e altezza, la foto in card, lo stemma e il numero di maglia. Il soprannome si scrive a macchina." },
      { n: "Approved", m: "th-approved-vmix.html", e: "th-approved.html",
        d: "Il valore di mercato, l'impronta e il timbro APPROVED in oro che cade sulla card." },
      { n: "Not approved", m: "th-approved-vmix.html", e: "th-not-approved.html", q: "&no=1",
        d: "Il valore di mercato, l'impronta e il timbro NOT APPROVED in rosso." }
    ]},
    { nome: "I numeri", fam: [
      { n: "Heatmap stagionale", m: "th-heatmap-vmix.html", e: "th-heatmap.html",
        d: "Il campo si apre, si inclina in prospettiva e si accendono le zone, dal blu all'oro." },
      { n: "Heatmap in evidenza", m: "th-heatmap-vmix.html", e: "th-heatmap-evidenza.html", q: "&d=" + EVIDENZA,
        d: "La stessa heatmap con le zone più calde che pulsano, per tenerla in onda a lungo." },
      { n: "Torta", m: "th-torta-vmix.html", e: "th-torta.html", alpha: true,
        d: "Gli spicchi dei numeri del giocatore, da 0 a 100. Fondo trasparente." },
      { n: "Radar", m: "th-radar-vmix.html", e: "th-radar.html", alpha: true,
        d: "Il profilo del giocatore su più assi, disegnato punto per punto. Fondo trasparente." },
      { n: "Radar a confronto", m: "th-radar-vmix.html", e: "th-radar-confronto.html", alpha: true, q: "&d=" + CONFRONTO,
        d: "Due giocatori sullo stesso radar: l'oro del primo, poi il rosso del secondo. Fondo trasparente." }
    ]}
  ];

  var h = "";
  SEZIONI.forEach(function (sz) {
    h += '<h2 class="sezione">' + sz.nome + '</h2><div class="fam-griglia">';
    sz.fam.forEach(function (f) {
      h += '<div class="fam" data-e="' + f.e + '">' +
        '<div class="anle' + (f.alpha ? " trasparente" : "") + '"><iframe data-m="' + f.m + '" data-q="' + (f.q || "") +
        '" loading="lazy" scrolling="no" tabindex="-1" title="' + f.n + '"></iframe></div>' +
        '<div class="faminfo"><h3>' + f.n + '</h3><p>' + f.d + '</p>' +
        '<a class="apri" href="' + f.e + '">Apri l\'editor</a></div></div>';
    });
    h += "</div>";
  });
  document.getElementById("vetrina").innerHTML = h;

  function scala() {
    document.querySelectorAll(".anle").forEach(function (b) {
      b.querySelector("iframe").style.transform = "scale(" + (b.clientWidth / 1920) + ")";
    });
  }
  window.addEventListener("resize", scala);
  document.querySelectorAll(".anle iframe").forEach(function (fr) { fr.src = fr.dataset.m + "?still=1" + fr.dataset.q; });
  scala();

  // col mouse sopra parte l'animazione vera; uscendo torna il fermo immagine
  document.querySelectorAll(".fam").forEach(function (card) {
    var fr = card.querySelector("iframe"), quando = null, gira = false;
    card.addEventListener("mouseenter", function () {
      clearTimeout(quando);
      quando = setTimeout(function () { gira = true; fr.src = fr.dataset.m + "?n=" + Date.now() + fr.dataset.q; }, 190);
    });
    card.addEventListener("mouseleave", function () {
      clearTimeout(quando);
      if (gira) { gira = false; fr.src = fr.dataset.m + "?still=1" + fr.dataset.q; }
    });
  });
  document.getElementById("vetrina").addEventListener("click", function (e) {
    if (e.target.closest(".apri")) return;
    var card = e.target.closest(".fam");
    if (!card) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey) window.open(card.dataset.e, "_blank");
    else location.href = card.dataset.e;
  });
})();
</script>
<script src="dev.js"></script>
</body>
</html>
