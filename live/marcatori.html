<!DOCTYPE html>
<html lang="it">
<head>
<script>
/* Le Grafiche Live vivono sulla macchina della regia. Su GitHub resta una
   copia di questa pagina, ma li' parla a un altro ponte: chi la aprisse per
   sbaglio (un vecchio segnalibro, un input vMix non aggiornato) comanderebbe
   un sistema che nessuno ascolta, e le grafiche non andrebbero in onda.
   Da GitHub si viene quindi portati sulla macchina giusta. Sulla VM questo
   non fa nulla. Se l'indirizzo della macchina cambia, va cambiato anche qui. */
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  // il percorso su GitHub (/como-tv/...) e' identico a quello sul dominio:
  // si cambia solo la casa
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcatori · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    color-scheme:dark;
    --navy-900:#0A0F24;--navy-850:#0E1430;--navy-800:#141B3C;--navy-700:#20284E;
    --gold:#C9A24B;--gold-bright:#E3C271;--gold-deep:#A67C2E;
    --red:#E51B20;
    --ivory:#F5F1E6;--ivory-dim:#D8D2C2;--fg-3:#8A8B96;
    --surface-panel:rgba(16,22,48,.66);
    --line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
    --ok:#4FCB8B;
    --gold-soft:rgba(201,162,75,.14);
  }
  body{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;
    color:var(--ivory);min-height:100vh;
    background-color:#0A0F24;
    background-image:
      radial-gradient(90% 70% at 20% 8%, rgba(36,64,138,.5), transparent 55%),
      radial-gradient(80% 80% at 92% 108%, rgba(201,162,75,.16), transparent 55%),
      linear-gradient(165deg,#141B3C 0%,#0E1430 48%,#0A0F24 100%);
    background-attachment:fixed;
    padding-bottom:90px;
  }

  .nav{min-height:58px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:18px;
    padding:0 clamp(20px,4vw,56px);background:rgba(10,15,36,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2);}
  .nav-brand{font-family:'Mazzard',system-ui,sans-serif;font-size:12px;font-weight:800;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ivory);text-decoration:none;white-space:nowrap;}
  .nav-sep{color:rgba(245,241,230,.25);}
  .nav-here{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:rgba(245,241,230,.45);}
  .nav-links{margin-left:auto;display:flex;gap:10px;}
  .nav-links a{font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ivory-dim);text-decoration:none;
    padding:7px 14px;border:1px solid var(--line-2);border-radius:4px;}
  .nav-links a:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  .nav-links{flex-wrap:wrap;padding:8px 0;justify-content:flex-end;}
  .nav-links a.qui{color:var(--gold-bright);border-color:var(--line-gold);background:rgba(201,162,75,.08);}

  .wrap{max-width:1500px;margin:0 auto;padding:0 clamp(18px,3vw,32px);}

  header.page{padding:40px 0 20px;border-bottom:1px solid var(--line-gold);}
  .eyebrow{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  h1{font-family:'Mazzard',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,4.5vw,46px);
    line-height:.94;letter-spacing:-.02em;text-transform:uppercase;color:var(--ivory);}
  .srcline{margin-top:10px;font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:9px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(79,203,139,.6);flex:none;}

  .controls{display:flex;flex-wrap:nowrap;align-items:flex-end;gap:10px;padding:22px 0;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
  select{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:500;font-size:14px;
    padding:9px 12px;color:var(--ivory);
    background:rgba(245,241,230,.06);
    border:1px solid rgba(245,241,230,.16);border-radius:5px;min-width:110px;
  }
  select:hover{border-color:var(--line-gold);}
  #comp{min-width:215px;}
  /* riga occhiello + titolo della grafica: campi grandi, comodi da scrivere */
  .grafit{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;padding:2px 0 20px;}
  .grafit .field{flex:1;min-width:260px;}
  .grafit input[type=text]{
    font-family:'DM Sans',system-ui,sans-serif;font-weight:600;font-size:18px;letter-spacing:.01em;
    padding:13px 15px;color:var(--ivory);background:rgba(245,241,230,.06);
    border:1px solid rgba(245,241,230,.16);border-radius:6px;width:100%;}
  .grafit input[type=text]:hover{border-color:var(--line-gold);}
  .grafit input[type=text]:focus{outline:none;border-color:var(--gold);}
  .grafit input[type=text]::placeholder{color:var(--ivory);opacity:.5;text-transform:none;font-weight:500;letter-spacing:0;}
  button{
    font-family:'Mazzard',system-ui,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;
    padding:10px 13px;border-radius:5px;cursor:pointer;
    background:transparent;color:var(--ivory-dim);border:1px solid var(--line-2);
  }
  button:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  button:disabled{opacity:.35;cursor:default;}
  #btnRegia{white-space:nowrap}/*unariga*/
  button:disabled:hover{color:var(--ivory-dim);border-color:var(--line-2);}
  button.primary{background:var(--gold);border-color:var(--gold);color:#0A0F24;}
  button.primary:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#0A0F24;}
  #btnPrev,#btnPrevG{background:rgba(79,203,139,.14);border-color:rgba(79,203,139,.55);color:#7BDCAA;}
  #btnPrev:hover,#btnPrevG:hover{background:rgba(79,203,139,.24);border-color:#4FCB8B;color:#8FE8BB;}
  button:focus-visible,select:focus-visible,td[contenteditable]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .status{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;
    padding:13px 16px;background:var(--surface-panel);
    border:1px solid var(--line-2);border-left:3px solid var(--line-2);
    border-radius:5px;font-size:13px;margin-bottom:20px;}
  .status.ok{border-left-color:var(--ok);}
  .status.warn{border-left-color:var(--gold-bright);}
  .status.err{border-left-color:var(--red);}
  .status .msg{color:var(--ivory-dim);}
  .status .msg b{color:var(--ivory);}

  .tablewrap{overflow-x:auto;background:var(--surface-panel);
    border:1px solid var(--line-2);border-radius:8px;margin-bottom:20px;}
  table{border-collapse:collapse;width:100%;}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line-2);font-size:13.5px;}
  thead th{background:#131A38;
    font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
    border-bottom:1px solid var(--line-gold);white-space:nowrap;}
  td.num{width:64px;text-align:center;font-variant-numeric:tabular-nums;}
  th.num{text-align:center;}
  td.edit{cursor:text;color:var(--ivory);}
  td.edit:hover{background:var(--gold-soft);}
  td.edit:empty::after{content:"—";color:rgba(245,241,230,.2);}
  td .crest{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin-right:8px;}
  td.azioni{width:44px;text-align:center;}
  td.azioni button{padding:3px 9px;font-size:13px;letter-spacing:0;}
  tbody tr:last-child td{border-bottom:none;}

  .empty{padding:64px 24px;text-align:center;background:var(--surface-panel);
    border:1px solid var(--line-2);border-radius:8px;color:var(--fg-3);}
  .empty h2{font-family:'Mazzard',system-ui,sans-serif;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ivory);margin-bottom:10px;}
  label{white-space:nowrap;}
  button.carica{background:#ED7F2F;border-color:#ED7F2F;color:#0A0F24;}
  button.carica:hover{background:#F79245;border-color:#F79245;color:#0A0F24;}
  #btnRegia{background:#4FA3E8;border-color:#4FA3E8;color:#0A0F24;}
  #btnRegia:hover:not(:disabled){background:#74B9F0;border-color:#74B9F0;color:#0A0F24;}
  #btnRegia:disabled{opacity:.4;cursor:default;}
  select option{background-color:#141B3C;color:#F5F1E6;}
</style>
</head>
<body>

<script src="nav.js"></script>

<div class="wrap">

  <header class="page">
    <div class="eyebrow">Como TV · Grafiche Live</div>
    <h1>Marcatori</h1>
    <div class="srcline"><span class="dot"></span>Fonte dati: ESPN · tutte le celle sono modificabili · fino a 20 in grafica</div>
  </header>

  <div class="controls">
    <div class="field">
      <label for="comp">Competizione</label>
      <select id="comp"></select>
    </div>
    <div class="field">
      <label for="stag">Stagione</label>
      <select id="stag">
        <option value="2026" selected>2026-27</option>
        <option value="2025">2025-26</option>
      </select>
    </div>
    <div class="field">
      <label for="stat">Statistica</label>
      <select id="stat">
        <option value="goalsLeaders" selected>Gol</option>
        <option value="assistsLeaders">Assist</option>
      </select>
    </div>
    <button class="carica" id="btnLoad">Carica</button>
    <button id="btnPrevG">Anteprima</button>
    <button id="btnRow" disabled>&#65291; Riga</button>
    <div class="field" style="flex:0 0 auto;margin-left:auto">
      <label for="canaleSel">Seleziona vMix o progetto</label>
      <select id="canaleSel" style="min-width:0;width:290px;max-width:100%"></select>
    </div>
    <button id="btnRegia">&#128225; Invia alla regia</button>
    <div class="field" style="flex:0 0 auto">
      <label>Scarica CSV</label>
      <button id="btnCsv" disabled style="background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.55);color:#6EE7D4;white-space:nowrap">CSV</button>
    </div>
  </div>

  <!-- occhiello e titolo della grafica, sempre visibili e modificabili -->
  <div class="grafit">
    <div class="field">
      <label for="occhielloG">Occhiello (riga sopra il titolo)</label>
      <input type="text" id="occhielloG" placeholder="SERIE A 2026-27" maxlength="60">
    </div>
    <div class="field">
      <label for="titoloG">Titolo grande della grafica</label>
      <input type="text" id="titoloG" placeholder="I MARCATORI" maxlength="60">
    </div>
  </div>

  <div class="status" id="status"><span class="msg" id="statusMsg">Scegli la competizione e premi <b>Carica</b>.</span></div>
  <div id="prevGbox" style="display:none;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:1px solid var(--line-2);background:#070B1D;margin-bottom:20px">
    <iframe id="prevG" style="position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:top left;pointer-events:none" scrolling="no"></iframe>
  </div>


  <div id="out"></div>

</div>

<script src="scavalco.js"></script>
<script src="chiave.js"></script>
<script src="destinazione.js"></script>
<script>
(function () {
  "use strict";

  function scegliCanale() {
    var s = document.getElementById("canaleSel");
    // il vecchio menu salvava "3|studio": si tiene solo il numero
    var c = parseInt(((s && s.value) || "1").split("|")[0], 10);
    if (!(c >= 1 && c <= 7)) c = 1;
    try { localStorage.setItem("comotv.regia.canale", String(c)); } catch (e) {}
    return { c: c, dest: "" };
  }


  // Una sola destinazione per macchina: il playout di quel vMix porta tutto,
  // grafiche e partita insieme, quindi non c'e' piu' da scegliere fra
  // "Live Studio" e "Live Match".
  (function () {
    var s = document.getElementById("canaleSel");
    if (!s) return;
    for (var i = 1; i <= 7; i++) {
      var op = document.createElement("option");
      op.value = String(i); op.textContent = "vMix " + i;
      s.appendChild(op);
    }
    var c = 1;
    try {
      var v = parseInt(localStorage.getItem("comotv.regia.canale"), 10); if (v >= 1 && v <= 7) c = v;
    } catch (e) {}
    s.value = String(c);
    if (!s.value) s.value = "1";
    s.addEventListener("change", function () {
      try { localStorage.setItem("comotv.regia.canale", s.value); } catch (e) {}
    });
  })();



  var PONTE = "https://script.google.com/macros/s/AKfycbwAw49xwBpCt9P6HfNgJTsc2MBwxy72T7RUsSPqtcHBnh0fyuC40phQTR3FeZEKdfPw/exec";
  if (window.Scavalco) Scavalco.carica(PONTE);
  var TOKEN = (window.ChiaveComoTV ? ChiaveComoTV.valore() : "");
  if (window.Destinazione) Destinazione.adotta(document.getElementById("canaleSel"), PONTE, TOKEN);

  var COMPS = [
    { slug: "serie-a",       band: "🇮🇹", nome: "Serie A",               code: "ita.1" },
    { slug: "serie-b",       band: "🇮🇹", nome: "Serie B",               code: "ita.2" },
    { slug: "coppa-italia",  band: "🇮🇹", nome: "Coppa Italia",          code: "ita.coppa_italia" },
    { slug: "saudi",         band: "🇸🇦", nome: "Saudi Pro League",      code: "ksa.1" },
    { slug: "argentina",     band: "🇦🇷", nome: "LPF Argentina",         code: "arg.1" },
    { slug: "nacionalb",     band: "🇦🇷", nome: "Nacional B Argentina",  code: "arg.2" },
    { slug: "austria",       band: "🇦🇹", nome: "Bundesliga Austria",    code: "aut.1" },
    { slug: "brasileirao",   band: "🇧🇷", nome: "Brasileirão",           code: "bra.1" },
    { slug: "ligue1",        band: "🇫🇷", nome: "Ligue 1",               code: "fra.1" },
    { slug: "ligue2",        band: "🇫🇷", nome: "Ligue 2",               code: "fra.2" },
    { slug: "bundesliga",    band: "🇩🇪", nome: "Bundesliga",            code: "ger.1" },
    { slug: "bundesliga2",   band: "🇩🇪", nome: "2. Bundesliga",         code: "ger.2" },
    { slug: "championship",  band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "EFL Championship",      code: "eng.2" },
    { slug: "premier",       band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "Premier League",        code: "eng.1" },
    { slug: "eflcup",        band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "EFL Cup (Carabao)",     code: "eng.league_cup" },
    { slug: "facup",         band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "FA Cup",                code: "eng.fa" },
    { slug: "league-one",    band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "League One",            code: "eng.3" },
    { slug: "league-two",    band: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", nome: "League Two",            code: "eng.4" },
    { slug: "eredivisie",    band: "🇳🇱", nome: "Eredivisie",            code: "ned.1" },
    { slug: "eerste",        band: "🇳🇱", nome: "Eerste Divisie NL",     code: "ned.2" },
    { slug: "primeira",      band: "🇵🇹", nome: "Primeira Liga",         code: "por.1" },
    { slug: "scozia",        band: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", nome: "Scottish Premiership",  code: "sco.1" },
    { slug: "scozia2",       band: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", nome: "Scottish Championship", code: "sco.2" },
    { slug: "pscup",         band: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", nome: "Premier Sports Cup",    code: "sco.cis" },
    { slug: "laliga",        band: "🇪🇸", nome: "LaLiga",                code: "esp.1" },
    { slug: "champions",     band: "🇪🇺", nome: "Champions League",      code: "uefa.champions" },
    { slug: "europa",        band: "🇪🇺", nome: "Europa League",         code: "uefa.europa" },
    { slug: "conference",    band: "🇪🇺", nome: "Conference League",     code: "uefa.europa.conf" },
    { slug: "libertadores",  band: "🌎", nome: "CONMEBOL Libertadores", code: "conmebol.libertadores" },
    { slug: "sudamericana",  band: "🌎", nome: "CONMEBOL Sudamericana", code: "conmebol.sudamericana" }
  ];

  var API = "https://site.api.espn.com/apis/site/v2/sports/soccer";
  var MAPLS = "comotv.classifiche.mappatura";   // stessa mappa nomi delle classifiche

  var elComp = document.getElementById("comp");
  var elStag = document.getElementById("stag");
  var elStat = document.getElementById("stat");
  var elTit  = document.getElementById("titoloG");
  var elOcc  = document.getElementById("occhielloG");
  // il titolo di default segue la statistica scelta (Gol → I MARCATORI, Assist → GLI ASSIST)
  function titDefaultVal() { return elStat.value === "assistsLeaders" ? "GLI ASSIST" : "I MARCATORI"; }
  // l'occhiello di default segue competizione + stagione
  function occDefaultVal() { var c = compSel(); return (c ? c.nome.toUpperCase() : "") + " " + elStag.options[elStag.selectedIndex].text; }
  function aggiornaOccPh() { elOcc.placeholder = occDefaultVal(); }
  elStat.addEventListener("change", function () { elTit.placeholder = titDefaultVal(); });
  document.getElementById("comp").addEventListener("change", aggiornaOccPh);
  elStag.addEventListener("change", aggiornaOccPh);
  var elOut = document.getElementById("out");
  var elStatus = document.getElementById("status");
  var elStatusMsg = document.getElementById("statusMsg");
  var btnCsv = document.getElementById("btnCsv");
  var btnRegia = document.getElementById("btnRegia");
  var btnRow = document.getElementById("btnRow");

  COMPS.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c.slug; o.textContent = (c.band ? c.band + " " : "") + c.nome;
    elComp.appendChild(o);
  });
  aggiornaOccPh();   // placeholder occhiello iniziale (competizione + stagione)

  function compSel() {
    var slug = elComp.value;
    for (var i = 0; i < COMPS.length; i++) if (COMPS[i].slug === slug) return COMPS[i];
    return COMPS[0];
  }

  function setStatus(cls, html) {
    elStatus.className = "status" + (cls ? " " + cls : "");
    elStatusMsg.innerHTML = html;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // mappa nomi squadra della pagina classifiche (override locali)
  function mappa() {
    try { return JSON.parse(localStorage.getItem(MAPLS) || "{}"); } catch (e) { return {}; }
  }

  function nomeSquadra(team) {
    if (!team) return "";
    var m = mappa();
    if (m[team.displayName]) return m[team.displayName];
    var n = team.shortDisplayName || team.displayName || "";
    return n.toUpperCase().slice(0, 16);
  }

  function cognome(ath) {
    // "H. Leonard" → "Leonard"; i cognomi composti restano interi
    var s = ath.shortName || ath.displayName || "";
    return s.replace(/^[^.\s]{1,3}\.\s*/, "").toUpperCase();
  }

  // "M: 2, G: 3: A: 1" → partite giocate
  function partite(leader) {
    var m = String(leader.shortDisplayValue || leader.displayValue || "").match(/M:\s*(\d+)/);
    return m ? m[1] : "";
  }

  function assist(leader) {
    var m = String(leader.shortDisplayValue || "").match(/A:\s*(\d+)/);
    return m ? m[1] : "";
  }

  // ── caricamento ──
  document.getElementById("btnLoad").addEventListener("click", function () {
    var c = compSel();
    setStatus("", "Carico " + esc(c.nome) + "…");
    fetch(API + "/" + c.code + "/statistics?season=" + elStag.value, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        var cat = (j.stats || []).filter(function (x) { return x.name === elStat.value; })[0];
        var leaders = cat ? (cat.leaders || []) : [];
        if (!leaders.length) throw new Error("nessun dato per questa stagione");
        var righe = leaders.slice(0, 20).map(function (l, i) {
          var t = l.athlete && l.athlete.team;
          return {
            pos: i + 1,
            nome: cognome(l.athlete || {}),
            squadra: nomeSquadra(t),
            pg: partite(l),
            val: elStat.value === "assistsLeaders" ? (assist(l) || l.value) : l.value,
            tid: (window.Scavalco && t && Scavalco.url(t.displayName)) || (t ? t.id : "")
          };
        });
        disegna(righe);
        setStatus("ok", "<b>" + esc(c.nome) + "</b> · " + righe.length + " " +
          (elStat.value === "assistsLeaders" ? "assist-men" : "marcatori") +
          " · stagione " + esc(elStag.options[elStag.selectedIndex].text) +
          " · tutte le celle sono modificabili");
      })
      .catch(function (err) {
        setStatus("err", "Non riesco a caricare: " + esc(err.message) + ". Puoi comunque scrivere la tabella a mano con <b>&#65291; Riga</b>.");
        if (!elOut.querySelector("table")) { disegna([]); }
      });
  });

  function etichettaVal() { return elStat.value === "assistsLeaders" ? "ASSIST" : "GOL"; }

  function disegna(righe) {
    var h = '<div class="tablewrap"><table><thead><tr>' +
      '<th class="num">Pos</th><th>Giocatore</th><th>Squadra (grafica)</th>' +
      '<th class="num">PG</th><th class="num">' + etichettaVal() + '</th><th></th>' +
      '</tr></thead><tbody id="tb">';
    righe.forEach(function (r) { h += riga(r); });
    h += '</tbody></table></div>';
    elOut.innerHTML = h;
    btnCsv.disabled = btnRow.disabled = false;
    agganciaAzioni();
  }

  function riga(r) {
    var crest = r.tid ? '<img class="crest" src="' + esc(String(r.tid).indexOf("/") >= 0 ? r.tid : "https://a.espncdn.com/i/teamlogos/soccer/500/" + r.tid + ".png") + '" onerror="this.style.display=\'none\'">' : "";
    return '<tr data-tid="' + esc(r.tid || "") + '">' +
      '<td class="num edit" contenteditable>' + esc(r.pos) + '</td>' +
      '<td class="edit" contenteditable>' + esc(r.nome) + '</td>' +
      '<td>' + crest + '<span class="edit" contenteditable style="outline:none">' + esc(r.squadra) + '</span></td>' +
      '<td class="num edit" contenteditable>' + esc(r.pg) + '</td>' +
      '<td class="num edit" contenteditable>' + esc(r.val) + '</td>' +
      '<td class="azioni"><button title="Togli riga" data-del>&times;</button></td>' +
      '</tr>';
  }

  function agganciaAzioni() {
    elOut.querySelectorAll("button[data-del]").forEach(function (b) {
      b.addEventListener("click", function () { b.closest("tr").remove(); });
    });
  }

  btnRow.addEventListener("click", function () {
    var tb = document.getElementById("tb");
    if (!tb) return;
    var n = tb.querySelectorAll("tr").length + 1;
    tb.insertAdjacentHTML("beforeend", riga({ pos: n, nome: "", squadra: "", pg: "", val: "", tid: "" }));
    agganciaAzioni();
  });

  function leggi() {
    var out = [];
    elOut.querySelectorAll("#tb tr").forEach(function (tr) {
      var td = tr.querySelectorAll("td");
      var nome = td[1].textContent.trim();
      if (!nome) return;
      out.push([
        td[0].textContent.trim(),
        nome.toUpperCase(),
        td[2].textContent.trim().toUpperCase(),
        td[3].textContent.trim(),
        td[4].textContent.trim(),
        tr.dataset.tid || ""
      ]);
    });
    return out;
  }

  // ── CSV ──
  btnCsv.addEventListener("click", function () {
    var righe = leggi();
    var csv = "POSIZIONE," + "GIOCATORE,SQUADRA,PG," + etichettaVal() + "\n";
    righe.forEach(function (r) { csv += r.slice(0, 5).join(",") + "\n"; });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "MARCATORI " + compSel().nome.toUpperCase() + ".csv";
    a.click();
  });

  // ── invio alla regia ──
  btnRegia.addEventListener("click", function () {
    var righe = leggi();
    if (!righe.length) { setStatus("warn", "La tabella è vuota."); return; }
    var c = compSel();
    var stagTxt = elStag.options[elStag.selectedIndex].text;
    var eyebrow = elOcc.value.trim() || (c.nome.toUpperCase() + " " + stagTxt);
    var titolo = window.prompt("Nome in scaletta:",
      (elStat.value === "assistsLeaders" ? "ASSIST " : "MARCATORI ") + c.nome.toUpperCase());
    if (titolo === null) return;
    var dati = { e: eyebrow, r: righe, t: elTit.value.trim() || titDefaultVal() };
    if (elStat.value === "assistsLeaders") { dati.l = "ASSIST"; }
    var __canale = scegliCanale();
    if (__canale === null) return;
    setStatus("", "Invio a " + Destinazione.dove() + "…");
    fetch(PONTE, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: TOKEN }, Destinazione.corpo({ grafica: "marcatori", titolo: titolo, dati: dati })))
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.errore || "errore sconosciuto");
        setStatus("ok", "<b>" + esc(titolo) + "</b> aggiunta a " + Destinazione.dove() + ": la mandi in onda dalla <a href=\"regia.html\" style=\"color:var(--gold-bright)\">Regia</a>.");
      })
      .catch(function (err) { setStatus("err", "La regia ha rifiutato il carico: " + esc(err.message)); });
  });

  // ── anteprima della grafica: stesso payload dell'invio, senza prompt ──
  (function () {
    var bp = document.getElementById("btnPrevG");
    if (!bp) return;
    function fitG() {
      var box = document.getElementById("prevGbox");
      if (box.style.display === "none") return;
      document.getElementById("prevG").style.transform = "scale(" + (box.clientWidth / 1920) + ")";
    }
    window.addEventListener("resize", fitG);
    function datiPrev() {
      var righe = leggi();
      if (!righe.length) return null;
      var dati = { e: elOcc.value.trim() || occDefaultVal(), r: righe,
                   t: elTit.value.trim() || titDefaultVal() };
      if (elStat.value === "assistsLeaders") { dati.l = "ASSIST"; }
      return dati;
    }
    function render(scroll) {
      var dati = datiPrev();
      if (!dati) { if (scroll) setStatus("warn", "La tabella è vuota."); return; }
      var b = btoa(unescape(encodeURIComponent(JSON.stringify(dati)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      var box = document.getElementById("prevGbox");
      box.style.display = "block";
      document.getElementById("prevG").src = "marcatori-vmix.html?d=" + b + "&muto=1&n=" + Date.now();
      fitG();
      if (scroll) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    bp.addEventListener("click", function () { render(true); });
    // scrivendo occhiello o titolo, l'anteprima già aperta si aggiorna dal vivo
    function liveIfOpen() { if (document.getElementById("prevGbox").style.display !== "none") render(false); }
    elTit.addEventListener("input", liveIfOpen);
    elOcc.addEventListener("input", liveIfOpen);
  })();

})();
</script>
</body>
</html>
