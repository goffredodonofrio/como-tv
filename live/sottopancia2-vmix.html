<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottopancia doppio · Grafica vMix</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}

  *{margin:0;padding:0;box-sizing:border-box;}
  /* overlay TRASPARENTE come il sottopancia singolo */
  :root{color-scheme:dark;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}

  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;
    font-family:'DM Sans',system-ui,sans-serif;
  }

  /* geometrie del singolo (misurate sul ProRes), duplicate a specchio:
     sinistra = barra x129 + pannello x137; destra = barra a 129 dal
     bordo destro + pannello ancorato a 137 dal bordo destro. */
  .panel{
    position:absolute;bottom:52px;min-width:595px;max-width:820px;height:120px;
    background:linear-gradient(180deg,
      rgba(87,90,107,.85) 0%, rgba(62,66,84,.84) 17%,
      rgba(36,41,60,.82) 33%, rgba(40,44,63,.82) 70%, rgba(44,48,67,.82) 100%);
  }
  #panelSx{left:137px;clip-path:inset(0 100% 0 0);}
  #panelDx{right:137px;clip-path:inset(0 0 0 100%);}

  .bar{
    position:absolute;bottom:52px;width:8px;height:120px;
    background:linear-gradient(180deg,#C9A24B 0%,#AC8C47 100%);
    transform:scaleY(0);transform-origin:bottom center;
  }
  #barSx{left:129px;}
  #barDx{right:129px;}

  .kicker{position:absolute;top:19.4px;line-height:1;
    font-weight:700;font-size:15px;letter-spacing:5.7px;
    color:#C9A24B;text-transform:uppercase;white-space:nowrap;opacity:0;}
  .nome{position:absolute;top:47.9px;line-height:1;
    font-family:'Mazzard',sans-serif;font-weight:800;font-size:45px;letter-spacing:7.8px;
    color:#F3EFE5;text-transform:uppercase;white-space:nowrap;opacity:0;}
  .job{position:absolute;top:95.5px;line-height:1;
    font-weight:700;font-size:15px;letter-spacing:5.8px;
    color:#E3E0D8;white-space:nowrap;opacity:0;}

  #panelSx .kicker,#panelSx .job{left:20px;}
  #panelSx .nome{left:19px;}
  #panelDx .kicker,#panelDx .job{right:20px;}
  #panelDx .nome{right:19px;}

  @keyframes panelInSx { to { clip-path:inset(0 0 0 0); } }
  @keyframes panelInDx { to { clip-path:inset(0 0 0 0); } }
  @keyframes barIn     { to { transform:scaleY(1); } }
  @keyframes riseIn  {
    0%   { opacity:0; transform:translateY(14px); }
    100% { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="barSx" class="bar"></div>
  <div id="panelSx" class="panel">
    <span class="kicker"></span>
    <span class="nome"></span>
    <span class="job"></span>
  </div>
  <div id="barDx" class="bar"></div>
  <div id="panelDx" class="panel">
    <span class="kicker"></span>
    <span class="nome"></span>
    <span class="job"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  // dati: ?d=<b64 {a:{k,n,j}, b:{k,n,j}}> — a = sinistra, b = destra
  var DEMO = {
    a: { k: "Ospite in studio", n: "Angelo Taglieri", j: "Redazione Como TV" },
    b: { k: "Ospite in studio", n: "Marco Ghironi", j: "Redazione Como TV" }
  };

  function decodeData() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return DEMO;   // aperta a mano senza dati: demo dimostrativa
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      return d && d.a && d.a.n && d.b && d.b.n ? d : null;
    } catch (err) { return null; }
  }
  var STILL = new URLSearchParams(location.search).get("still") === "1";
  var D = decodeData();
  if (!D) {
    // dati presenti ma non validi: MEGLIO NIENTE che una grafica sbagliata in onda
    document.title = "SOTTOPANCIA DOPPIO — dati non validi";
    document.getElementById("stage").style.display = "none";
    return;
  }
  document.title = "SOTTOPANCIA DOPPIO " + (D.a.n || "").toUpperCase() + " / " + (D.b.n || "").toUpperCase();

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  function monta(idPanel, idBar, dati, animPanel) {
    var panel = document.getElementById(idPanel);
    var bar = document.getElementById(idBar);
    var kk = panel.querySelector(".kicker");
    var nn = panel.querySelector(".nome");
    var jj = panel.querySelector(".job");

    kk.textContent = dati.k || "";
    nn.textContent = dati.n || "";
    jj.textContent = dati.j || "";

    // il pannello si allarga col nome (mai più stretto della reference)
    requestAnimationFrame(function () {
      var w = Math.max(595, nn.scrollWidth + 60);
      panel.style.width = Math.min(820, w) + "px";
    });
    setTimeout(function () {
      var w = Math.max(595, nn.scrollWidth + 60);
      panel.style.width = Math.min(820, w) + "px";
    }, 60);

    if (STILL) {
      panel.style.clipPath = "inset(0 0 0 0)";
      bar.style.transform = "scaleY(1)";
      kk.style.opacity = nn.style.opacity = jj.style.opacity = 1;
    } else {
      bar.style.animation = "barIn .35s cubic-bezier(.2,.7,.3,1) .1s forwards";
      panel.style.animation = animPanel + " .5s cubic-bezier(.2,.7,.3,1) .28s forwards";
      kk.style.animation = "riseIn .45s ease .62s forwards";
      nn.style.animation = "riseIn .5s ease .74s forwards";
      jj.style.animation = "riseIn .45s ease .88s forwards";
    }
  }

  monta("panelSx", "barSx", D.a, "panelInSx");
  monta("panelDx", "barDx", D.b, "panelInDx");

  function replay() { location.reload(); }
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") replay(); });
  document.addEventListener("dblclick", replay);
})();
</script>
</body>
</html>
