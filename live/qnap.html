<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magazzino QNAP · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  :root{--navy:#0A0F24;--navy-2:#121936;--riga:#232B4A;--oro:#C9A24B;--oro-chiaro:#E3C271;--carta:#F5F1E6;--fumo:#9AA0B5;--inchiostro:#E9ECF5;--blu:#2D8CEB;--rosso:#C24A4A;--verde:#3E9F5C;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--navy);color:var(--inchiostro);font:14px/1.4 'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100%;}
  header.page{display:flex;align-items:center;gap:16px;padding:14px 20px 10px;margin-top:52px;border-bottom:1px solid var(--riga);flex-wrap:wrap;}
  header .stato{padding-right:150px;} /* l'orologio della barra di nav.js sta li' sopra */
  header .eyebrow{font-family:'Mazzard',sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);}
  header h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:.02em;}
  header .stato{margin-left:auto;font-size:12px;color:var(--fumo);display:flex;align-items:center;gap:10px;}
  header .stato b{color:var(--inchiostro);font-weight:600;}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--riga);color:var(--fumo);}
  .chip.si{border-color:var(--verde);color:#7ED494;} .chip.no{border-color:var(--rosso);color:#F0A0A0;}
  .barra{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--riga);background:var(--navy-2);flex-wrap:wrap;}
  .briciole{display:flex;align-items:center;gap:4px;flex:1 1 320px;min-width:0;overflow:hidden;font-size:13px;}
  .briciole a{color:var(--oro-chiaro);text-decoration:none;white-space:nowrap;cursor:pointer;}
  .briciole a:hover{text-decoration:underline;}
  .briciole i{color:var(--fumo);font-style:normal;}
  .briciole b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .barra input[type=search]{flex:0 1 220px;min-width:120px;font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--riga);border-radius:6px;background:var(--navy);color:var(--inchiostro);}
  .b{font:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid var(--riga);background:transparent;color:var(--inchiostro);cursor:pointer;white-space:nowrap;}
  .b:hover{border-color:var(--oro);} .b.oro{background:var(--oro);color:var(--navy);border-color:var(--oro);} .b.oro:hover{background:var(--oro-chiaro);}
  .b:disabled{opacity:.4;cursor:default;border-color:var(--riga);}
  main{flex:1 1 auto;display:grid;grid-template-columns:220px 1fr 320px;min-height:0;}
  @media (max-width:980px){main{grid-template-columns:1fr;} aside,#lato{display:none;}}
  aside{border-right:1px solid var(--riga);overflow:auto;padding:10px 0;}
  aside .et{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fumo);padding:6px 16px;}
  aside .cart{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;font-size:13px;border-left:3px solid transparent;}
  aside .cart:hover{background:var(--navy-2);} aside .cart.qui{border-left-color:var(--oro);background:var(--navy-2);}
  aside .cart.dentro{outline:2px dashed var(--oro);outline-offset:-4px;}
  .ico{width:16px;height:16px;flex:none;}
  .ico.cartella{fill:var(--oro);} .ico.file{fill:var(--fumo);} .ico.video{fill:var(--blu);}
  #lista{overflow:auto;min-height:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{position:sticky;top:0;background:var(--navy-2);text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fumo);padding:8px 12px;border-bottom:1px solid var(--riga);cursor:pointer;user-select:none;white-space:nowrap;}
  thead th.on{color:var(--oro-chiaro);}
  tbody td{padding:7px 12px;border-bottom:1px solid #1A2140;white-space:nowrap;vertical-align:middle;}
  tbody td.nome{white-space:normal;max-width:0;width:52%;}
  tbody td.nome .n{display:flex;align-items:center;gap:8px;}
  tbody td.nome .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  tbody td.nome .part{display:block;font-size:11.5px;color:var(--oro-chiaro);margin:2px 0 0 24px;}
  tbody td.num{text-align:right;color:var(--fumo);font-variant-numeric:tabular-nums;}
  tbody tr{cursor:default;}
  tbody tr:hover{background:#151C3A;}
  tbody tr.sel{background:#1E2A55;}
  tbody tr.dentro{outline:2px dashed var(--oro);outline-offset:-3px;}
  tbody tr[draggable=true]{cursor:grab;}
  tbody td.nome input{font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--blu);border-radius:4px;background:var(--navy);color:var(--inchiostro);width:100%;}
  .vuoto{padding:40px 20px;color:var(--fumo);text-align:center;}
  #lato{border-left:1px solid var(--riga);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;}
  #lato .et{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fumo);}
  #lato h3{font-family:'Mazzard',sans-serif;font-weight:700;font-size:15px;margin:0;word-break:break-word;}
  #lato .meta{font-size:12.5px;color:var(--fumo);display:grid;grid-template-columns:auto 1fr;gap:3px 10px;}
  #lato .meta b{color:var(--inchiostro);font-weight:500;}
  #lato video,#lato img{width:100%;border-radius:6px;background:#000;max-height:200px;object-fit:contain;}
  #lato .azioni{display:flex;flex-wrap:wrap;gap:6px;}
  #avviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--carta);color:var(--navy);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;}
  #avviso.su{opacity:1;}
  #avviso.male{background:#F3D2D2;color:#5A0E12;}
  .foglio{position:fixed;inset:0;background:rgba(4,6,16,.7);display:flex;align-items:center;justify-content:center;z-index:50;}
  .foglio > div{background:var(--navy-2);border:1px solid var(--riga);border-radius:10px;width:min(520px,92vw);max-height:80vh;display:flex;flex-direction:column;}
  .foglio header{padding:12px 16px;border-bottom:1px solid var(--riga);font-family:'Mazzard',sans-serif;font-weight:700;}
  .foglio .corpo{padding:12px 16px;overflow:auto;}
  .foglio footer{padding:10px 16px;border-top:1px solid var(--riga);display:flex;gap:8px;justify-content:flex-end;}
  .foglio .cart{padding:6px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center;}
  .foglio .cart:hover,.foglio .cart.qui{background:var(--navy);}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--riga);border-radius:3px;padding:0 4px;color:var(--fumo);}
  .aiuto{font-size:11.5px;color:var(--fumo);padding:6px 20px;border-top:1px solid var(--riga);display:flex;gap:16px;flex-wrap:wrap;}
</style>
</head>
<body>
<script src="chiave.js"></script>
<script src="nav.js"></script>
<header class="page">
  <div><div class="eyebrow">Como TV · Magazzino</div><h1>QNAP · quello che c'è dentro</h1></div>
  <div class="stato"><span id="conto">…</span><span class="chip" id="chipScrittura">…</span><button class="b" id="btnRicarica" title="rilegge la cartella">&#8635;</button></div>
</header>
<div class="barra">
  <div class="briciole" id="briciole"></div>
  <input type="search" id="cerca" placeholder="filtra per nome o partita">
  <button class="b" id="btnNuova" title="una cartella nuova qui">+ Cartella</button>
  <button class="b" id="btnRinomina" disabled title="rinomina la voce scelta (F2 o Invio)">Rinomina</button>
  <button class="b" id="btnSposta" disabled title="sposta la voce scelta in un'altra cartella (o trascinala)">Sposta in…</button>
  <button class="b oro" id="btnApri" disabled title="apre la partita nel MAM Archivio">Apri nel MAM</button>
</div>
<main>
  <aside id="cartelle"></aside>
  <div id="lista"></div>
  <div id="lato"><div class="vuoto">Scegli un file per vederne i dettagli.</div></div>
</main>
<div class="aiuto"><span><kbd>↑</kbd><kbd>↓</kbd> scegli</span><span><kbd>Invio</kbd> entra / rinomina</span><span><kbd>⌫</kbd> cartella sopra</span><span>trascina un file su una cartella per spostarlo</span></div>
<div id="avviso"></div>
<script>
(function () {
  "use strict";
  var PONTE = /^\/como-tv-dev\//.test(location.pathname) ? "/como-tv-dev/api" : "/api";
  var BASE = PONTE.replace(/\/api$/, "");
  var MAM = "mam.html?modo=archivio";
  var TOKEN = ""; try { TOKEN = (window.ChiaveComoTV ? ChiaveComoTV.valore() : "") || ""; } catch (e) {}
  var VIA = "", ELENCO = [], SEL = -1, ORDINE = { per: "nome", giu: false }, SCRIVIBILE = false, CERCA = "", RADICE_CARTELLE = [];
  var RADICE = "qnap", RADICI = [], SOLO_VISTA = false, PESI = {};
  function el(id) { return document.getElementById(id); }
  function pulito(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function manda(c) {
    c.token = TOKEN;
    return fetch(PONTE, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(c) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) throw new Error(d.errore || "il ponte ha detto no"); return d; });
  }
  var AVVISO_T = null;
  function dice(t, bene) {
    var a = el("avviso"); a.textContent = t; a.className = "su" + (bene ? "" : " male");
    clearTimeout(AVVISO_T); AVVISO_T = setTimeout(function () { a.className = ""; }, bene ? 2200 : 4500);
  }
  function peso(b) {
    if (!b) return "—";
    if (b > 1e9) return (b / 1e9).toFixed(b > 1e10 ? 0 : 1) + " GB";
    if (b > 1e6) return Math.round(b / 1e6) + " MB";
    if (b > 1e3) return Math.round(b / 1e3) + " KB";
    return b + " B";
  }
  function quando(ms) {
    var d = new Date(ms); if (isNaN(d)) return "";
    return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "2-digit" }) + " " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }
  var ICONE = {
    cartella: '<svg class="ico cartella" viewBox="0 0 16 16"><path d="M1.5 3.5h4l1.5 1.5h7.5v8h-13z"/></svg>',
    video: '<svg class="ico video" viewBox="0 0 16 16"><path d="M1.5 3.5h9v9h-9zM11.5 6l3-1.5v7l-3-1.5z"/></svg>',
    file: '<svg class="ico file" viewBox="0 0 16 16"><path d="M3 1.5h6l4 4v9H3z"/></svg>'
  };
  function icona(v) { return v.tipo === "cartella" ? ICONE.cartella : v.video ? ICONE.video : ICONE.file; }

  // ── LA CARTELLA ──
  function carica(via, poi) {
    manda({ tipo: "clip-qnap-elenco", via: via || "", radice: RADICE }).then(function (d) {
      VIA = d.via || ""; ELENCO = d.elenco || []; SCRIVIBILE = !!d.scrivibile; SOLO_VISTA = !!d.soloVista; SEL = -1;
      RADICE = d.radice || RADICE; RADICI = d.radici || RADICI;
      if (!VIA) RADICE_CARTELLE = ELENCO.filter(function (v) { return v.tipo === "cartella"; });
      el("chipScrittura").textContent = SOLO_VISTA ? "solo vista" : SCRIVIBILE ? "in scrittura" : "sola lettura";
      el("chipScrittura").className = "chip " + (SCRIVIBILE ? "si" : "no");
      el("chipScrittura").title = SOLO_VISTA ? "le cartelle della VM si guardano e basta: per liberare spazio si decide insieme" : SCRIVIBILE ? "rinominare e spostare funziona" : "la QNAP e' montata in sola lettura sulla VM: si guarda e si apre, per rinominare o spostare va montata in scrittura";
      el("btnNuova").disabled = SOLO_VISTA;
      try { localStorage.setItem("qnap-via", VIA); localStorage.setItem("qnap-radice", RADICE); } catch (e) {}
      disegna(); disegnaCartelle(); disegnaLato(); pesaCartelle();
      if (poi) poi(d);
    }).catch(function (e) { dice(e.message); });
  }
  function pesaCartelle() {
    var da = ELENCO.filter(function (v) { return v.tipo === "cartella" && PESI[RADICE + "|" + v.via] === undefined; }).slice(0, 40);
    var giro = function () {
      var v = da.shift(); if (!v) return;
      PESI[RADICE + "|" + v.via] = null;
      manda({ tipo: "clip-qnap-peso", via: v.via, radice: RADICE }).then(function (d) {
        PESI[RADICE + "|" + v.via] = d.peso; v.peso = d.peso; v.contenuto = d.file + " file" + (d.tronco ? "+" : "");
        var tr = el("lista").querySelector('tr[data-i="' + ELENCO.indexOf(v) + '"] td.num'); if (tr) tr.textContent = peso(d.peso);
        var tot = el("conto"); if (tot) disegnaConto();
        giro();
      }).catch(giro);
    };
    giro();
  }
  function disegnaConto() {
    var v = visibili();
    el("conto").innerHTML = "<b>" + v.length + "</b> " + (v.length === 1 ? "voce" : "voci") + (CERCA ? " di " + ELENCO.length : "") + " \u00b7 " + peso(v.reduce(function (a, x) { return a + (x.peso || 0); }, 0));
  }
  function briciole() {
    var nomeRadice = (RADICI.filter(function (r) { return r.id === RADICE; })[0] || { nome: "QNAP" }).nome;
    var p = VIA ? VIA.split("/") : [], h = '<a data-via="">' + pulito(nomeRadice) + '</a>';
    var acc = "";
    p.forEach(function (x, i) {
      acc += (acc ? "/" : "") + x;
      h += '<i>›</i>' + (i === p.length - 1 ? '<b>' + pulito(x) + '</b>' : '<a data-via="' + pulito(acc) + '">' + pulito(x) + '</a>');
    });
    el("briciole").innerHTML = h;
  }
  function visibili() {
    var q = CERCA.toLowerCase();
    var v = ELENCO.filter(function (x) { return !q || x.nome.toLowerCase().indexOf(q) >= 0 || (x.partita || "").toLowerCase().indexOf(q) >= 0; });
    var per = ORDINE.per, giu = ORDINE.giu ? -1 : 1;
    v.sort(function (a, b) {
      if (a.tipo !== b.tipo) return a.tipo === "cartella" ? -1 : 1;
      if (per === "peso") return (a.peso - b.peso) * giu;
      if (per === "quando") return (a.quando - b.quando) * giu;
      if (per === "partita") return String(a.partita || "").localeCompare(String(b.partita || ""), "it") * giu;
      return a.nome.localeCompare(b.nome, "it", { numeric: true }) * giu;
    });
    return v;
  }
  function disegna() {
    briciole();
    var v = visibili();
    disegnaConto();
    if (!v.length) { el("lista").innerHTML = '<div class="vuoto">' + (ELENCO.length ? "Niente con quel nome." : "Cartella vuota.") + '</div>'; return; }
    var th = function (k, t) { return '<th data-per="' + k + '" class="' + (ORDINE.per === k ? "on" : "") + '">' + t + (ORDINE.per === k ? (ORDINE.giu ? " ▾" : " ▴") : "") + '</th>'; };
    var righe = v.map(function (x, i) {
      return '<tr data-i="' + ELENCO.indexOf(x) + '" class="' + (ELENCO.indexOf(x) === SEL ? "sel" : "") + '"' + (x.tipo === "file" ? ' draggable="true"' : "") + '>' +
        '<td class="nome"><div class="n">' + icona(x) + '<span title="' + pulito(x.nome) + '">' + pulito(x.nome) + '</span></div>' +
        (x.partita ? '<span class="part">' + pulito(x.partita) + (x.rec || x.reg ? " · nel MAM" : "") + '</span>' : "") + '</td>' +
        '<td class="num">' + (x.tipo === "cartella" ? (x.peso ? peso(x.peso) : "…") : peso(x.peso)) + '</td>' +
        '<td class="num">' + quando(x.quando) + '</td>' +
        '<td>' + (x.tipo === "cartella" ? "cartella" : (x.est || "file").toUpperCase()) + '</td></tr>';
    }).join("");
    el("lista").innerHTML = '<table><thead><tr>' + th("nome", "Nome") + th("peso", "Peso") + th("quando", "Modificato") + th("partita", "Tipo") + '</tr></thead><tbody>' + righe + '</tbody></table>';
    var sel = el("lista").querySelector("tr.sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
    tasti();
  }
  function disegnaCartelle() {
    var h = '<div class="et">Magazzini</div>' + RADICI.map(function (r) {
      return '<div class="cart' + (r.id === RADICE ? " qui" : "") + '" data-radice="' + pulito(r.id) + '">' + ICONE.cartella + '<span>' + pulito(r.nome) + '</span></div>';
    }).join("") + '<div class="et" style="margin-top:10px">Cartelle</div><div class="cart' + (VIA === "" ? " qui" : "") + '" data-via="">' + ICONE.cartella + '<span>radice</span></div>';
    RADICE_CARTELLE.forEach(function (c) {
      h += '<div class="cart' + (VIA === c.via || VIA.indexOf(c.via + "/") === 0 ? " qui" : "") + '" data-via="' + pulito(c.via) + '">' + ICONE.cartella + '<span>' + pulito(c.nome) + '</span></div>';
    });
    if (VIA) ELENCO.filter(function (v) { return v.tipo === "cartella"; }).forEach(function (c) {
      h += '<div class="cart" style="padding-left:32px" data-via="' + pulito(c.via) + '">' + ICONE.cartella + '<span>' + pulito(c.nome) + '</span></div>';
    });
    el("cartelle").innerHTML = h;
  }
  function tasti() {
    var x = ELENCO[SEL];
    el("btnRinomina").disabled = !x;
    el("btnSposta").disabled = !x;
    el("btnApri").disabled = !(x && (x.rec || x.reg));
  }
  function disegnaLato() {
    var x = ELENCO[SEL], l = el("lato");
    if (!x) { l.innerHTML = '<div class="vuoto">Scegli un file per vederne i dettagli.</div>'; return; }
    var h = '<div class="et">' + (x.tipo === "cartella" ? "Cartella" : (x.est || "file").toUpperCase()) + '</div><h3>' + pulito(x.nome) + '</h3>';
    h += '<div class="meta"><span>dove</span><b>' + pulito(VIA || "QNAP") + '</b>' +
         (x.tipo === "file" ? '<span>peso</span><b>' + peso(x.peso) + '</b>' : "") +
         '<span>modificato</span><b>' + quando(x.quando) + '</b>' +
         (x.partita ? '<span>partita</span><b>' + pulito(x.partita) + '</b>' : "") +
         (x.tipo === "file" && x.video && !x.partita ? '<span>archivio</span><b>non ancora indicizzato: il MAM lo riconosce alla prossima scansione</b>' : "") + '</div>';
    if (x.video || x.immagine) h += '<div id="anteprima"><div class="vuoto" style="padding:14px">anteprima…</div></div>';
    h += '<div class="azioni">' +
         (x.rec || x.reg ? '<a class="b oro" href="' + MAM + (x.rec ? "&apri=" + encodeURIComponent(x.rec) : "") + '" target="_blank" rel="noopener">Apri nel MAM</a>' : "") +
         (x.tipo === "file" ? '<a class="b" id="latoScarica" href="#" title="scarica il file intero sul computer, col suo nome">\u2193 Scarica (' + peso(x.peso) + ')</a>' : "") +
         (x.tipo === "cartella" ? '<button class="b" id="latoEntra">Entra</button>' : "") +
         '<button class="b" id="latoRinomina">Rinomina</button><button class="b" id="latoSposta">Sposta in…</button></div>';
    l.innerHTML = h;
    if (el("latoEntra")) el("latoEntra").addEventListener("click", function () { carica(x.via); });
    if (el("latoScarica")) el("latoScarica").addEventListener("click", function (e) {
      e.preventDefault();
      manda({ tipo: "clip-qnap-via", via: x.via, radice: RADICE }).then(function (d) {
        var a = document.createElement("a"); a.href = BASE + d.via + "&scarica=1"; a.download = x.nome; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 1000);
        dice("Scarico " + x.nome + " (" + peso(x.peso) + ")\u2026 il browser lo mette nei Download.", true);
      }).catch(function (er) { dice(er.message); });
    });
    el("latoRinomina").addEventListener("click", function () { rinominaInLinea(); });
    el("latoSposta").addEventListener("click", function () { scegliCartella(); });
    if (x.video || x.immagine) {
      manda({ tipo: "clip-qnap-via", via: x.via, radice: RADICE }).then(function (d) {
        var a = el("anteprima"); if (!a) return;
        a.innerHTML = x.video ? '<video controls preload="metadata" muted playsinline src="' + BASE + d.via + '"></video>' : '<img src="' + BASE + d.via + '" alt="">';
      }).catch(function () { var a = el("anteprima"); if (a) a.innerHTML = ""; });
    }
  }

  // ── LE AZIONI ──
  function scegli(i) { SEL = i; disegna(); disegnaLato(); }
  function entra(x) { if (x && x.tipo === "cartella") carica(x.via); else if (x && (x.rec || x.reg)) window.open(MAM + (x.rec ? "&apri=" + encodeURIComponent(x.rec) : ""), "_blank"); }
  function su() { if (!VIA) return; carica(VIA.split("/").slice(0, -1).join("/")); }
  function chiediScrittura() {
    if (SOLO_VISTA) { dice("Le cartelle della VM si guardano e basta: per liberare spazio si decide insieme, non da qui."); return false; }
    if (!SCRIVIBILE) { dice("La QNAP e' montata in sola lettura sulla VM: si guarda e si apre, ma per rinominare o spostare va montata in scrittura."); return false; }
    return true;
  }
  function rinominaInLinea() {
    var x = ELENCO[SEL]; if (!x || !chiediScrittura()) return;
    var tr = el("lista").querySelector('tr[data-i="' + SEL + '"] td.nome'); if (!tr) return;
    var estensione = x.tipo === "file" && x.est ? "." + x.est : "";
    var base = estensione && x.nome.toLowerCase().endsWith(estensione) ? x.nome.slice(0, -estensione.length) : x.nome;
    tr.innerHTML = '<input type="text" value="' + pulito(x.nome) + '">';
    var inp = tr.querySelector("input"); inp.focus(); inp.setSelectionRange(0, base.length);
    var fatto = false;
    var conferma = function () {
      if (fatto) return; fatto = true;
      var nuovo = inp.value.trim();
      if (!nuovo || nuovo === x.nome) { disegna(); return; }
      manda({ tipo: "clip-qnap-rinomina", via: x.via, nome: nuovo, radice: RADICE }).then(function () { dice("Rinominato.", true); carica(VIA, function () { var k = ELENCO.findIndex(function (z) { return z.nome === nuovo; }); if (k >= 0) scegli(k); }); })
        .catch(function (e) { dice(e.message); disegna(); });
    };
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); conferma(); } if (e.key === "Escape") { fatto = true; disegna(); } e.stopPropagation(); });
    inp.addEventListener("blur", conferma);
  }
  function sposta(x, dove) {
    if (!chiediScrittura()) return;
    if (dove === VIA) return;
    manda({ tipo: "clip-qnap-sposta", via: x.via, dove: dove, radice: RADICE }).then(function () { dice("Spostato in " + (dove || "QNAP") + ".", true); carica(VIA); })
      .catch(function (e) { dice(e.message); });
  }
  function scegliCartella() {
    var x = ELENCO[SEL]; if (!x || !chiediScrittura()) return;
    manda({ tipo: "clip-qnap-elenco", via: "", radice: RADICE }).then(function (d) {
      var cartelle = [{ nome: "QNAP (radice)", via: "" }].concat((d.elenco || []).filter(function (v) { return v.tipo === "cartella"; }));
      if (VIA) ELENCO.filter(function (v) { return v.tipo === "cartella" && v !== x; }).forEach(function (c) { cartelle.push({ nome: (VIA ? VIA + "/" : "") + c.nome, via: c.via }); });
      var box = document.createElement("div"); box.className = "foglio";
      box.innerHTML = '<div><header>Sposta “' + pulito(x.nome) + '” in…</header><div class="corpo">' +
        cartelle.map(function (c) { return '<div class="cart" data-via="' + pulito(c.via) + '">' + ICONE.cartella + '<span>' + pulito(c.nome) + '</span></div>'; }).join("") +
        '</div><footer><button class="b" id="spAnnulla">Annulla</button></footer></div>';
      document.body.appendChild(box);
      var via = function () { box.remove(); };
      box.addEventListener("click", function (e) { if (e.target === box) via(); });
      el("spAnnulla").addEventListener("click", via);
      box.querySelectorAll(".cart").forEach(function (c) { c.addEventListener("click", function () { via(); sposta(x, c.dataset.via); }); });
    }).catch(function (e) { dice(e.message); });
  }
  function nuovaCartella() {
    if (!chiediScrittura()) return;
    var nome = prompt("Nome della cartella nuova (dentro " + (VIA || "QNAP") + "):", "");
    if (!nome) return;
    manda({ tipo: "clip-qnap-cartella", via: VIA, nome: nome, radice: RADICE }).then(function () { dice("Cartella creata.", true); carica(VIA); }).catch(function (e) { dice(e.message); });
  }

  // ── I GESTI ──
  el("lista").addEventListener("click", function (e) {
    var th = e.target.closest("th"); if (th) { var k = th.dataset.per; if (ORDINE.per === k) ORDINE.giu = !ORDINE.giu; else ORDINE = { per: k, giu: false }; disegna(); return; }
    var tr = e.target.closest("tr[data-i]"); if (!tr) return;
    scegli(+tr.dataset.i);
  });
  el("lista").addEventListener("dblclick", function (e) {
    var tr = e.target.closest("tr[data-i]"); if (!tr) return;
    entra(ELENCO[+tr.dataset.i]);
  });
  el("briciole").addEventListener("click", function (e) { var a = e.target.closest("a[data-via]"); if (a) carica(a.dataset.via); });
  el("cartelle").addEventListener("click", function (e) {
    var r = e.target.closest(".cart[data-radice]"); if (r) { RADICE = r.dataset.radice; RADICE_CARTELLE = []; carica(""); return; }
    var c = e.target.closest(".cart[data-via]"); if (c) carica(c.dataset.via);
  });
  el("cerca").addEventListener("input", function () { CERCA = this.value.trim(); disegna(); });
  el("btnRicarica").addEventListener("click", function () { carica(VIA); });
  el("btnNuova").addEventListener("click", nuovaCartella);
  el("btnRinomina").addEventListener("click", rinominaInLinea);
  el("btnSposta").addEventListener("click", scegliCartella);
  el("btnApri").addEventListener("click", function () { entra(ELENCO[SEL]); });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    var v = visibili(), pos = v.findIndex(function (x) { return ELENCO.indexOf(x) === SEL; });
    if (e.key === "ArrowDown") { e.preventDefault(); scegli(ELENCO.indexOf(v[Math.min(v.length - 1, pos + 1)])); }
    else if (e.key === "ArrowUp") { e.preventDefault(); scegli(ELENCO.indexOf(v[Math.max(0, pos - 1)])); }
    else if (e.key === "Enter") { e.preventDefault(); var x = ELENCO[SEL]; if (x && x.tipo === "cartella") entra(x); else if (x) rinominaInLinea(); }
    else if (e.key === "F2") { e.preventDefault(); rinominaInLinea(); }
    else if (e.key === "Backspace") { e.preventDefault(); su(); }
    else if (e.key === "Escape") { SEL = -1; disegna(); disegnaLato(); }
  });
  // trascinare un file su una cartella (in lista o nella colonna) lo sposta
  var TRASCINO = null;
  el("lista").addEventListener("dragstart", function (e) { var tr = e.target.closest("tr[data-i]"); if (!tr) return; TRASCINO = ELENCO[+tr.dataset.i]; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", TRASCINO.via); } catch (x) {} });
  el("lista").addEventListener("dragend", function () { TRASCINO = null; document.querySelectorAll(".dentro").forEach(function (x) { x.classList.remove("dentro"); }); });
  function bersaglio(e) {
    var tr = e.target.closest ? e.target.closest("tr[data-i]") : null;
    if (tr && ELENCO[+tr.dataset.i] && ELENCO[+tr.dataset.i].tipo === "cartella") return { el: tr, via: ELENCO[+tr.dataset.i].via };
    var c = e.target.closest ? e.target.closest(".cart[data-via]") : null;
    if (c) return { el: c, via: c.dataset.via };
    return null;
  }
  ["lista", "cartelle"].forEach(function (id) {
    el(id).addEventListener("dragover", function (e) { if (!TRASCINO) return; var b = bersaglio(e); document.querySelectorAll(".dentro").forEach(function (x) { x.classList.remove("dentro"); }); if (b) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; b.el.classList.add("dentro"); } });
    el(id).addEventListener("drop", function (e) { if (!TRASCINO) return; var b = bersaglio(e); if (!b) return; e.preventDefault(); var x = TRASCINO; TRASCINO = null; sposta(x, b.via); });
  });

  var via0 = ""; try { via0 = localStorage.getItem("qnap-via") || ""; RADICE = localStorage.getItem("qnap-radice") || "qnap"; } catch (e) {}
  var mr = /(\?|&)radice=([a-z]+)/.exec(location.search); if (mr) RADICE = mr[2];
  var m = /(\?|&)via=([^&]+)/.exec(location.search); if (m) via0 = decodeURIComponent(m[2]);
  carica(via0);
})();
</script>
</body>
</html>
