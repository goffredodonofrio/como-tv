<!DOCTYPE html>
<html lang="it">
<head>
<script>
(function () {
  if (location.hostname.indexOf("github.io") < 0) return;
  location.replace("https://projects-cloud.it" + location.pathname + location.search + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stato foto giocatori · Como TV</title>
<style>
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Mazzard';src:url('../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'DM Sans';src:url('../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}
  :root{
    --navy-900:#0A0F24;--navy-800:#141B3C;--navy-700:#20284E;
    --gold:#C9A24B;--gold-bright:#E3C271;--ivory:#F5F1E6;--ivory-dim:#D8D2C2;
    --fg-3:#8A8B96;--line-2:rgba(245,241,230,.08);--line-gold:rgba(201,162,75,.28);
    --panel:rgba(16,22,48,.66);--ok:#4FCB8B;--red:#E5655E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{font-family:'DM Sans',system-ui,sans-serif;font-weight:500;line-height:1.5;color:var(--ivory);min-height:100vh;
    background-color:#0A0F24;background-image:radial-gradient(90% 70% at 20% 8%, rgba(36,64,138,.5), transparent 55%),
    radial-gradient(80% 80% at 92% 108%, rgba(201,162,75,.16), transparent 55%),linear-gradient(165deg,#141B3C 0%,#0E1430 48%,#0A0F24 100%);
    background-attachment:fixed;}
  a{color:var(--gold-bright);text-decoration:none;}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 16px 90px;}
  .nav{display:flex;align-items:center;gap:12px;margin:14px 0 22px;flex-wrap:wrap;}
  .nav a.back{font-family:'Mazzard',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ivory-dim);border:1px solid var(--line-2);border-radius:7px;padding:12px 18px;background:rgba(245,241,230,.04);}
  .nav a.back:hover{color:var(--gold-bright);border-color:var(--line-gold);}
  .sub{font-family:'Mazzard',sans-serif;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Mazzard',sans-serif;font-weight:800;font-size:34px;text-transform:uppercase;line-height:1;margin-bottom:8px;}
  .nota{color:var(--ivory-dim);font-size:14px;max-width:820px;margin-bottom:20px;}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 26px;}
  .k{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;}
  .k b{display:block;font-family:'Mazzard',sans-serif;font-size:26px;color:var(--gold-bright);line-height:1.1;}
  .k span{font-size:13px;color:var(--ivory-dim);}
  .cerca{width:100%;max-width:420px;background:rgba(245,241,230,.05);border:1px solid var(--line-2);border-radius:8px;color:var(--ivory);
    font:inherit;padding:11px 14px;margin:0 0 18px;}
  .cerca:focus{outline:none;border-color:var(--line-gold);}
  details{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;margin:0 0 12px;overflow:hidden;}
  summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;}
  summary::-webkit-details-marker{display:none;}
  summary .t{font-family:'Mazzard',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em;}
  summary .n{font-variant-numeric:tabular-nums;color:var(--ivory-dim);white-space:nowrap;}
  .barra{height:4px;background:rgba(245,241,230,.08);}
  .barra i{display:block;height:100%;background:var(--gold);}
  .tab{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line-2);vertical-align:top;}
  th{color:var(--fg-3);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;}
  td.num{white-space:nowrap;font-variant-numeric:tabular-nums;}
  td.sq{white-space:nowrap;font-weight:700;}
  .ok{color:var(--ok);} .no{color:var(--red);}
  td.manc{color:var(--ivory-dim);min-width:260px;}
  .vuoto{color:var(--fg-3);padding:30px 0;}
  @media (max-width:640px){h1{font-size:26px;} td.sq{white-space:normal;}}
</style>
</head>
<body>
<div class="wrap">
  <script src="nav.js"></script>
  <div class="nav">
    <a class="back" href="magazzino.html">&larr; Magazzino</a>
    <a class="back" href="magazzino-foto.html">Carica foto premium</a>
  </div>
  <div class="sub">Como TV · Grafiche Live</div>
  <h1>Stato foto giocatori</h1>
  <p class="nota" id="nota">Carico lo stato&hellip;</p>
  <div class="kpi" id="kpi"></div>
  <input class="cerca" id="cerca" type="search" placeholder="Cerca squadra o giocatore&hellip;">
  <div id="elenco"></div>
</div>
<script>
(function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function num(n) { return Number(n || 0).toLocaleString("it-IT"); }
  var DATI = null;

  function disegna(filtro) {
    var f = (filtro || "").trim().toLowerCase(), h = "";
    DATI.competizioni.forEach(function (c, i) {
      var sq = c.squadre.filter(function (s) {
        return !f || s.squadra.toLowerCase().indexOf(f) >= 0 || (s.mancano || []).join(" ").toLowerCase().indexOf(f) >= 0;
      });
      if (!sq.length) return;
      var tot = 0, con = 0;
      c.squadre.forEach(function (s) { tot += s.totale || 0; con += s.con_foto || 0; });
      var pc = tot ? Math.round(100 * con / tot) : 0;
      h += '<details' + (f || i < 2 ? " open" : "") + '><summary><span class="t">' + esc(c.nome) + '</span>' +
           '<span class="n">' + num(con) + " / " + num(tot) + " · " + pc + '%</span></summary>' +
           '<div class="barra"><i style="width:' + pc + '%"></i></div><div class="tab"><table>' +
           '<tr><th>Squadra</th><th>Foto</th><th>Allenatore</th><th>Giocatori mancanti</th></tr>';
      sq.forEach(function (s) {
        if (s.errore) { h += '<tr><td class="sq">' + esc(s.squadra) + '</td><td colspan="3" class="no">non letta: ' + esc(s.errore) + '</td></tr>'; return; }
        var al = (s.allenatore ? esc(s.allenatore) : '<span class="no">senza nome</span>') +
                 ' · <span class="' + (s.allenatore_foto ? "ok" : "no") + '">' + (s.allenatore_foto ? "foto" : "senza foto") + '</span>';
        h += '<tr><td class="sq">' + esc(s.squadra) + '</td><td class="num">' + s.con_foto + " / " + s.totale + '</td><td>' + al + '</td>' +
             '<td class="manc">' + (s.mancano && s.mancano.length ? esc(s.mancano.join(", ")) : '<span class="ok">nessuno</span>') + '</td></tr>';
      });
      h += "</table></div></details>";
    });
    document.getElementById("elenco").innerHTML = h || '<div class="vuoto">Nessun risultato.</div>';
  }

  fetch("stato-foto.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      DATI = d;
      var tot = 0, con = 0;
      d.competizioni.forEach(function (c) { c.squadre.forEach(function (s) { tot += s.totale || 0; con += s.con_foto || 0; }); });
      document.getElementById("nota").textContent = "Aggiornato il " + d.generato + ". Per ogni giocatore delle rose ESPN (e delle rose delle giovanili del Como) si chiede al magazzino la foto, come fa Formazioni Premium. Si aggiorna da solo ogni mattina dopo l'import delle 5. Le rose ESPN comprendono anche ragazzi di Primavera/U23 e giocatori partiti: non tutti i mancanti vanno cercati.";
      document.getElementById("kpi").innerHTML =
        '<div class="k"><b>' + num(con) + " / " + num(tot) + '</b><span>giocatori con foto (' + (tot ? Math.round(100 * con / tot) : 0) + '%)</span></div>' +
        '<div class="k"><b>' + num(d.nuove_24h) + '</b><span>foto caricate nelle ultime 24 ore</span></div>' +
        '<div class="k"><b>' + num(d.nuove_7g) + '</b><span>foto caricate negli ultimi 7 giorni</span></div>' +
        '<div class="k"><b>' + num(d.foto_allenatori_magazzino) + '</b><span>foto allenatori in magazzino</span></div>' +
        '<div class="k"><b>' + num(d.allenatori_con_nome) + '</b><span>allenatori con nome automatico</span></div>';
      disegna("");
    })
    .catch(function (e) { document.getElementById("nota").textContent = "Stato non disponibile: " + e.message; });

  document.getElementById("cerca").addEventListener("input", function (e) { if (DATI) disegna(e.target.value); });
})();
</script>
<script src="dev.js"></script>
</body>
</html>
