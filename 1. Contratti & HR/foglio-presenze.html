<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como TV — Foglio Presenze</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d1a38 0%, #1a2d5a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Background animation */
    .bg-glow {
      position: fixed;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 150, 46, 0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 100%;
      padding: 20px;
    }

    /* Login screen */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      font-size: 28px;
      font-weight: 800;
      color: #0d1a38;
    }

    .logo-text {
      color: #0d1a38;
      letter-spacing: -0.5px;
    }

    .logo-text-gold {
      color: #b8962e;
      margin-left: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #0d1a38;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      background: white;
      color: #0d1a38;
    }

    .form-group select:hover,
    .form-group input:hover {
      border-color: #b8962e;
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: #b8962e;
      box-shadow: 0 0 0 3px rgba(184, 150, 46, 0.1);
    }

    .form-group select {
      appearance: none;
      padding-right: 40px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><path fill="%23b8962e" d="M4 6l4 4 4-4" stroke="%23b8962e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 40px;
    }

    .error-message {
      display: none;
      background: #fee;
      color: #c33;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      border-left: 4px solid #c33;
      animation: slideDown 0.3s ease;
    }

    .error-message.show {
      display: block;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0d1a38 0%, #1a2d5a 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(13, 26, 56, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    /* Attendance screen */
    .attendance-screen {
      display: none;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .attendance-screen.active {
      display: block;
    }

    .header {
      background: linear-gradient(135deg, #0d1a38 0%, #1a2d5a 100%);
      color: white;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 40px;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      right: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(184, 150, 46, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .header-user {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
    }

    .user-badge {
      background: rgba(184, 150, 46, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      color: #ffd700;
      font-size: 13px;
      font-weight: 600;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Attendance table */
    .attendance-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .attendance-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .attendance-table thead {
      background: linear-gradient(135deg, #0d1a38 0%, #1a2d5a 100%);
      color: white;
    }

    .attendance-table th {
      padding: 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(13, 26, 56, 0.1);
    }

    .attendance-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      font-size: 14px;
      color: #333;
    }

    .attendance-table tbody tr:hover {
      background: rgba(184, 150, 46, 0.05);
    }

    .attendance-table tbody tr:last-child td {
      border-bottom: none;
    }

    .time-cell {
      font-weight: 500;
      color: #0d1a38;
    }

    .notes-cell {
      font-size: 13px;
      color: #666;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
      margin: 8px 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-card {
        padding: 32px 24px;
        max-width: 100%;
      }

      .header {
        padding: 24px 20px;
        margin-bottom: 24px;
      }

      .header h1 {
        font-size: 22px;
      }

      .attendance-table {
        font-size: 12px;
      }

      .attendance-table th,
      .attendance-table td {
        padding: 10px 12px;
      }

      .notes-cell {
        max-width: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
      <div class="login-card">
        <div class="logo">
          <span class="logo-text">Como</span><span class="logo-text-gold">TV</span>
        </div>

        <h2 style="text-align: center; font-size: 20px; color: #0d1a38; margin-bottom: 24px; font-weight: 600;">
          Foglio Presenze
        </h2>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="nameSelect">Chi sei?</label>
            <select id="nameSelect" required>
              <option value="">Seleziona il tuo nome</option>
              <option value="Federico Caria">Federico Caria</option>
              <option value="Manolo Chirico">Manolo Chirico</option>
              <option value="Irene Crivellaro">Irene Crivellaro</option>
              <option value="Marco Ghironi">Marco Ghironi</option>
              <option value="Simone Indovino">Simone Indovino</option>
              <option value="Enzo Morreale">Enzo Morreale</option>
              <option value="Tommaso Murdocca">Tommaso Murdocca</option>
              <option value="Angelo Taglieri">Angelo Taglieri</option>
              <option value="Roberto Ugliono">Roberto Ugliono</option>
              <option value="Enrico Zambruno">Enrico Zambruno</option>
              <option value="Giuseppe Broggini">Giuseppe Broggini</option>
              <option value="Nicola Bondavalli">Nicola Bondavalli</option>
              <option value="Adele Stigliano">Adele Stigliano</option>
              <option value="Samuele Boscolo">Samuele Boscolo</option>
              <option value="Simone Solario">Simone Solario</option>
              <option value="Giuseppe Catalano">Giuseppe Catalano</option>
              <option value="Francesco Castiglione">Francesco Castiglione</option>
              <option value="Goffredo d'Onofrio">Goffredo d'Onofrio</option>
            </select>
          </div>

          <div class="form-group">
            <label for="passwordInput">Password</label>
            <input
              type="password"
              id="passwordInput"
              placeholder="Inserisci la tua password"
              required
              autocomplete="off"
            >
          </div>

          <button type="submit" class="login-button">Accedi</button>
        </form>
      </div>
    </div>

    <!-- Attendance Screen -->
    <div class="attendance-screen" id="attendanceScreen">
      <div class="header">
        <div class="header-content">
          <h1>Foglio Presenze</h1>
          <p>Como TV</p>
          <div class="header-user">
            Autenticato come
            <span class="user-badge" id="userBadge">Nome Utente</span>
          </div>
          <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
      </div>

      <div class="attendance-container">
        <table class="attendance-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Ora Inizio</th>
              <th>Ora Fine</th>
              <th>Ore</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="attendanceBody">
            <!-- Rows populated by JavaScript -->
          </tbody>
        </table>

        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-state-icon">📋</div>
          <p>Nessuna presenza registrata</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Password mapping - lato-client
    const users = {
      "Federico Caria": "CT-42hGMtHbBf!26",
      "Manolo Chirico": "CT-IjmGFvy6M6!26",
      "Irene Crivellaro": "CT-OF3JRNj2Hx!26",
      "Marco Ghironi": "CT-FRI9VsF4Bg!26",
      "Simone Indovino": "CT-8HF7w8SzSc!26",
      "Enzo Morreale": "CT-HMM0luYwZc!26",
      "Tommaso Murdocca": "CT-jViAI5iDOT!26",
      "Angelo Taglieri": "CT-hpbK4IdFlC!26",
      "Roberto Ugliono": "CT-7Is1SFhRms!26",
      "Enrico Zambruno": "CT-4m1eYIcgiT!26",
      "Giuseppe Broggini": "1zEAARxhOl",
      "Nicola Bondavalli": "m9rqpWfi47",
      "Adele Stigliano": "YPFElYhlD8",
      "Samuele Boscolo": "ntEu2360D3",
      "Simone Solario": "rt8z0xbGlU",
      "Giuseppe Catalano": "DKDgeTJx7I",
      "Francesco Castiglione": "6gsALKDrGl",
      "Goffredo d'Onofrio": "TwnCojiMqdjT8dgssv8DNZ"
    };

    // Sample attendance data - PLACEHOLDER
    // In production, these should be loaded from a backend or database
    const attendanceData = {
      "Federico Caria": [
        { date: "2026-08-25", start: "08:00", end: "17:00", notes: "Turno regolare" },
        { date: "2026-08-24", start: "09:00", end: "18:00", notes: "Turno esteso" },
        { date: "2026-08-23", start: "08:00", end: "17:00", notes: "Turno regolare" }
      ],
      "Manolo Chirico": [
        { date: "2026-08-25", start: "08:00", end: "17:00", notes: "Riunione contenuti" },
        { date: "2026-08-24", start: "08:00", end: "17:00", notes: "" }
      ],
      "Goffredo d'Onofrio": [
        { date: "2026-08-25", start: "08:30", end: "18:00", notes: "Direzione" }
      ]
    };

    function handleLogin(event) {
      event.preventDefault();

      const name = document.getElementById("nameSelect").value;
      const password = document.getElementById("passwordInput").value;
      const errorMessage = document.getElementById("errorMessage");

      // Validate
      if (!name || !password) {
        showError("Inserisci nome e password");
        return;
      }

      // Check credentials
      if (users[name] && users[name] === password) {
        // Login successful
        sessionStorage.setItem("currentUser", name);
        showAttendance(name);
        errorMessage.classList.remove("show");
      } else {
        showError("Nome o password non validi");
      }
    }

    function showError(msg) {
      const errorMessage = document.getElementById("errorMessage");
      errorMessage.textContent = msg;
      errorMessage.classList.add("show");
      setTimeout(() => {
        errorMessage.classList.remove("show");
      }, 5000);
    }

    function showAttendance(name) {
      const loginScreen = document.getElementById("loginScreen");
      const attendanceScreen = document.getElementById("attendanceScreen");
      const userBadge = document.getElementById("userBadge");
      const attendanceBody = document.getElementById("attendanceBody");
      const emptyState = document.getElementById("emptyState");

      // Show/hide screens
      loginScreen.style.display = "none";
      attendanceScreen.classList.add("active");
      userBadge.textContent = name;

      // Populate attendance data
      const data = attendanceData[name] || [];
      attendanceBody.innerHTML = "";
      emptyState.style.display = data.length === 0 ? "block" : "none";

      if (data.length > 0) {
        data.forEach(record => {
          const start = new Date(`2000-01-01T${record.start}:00`);
          const end = new Date(`2000-01-01T${record.end}:00`);
          const hours = ((end - start) / (1000 * 60 * 60)).toFixed(2);

          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${formatDate(record.date)}</strong></td>
            <td class="time-cell">${record.start}</td>
            <td class="time-cell">${record.end}</td>
            <td class="time-cell"><strong>${hours}h</strong></td>
            <td class="notes-cell">${record.notes || "—"}</td>
          `;
          attendanceBody.appendChild(row);
        });
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("currentUser");
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("attendanceScreen").classList.remove("active");
      document.getElementById("nameSelect").value = "";
      document.getElementById("passwordInput").value = "";
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + "T00:00:00");
      const options = { weekday: "short", year: "2-digit", month: "2-digit", day: "2-digit" };
      return date.toLocaleDateString("it-IT", options);
    }

    // Check if user is already logged in
    window.addEventListener("load", () => {
      const currentUser = sessionStorage.getItem("currentUser");
      if (currentUser && users[currentUser]) {
        showAttendance(currentUser);
      }
    });
  </script>
</body>
</html>
