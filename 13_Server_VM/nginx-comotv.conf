# nginx davanti al ponte Como TV.
# Serve per stare sulla porta 80 (e 443 con certificato) e per reggere
# senza problemi le connessioni in tempo reale dei 7 vMix.
#
# Installazione:  cp nginx-comotv.conf /etc/nginx/sites-available/comotv
#                 ln -sf /etc/nginx/sites-available/comotv /etc/nginx/sites-enabled/comotv
#                 rm -f /etc/nginx/sites-enabled/default
#                 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # metti qui il dominio quando ce l'hai (es. grafiche.comotv.it);
    # con il solo indirizzo IP va bene lasciare _
    server_name _;

    # i file delle grafiche sono piccoli, ma le clip no
    client_max_body_size 64m;

    # ── verifica del certificato (Let's Encrypt) ──
    # Deve restare PRIMA delle altre regole e non passare dal ponte: il
    # server delle pagine rifiuta i percorsi che iniziano per punto (per
    # non servire .git e simili), quindi la verifica fallirebbe. Qui il
    # file lo serve nginx dal disco.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ── flusso in tempo reale: niente accumulo, connessione lunga ──
    location /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ── comandi e letture del ponte ──
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── pagine, font, immagini ──
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    access_log /var/log/nginx/comotv-access.log;
    error_log  /var/log/nginx/comotv-error.log;
}
