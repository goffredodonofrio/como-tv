<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Como TV</title>
<style>
/* UXP non e' un browser: regge una fetta di CSS, non tutto. Niente grid,
   niente variabili custom, e "background" va scritto "background-color".
   ── La lezione della versione prima: se il pannello non scorre, tutto
   quello che sta sotto la piega non e' solo brutto, e' IRRAGGIUNGIBILE —
   i campi non si scrivono perche' non ci si arriva. Quindi la pagina e'
   ferma e scorre un contenitore, che e' l'unico modo che UXP gradisce.
   ── Le misure sono grandi apposta: qui si incolla di fretta, e un campo
   in cui non vedi cosa e' finito dentro e' il modo piu' facile di mandare
   in onda un refuso, cioe' proprio la cosa che il pannello deve impedire. */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Adobe Clean", sans-serif;
  font-size: 15px; line-height: 1.5;
  background-color: #0A0F24; color: #F5F1E6;
}
#scorri { height: 100%; overflow-y: auto; padding: 18px 16px 28px; }

/* ── testata ─────────────────────────────────────────────────────── */
.testata { display: flex; align-items: baseline; margin-bottom: 20px; }
.marchio {
  font-size: 17px; font-weight: bold; letter-spacing: .14em;
  text-transform: uppercase; color: #C9A24B;
}
.testata .coda { margin-left: 10px; font-size: 13px; color: #8A8B96; }

/* ── i due passi: un'etichetta oro, non una scritta sciolta ──────── */
.passo {
  display: inline-flex; align-items: center;
  font-size: 12px; font-weight: bold; letter-spacing: .12em;
  text-transform: uppercase; color: #C9A24B;
  padding: 7px 14px 7px 8px; margin-bottom: 12px;
  border-radius: 16px;
  background-color: #1B2445; border: 1px solid #2F3A64;
}
.passo .num {
  display: inline-block; width: 20px; height: 20px; margin-right: 9px;
  border-radius: 10px; background-color: #C9A24B; color: #0A0F24;
  font-size: 12px; line-height: 20px; text-align: center; letter-spacing: 0;
}

/* ── campi ───────────────────────────────────────────────────────── */
/* Le etichette in verde acqua, come le barre dati delle altre pagine:
   distinguono a colpo d'occhio "quello che scrivi tu" da "quello che ti
   dice il pannello", che sta nella scheda grigia. */
/* L'etichetta e il conteggio stanno sulla stessa riga: il numero serve
   mentre si scrive, non dopo, e in fondo alla pagina non lo guarderebbe
   nessuno. */
.etichetta {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 18px 0 7px;
}
label {
  font-size: 12px; font-weight: bold;
  letter-spacing: .06em; text-transform: uppercase;
  color: #6EE7D4;
}
.conta {
  font-size: 12px; font-variant-numeric: tabular-nums;
  color: #5C6484;
}
/* Sopra la misura non si blocca la scrittura — tagliare a meta' parola
   sarebbe peggio — ma si vede da lontano che si e' sforato. */
.conta.pieno { color: #E3C271; }
.conta.oltre { color: #FF6B6E; font-weight: bold; }
select {
  width: 100%; font-family: inherit; font-size: 15px;
  padding: 13px 12px; border-radius: 6px;
  background-color: #16203F; color: #F5F1E6;
  border: 1px solid #2F3A64;
}
select:focus { border-color: #C9A24B; }

/* I campi di testo NON sono <input>: dentro UXP un input HTML si disegna
   ma non si scrive. Sono sp-textfield, componenti di Spectrum, e hanno un
   aspetto loro che non si veste da fuori — si puo' chiedere la taglia
   grande e lo spazio intorno, il resto lo decide Adobe. */
sp-textfield { display: block; width: 100%; margin-bottom: 2px; }

/* ── la scheda della partita ─────────────────────────────────────── */
.scheda {
  margin-top: 14px; padding: 12px 14px; border-radius: 6px;
  background-color: #121A36; border: 1px solid #232C52;
}
.riga { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
.riga span { font-size: 13px; color: #8A8B96; margin-right: 14px; }
.riga b { font-size: 14px; text-align: right; word-break: break-word; }

/* ── pulsanti ────────────────────────────────────────────────────── */
button {
  font-family: inherit; font-size: 13px; font-weight: bold;
  padding: 11px 12px; border-radius: 7px; cursor: pointer;
  background-color: #16203F; color: #F5F1E6; border: 1px solid #2F3A64;
}
button:hover { border-color: #C9A24B; }
button:disabled { opacity: .4; cursor: default; }
button:disabled:hover { border-color: #2F3A64; }

/* Il pulsante che fa la cosa: uno solo, grande, e si vede da lontano
   che e' quello. Gli altri sono attrezzi e devono sembrarlo. */
/* Il pulsante che fa la cosa. Tondo e oro: in una colonna di rettangoli
   scuri si trova senza cercarlo, ed e' l'unico che cambia qualcosa nel
   progetto — gli altri leggono o mandano. */
#btnMask {
  width: 100%; margin-top: 28px; padding: 21px 14px;
  font-size: 16px; font-weight: bold; letter-spacing: .14em;
  border-radius: 999px;
  background-color: #C9A24B; color: #0A0F24;
  border: 2px solid #E7CB8A;
}
#btnMask:hover { background-color: #DEB962; border-color: #F6E4B8; }
#btnMask:active { background-color: #B68E3C; }
#btnMask:disabled {
  background-color: #3B3729; border-color: #4A4433; color: #8A8B96;
}

/* Il referto e' un "manda": blu, come in tutte le altre pagine. */
#btnCopia {
  width: 100%; background-color: #14375C; border-color: #2F6EA8; color: #CFE6FB;
}
#btnCopia:hover { background-color: #1A4676; border-color: #4F94D0; }

.chiosa { margin-top: 10px; font-size: 13px; color: #8A8B96; }

/* ── attrezzi: in fondo, su una riga sola per non rubare spazio ──── */
.attrezzi { margin-top: 30px; padding-top: 16px; border-top: 1px solid #232C52; }
.fila { display: flex; }
.fila button { flex: 1; font-size: 12px; font-weight: normal; padding: 9px 6px; }
.fila button + button { margin-left: 7px; }
#diario {
  margin-top: 11px; padding: 10px; height: 150px; overflow: auto;
  background-color: #070B18; border: 1px solid #232C52; border-radius: 6px;
  font-family: monospace; font-size: 12px; line-height: 1.55;
  white-space: pre-wrap; color: #9FB0D0;
}
.si { color: #4FCB8B; } .no { color: #FF6B6E; } .forse { color: #E3C271; }
</style>
</head>
<body>
<div id="scorri">

<div class="testata">
  <span class="marchio">Como TV</span>
  <span class="coda">maschere story</span>
</div>

<div class="passo"><span class="num">1</span>Scegli la partita</div>
<select id="partita"><option>Carico&hellip;</option></select>

<div class="scheda">
  <div class="riga"><span>Competizione</span><b id="vComp">&mdash;</b></div>
  <div class="riga"><span>Data</span><b id="vData">&mdash;</b></div>
  <div class="riga"><span>Squadre</span><b id="vSquadre">&mdash;</b></div>
  <div class="riga"><span>Maschera</span><b id="vMask">&mdash;</b></div>
  <div class="riga"><span>Nome sequenza</span><b id="vNome">&mdash;</b></div>
</div>

<div class="passo" style="margin-top:28px"><span class="num">2</span>Scrivi i testi</div>

<div class="etichetta"><label for="t1">Titolo &mdash; prima riga</label><span class="conta" id="conta-t1">0/14</span></div>
<sp-textfield id="t1" placeholder="incolla dal giornalista" style="width:100%"></sp-textfield>

<div class="etichetta"><label for="t2">Titolo &mdash; seconda riga</label><span class="conta" id="conta-t2">0/14</span></div>
<sp-textfield id="t2" placeholder="vuoto se sta su una riga sola" style="width:100%"></sp-textfield>

<div class="etichetta"><label for="sott">Sottotitolo</label><span class="conta" id="conta-sott">0/56</span></div>
<sp-textfield id="sott" placeholder="incolla dal giornalista" style="width:100%"></sp-textfield>

<button type="button" id="btnMask" disabled>METTI LA MASCHERA</button>
<div class="chiosa">Sbagliato a incollare? Correggi qui sopra e ripremi:
  rif&agrave; tutto da capo, non aggiunge niente.</div>

<div class="attrezzi">
  <div class="passo" style="margin-bottom:9px">Attrezzi</div>
  <button type="button" id="btnCopia">Mandami il referto</button>
  <div id="diario">Scegli una partita e premi <b>METTI LA MASCHERA</b>.</div>
</div>

</div>
<script src="maschere.js"></script>
<script src="pannello.js"></script>
</body>
</html>
