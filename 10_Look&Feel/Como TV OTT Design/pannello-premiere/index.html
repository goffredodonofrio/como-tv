<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Como TV</title>
<style>
/* UXP non e' un browser: regge una fetta di CSS, non tutto. Niente grid,
   niente variabili custom, niente pseudo-elementi. Solo flex e colori. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Adobe Clean", sans-serif;
  font-size: 12px; line-height: 1.45;
  background: #0A0F24; color: #F5F1E6;
  padding: 12px;
}
h1 {
  font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
  color: #C9A24B; margin-bottom: 2px;
}
.sotto { font-size: 11px; color: #8A8B96; margin-bottom: 14px; }

label { display: block; font-size: 11px; color: #8A8B96; margin: 12px 0 4px; }
select, input {
  width: 100%; font-family: inherit; font-size: 12px; padding: 6px 7px;
  background: #141B38; color: #F5F1E6;
  border: 1px solid #2A3358; border-radius: 4px;
}
button {
  width: 100%; font-family: inherit; font-size: 12px; font-weight: bold;
  padding: 8px 10px; margin-top: 8px; border-radius: 4px; cursor: pointer;
  background: #141B38; color: #F5F1E6; border: 1px solid #2A3358;
}
button:hover { border-color: #C9A24B; }
button.oro { background: #C9A24B; color: #0A0F24; border-color: #C9A24B; }
button:disabled { opacity: .45; cursor: default; }

.scheda {
  margin-top: 12px; padding: 9px 10px; border-radius: 4px;
  background: #141B38; border: 1px solid #2A3358;
}
.riga { display: flex; justify-content: space-between; padding: 2px 0; }
.riga span { color: #8A8B96; }
.riga b { color: #F5F1E6; text-align: right; }

.titoletto {
  margin: 18px 0 0; padding-top: 12px; border-top: 1px solid #2A3358;
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8A8B96;
}
#diario {
  margin-top: 8px; padding: 8px; height: 240px; overflow: auto;
  background: #070B18; border: 1px solid #2A3358; border-radius: 4px;
  font-family: monospace; font-size: 10.5px; white-space: pre-wrap;
  color: #9FB0D0;
}
.si { color: #4FCB8B; } .no { color: #FF6B6E; } .forse { color: #E3C271; }
</style>
</head>
<body>

<h1>Como TV</h1>
<div class="sotto">Grafiche story &mdash; scelta della partita</div>

<label for="partita">Partita</label>
<select id="partita"><option>Carico&hellip;</option></select>

<div class="scheda">
  <div class="riga"><span>Competizione</span><b id="vComp">&mdash;</b></div>
  <div class="riga"><span>Data</span><b id="vData">&mdash;</b></div>
  <div class="riga"><span>Squadre</span><b id="vSquadre">&mdash;</b></div>
</div>

<button type="button" id="btnScrivi" class="oro" disabled>Scrivi la competizione</button>

<div class="titoletto">Prova &mdash; che cosa vede il pannello</div>
<button type="button" id="btnLeggi">Leggi la timeline</button>
<div id="diario">Premi <b>Leggi la timeline</b> con la sequenza aperta.</div>

<script src="pannello.js"></script>
</body>
</html>
