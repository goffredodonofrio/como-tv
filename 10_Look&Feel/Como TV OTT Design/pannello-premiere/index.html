<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Como TV</title>
<style>
/* UXP non e' un browser: regge una fetta di CSS, non tutto. Niente grid,
   niente variabili custom, e "background" va scritto "background-color".
   Le misure sono generose apposta: questo pannello si usa incollando testi
   di fretta, non leggendolo con calma, e un campo stretto in cui non si
   vede cosa si e' incollato e' il modo piu' facile di mandare in onda un
   refuso — cioe' esattamente la cosa che il pannello dovrebbe impedire. */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Adobe Clean", sans-serif;
  font-size: 14px; line-height: 1.5;
  background-color: #0A0F24; color: #F5F1E6;
  padding: 18px 16px 26px;
}

/* ── testata ─────────────────────────────────────────────────────── */
.testata { display: flex; align-items: baseline; margin-bottom: 22px; }
.marchio {
  font-size: 16px; font-weight: bold; letter-spacing: .14em;
  text-transform: uppercase; color: #C9A24B;
}
.testata .coda { margin-left: 10px; font-size: 12px; color: #8A8B96; }

/* ── i due passi ─────────────────────────────────────────────────── */
.passo {
  display: flex; align-items: center;
  font-size: 11px; font-weight: bold; letter-spacing: .12em;
  text-transform: uppercase; color: #8A8B96;
  margin-bottom: 10px;
}
.passo .num {
  display: inline-block; width: 21px; height: 21px; margin-right: 9px;
  border-radius: 11px; background-color: #1B2445; color: #C9A24B;
  font-size: 11px; line-height: 21px; text-align: center; letter-spacing: 0;
}

/* ── campi ───────────────────────────────────────────────────────── */
label { display: block; font-size: 12px; color: #A9AABA; margin: 16px 0 6px; }
select, input {
  width: 100%; font-family: inherit;
  padding: 12px; border-radius: 6px;
  background-color: #141B38; color: #F5F1E6;
  border: 1px solid #2A3358;
}
select { font-size: 14px; }
input { font-size: 16px; }
select:focus, input:focus { border-color: #C9A24B; outline: none; }

/* ── la scheda della partita ─────────────────────────────────────── */
.scheda {
  margin-top: 14px; padding: 12px 14px; border-radius: 6px;
  background-color: #121A36; border: 1px solid #232C52;
}
.riga { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
.riga span { font-size: 12px; color: #8A8B96; margin-right: 14px; }
.riga b { font-size: 13px; text-align: right; word-break: break-word; }

/* ── il pulsante ─────────────────────────────────────────────────── */
button {
  width: 100%; font-family: inherit; font-size: 13px; font-weight: bold;
  padding: 11px 12px; margin-top: 10px; border-radius: 6px; cursor: pointer;
  background-color: #141B38; color: #F5F1E6; border: 1px solid #2A3358;
}
button:hover { border-color: #C9A24B; }
button:disabled { opacity: .4; cursor: default; }
button:disabled:hover { border-color: #2A3358; }

#btnMask {
  margin-top: 24px; padding: 18px 12px;
  font-size: 15px; letter-spacing: .1em;
  background-color: #C9A24B; color: #0A0F24; border-color: #C9A24B;
}
#btnMask:hover { background-color: #D8B463; border-color: #D8B463; }
#btnMask:disabled { background-color: #443E30; border-color: #443E30; color: #8A8B96; }

.chiosa { margin-top: 10px; font-size: 12px; color: #8A8B96; }

/* ── attrezzi: in fondo e in sordina ─────────────────────────────── */
.attrezzi { margin-top: 32px; padding-top: 16px; border-top: 1px solid #232C52; }
.attrezzi button { font-size: 12px; font-weight: normal; padding: 9px 10px; }
#diario {
  margin-top: 12px; padding: 10px; height: 210px; overflow: auto;
  background-color: #070B18; border: 1px solid #232C52; border-radius: 6px;
  font-family: monospace; font-size: 11.5px; line-height: 1.55;
  white-space: pre-wrap; color: #9FB0D0;
}
.si { color: #4FCB8B; } .no { color: #FF6B6E; } .forse { color: #E3C271; }
</style>
</head>
<body>

<div class="testata">
  <span class="marchio">Como TV</span>
  <span class="coda">maschere story</span>
</div>

<div class="passo"><span class="num">1</span>Scegli la partita</div>
<select id="partita"><option>Carico&hellip;</option></select>

<div class="scheda">
  <div class="riga"><span>Competizione</span><b id="vComp">&mdash;</b></div>
  <div class="riga"><span>Data</span><b id="vData">&mdash;</b></div>
  <div class="riga"><span>Squadre</span><b id="vSquadre">&mdash;</b></div>
  <div class="riga"><span>Maschera</span><b id="vMask">&mdash;</b></div>
  <div class="riga"><span>Nome sequenza</span><b id="vNome">&mdash;</b></div>
</div>

<div class="passo" style="margin-top:28px"><span class="num">2</span>Scrivi i testi</div>

<label for="t1">Titolo &mdash; prima riga</label>
<input type="text" id="t1" placeholder="incolla dal giornalista">

<label for="t2">Titolo &mdash; seconda riga</label>
<input type="text" id="t2" placeholder="vuoto se sta su una riga sola">

<label for="sott">Sottotitolo</label>
<input type="text" id="sott" placeholder="incolla dal giornalista">

<button type="button" id="btnMask" disabled>METTI LA MASCHERA</button>
<div class="chiosa">Sbagliato a incollare? Correggi qui sopra e ripremi:
  rif&agrave; tutto da capo, non aggiunge niente.</div>

<div class="attrezzi">
  <div class="passo" style="margin-bottom:4px">Attrezzi</div>
  <button type="button" id="btnLeggi">Leggi la timeline</button>
  <button type="button" id="btnPng">Prova: titoli come PNG</button>
  <button type="button" id="btnCopia">Mandami il referto</button>
  <div id="diario">Scegli una partita e premi <b>METTI LA MASCHERA</b>.</div>
</div>

<script src="maschere.js"></script>
<script src="pannello.js"></script>
</body>
</html>
