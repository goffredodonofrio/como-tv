<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Como TV — OTT Design System</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0f24;color:#f5f1e6;min-height:100vh;}

    /* NAV */
    .nav{min-height:72px;position:sticky;top:0;z-index:200;background:#0d1a38;border-bottom:2px solid #B8962E;display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
    .nav-logo{padding:8px 18px 8px 0;border-right:1px solid rgba(255,255,255,0.1);margin-right:20px;display:flex;align-items:center;}
    .nav-logo svg{width:48px;height:48px;display:block;}
    .nav-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);}
    .nav-back{margin-left:auto;}
    .nav-back a{text-decoration:none;}
    .nav-back button{background:#0d1a38;border:none;color:#B8962E;padding:8px 16px;font-size:12px;font-weight:700;border-radius:6px;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;transition:background 0.15s;}
    .nav-back button:hover{background:#1e3260;}

    /* CONTENT */
    .wrapper{display:flex;flex-direction:column;min-height:100vh;}
    .content{flex:1;width:100%;overflow:hidden;}
    iframe{width:100%;height:calc(100vh - 72px);border:none;display:block;}
  </style>
</head>
<body>

<div class="wrapper">
  <!-- NAV -->
  <nav class="nav">
    <div class="nav-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="200" fill="#152347"/>
        <text x="100" y="110" font-size="80" font-weight="bold" fill="#B8962E" text-anchor="middle" font-family="Arial">C</text>
      </svg>
    </div>
    <span class="nav-title">OTT Design System</span>
    <div class="nav-back">
      <a href="../../index.html">
        <button>← Indice</button>
      </a>
    </div>
  </nav>

  <!-- DESIGN SHOWCASE -->
  <div class="content">
    <iframe src="showcase.html" title="Como TV OTT Design Showcase"></iframe>
  </div>
</div>

</body>
</html>
