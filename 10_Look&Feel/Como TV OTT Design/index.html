<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Como TV — OTT Design System</title>
  <style>
    @font-face{font-family:'Mazzard';src:url('../../assets/fonts/MazzardM-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
    @font-face{font-family:'DM Sans';src:url('../../assets/fonts/DMSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      color-scheme:dark;
      --navy-900:#0A0F24;--navy-800:#141B3C;
      --gold:#C9A24B;--gold-bright:#E3C271;
      --ivory:#F5F1E6;--ivory-dim:#D8D2C2;
      --line-2:rgba(245,241,230,.08);
    }
    body{font-family:'DM Sans',system-ui,sans-serif;font-weight:500;background:#0A0F24;color:var(--ivory);min-height:100vh;}

    /* NAV */
    .nav{min-height:64px;position:sticky;top:0;z-index:200;background:rgba(10,15,36,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;padding:0 24px;}
    .nav-logo{padding:8px 18px 8px 0;border-right:1px solid rgba(245,241,230,.12);margin-right:20px;display:flex;align-items:center;}
    .nav-logo svg{width:34px;height:34px;display:block;border-radius:6px;}
    .nav-title{font-family:'Mazzard',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:rgba(245,241,230,.45);}
    .nav-back{margin-left:auto;}
    .nav-back a{text-decoration:none;}
    .nav-back button{background:rgba(255,255,255,.05);border:1px solid rgba(245,241,230,.12);color:var(--ivory-dim);padding:9px 18px;font-family:'Mazzard',system-ui,sans-serif;font-size:10px;font-weight:700;border-radius:999px;cursor:pointer;text-transform:uppercase;letter-spacing:.18em;transition:background 0.15s;}
    .nav-back button:hover{background:rgba(255,255,255,.09);}

    /* CONTENT */
    .wrapper{display:flex;flex-direction:column;min-height:100vh;}
    .content{flex:1;width:100%;overflow:hidden;}
    iframe{width:100%;height:calc(100vh - 64px);border:none;display:block;}
  </style>
</head>
<body>

<div class="wrapper">
  <!-- NAV -->
  <nav class="nav">
    <div class="nav-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="200" fill="#141B3C"/>
        <text x="100" y="110" font-size="80" font-weight="bold" fill="#C9A24B" text-anchor="middle" font-family="Arial">C</text>
      </svg>
    </div>
    <span class="nav-title">OTT Design System</span>
    <div class="nav-back">
      <a href="../../index.html">
        <button>← Indice</button>
      </a>
    </div>
  </nav>

  <!-- DESIGN SHOWCASE -->
  <div class="content">
    <iframe src="showcase.html" title="Como TV OTT Design Showcase"></iframe>
  </div>
</div>

</body>
</html>
